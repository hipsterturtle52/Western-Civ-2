of Lords","direct British crown rule","Indian independence","the Opium War","French control of India"],"why":["The monarchy continued.","The Raj began in 1858.","India became independent in 1947.","The Opium War concerned China and was earlier.","France had lost India in the 1700s."],"answer":1},"u9q15":{"id":"u9q15","unit":9,"diff":"m","pool":"exam2","stem":"<p>King Leopold II's Congo Free State became notorious for<\/p>","options":["being the only African state never colonized by Europeans","abolishing slavery throughout Africa","its peaceful self-government by Africans","forced labor for rubber","defeating Italy at Adwa"],"why":["The Congo was colonized.","The regime used forced labor.","Leopold ran it as a personal possession.","Millions died, and outrage forced Belgium to take over in 1908.","That was Ethiopia."],"answer":3},"u9q16":{"id":"u9q16","unit":9,"diff":"m","pool":"exam2","stem":"<p>Japan's response to Western pressure after 1868 differed from China's in that Japan<\/p>","options":["was divided into European spheres of influence like China","refused all contact with the West","abolished its emperor","became a British colony","modernized on Western lines"],"why":["That was China.","Meiji Japan embraced Western technology.","The Meiji Restoration strengthened the emperor's position.","Japan was never colonized.","Meiji Japan defeated China (1895) and Russia (1905)."],"answer":4},"u9q17":{"id":"u9q17","unit":9,"diff":"m","pool":"exam1","stem":"<p>Which development most reduced urban death rates in the late nineteenth century?<\/p>","options":["The invention of the automobile","Mass emigration to the Americas","The growth of Impressionist art in the cities","Sewers and clean water","Higher protective tariffs"],"why":["Cars did not improve health.","Emigration did not change urban death rates.","Art did not affect mortality.","Sanitation and medicine cut deaths from cholera and typhoid.","Tariffs had no direct effect on mortality."],"answer":3},"u9q18":{"id":"u9q18","unit":9,"diff":"m","pool":"quiz","stem":"<p>The Fashoda Crisis of 1898 was a confrontation between<\/p>","options":["Belgium and Germany in the Congo","Britain and France in the Sudan","Britain and the Boers in South Africa","Italy and Ethiopia at Adwa","Germany and Russia in China"],"why":["Fashoda involved Britain and France.","France backed down, clearing the way for the Entente Cordiale.","That was the Boer War.","That was a battle in 1896.","Fashoda was in Africa."],"answer":1},"u9q19":{"id":"u9q19","unit":9,"diff":"m","pool":"exam2","stem":"<p>Which statement best describes European emigration between 1815 and 1914?<\/p>","options":["Emigration was mainly from Britain to Russia","Most emigrants went to Africa","Few Europeans emigrated because of strict laws","Emigrants were mostly wealthy aristocrats","Tens of millions left, mostly for the Americas"],"why":["That is not the pattern.","Most went to the Americas.","Emigration was massive.","Most were poor peasants and workers.","The United States received the largest share."],"answer":4},"u9q20":{"id":"u9q20","unit":9,"diff":"m","pool":"quiz","stem":"<blockquote>\"In the life of the mind, much that we think we choose is in fact determined by desires we do not know we have; the conscious self is only the tip of the iceberg.\"<\/blockquote><p>This passage best reflects the ideas of<\/p>","options":["John Locke","Adam Smith","Sigmund Freud","Herbert Spencer","Auguste Comte"],"why":["Locke's mind is a blank slate shaped by experience.","Smith wrote about markets.","Freud emphasized the power of the unconscious.","Spencer applied evolution to society.","Comte's positivism stressed scientific knowledge."],"answer":2},"u9q21":{"id":"u9q21","unit":9,"diff":"m","pool":"exam1","stem":"<p>The Ferry laws in France in the 1880s<\/p>","options":["banned women from attending school","abolished universal male suffrage","created French colonies in North and West Africa","made primary schooling free and secular","restored Catholic control of education"],"why":["They expanded schooling for girls and boys.","They concerned education.","Jules Ferry did promote empire, but the Ferry laws were school laws.","Republicans wanted loyal, literate citizens free from Church influence.","They removed religious instruction from public schools."],"answer":3},"u9q22":{"id":"u9q22","unit":9,"diff":"m","pool":"quiz","stem":"<p>Which statement about the Second Industrial Revolution is most accurate?<\/p>","options":["It began in the 1700s","It relied more on science","It ended the use of steel","It made Britain the only industrial power in the world","It was centered on the cotton industry"],"why":["It began around 1870.","Science-based industry was a key difference from the first industrial revolution.","Steel was central to it.","Germany and the U.S. caught up and overtook Britain.","That was the first industrial revolution."],"answer":1},"u9q23":{"id":"u9q23","unit":9,"diff":"m","pool":"exam1","stem":"<p>After the Long Depression began in 1873, most continental governments responded by<\/p>","options":["abolishing all tariffs","nationalizing all industry","raising protective tariffs","abandoning colonies","adopting socialism"],"why":["Britain alone stayed with free trade.","This did not occur.","Germany adopted tariffs in 1879; others followed.","Colonial expansion accelerated.","Governments were not socialist."],"answer":2},"u9q24":{"id":"u9q24","unit":9,"diff":"m","pool":"exam1","stem":"<p>Which pairing of artist and movement is correct?<\/p>","options":["Vincent van Gogh – Romanticism","Pablo Picasso – Cubism","Claude Monet – Realism","Gustave Courbet – Cubism","Eugène Delacroix – Impressionism"],"why":["Van Gogh was a Post-Impressionist.","Picasso and Braque invented Cubism around 1907–08.","Monet was an Impressionist.","Courbet was a Realist.","Delacroix was a Romantic."],"answer":1},"u9q25":{"id":"u9q25","unit":9,"diff":"m","pool":"diag","stem":"<p>The Boxer Rebellion (1900) was<\/p>","options":["an Ethiopian victory over Italy","a revolt of Indian soldiers against the British","an anti-foreign rising in China","a Japanese revolution that restored the emperor's power","a British war against Dutch settlers"],"why":["That was Adwa in 1896.","That was the 1857 rebellion.","Eight powers, including Japan and the U.S., crushed it.","That was the Meiji Restoration of 1868.","That was the Boer War."],"answer":2},"u9q26":{"id":"u9q26","unit":9,"diff":"m","pool":"quiz","stem":"<p>Albert Einstein's theory of relativity (1905) contributed to a sense that<\/p>","options":["God is dead","Newton's physics was incomplete","evolution was false","germs cause disease","the unconscious mind controls most human behavior"],"why":["That is Nietzsche.","Relativity undermined old certainties about the physical world.","Relativity concerns physics, not biology.","That is Pasteur.","That is Freud."],"answer":1},"u9q27":{"id":"u9q27","unit":9,"diff":"m","pool":"quiz","stem":"<p>Which of the following was a goal of the women's suffrage movement before 1914?<\/p>","options":["Ending compulsory education for girls","Abolishing the right of men to vote","Restoring absolute monarchy","Expanding colonial empires","Winning the vote"],"why":["Feminists supported education for women.","They sought equal voting rights.","The movement sought democratic rights.","Suffrage was a domestic political cause.","Suffragists and suffragettes campaigned for the parliamentary vote."],"answer":4},"u9q28":{"id":"u9q28","unit":9,"diff":"h","pool":"quiz","stem":"<p>Which statement best explains how mass politics changed European nationalism after 1870?<\/p>","options":["Mass press and parties spread a harsher nationalism","Nationalism became exclusively associated with socialism","Mass politics ended all the imperial rivalries among the powers","Nationalism disappeared as socialism took its place","Nationalism became limited to aristocrats"],"why":["Nationalism shifted from liberal causes to right-wing mass movements.","The radical right embraced nationalism most aggressively.","Rivalries intensified.","Nationalism grew stronger.","It became a mass phenomenon."],"answer":0},"u9q29":{"id":"u9q29","unit":9,"diff":"h","pool":"exam2","stem":"<p>A historian argues that the New Imperialism was driven more by European rivalries than by economic profit. Which evidence best supports this?<\/p>","options":["British investors put most of their foreign capital into African colonies","Many colonies cost more than they earned","The Congo produced large rubber profits for Leopold II","Hobson argued that imperialism served capitalists","Africa was Europe's largest trading partner in 1900"],"why":["Most British capital went to the Americas and other regions.","Prestige and strategic competition, not profit alone, explain the Scramble.","That supports an economic motive.","That supports an economic interpretation.","Africa was a small share of European trade."],"answer":1},"u9q30":{"id":"u9q30","unit":9,"diff":"h","pool":"exam1","stem":"<p>Which statement best captures how Darwin, Freud and Nietzsche together challenged Enlightenment assumptions?<\/p>","options":["They argued for a return to mercantilism","They proved that reason governs all human behavior","They stressed forces other than reason","They supported the divine right of kings","They defended traditional religious authority and the churches"],"why":["None wrote on mercantilism.","They argued the opposite.","Each undermined faith in human rationality.","None of them addressed kingship this way.","All three challenged traditional religion."],"answer":2},"u9q31":{"id":"u9q31","unit":9,"diff":"h","pool":"exam1","stem":"<p>The Battle of Adwa and the Russo-Japanese War both demonstrated that<\/p>","options":["non-European peoples could defeat European armies","the Berlin Conference had ended imperial wars","European powers were invincible outside Europe","Britain dominated Africa and Asia without rivals","socialism had spread to Africa and Asia"],"why":["Ethiopia beat Italy (1896) and Japan beat Russia (1905).","Imperial wars continued.","These defeats showed otherwise.","Neither battle involved British defeat.","Neither was a socialist war."],"answer":0},"u9q32":{"id":"u9q32","unit":9,"diff":"h","pool":"exam2","stem":"<p>Which pairing correctly links a cause to its consequence?<\/p>","options":["The Boer War → Ethiopia's independence","Freud's theories of the unconscious → the Meiji Restoration","Fashoda → the Entente Cordiale","The Indian Rebellion → the Berlin Conference","The Opium War → the Irish potato famine"],"why":["Ethiopia's independence came from Adwa (1896).","Japan's reform predates Freud's work.","Resolving colonial disputes allowed Britain and France to align against Germany.","These are unrelated.","These are unrelated."],"answer":2},"u9q33":{"id":"u9q33","unit":9,"diff":"h","pool":"quiz","stem":"<p>Realist and naturalist writers such as Flaubert and Zola differed from Romantics in that they<\/p>","options":["wrote only about scientific discoveries","rejected the novel as a form","depicted ordinary life objectively","celebrated medieval knights and legends","opposed all depiction of the working class in fiction"],"why":["They wrote novels about society.","They were novelists.","Realism aimed at truthful observation of everyday society.","That is Romantic.","Zola wrote extensively about workers."],"answer":2},"u9q34":{"id":"u9q34","unit":9,"diff":"m","pool":"quiz","stem":"<p>The Opium War (1839–1842) between Britain and China resulted in<\/p>","options":["Japan colonizing China","China joining the Triple Entente","China ceding Hong Kong","Britain giving up the opium trade","China banning all British trade permanently"],"why":["Japan's expansion came later.","China was never part of it.","The Treaty of Nanking began the \"unequal treaties.\"","The trade continued.","China was forced to open up."],"answer":2},"u10q1":{"id":"u10q1","unit":10,"diff":"e","pool":"exam1","stem":"<p>The assassination that triggered the First World War took place in<\/p>","options":["Vienna","Sarajevo","Petrograd","Berlin","Belgrade"],"why":["Vienna was the Austrian capital, not the site of the assassination.","Franz Ferdinand was shot there on June 28, 1914.","Petrograd was Russia's capital.","The assassination was not in Germany.","Belgrade was Serbia's capital; the killing was in Bosnia."],"answer":1},"u10q2":{"id":"u10q2","unit":10,"diff":"e","pool":"quiz","stem":"<p>Britain declared war on Germany in August 1914 immediately after Germany<\/p>","options":["sank the Lusitania","annexed Bosnia-Herzegovina","sent the Zimmermann Telegram","invaded neutral Belgium","signed the Treaty of Brest-Litovsk"],"why":["That happened in 1915.","Austria-Hungary annexed Bosnia in 1908.","That was in 1917 and concerned the United States.","Britain had guaranteed Belgian neutrality since 1839.","That was in 1918."],"answer":3},"u10q3":{"id":"u10q3","unit":10,"diff":"e","pool":"exam1","stem":"<p>Trench warfare on the Western Front resulted mainly from<\/p>","options":["strong defensive weapons","the absence of railways","the use of airplanes to bomb cities behind the lines","a shortage of soldiers on both sides of the front","an agreement to avoid fighting"],"why":["Attacks across open ground were enormously costly.","Railways helped defenders bring reserves quickly.","Air power was a minor factor in creating stalemate.","Both sides had huge armies.","The trenches saw constant fighting."],"answer":0},"u10q4":{"id":"u10q4","unit":10,"diff":"e","pool":"quiz","stem":"<p>The United States entered the First World War in 1917 largely because of<\/p>","options":["the assassination of Archduke Franz Ferdinand","U-boat attacks and the Zimmermann Telegram","a surprise Japanese attack on Pearl Harbor","the Russian Revolution","the Treaty of Versailles"],"why":["That was in 1914, and the U.S. stayed neutral.","Both angered Americans in early 1917.","That was in 1941.","That made the war harder for the Allies but was not the U.S. reason.","That came after the war."],"answer":1},"u10q5":{"id":"u10q5","unit":10,"diff":"e","pool":"quiz","stem":"<p>Which leader led the Bolsheviks to power in Russia in 1917?<\/p>","options":["Vladimir Lenin","Karl Marx","Joseph Stalin","Alexander Kerensky","Nicholas II"],"why":["Lenin directed the October Revolution.","Marx died in 1883.","Stalin rose to power after Lenin's death in 1924.","Kerensky led the Provisional Government that the Bolsheviks overthrew.","The tsar abdicated in March 1917."],"answer":0},"u10q6":{"id":"u10q6","unit":10,"diff":"e","pool":"quiz","stem":"<p>Article 231 of the Treaty of Versailles<\/p>","options":["gave Germany new colonies in Africa and the Pacific","abolished the German army","assigned Germany war guilt","created the League of Nations","united Germany and Austria"],"why":["Germany lost all its colonies.","The army was limited to 100,000 men, not abolished.","The \"war guilt clause\" justified reparations.","The League's covenant was a separate part of the treaty.","Anschluss was forbidden."],"answer":2},"u10q7":{"id":"u10q7","unit":10,"diff":"e","pool":"quiz","stem":"<p>The slogan \"Peace, Land, and Bread\" was used by<\/p>","options":["Woodrow Wilson","the Chartists","Napoleon III","the Bolsheviks in 1917","the Provisional Government"],"why":["Wilson's program was the Fourteen Points.","Chartists campaigned for political reform in Britain.","The slogan is from the Russian Revolution.","It promised what war-weary Russians wanted most.","It kept fighting the war and delayed land reform."],"answer":3},"u10q8":{"id":"u10q8","unit":10,"diff":"e","pool":"exam2","stem":"<p>Which battle in 1914 stopped the German advance on Paris?<\/p>","options":["Verdun","Jutland","Tannenberg in East Prussia","Gallipoli on the Dardanelles","The Marne"],"why":["Verdun was fought in 1916.","Jutland was a naval battle in 1916.","Tannenberg was a German victory over Russia.","Gallipoli was an Allied campaign against the Ottomans.","The French and British halted the Schlieffen Plan."],"answer":4},"u10q9":{"id":"u10q9","unit":10,"diff":"e","pool":"exam2","stem":"<p>Which of the following became an independent state as a result of the First World War?<\/p>","options":["Bavaria","Prussia","Poland","Serbia","Sardinia"],"why":["Bavaria remained part of Germany.","Prussia remained part of Germany.","Poland was restored as a state in 1918.","Serbia was already independent and became part of Yugoslavia.","Sardinia had been part of Italy since 1861."],"answer":2},"u10q10":{"id":"u10q10","unit":10,"diff":"e","pool":"exam1","stem":"<p>Which country left the First World War by signing the Treaty of Brest-Litovsk?<\/p>","options":["Italy","France","Britain","The United States","Russia"],"why":["Italy fought on the Allied side to the end.","France fought until the armistice.","Britain fought until the armistice.","The U.S. entered in 1917 and fought until the armistice.","The Bolsheviks made peace with Germany in March 1918."],"answer":4},"u10q11":{"id":"u10q11","unit":10,"diff":"e","pool":"exam2","stem":"<p>Woodrow Wilson's Fourteen Points included<\/p>","options":["national self-determination and a League of Nations","the division of Germany into occupation zones","heavy reparations to be paid by Germany","a return to secret alliances","the restoration of the Russian tsar"],"why":["Wilson hoped these would create a lasting peace.","That happened after World War II.","Wilson opposed a punitive peace.","He called for open diplomacy.","The Fourteen Points did not call for this."],"answer":0},"u10q12":{"id":"u10q12","unit":10,"diff":"e","pool":"exam1","stem":"<p>The tsar who abdicated in March 1917 was<\/p>","options":["Nicholas I","Nicholas II","Alexander II","Alexander III","Peter the Great"],"why":["Nicholas I died in 1855.","His abdication ended Romanov rule.","Alexander II was assassinated in 1881.","Alexander III died in 1894.","Peter died in 1725."],"answer":1},"u10q13":{"id":"u10q13","unit":10,"diff":"e","pool":"exam2","stem":"<p>Which group made up the Central Powers in the First World War?<\/p>","options":["The United States, Britain and France","Austria-Hungary, Russia and Serbia","Germany, Austria-Hungary, the Ottoman Empire and Bulgaria","Germany, Italy and Japan","Britain, France, Russia and Italy"],"why":["These were Allied powers.","Russia and Serbia were Allies.","These four fought against the Allies.","That was the Axis of World War II.","These were Allied powers."],"answer":2},"u10q14":{"id":"u10q14","unit":10,"diff":"m","pool":"exam1","stem":"<p>The \"blank check\" of July 1914 refers to<\/p>","options":["U.S. reparations payments to Germany","Britain's loans to France","German backing for Austria-Hungary","Serbia's acceptance of every term of the Austrian ultimatum","Russia's promise to protect Belgium's neutrality"],"why":["There were no such payments.","It refers to German support for Austria.","It encouraged Austria to take a hard line.","Serbia accepted most but not all of it.","Britain guaranteed Belgium."],"answer":2},"u10q15":{"id":"u10q15","unit":10,"diff":"m","pool":"exam2","stem":"<p>Which event on the road to and through the First World War came FIRST?<\/p>","options":["The Battle of the Marne","The Bosnian annexation crisis","The Battle of the Somme","The sinking of the Lusitania","The Zimmermann Telegram"],"why":["The Battle of the Marne dates from 1914, later than 1908.","The Bosnian annexation crisis dates from 1908, the earliest of the five.","The Battle of the Somme dates from 1916, later than 1908.","The sinking of the Lusitania dates from 1915, later than 1908.","The Zimmermann Telegram dates from 1917, later than 1908."],"answer":1},"u10q16":{"id":"u10q16","unit":10,"diff":"m","pool":"quiz","stem":"<p>The Schlieffen Plan failed mainly because<\/p>","options":["Italy joined Germany and slowed the advance through France","Germany refused to invade Belgium","the United States entered the war in 1914 on France's side","the Allies held at the Marne","Britain stayed neutral"],"why":["Italy stayed neutral, then joined the Allies.","Germany did invade Belgium.","The U.S. entered in 1917.","Germany could not knock out France quickly.","Britain entered the war on August 4."],"answer":3},"u10q17":{"id":"u10q17","unit":10,"diff":"m","pool":"exam1","stem":"<p>Which statement best describes the home front in the First World War?<\/p>","options":["Women were barred from factory work","Governments directed economies and opinion","All nations balanced their budgets","Censorship was abolished","Civilian life continued with little interference from government"],"why":["Millions of women worked in factories.","The war mobilized whole societies.","Governments borrowed heavily and printed money.","Censorship expanded.","Governments intervened heavily."],"answer":1},"u10q18":{"id":"u10q18","unit":10,"diff":"m","pool":"exam1","stem":"<p>Which provision was part of the Treaty of Versailles?<\/p>","options":["Giving Alsace-Lorraine to Germany","Dividing Germany into four occupation zones","Allowing Germany to unite with Austria","Granting Germany a permanent seat on the League of Nations Council","Limiting Germany's army to 100,000 men"],"why":["Alsace-Lorraine went back to France.","That was in 1945.","Anschluss was forbidden.","Germany joined the League only in 1926.","These measures were meant to prevent future German aggression."],"answer":4},"u10q19":{"id":"u10q19","unit":10,"diff":"m","pool":"quiz","stem":"<p>The Provisional Government in Russia lost support in 1917 mainly because it<\/p>","options":["restored Nicholas II to the throne","carried out industrial five-year plans","abolished the soviets","kept fighting the war","signed a separate peace with Germany"],"why":["It was formed after his abdication.","Those began in 1928.","The soviets existed alongside it.","These failures opened the way for the Bolsheviks.","The Bolsheviks did that in 1918."],"answer":3},"u10q20":{"id":"u10q20","unit":10,"diff":"m","pool":"diag","stem":"<p>Lenin's view of the revolutionary party differed from the Mensheviks' in that Lenin<\/p>","options":["rejected Marxism entirely","supported the Provisional Government's policy of continuing the war","favored cooperation with the tsar","wanted a small vanguard party","wanted a mass party open to all workers with no central direction"],"why":["Both factions were Marxist.","Lenin opposed the war.","Lenin wanted to overthrow the tsar.","This was the cause of the 1903 split.","That was closer to the Menshevik view."],"answer":3},"u10q21":{"id":"u10q21","unit":10,"diff":"m","pool":"quiz","stem":"<p>Why did Lenin dissolve the Constituent Assembly in January 1918?<\/p>","options":["Trotsky had been elected its president","The Bolsheviks had won only about a quarter of the seats","The Assembly voted to restore the tsar","The Assembly had already completed a constitution","The Germans demanded it in the peace talks"],"why":["Trotsky did not lead the Assembly.","The Socialist Revolutionaries outpolled them.","It did not vote to restore the monarchy.","It met only once before being dispersed.","This was not a German demand."],"answer":1},"u10q22":{"id":"u10q22","unit":10,"diff":"m","pool":"exam2","stem":"<p>The New Economic Policy (1921) was<\/p>","options":["the forced collectivization of agriculture","Russia's withdrawal from the First World War","a partial return to private trade","a secret plan to restore the Romanovs to power","the first five-year plan"],"why":["That was Stalin's policy from 1929.","That was Brest-Litovsk.","Peasants could sell surplus grain, and the economy recovered.","The Bolsheviks killed the Romanovs in 1918.","That began in 1928."],"answer":2},"u10q23":{"id":"u10q23","unit":10,"diff":"m","pool":"exam1","stem":"<p>In the Russian Civil War, the Bolsheviks (Reds) defeated the Whites partly because<\/p>","options":["the Whites were led by Lenin","the Reds held the central heartland","the peasants wanted the landlords to return","Germany sent armies to help the Bolsheviks win","the Whites had no foreign support of any kind"],"why":["Lenin led the Reds.","The Whites were scattered and divided.","Peasants feared a White victory would bring landlords back.","Germany was defeated in 1918.","The Allies sent limited aid and troops to the Whites."],"answer":1},"u10q24":{"id":"u10q24","unit":10,"diff":"m","pool":"exam1","stem":"<blockquote>\"The Allied and Associated Governments affirm and Germany accepts the responsibility of Germany and her allies for causing all the loss and damage to which the Allied and Associated Governments and their nationals have been subjected as a consequence of the war.\"<\/blockquote><p>This passage provided the legal basis for<\/p>","options":["the Locarno Pact","reparations payments by Germany","the Treaty of Brest-Litovsk","the creation of the League of Nations","the Dawes Plan"],"why":["That came in 1925.","It is Article 231, the war guilt clause.","That was Germany's treaty with Russia in 1918.","The League's Covenant is a separate section.","The Dawes Plan (1924) restructured payments later."],"answer":1},"u10q25":{"id":"u10q25","unit":10,"diff":"m","pool":"quiz","stem":"<p>Which statement about women and the First World War is most accurate?<\/p>","options":["France gave women the vote in 1918","Women were excluded from all wartime work","Women served as front-line infantry in all the major armies","War work helped women win the vote in several countries","The war ended the women's suffrage movement"],"why":["French women voted only from 1944.","Millions worked in factories and services.","Front-line combat roles for women were rare.","British women over 30 voted from 1918; German women from 1919.","The movement achieved major victories."],"answer":3},"u10q26":{"id":"u10q26","unit":10,"diff":"m","pool":"exam2","stem":"<p>The Battle of the Somme (1916) is remembered for<\/p>","options":["huge losses and the first tanks","ending the war in a decisive Allied victory that autumn","the defeat of the Russian army","the capture of Paris by the German army","the first use of atomic weapons"],"why":["It symbolizes the futility of attrition.","The war continued for two more years.","The Somme was on the Western Front.","Paris was never captured in World War I.","Those were used in 1945."],"answer":0},"u10q27":{"id":"u10q27","unit":10,"diff":"m","pool":"quiz","stem":"<p>The Gallipoli campaign (1915–1916) was an Allied attempt to<\/p>","options":["invade Germany through neutral Denmark","break the British naval blockade of Germany","defend Belgium from the Schlieffen Plan","knock the Ottomans out of the war","capture Vienna"],"why":["There was no such campaign.","The blockade was Britain's own strategy.","That occurred in 1914 in the west.","The campaign failed with heavy losses.","Gallipoli was in the Ottoman Empire."],"answer":3},"u10q28":{"id":"u10q28","unit":10,"diff":"m","pool":"quiz","stem":"<p>The Paris Peace Conference's application of national self-determination is often criticized because<\/p>","options":["it was applied to the victors' empires as well","it gave all the former colonies immediate independence","it united all Germans in one state","it was applied unevenly","no new states were created"],"why":["It was applied mainly to defeated empires.","Colonies became mandates.","Germans in Austria and the Sudetenland were excluded.","Mixed populations made neat borders impossible.","Many new states were created."],"answer":3},"u10q29":{"id":"u10q29","unit":10,"diff":"m","pool":"exam2","stem":"<p>Which treaty dismantled Hungary's territory, leaving it with about one-third of its prewar lands?<\/p>","options":["The Treaty of Versailles","The Treaty of Trianon","The Treaty of Lausanne","The Treaty of Paris (1856)","The Treaty of Brest-Litovsk"],"why":["That treaty was with Germany.","Signed in 1920, it left millions of Hungarians outside Hungary.","That was with Turkey (1923).","That ended the Crimean War.","That was between Russia and the Central Powers."],"answer":1},"u10q30":{"id":"u10q30","unit":10,"diff":"m","pool":"exam2","stem":"<p>Which statement about the League of Nations is accurate?<\/p>","options":["The United States never joined it","It had its own powerful army and navy","It replaced the United Nations","It was created by the Congress of Vienna","Germany and the Soviet Union were both founding members"],"why":["This weakened the League from the start.","It had no armed forces.","The UN replaced the League in 1945.","It was created in 1919–20.","Germany joined in 1926 and the USSR in 1934."],"answer":0},"u10q31":{"id":"u10q31","unit":10,"diff":"m","pool":"exam2","stem":"<p>The Bolsheviks seized power in Petrograd in the October Revolution, which in the Western calendar took place in<\/p>","options":["March 1917","March 1918","January 1924","August 1914","November 1917"],"why":["That was the February Revolution.","That was Brest-Litovsk.","That was Lenin's death.","That was the start of the war.","Russia still used the Julian calendar; October 25 was November 7."],"answer":4},"u10q32":{"id":"u10q32","unit":10,"diff":"m","pool":"exam1","stem":"<p>War Communism during the Russian Civil War involved<\/p>","options":["seizing grain and industry","allowing peasants to sell their grain freely","returning factories to private owners","ending the secret police","inviting foreign investment in Russian industry"],"why":["It kept the Red Army supplied but caused economic collapse.","That was the NEP.","Industry was nationalized.","The Cheka expanded.","Foreign capital fled."],"answer":0},"u10q33":{"id":"u10q33","unit":10,"diff":"h","pool":"quiz","stem":"<p>Which development MOST directly turned a local Austro-Serbian conflict into a general European war in 1914?<\/p>","options":["The Zimmermann Telegram","Alliances and mobilization plans","The Russian Revolution","The Balfour Declaration on Palestine","The Treaty of Versailles"],"why":["That came in 1917.","Russia's mobilization and Germany's Schlieffen Plan quickly involved France and Britain.","That came in 1917.","That came in 1917 and concerned Palestine.","That came after the war."],"answer":1},"u10q34":{"id":"u10q34","unit":10,"diff":"h","pool":"quiz","stem":"<p>Fritz Fischer's interpretation of the origins of the First World War emphasized<\/p>","options":["German leaders' aggressive aims","Britain's desire to destroy Germany's navy","the war's purely accidental nature","the role of the United States in the July Crisis","Russia's sole responsibility"],"why":["Fischer's 1961 work reopened the war-guilt debate.","Fischer focused on German policy.","Fischer stressed intention, not accident.","The U.S. was neutral in 1914.","Fischer argued the opposite of German innocence."],"answer":0},"u10q35":{"id":"u10q35","unit":10,"diff":"h","pool":"exam2","stem":"<p>Which comparison of the February and October Revolutions of 1917 is most accurate?<\/p>","options":["February brought the Bolsheviks to power, and October removed them","Both ended Russian participation in the war immediately","Both restored the monarchy","February was spontaneous; October was planned","Both were led by Lenin"],"why":["The reverse is closer to the truth.","The Provisional Government kept fighting after February.","February ended the monarchy; October created a Bolshevik state.","The Bolsheviks organized October through the Military Revolutionary Committee.","Lenin was in exile during February."],"answer":3},"u10q36":{"id":"u10q36","unit":10,"diff":"h","pool":"exam2","stem":"<p>John Maynard Keynes criticized the Treaty of Versailles mainly because he believed<\/p>","options":["the treaty was too lenient toward Germany","reparations would wreck Europe's economy","the League of Nations should have been abolished","the United States should have paid reparations to Germany","Germany should have kept its colonies"],"why":["Keynes thought it was too harsh economically.","The Economic Consequences of the Peace (1919) predicted economic disaster.","His focus was economics.","He proposed nothing of the kind.","That was not his main argument."],"answer":1},"u10q37":{"id":"u10q37","unit":10,"diff":"h","pool":"diag","stem":"<p>Which factor best explains why the First World War is described as a \"total war\"?<\/p>","options":["It lasted longer than any previous war in European history","Whole societies were mobilized","Soldiers fought without any rules","Every country in the world took part","It was fought on every continent equally"],"why":["The Thirty Years' War and Hundred Years' War lasted far longer.","Production, labor, food and opinion were all directed toward victory.","Some conventions still applied.","Many countries stayed neutral.","Most fighting was in Europe and the Middle East."],"answer":1},"u10q38":{"id":"u10q38","unit":10,"diff":"h","pool":"quiz","stem":"<p>The Treaty of Brest-Litovsk shows that the Bolsheviks<\/p>","options":["regained Poland and the Baltic states","kept fighting Germany until the armistice of November 1918","won the war on the Eastern Front","accepted Wilson's Fourteen Points","would trade land for peace"],"why":["Russia lost those lands.","Russia left the war in March 1918.","Russia was defeated.","The Bolsheviks made a separate peace with Germany.","Lenin accepted harsh terms to survive."],"answer":4},"u10q39":{"id":"u10q39","unit":10,"diff":"h","pool":"exam1","stem":"<p>Which outcome of the First World War most directly contributed to the instability of central and eastern Europe in the 1920s?<\/p>","options":["New states with disputed borders","The creation of a strong, unified Austria-Hungary","The economic dominance of Germany in the region","The restoration of the Romanov dynasty","The absorption of Poland into the Russian state"],"why":["Border disputes and ethnic tensions troubled the new states.","Austria-Hungary was dissolved.","Germany was weakened and paying reparations.","The Romanovs were overthrown and killed.","Poland became independent."],"answer":0},"u10q40":{"id":"u10q40","unit":10,"diff":"h","pool":"exam1","stem":"<p>Which statement best explains why the Bolsheviks gained support between March and November 1917?<\/p>","options":["They promised peace and land","They promised to restore the tsar","They were supported by the Russian nobility","They had won a majority in the Constituent Assembly elections","They promised to continue the war until victory"],"why":["The Provisional Government failed to deliver these.","They opposed the monarchy.","The nobility opposed them.","Those elections came after October, and they lost.","That was the Provisional Government's policy."],"answer":0},"u10q41":{"id":"u10q41","unit":10,"diff":"m","pool":"exam1","stem":"<p>The mandate system created after World War I<\/p>","options":["returned the Arab lands to Ottoman rule","created the state of Israel","granted immediate independence to all colonies","gave Allied powers control of former colonies","gave Germany new colonies in the Middle East"],"why":["The Ottoman Empire lost those lands.","Israel was founded in 1948.","Colonies were not freed.","Mandates were supervised, in theory, by the League of Nations.","Germany lost all colonies."],"answer":3},"u10q42":{"id":"u10q42","unit":10,"diff":"h","pool":"exam2","stem":"<p>Which wartime document most complicated the postwar settlement of the Middle East?<\/p>","options":["The Treaty of Brest-Litovsk","The Fourteen Points' call for freedom of the seas","The Balfour Declaration","The Zimmermann Telegram","The October Manifesto"],"why":["That concerned Russia and Germany.","This had no specific Middle Eastern effect.","It conflicted with British promises to the Arabs.","That concerned Mexico and the U.S.","That was a 1905 Russian document."],"answer":2},"u10q43":{"id":"u10q43","unit":10,"diff":"m","pool":"diag","stem":"<p>The Kronstadt rebellion of 1921 led Lenin to<\/p>","options":["declare war on Germany again","hold new elections to the Constituent Assembly","invite the tsar back","restore the Provisional Government","adopt the NEP"],"why":["The war was over.","There were none.","The tsar had been killed in 1918.","The Bolsheviks kept power.","The revolt of once-loyal sailors showed how unpopular forced requisitioning was."],"answer":4},"u10q44":{"id":"u10q44","unit":10,"diff":"m","pool":"quiz","stem":"<p>Which factor most weakened the tsarist government during the First World War?<\/p>","options":["A successful German invasion of Petrograd","The Bolsheviks' control of the Duma","Defeats, shortages and Rasputin","The emancipation of the serfs in 1914","Britain's refusal to sell Russia grain"],"why":["Germany never captured Petrograd.","The Bolsheviks were a small minority before 1917.","Nicholas's absence at the front left an unpopular court in charge.","The serfs had been freed in 1861.","Russia's problems were internal transport and production."],"answer":2},"u11q1":{"id":"u11q1","unit":11,"diff":"e","pool":"diag","stem":"<p>Benito Mussolini came to power in Italy after the<\/p>","options":["Spanish Civil War","Lateran Accords","Beer Hall Putsch","Reichstag fire","March on Rome in 1922"],"why":["That began in 1936.","Those were signed in 1929, after he took power.","That was Hitler's failed coup in Munich in 1923.","That happened in Germany in 1933.","The king appointed him prime minister rather than use the army."],"answer":4},"u11q2":{"id":"u11q2","unit":11,"diff":"e","pool":"exam1","stem":"<p>The Enabling Act of 1933<\/p>","options":["let Hitler's cabinet make laws","annexed Austria","made Germany a member of the League of Nations","created the Weimar Republic and its constitution","reduced German reparations"],"why":["It provided the legal basis for dictatorship.","The Anschluss came in 1938.","Germany joined in 1926 and left in 1933.","The Weimar constitution dates from 1919.","That was the Dawes Plan (1924) and Young Plan (1929)."],"answer":0},"u11q3":{"id":"u11q3","unit":11,"diff":"e","pool":"quiz","stem":"<p>Stalin's policy of collectivization forced peasants to<\/p>","options":["move to the United States","join collective farms","buy land from the former nobility on credit","form independent trade unions","sell their grain freely on the open market"],"why":["Emigration was not the policy.","Collectivization began in 1929 and caused famine.","The nobility had been abolished.","Independent unions were not allowed.","That was the NEP, which Stalin ended."],"answer":1},"u11q4":{"id":"u11q4","unit":11,"diff":"e","pool":"exam2","stem":"<p>The Munich Agreement of 1938 allowed Germany to annex<\/p>","options":["Austria","Alsace-Lorraine","the Sudetenland of Czechoslovakia","the Rhineland","western Poland"],"why":["The Anschluss happened in March 1938, separately.","Germany took Alsace-Lorraine after defeating France in 1940.","Britain and France agreed without consulting the Czechs.","Germany remilitarized the Rhineland in 1936; it was already German territory.","Germany invaded Poland in 1939."],"answer":2},"u11q5":{"id":"u11q5","unit":11,"diff":"e","pool":"exam2","stem":"<p>The Great Depression began with<\/p>","options":["the U.S. stock market crash of October 1929","the Treaty of Versailles","the Munich Agreement","the Russian Revolution","the German hyperinflation of 1923"],"why":["The crash triggered a worldwide economic collapse.","The treaty was signed in 1919.","That was in 1938.","That was in 1917.","That was a separate, earlier crisis."],"answer":0},"u11q6":{"id":"u11q6","unit":11,"diff":"e","pool":"quiz","stem":"<p>The Nuremberg Laws of 1935<\/p>","options":["set up international war crimes trials","remilitarized the Rhineland in defiance of Versailles","ended German reparations","stripped Jews of citizenship","created the Nazi Party"],"why":["The Nuremberg Trials came after 1945.","That happened in 1936.","Reparations had effectively ended by 1932.","They legalized racial discrimination.","The party dated from 1920."],"answer":3},"u11q7":{"id":"u11q7","unit":1 /* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (c, t) => (t ? Math.round((100 * c) / t) : 0);
const LETTERS = ["A", "B", "C", "D", "E"];
const UNITS = DATA.units;
const Q = DATA.questions;
const unitById = (id) => UNITS.find((u) => u.id === +id);
const dayNum = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5);
const isoDate = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const fmtH = (h) => (h < 1 ? Math.round(h * 60) + " min" : (Math.round(h * 10) / 10).toFixed(1).replace(/\.0$/, "") + " h");
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600); }
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ---------- storage (always wrapped: works with storage blocked) ---------- */
const KEY = "clep-wc2-guide-v1";
const EXAM_MINUTES = DATA.meta.format.time_minutes || 90;
const BOX_DAYS = [0, 0, 1, 3, 7, 14]; // Leitner box -> days until next review
function fresh() {
  return { v: 1, theme: "system", diag: null, units: {}, cards: {}, mistakes: {}, exams: {}, plan: { hours: 2, date: "", start: "" }, created: isoDate() };
}
let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    return Object.assign(fresh(), JSON.parse(raw));
  } catch (e) { storageOK = false; return fresh(); }
}
let ST = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(ST)); storageOK = true; }
  catch (e) { storageOK = false; }
}
const U = (id) => (ST.units[id] = ST.units[id] || { read: false, quiz: [] });

/* ---------- derived progress ---------- */
function quizBest(id) { const q = U(id).quiz; return q.length ? Math.max(...q.map((r) => r.score / r.total)) : null; }
function diagRec(id) {
  if (!ST.diag) return null;
  const [c, t] = ST.diag.byUnit[id] || [0, 0];
  if (!t) return null;
  const p = c / t;
  return p >= 0.75 ? "skim" : p >= 0.5 ? "review" : "study";
}
function cardStats(unitId) {
  const cards = unitId ? unitById(unitId).cards : UNITS.flatMap((u) => u.cards);
  let mastered = 0, seen = 0, due = 0;
  const today = dayNum();
  for (const c of cards) {
    const s = ST.cards[c.id];
    if (s) { seen++; if (s.box >= 3) mastered++; if (s.due <= today) due++; }
  }
  return { total: cards.length, mastered, seen, due, fresh: cards.length - seen };
}
function unitStatus(id) {
  const u = U(id), best = quizBest(id);
  const passed = best !== null && best >= 0.7;
  if (passed && (u.read || diagRec(id) === "skim")) return "done";
  if (u.read || u.quiz.length) return "prog";
  return "todo";
}
function unitRemainingHours(unit) {
  const u = U(unit.id), best = quizBest(unit.id), cs = cardStats(unit.id);
  let left = 1 - (u.read ? 0.4 : 0) - (best !== null && best >= 0.7 ? 0.4 : 0) - 0.2 * (cs.total ? cs.mastered / cs.total : 0);
  const factor = diagRec(unit.id) === "skim" ? 0.5 : 1;
  return Math.max(0, unit.hours * factor * left);
}
const EXTRA = { diag: 0.5, exam: 2.5, final: 2 };
function hoursLeft() {
  let h = UNITS.reduce((s, u) => s + unitRemainingHours(u), 0);
  if (!ST.diag) h += EXTRA.diag;
  for (const k of ["exam1", "exam2"]) if (!(ST.exams[k] && ST.exams[k].status === "done")) h += EXTRA.exam;
  if (!(ST.exams.exam2 && ST.exams.exam2.status === "done")) h += EXTRA.final;
  return h;
}
const totalPlannedHours = () => UNITS.reduce((s, u) => s + u.hours, 0) + EXTRA.diag + 2 * EXTRA.exam + EXTRA.final;
function examScore(k) { const e = ST.exams[k]; return e && e.status === "done" ? e.score / e.total : null; }
function readiness() {
  const s1 = examScore("exam1"), s2 = examScore("exam2");
  return { s1, s2, ready: s1 !== null && s2 !== null && s1 >= 0.75 && s2 >= 0.75 };
}

/* ---------- mistakes ---------- */
function recordAnswer(qid, correct) {
  const m = ST.mistakes[qid];
  if (!correct) {
    ST.mistakes[qid] = { n: (m ? m.n : 0) + 1, last: isoDate(), streak: 0, cleared: false };
  } else if (m && !m.cleared) {
    m.streak = (m.streak || 0) + 1;
    if (m.streak >= 2) m.cleared = true;
  }
}
const openMistakes = () => Object.keys(ST.mistakes).filter((id) => Q[id] && !ST.mistakes[id].cleared);

/* ---------- router ---------- */
let S = { session: null, result: null, cardSession: null, confirm: null };
function route() { return (location.hash || "#home").slice(1) || "home"; }
function go(r) { if (route() === r) render(); else location.hash = r; }
window.addEventListener("hashchange", () => { closeMenu(); render(); window.scrollTo(0, 0); });

function navHTML() {
  const r = route();
  const cur = (x) => (r === x || r.startsWith(x + "-") ? ' aria-current="page"' : "");
  const mist = openMistakes().length;
  const due = cardStats().due;
  const item = (h, label, extra = "") => `<a href="#${h}"${cur(h)}><span class="u-name">${label}</span>${extra}</a>`;
  let s = item("home", "Dashboard") + item("diagnostic", "Diagnostic test", ST.diag ? '<span class="chip good">done</span>' : "");
  s += '<div class="nav-label">Units</div>';
  for (const u of UNITS) {
    const st = unitStatus(u.id);
    s += `<a href="#unit-${u.id}"${r === "unit-" + u.id ? ' aria-current="page"' : ""} title="${esc(u.title)}"><span class="u-no">${u.id}</span><span class="u-name">${esc(u.short)}</span><span class="dot ${st}" aria-label="${st === "done" ? "complete" : st === "prog" ? "in progress" : "not started"}"></span></a>`;
  }
  s += '<div class="nav-label">Practice</div>';
  s += item("cards", "Flashcards", due ? `<span class="chip accent num">${due} due</span>` : "");
  s += item("mistakes", "Mistake log", mist ? `<span class="chip bad num">${mist}</span>` : "");
  s += item("exams", "Practice exams");
  s += '<div class="nav-label">Tools</div>';
  s += item("cheatsheet", "Cheat sheet") + item("plan", "Study plan") + item("about", "About this exam") + item("settings", "Progress & settings");
  return s;
}

let rendering = false;
function render() {
  if (rendering) return;
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
}
function renderNow() {
  const r = route();
  $("#nav").innerHTML = navHTML();
  const running = runningExam();
  let html;
  if (running && r !== "session") {
    // An exam clock is running: keep the way back obvious.
    html = `<div class="notice bad no-print">Practice ${running === "exam1" ? "Exam 1" : "Exam 2"} is running and the clock does not stop. <a href="#session" data-act="resume-exam" data-k="${running}">Return to the exam</a></div>`;
  } else html = "";
  if (r === "home") html += viewHome();
  else if (r === "diagnostic") html += viewDiagnostic();
  else if (/^unit-\d+$/.test(r) && unitById(r.slice(5))) html += viewUnit(unitById(r.slice(5)));
  else if (r === "session") html += viewSession();
  else if (r === "result") html += viewResult();
  else if (r === "cards") html += viewCards();
  else if (r === "mistakes") html += viewMistakes();
  else if (r === "exams") html += viewExams();
  else if (r === "cheatsheet") html += viewCheat();
  else if (r === "plan") html += viewPlan();
  else if (r === "about") html += viewAbout();
  else if (r === "settings") html += viewSettings();
  else html += viewHome();
  if (!storageOK) html = `<div class="notice no-print">This browser is blocking saved progress. Everything works, but progress disappears when you close the page. Use <a href="#settings">Export progress</a> to keep it.</div>` + html;
  $("#main").innerHTML = html;
  syncTheme();
  if (r === "session") startTimer(); else stopTimer();
}

/* ---------- views: home ---------- */
function nextStep() {
  if (runningExam()) return { t: "Finish your practice exam", d: "The clock is still running.", h: "session", b: "Return to exam" };
  if (!ST.diag) return { t: "Take the diagnostic test", d: "30 questions across all 12 units, about 30 minutes, untimed. It tells you which units you can skim and which need full study.", h: "diagnostic", b: "Start diagnostic" };
  const order = UNITS.slice().sort((a, b) => ({ study: 0, review: 1, skim: 2 }[diagRec(a.id)] ?? 1) - ({ study: 0, review: 1, skim: 2 }[diagRec(b.id)] ?? 1) || a.id - b.id);
  const u = order.find((x) => unitStatus(x.id) !== "done");
  if (u) {
    const read = U(u.id).read;
    return { t: `Unit ${u.id}: ${u.title}`, d: read ? "You've read the lesson. Take the unit quiz and aim for 70% or better." : `Read the ${u.minutes}-minute lesson, then take the quiz.`, h: `unit-${u.id}`, b: read ? "Go to quiz" : "Open lesson" };
  }
  const mist = openMistakes().length;

  if (mist > 15) return { t: "Drill your mistake log", d: `${mist} missed questions are waiting. Clear them before Exam 2.`, h: "mistakes", b: "Drill mistakes" };
  if (!examScore("exam2")) return { t: "Take Practice Exam 2", d: "Same format, all-new questions.", h: "exams", b: "Go to exams" };
  if (!readiness().ready) return { t: "Retake the weaker exam after review", d: "Both practice exams need 75% or better before you book.", h: "exams", b: "Go to exams" };
  return { t: "You're ready to book the exam", d: "Keep flashcards warm and redraw the cheat sheet the day before.", h: "cheatsheet", b: "Open cheat sheet" };

/* ---------- question sessions ---------- */
// kind: quiz | diag | exam | drill.  feedback: "now" (show answer immediately) or "end".
function startSession(cfg) {
  S.session = Object.assign({ idx: 0, answers: {}, flags: {} }, cfg);
  S.result = null;
  go("session");
}
function runningExam() {
  for (const k of ["exam1", "exam2"]) { const e = ST.exams[k]; if (e && e.status === "running") return k; }
  return null;
}
function examSession(k) {
  const e = ST.exams[k];
  return { kind: "exam", examKey: k, ids: e.ids, title: k === "exam1" ? "Practice Exam 1" : "Practice Exam 2", feedback: "end", idx: e.idx || 0, answers: e.answers, flags: e.flags, deadline: e.start + EXAM_MINUTES * 60000 };
}
function ensureSession() {
  const k = runningExam();
  if (k && (!S.session || S.session.examKey !== k)) S.session = examSession(k);
  return S.session;
}
function viewSession() {
  const s = ensureSession();
  if (!s) return `<div class="col"><p>No quiz in progress.</p><p><a class="btn" href="#home">Back to dashboard</a></p></div>`;
  const id = s.ids[s.idx], q = Q[id], u = unitById(q.unit);
  const chosen = s.answers[id];
  const reveal = s.feedback === "now" && chosen !== undefined;
  const opts = q.options.map((o, i) => {
    let cls = "opt";
    if (reveal) { if (i === q.answer) cls += " right"; else if (i === chosen) cls += " wrong"; }
    else if (i === chosen) cls += " sel";
    return `<button class="${cls}" type="button" data-act="pick" data-i="${i}" ${reveal ? "disabled" : ""} aria-pressed="${i === chosen}"><span class="k">${LETTERS[i]}</span><span>${o}</span></button>`;
  }).join("");
  let fb = "";
  if (reveal) {
    const ok = chosen === q.answer;
    fb = `<section class="panel why" aria-live="polite"><span class="verdict ${ok ? "ok" : "no"}">${ok ? "Correct." : `Not quite. The answer is ${LETTERS[q.answer]}.`}</span>
      <ul>${q.why.map((w, i) => `<li><span class="mk ${i === q.answer ? "ok" : "no"}">${LETTERS[i]}</span><span>${w}</span></li>`).join("")}</ul></section>`;
  }
  const last = s.idx === s.ids.length - 1;
  const answeredCount = s.ids.filter((x) => s.answers[x] !== undefined).length;
  const timer = s.deadline ? `<span class="timer" id="timer" aria-label="Time remaining">--:--</span>` : "";
  const grid = s.feedback === "end" ? `<details class="panel tight no-print" ${s.kind === "exam" ? "" : "open"}><summary class="small">Question map · ${answeredCount}/${s.ids.length} answered${s.kind === "exam" ? " · gold dot = flagged" : ""}</summary>
      <div class="qgrid">${s.ids.map((x, i) => `<button type="button" data-act="jump" data-i="${i}" class="${s.answers[x] !== undefined ? "ans" : ""} ${i === s.idx ? "cur" : ""} ${s.flags[x] ? "flag" : ""}" aria-label="Question ${i + 1}">${i + 1}</button>`).join("")}</div></details>` : "";
  const nextLabel = last ? (s.feedback === "end" ? "Review & submit" : "Finish") : "Next";
  const canNext = s.feedback === "end" || reveal;
  const confirm = S.confirm === "submit" ? `<div class="notice bad" role="alert"><b>${s.ids.length - answeredCount} unanswered.</b> Unanswered questions count as wrong (there is no guessing penalty on CLEP, so guess). <div class="row" style="margin-top:8px"><button class="btn primary" type="button" data-act="submit-confirm">Submit now</button><button class="btn" type="button" data-act="cancel-confirm">Keep working</button></div></div>` : "";
  return `<div class="col">
  <div class="runner">
    <div class="runner-head">
      <div><span class="eyebrow">${esc(s.title)}</span><div class="small muted num">Question ${s.idx + 1} of ${s.ids.length} · Unit ${u.id}: ${esc(u.short)}${s.kind === "exam" || s.kind === "diag" ? "" : " · " + ({ e: "easy", m: "medium", h: "hard" }[q.diff])}</div></div>
      <div class="row">${timer}${s.kind !== "exam" ? `<button class="btn small ghost" type="button" data-act="quit">Quit</button>` : ""}</div>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts" role="group" aria-label="Answer choices">${opts}</div>
    ${fb}
    ${confirm}
    <div class="row spread no-print">
      <div class="row">${s.feedback === "end" ? `<button class="btn" type="button" data-act="prev" ${s.idx === 0 ? "disabled" : ""}>← Back</button>` : ""}${s.kind === "exam" ? `<button class="btn" type="button" data-act="flag">${s.flags[id] ? "Unflag" : "Flag for review"}</button>` : ""}</div>
      <div class="row">${s.feedback === "end" && !last ? `<button class="btn small ghost" type="button" data-act="submit">Submit early</button>` : ""}<button class="btn primary" type="button" data-act="next" ${canNext ? "" : "disabled"}>${nextLabel}</button></div>
    </div>
    <p class="small muted no-print">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> choose an answer, <span class="kbd">Enter</span> next${s.feedback === "end" ? ', <span class="kbd">←</span> back' : ""}.</p>
    ${grid}
  </div>
</div>`;
}
function persistExam() {
  const s = S.session;
  if (s && s.kind === "exam") { const e = ST.exams[s.examKey]; e.answers = s.answers; e.flags = s.flags; e.idx = s.idx; save(); }
}
function pick(i) {
  const s = S.session; if (!s) return;
  const id = s.ids[s.idx];
  if (s.feedback === "now") {
    if (s.answers[id] !== undefined) return;
    s.answers[id] = i;
    recordAnswer(id, i === Q[id].answer);
    save();
  } else {
    s.answers[id] = i;
    persistExam();
  }
  render();
}
function nextQ() {
  const s = S.session; if (!s) return;
  const id = s.ids[s.idx];
  if (s.feedback === "now" && s.answers[id] === undefined) return;
  if (s.idx < s.ids.length - 1) { s.idx++; S.confirm = null; persistExam(); render(); window.scrollTo(0, 0); }
  else if (s.feedback === "end") {
    const unanswered = s.ids.filter((x) => s.answers[x] === undefined).length;
    if (unanswered && S.confirm !== "submit") { S.confirm = "submit"; render(); return; }
    finishSession();
  } else finishSession();
}
function grade(ids, answers) {
  const byUnit = {};
  let correct = 0;
  for (const id of ids) {
    const q = Q[id], ok = answers[id] === q.answer;
    byUnit[q.unit] = byUnit[q.unit] || [0, 0];
    byUnit[q.unit][1]++;
    if (ok) { byUnit[q.unit][0]++; correct++; }
  }
  return { correct, total: ids.length, byUnit };
}
function finishSession() {
  const s = S.session; if (!s) return;
  S.confirm = null;
  const g = grade(s.ids, s.answers);
  if (s.feedback === "end") for (const id of s.ids) recordAnswer(id, s.answers[id] === Q[id].answer);
  if (s.kind === "quiz") U(s.unit).quiz.push({ score: g.correct, total: g.total, date: isoDate() });
  if (s.kind === "diag") ST.diag = { answers: s.answers, byUnit: g.byUnit, score: g.correct, total: g.total, date: isoDate() };
  if (s.kind === "exam") Object.assign(ST.exams[s.examKey], { status: "done", answers: s.answers, byUnit: g.byUnit, score: g.correct, total: g.total, end: Date.now() });
  save();
  S.result = { kind: s.kind, title: s.title, ids: s.ids, answers: s.answers, g, unit: s.unit, examKey: s.examKey };
  S.session = null;
  if (s.kind === "diag") go("diagnostic");
  else go("result");
}
function byUnitTable(byUnit, showRec) {
  const rows = Object.keys(byUnit).map(Number).sort((a, b) => a - b).map((id) => {
    const [c, t] = byUnit[id], p = pct(c, t), u = unitById(id);
    const cls = p >= 75 ? "good" : p >= 50 ? "warn" : "bad";
    const rec = showRec ? `<td><span class="chip ${cls}">${p >= 75 ? "Skim" : p >= 50 ? "Review" : "Must study"}</span></td>` : "";
    return `<tr><td class="num">${id}</td><td><a href="#unit-${id}">${esc(u.short)}</a></td><td class="n">${c}/${t}</td><td style="width:30%"><div class="bar ${cls}"><span style="width:${p}%"></span></div></td><td class="n">${p}%</td>${rec}</tr>`;
  }).join("");
  return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Unit</th><th class="n">Right</th><th>Score</th><th class="n">%</th>${showRec ? "<th>Plan</th>" : ""}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function reviewList(ids, answers, missedOnly) {
  const list = ids.filter((id) => !missedOnly || answers[id] !== Q[id].answer);
  if (!list.length) return '<p class="muted">Nothing to review: every answer was right.</p>';
  return list.map((id) => {
    const q = Q[id], a = answers[id];
    return `<div class="review-item"><div class="small muted">Unit ${q.unit} · ${a === undefined ? "<b>unanswered</b>" : a === q.answer ? "correct" : `you chose ${LETTERS[a]}`}</div>
      <div class="stem">${q.stem}</div>
      <div class="why"><ul>${q.options.map((o, i) => `<li><span class="mk ${i === q.answer ? "ok" : "no"}">${i === q.answer ? "✓" : i === a ? "✗" : LETTERS[i]}</span><span><b>${o}</b><br><span class="muted">${q.why[i]}</span></span></li>`).join("")}</ul></div></div>`;
  }).join("");
}
function viewResult() {
  const r = S.result;
  if (!r) return `<div class="col"><p>No results to show.</p><a class="btn" href="#home">Dashboard</a></div>`;
  const p = pct(r.g.correct, r.g.total);
  let actions = "";
  if (r.kind === "quiz") actions = `<button class="btn primary" type="button" data-act="unit-quiz" data-u="${r.unit}">Retake quiz</button><a class="btn" href="#unit-${r.unit}">Back to lesson</a>${unitById(r.unit + 1) ? `<a class="btn" href="#unit-${r.unit + 1}">Next unit →</a>` : ""}`;

  return `<div class="col">
  <span class="eyebrow">${esc(r.title)} · results</span>
  <h1 class="num">${r.g.correct} / ${r.g.total} <span class="muted">(${p}%)</span></h1>

</div>`;
}

/* ---------- flashcards (Leitner) ---------- */
function deckCards(unitId) { return unitId ? unitById(unitId).cards : UNITS.flatMap((u) => u.cards); }
function viewCards() {
  const cs = S.cardSession;
  if (cs && cs.queue.length) return viewCardRun(cs);
  const unitSel = S.cardUnit || 0;
  const cards = deckCards(unitSel);
  const today = dayNum();
  const boxes = [0, 0, 0, 0, 0, 0];
  let missed = 0;
  for (const c of cards) { const s = ST.cards[c.id]; boxes[s ? s.box : 0]++; if (s && s.last === "miss") missed++; }

function startCards(mode) {

}

function gradeCard(ok) {
  const cs = S.cardSession; if (!cs || !cs.flipped) return;
  const id = cs.queue.shift();
  const s = ST.cards[id] || { box: 0, lapses: 0 };
  if (ok) { s.box = Math.min(5, Math.max(1, s.box) + 1); s.due = dayNum() + BOX_DAYS[s.box]; s.last = "ok"; cs.right++; }
  else {
    s.box = 1; s.due = dayNum(); s.last = "miss"; s.lapses = (s.lapses || 0) + 1; cs.wrong++;

/* ---------- study plan ---------- */
function buildPlan(hoursPerDay, examDate, startDate) {
  const start = new Date(startDate + "T00:00:00"), exam = new Date(examDate + "T00:00:00");
  const nDays = Math.round((exam - start) / 864e5); // study days before exam day
  if (!(hoursPerDay > 0)) return { error: "Enter how many hours a day you can study." };
  if (isNaN(nDays)) return { error: "Pick a start date and an exam date." };
  if (nDays < 3) return { error: "Pick an exam date at least 3 days after the start date: the last two days are reserved for the practice exams." };
  const tasks = [];
  if (!ST.diag) tasks.push({ label: "Diagnostic test (30 questions)", h: EXTRA.diag });
  const order = UNITS.slice().sort((a, b) => a.id - b.id);
  for (const u of order) {
    const left = unitRemainingHours(u);
    if (left < 0.05) continue;
    const skim = diagRec(u.id) === "skim";
    const lead = `Unit ${u.id} · ${u.short}${skim ? " (skim)" : ""}`;
    const parts = U(u.id).read ? [["quiz + review misses", 0.55], ["flashcards", 0.45]] : [["lesson + must-know + timeline", 0.4], ["quiz + review misses", 0.35], ["flashcards", 0.25]];
    for (const [p, f] of parts) tasks.push({ label: `${lead}: ${p}`, h: left * f, unit: u.id });
  }
  tasks.push({ label: "Mistake-log drill + weakest-unit quiz retake", h: 1 });
  tasks.push({ label: "Cheat sheet: redraw timeline and who's who from memory", h: 1 });
  const days = [];
  const studyDays = nDays - 2;
  for (let i = 0; i < nDays; i++) days.push({ date: new Date(start.getTime() + i * 864e5), items: [], h: 0 });
  let di = 0;
  const flash = hoursPerDay >= 1 ? 0.25 : 0;
  const cap = hoursPerDay - flash;
  for (const t of tasks) {
    let rem = t.h, part = 0;
    const whole = rem;
    while (rem > 0.01) {
      if (di >= studyDays) break;
      const room = cap - days[di].h;
      if (room < 0.1) { di++; continue; }
      const take = Math.min(room, rem);
      part++;
      const cont = take < rem - 0.01 || part > 1;
      days[di].items.push(`${t.label}${cont ? (part > 1 ? " (cont.)" : " (start)") : ""}`);
      days[di].h += take;
      rem -= take;
    }
    t.left = rem;
    if (di >= studyDays) break;
  }
  const shortfall = tasks.reduce((s, t) => s + (t.left === undefined ? t.h : t.left), 0);
  for (let i = 0; i < studyDays; i++) {
    if (!days[i].items.length) { days[i].items.push("Buffer: drill mistakes, retake your weakest quiz, or rest"); days[i].h = Math.min(cap, 1); days[i].buffer = true; }
    if (flash) { days[i].items.push("Flashcards: due cards (15 min)"); days[i].h += flash; }
  }
  days[nDays - 2].items = ["Practice Exam 1 (90 min, timed, no pausing)", "Review every missed question; drill mistake log"]; days[nDays - 2].h = EXTRA.exam; days[nDays - 2].exam = true;
  days[nDays - 1].items = ["Practice Exam 2 (90 min, timed, no pausing)", "Review misses; skim cheat sheet"]; days[nDays - 1].h = EXTRA.exam; days[nDays - 1].exam = true;
  days.push({ date: exam, items: ["CLEP exam day. Light flashcard warm-up only."], h: 0, examday: true });
  const need = tasks.reduce((s, t) => s + t.h, 0);
  return { days, shortfall, need, studyDays, suggest: Math.ceil(((need + studyDays * flash) / studyDays) * 4) / 4 + flash };
}
function viewPlan() {
  const p = ST.plan;
  const today = isoDate();
  const start = p.start || today;
  const def = isoDate(new Date(Date.now() + 21 * 864e5));
  const examDate = p.date || def;
  return `<div class="col">

  <div class="panel"><div class="row">
    <label class="field">Hours per day<input id="planHours" type="number" min="0.5" max="12" step="0.5" value="${esc(p.hours)}"></label>

    <label class="field">Exam date<input id="planDate" type="date" value="${esc(examDate)}"></label>

function planOut(hours, examDate, start) {
  const res = buildPlan(hours, examDate, start);
  let out;
  if (res.error) out = `<div class="notice bad">${res.error}</div>`;
  else {
    const rows = res.days.map((d, i) => `<tr class="${d.exam ? "exam" : ""} ${d.examday ? "examday" : ""}"><td class="num">${d.date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</td><td class="num">${d.examday ? "Exam" : "Day " + (i + 1)}</td><td><ul>${d.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></td><td class="n">${d.h ? fmtH(d.h) : ""}</td></tr>`).join("");
    const warn = res.shortfall > 0.1 ? `<div class="notice bad"><b>Not enough time:</b> about ${fmtH(res.shortfall)} of unit work doesn't fit before the practice exams. Study about <b>${res.suggest} hours a day</b>, or move the exam date later.</div>` : `<div class="notice info">Fits: ${fmtH(res.need)} of remaining work across ${res.studyDays} study days, then two practice-exam days.</div>`;
    out = warn + `<div class="tablewrap"><table class="plan-table"><thead><tr><th>Date</th><th>Day</th><th>Tasks</th><th class="n">Hours</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return out;
}

/* ---------- timer ---------- */
let timerId = null;
function tick() {
  const s = S.session, el = $("#timer");
  if (!s || !s.deadline) return;
  const left = s.deadline - Date.now();
  if (left <= 0) { stopTimer(); toast("Time's up. Your exam was submitted."); S.confirm = null; finishSession(); return; }
  if (el) {
    const m = Math.floor(left / 60000), sec = Math.floor((left % 60000) / 1000);
    el.textContent = `${m}:${String(sec).padStart(2, "0")}`;
    el.classList.toggle("low", left < 5 * 60000);
  }
}
function startTimer() { stopTimer(); if (S.session && S.session.deadline) { tick(); timerId = setInterval(tick, 1000); } }
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

  "exam-results": (el) => { const k = el.dataset.k, e = ST.exams[k]; S.result = { kind: "exam", title: k === "exam1" ? "Practice Exam 1" : "Practice Exam 2", ids: e.ids, answers: e.answers, g: grade(e.ids, e.answers), examKey: k }; go("result"); },
  drill: () => {
    const open = openMistakes().sort((a, b) => ST.mistakes[b].n - ST.mistakes[a].n).slice(0, 20);
    if (!open.length) { toast("No open mistakes."); return; }
    startSession({ kind: "drill", ids: shuffle(open), title: "Mistake drill", feedback: "now" });
  },
  "cards-due": () => startCards("due"),
  "cards-missed": () => startCards("missed"),
  "cards-all": () => startCards("all"),
  "cards-quit": () => { S.cardSession = null; render(); },
  flip: () => { if (S.cardSession) { S.cardSession.flipped = !S.cardSession.flipped; render(); } },
  "card-grade": (el) => gradeCard(el.dataset.ok === "1"),
  mask: () => { S.mask = !S.mask; render(); },
  print: () => window.print(),
  export: () => {
    try {
      const blob = new Blob([JSON.stringify(ST, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `wc2-progress-${isoDate()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      toast("Download started. If nothing downloads here, use Copy as text.");
    } catch (e) { toast("Downloads are blocked here. Use Copy as text."); }
  },
  "copy-export": () => {
    const box = $("#exportBox"); box.value = JSON.stringify(ST);
    const done = () => toast("Progress copied.");
    const fallback = () => { box.focus(); box.select(); toast("Text selected. Press Ctrl+C / Cmd+C to copy."); };
    try { navigator.clipboard.writeText(box.value).then(done, fallback); } catch (e) { fallback(); }
  },
  "import-text": () => importState($("#importBox").value),
  reset: () => { S.confirm = "reset"; render(); },
  "reset-confirm": () => { ST = fresh(); save(); S = { session: null, result: null, cardSession: null, confirm: null }; toast("Progress erased."); go("home"); },
};
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (el && el.tagName !== "SELECT" && el.tagName !== "INPUT" && ACT[el.dataset.act]) {
    ACT[el.dataset.act](el, ev);
    return;
  }
  if (ev.target.closest(".rail a")) closeMenu();
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.id === "deckSel") { S.cardUnit = +el.value; S.cardSession = null; render(); }
  if (el.id === "importFile" && el.files && el.files[0]) {
    const r = new FileReader(); r.onload = () => importState(String(r.result)); r.readAsText(el.files[0]);
  }
  if (["planHours", "planStart", "planDate"].includes(el.id)) {
    ST.plan = { hours: +$("#planHours").value || 0, start: $("#planStart").value, date: $("#planDate").value };
    save();
    $("#planOut").innerHTML = planOut(ST.plan.hours, ST.plan.date, ST.plan.start);
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.matches("input, textarea, select") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const r = route();
  if (r === "session" && S.session) {
    if (/^[1-5]$/.test(ev.key)) { const s = S.session; if (+ev.key <= Q[s.ids[s.idx]].options.length) { ev.preventDefault(); pick(+ev.key - 1); } }
    else if (ev.key === "Enter") { ev.preventDefault(); if (S.confirm === "submit") finishSession(); else nextQ(); }
    else if (ev.key === "ArrowLeft" && S.session.feedback === "end") ACT.prev();
    else if (ev.key === "ArrowRight" && S.session.feedback === "end") nextQ();
  } else if (r === "cards" && S.cardSession && S.cardSession.queue.length) {
    if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); ACT.flip(); }
    else if (ev.key === "1" && S.cardSession.flipped) gradeCard(false);
    else if (ev.key === "2" && S.cardSession.flipped) gradeCard(true);
  } else if (ev.key === "Escape") closeMenu();
});

/* ---------- boot ---------- */
(function boot() {
  const k = runningExam();
  if (k && ST.exams[k].start + EXAM_MINUTES * 60000 <= Date.now()) {
    // Time ran out while away: submit what was answered.
    S.session = examSession(k); finishSession();
    toast("Your exam time ran out while you were away; it was submitted.");
    return;
  }
  render();
})();
</script>
</body>
</html>
