l reform.","Its base was the working class.","Universal male suffrage came in 1918.","Petitions were rejected in 1839, 1842 and 1848, yet by 1918 all points except annual parliaments were enacted."],"answer":4},"u6q22":{"id":"u6q22","unit":6,"diff":"m","pool":"exam1","stem":"<p>On the continent, the Zollverein (1834) contributed to German industrialization by<\/p>","options":["imposing new tariffs on goods traded between the German states","uniting Germany politically under Austria","abolishing serfdom in Prussia","removing tariffs among German states","building Germany's first steam engines"],"why":["It removed them.","Austria was excluded.","Prussian serfdom was abolished in reforms beginning in 1807.","The Prussian-led customs union promoted trade and economic unity.","Steam engines were imported from Britain earlier."],"answer":3},"u6q23":{"id":"u6q23","unit":6,"diff":"m","pool":"quiz","stem":"<p>\"Separate spheres\" refers to the middle-class ideal that<\/p>","options":["church and state should be separated","workers and owners should live in separate parts of town","agriculture and industry should be taxed separately","men belong in public life, women at home","Britain and its colonies should have separate economies"],"why":["That is a different principle.","The term refers to gender roles.","The term has nothing to do with taxation.","This ideology shaped nineteenth-century gender roles.","The term refers to gender roles."],"answer":3},"u6q24":{"id":"u6q24","unit":6,"diff":"m","pool":"exam1","stem":"<blockquote>\"In Manchester... the cottages are old, dirty, and of the smallest sort, the streets uneven, fallen into ruts and in part without drains or pavement; masses of refuse, offal and sickening filth lie among standing pools in all directions.\"<\/blockquote><p>This description is most useful as evidence of<\/p>","options":["the success of the Factory Act of 1833","the effects of rapid urbanization","middle-class family life in London's suburbs","conditions on enclosed farms","the effects of the Continental System"],"why":["The passage does not concern factory regulation.","It describes housing and sanitation in an industrial city.","It describes working-class districts in Manchester.","The passage describes a city.","The passage concerns urban conditions."],"answer":1},"u6q25":{"id":"u6q25","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which group was the core of the Anti-Corn Law League?<\/p>","options":["Catholic clergy","Prussian Junkers","Aristocratic landowners","Manufacturers and merchants","Luddite machine-breakers"],"why":["The League was a secular economic campaign.","The League was British.","They benefited from the Corn Laws.","Cobden and Bright led businessmen who wanted cheaper food and wider markets.","The League worked through petitions and Parliament."],"answer":3},"u6q26":{"id":"u6q26","unit":6,"diff":"m","pool":"exam1","stem":"<p>Which change resulted from Richard Arkwright's water frame?<\/p>","options":["The putting-out system expanded","Coal mining was banned","Weaving was mechanized for the first time","Spinning moved into water-powered mills","Steam locomotives replaced canals for moving freight"],"why":["Factory spinning undercut cottage spinning.","Mining expanded.","The water frame spun thread; Cartwright's power loom mechanized weaving.","The water frame was too large for cottages and needed river power.","That came with the railways after 1830."],"answer":3},"u6q27":{"id":"u6q27","unit":6,"diff":"h","pool":"exam1","stem":"<p>Which development MOST directly resulted from the high cost of transporting coal before 1830?<\/p>","options":["The building of canals and then railways","The Luddite movement","The Great Reform Act","The repeal of the Corn Laws","The decline of the cotton industry"],"why":["Moving bulky coal cheaply drove the canal age and the first railways.","Luddites protested machines.","That concerned representation.","That concerned grain tariffs.","Cotton grew."],"answer":0},"u6q28":{"id":"u6q28","unit":6,"diff":"h","pool":"exam1","stem":"<p>A historian argues that the early Industrial Revolution lowered living standards for many workers before raising them. Which evidence would best support this?<\/p>","options":["The invention of the spinning jenny in the 1760s","Real wages stagnant until the 1840s, then rising","The passage of the Reform Act of 1832","The founding of the Bank of England in 1694","The growth of Britain's total national output after 1780"],"why":["An invention does not show workers' living standards.","This is the \"pessimist\" position in the standard-of-living debate.","That concerns voting rights.","That predates industrialization.","Total output can rise while workers' wages lag."],"answer":1},"u6q29":{"id":"u6q29","unit":6,"diff":"h","pool":"quiz","stem":"<p>Continental European industrialization differed from British industrialization mainly in that<\/p>","options":["it began earlier than in Britain","it was led by the textile industry of the Russian Empire","governments played a larger role","it relied entirely on water power","it rejected railways in favor of canals"],"why":["It came later.","Russia industrialized late.","Latecomers used the state to catch up with Britain.","Continental industry used steam and coal.","Railways were central on the continent."],"answer":2},"u6q30":{"id":"u6q30","unit":6,"diff":"h","pool":"exam2","stem":"<p>David Ricardo's \"iron law of wages\" was used to argue that<\/p>","options":["raising wages by law would fail","women should be paid the same as men","workers should seize factories in a revolution","landowners should give their land to the peasants","governments should set a minimum wage"],"why":["If wages tend to subsistence, intervention seemed pointless to classical economists.","Ricardo's law was not about gender pay.","Marx drew revolutionary conclusions; Ricardo did not.","Ricardo did not propose land redistribution.","Ricardo's theory argued against such intervention."],"answer":0},"u6q31":{"id":"u6q31","unit":6,"diff":"h","pool":"quiz","stem":"<p>Which statement best explains why Britain avoided revolution in 1848 when much of Europe did not?<\/p>","options":["Chartism had already achieved universal male suffrage for workers","The British army had been disbanded after Waterloo","Britain had already become a republic","Earlier reforms had given the middle class a stake","Britain had no industrial working class"],"why":["Universal male suffrage came in 1918.","Britain kept an army.","Britain remained a monarchy.","Gradual reform defused pressure, and the Chartists' 1848 rally ended peacefully.","It had Europe's largest industrial working class."],"answer":3},"u6q32":{"id":"u6q32","unit":6,"diff":"h","pool":"quiz","stem":"<p>Which statement about child labor in early British factories is most accurate?<\/p>","options":["Child labor was invented by the factory system","Children were hired as cheap labor; laws limited this slowly","Children were banned from factories from the start of industrialization","Parliament abolished all child labor in 1802 with the first factory act","Children were paid more than adult men"],"why":["Children had always worked on farms and in cottage industry.","The 1833 Factory Act and later laws restricted child labor step by step.","Children worked in mills from the beginning.","The 1802 act applied only to pauper apprentices and was poorly enforced.","Children were paid much less."],"answer":1},"u6q33":{"id":"u6q33","unit":6,"diff":"m","pool":"exam2","stem":"<p>The Mines Act of 1842 prohibited<\/p>","options":["women and young boys from working underground","all coal mining in Britain","the export of coal to the continent","trade unions among miners","the use of steam engines for pumping in mines"],"why":["Reports on mine conditions shocked the public and led to the law.","Mining expanded.","The act concerned labor.","Unions were legal after 1824.","Steam engines were essential for pumping."],"answer":0},"u6q34":{"id":"u6q34","unit":6,"diff":"h","pool":"exam2","stem":"<p>Which pairing correctly links a cause to its consequence in British industrialization?<\/p>","options":["The Chartist petitions → universal male suffrage granted in 1848","The Peterloo Massacre → the abolition of the monarchy","Watt's engine → factories no longer needed rivers","The repeal of the Corn Laws → the invention of the spinning jenny","The Factory Act of 1833 → the start of child labor"],"why":["Parliament rejected the petitions.","Britain remained a monarchy.","Steam power let factories concentrate in coal towns and cities.","The jenny came about eighty years before repeal.","The act limited child labor."],"answer":2},"u7q1":{"id":"u7q1","unit":7,"diff":"e","pool":"exam1","stem":"<p>Which ideology most strongly emphasized tradition, monarchy and an established church?<\/p>","options":["Conservatism","Socialism","Anarchism","Utilitarianism","Liberalism"],"why":["Conservatives like Burke and Metternich defended the old order.","Socialists attacked private property and inequality.","Anarchists rejected all state authority.","Utilitarians judged institutions by usefulness, not tradition.","Liberals sought constitutions and individual rights."],"answer":0},"u7q2":{"id":"u7q2","unit":7,"diff":"e","pool":"exam2","stem":"<p>The Communist Manifesto (1848) argued that<\/p>","options":["monarchy is the best form of government","workers and factory owners share the same basic interests","society should return to the medieval guild system of crafts","workers will overthrow the bourgeoisie","private property is a sacred natural right"],"why":["The Manifesto is revolutionary and anti-monarchical.","Marx saw their interests as opposed.","Marx looked forward, not backward.","Marx and Engels predicted a workers' revolution.","Marx called for abolishing bourgeois property."],"answer":3},"u7q3":{"id":"u7q3","unit":7,"diff":"e","pool":"exam1","stem":"<p>Romanticism emphasized<\/p>","options":["emotion, imagination and nature","obedience to the Concert of Europe","strict reason and mathematical order","the benefits of factory life","realistic depiction of urban poverty"],"why":["Romantics reacted against Enlightenment rationalism.","Romanticism was a cultural movement, often linked to nationalism.","That characterizes the Enlightenment and classicism.","Romantics often criticized industrialization.","That characterizes later Realism."],"answer":0},"u7q4":{"id":"u7q4","unit":7,"diff":"e","pool":"exam2","stem":"<p>Giuseppe Mazzini is best known for<\/p>","options":["founding Young Italy","serving as Austria's foreign minister","leading the Decembrist Revolt","painting Liberty Leading the People","writing The Communist Manifesto"],"why":["Mazzini was the prophet of Italian nationalism.","That was Metternich.","That took place in Russia in 1825.","That was Delacroix.","That was Marx and Engels."],"answer":0},"u7q5":{"id":"u7q5","unit":7,"diff":"e","pool":"quiz","stem":"<p>The July Revolution of 1830 in France replaced Charles X with<\/p>","options":["Louis XVIII","Louis XVI","Napoleon III","Napoleon Bonaparte","Louis-Philippe"],"why":["Louis XVIII ruled 1814–1824.","Louis XVI was executed in 1793.","Louis Napoleon became president in 1848 and emperor in 1852.","Napoleon died in exile in 1821.","The \"citizen king\" ruled until 1848."],"answer":4},"u7q6":{"id":"u7q6","unit":7,"diff":"e","pool":"quiz","stem":"<p>Which of the following won its independence from the Ottoman Empire in the 1820s with help from Britain, France and Russia?<\/p>","options":["Poland","Hungary","Greece","Italy","Belgium"],"why":["Poland was under Russian rule, and its 1830 revolt failed.","Hungary was part of the Austrian Empire.","Navarino (1827) and Russian pressure secured Greek independence.","Italy was not united until 1861 and was not under the Ottomans.","Belgium broke away from the Netherlands in 1830."],"answer":2},"u7q7":{"id":"u7q7","unit":7,"diff":"e","pool":"exam1","stem":"<p>The Carlsbad Decrees (1819) were designed to<\/p>","options":["abolish serfdom in Austria","grant liberal constitutions to all the German states","unify Germany under Prussia","create a customs union among the German states","silence nationalist students and the press"],"why":["Serfdom was abolished in 1848.","They restricted liberal movements.","They aimed to prevent nationalist agitation.","That was the Zollverein (1834).","Metternich used them to censor and dissolve student societies."],"answer":4},"u7q8":{"id":"u7q8","unit":7,"diff":"e","pool":"diag","stem":"<p>Which utopian socialist built a model industrial community at New Lanark, Scotland?<\/p>","options":["Robert Owen","Karl Marx","Jeremy Bentham","Edmund Burke","Lord Byron"],"why":["Owen provided schools, housing and shorter hours for his mill workers.","Marx rejected utopian experiments.","Bentham was a utilitarian philosopher.","Burke was a conservative.","Byron was a Romantic poet."],"answer":0},"u7q9":{"id":"u7q9","unit":7,"diff":"e","pool":"quiz","stem":"<p>The Frankfurt Parliament of 1848–1849 attempted to<\/p>","options":["abolish the Prussian army","elect Metternich as German emperor","partition Poland","unify Germany under a constitution","restore Napoleon's old Confederation of the Rhine"],"why":["It had no power over the army.","Metternich had fled Vienna.","It did not concern Poland's partition.","It offered the crown to Frederick William IV, who refused.","It sought a new national state."],"answer":3},"u7q10":{"id":"u7q10","unit":7,"diff":"m","pool":"exam2","stem":"<p>Most liberals in the early nineteenth century supported<\/p>","options":["universal suffrage for all adult men and women","the abolition of all government","absolute monarchy by divine right","constitutions with property qualifications for voting","state ownership of industry"],"why":["Most liberals opposed even universal male suffrage.","That is anarchist.","That is conservative or absolutist.","Liberals feared democracy as well as absolutism.","That is socialist."],"answer":3},"u7q11":{"id":"u7q11","unit":7,"diff":"m","pool":"exam2","stem":"<blockquote>\"A nation is a community of people united by a common language, history and spirit; every such people has the right to govern itself in its own state.\"<\/blockquote><p>This statement best expresses the ideology of<\/p>","options":["utopian socialism","utilitarianism","conservatism, as defended by Metternich","nationalism","laissez-faire liberalism"],"why":["Socialists focused on class, not nation.","Utilitarianism judges by the greatest happiness, not by nationhood.","Metternich opposed nationalism as a threat to the Austrian Empire.","It defines the nation by culture and claims a right to statehood.","This statement concerns national self-rule, not markets."],"answer":3},"u7q12":{"id":"u7q12","unit":7,"diff":"m","pool":"quiz","stem":"<p>Why was Metternich especially hostile to nationalism?<\/p>","options":["Nationalism was a conservative ideology","It threatened to break apart the multinational Austrian Empire","Austria was a nation-state with one language","Nationalism required the restoration of the Holy Roman Empire","Austria wanted to unite Italy under its rule"],"why":["In 1815 nationalism was revolutionary.","Austria ruled Germans, Hungarians, Czechs, Poles, Italians and others.","Austria was the opposite.","Nationalists sought new nation-states.","Austria opposed Italian unification."],"answer":1},"u7q13":{"id":"u7q13","unit":7,"diff":"m","pool":"exam1","stem":"<p>Utopian socialists differed from Marx in that they<\/p>","options":["sought change by example, not revolution","supported laissez-faire capitalism","wanted to restore absolute monarchy","were all government officials","denied that workers suffered under the new industrial system"],"why":["Owen and Fourier built model communities; Marx predicted revolution.","They criticized capitalist competition.","They sought social reform.","Most were private reformers and writers.","They were responding to workers' suffering."],"answer":0},"u7q14":{"id":"u7q14","unit":7,"diff":"m","pool":"exam1","stem":"<p>The revolutions of 1848 failed mainly because<\/p>","options":["the revolutionaries were divided","no revolutions broke out anywhere outside France","Britain sent armies to restore the monarchs of central Europe","the revolutionaries had won universal suffrage everywhere","Marx ordered the workers to stop fighting"],"why":["Divisions let monarchs regain control in 1848–49.","Revolution spread across central Europe and Italy.","Britain did not intervene; Russia did in Hungary.","They had not.","Marx had no such authority."],"answer":0},"u7q15":{"id":"u7q15","unit":7,"diff":"m","pool":"quiz","stem":"<p>Which was a lasting result of the 1848 revolutions in the Austrian Empire?<\/p>","options":["The abolition of serfdom","The unification of Germany under Austria","Hungarian independence","Metternich's permanent return to power","The creation of a democratic republic"],"why":["The emancipation of 1848 was not reversed.","Germany was unified in 1871 without Austria.","Hungary was crushed in 1849, with Russian help.","Metternich never regained office.","The Habsburg monarchy survived under Franz Joseph."],"answer":0},"u7q16":{"id":"u7q16","unit":7,"diff":"m","pool":"exam1","stem":"<p>The June Days of 1848 in Paris were caused by<\/p>","options":["the arrival of Russian troops","Napoleon III's coup d'état","Charles X's July Ordinances","the closing of the National Workshops","the publication of the Communist Manifesto in February"],"why":["Russian troops intervened in Hungary, not France.","The coup came in December 1851.","Those caused the 1830 revolution.","Workers rose in protest and were crushed by the army.","The Manifesto had little immediate effect."],"answer":3},"u7q17":{"id":"u7q17","unit":7,"diff":"m","pool":"exam2","stem":"<p>Which work of art is most associated with the Romantic glorification of revolution?<\/p>","options":["Picasso's Guernica","Courbet's The Stone Breakers","Monet's Impression, Sunrise","Delacroix's Liberty Leading the People","David's Oath of the Horatii"],"why":["That dates from 1937.","That is a Realist painting of 1849.","That is Impressionist, from 1872.","Painted after the July Revolution of 1830.","That is a Neoclassical painting of 1784."],"answer":3},"u7q18":{"id":"u7q18","unit":7,"diff":"m","pool":"exam2","stem":"<p>Frederick William IV of Prussia refused the crown offered by the Frankfurt Parliament because<\/p>","options":["he wanted Austria's emperor to rule a united Germany","he had already been crowned emperor of Germany","he scorned a crown offered by a parliament","Napoleon III threatened war","Prussia had become a republic"],"why":["He did not refuse in order to favor Austria.","There was no German emperor until 1871.","He called it a \"crown from the gutter.\"","Napoleon III did not stop him.","Prussia remained a monarchy."],"answer":2},"u7q19":{"id":"u7q19","unit":7,"diff":"m","pool":"quiz","stem":"<p>Jeremy Bentham's utilitarianism held that<\/p>","options":["history is driven by class struggle","property is theft","laws should produce the greatest happiness","tradition is the best guide for government and law","each nation has a unique spirit expressed in its language"],"why":["That is Marxism.","That is Proudhon.","Utility was the test of good policy.","That is a conservative view.","That is Herder's nationalism."],"answer":2},"u7q20":{"id":"u7q20","unit":7,"diff":"m","pool":"quiz","stem":"<p>Which event of 1825 showed the influence of Western liberal ideas on the Russian army officer class?<\/p>","options":["The Decembrist Revolt","The Greek War of Independence","The emancipation of the serfs","The November Uprising","The Crimean War"],"why":["Officers who had seen Europe during the Napoleonic wars rebelled for a constitution.","That was an Ottoman, not Russian, revolt.","That came in 1861.","That was a Polish revolt in 1830.","That came in 1853–56."],"answer":0},"u7q21":{"id":"u7q21","unit":7,"diff":"m","pool":"quiz","stem":"<p>In 1848, Louis Napoleon Bonaparte won the French presidential election largely because<\/p>","options":["his famous name promised order","he had led the workers in the June Days","he was the official candidate of the Communist League","only aristocrats were allowed to vote in the election","the Concert of Europe appointed him"],"why":["Voters chose stability after the June Days.","He was not involved in the June Days.","He ran on order and his uncle's legend.","The 1848 election used universal male suffrage.","He was elected by French voters."],"answer":0},"u7q22":{"id":"u7q22","unit":7,"diff":"m","pool":"quiz","stem":"<p>Which statement about nationalism and Romanticism is most accurate?<\/p>","options":["Romanticism opposed the Greek struggle for independence from the Ottomans","Nationalism emerged only after 1900","Nationalism and Romanticism were both invented by Metternich","Romantics rejected all national traditions in favor of universal reason","Romantic interest in folk culture fed nationalism"],"why":["Romantics like Byron championed it.","It was a major force by 1815.","Metternich opposed nationalism.","That describes the Enlightenment more than Romanticism.","Collections like Grimm's tales celebrated a people's heritage."],"answer":4},"u7q23":{"id":"u7q23","unit":7,"diff":"h","pool":"quiz","stem":"<p>A liberal in 1830 and a socialist in 1848 would most likely have disagreed about<\/p>","options":["whether constitutions were needed","whether absolute monarchy was desirable","private property and free markets","whether the Congress of Vienna's settlement should be preserved","whether censorship should be ended"],"why":["Most of both groups supported constitutions.","Both opposed absolute monarchy.","Liberals defended property and laissez-faire; socialists attacked them.","Both generally criticized it.","Both generally opposed censorship."],"answer":2},"u7q24":{"id":"u7q24","unit":7,"diff":"h","pool":" ":"<p>Which comparison of the revolutions of 1830 and 1848 in France is most accurate?<\/p>","options":["1830 abolished slavery in the colonies and 1848 restored it","Both established permanent republics","Neither had any influence outside France","1830 changed kings; 1848 created a republic","Both were led by Napoleon III"],"why":["France abolished slavery in its colonies in 1848.","The Second Republic ended in 1852.","Both inspired revolts abroad.","The July Monarchy kept a narrow electorate; the Second Republic expanded it.","Napoleon III came to power after 1848."],"answer":3},"u7q28":{"id":"u7q28","unit":7,"diff":"m","pool":"diag","stem":"<p>Which pairing of a Romantic figure and his work is correct?<\/p>","options":["Byron – The Wealth of Nations","Goethe – Faust","Wordsworth – The Communist Manifesto","Delacroix – Leviathan","Victor Hugo – The Social Contract"],"why":["Adam Smith wrote that.","Goethe's Faust is a landmark of German literature.","Marx and Engels wrote the Manifesto.","Hobbes wrote Leviathan.","Rousseau wrote that."],"answer":1},"u7q29":{"id":"u7q29","unit":7,"diff":"m","pool":"exam1","stem":"<p>Nicholas I's slogan \"Orthodoxy, Autocracy, Nationality\" expressed<\/p>","options":["the principles of the Greek revolutionaries of the 1820s","the platform of the Frankfurt Parliament","Marx's program for revolution","the tsar's conservative program","the goals of the Decembrists"],"why":["The Greeks fought for independence from the Ottomans.","That was a German liberal body.","Marx rejected religion and autocracy.","It defended the Church, absolute rule and Russian identity.","The Decembrists wanted a constitution."],"answer":3},"u8q1":{"id":"u8q1","unit":8,"diff":"e","pool":"exam1","stem":"<p>Who was the Prussian leader most responsible for the unification of Germany?<\/p>","options":["Klemens von Metternich","William II","Otto von Bismarck","Camillo di Cavour","Frederick the Great"],"why":["Metternich was an Austrian who opposed German nationalism.","William II became Kaiser in 1888, after unification.","As minister-president and chancellor, he unified Germany through three wars.","Cavour unified northern Italy.","Frederick ruled Prussia in the 1700s."],"answer":2},"u8q2":{"id":"u8q2","unit":8,"diff":"e","pool":"diag","stem":"<p>Giuseppe Garibaldi's Red Shirts conquered<\/p>","options":["Lombardy","Alsace-Lorraine","Sicily and Naples","Schleswig-Holstein","Venetia"],"why":["Lombardy was won by Piedmont and France in 1859.","Alsace-Lorraine was taken by Germany from France in 1871.","In 1860 Garibaldi took the Kingdom of the Two Sicilies and handed it to Victor Emmanuel II.","That was taken from Denmark by Prussia and Austria in 1864.","Venetia was gained in 1866 after the Austro-Prussian War."],"answer":2},"u8q3":{"id":"u8q3","unit":8,"diff":"e","pool":"exam2","stem":"<p>The German Empire was proclaimed in 1871 in<\/p>","options":["St. Peter's Basilica in Rome","the Reichstag building in Berlin","the Frankfurt Parliament","Vienna's Hofburg Palace","the Hall of Mirrors at Versailles"],"why":["Rome had no role in German unification.","The Reichstag building was completed in 1894.","That assembly failed in 1849.","Austria was excluded from the new Germany.","The location deliberately humiliated defeated France."],"answer":4},"u8q4":{"id":"u8q4","unit":8,"diff":"e","pool":"quiz","stem":"<p>In 1861 Tsar Alexander II<\/p>","options":["emancipated Russia's serfs","was assassinated by revolutionaries","began the Crimean War","defeated Napoleon","created the Duma"],"why":["The emancipation freed more than 20 million serfs.","He was assassinated in 1881.","The war began in 1853 under Nicholas I.","That was Alexander I in 1812–14.","The Duma came after the Revolution of 1905."],"answer":0},"u8q5":{"id":"u8q5","unit":8,"diff":"e","pool":"quiz","stem":"<p>The Ausgleich (Compromise) of 1867 created<\/p>","options":["the German Empire","the Kingdom of Italy","the Dual Monarchy of Austria-Hungary","the Triple Entente","the Third French Republic"],"why":["That was proclaimed in 1871.","Italy was proclaimed in 1861.","Austria and Hungary got separate governments under one monarch.","That formed in 1907.","That emerged in 1870."],"answer":2},"u8q6":{"id":"u8q6","unit":8,"diff":"e","pool":"quiz","stem":"<p>The Dreyfus Affair in France centered on<\/p>","options":["the assassination of a French president by an anarchist","the Paris Commune of 1871","a scandal over the building of the Suez Canal","a Jewish officer falsely convicted of treason","France's defeat in the Crimean War"],"why":["The affair concerned Alfred Dreyfus's trial.","The Commune was a separate event.","The canal opened in 1869 without such a scandal.","The case exposed anti-Semitism in the army and society.","France was on the winning side in the Crimea."],"answer":3},"u8q7":{"id":"u8q7","unit":8,"diff":"e","pool":"exam2","stem":"<p>Which country fought against Russia in the Crimean War?<\/p>","options":["Prussia","Britain","Germany","Austria","The United States"],"why":["Prussia stayed neutral.","Britain and France joined the Ottoman Empire against Russia.","Germany did not exist as a unified state until 1871.","Austria stayed neutral, which angered Russia.","The United States did not take part."],"answer":1},"u8q8":{"id":"u8q8","unit":8,"diff":"e","pool":"quiz","stem":"<p>Bismarck's statement that great questions would be decided \"by iron and blood\" reflected his belief in<\/p>","options":["liberal parliamentary government","Marxist class struggle","Realpolitik","pacifism and international law","religious toleration"],"why":["Bismarck defied the liberal Prussian parliament.","Bismarck fought socialism.","He unified Germany through war, not parliamentary debate.","Bismarck relied on force.","The phrase concerns power politics."],"answer":2},"u8q9":{"id":"u8q9","unit":8,"diff":"e","pool":"exam2","stem":"<p>Which three countries formed the Triple Entente?<\/p>","options":["Germany, Austria-Hungary and Italy","Russia, Prussia and Austria","Britain, Germany and Austria-Hungary","Britain, France and Russia","France, Italy and the Ottoman Empire"],"why":["That was the Triple Alliance.","That was the old Holy Alliance core.","Britain was aligned against Germany.","The Entente took shape between 1894 and 1907.","This was not an alliance bloc."],"answer":3},"u8q10":{"id":"u8q10","unit":8,"diff":"e","pool":"exam1","stem":"<p>Which statesman served as prime minister of Piedmont-Sardinia and led the diplomacy of Italian unification?<\/p>","options":["Victor Emmanuel II","Giuseppe Garibaldi","Napoleon III","Giuseppe Mazzini","Camillo di Cavour"],"why":["He was king, not prime minister.","Garibaldi was a guerrilla leader, not prime minister.","He was emperor of the French.","Mazzini was a republican idealist, not Piedmont's prime minister.","Cavour won French support and annexed northern and central Italy."],"answer":4},"u8q11":{"id":"u8q11","unit":8,"diff":"e","pool":"exam1","stem":"<p>Who wrote the open letter \"J'accuse!\" (1898) defending Alfred Dreyfus?<\/p>","options":["Georges Clemenceau","Karl Marx","Theodor Herzl","Émile Zola","Victor Hugo"],"why":["Clemenceau published the letter in his newspaper but did not write it.","Marx died in 1883.","Herzl reported on the affair but did not write \"J'accuse!\"","Zola accused the army of covering up Dreyfus's innocence.","Hugo died in 1885."],"answer":3},"u8q12":{"id":"u8q12","unit":8,"diff":"m","pool":"exam2","stem":"<p>Cavour sent Piedmontese troops to fight in the Crimean War mainly to<\/p>","options":["spread Mazzini's republican ideas","support Austria's control of Lombardy and Venetia","win allies for Italy's cause","conquer the Crimea for Italy","help Russia defeat the Ottoman Empire"],"why":["Cavour was a monarchist.","Cavour wanted to drive Austria out.","Participation won Piedmont a voice at the Paris peace conference.","Piedmont sought no territory there.","Piedmont fought against Russia."],"answer":2},"u8q13":{"id":"u8q13","unit":8,"diff":"m","pool":"quiz","stem":"<p>Which event in the unification era came LAST?<\/p>","options":["The Battle of Königgrätz","The Danish War","The proclamation of the Kingdom of Italy","The Crimean War","The proclamation of the German Empire"],"why":["The Battle of Königgrätz dates from 1866, earlier than January 1871.","The Danish War dates from 1864, earlier than January 1871.","The proclamation of the Kingdom of Italy dates from 1861, earlier than January 1871.","The Crimean War dates from 1853–56, earlier than January 1871.","The proclamation of the German Empire dates from January 1871, the latest of the five."],"answer":4},"u8q14":{"id":"u8q14","unit":8,"diff":"m","pool":"exam2","stem":"<p>Bismarck's purpose in creating health, accident and old-age insurance in the 1880s was to<\/p>","options":["undercut the socialists","satisfy demands made by the Frankfurt Parliament","prepare for war against Russia","reward the Catholic Church for its support in the Reichstag","carry out Marx's program"],"why":["It was \"state socialism\" to undercut the SPD.","That body had dissolved in 1849.","The insurance laws were domestic social policy.","He had fought the Church in the Kulturkampf.","Bismarck was a conservative opponent of Marxism."],"answer":0},"u8q15":{"id":"u8q15","unit":8,"diff":"m","pool":"exam2","stem":"<p>The Franco-Prussian War resulted in<\/p>","options":["a Franco-German alliance against Russia and Britain","Austria's entry into the German Empire","German annexation of Alsace-Lorraine","France's annexation of the Rhineland","the restoration of Napoleon III's power"],"why":["France and Russia later allied against Germany.","Austria was excluded.","France also paid a large indemnity.","France lost territory.","His empire collapsed after Sedan."],"answer":2},"u8q16":{"id":"u8q16","unit":8,"diff":"m","pool":"exam1","stem":"<p>Which statement about the emancipation of the Russian serfs (1861) is accurate?<\/p>","options":["It immediately made Russia a constitutional monarchy with a parliament","Peasants owed redemption payments for land","It applied only to Russian Poland","Peasants received land free of charge as private property","It was a result of a successful peasant revolution"],"why":["Russia remained an autocracy.","Freedom came with heavy burdens.","It applied across the empire.","They paid for it over decades.","It was a reform from above."],"answer":1},"u8q17":{"id":"u8q17","unit":8,"diff":"m","pool":"diag","stem":"<p>Why did Bismarck impose a lenient peace on Austria in 1866?<\/p>","options":["Because Austria had won the war","To keep Austria as a future ally","To win Austria's support for a later war with Britain","Because France threatened to invade Prussia","Because the Frankfurt Parliament demanded it"],"why":["Prussia won decisively at Königgrätz.","He wanted Austria out of Germany, not humiliated.","Germany and Britain were not at war.","France's role was not the reason.","That parliament no longer existed."],"answer":1},"u8q18":{"id":"u8q18","unit":8,"diff":"m","pool":"quiz","stem":"<p>The Kulturkampf was Bismarck's campaign against<\/p>","options":["the Social Democratic Party","Jewish immigration from the Russian Empire","the Prussian Junkers","the Catholic Church","Austria-Hungary"],"why":["That was the Anti-Socialist Laws of 1878.","The Kulturkampf targeted Catholicism.","Junkers were Bismarck's own class and allies.","Laws in the 1870s restricted clergy and Catholic schools.","Kulturkampf was a domestic cultural struggle."],"answer":3},"u8q19":{"id":"u8q19","unit":8,"diff":"m","pool":"exam1","stem":"<p>The Congress of Berlin (1878) is significant because it<\/p>","options":["unified Germany","created the League of Nations","cut back Russia's gains, angering it","ended the Crimean War","divided Africa among the European colonial powers"],"why":["Unification came in 1871.","The League was created in 1919–20.","Bismarck's \"honest broker\" settlement cut Bulgaria down and let Austria occupy Bosnia.","That was the Treaty of Paris (1856).","That was the Berlin Conference of 1884–85."],"answer":2},"u8q20":{"id":"u8q20","unit":8,"diff":"m","pool":"exam2","stem":"<p>The French Third Republic's response to the Paris Commune in 1871 was to<\/p>","options":["negotiate a power-sharing government with the Commune's leaders","adopt the Commune's socialist program","crush it by force","restore Napoleon III","invite Prussia to restore order"],"why":["There was no compromise.","The Republic suppressed it.","\"Bloody Week\" left lasting class bitterness.","Napoleon III had been deposed.","The French army did it."],"answer":2},"u8q21":{"id":"u8q21","unit":8,"diff":"m","pool":"exam1","stem":"<p>After 1890, William II's foreign policy differed from Bismarck's in that William<\/p>","options":["withdrew from the alliance with Austria-Hungary","dropped the treaty with Russia","reduced the size of the German navy","gave Alsace-Lorraine back to France","sought to keep France isolated through close alliances with Russia"],"why":["The Dual Alliance remained.","This pushed Russia toward France and alarmed Britain.","William expanded the navy.","Germany kept it until 1918.","That was Bismarck's approach."],"answer":1},"u8q22":{"id":"u8q22","unit":8,"diff":"m","pool":"quiz","stem":"<p>Which reform passed by Disraeli's Conservative government in 1867 extended the vote in Britain?<\/p>","options":["The Parliament Act","The Second Reform Act","The Corn Law repeal","The Great Reform Act","The Factory Act"],"why":["That was passed in 1911 and limited the House of Lords.","It enfranchised many urban working-class men.","That was in 1846.","That was passed in 1832 by the Whigs.","That regulated labor, not voting."],"answer":1},"u8q23":{"id":"u8q23","unit":8,"diff":"m","pool":"exam1","stem":"<blockquote>\"Socialism will come not through a sudden catastrophe but through the steady extension of democracy and reforms won by workers' parties in parliament.\"<\/blockquote><p>This statement best reflects at was decades earlier.","That was a German campaign.","The affair discredited the army and Catholic right."],"answer":4},"u8q27":{"id":"u8q27","unit":8,"diff":"m","pool":"exam2","stem":"<p>The Franco-Russian Alliance of 1894 was significant because it<\/p>","options":["led to the unification of Italy","ended the Crimean War","created the Dual Monarchy","united France and Germany against Britain in Africa","threatened Germany with a two-front war"],"why":["Italy had been unified by 1870.","That war ended in 1856.","The Dual Monarchy came in 1867.","France was allied with Russia against Germany.","Bismarck had worked to prevent exactly this."],"answer":4},"u8q28":{"id":"u8q28","unit":8,"diff":"m","pool":"quiz","stem":"<p>Which of the following was a weakness of the German Empire's constitution?<\/p>","options":["It denied the vote to all men","It required unanimous approval from all member states for any law","It abolished the Prussian monarchy","It made Germany a republic","The chancellor answered only to the Kaiser"],"why":["The Reichstag was elected by universal male suffrage.","There was no such rule.","The Prussian king was the German emperor.","Germany became a republic only in 1918.","Universal male suffrage elected a parliament with limited control over government."],"answer":4},"u8q29":{"id":"u8q29","unit":8,"diff":"m","pool":"quiz","stem":"<p>Russification under Alexander III involved<\/p>","options":["moving the capital to Moscow","freeing the serfs","forcing Russian ways on minorities","adopting a Western-style constitutional government","giving independence to Finland"],"why":["The capital moved to Moscow in 1918, under the Bolsheviks.","That was Alexander II in 1861.","Poles, Finns, Ukrainians, Jews and others faced pressure.","Alexander III was a reactionary.","Finland gained independence in 1917."],"answer":2},"u8q30":{"id":"u8q30","unit":8,"diff":"h","pool":"diag","stem":"<p>Which statement best compares the unification of Italy and Germany?<\/p>","o ance of 1894","the Revolution of 1905"],"why":["Russification came later, under Alexander III.","That came in 1881, after the reforms.","Alexander II concluded Russia must modernize to remain a great power.","That came in 1894.","These reforms came in the 1860s."],"answer":2},"u8q34":{"id":"u8q34","unit":8,"diff":"h","pool":"exam1","stem":"<p>Bismarck's alliance system after 1871 was designed primarily to<\/p>","options":["prepare Germany to conquer Russia","keep France isolated","encourage French expansion within Europe","break up Austria-Hungary","support British naval supremacy in the North Sea"],"why":["He sought peace with Russia.","He wanted no ally for a revenge-seeking France.","He wanted France contained in Europe.","Austria-Hungary was his main ally.","His system concerned continental alliances."],"answer":1},"u8q35":{"id":"u8q35","unit":8,"diff":"h","pool":"quiz","stem":"<p>The Dreyfus Affair is significant in European history beyond France because it<\/p>","options":["helped inspire political Zionism","ended the Russian monarchy","established the first communist government in Europe","led to the unification of Germany","started the First World War"],"why":["Theodor Herzl concluded that assimilation would not protect Jews.","That happened in 1917.","That was in Russia in 1917.","Unification preceded it.","The war began in 1914 with the Sarajevo assassination."],"answer":0},"u8q36":{"id":"u8q36","unit":8,"diff":"h","pool":"quiz","stem":"<p>The Paris Commune of 1871 was later celebrated by Marxists because they saw it as<\/p>","options":["a victory for the French monarchy","an early example of workers' self-government","proof that revolution could succeed only with Prussian help","a successful alliance of workers and the army","the start of the Third Republic's conservative policies"],"why":["The Commune was radically anti-monarchist.","Marx praised it as a model of a proletarian state.","The Commune was crushed by French forces.","The army crushed it.","Marxists celebrated the Commune itself, not its suppression."],"answer":1},"u8q37":{"id":"u8q37","unit":8,"diff":"h","pool":"exam1","stem":"<p>Which development MOST weakened Bismarck's goal of isolating France?<\/p>","options":["The Dual Alliance of 1879","The Kulturkampf","The Franco-Russian Alliance of 1894","The Triple Alliance of 1882","The Congress of Berlin of 1878"],"why":["That was an alliance with Austria-Hungary.","That was a domestic campaign.","It gave France a great-power ally on Germany's eastern border.","That strengthened Germany's position.","It angered Russia but did not yet ally it with France."],"answer":2},"u8q38":{"id":"u8q38","unit":8,"diff":"m","pool":"exam1","stem":"<p>The Revolution of 1905 in Russia led Nicholas II to<\/p>","options":["emancipate the serfs","withdraw from the Triple Alliance with Germany","sign the Treaty of Brest-Litovsk","abdicate in favor of a republic","promise an elected Duma"],"why":["The serfs were freed in 1861.","Russia was never in the Triple Alliance.","That was signed by the Bolsheviks in 1918.","He abdicated in 1917.","He conceded a parliament, then limited its powers."],"answer":4},"u9q1":{"id":"u9q1","unit":9,"diff":"e","pool":"quiz","stem":"<p>Charles Darwin's On the Origin of Species (1859) proposed that<\/p>","options":["species evolve through natural selection","the universe operates according to universal gravitation","human behavior is driven by the unconscious","history is the history of class struggle","time and space are relative"],"why":["Organisms with advantageous traits survive and reproduce more.","That was Newton.","That was Freud.","That was Marx.","That was Einstein."],"answer":0},"u9q2":{"id":"u9q2","unit":9,"diff":"e","pool":"exam1","stem":"<p>The Berlin Conference of 1884–1885 established rules for<\/p>","options":["dividing Poland","ending the Crimean War on the Black Sea","dividing Africa","the unification of Germany","the Concert of Europe's intervention in Spain"],"why":["Poland had been partitioned in the 1700s.","That war ended in 1856.","Its \"effective occupation\" rule governed the Scramble for Africa.","Germany had been unified in 1871.","That was in the 1820s."],"answer":2},"u9q3":{"id":"u9q3","unit":9,"diff":"e","pool":"diag","stem":"<p>Sigmund Freud is best known for<\/p>","options":["painting Les Demoiselles d'Avignon","writing On the Origin of Species","discovering radioactivity with Pierre Curie","founding psychoanalysis","formulating the theory of relativity"],"why":["That was Picasso.","That was Darwin.","That was Marie and Pierre Curie (with Becquerel).","The Interpretation of Dreams (1900) is his landmark work.","That was Einstein."],"answer":3},"u9q4":{"id":"u9q4","unit":9,"diff":"e","pool":"quiz","stem":"<p>Which African country defeated Italy at the Battle of Adwa (1896) and kept its independence?<\/p>","options":["Ethiopia","South Africa","Algeria","Congo","Egypt"],"why":["Ethiopia's victory preserved its independence.","South Africa was a British sphere.","Algeria was a French colony from 1830.","The Congo was Leopold II's personal colony.","Egypt was occupied by Britain from 1882."],"answer":0},"u9q5":{"id":"u9q5","unit":9,"diff":"e","pool":"exam2","stem":"<p>Impressionist painters such as Claude Monet focused on<\/p>","options":["capturing fleeting effects of light and color","breaking objects into geometric planes","realistic portraits of rulers","depicting religious scenes in the Renaissance style","glorifying the French Revolution"],"why":["They often painted outdoors.","That was Cubism.","Impressionists avoided formal academic portraiture.","Impressionists painted modern life and landscape.","That fits Romantic painting such as Delacroix."],"answer":0},"u9q6":{"id":"u9q6","unit":9,"diff":"e","pool":"exam2","stem":"<p>Which philosopher declared \"God is dead\" and called for a revaluation of values?<\/p>","options":["Karl Marx","Auguste Comte","Charles Darwin","John Stuart Mill","Friedrich Nietzsche"],"why":["Marx called
