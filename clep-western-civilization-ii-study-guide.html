n-step\"><span class=\"chain-label\">Event<\/span>Enlightened despots adopt rational reforms from the philosophes<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Real gains in law, toleration and administration, but no sharing of power and serfdom mostly untouched<\/div><\/div>\n<p><strong>Frederick II (the Great) of Prussia<\/strong> (r. 1740–1786) corresponded with Voltaire and hosted him at his palace. He called himself \"the <strong>first servant of the state<\/strong>,\" abolished torture, granted wide religious toleration, reformed the courts and promoted agriculture. But he kept serfdom and relied on the Junkers to staff his army.<\/p>\n<p><strong>Catherine II (the Great) of Russia<\/strong> (r. 1762–1796) corresponded with Voltaire and Diderot and called a Legislative Commission in 1767 to reform Russian law. After the huge peasant revolt led by <strong>Emelian Pugachev<\/strong> (1773–1775), she sided firmly with the nobles: her <strong>Charter of the Nobility (1785)<\/strong> freed nobles from state service and confirmed their power over serfs. Serfdom expanded under her rule. She also expanded Russia south to the Black Sea at the expense of the Ottomans.<\/p>\n<p><strong>Joseph II of Austria<\/strong> (r. 1780–1790) was the most radical. His <strong>Edict of Toleration (1781)<\/strong> gave rights to Protestants and Orthodox Christians, and he eased restrictions on Jews. He <strong>abolished serfdom<\/strong> and tried to replace labor services with money rents, closed hundreds of monasteries and imposed German as the language of administration. Nobles, clergy and non-German peoples resisted so fiercely that his successor, Leopold II, cancelled most of his reforms. Joseph's failure shows how hard it was to impose reform from above.<\/p>\n<h3>Toleration, reform and the limits of the Enlightenment<\/h3>\n<p>Toleration was the cause that united almost every philosophe. Religious wars and persecution, they argued, came from <strong>fanaticism<\/strong> and <strong>superstition<\/strong>, and a rational state should leave belief to the individual. The German Jewish philosopher <strong>Moses Mendelssohn<\/strong> argued that Jews could be loyal citizens and full participants in European culture, and his friend Gotthold Lessing's play <em>Nathan the Wise<\/em> (1779) pleaded for respect among Jews, Christians and Muslims. Some states moved slowly toward legal equality: Joseph II eased restrictions on Jews in the 1780s, and revolutionary France granted Jews full citizenship in 1791.<\/p>\n<p>Enlightenment writers also began to attack <strong>slavery<\/strong>. Montesquieu ridiculed the arguments used to defend it, the <em>Encyclopedia<\/em> condemned it, and by the 1780s abolition societies had formed in Britain and France. Their success came later: Britain abolished the slave trade in 1807.<\/p>\n<p>Yet the Enlightenment had clear limits. Most philosophes were <strong>reformers, not democrats<\/strong>. Voltaire hoped for a wise king, not rule by the uneducated masses. Many assumed that women's nature suited them for the home, and some, including Hume, wrote that non-Europeans were inferior. Critics then and since have pointed out that \"reason\" was often defined by and for educated European men.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Philosophes teach that institutions should be judged by reason and utility<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Readers begin to question privilege, censorship and arbitrary power<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>In 1789 French revolutionaries put Enlightenment principles (rights, popular sovereignty, separation of powers) into practice<\/div><\/div>\n<p>The Enlightenment's most lasting legacy is the idea of <strong>progress<\/strong>: that human beings can use reason to understand their world and make it better. Its political ideas (natural rights, separation of powers, popular sovereignty, toleration, free markets) became the program of the <strong>American and French Revolutions<\/strong> (Unit 5) and of nineteenth-century <strong>liberalism<\/strong> (Unit 7).<\/p>\n<h3>The partitions of Poland<\/h3>\n<p><strong>Poland-Lithuania<\/strong> was a large but weak state. Its nobles elected the king, and any single noble could block legislation in the parliament (the <strong>liberum veto<\/strong>). Its neighbors exploited the weakness.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Poland's elected kings and the liberum veto leave it with no strong government or army<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Russia, Prussia and Austria agree to take Polish territory in 1772, 1793 and 1795<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Poland disappears from the map until 1918<\/div><\/div>\n<p>In the <strong>First Partition (1772)<\/strong>, Russia, Prussia and Austria took about a third of its territory. Poland tried to reform and adopted a modern <strong>constitution in May 1791<\/strong>. Russia and Prussia answered with the <strong>Second Partition (1793)<\/strong>. A national uprising led by <strong>Tadeusz Kościuszko<\/strong> failed, and the <strong>Third Partition (1795)<\/strong> erased Poland entirely. The partitions show that \"enlightened\" rulers still practiced old-fashioned power politics.<\/p>","words":1458,"minutes":10,"mustKnow":["<strong>Philosophes<\/strong> applied reason to society; ideas spread through <strong>salons<\/strong>, coffeehouses, print and the <strong>Encyclopedia<\/strong> (Diderot).","<strong>Voltaire:<\/strong> toleration, satire (<em>Candide<\/em>), anti-clerical \"Crush the infamous thing,\" deism.","<strong>Montesquieu:<\/strong> <em>The Spirit of the Laws<\/em> (1748): separation of powers, checks and balances.","<strong>Rousseau:<\/strong> <em>The Social Contract<\/em> (1762): general will, popular sovereignty; \"Man is born free, and everywhere he is in chains.\"","<strong>Adam Smith:<\/strong> <em>The Wealth of Nations<\/em> (1776): laissez-faire, invisible hand, division of labor.","<strong>Beccaria:<\/strong> <em>On Crimes and Punishments<\/em> (1764): against torture and the death penalty.","<strong>Wollstonecraft:<\/strong> <em>A Vindication of the Rights of Woman<\/em> (1792): education and reason for women.","<strong>Deism:<\/strong> God the clockmaker; no miracles or revealed religion needed.","<strong>Enlightened despots:<\/strong> Frederick II (\"first servant of the state\"), Catherine II (Pugachev revolt → Charter of the Nobility), Joseph II (Edict of Toleration, abolished serfdom; reforms reversed).","<strong>Partitions of Poland:<\/strong> 1772, 1793, 1795 by Russia, Prussia, Austria; Poland vanishes until 1918."],"timeline":[{"y":"1733","label":"Voltaire's Letters on the English","note":"Praises English tolerance and liberty","key":false},{"y":"1748","label":"Montesquieu's The Spirit of the Laws","note":"Separation of powers","key":true},{"y":"1751","label":"Encyclopedia begins","note":"Diderot and d'Alembert's great project","key":true},{"y":"1759","label":"Voltaire's Candide","note":"Satire of optimism","key":false},{"y":"1762","label":"Rousseau's The Social Contract","note":"General will; Catherine II takes power","key":true},{"y":"1764","label":"Beccaria's On Crimes and Punishments","note":"Against torture and execution","key":false},{"y":"1772","label":"First Partition of Poland","note":"Russia, Prussia and Austria take territory","key":true},{"y":"1773–1775","label":"Pugachev's Rebellion","note":"Massive Russian peasant revolt","key":false},{"y":"1776","label":"Adam Smith's The Wealth of Nations","note":"Laissez-faire economics","key":true},{"y":"1781","label":"Joseph II's Edict of Toleration","note":"Rights for non-Catholic Christians in Austria","key":false},{"y":"1784","label":"Kant's \"What Is Enlightenment?\"","note":"\"Dare to know!\"","key":false},{"y":"1785","label":"Catherine's Charter of the Nobility","note":"Nobles' privileges confirmed","key":false},{"y":"1792","label":"Wollstonecraft's Vindication of the Rights of Woman","note":"Early feminist argument","key":false},{"y":"1795","label":"Third Partition of Poland","note":"Poland disappears","key":true}],"cards":[{"id":"u4c1","front":"Philosophes","back":"French public intellectuals of the Enlightenment who applied reason to society.","person":false},{"id":"u4c2","front":"Salons","back":"Gatherings in private homes, often hosted by women, where Enlightenment ideas were debated.","person":false},{"id":"u4c3","front":"Denis Diderot","back":"Edited the Encyclopedia (1751–72), a summary of knowledge that criticized Church and state.","person":true},{"id":"u4c4","front":"Voltaire","back":"Toleration, satire (Candide), \"Crush the infamous thing\"; deist; defended Jean Calas.","person":true},{"id":"u4c5","front":"Montesquieu","back":"The Spirit of the Laws (1748): separation of powers and checks and balances.","person":true},{"id":"u4c6","front":"Jean-Jacques Rousseau","back":"The Social Contract (1762): the general will and popular sovereignty; Emile on education.","person":true},{"id":"u4c7","front":"General will","back":"Rousseau's idea of the community's collective will for the common good, the basis of legitimate law.","person":false},{"id":"u4c8","front":"Adam Smith","back":"The Wealth of Nations (1776): free markets, the invisible hand, division of labor.","person":true},{"id":"u4c9","front":"Laissez-faire","back":"Economic policy of minimal government interference in markets.","person":false},{"id":"u4c10","front":"Physiocrats","back":"French economists who said land is the source of wealth and urged free trade in grain.","person":false},{"id":"u4c11","front":"Cesare Beccaria","back":"On Crimes and Punishments (1764): opposed torture and the death penalty.","person":true},{"id":"u4c12","front":"Mary Wollstonecraft","back":"A Vindication of the Rights of Woman (1792): women deserve equal education and are capable of reason.","person":true},{"id":"u4c13","front":"Immanuel Kant","back":"\"Dare to know!\": Enlightenment means using your own reason without another's guidance.","person":true},{"id":"u4c14","front":"Deism","back":"Belief in a creator God who set natural laws in motion but does not intervene; rejects miracles.","person":false},{"id":"u4c15","front":"Enlightened despotism","back":"Absolute monarchs using Enlightenment reforms to strengthen the state without sharing power.","person":false},{"id":"u4c16","front":"Frederick II (the Great)","back":"Prussian king (1740–86); \"first servant of the state\"; abolished torture; religious toleration.","person":true},{"id":"u4c17","front":"Catherine II (the Great)","back":"Russian empress (1762–96); corresponded with philosophes but strengthened serfdom after Pugachev's revolt.","person":true},{"id":"u4c18","front":"Joseph II","back":"Austrian emperor (1780–90); Edict of Toleration, abolished serfdom; most reforms reversed.","person":true},{"id":"u4c19","front":"Liberum veto","back":"Rule letting any single Polish noble block legislation; it crippled Poland's government.","person":false},{"id":"u4c20","front":"Partitions of Poland","back":"1772, 1793, 1795: Russia, Prussia and Austria divided Poland until it vanished.","person":false}],"hours":1.71,"quizIds":["u4q3","u4q5","u4q7","u4q11","u4q19","u4q22","u4q27","u4q31","u4q32","u4q33","u4q34","u4q35"]},{"id":5,"title":"Revolution and Napoleonic Europe","short":"Revolution & Napoleon","range":"1789–1815","weight":{"min":10,"max":13,"verified":true},"subtopics":["The Revolution in France","The Revolution in Europe","The Napoleonic era","Congress of Vienna"],"lesson":"<h3>The big picture<\/h3>\n<p>The <strong>French Revolution<\/strong> (1789–1799) and the age of <strong>Napoleon<\/strong> (1799–1815) are the most heavily tested topics on this exam, about one question in nine. In 26 years France went from absolute monarchy to constitutional monarchy, to radical republic, to Terror, to a corrupt conservative republic, to military dictatorship, to empire, and back to a Bourbon king. Along the way it spread the ideas of <strong>liberty, equality and nationalism<\/strong> across Europe. Learn the sequence of phases; many questions ask which came first or what caused what.<\/p>\n<h3>The Old Regime and its crisis<\/h3>\n<p>Before 1789, French society was divided into three legal orders called <strong>estates<\/strong>. The <strong>First Estate<\/strong> (clergy, under 1 percent of the population) and the <strong>Second Estate<\/strong> (nobility, about 2 percent) held privileges, above all freedom from most direct taxes such as the <em>taille<\/em>. The <strong>Third Estate<\/strong> was everyone else, about 97 percent: peasants, urban workers (the <strong>sans-culottes<\/strong>), and the wealthy, educated middle class, the <strong>bourgeoisie<\/strong> (merchants, lawyers, officials). The bourgeoisie resented being shut out of honors and offices by birth; peasants resented paying taxes, tithes and <strong>seigneurial dues<\/strong> to lords.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>War debts from the Seven Years' War and the American Revolution; tax-exempt privileged orders<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Royal bankruptcy forces Louis XVI to call the Estates-General (1789)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Third Estate seizes the initiative and turns a fiscal crisis into a revolution<\/div><\/div>\n<p>The trigger was <strong>money<\/strong>. Wars, especially French aid to the American Revolution, had left the crown so indebted that interest payments ate about half the budget. Louis XVI's ministers proposed taxing the privileged; an <strong>Assembly of Notables<\/strong> (1787) and the Paris <strong>parlement<\/strong> refused and insisted that only the <strong>Estates-General<\/strong>, unused since 1614, could approve new taxes. A bad harvest in 1788 doubled bread prices just as elections were held. The abbé <strong>Emmanuel-Joseph Sieyès<\/strong> captured the mood in his pamphlet <strong><em>What Is the Third Estate?<\/strong><\/em> (January 1789): \"Everything. What has it been until now? Nothing.\"<\/p>\n<h3>1789: the year of revolution<\/h3>\n<p>The Estates-General met at Versailles in <strong>May 1789<\/strong>. The key fight was over voting. If each estate voted as a body, the two privileged orders could outvote the Third Estate 2 to 1; the Third wanted voting <strong>by head<\/strong>, since it had as many deputies as the other two combined. On <strong>June 17<\/strong> the Third Estate declared itself the <strong>National Assembly<\/strong>. Locked out of its hall, it met on a tennis court and swore the <strong>Tennis Court Oath (June 20)<\/strong> not to disband until France had a constitution.<\/p>\n<p>When the king massed troops near Paris, crowds seeking gunpowder stormed the <strong>Bastille<\/strong>, a royal fortress-prison, on <strong>July 14, 1789<\/strong>. In the countryside, rumors of noble plots set off the <strong>Great Fear<\/strong>: peasants burned manor records of their dues. On the night of <strong>August 4<\/strong>, nobles in the Assembly gave up their feudal privileges. On <strong>August 26<\/strong> the Assembly adopted the <strong>Declaration of the Rights of Man and of the Citizen<\/strong>: men are born free and equal in rights; sovereignty rests in the nation; liberty, property, security and resistance to oppression are natural rights; all citizens are equal before the law and eligible for office by talent. In the <strong>October Days<\/strong>, thousands of Parisian women marched to Versailles over bread prices and forced the royal family to move to Paris.<\/p>\n<h3>The moderate (constitutional) phase, 1789–1792<\/h3>\n<p>The National Assembly remade France on liberal lines. It replaced the old provinces with 83 <strong>departments<\/strong>, abolished guilds and internal tolls, and seized <strong>Church lands<\/strong> to pay the debt, issuing paper money (<em>assignats<\/em>) backed by them. The <strong>Civil Constitution of the Clergy (1790)<\/strong> made priests state employees elected by citizens and required them to swear an oath to the constitution. The pope condemned it, about half the clergy refused the oath, and Catholic France split. This was the Revolution's first great mistake: it turned many devout peasants against it.<\/p>\n<p>The <strong>Constitution of 1791<\/strong> created a <strong>constitutional monarchy<\/strong> with a one-house Legislative Assembly. Only \"active citizens\" who paid a certain level of tax could vote, so it was a government of property owners. <strong>Olympe de Gouges<\/strong> answered with a <em>Declaration of the Rights of Woman<\/em> (1791), demanding equal rights for women; she was executed in 1793.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>The king's attempted flight (Varennes, June 1791) destroys trust; Austria and Prussia threaten intervention<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>France declares war on Austria (April 1792); Paris crowds overthrow the monarchy (August 1792)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>A republic is proclaimed; radicals take power in wartime<\/div><\/div>\n<p>In June 1791 Louis XVI tried to flee to the Austrian border and was caught at <strong>Varennes<\/strong>. Austria and Prussia's <strong>Declaration of Pillnitz<\/strong> (August 1791) hinted they would restore him. In <strong>April 1792<\/strong> the Assembly, eager to spread the Revolution, declared war on Austria. Early defeats and the Prussian commander's threat (the Brunswick Manifesto) to destroy Paris if the king were harmed led crowds to storm the Tuileries palace on <strong>August 10, 1792<\/strong>. In the <strong>September Massacres<\/strong>, mobs killed about 1,200 prisoners. A French victory at <strong>Valmy<\/strong> (September 20) stopped the invasion.<\/p>\n<h3>The radical phase and the Terror, 1792–1794<\/h3>\n<p>A new assembly, the <strong>National Convention<\/strong>, elected by universal male suffrage, abolished the monarchy and declared France a <strong>republic<\/strong> (September 1792). It tried the king as \"Citizen Louis Capet,\" and <strong>Louis XVI was executed in January 1793<\/strong>; Marie Antoinette followed in October. The Convention split between the more moderate <strong>Girondins<\/strong> and the radical <strong>Jacobins<\/strong> (the \"Mountain\"), who relied on the Paris sans-culottes. In June 1793 the Jacobins purged the Girondins.<\/p>\n<p>France was at war with almost all of Europe, and the Catholic, royalist <strong>Vendée<\/strong> region rose in civil war. To survive, the Convention gave dictatorial power to the twelve-man <strong>Committee of Public Safety<\/strong>, dominated by <strong>Maximilien Robespierre<\/strong>. It ordered the <strong>levée en masse<\/strong> (August 1793), the first national draft: all citizens were mobilized for total war. A huge, motivated citizen army began to win. The Committee imposed price controls (the <strong>Maximum<\/strong>) on bread and other goods.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Foreign invasion, civil war in the Vendée, and fear of traitors<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>The Reign of Terror (September 1793–July 1794): Committee of Public Safety, Law of Suspects, guillotine<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>About 17,000 official executions; the Republic survives, but the Terror devours its leaders<\/div><\/div>\n<p>The <strong>Reign of Terror<\/strong> used revolutionary tribunals and the <strong>guillotine<\/strong> against \"enemies of the Republic\": nobles, priests, Girondins, rebels, and eventually fellow Jacobins such as <strong>Georges Danton<\/strong>. About 17,000 people were officially executed and many more died in prison or in the brutal repression of the Vendée. Robespierre called terror \"nothing but justice, prompt, severe, inflexible,\" an emanation of virtue. The radicals also tried to remake culture: <strong>dechristianization<\/strong> closed churches, a new <strong>revolutionary calendar<\/strong> dated years from the Republic's founding (Year I = 1792), and Robespierre staged a deist <strong>Cult of the Supreme Being<\/strong>.<\/p>\n<h3>Europe reacts to the Revolution<\/h3>\n<p>The Revolution divided opinion everywhere. In Britain, the Irish-born politician <strong>Edmund Burke<\/strong> published <strong><em>Reflections on the Revolution in France<\/em> (1790)<\/strong>, predicting that tearing down ancient institutions in the name of abstract rights would end in bloodshed and dictatorship. Burke became the founder of modern <strong>conservatism<\/strong> (Unit 7). <strong>Thomas Paine<\/strong> answered with <strong><em>The Rights of Man<\/em> (1791)<\/strong>, defending the Revolution and popular sovereignty. Governments in Britain, Austria, Prussia and Russia cracked down on radicals at home, and from 1792 they fought France in a series of <strong>coalitions<\/strong>. As French armies advanced, they set up \"sister republics\" (such as the Batavian Republic in the Netherlands) that abolished feudal privileges, which made the Revolution an international force.<\/p>\n<h3>Thermidor and the Directory, 1794–1799<\/h3>\n<p>With the armies winning, the Terror seemed less necessary, and Convention members feared they were next. On 9 Thermidor (<strong>July 27, 1794<\/strong>) they arrested Robespierre and guillotined him the next day. This <strong>Thermidorian Reaction<\/strong> ended the Terror, closed the Jacobin Club and lifted price controls. The <strong>Constitution of 1795<\/strong> created the <strong>Directory<\/strong>: five executive Directors and a two-house legislature elected by property owners. The Directory was corrupt and unstable, beset by inflation, royalist and radical plots, and continuing war. It increasingly relied on the army, and especially on a young general from Corsica.<\/p>\n<h3>Napoleon Bonaparte<\/h3>\n<p><strong>Napoleon Bonaparte<\/strong> won fame by conquering northern Italy (1796–1797) and leading a campaign to <strong>Egypt<\/strong> (1798–1799), where scholars found the Rosetta Stone. In the <strong>coup of 18 Brumaire (November 9, 1799)<\/strong> he overthrew the Directory and became <strong>First Consul<\/strong>, then consul for life (1802) and finally <strong>Emperor of the French (1804)<\/strong>, crowning himself in Notre-Dame. Each step was approved by a <strong>plebiscite<\/strong>, a popular vote that gave dictatorship a democratic look.<\/p>\n<p>At home Napoleon consolidated the moderate gains of the Revolution and ended its chaos: - The <strong>Concordat of 1801<\/strong> with Pope Pius VII restored the Catholic Church in France while the state kept the confiscated Church lands and the right to nominate bishops. It made peace with Catholics. - The <strong>Napoleonic Code<\/strong> (Civil Code, 1804) guaranteed <strong>equality before the law<\/strong>, the abolition of feudal privilege, secure <strong>property rights<\/strong> and religious freedom. It also restored patriarchal authority: wives had to obey husbands and lost rights to property, and it reinstated limits on workers. The Code spread across Europe and still underlies law in many countries. - He created the <strong>Bank of France<\/strong>, a centralized administration of prefects, and elite secondary schools (<em>lycées<\/em>), and opened careers to talent. He also censored the press and used secret police.<\/p>\n<h3>The Napoleonic Empire<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Napoleon's victories over Austria, Prussia and Russia (1805–1807)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>French domination of the continent; Continental System against Britain<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Nationalist resistance (Spain, Germany) and the disastrous invasion of Russia lead to his fall<\/div><\/div>\n<p><strong>Britain<\/strong> remained his steadiest enemy. Admiral <strong>Horatio Nelson<\/strong> destroyed the French and Spanish fleets at <strong>Trafalgar (1805)<\/strong>, ending any hope of invading Britain. On land Napoleon seemed unbeatable: he crushed Austria and Russia at <strong>Austerlitz (1805)<\/strong>, abolished the <strong>Holy Roman Empire (1806)<\/strong> and grouped western German states into his <strong>Confederation of the Rhine<\/strong>, smashed Prussia at <strong>Jena (1806)<\/strong>, and made peace with Tsar Alexander I at <strong>Tilsit (1807)<\/strong>. He placed relatives on thrones in Spain, Naples, Holland and Westphalia and created the <strong>Duchy of Warsaw<\/strong> from Polish lands.<\/p>\n<p>To defeat Britain economically, his <strong>Continental System<\/strong> (Berlin Decree, 1806) banned trade with Britain throughout Europe. It hurt European economies more than Britain's and caused resentment. When Portugal and later Russia broke it, Napoleon attacked them.<\/p>\n<p>Two disasters followed. In Spain, after he made his brother Joseph king (1808), the Spanish people waged a savage <strong>guerrilla<\/strong> war (the <strong>Peninsular War<\/strong>, 1808–1814), aided by a British army under Wellington; the painter <strong>Goya<\/strong> recorded its horrors. In <strong>1812<\/strong> Napoleon invaded <strong>Russia<\/strong> with about 600,000 men. The Russians retreated, burned crops, and let him take a burned-out <strong>Moscow<\/strong>; when Alexander refused to negotiate, Napoleon retreated through the winter, and fewer than 100,000 of his soldiers got out.<\/p>\n<p>A coalition of Russia, Prussia, Austria and Britain defeated him at <strong>Leipzig, the \"Battle of the Nations\" (1813)<\/strong>. Paris fell, and Napoleon abdicated in <strong>1814<\/strong> and was exiled to the island of <strong>Elba<\/strong>. The Bourbons returned under <strong>Louis XVIII<\/strong>. Napoleon escaped in 1815 for the <strong>Hundred Days<\/strong>, but was defeated by the Duke of <strong>Wellington<\/strong> and the Prussian Blücher at <strong>Waterloo (June 18, 1815)<\/strong> and exiled to remote <strong>St. Helena<\/strong>, where he died in 1821.<\/p>\n<p>Napoleon's conquests spread revolutionary reforms (the Code, the end of feudal dues and guilds, religious toleration) across Europe. They also provoked <strong>nationalism<\/strong>: Spaniards, Germans and Russians learned to resist France as nations.<\/p>\n<p>Revolutionary ideas also crossed the Atlantic. In the French colony of <strong>Saint-Domingue<\/strong>, enslaved people rose in 1791. Led by <strong>Toussaint Louverture<\/strong>, they forced France to abolish slavery (1794) and, after defeating an army Napoleon sent to restore it, declared the independent nation of <strong>Haiti<\/strong> in 1804, the first state founded by formerly enslaved people.<\/p>\n<h3>The Congress of Vienna, 1814–1815<\/h3>\n<p>The victors met in Vienna to rebuild Europe. The leading figure was Austria's foreign minister, Prince <strong>Klemens von Metternich<\/strong>; others were Britain's <strong>Castlereagh<\/strong>, Russia's <strong>Tsar Alexander I<\/strong>, Prussia's Hardenberg, and the skillful French diplomat <strong>Talleyrand<\/strong>. Their goals were stability and preventing another French conquest.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Twenty-five years of revolution and war<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Congress of Vienna: legitimacy, balance of power, containment of France<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>No general European war for a century (until 1914), but nationalism and liberalism are suppressed<\/div><\/div>\n<p>They followed three principles: - <strong>Legitimacy:<\/strong> restore \"legitimate\" dynasties, such as the Bourbons in France, Spain and Naples. - <strong>Balance of power:<\/strong> no state should dominate. France was treated leniently so it would not seek revenge (in 1814 it kept its 1792 borders; after the Hundred Days it was cut back to roughly its 1790 borders, paid an indemnity and accepted a temporary army of occupation), but it was <strong>ringed by buffer states<\/strong>: the Kingdom of the <strong>Netherlands<\/strong> (with Belgium), a stronger <strong>Piedmont-Sardinia<\/strong>, and <strong>Prussia's<\/strong> new Rhineland provinces. - <strong>Compensation:<\/strong> Austria got Lombardy-Venetia in Italy; Russia got most of Poland; Prussia got part of Saxony and the Rhineland; Britain kept colonies such as the Cape Colony and Ceylon.<\/p>\n<p>Napoleon's German reorganization was kept in a new form: the <strong>German Confederation<\/strong> of 39 states under Austrian leadership. The great powers agreed to meet periodically to keep the peace, the <strong>Concert of Europe<\/strong> (Quadruple Alliance), and Alexander I proposed a <strong>Holy Alliance<\/strong> of Christian monarchs (Russia, Austria, Prussia). The settlement largely ignored nationalism and liberalism, which became the great forces of the next era (Unit 7).<\/p>","words":2214,"minutes":16,"mustKnow":["<strong>Causes:<\/strong> royal debt (Seven Years' War, American Revolution), privileged orders exempt from taxes, bourgeois resentment, the 1788 harvest failure, Enlightenment ideas.","<strong>1789 sequence:<\/strong> Estates-General (May) → National Assembly (June 17) → Tennis Court Oath (June 20) → Bastille (July 14) → Great Fear → August 4 decrees → Declaration of the Rights of Man (August 26) → October Days.","<strong>Civil Constitution of the Clergy (1790)<\/strong> split the Church and turned many Catholics against the Revolution.","<strong>Phases:<\/strong> constitutional monarchy (1791) → republic and king's execution (1792–93) → Terror under Robespierre and the Committee of Public Safety (1793–94) → Thermidor (1794) → Directory (1795–99) → Napoleon's coup (1799).","<strong>Levée en masse (1793):<\/strong> first mass national conscription.","<strong>Napoleon at home:<\/strong> Concordat (1801), Napoleonic Code (1804: equality before law, property; women subordinate), plebiscites, centralization.","<strong>Napoleon abroad:<\/strong> Trafalgar and Austerlitz (1805), end of the Holy Roman Empire (1806), Continental System, Peninsular War, Russia (1812), Leipzig (1813), Waterloo (1815).","<strong>Haiti:<\/strong> Toussaint Louverture leads the slave revolt; independence in 1804.","<strong>Congress of Vienna:<\/strong> Metternich; legitimacy, balance of power, compensation; buffer states around France; German Confederation; Concert of Europe."],"timeline":[{"y":"1789 (May)","label":"Estates-General meets","note":"First meeting since 1614","key":true},{"y":"1789 (June 20)","label":"Tennis Court Oath","note":"National Assembly vows to write a constitution","key":true},{"y":"1789 (July 14)","label":"Fall of the Bastille","note":"Popular uprising in Paris","key":true},{"y":"1789 (Aug. 26)","label":"Declaration of the Rights of Man and of the Citizen","note":"Liberal charter of rights","key":false},{"y":"1790","label":"Civil Constitution of the Clergy","note":"Church subordinated to the state; Catholics split","key":false},{"y":"1791","label":"Flight to Varennes; Constitution of 1791","note":"Constitutional monarchy; king's credibility destroyed","key":false},{"y":"1792 (April)","label":"France declares war on Austria","note":"Revolutionary wars begin","key":false},{"y":"1792 (Sept.)","label":"Monarchy abolished; First Republic","note":"National Convention elected by male suffrage","key":true},{"y":"1793 (Jan.)","label":"Louis XVI executed","note":"Europe's monarchs unite against France","key":true},{"y":"1793–1794","label":"Reign of Terror","note":"Committee of Public Safety; levée en masse","key":false},{"y":"1794 (July)","label":"Thermidor: Robespierre executed","note":"End of the Terror","key":true},{"y":"1795–1799","label":"The Directory","note":"Corrupt, unstable republic","key":false},{"y":"1799","label":"Coup of 18 Brumaire","note":"Napoleon becomes First Consul","key":true},{"y":"1801","label":"Concordat","note":"Napoleon's settlement with the Catholic Church","key":false},{"y":"1804","label":"Napoleonic Code; Napoleon crowned emperor; Haiti independent","note":"Equality before law; empire","key":true},{"y":"1805","label":"Trafalgar and Austerlitz","note":"British sea power; French land power","key":false},{"y":"1806","label":"Holy Roman Empire dissolved; Continental System","note":"Confederation of the Rhine","key":false},{"y":"1808–1814","label":"Peninsular War","note":"Spanish guerrilla resistance","key":false},{"y":"1812","label":"Invasion of Russia","note":"The Grand Army destroyed","key":true},{"y":"1813","label":"Battle of Leipzig","note":"\"Battle of the Nations\"","key":false},{"y":"1814–1815","label":"Congress of Vienna","note":"Legitimacy and balance of power","key":true},{"y":"1815","label":"Waterloo","note":"Napoleon's final defeat","key":true}],"cards":[{"id":"u5c1","front":"Three estates","back":"Old Regime orders: clergy (First), nobility (Second), everyone else (Third, ~97%).","person":false},{"id":"u5c2","front":"Bourgeoisie","back":"Middle class of merchants, lawyers and professionals; led the Third Estate.","person":false},{"id":"u5c3","front":"Abbé Sieyès","back":"Wrote \"What Is the Third Estate?\" (1789): \"Everything.\"","person":true},{"id":"u5c4","front":"Tennis Court Oath (June 20, 1789)","back":"National Assembly vowed not to disband until France had a constitution.","person":false},{"id":"u5c5","front":"Storming of the Bastille (July 14, 1789)","back":"Parisian crowd seized the royal fortress; symbol of popular revolution.","person":false},{"id":"u5c6","front":"Great Fear (1789)","back":"Rural panic in which peasants attacked manors and burned records of feudal dues.","person":false},{"id":"u5c7","front":"Declaration of the Rights of Man and of the Citizen","back":"1789 charter: natural rights, equality before law, sovereignty of the nation.","person":false},{"id":"u5c8","front":"October Days (1789)","back":"Parisian women marched to Versailles and brought the royal family to Paris.","person":false},{"id":"u5c9","front":"Civil Constitution of the Clergy (1790)","back":"Made clergy elected state employees who swore loyalty; divided French Catholics.","person":false},{"id":"u5c10","front":"Olympe de Gouges","back":"Wrote the Declaration of the Rights of Woman (1791); executed in 1793.","person":true},{"id":"u5c11","front":"Flight to Varennes (1791)","back":"Louis XVI's failed escape attempt; destroyed trust in the king.","person":false},{"id":"u5c12","front":"Girondins vs. Jacobins","back":"Moderate vs. radical republicans in the National Convention; Jacobins purged Girondins in 1793.","person":false},{"id":"u5c13","front":"Maximilien Robespierre","back":"Jacobin leader of the Committee of Public Safety during the Terror; executed July 1794.","person":true},{"id":"u5c14","front":"Committee of Public Safety","back":"Twelve-member executive committee that ran France during the Terror.","person":false},{"id":"u5c15","front":"Levée en masse (1793)","back":"Mass conscription of the whole nation for war.","person":false},{"id":"u5c16","front":"Reign of Terror (1793–94)","back":"Revolutionary dictatorship that executed about 17,000 \"enemies.\"","person":false},{"id":"u5c17","front":"Sans-culottes","back":"Paris working people who backed radical revolution.","person":false},{"id":"u5c18","front":"Thermidorian Reaction (1794)","back":"Overthrow and execution of Robespierre; end of the Terror.","person":false},{"id":"u5c19","front":"The Directory (1795–99)","back":"Five-man executive of a conservative, corrupt republic; overthrown by Napoleon.","person":false},{"id":"u5c20","front":"Concordat of 1801","back":"Napoleon's agreement with the pope restoring the Church while keeping state control.","person":false},{"id":"u5c21","front":"Napoleonic Code (1804)","back":"Civil law code: equality before law, property rights; women subordinate to husbands.","person":false},{"id":"u5c22","front":"Continental System","back":"Napoleon's ban on European trade with Britain (from 1806).","person":false},{"id":"u5c23","front":"Peninsular War (1808–14)","back":"Spanish guerrilla war, with British help, against Napoleon's rule.","person":false},{"id":"u5c24","front":"Battle of Waterloo (1815)","back":"Wellington and Blücher's final defeat of Napoleon.","person":false},{"id":"u5c25","front":"Toussaint Louverture","back":"Led the slave revolution in Saint-Domingue that created independent Haiti (1804).","person":true},{"id":"u5c26","front":"Klemens von Metternich","back":"Austrian foreign minister; architect of the Congress of Vienna and of conservative order.","person":true},{"id":"u5c27","front":"Principle of legitimacy","back":"Congress of Vienna principle: restore pre-revolutionary ruling dynasties.","person":false},{"id":"u5c28","front":"Concert of Europe","back":"Great powers' system of periodic meetings to preserve the 1815 settlement.","person":false}],"hours":2.45,"quizIds":["u5q2","u5q8","u5q9","u5q11","u5q15","u5q22","u5q25","u5q26","u5q32","u5q34","u5q36","u5q38","u5q42","u5q44","u5q45"]},{"id":6,"title":"The Industrial Revolution","short":"Industrial Revolution","range":"1750–1850","weight":{"min":7,"max":9,"verified":true},"subtopics":["Agricultural and industrial revolution","Causes of revolution","Economic and social impact on working and middle class","British reform legislation","Chartism"],"lesson":"<h3>The big picture<\/h3>\n<p>For all of human history before about 1750, almost everyone farmed, energy came from muscles, wind, water and wood, and economies grew very slowly. The <strong>Industrial Revolution<\/strong>, which began in <strong>Britain<\/strong> in the late 1700s, changed that forever. Machines powered by <strong>coal and steam<\/strong> produced goods in <strong>factories<\/strong>; output per worker multiplied; people moved to cities; and new social classes and political demands appeared. This unit covers why it began, how it worked, who gained and lost, and how Britain responded with reform laws and the Chartist movement.<\/p>\n<h3>Step one: the agricultural revolution<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Enclosure, new crops and crop rotation make farms more productive<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>More food with fewer farm workers<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Population grows and surplus rural labor moves to factory towns<\/div><\/div>\n<p>British landowners <strong>enclosed<\/strong> the old open fields and common lands into compact private farms, especially through acts of Parliament in the 1700s and early 1800s. Enclosure let improving landlords experiment, but it pushed many small farmers and cottagers off the land. New methods spread: <strong>crop rotation<\/strong> with <strong>turnips and clover<\/strong> (popularized by Charles \"Turnip\" <strong>Townshend<\/strong>) restored nitrogen to the soil and fed livestock through the winter, so land no longer had to lie fallow. <strong>Jethro Tull's seed drill<\/strong> (1701) planted seeds in neat rows, and Robert <strong>Bakewell<\/strong> bred heavier sheep and cattle. Higher yields fed a growing population and freed workers for industry.<\/p>\n<h3>Why Britain first?<\/h3>\n<p>Britain had an unusual combination of advantages: - <strong>Natural resources:<\/strong> abundant <strong>coal<\/strong> and <strong>iron ore<\/strong>, often close together, and many rivers for water power and transport. - <strong>Capital and finance:<\/strong> profits from overseas trade (including the slave trade and plantations), a sophisticated banking system and the Bank of England. - <strong>Markets:<\/strong> a growing home population and a large colonial empire; no internal tolls or tariffs. - <strong>Stable government friendly to business:<\/strong> after 1688, Parliament protected property, enforced patents, built canals and roads, and supported a navy that protected trade. - <strong>Labor:<\/strong> population growth and enclosure created a supply of workers. - <strong>Culture:<\/strong> a practical tinkering tradition and entrepreneurs, many of them Protestant <strong>Dissenters<\/strong> shut out of politics, who poured energy into business.<\/p>\n<h3>Cotton, steam and iron<\/h3>\n<p>The first factory industry was <strong>cotton textiles<\/strong>. Each invention created a bottleneck that the next solved:<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>John Kay's flying shuttle (1733) speeds up weaving, so weavers need more thread<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Hargreaves's spinning jenny (c. 1765), Arkwright's water frame (1769) and Crompton's mule (1779) mechanize spinning<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Machines become too big for cottages: the factory system is born<\/div><\/div>\n<p><strong>Richard Arkwright's water frame<\/strong> needed a river to turn it, so he built one of the first true <strong>factories<\/strong> at Cromford (1771), gathering workers under one roof and one clock. Edmund Cartwright's <strong>power loom<\/strong> (1785) then mechanized weaving. The raw cotton came largely from slave plantations in the <strong>American South<\/strong>, where Eli Whitney's <strong>cotton gin<\/strong> (1793) made production cheap.<\/p>\n<p><strong>Steam<\/strong> freed factories from rivers. Thomas <strong>Newcomen's<\/strong> steam engine (1712) pumped water out of coal mines but wasted fuel. <strong>James Watt<\/strong>, with his partner Matthew Boulton, added a <strong>separate condenser<\/strong> (patented 1769) and later rotary motion, producing an efficient engine that could power any machine anywhere. Factories clustered in coal towns such as <strong>Manchester<\/strong>, nicknamed \"Cottonopolis.\"<\/p>\n<p><strong>Iron<\/strong> improved too. <strong>Abraham Darby<\/strong> smelted iron using <strong>coke<\/strong> (baked coal) instead of scarce charcoal (1709), and Henry Cort's <strong>puddling<\/strong> process (1784) made better wrought iron cheaply.<\/p>\n<p><strong>Railways<\/strong> combined coal, iron and steam. The Stockton and Darlington line opened in 1825; <strong>George Stephenson's Rocket<\/strong> won the trials for the <strong>Liverpool and Manchester Railway<\/strong> (1830), the first intercity line powered by steam. A railway boom in the 1840s cut transport costs, created huge demand for iron and coal, and knit national markets together.<\/p>\n<h3>The spread to the continent<\/h3>\n<p><strong>Belgium<\/strong>, with coal and iron and close ties to Britain, industrialized first on the continent, then northern France and the German states. Continental countries had obstacles: wars until 1815, poorer transport, internal tolls and guild rules. Governments played a bigger role than in Britain, building railways and setting tariffs. The Prussian-led <strong>Zollverein<\/strong> (customs union, 1834) removed tariffs among most German states. The German economist <strong>Friedrich List<\/strong> argued that young industries need <strong>protective tariffs<\/strong> to compete with Britain. Southern and eastern Europe, including Russia, industrialized only late in the century.<\/p>\n<h3>Social impact: a new world of work and cities<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Factories and steam power concentrate work in industrial towns<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Rapid urbanization: overcrowded slums, polluted water, cholera, long hours, child labor<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>A new working class and a new middle class, each with political demands<\/div><\/div>\n<p><strong>Factory work<\/strong> imposed strict discipline: fixed hours set by the clock and bell, fines for lateness, 12- to 14-hour days, six days a week. Employers hired <strong>women and children<\/strong> because they were cheaper and nimble at tending machines; children as young as six worked in mills and mines. Families that had worked together at home in the putting-out system were split up during the working day.<\/p>\n<p><strong>Cities<\/strong> grew faster than anyone could plan for. Manchester went from about 25,000 people in 1770 to over 300,000 by 1850. Workers crowded into <strong>back-to-back houses<\/strong> with no running water or sewers; <strong>cholera<\/strong> epidemics struck in 1832 and 1848. <strong>Friedrich Engels<\/strong>, a German whose family owned a Manchester mill, described the horrors in <strong><em>The Condition of the Working Class in England<\/em> (1845)<\/strong>, which shaped Marx's thinking.<\/p>\n<p>Industrialization created a <strong>working class (proletariat)<\/strong> of wage earners who owned nothing but their labor, and an expanding <strong>middle class<\/strong> of factory owners, merchants and professionals. The middle class prized hard work, thrift, self-help and respectability, and promoted the ideal of \"<strong>separate spheres<\/strong>\": men in the public world of work, women in the home. Historians still debate the <strong>standard of living<\/strong>: real wages fell or stagnated for many workers until about the 1840s, then rose; the long-term gains were enormous, but the first generations paid a heavy price.<\/p>\n<p>Economists explained (and often justified) the new order. <strong>Thomas Malthus<\/strong> (<em>Essay on the Principle of Population<\/em>, 1798) argued that population grows faster than the food supply, so poverty is inevitable unless people have fewer children. <strong>David Ricardo<\/strong> proposed the \"<strong>iron law of wages<\/strong>\": wages tend to sink to subsistence level. Their gloom earned economics the label \"the dismal science.\" These <strong>classical economists<\/strong> opposed government intervention in the economy.<\/p>\n<h3>Workers' responses and British reform<\/h3>\n<p>Workers resisted. The <strong>Luddites<\/strong> (1811–1816) smashed textile machines that threatened their jobs. Trade unions were banned by the <strong>Combination Acts<\/strong> (1799–1800), repealed in 1824. In 1819 cavalry charged a peaceful crowd demanding parliamentary reform in Manchester, killing about fifteen people: the <strong>Peterloo Massacre<\/strong>.<\/p>\n<p>Yet Britain avoided revolution by passing reforms step by step: - <strong>Catholic Emancipation (1829)<\/strong> let Catholics sit in Parliament. - The <strong>Great Reform Act of 1832<\/strong> took seats from \"<strong>rotten boroughs<\/strong>\" (tiny or empty districts controlled by patrons) and gave them to new industrial cities, and gave the vote to middle-class men who owned or rented property of moderate value. The electorate grew by roughly half, to about one in five adult men in England. Workers were still excluded. - The <strong>Factory Act of 1833<\/strong> banned children under 9 from textile mills, limited hours for children, and created government <strong>inspectors<\/strong> to enforce it. The <strong>Mines Act (1842)<\/strong> barred women and children under 10 from underground work; the <strong>Ten Hours Act (1847)<\/strong> limited women and teenagers to ten hours a day. - The <strong>Poor Law Amendment Act (1834)<\/strong> forced the able-bodied poor into harsh <strong>workhouses<\/strong> to discourage dependence, a reform workers hated. - Slavery was abolished throughout the British Empire in <strong>1833<\/strong>. - The <strong>Corn Laws<\/strong> (1815) had protected landowners with high tariffs on imported grain, keeping bread prices high. The middle-class <strong>Anti-Corn Law League<\/strong> (Richard Cobden, John Bright) campaigned for free trade, and Prime Minister Robert <strong>Peel<\/strong> repealed the Corn Laws in <strong>1846<\/strong>, a victory for industrialists and free trade over the landed aristocracy.<\/p>\n<h3>Chartism<\/h3>\n<p>Disappointed that the Reform Act of 1832 left them voteless, working-class radicals drew up the <strong>People's Charter (1838)<\/strong>. Its six points: <strong>universal male suffrage<\/strong>, the <strong>secret ballot<\/strong>, no property qualification for members of Parliament, <strong>payment of MPs<\/strong>, equal electoral districts, and annual elections to Parliament. Chartists gathered millions of signatures on petitions in 1839, 1842 and 1848; Parliament rejected all three, and the movement faded after 1848. But Chartism was the first mass working-class political movement, and by 1918 every point except annual parliaments had become law.<\/p>","words":1397,"minutes":10,"mustKnow":["<strong>Agricultural revolution:<\/strong> enclosure, crop rotation (turnips, clover), Tull's seed drill → more food, fewer farm jobs, labor for industry.","<strong>Why Britain:<\/strong> coal and iron, capital, colonial markets, stable pro-business government, labor supply, no internal tariffs.","<strong>Textile chain:<\/strong> flying shuttle → spinning jenny → water frame (Arkwright's factories) → mule → power loom.","<strong>James Watt<\/strong> improved the steam engine (separate condenser) → factories anywhere; <strong>Darby's<\/strong> coke smelting; <strong>Stephenson's Rocket<\/strong> and the Liverpool–Manchester Railway (1830).","<strong>Social costs:<\/strong> urbanization, slums, cholera, child labor, factory discipline; Engels's <em>Condition of the Working Class<\/em> (1845).","<strong>Classical economists:<\/strong> Malthus (population outruns food), Ricardo (iron law of wages), laissez-faire.","<strong>Luddites<\/strong> smashed machines; <strong>Peterloo Massacre<\/strong> (1819).","<strong>Reform Act of 1832:<\/strong> middle-class men get the vote; rotten boroughs abolished; workers still excluded.","<strong>Factory Act (1833), Mines Act (1842), Poor Law (1834), Corn Law repeal (1846).<\/strong>","<strong>Chartism (1838–48):<\/strong> six points incl. universal male suffrage and secret ballot; petitions rejected but most points later adopted."],"timeline":[{"y":"1701","label":"Tull's seed drill","note":"Agricultural improvement","key":false},{"y":"1709","label":"Darby smelts iron with coke","note":"Cheaper iron","key":false},{"y":"1712","label":"Newcomen steam engine","note":"Pumps water from mines","key":false},{"y":"1733","label":"Kay's flying shuttle","note":"Faster weaving","key":false},{"y":"c. 1765","label":"Hargreaves's spinning jenny","note":"Multi-spindle hand spinning","key":false},{"y":"1769","label":"Watt's separate condenser; Arkwright's water frame","note":"Efficient steam; factory spinning","key":true},{"y":"1798","label":"Malthus's Essay on Population","note":"Population outruns food","key":false},{"y":"1811–1816","label":"Luddite riots","note":"Machine-breaking","key":false},{"y":"1819","label":"Peterloo Massacre","note":"Repression of reform rally","key":false},{"y":"1830","label":"Liverpool and Manchester Railway","note":"Steam railway age begins","key":true},{"y":"1832","label":"Great Reform Act","note":"Middle-class franchise","key":true},{"y":"1833","label":"Factory Act; abolition of slavery in the empire","note":"Inspectors; limits on child labor","key":true},{"y":"1834","label":"Poor Law Amendment; Zollverein","note":"Workhouses; German customs union","key":false},{"y":"1838","label":"People's Charter","note":"Chartism begins","key":true},{"y":"1845","label":"Engels's Condition of the Working Class in England","note":"Exposé of Manchester","key":false},{"y":"1846","label":"Repeal of the Corn Laws","note":"Victory for free trade","key":true},{"y":"1848","label":"Final Chartist petition","note":"Chartism fades","key":false}],"cards":[{"id":"u6c1","front":"Enclosure movement","back":"Fencing off open fields and commons into private farms; raised output, displaced small farmers.","person":false},{"id":"u6c2","front":"Crop rotation (Norfolk system)","back":"Rotating wheat, turnips, barley and clover so no field lies fallow.","person":false},{"id":"u6c3","front":"Spinning jenny","back":"Hargreaves's multi-spindle spinning machine (c. 1765).","person":false},{"id":"u6c4","front":"Richard Arkwright","back":"Water frame (1769) and early factories at Cromford: the father of the factory system.","person":true},{"id":"u6c5","front":"James Watt","back":"Improved the steam engine with a separate condenser; partnered with Boulton.","person":true},{"id":"u6c6","front":"George Stephenson","back":"Railway pioneer; his Rocket won the 1829 trials for the Liverpool–Manchester line.","person":true},{"id":"u6c7","front":"Factory system","back":"Production in one building with power-driven machines, wage labor and strict discipline.","person":false},{"id":"u6c8","front":"Thomas Malthus","back":"Essay on Population (1798): population grows faster than food, so poverty persists.","person":true},{"id":"u6c9","front":"David Ricardo","back":"Classical economist; \"iron law of wages\": wages tend toward subsistence.","person":true},{"id":"u6c10","front":"Friedrich Engels","back":"The Condition of the Working Class in England (1845); Marx's collaborator.","person":true},{"id":"u6c11","front":"Luddites","back":"Workers who smashed textile machines (1811–16) to protect their jobs.","person":false},{"id":"u6c12","front":"Peterloo Massacre (1819)","back":"Cavalry attacked a peaceful reform rally in Manchester.","person":false},{"id":"u6c13","front":"Great Reform Act (1832)","back":"Ended rotten boroughs and gave the vote to middle-class men.","person":false},{"id":"u6c14","front":"Rotten boroughs","back":"Tiny or empty districts that still elected MPs before 1832.","person":false},{"id":"u6c15","front":"Factory Act (1833)","back":"Banned children under 9 from textile mills, limited children's hours, created inspectors.","person":false},{"id":"u6c16","front":"Poor Law Amendment Act (1834)","back":"Forced the able-bodied poor into workhouses.","person":false},{"id":"u6c17","front":"Corn Laws","back":"Tariffs on imported grain protecting landowners; repealed in 1846.","person":false},{"id":"u6c18","front":"Anti-Corn Law League","back":"Middle-class free-trade campaign led by Cobden and Bright.","person":false},{"id":"u6c19","front":"Chartism","back":"Working-class movement for the People's Charter (1838): universal male suffrage, secret ballot, etc.","person":false},{"id":"u6c20","front":"Zollverein (1834)","back":"Prussian-led customs union of German states.","person":false}],"hours":1.71,"quizIds":["u6q1","u6q5","u6q9","u6q12","u6q16","u6q23","u6q25","u6q26","u6q28","u6q31","u6q32","u6q33"]},{"id":7,"title":"Political and Cultural Developments, 1815–1848","short":"Ideologies & Revolutions","range":"1815–1848","weight":{"min":6,"max":8,"verified":false},"subtopics":["Conservatism","Liberalism","Nationalism","Socialism","Romanticism","Revolutions of 1830 and 1848"],"lesson":"<h3>The big picture<\/h3>\n<p>The Congress of Vienna tried to freeze Europe in 1815. It could not stop the ideas released by the French and Industrial Revolutions. Between 1815 and 1848 Europeans invented the \"<strong>isms<\/strong>\" that still frame politics: <strong>conservatism, liberalism, nationalism and socialism<\/strong>. In culture, <strong>Romanticism<\/strong> rebelled against Enlightenment reason. And waves of revolution, in the 1820s, in 1830 and above all in <strong>1848<\/strong>, tested whether the old order could hold. A typical exam question gives you a quotation and asks which ideology it expresses, so focus on what each \"ism\" believed and who its spokesmen were.<\/p>\n<h3>The four ideologies<\/h3>\n<p><strong>Conservatism<\/strong> defended the old order of monarchy, aristocracy, established church and tradition. Following <strong>Edmund Burke<\/strong>, conservatives argued that society is a living organism built over centuries; change should be slow and organic, never imposed by abstract theories like \"the rights of man.\" The French writer <strong>Joseph de Maistre<\/strong> went further, defending absolute monarchy and the pope. In practice, conservatism meant <strong>Metternich<\/strong>, who saw liberalism and nationalism as diseases that would tear apart his multinational Austrian Empire.<\/p>\n<p><strong>Liberalism<\/strong> was the creed of the middle class. Liberals wanted <strong>constitutions<\/strong>, representative government, <strong>equality before the law<\/strong>, freedom of the press, speech and religion, and <strong>laissez-faire<\/strong> economics (Adam Smith, Ricardo). But most early liberals did <strong>not<\/strong> want democracy: they favored voting limited to men of <strong>property<\/strong> and education. The English philosopher <strong>Jeremy Bentham<\/strong> taught <strong>utilitarianism<\/strong>: laws should be judged by whether they produce \"the greatest happiness of the greatest number.\" His follower <strong>John Stuart Mill<\/strong> later defended individual freedom in <em>On Liberty<\/em> (1859) and argued for women's rights.<\/p>\n<p><strong>Nationalism<\/strong> held that humanity is naturally divided into <strong>nations<\/strong>, peoples sharing a language, culture and history, and that each nation should have its own state. The German thinker <strong>Johann Gottfried Herder<\/strong> taught that each people has a unique spirit (<em>Volksgeist<\/em>) expressed in its language and folk songs. <strong>Giuseppe Mazzini<\/strong> founded <strong>Young Italy<\/strong> (1831) to unite Italy as a democratic republic. Nationalism was revolutionary in 1815 because it threatened multinational empires (Austria, Russia, the Ottoman Empire) and divided lands (Germany and Italy, each split into many states).<\/p>\n<p><strong>Socialism<\/strong> responded to the misery of industrial workers. Its basic idea: private ownership and competition cause inequality, so society should own or cooperatively manage the means of production. The early <strong>utopian socialists<\/strong> hoped to persuade society by example. <strong>Robert Owen<\/strong>, a British mill owner, built a model factory community at <strong>New Lanark<\/strong> with schools and decent housing, and later a commune at New Harmony, Indiana. <strong>Charles Fourier<\/strong> designed cooperative communities called <em>phalanxes<\/em>. <strong>Henri de Saint-Simon<\/strong> wanted society run by experts and industrialists for the good of all. <strong>Louis Blanc<\/strong> called for state-funded \"social workshops\" guaranteeing the <strong>right to work<\/strong>. <strong>Pierre-Joseph Proudhon<\/strong> declared \"<strong>Property is theft!<\/strong>\" and became a father of <strong>anarchism<\/strong>.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Industrial capitalism creates a large, impoverished working class<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Marx and Engels publish The Communist Manifesto (1848)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>\"Scientific\" socialism: history is class struggle and capitalism will be overthrown by the proletariat<\/div><\/div>\n<p><strong>Karl Marx<\/strong> and <strong>Friedrich Engels<\/strong> dismissed the utopians as naive and called their own theory <strong>scientific socialism<\/strong>. <em>The Communist Manifesto<\/em> (February 1848) begins, \"A specter is haunting Europe, the specter of communism,\" and ends, \"Workers of the world, unite!\" Its argument: \"The history of all hitherto existing society is the history of <strong>class struggles<\/strong>.\" Economic forces drive history (<strong>historical materialism<\/strong>); under capitalism the <strong>bourgeoisie<\/strong> (owners) exploits the <strong>proletariat<\/strong> (workers), who will become a majority, overthrow capitalism in a revolution, set up a dictatorship of the proletariat, and eventually create a classless, stateless communist society. Marx borrowed the idea of history moving through conflicts (the <strong>dialectic<\/strong>) from the German philosopher <strong>G. W. F. Hegel<\/strong>. Marx's influence came mostly after 1848 (Units 8 and 9).<\/p>\n<h3>Romanticism<\/h3>\n<p><strong>Romanticism<\/strong> (about 1790–1850) was a cultural revolt against the Enlightenment's cool rationalism and against the ugliness of industrial cities. Romantics prized <strong>emotion, intuition and imagination<\/strong> over reason; <strong>nature<\/strong> as sublime and spiritual; the <strong>individual genius<\/strong> and rebel; the <strong>medieval past<\/strong> (the Gothic revival); and the folk culture of each people, which tied Romanticism closely to <strong>nationalism<\/strong>.<\/p>\n<p>Key figures: in poetry, <strong>William Wordsworth<\/strong> and Samuel Taylor Coleridge (<em>Lyrical Ballads<\/em>, 1798) celebrated nature and common speech; <strong>Lord Byron<\/strong> lived and died (1824) as a Romantic rebel fighting for Greek independence. In Germany, <strong>Goethe<\/strong> wrote <em>The Sorrows of Young Werther<\/em> and <em>Faust<\/em>, and the <strong>Brothers Grimm<\/strong> collected German folk tales. <strong>Victor Hugo<\/strong> (<em>The Hunchback of Notre-Dame<\/em>, 1831) and Sir <strong>Walter Scott<\/strong> (<em>Ivanhoe<\/em>) turned to the Middle Ages. In painting, <strong>Caspar David Friedrich<\/strong> showed lonely figures before vast landscapes, and <strong>Eugène Delacroix<\/strong> painted <strong><em>Liberty Leading the People<\/strong><\/em> (1830). In music, <strong>Beethoven<\/strong> bridged classicism and Romanticism, and <strong>Chopin<\/strong> wove Polish folk dances into his piano works. Romanticism also fed a <strong>religious revival<\/strong> after the skepticism of the Enlightenment.<\/p>\n<h3>Metternich's system and the revolts of the 1820s<\/h3>\n<p>Metternich used the <strong>Concert of Europe<\/strong> to crush revolutions. When liberal revolts broke out in <strong>Spain<\/strong> and <strong>Naples<\/strong> (1820), the conservative powers declared at the Congress of <strong>Troppau<\/strong> (1820) a right to intervene; Austrian troops crushed the Naples revolt (1821) and a French army restored the Spanish king (1823). Britain refused to join these interventions and drifted away from the Concert. In the German Confederation, after a nationalist student murdered a conservative writer, Metternich pushed through the <strong>Carlsbad Decrees (1819)<\/strong>, which dissolved student nationalist societies (<em>Burschenschaften<\/em>), censored the press and put university professors under surveillance.<\/p>\n<p>Two exceptions broke the pattern: - <strong>Greek War of Independence (1821–1829).<\/strong> Greeks revolted against the Ottoman Empire. European Romantics (like Byron) adored the cause of ancient Greece's descendants, and Britain, France and Russia intervened, destroying the Ottoman-Egyptian fleet at <strong>Navarino (1827)<\/strong>. Greece became independent (recognized 1830–1832). Nationalism had won, with great-power help, because the rebels were Christians fighting the Muslim Ottomans and Russia saw a chance to weaken the Ottomans. - In Russia, the <strong>Decembrist Revolt (December 1825)<\/strong>: liberal army officers who had seen Western Europe during the Napoleonic wars rebelled for a constitution when Nicholas I took the throne. They were crushed. <strong>Nicholas I<\/strong> (r. 1825–1855) became the \"gendarme of Europe,\" ruling under the slogan \"<strong>Orthodoxy, Autocracy, Nationality<\/strong>.\"<\/p>\n<h3>The revolutions of 1830<\/h3>\n<p>In France, the restored Bourbon <strong>Louis XVIII<\/strong> had accepted a <strong>Charter (1814)<\/strong> with a parliament elected by a tiny wealthy electorate. His brother <strong>Charles X<\/strong> (r. 1824–1830) was an ultra-royalist. When he issued the <strong>July Ordinances<\/strong> (1830), dissolving the chamber, restricting the vote further and censoring the press, Paris rose in the <strong>July Revolution<\/strong>. Charles fled, and liberals installed his cousin <strong>Louis-Philippe<\/strong> of Orléans as the \"<strong>citizen king<\/strong>\" of the <strong>July Monarchy<\/strong> (1830–1848). The electorate roughly doubled but stayed small; the regime favored the wealthy bourgeoisie (his minister Guizot told those who wanted the vote to \"get rich\").<\/p>\n<p>The French example spread. <strong>Belgium<\/strong> revolted against Dutch rule in 1830 and won independence, guaranteed as permanently <strong>neutral<\/strong> by the great powers (1839). The <strong>Polish November Uprising<\/strong> (1830–31) against Russian rule was crushed, and Nicholas I abolished Poland's constitution. Revolts in Italy were put down by Austria.<\/p>\n<h3>The revolutions of 1848: the \"springtime of peoples\"<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Bad harvests and the potato blight (1845–47), unemployment and food prices; liberal and nationalist frustration<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Revolutions in Paris, Vienna, Berlin, Milan, Budapest, Prague and Rome in 1848<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Most fail by 1849, divided by class and nationality and crushed by royal armies; but serfdom ends in Austria<\/div><\/div>\n<p><strong>France.<\/strong> In <strong>February 1848<\/strong>, banquets for electoral reform turned into revolution. Louis-Philippe abdicated, and the <strong>Second Republic<\/strong> proclaimed <strong>universal male suffrage<\/strong> and created <strong>National Workshops<\/strong> to employ the jobless (inspired by Louis Blanc). The newly elected, mostly rural and conservative assembly closed the workshops; Paris workers rose in the <strong>June Days<\/strong> and were crushed by the army, with thousands killed. Frightened voters elected <strong>Louis Napoleon Bonaparte<\/strong>, nephew of the emperor, as president in December 1848. He overthrew the republic in 1851 and became <strong>Emperor Napoleon III<\/strong> in 1852.<\/p>\n<p><strong>Austrian Empire.<\/strong> In <strong>March 1848<\/strong>, a revolt in Vienna forced <strong>Metternich<\/strong> to flee. Hungarians under <strong>Lajos Kossuth<\/strong> won self-government; Czechs in Prague demanded rights; Italians in Lombardy-Venetia revolted. The Austrian assembly <strong>abolished serfdom<\/strong> (1848), the one lasting gain. Then the counterrevolution struck: General Windischgrätz bombarded Prague (June) and retook Vienna (October); the young <strong>Franz Joseph<\/strong> became emperor (December 1848); and in 1849 <strong>Russian troops<\/strong> helped crush Hungary. The nationalities had fought each other as much as the emperor; the Croats, for example, helped Austria against Hungary.<\/p>\n<p><strong>Germany.<\/strong> Liberals elected the <strong>Frankfurt Parliament<\/strong> (1848–49) to unite Germany under a constitution. It argued over whether Germany should include Austria (\"greater Germany\") or exclude it (\"smaller Germany\"), and finally offered the crown of a smaller Germany to King <strong>Frederick William IV of Prussia<\/strong> (1849). He refused a \"crown from the gutter\" offered by a parliament, and Prussian troops dispersed the remaining radicals. German unity would come by force under Bismarck instead (Unit 8).<\/p>\n<p><strong>Italy.<\/strong> Revolts spread from Sicily to Milan and Venice. King <strong>Charles Albert of Piedmont-Sardinia<\/strong> declared war on Austria but was defeated at Custoza (1848) and Novara (1849). In Rome, <strong>Mazzini<\/strong> and <strong>Garibaldi<\/strong> led a <strong>Roman Republic<\/strong> (1849) until French troops restored the pope. Only Piedmont kept its new constitution (the Statuto).<\/p>\n<p><strong>Why 1848 failed:<\/strong> liberals feared the radical workers more than the kings; nationalities clashed with each other; peasants lost interest once serfdom was abolished; and the armies stayed loyal to the monarchs. Afterward, idealism gave way to <strong>realism<\/strong>: Realpolitik, the politics of power rather than principles, would unify Italy and Germany.<\/p>","words":1575,"minutes":11,"mustKnow":["<strong>Conservatism<\/strong> (Burke, de Maistre, Metternich): tradition, monarchy, church, gradual change.","<strong>Liberalism:<\/strong> constitutions, rights, free press, laissez-faire, but votes for property owners only. Bentham's <strong>utilitarianism<\/strong>; J. S. Mill.","<strong>Nationalism:<\/strong> each people (language, culture, history) deserves its own state. Herder's Volksgeist; <strong>Mazzini's Young Italy<\/strong>.","<strong>Utopian socialists:<\/strong> Owen (New Lanark), Fourier (phalanxes), Saint-Simon, Louis Blanc (right to work); <strong>Proudhon<\/strong> (\"Property is theft,\" anarchism).","<strong>Communist Manifesto (1848):<\/strong> class struggle, bourgeoisie vs. proletariat, historical materialism, inevitable revolution.","<strong>Romanticism:<\/strong> emotion, nature, the past, folk culture, genius. Wordsworth, Byron, Goethe, Grimm, Hugo, Friedrich, Delacroix.","<strong>Metternich's tools:<\/strong> Carlsbad Decrees (1819), intervention in Naples and Spain (Troppau, 1820).","<strong>Greek independence<\/strong> (1821–30) succeeded with British, French and Russian help; the <strong>Decembrist Revolt<\/strong> (1825) failed.","<strong>1830:<\/strong> July Revolution → Louis-Philippe; Belgian independence; Polish revolt crushed.","<strong>1848:<\/strong> February Revolution → Second Republic → June Days → Louis Napoleon. Metternich falls; <strong>serfdom abolished in Austria<\/strong>; Frankfurt Parliament fails (Frederick William IV refuses crown); Russia crushes Hungary."],"timeline":[{"y":"1814","label":"Louis XVIII's Charter","note":"Constitutional monarchy restored in France","key":false},{"y":"1819","label":"Carlsbad Decrees","note":"Metternich suppresses German nationalism","key":true},{"y":"1820","label":"Revolts in Spain and Naples; Troppau Protocol","note":"Concert claims right to intervene","key":false},{"y":"1821–1830","label":"Greek War of Independence","note":"Nationalist success with great-power help","key":true},{"y":"1825","label":"Decembrist Revolt","note":"Failed liberal officers' revolt in Russia","key":false},{"y":"1827","label":"Battle of Navarino","note":"British, French and Russian fleets destroy Ottoman navy","key":false},{"y":"1830","label":"July Revolution in France; Belgian revolt","note":"Louis-Philippe becomes \"citizen king\"","key":true},{"y":"1830–1831","label":"Polish November Uprising","note":"Crushed by Russia","key":false},{"y":"1831","label":"Mazzini founds Young Italy","note":"Nationalist movement","key":false},{"y":"1848 (Feb.)","label":"Communist Manifesto; February Revolution","note":"Second French Republic","key":true},{"y":"1848 (March)","label":"Revolutions in Vienna, Berlin, Milan; Metternich flees","note":"\"Springtime of peoples\"","key":true},{"y":"1848 (June)","label":"June Days in Paris","note":"Workers' rising crushed","key":false},{"y":"1848–1849","label":"Frankfurt Parliament","note":"Fails to unite Germany","key":false},{"y":"1849","label":"Russia helps crush Hungary; Roman Republic falls","note":"Counterrevolution triumphs","key":false},{"y":"1852","label":"Louis Napoleon becomes Napoleon III","note":"Second Empire","key":true}],"cards":[{"id":"u7c1","front":"Conservatism","back":"Defense of tradition, monarchy, church and gradual change against revolution (Burke, Metternich).","person":false},{"id":"u7c2","front":"Liberalism (19th century)","back":"Constitutions, individual rights, free press, laissez-faire; voting limited to property owners.","person":false},{"id":"u7c3","front":"Nationalism","back":"Belief that each people sharing language and culture should have its own state.","person":false},{"id":"u7c4","front":"Edmund Burke","back":"Reflections on the Revolution in France (1790); founder of modern conservatism.","person":true},{"id":"u7c5","front":"Jeremy Bentham","back":"Utilitarianism: \"the greatest happiness of the greatest number.\"","person":true},{"id":"u7c6","front":"Giuseppe Mazzini","back":"Founded Young Italy (1831); democratic Italian nationalist.","person":true},{"id":"u7c7","front":"Robert Owen","back":"Utopian socialist; model factory community at New Lanark.","person":true},{"id":"u7c8","front":"Charles Fourier","back":"Utopian socialist who planned cooperative communities (phalanxes).","person":true},{"id":"u7c9","front":"Pierre-Joseph Proudhon","back":"\"Property is theft!\"; father of anarchism.","person":true},{"id":"u7c10","front":"Karl Marx","back":"Communist Manifesto (1848, with Engels); history as class struggle; proletarian revolution.","person":true},{"id":"u7c11","front":"Romanticism","back":"Cultural movement stressing emotion, nature, imagination, the past and national folk culture.","person":false},{"id":"u7c12","front":"Carlsbad Decrees (1819)","back":"Metternich's censorship and suppression of German student nationalist groups.","person":false},{"id":"u7c13","front":"Decembrist Revolt (1825)","back":"Failed revolt of Russian officers seeking a constitution.","person":false},{"id":"u7c14","front":"Greek War of Independence","back":"1821–30 revolt against the Ottomans, won with British, French and Russian help.","person":false},{"id":"u7c15","front":"July Revolution (1830)","back":"Overthrew Charles X; made Louis-Philippe France's \"citizen king.\"","person":false},{"id":"u7c16","front":"Frankfurt Parliament (1848–49)","back":"Liberal German assembly that failed to unify Germany; Prussia's king refused its crown.","person":false},{"id":"u7c17","front":"June Days (1848)","back":"Paris workers' uprising after National Workshops closed; crushed by the army.","person":false}],"hours":1.49,"quizIds":["u7q1","u7q6","u7q8","u7q14","u7q17","u7q18","u7q21","u7q24","u7q26","u7q28","u7q29"]},{"id":8,"title":"Politics and Diplomacy in the Age of Nationalism, 1850–1914","short":"Age of Nationalism","range":"1850–1914","weight":{"min":8,"max":10,"verified":true},"subtopics":["The unification of Italy and Germany","Austria-Hungary","Russia","France","Socialism and labor unions","European diplomacy, 1871–1900"],"lesson":"<h3>The big picture<\/h3>\n<p>After 1848 failed, nationalism did not die; it changed hands. Instead of idealistic students and poets, hard-headed statesmen used armies and diplomacy, a style called <strong>Realpolitik<\/strong> (\"the politics of reality\"), to build nation-states. In just twelve years <strong>Italy (1861)<\/strong> and <strong>Germany (1871)<\/strong> were unified, the map of Europe was redrawn, and a newly powerful Germany sat at the center of the continent. Meanwhile the old multinational empires (Austria-Hungary, Russia, the Ottoman Empire) struggled to reform, democracies expanded the vote in Britain and France, and the workers' movement grew into mass socialist parties. The period ends with Europe divided into two armed alliance blocs.<\/p>\n<h3>The Crimean War (1853–1856): the Concert breaks<\/h3>\n<p>Russia pressed the weakening <strong>Ottoman Empire<\/strong> (the \"sick man of Europe\"), claiming to protect Orthodox Christians. Britain and France, fearing Russian control of the Straits and the eastern Mediterranean, went to war alongside the Ottomans; little <strong>Piedmont-Sardinia<\/strong> joined too. Most fighting centered on the siege of the Russian naval base at <strong>Sevastopol<\/strong> in the Crimea. The war was notoriously mismanaged (the Charge of the Light Brigade) and killed hundreds of thousands, many from disease; <strong>Florence Nightingale's<\/strong> nursing reforms made her famous.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Russian pressure on the Ottoman Empire alarms Britain and France<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Crimean War (1853–56); Russia defeated; Treaty of Paris (1856)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Concert of Europe shattered; Austria isolated; Russia turns to internal reform; the way opens for Italian and German unification<\/div><\/div>\n<p>The <strong>Treaty of Paris (1856)<\/strong> neutralized the Black Sea. More important were the side effects: the great powers no longer cooperated to keep the 1815 order, <strong>Austria<\/strong> had angered Russia by not helping it, and Russia began the Great Reforms. Without the Concert, Cavour and Bismarck could redraw the map.<\/p>\n<h3>The unification of Italy<\/h3>\n<p>In 1850 Italy was a patchwork: Austria held <strong>Lombardy and Venetia<\/strong>, the pope ruled the <strong>Papal States<\/strong>, Bourbon kings ruled the <strong>Kingdom of the Two Sicilies<\/strong> (Naples and Sicily), and the only independent, constitutional Italian state was <strong>Piedmont-Sardinia<\/strong> under King <strong>Victor Emmanuel II<\/strong>.<\/p>\n<p>Its prime minister, Count <strong>Camillo di Cavour<\/strong> (from 1852), was a liberal and a master of Realpolitik. He modernized Piedmont's economy and railways and sent troops to the Crimean War to win a seat at the peace conference. He knew Piedmont could not beat Austria alone, so at <strong>Plombières (1858)<\/strong> he secretly won French help from <strong>Napoleon III<\/strong> in exchange for Nice and Savoy.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Cavour provokes Austria into war (1859) with French support<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Victories at Magenta and Solferino; Piedmont gains Lombardy; central Italy votes to join; Garibaldi conquers the south (1860)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Kingdom of Italy proclaimed (1861); Venetia added 1866, Rome 1870<\/div><\/div>\n<p>In the <strong>war of 1859<\/strong>, French and Piedmontese armies won at <strong>Magenta<\/strong> and <strong>Solferino<\/strong>, and Piedmont gained <strong>Lombardy<\/strong>. (The bloodshed at Solferino inspired the founding of the <strong>Red Cross<\/strong>.) The duchies of central Italy overthrew their rulers and voted by <strong>plebiscite<\/str
