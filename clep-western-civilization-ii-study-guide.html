nch and Piedmontese armies won at <strong>Magenta<\/strong> and <strong>Solferino<\/strong>, and Piedmont gained <strong>Lombardy<\/strong>. (The bloodshed at Solferino inspired the founding of the <strong>Red Cross<\/strong>.) The duchies of central Italy overthrew their rulers and voted by <strong>plebiscite<\/strong> to join Piedmont; Cavour paid Napoleon III with <strong>Nice and Savoy<\/strong>.<\/p>\n<p>Then <strong>Giuseppe Garibaldi<\/strong>, a romantic republican guerrilla, sailed with about 1,000 volunteers, the \"<strong>Red Shirts<\/strong>,\" and conquered <strong>Sicily and Naples<\/strong> (1860). Cavour, fearing Garibaldi would march on Rome and provoke France, sent Piedmont's army through the Papal States to meet him. Garibaldi, a patriot first, <strong>handed his conquests to Victor Emmanuel<\/strong>. In <strong>March 1861<\/strong> the <strong>Kingdom of Italy<\/strong> was proclaimed. <strong>Venetia<\/strong> was added in <strong>1866<\/strong> (Italy allied with Prussia against Austria), and <strong>Rome<\/strong> in <strong>1870<\/strong>, when French troops guarding the pope left to fight Prussia. Rome became the capital; the pope refused to recognize the kingdom and called himself the \"prisoner of the Vatican.\"<\/p>\n<p>Unity did not end Italy's problems: a deep gap between the industrializing <strong>north<\/strong> and the poor, rural <strong>south<\/strong>, hostility from the Church, and a narrow electorate. As one politician put it, \"We have made Italy; now we must make Italians.\"<\/p>\n<h3>The unification of Germany<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Prussian king and parliament deadlock over army reform (1862)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Bismarck wins three short wars: Denmark (1864), Austria (1866), France (1870–71)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>German Empire proclaimed at Versailles (January 1871), dominated by Prussia; France loses Alsace-Lorraine and wants revenge<\/div><\/div>\n<p>Prussia had advantages: a strong army, the <strong>Zollverein<\/strong> customs union that already tied most German states to its economy, and booming coal and steel industries. In 1862 King <strong>William I<\/strong> appointed <strong>Otto von Bismarck<\/strong> minister-president to push through an army expansion that the liberal parliament refused to fund. Bismarck simply collected the taxes anyway, declaring that the great questions of the day would be decided \"not by speeches and majority decisions, but by <strong>iron and blood<\/strong>.\"<\/p>\n<p>Bismarck unified Germany through <strong>three wars<\/strong>: 1. The <strong>Danish War (1864)<\/strong>: Prussia and Austria together took <strong>Schleswig and Holstein<\/strong> from Denmark. Their joint administration gave Bismarck a ready-made quarrel with Austria. 2. The <strong>Austro-Prussian (Seven Weeks') War (1866)<\/strong>: after making sure France and Russia would stay out and allying with Italy, Bismarck crushed Austria at <strong>Königgrätz (Sadowa)<\/strong>. He imposed a lenient peace to avoid lasting hatred, but <strong>Austria was excluded from German affairs<\/strong>. Prussia annexed several states and formed the <strong>North German Confederation (1867)<\/strong>. Prussian liberals, dazzled by victory, forgave Bismarck's illegal taxes. 3. The <strong>Franco-Prussian War (1870–1871)<\/strong>: a dispute over a Hohenzollern candidate for the Spanish throne gave Bismarck his chance. He edited the <strong>Ems Dispatch<\/strong>, a telegram about a meeting between William I and the French ambassador, to make it sound insulting; France declared war. The southern German states joined Prussia; the French army collapsed, and <strong>Napoleon III was captured at Sedan<\/strong> (September 1870). Paris was besieged and surrendered in January 1871.<\/p>\n<p>On <strong>January 18, 1871<\/strong>, in the <strong>Hall of Mirrors at Versailles<\/strong>, William I was proclaimed <strong>German Emperor (Kaiser)<\/strong>. In the peace, France paid a large indemnity and lost <strong>Alsace-Lorraine<\/strong>, leaving a lasting French desire for revenge (<em>revanche<\/em>). Germany was unified \"from above,\" by Prussian arms and princes rather than by a liberal parliament.<\/p>\n<p>The new <strong>German Empire<\/strong> was federal and dominated by Prussia. The <strong>Reichstag<\/strong> was elected by <strong>universal male suffrage<\/strong>, but the <strong>chancellor<\/strong> answered to the Kaiser, not to the Reichstag. As chancellor (1871–1890), Bismarck fought the Catholic Church in the <strong>Kulturkampf<\/strong> (\"culture struggle,\" 1870s), then turned against the socialists with the <strong>Anti-Socialist Laws (1878)<\/strong>. To win workers away from socialism he also created the world's first national <strong>social insurance<\/strong>: health insurance (1883), accident insurance (1884), and old-age and disability pensions (1889). In 1888 <strong>William II<\/strong> became Kaiser; he dismissed Bismarck in <strong>1890<\/strong> and pursued a restless <strong>Weltpolitik<\/strong> (\"world policy\"), including a big navy that alarmed Britain.<\/p>\n<h3>Austria-Hungary<\/h3>\n<p>Defeats in 1859 and 1866 forced the Habsburgs to compromise with their largest and most assertive nationality, the <strong>Magyars<\/strong> (Hungarians). The <strong>Compromise (Ausgleich) of 1867<\/strong> created the <strong>Dual Monarchy of Austria-Hungary<\/strong>: Franz Joseph was emperor of Austria and king of Hungary; each half had its own parliament and government, but they shared foreign policy, the army, and the finances for both. Hungary's Magyar elite then pursued <strong>Magyarization<\/strong> of its own minorities. The other nationalities, especially the <strong>Slavs<\/strong> (Czechs, Poles, Croats, Serbs, Slovaks), resented being left out. Nationalism was a constant threat to the empire's survival.<\/p>\n<h3>Russia: reform and reaction<\/h3>\n<p>Defeat in the Crimea convinced <strong>Alexander II<\/strong> (r. 1855–1881) that Russia had to modernize. In <strong>1861<\/strong> he <strong>emancipated the serfs<\/strong>, more than 20 million people. Peasants gained personal freedom and land, but they had to make <strong>redemption payments<\/strong> for decades, and the land was usually held by the village commune (<em>mir<\/em>), which limited mobility. He also created elected local councils (<strong>zemstvos<\/strong>, 1864), reformed the courts with jury trials, and shortened military service. Radicals were not satisfied; populists (<em>narodniki<\/em>) tried to stir the peasants, and the terrorist group <strong>People's Will assassinated Alexander II in 1881<\/strong>.<\/p>\n<p>His son <strong>Alexander III<\/strong> responded with reaction: censorship, police repression and <strong>Russification<\/strong> (forcing Russian language and Orthodoxy on minorities). <strong>Pogroms<\/strong>, violent attacks on Jews, spread, and millions of Jews emigrated. Under <strong>Sergei Witte<\/strong>, finance minister in the 1890s, Russia industrialized rapidly with foreign loans, building the <strong>Trans-Siberian Railway<\/strong>. Defeat by Japan (1904–1905) and the <strong>Revolution of 1905<\/strong> (beginning with <strong>Bloody Sunday<\/strong>, when troops fired on peaceful petitioners) forced <strong>Nicholas II<\/strong> to issue the <strong>October Manifesto<\/strong>, promising civil rights and an elected parliament, the <strong>Duma<\/strong>, which he soon restricted (Unit 10).<\/p>\n<h3>France and Britain: toward democracy<\/h3>\n<p><strong>France.<\/strong> Napoleon III's <strong>Second Empire<\/strong> (1852–1870) rebuilt Paris with wide boulevards (Baron <strong>Haussmann<\/strong>), promoted railways and banks, and liberalized in the 1860s, but collapsed at Sedan. The <strong>Third Republic<\/strong> was born in defeat. In 1871 radical Parisians set up the <strong>Paris Commune<\/strong>, which the national government crushed in \"Bloody Week\" (about 20,000 killed), leaving lasting class bitterness. The Republic survived scandals and the nationalist general <strong>Boulanger<\/strong>. The <strong>Dreyfus Affair<\/strong> (1894–1906), in which <strong>Captain Alfred Dreyfus<\/strong>, a Jewish army officer, was falsely convicted of spying for Germany, split France between the army, Church and anti-Semitic right on one side and republicans, socialists and intellectuals on the other. <strong>Émile Zola's<\/strong> open letter \"<strong>J'accuse!<\/strong>\" (1898) accused the army of a cover-up. Dreyfus was cleared in 1906, and the republicans' victory led to the <strong>separation of church and state (1905)<\/strong>. The affair also convinced journalist <strong>Theodor Herzl<\/strong> that Jews needed their own state, and he founded political <strong>Zionism<\/strong> (1897).<\/p>\n<p><strong>Britain<\/strong> widened democracy by reform rather than revolution. The Conservative <strong>Benjamin Disraeli<\/strong> passed the <strong>Second Reform Act (1867)<\/strong>, enfranchising many urban working men; the Liberal <strong>William Gladstone's<\/strong> governments introduced the <strong>secret ballot (1872)<\/strong> and the <strong>Third Reform Act (1884)<\/strong> for rural workers. Gladstone repeatedly tried, and failed, to give <strong>Home Rule<\/strong> to <strong>Ireland<\/strong>. The <strong>Labour Party<\/strong> formed (1900–1906), the <strong>Parliament Act of 1911<\/strong> ended the House of Lords' veto, and the <strong>suffragettes<\/strong> led by <strong>Emmeline Pankhurst<\/strong> campaigned, sometimes militantly, for women's votes.<\/p>\n<h3>Socialism and labor unions<\/h3>\n<p>Trade unions grew rapidly, especially \"new unions\" of unskilled workers after the 1889 London dock strike. Marx helped found the <strong>First International<\/strong> (1864), which split between Marxists and anarchists led by <strong>Mikhail Bakunin<\/strong>. The <strong>Second International<\/strong> (1889) united national socialist parties. The largest was Germany's <strong>Social Democratic Party (SPD)<\/strong>, which survived the Anti-Socialist Laws and became the <strong>largest party in the Reichstag by 1912<\/strong>.<\/p>\n<p>Socialists argued about strategy. <strong>Eduard Bernstein's revisionism<\/strong> (<em>Evolutionary Socialism<\/em>, 1899) said capitalism was not collapsing and socialism could come gradually through elections and reforms. Orthodox Marxists such as Karl Kautsky insisted on revolution in theory while working within parliaments in practice. <strong>Syndicalists<\/strong> (Georges Sorel) put their faith in the general strike. In Britain, the <strong>Fabian Society<\/strong> pursued gradual, democratic socialism.<\/p>\n<h3>Diplomacy, 1871–1914: Bismarck's system and its collapse<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>A unified Germany fears a French war of revenge over Alsace-Lorraine<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Bismarck builds alliances to keep France isolated (Dual Alliance, Triple Alliance, Reinsurance Treaty)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>William II drops Russia (1890); France and Russia ally (1894); Britain joins them: Europe splits into two armed camps<\/div><\/div>\n<p>After 1871, Bismarck called Germany \"satiated\" and worked to keep the peace and keep France <strong>isolated<\/strong>. His tools: the <strong>Three Emperors' League<\/strong> (Germany, Austria-Hungary, Russia, 1873 and 1881); the <strong>Congress of Berlin (1878)<\/strong>, where he acted as \"honest broker\" after Russia defeated the Ottomans and revised the Treaty of San Stefano: Serbia, Montenegro and Romania became independent, a big Bulgaria was cut down, and Austria-Hungary was allowed to occupy <strong>Bosnia-Herzegovina<\/strong> (which angered Russia); the <strong>Dual Alliance (1879)<\/strong> with Austria-Hungary; the <strong>Triple Alliance (1882)<\/strong> adding Italy; and the secret <strong>Reinsurance Treaty (1887)<\/strong> with Russia.<\/p>\n<p>William II let the Reinsurance Treaty lapse in <strong>1890<\/strong>. France quickly courted Russia with loans and signed the <strong>Franco-Russian Alliance (1894)<\/strong>, the nightmare of a two-front war Bismarck had avoided. Britain, alarmed by Germany's navy, left its \"splendid isolation\": the <strong>Entente Cordiale (1904)<\/strong> settled colonial quarrels with France, and the <strong>Anglo-Russian Entente (1907)<\/strong> did the same with Russia, creating the <strong>Triple Entente<\/strong>. Europe was now divided into two blocs: the <strong>Triple Alliance<\/strong> (Germany, Austria-Hungary, Italy) and the <strong>Triple Entente<\/strong> (France, Russia, Britain).<\/p>","words":1964,"minutes":14,"mustKnow":["<strong>Realpolitik:<\/strong> practical power politics (Cavour, Bismarck) replaced 1848 idealism.","<strong>Crimean War (1853–56):<\/strong> Russia vs. Ottomans, Britain, France, Piedmont; broke the Concert of Europe and isolated Austria.","<strong>Italy:<\/strong> Cavour (diplomacy, French alliance, 1859 war → Lombardy), Garibaldi (Red Shirts take Sicily and Naples, 1860), Victor Emmanuel II king (1861); Venetia 1866, Rome 1870.","<strong>Germany:<\/strong> Bismarck's \"iron and blood\"; three wars (Denmark 1864, Austria 1866, France 1870–71); Ems Dispatch; Empire proclaimed at Versailles (1871); Alsace-Lorraine annexed.","<strong>Bismarck at home:<\/strong> Kulturkampf, Anti-Socialist Laws (1878), first social insurance (1880s).","<strong>Ausgleich (1867):<\/strong> Dual Monarchy of Austria-Hungary; Slavs left out.","<strong>Russia:<\/strong> Alexander II freed the serfs (1861), zemstvos; assassinated 1881; Alexander III's Russification and pogroms; 1905 revolution → Duma.","<strong>France:<\/strong> Paris Commune (1871); Third Republic; <strong>Dreyfus Affair<\/strong> (Zola's \"J'accuse!\") → separation of church and state (1905).","<strong>Britain:<\/strong> Reform Acts of 1867 and 1884, secret ballot (1872), Irish Home Rule fights, suffragettes.","<strong>Alliances:<\/strong> Dual Alliance (1879), Triple Alliance (1882), Reinsurance Treaty lapses (1890), Franco-Russian Alliance (1894), Entente Cordiale (1904), Triple Entente (1907)."],"timeline":[{"y":"1853–1856","label":"Crimean War","note":"Concert of Europe breaks down","key":true},{"y":"1858","label":"Plombières agreement","note":"Cavour secures French help","key":false},{"y":"1859","label":"Franco-Piedmontese war with Austria","note":"Magenta, Solferino; Lombardy to Piedmont","key":true},{"y":"1860","label":"Garibaldi's expedition","note":"Red Shirts conquer Sicily and Naples","key":false},{"y":"1861","label":"Kingdom of Italy; Russian serfs emancipated","note":"Victor Emmanuel II; Alexander II's reform","key":true},{"y":"1862","label":"Bismarck becomes Prussian minister-president","note":"\"Iron and blood\"","key":false},{"y":"1864","label":"Danish War","note":"Schleswig-Holstein seized","key":false},{"y":"1866","label":"Austro-Prussian War (Königgrätz)","note":"Austria excluded from Germany","key":true},{"y":"1867","label":"Ausgleich; Second Reform Act","note":"Dual Monarchy; urban workers vote in Britain","key":true},{"y":"1870–1871","label":"Franco-Prussian War","note":"Sedan; Rome joins Italy; Third Republic","key":true},{"y":"1871","label":"German Empire proclaimed; Paris Commune","note":"Hall of Mirrors; Alsace-Lorraine annexed","key":true},{"y":"1878","label":"Congress of Berlin; Anti-Socialist Laws","note":"Bismarck as honest broker","key":false},{"y":"1879","label":"Dual Alliance","note":"Germany and Austria-Hungary","key":false},{"y":"1881","label":"Alexander II assassinated","note":"Reaction under Alexander III","key":false},{"y":"1882","label":"Triple Alliance","note":"Germany, Austria-Hungary, Italy","key":false},{"y":"1890","label":"Bismarck dismissed","note":"Reinsurance Treaty lapses","key":false},{"y":"1894","label":"Franco-Russian Alliance; Dreyfus convicted","note":"Two-front threat to Germany","key":false},{"y":"1898","label":"Zola's \"J'accuse!\"","note":"Dreyfus Affair peaks","key":false},{"y":"1904","label":"Entente Cordiale","note":"Britain and France settle differences","key":true},{"y":"1905","label":"Russian Revolution of 1905; French separation of church and state","note":"October Manifesto, Duma","key":false},{"y":"1907","label":"Triple Entente","note":"Britain, France, Russia","key":true}],"cards":[{"id":"u8c1","front":"Realpolitik","back":"Politics based on practical power and interests rather than ideals.","person":false},{"id":"u8c2","front":"Crimean War (1853–56)","back":"Russia vs. Ottomans, Britain, France and Piedmont; broke the Concert of Europe.","person":false},{"id":"u8c3","front":"Camillo di Cavour","back":"Prime minister of Piedmont-Sardinia; used diplomacy and French help to unify northern Italy.","person":true},{"id":"u8c4","front":"Giuseppe Garibaldi","back":"Led the Red Shirts to conquer Sicily and Naples (1860), then handed them to Victor Emmanuel II.","person":true},{"id":"u8c5","front":"Victor Emmanuel II","back":"King of Piedmont-Sardinia who became first king of united Italy (1861).","person":true},{"id":"u8c6","front":"Otto von Bismarck","back":"Prussian minister-president and German chancellor; unified Germany through \"iron and blood.\"","person":true},{"id":"u8c7","front":"Ems Dispatch (1870)","back":"Telegram Bismarck edited to provoke France into the Franco-Prussian War.","person":false},{"id":"u8c8","front":"Battle of Sedan (1870)","back":"Prussian victory; Napoleon III captured.","person":false},{"id":"u8c9","front":"German Empire proclaimed (1871)","back":"William I crowned Kaiser in the Hall of Mirrors at Versailles.","person":false},{"id":"u8c10","front":"Kulturkampf","back":"Bismarck's 1870s campaign against the Catholic Church in Germany.","person":false},{"id":"u8c11","front":"Bismarck's social insurance","back":"Health (1883), accident (1884) and old-age (1889) insurance to undercut socialism.","person":false},{"id":"u8c12","front":"Ausgleich (1867)","back":"Compromise creating the Dual Monarchy of Austria-Hungary.","person":false},{"id":"u8c13","front":"Alexander II","back":"Russian tsar who emancipated the serfs (1861); assassinated 1881.","person":true},{"id":"u8c14","front":"Emancipation of the serfs (1861)","back":"Freed Russia's serfs; peasants owed redemption payments; land held by communes.","person":false},{"id":"u8c15","front":"Russification","back":"Forcing Russian language and Orthodoxy on minorities under Alexander III.","person":false},{"id":"u8c16","front":"Paris Commune (1871)","back":"Radical Paris government crushed by the French army in \"Bloody Week.\"","person":false},{"id":"u8c17","front":"Dreyfus Affair","back":"False conviction of a Jewish French officer (1894); exposed anti-Semitism; Zola's \"J'accuse!\"","person":false},{"id":"u8c18","front":"Theodor Herzl","back":"Founder of political Zionism (1897), influenced by the Dreyfus Affair.","person":true},{"id":"u8c19","front":"Eduard Bernstein","back":"Revisionist socialist: reach socialism gradually through elections and reform.","person":true},{"id":"u8c20","front":"Second Reform Act (1867)","back":"Disraeli's law giving the vote to many urban working men in Britain.","person":false},{"id":"u8c21","front":"Triple Alliance (1882)","back":"Germany, Austria-Hungary and Italy.","person":false},{"id":"u8c22","front":"Triple Entente (1907)","back":"France, Russia and Britain.","person":false}],"hours":1.92,"quizIds":["u8q4","u8q5","u8q6","u8q8","u8q13","u8q18","u8q22","u8q25","u8q28","u8q29","u8q33","u8q35","u8q36"]},{"id":9,"title":"Economy, Culture, and Imperialism, 1850–1914","short":"Economy, Culture & Empire","range":"1850–1914","weight":{"min":7,"max":9,"verified":true},"subtopics":["Demography","Mass politics","Science, technology, and industrial growth","Imperialism in Africa and Asia","Modern art, thought, and literature"],"lesson":"<h3>The big picture<\/h3>\n<p>Between 1850 and 1914 Europe reached the peak of its power and confidence. A <strong>Second Industrial Revolution<\/strong> built on steel, chemicals, electricity and oil made Europe and the United States the workshops of the world. Population soared, cities were cleaned up, and tens of millions emigrated. Ordinary people became literate voters reading cheap newspapers: the age of <strong>mass politics<\/strong>. Europeans used their new technology to seize most of Africa and much of Asia in the <strong>New Imperialism<\/strong>. Yet at the same time, scientists and artists such as <strong>Darwin, Freud, Nietzsche, Einstein and Picasso<\/strong> undermined older certainties about humanity, reason and reality. This unit mixes economics, empire and culture; expect \"match the thinker to the idea\" and \"what motivated imperialism\" questions.<\/p>\n<h3>The Second Industrial Revolution<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>New processes and science-based industry: Bessemer steel (1856), synthetic chemicals, electricity, the internal combustion engine<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Mass production, big corporations and cartels; Germany and the U.S. overtake Britain<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>A global economy, consumer goods, and fierce competition for markets and raw materials<\/div><\/div>\n<p>The first industrial revolution ran on cotton, coal, iron and steam. The second (about <strong>1870–1914<\/strong>) ran on: - <strong>Steel:<\/strong> Henry Bessemer's converter (1856) made cheap steel for railways, ships, bridges and weapons. - <strong>Chemicals:<\/strong> German firms led in synthetic dyes, fertilizers, pharmaceuticals and explosives, often employing university-trained scientists. - <strong>Electricity:<\/strong> dynamos and power stations; Thomas Edison's practical light bulb (1879); electric trams and factory motors. - <strong>Oil and the internal combustion engine:<\/strong> Gottlieb Daimler and Karl Benz built early automobiles in the 1880s; Rudolf Diesel his engine in the 1890s. - <strong>Communications:<\/strong> the telephone (Bell, 1876) and radio (Marconi, 1890s), plus undersea telegraph cables.<\/p>\n<p><strong>Germany<\/strong> became the industrial leader of the continent and, with the <strong>United States<\/strong>, overtook Britain in steel production by about 1900. Businesses grew into giant corporations; in Germany, firms formed <strong>cartels<\/strong> that fixed prices and shared markets. A long slump in prices and profits, the <strong>Long Depression<\/strong> (about 1873–1896), led most countries except Britain to abandon free trade for <strong>protective tariffs<\/strong> (Germany in 1879). Wages slowly rose; department stores, advertising and brand-name goods created a <strong>consumer society<\/strong> for the middle class and better-off workers.<\/p>\n<h3>Demography: more people, healthier cities, mass migration<\/h3>\n<p>Europe's population rose from about <strong>266 million in 1850 to more than 450 million by 1914<\/strong>. The main reason was again a falling death rate, now helped by real medical and sanitary advances. <strong>Louis Pasteur<\/strong> proved the <strong>germ theory of disease<\/strong> in the 1860s (and developed pasteurization and vaccines); <strong>Robert Koch<\/strong> identified the bacteria causing tuberculosis (1882) and cholera; <strong>Joseph Lister<\/strong> introduced antiseptic surgery (1867). Governments built <strong>sewers and clean water systems<\/strong>; after London's \"Great Stink\" of 1858, engineers built a modern sewer network. In Paris, Baron <strong>Haussmann<\/strong> replaced slums with broad boulevards, parks and sewers. Late in the century, birth rates also began to fall, first in France, as middle-class families chose to have fewer children.<\/p>\n<p>Even so, Europe could not employ everyone. Between 1815 and 1914 about <strong>50 million Europeans emigrated<\/strong>, mostly to the <strong>United States<\/strong>, Canada, Argentina, Brazil and Australia. Early waves came from Ireland (driven by the <strong>potato famine<\/strong> of 1845–1852, which killed about a million people) and Germany; later waves from <strong>Italy<\/strong>, Austria-Hungary and the Russian Empire, including many Jews fleeing pogroms.<\/p>\n<h3>Mass politics and society<\/h3>\n<p>By 1914 most Western European men could vote. To vote sensibly, the argument went, citizens needed schools: states created <strong>free, compulsory primary education<\/strong> (Britain from 1870; France under the <strong>Ferry laws<\/strong> of the 1880s, which made schools secular). Literacy brought a cheap <strong>mass press<\/strong> (Britain's <em>Daily Mail<\/em>, 1896) that often whipped up nationalism. <strong>Mass political parties<\/strong> with dues-paying members, newspapers and clubs replaced loose groups of notables: socialist parties on the left, Catholic parties, and new <strong>radical-right<\/strong> movements that mixed nationalism, anti-Semitism and hostility to liberalism (for example, Karl Lueger, the anti-Semitic mayor of Vienna).<\/p>\n<p>Women organized too. <strong>Feminists<\/strong> campaigned for property rights, education, entry into professions and the vote. The <strong>suffragists<\/strong> used petitions and persuasion; the British <strong>suffragettes<\/strong> of Emmeline Pankhurst's Women's Social and Political Union (founded 1903) used militant tactics. Before 1914 only <strong>Finland (1906)<\/strong> and <strong>Norway (1913)<\/strong> gave women the national vote in Europe.<\/p>\n<h3>The New Imperialism, 1880–1914<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Industrial economies want raw materials, markets and investment outlets; nationalist rivalry; social Darwinist and \"civilizing\" ideas<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>The Scramble for Africa and expansion in Asia, made possible by steamships, quinine, railways and the machine gun<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>By 1914 Europeans control about 90 percent of Africa; colonized peoples suffer exploitation and violence; rivalries worsen tensions in Europe<\/div><\/div>\n<p>Europeans had held coastal trading posts for centuries. After about 1880, they rushed to conquer and directly rule vast interiors. Historians list several <strong>motives<\/strong>: - <strong>Economic:<\/strong> raw materials (rubber, cotton, copper, palm oil), new markets and investment opportunities. The British economist <strong>J. A. Hobson<\/strong> (<em>Imperialism<\/em>, 1902) argued that capitalists pushed imperialism to find profitable investments; <strong>Lenin<\/strong> later called imperialism \"the highest stage of capitalism\" (1916). - <strong>Political and strategic:<\/strong> national prestige, coaling stations and naval bases, and fear of rivals grabbing land first. - <strong>Ideological:<\/strong> <strong>social Darwinism<\/strong>, the misapplication of Darwin's ideas to claim that some races and nations were \"fitter\" than others; the \"<strong>civilizing mission<\/strong>\"; and Christian <strong>missionaries<\/strong>. <strong>Rudyard Kipling's<\/strong> poem \"<strong>The White Man's Burden<\/strong>\" (1899) urged Americans and Britons to rule \"new-caught, sullen peoples\" as a duty. - <strong>Enablers:<\/strong> the steamship, telegraph and railway; <strong>quinine<\/strong>, which protected Europeans against malaria; and the <strong>Maxim gun<\/strong>, an early machine gun. As one poet put it, \"Whatever happens, we have got the Maxim gun, and they have not.\"<\/p>\n<p><strong>Africa.<\/strong> To avoid war over Africa, Bismarck hosted the <strong>Berlin Conference (1884–1885)<\/strong>, which set the rule that a power must \"effectively occupy\" territory to claim it. No Africans were invited. Within twenty years almost the whole continent was divided; only <strong>Ethiopia<\/strong>, which crushed an Italian army at <strong>Adwa (1896)<\/strong>, and <strong>Liberia<\/strong> stayed independent. King <strong>Leopold II of Belgium<\/strong> ran the <strong>Congo Free State<\/strong> as his personal property, forcing Africans to gather rubber under a regime of terror and mutilation that killed millions; international outrage forced Belgium to take over the colony in 1908. Britain bought shares in the <strong>Suez Canal<\/strong> (1875), occupied <strong>Egypt<\/strong> (1882), and dreamed (with <strong>Cecil Rhodes<\/strong>) of a \"Cape to Cairo\" railway. British and French expansion collided at <strong>Fashoda<\/strong> in Sudan (1898); France backed down. Britain fought the Dutch-descended <strong>Boers<\/strong> in the <strong>South African (Boer) War (1899–1902)<\/strong>, using concentration camps in which tens of thousands of Boer and African civilians died. In German Southwest Africa (Namibia), the army's campaign against the <strong>Herero and Nama<\/strong> (1904–1907) killed most of the Herero people, now widely recognized as genocide.<\/p>\n<p><strong>Asia.<\/strong> In <strong>India<\/strong>, the <strong>Indian Rebellion (Sepoy Mutiny) of 1857<\/strong> led Britain to end East India Company rule; from <strong>1858<\/strong> the British crown ruled directly (the <strong>Raj<\/strong>), and Queen Victoria became Empress of India in 1876. In <strong>China<\/strong>, Britain's victory in the <strong>Opium War (1839–1842)<\/strong> forced open ports and gave it <strong>Hong Kong<\/strong>; later \"unequal treaties\" carved China into foreign <strong>spheres of influence<\/strong>, and the anti-foreign <strong>Boxer Rebellion (1900)<\/strong> was crushed by an international force. France took <strong>Indochina<\/strong> (Vietnam, Cambodia, Laos). <strong>Japan<\/strong> responded differently: after the <strong>Meiji Restoration (1868)<\/strong> it rapidly modernized on Western lines, defeated China (1895) and then <strong>Russia (1905)<\/strong>, the first modern Asian victory over a European great power.<\/p>\n<h3>Science and thought: new certainties and new doubts<\/h3>\n<p><strong>Charles Darwin's <em>On the Origin of Species<\/em> (1859)<\/strong> argued that species evolve through <strong>natural selection<\/strong>: individuals with traits better suited to their environment survive and reproduce. <em>The Descent of Man<\/em> (1871) placed humans in the same process. Darwin shocked religious believers who read Genesis literally. <strong>Herbert Spencer<\/strong> coined \"<strong>survival of the fittest<\/strong>\" and applied it to society, giving rise to <strong>social Darwinism<\/strong>, used to justify laissez-faire, imperialism and racism.<\/p>\n<p>Physics overturned the Newtonian world: <strong>Wilhelm Röntgen<\/strong> discovered X-rays (1895); <strong>Marie Curie<\/strong> (with Pierre Curie) studied <strong>radioactivity<\/strong> and won two Nobel Prizes; <strong>Max Planck<\/strong> proposed quantum theory (1900); <strong>Albert Einstein's<\/strong> theory of <strong>relativity<\/strong> (1905) showed that time and space are not absolute.<\/p>\n<p><strong>Sigmund Freud<\/strong>, a Viennese doctor, founded <strong>psychoanalysis<\/strong> (<em>The Interpretation of Dreams<\/em>, 1900). He argued that human behavior is driven largely by the <strong>unconscious<\/strong>, by repressed desires (especially sexual and aggressive drives), and he described the mind as the id, ego and superego. Humans were less rational than the Enlightenment had believed.<\/p>\n<p><strong>Friedrich Nietzsche<\/strong> attacked Christianity and middle-class morality as \"slave morality,\" declared \"<strong>God is dead<\/strong>,\" praised the <strong>will to power<\/strong>, and imagined a \"superman\" (<em>Übermensch<\/em>) who would create his own values. Others built new social sciences: Auguste Comte's <strong>positivism<\/strong> (only scientific knowledge is real), and the sociologists <strong>Émile Durkheim<\/strong> and <strong>Max Weber<\/strong> (<em>The Protestant Ethic and the Spirit of Capitalism<\/em>, 1905).<\/p>\n<h3>Literature and the arts: from Realism to Modernism<\/h3>\n<p>Mid-century <strong>Realism<\/strong> rejected Romantic idealism to show ordinary life truthfully: <strong>Gustave Courbet<\/strong> painted laborers (<em>The Stone Breakers<\/em>); novelists <strong>Gustave Flaubert<\/strong> (<em>Madame Bovary<\/em>, 1857), <strong>Charles Dickens<\/strong>, <strong>Leo Tolstoy<\/strong> and <strong>Émile Zola<\/strong> (whose \"naturalism\" showed people shaped by heredity and environment) described society in detail. Henrik <strong>Ibsen's<\/strong> play <em>A Doll's House<\/em> (1879) challenged women's roles in marriage.<\/p>\n<p><strong>Impressionists<\/strong> such as <strong>Claude Monet<\/strong> and Pierre-Auguste Renoir (first group show 1874) painted outdoors to capture fleeting effects of <strong>light and color<\/strong>. <strong>Post-Impressionists<\/strong> (Paul <strong>Cézanne<\/strong>, Vincent <strong>van Gogh<\/strong>, Paul Gauguin) used color and form to express structure and emotion. By 1914 <strong>Modernism<\/strong> broke with tradition entirely: <strong>Pablo Picasso<\/strong> and Georges Braque invented <strong>Cubism<\/strong>, showing objects from several viewpoints at once (<em>Les Demoiselles d'Avignon<\/em>, 1907); Expressionists painted inner anxiety; and <strong>Igor Stravinsky's<\/strong> ballet <strong><em>The Rite of Spring<\/strong><\/em> caused a riot at its 1913 Paris premiere. Artists and thinkers alike suggested that the world was less orderly and rational than Europe's confident leaders believed.<\/p>","words":1614,"minutes":12,"mustKnow":["<strong>Second Industrial Revolution<\/strong> (c. 1870–1914): steel (Bessemer), chemicals, electricity, oil and the internal combustion engine; Germany and the U.S. overtake Britain; cartels; return to tariffs.","<strong>Public health:<\/strong> Pasteur's germ theory, Koch, Lister; sewers and clean water; death rates fall.","<strong>Mass emigration:<\/strong> about 50 million Europeans left (1815–1914), especially to the U.S.; Irish potato famine.","<strong>Mass politics:<\/strong> wider male suffrage, compulsory schooling, mass press, mass parties; women's suffrage movement (Pankhurst).","<strong>New Imperialism motives:<\/strong> economic (Hobson, Lenin), strategic and nationalist rivalry, social Darwinism and the \"civilizing mission\" (\"White Man's Burden\"); enabled by steamships, quinine, the Maxim gun.","<strong>Berlin Conference (1884–85):<\/strong> rules for dividing Africa; only Ethiopia (Adwa 1896) and Liberia stayed free; Leopold II's Congo atrocities; Fashoda (1898); Boer War (1899–1902).","<strong>Asia:<\/strong> Indian Rebellion (1857) → British Raj (1858); Opium Wars and spheres of influence in China; Boxer Rebellion (1900); Japan's Meiji modernization beats Russia (1905).","<strong>Darwin<\/strong> (natural selection, 1859) → Spencer's <strong>social Darwinism<\/strong>.","<strong>Freud<\/strong> (the unconscious), <strong>Nietzsche<\/strong> (\"God is dead,\" will to power), <strong>Einstein<\/strong> (relativity), <strong>Curie<\/strong> (radioactivity).","<strong>Art:<\/strong> Realism (Courbet) → Impressionism (Monet: light) → Post-Impressionism (Van Gogh, Cézanne) → Cubism (Picasso)."],"timeline":[{"y":"1845–1852","label":"Irish potato famine","note":"About a million die; mass emigration","key":false},{"y":"1856","label":"Bessemer process","note":"Cheap steel","key":false},{"y":"1857–1858","label":"Indian Rebellion; British Raj begins","note":"Crown rule replaces the East India Company","key":true},{"y":"1859","label":"Darwin's On the Origin of Species","note":"Natural selection","key":true},{"y":"1860s","label":"Pasteur's germ theory","note":"Modern public health","key":false},{"y":"1868","label":"Meiji Restoration in Japan","note":"Rapid Westernization","key":false},{"y":"1874","label":"First Impressionist exhibition","note":"Monet and others","key":false},{"y":"1879","label":"Germany adopts protective tariffs","note":"End of free-trade era on the continent","key":false},{"y":"1882","label":"Britain occupies Egypt","note":"Control of the Suez route","key":false},{"y":"1884–1885","label":"Berlin Conference","note":"Rules for the Scramble for Africa","key":true},{"y":"1896","label":"Battle of Adwa","note":"Ethiopia defeats Italy","key":false},{"y":"1898","label":"Fashoda Crisis","note":"Anglo-French showdown in Sudan","key":false},{"y":"1899–1902","label":"Boer War","note":"British war in South Africa","key":false},{"y":"1900","label":"Freud's Interpretation of Dreams; Boxer Rebellion","note":"The unconscious; anti-foreign rising in China","key":true},{"y":"1903","label":"Women's Social and Political Union founded","note":"Militant suffragettes","key":false},{"y":"1905","label":"Einstein's relativity; Japan defeats Russia","note":"New physics; Asian power rises","key":true},{"y":"1907","label":"Picasso's Les Demoiselles d'Avignon","note":"Toward Cubism","key":false}],"cards":[{"id":"u9c1","front":"Second Industrial Revolution","back":"c. 1870–1914: steel, chemicals, electricity, oil; Germany and the U.S. take the lead.","person":false},{"id":"u9c2","front":"Cartels","back":"Agreements among firms (especially in Germany) to fix prices and divide markets.","person":false},{"id":"u9c3","front":"Louis Pasteur","back":"Proved germ theory of disease; pasteurization and vaccines.","person":true},{"id":"u9c4","front":"Mass politics","back":"Era of wide suffrage, mass parties, compulsory schooling and a popular press.","person":false},{"id":"u9c5","front":"Emmeline Pankhurst","back":"Led Britain's militant suffragettes (WSPU, founded 1903).","person":true},{"id":"u9c6","front":"New Imperialism","back":"1880–1914 drive to conquer and directly rule Africa and Asia.","person":false},{"id":"u9c7","front":"Social Darwinism","back":"Misuse of Darwin's ideas to claim some races or nations were \"fitter\" and should dominate.","person":false},{"id":"u9c8","front":"\"The White Man's Burden\"","back":"Kipling's 1899 poem urging Westerners to rule colonized peoples as a duty.","person":false},{"id":"u9c9","front":"J. A. Hobson","back":"British economist (Imperialism, 1902) who blamed imperialism on capitalist search for investment.","person":true},{"id":"u9c10","front":"Berlin Conference (1884–85)","back":"Set rules (\"effective occupation\") for European partition of Africa.","person":false},{"id":"u9c11","front":"Leopold II","back":"Belgian king whose Congo Free State used terror to extract rubber.","person":true},{"id":"u9c12","front":"Battle of Adwa (1896)","back":"Ethiopia defeated Italy and kept its independence.","person":false},{"id":"u9c13","front":"Boer War (1899–1902)","back":"British war against Dutch-descended settlers in South Africa; concentration camps.","person":false},{"id":"u9c14","front":"Indian Rebellion (1857)","back":"Revolt against East India Company rule; led to direct British crown rule (the Raj).","person":false},{"id":"u9c15","front":"Boxer Rebellion (1900)","back":"Anti-foreign uprising in China crushed by an international force.","person":false},{"id":"u9c16","front":"Charles Darwin","back":"On the Origin of Species (1859): evolution by natural selection.","person":true},{"id":"u9c17","front":"Sigmund Freud","back":"Founder of psychoanalysis; behavior driven by the unconscious.","person":true},{"id":"u9c18","front":"Friedrich Nietzsche","back":"\"God is dead\"; will to power; attacked Christian and bourgeois morality.","person":true},{"id":"u9c19","front":"Albert Einstein","back":"Theory of relativity (1905): time and space are not absolute.","person":true},{"id":"u9c20","front":"Impressionism","back":"Late-1800s painting capturing light and fleeting moments (Monet, Renoir).","person":false}],"hours":1.71,"quizIds":["u9q1","u9q4","u9q7","u9q12","u9q18","u9q20","u9q22","u9q26","u9q27","u9q28","u9q33","u9q34"]},{"id":10,"title":"The First World War and the Russian Revolution","short":"WWI & Russian Revolution","range":"1914–1924","weight":{"min":10,"max":12,"verified":true},"subtopics":["Causes of the First World War","Economic and social impact of the war","The peace settlements","The Russian Revolution of 1917"],"lesson":"<h3>The big picture<\/h3>\n<p>The <strong>First World War (1914–1918)<\/strong> destroyed four empires (German, Austro-Hungarian, Russian and Ottoman), killed about <strong>ten million soldiers<\/strong>, and ended a century of European confidence. It also produced the <strong>Russian Revolution<\/strong>, which created the world's first communist state. Together they are about one exam question in nine. Know the long-term causes, the chain of events in July 1914, why the war became a stalemate, how \"total war\" changed society, what the peace treaties did, and the steps from the tsar's fall to Lenin's rule.<\/p>\n<h3>Long-term causes: M-A-I-N<\/h3>\n<p>A handy memory aid is <strong>MAIN<\/strong>: Militarism, Alliances, Imperialism, Nationalism. - <strong>Militarism:<\/strong> huge conscript armies, detailed mobilization timetables, and an <strong>arms race<\/strong>, above all the <strong>Anglo-German naval race<\/strong> after Britain launched the revolutionary battleship <strong>HMS Dreadnought (1906)<\/strong>. Germany's <strong>Schlieffen Plan<\/strong> assumed a two-front war and called for knocking out France quickly through neutral <strong>Belgium<\/strong> before turning on Russia. - <strong>Alliances:<\/strong> Europe was split into the <strong>Triple Alliance<\/strong> (Germany, Austria-Hungary, Italy) and the <strong>Triple Entente<\/strong> (France, Russia, Britain). A local quarrel could pull in every great power. - <strong>Imperialism:<\/strong> colonial rivalries, especially the two <strong>Moroccan Crises<\/strong> (1905 and 1911), in which German pressure on France only drove Britain and France closer together. - <strong>Nationalism:<\/strong> French desire to recover Alsace-Lorraine; <strong>Pan-Slavism<\/strong>, Russia's claim to protect fellow Slavs; and, most dangerous, <strong>Serbian nationalism<\/strong>, which aimed to unite the South Slavs, many of whom lived inside Austria-Hungary.<\/p>\n<p>The <strong>Balkans<\/strong> were the \"powder keg of Europe.\" In the <strong>Bosnian Crisis (1908)<\/strong> Austria-Hungary <strong>annexed Bosnia-Herzegovina<\/strong>, home to many Serbs, infuriating Serbia and humiliating Russia, which backed down. In the <strong>Balkan Wars (1912–1913)<\/strong>, Serbia nearly doubled its territory at Ottoman expense. Austria-Hungary came to see Serbia as a mortal threat.<\/p>\n<h3>The July Crisis of 1914<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>A Bosnian Serb nationalist assassinates Archduke Franz Ferdinand in Sarajevo (June 28, 1914)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Austria, backed by Germany's \"blank check,\" issues an ultimatum and declares war on Serbia; alliances and mobilization plans take over<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Within a week Germany, Russia, France and Britain are at war<\/div><\/div>\n<p>On <strong>June 28, 1914<\/strong>, <strong>Gavrilo Princip<\/strong>, a young Bosnian Serb linked to the Serbian secret society the <strong>Black Hand<\/strong>, shot <strong>Archduke Franz Ferdinand<\/strong>, heir to the Austro-Hungarian throne, and his wife in <strong>Sarajevo<\/strong>. Austria-Hungary decided to crush Serbia. Germany gave it unconditional support, the \"<strong>blank check<\/strong>\" (July 5–6). Austria sent Serbia a harsh <strong>ultimatum<\/strong> (July 23); Serbia accepted most of it, but Austria declared war on <strong>July 28<\/strong>. Russia mobilized to protect Serbia. Germany declared war on <strong>Russia (August 1)<\/strong> and <strong>France (August 3)<\/strong> and, following the Schlieffen Plan, invaded <strong>Belgium<\/strong>. Because Britain had guaranteed Belgian neutrality (Treaty of London, 1839), <strong>Britain declared war on Germany on August 4<\/strong>. Italy stayed neutral, then joined the Allies in 1915 in return for promised Austrian land. The <strong>Ottoman Empire<\/strong> (1914) and <strong>Bulgaria<\/strong> (1915) joined Germany and Austria-Hungary as the <strong>Central Powers<\/strong>.<\/p>\n<p>Who was to blame? The Allies said Germany, and wrote \"war guilt\" into the peace treaty. In the 1960s the German historian <strong>Fritz Fischer<\/strong> argued that Germany's leaders had aggressive aims and welcomed war. Others stress shared responsibility: rigid alliances and mobilization plans, nationalism everywhere, and leaders who \"sleepwalked\" into a war they did not fully foresee.<\/p>\n<h3>The war: stalemate and total war<\/h3>\n<p><strong>Western Front.<\/strong> The Germans swept through Belgium toward Paris, but the French and British stopped them at the <strong>First Battle of the Marne (September 1914)<\/strong>. Both sides dug in. Soon a line of <strong>trenches<\/strong> ran 400 miles from the North Sea to Switzerland. Defensive weapons, <strong>machine guns<\/strong>, barbed wire and artillery, made attacks suicidal; offensives gained a few miles at the cost of hundreds of thousands of lives. At <strong>Verdun (1916)<\/strong> the Germans tried to \"bleed France white\"; the battle lasted ten months and cost about 700,000 casualties. At the <strong>Somme (1916)<\/strong> the British suffered about 57,000 casualties on the first day alone; <strong>tanks<\/strong> made their debut there. <strong>Poison gas<\/strong> was first used on a large scale at Ypres in 1915. Airplanes were used for scouting and then combat.<\/p>\n<p><strong>Eastern Front and elsewhere.<\/strong> The Germans under <strong>Hindenburg and Ludendorff<\/strong> crushed a Russian invasion at <strong>Tannenberg (1914)<\/strong>. The front in the east stayed more mobile, but Russia suffered staggering losses. To open a supply route to Russia, the Allies attacked the Ottoman Straits at <strong>Gallipoli (1915–1916)<\/strong>, a costly failure. The British encouraged an <strong>Arab Revolt<\/strong> against the Ottomans (with T. E. Lawrence). In 1915 the Ottoman government carried out the <strong>Armenian genocide<\/strong>, killing over a million Armenians.<\/p>\n<p><strong>At sea.<\/strong> Britain's <strong>naval blockade<\/strong> slowly starved Germany. Germany replied with <strong>submarine (U-boat)<\/strong> warfare; the sinking of the liner <strong><em>Lusitania<\/em> (1915)<\/strong>, with 128 Americans aboard, angered the United States.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Germany resumes unrestricted submarine warfare (1917); the Zimmermann Telegram offers Mexico U.S. land<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>The United States enters the war (April 1917)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Fresh American troops and resources tip the balance after Russia leaves the war<\/div><\/div>\n<p>In 1917 Germany gambled on <strong>unrestricted submarine warfare<\/strong>, and the British intercepted the <strong>Zimmermann Telegram<\/strong>, a German proposal of alliance to Mexico. The <strong>United States declared war in April 1917<\/strong>. That same year Russia collapsed into revolution and left the war (<strong>Treaty of Brest-Litovsk, March 1918<\/strong>). Germany shifted troops west for a final <strong>Spring Offensive (1918)<\/strong>, which failed. Allied counterattacks, with growing American forces, pushed the exhausted Germans back. With its allies collapsing and revolution spreading at home, Germany's Kaiser <strong>William II abdicated<\/strong>, and an <strong>armistice<\/strong> took effect on <strong>November 11, 1918<\/strong>.<\/p>\n<h3>The home front: total war<\/h3>\n<p>The war was <strong>total war<\/strong>: entire societies and economies were mobilized. Governments took control of industry, labor, food and prices; in Germany, Walther Rathenau's War Raw Materials Office directed the economy, and the 1916 Auxiliary Service Law drafted civilian men for war work. Food and fuel were <strong>rationed<\/strong>. <strong>Propaganda<\/strong> demonized the enemy, and censorship (such as Britain's Defence of the Realm Act) controlled the news. Governments paid with borrowing and printing money, causing <strong>inflation<\/strong> and leaving huge <strong>debts<\/strong>, much of it owed to the <strong>United States<\/strong>, which became the world's leading creditor.<\/p>\n<p>Millions of <strong>women<\/strong> took jobs in munitions factories, offices, transport and nursing. Partly in recognition, <strong>British women over 30 gained the vote in 1918<\/strong>, and women in Germany, Austria, Poland and other new republics won it in 1918–1919 (France waited until 1944). The war killed around <strong>10 million soldiers<\/strong> and millions of civilians; a \"<strong>lost generation<\/strong>\" of young men was gone. The <strong>influenza pandemic<\/strong> of 1918–1919 killed even more people worldwide. Disillusionment with old values filled postwar literature, such as Erich Maria Remarque's <strong><em>All Quiet on the Western Front<\/strong><\/em> (1929).<\/p>\n<h3>The peace settlements<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Germany asks for an armistice expecting Wilson's Fourteen Points<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Paris Peace Conference (1919): Treaty of Versailles with war guilt, reparations, disarmament and territorial losses<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>New nation-states in central Europe; a resentful Germany; a League of Nations without the U.S.<\/div><\/div>\n<p>The victors met in Paris in <strong>1919<\/strong>. The \"<strong>Big Four<\/strong>\" were <strong>Woodrow Wilson<\/strong> (United States), <strong>David Lloyd George<\/strong> (Britain), <strong>Georges Clemenceau<\/strong> (France) and <strong>Vittorio Orlando<\/strong> (Italy). Germany and Soviet Russia were not invited to negotiate. Wilson's <strong>Fourteen Points<\/strong> (January 1918) called for open diplomacy, freedom of the seas, free trade, arms reduction, <strong>national self-determination<\/strong>, and a <strong>League of Nations<\/strong> to keep the peace. Clemenceau, whose country had been invaded twice in fifty years, wanted security and German payment. Lloyd George sought a middle way.<\/p>\n<p>The <strong>Treaty of Versailles<\/strong> (signed <strong>June 28, 1919<\/strong>) with Germany: - <strong>Article 231, the \"war guilt clause,\"<\/strong> made Germany accept responsibility for the war's losses, the legal basis for <strong>reparations<\/strong> (set in 1921 at 132 billion gold marks). - <strong>Territory:<\/strong> Alsace-Lorraine to France; land in the east to the new <strong>Poland<\/strong>, including the \"<strong>Polish Corridor<\/strong>\" to the sea that split East Prussia from Germany; <strong>Danzig<\/strong> a free city; the <strong>Saar<\/strong> under League control for 15 years; all <strong>colonies<\/strong> taken and handed to the victors as League <strong>mandates<\/strong>. - <strong>Military:<\/strong> army limited to <strong>100,000<\/strong> men; no air force, tanks or submarines; the <strong>Rhineland demilitarized<\/strong> and occupied by the Allies. - Union (<strong>Anschluss<\/strong>) with Austria forbidden.<\/p>\n<p>Germans called it a <em>Diktat<\/em>, a dictated peace. The economist <strong>John Maynard Keynes<\/strong> warned in <em>The Economic Consequences of the Peace<\/em> (1919) that the reparations would wreck Europe's economy. Separate treaties broke up Austria-Hungary (<strong>Saint-Germain<\/strong> with Austria, <strong>Trianon<\/strong> with Hungary, which lost two-thirds of its territory) and punished Bulgaria (Neuilly) and the Ottoman Empire (<strong>Sèvres<\/strong>, 1920, later replaced by the Treaty of <strong>Lausanne<\/strong>, 1923, after Mustafa Kemal's Turkish nationalists fought back). New or restored states appeared: <strong>Poland, Czechoslovakia, Yugoslavia<\/strong> (the Kingdom of Serbs, Croats and Slovenes), Austria, Hungary, Finland, Estonia, Latvia and Lithuania. But \"self-determination\" was applied unevenly, leaving large minorities, such as 3 million Germans in Czechoslovakia's <strong>Sudetenland<\/strong>. Former Ottoman Arab lands became British (Palestine, Iraq, Transjordan) and French (Syria, Lebanon) <strong>mandates<\/strong>, despite wartime promises to the Arabs and Britain's <strong>Balfour Declaration (1917)<\/strong> supporting a Jewish \"national home\" in Palestine.<\/p>\n<p>The <strong>League of Nations<\/strong> was created, but the <strong>U.S. Senate refused to ratify the treaty<\/strong>, so the United States never joined, a fatal blow to the League's authority.<\/p>\n<h3>The Russian Revolution<\/h3>\n<p><strong>Background.<\/strong> Nicholas II's Russia entered the war already strained by the 1905 revolution, a weak Duma, peasant land hunger and a small but radical industrial working class. The war was a disaster: millions of casualties, shortages of weapons and food, and inflation. Nicholas took personal command at the front in 1915, leaving the government to the unpopular Empress Alexandra and the mystic <strong>Rasputin<\/strong>, who was murdered by nobles in 1916.<\/p>\n<p><strong>The February Revolution (March 1917).<\/strong> Bread riots and strikes in the capital, <strong>Petrograd<\/strong>, turned into revolution when soldiers refused to fire on crowds and joined them. <strong>Nicholas II abdicated<\/strong>, ending three centuries of Romanov rule. Power was shared in an unstable \"<strong>dual power<\/strong>\": the <strong>Provisional Government<\/strong>, dominated by liberals and later led by the moderate socialist <strong>Alexander Kerensky<\/strong>, and the <strong>Petrograd Soviet<\/strong> (council) of workers' and soldiers' deputies. The Provisional Government's fatal mistake was to <strong>keep fighting the war<\/strong> and postpone land reform until an elected assembly could meet.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>The Provisional Government keeps fighting an unpopular war and delays land reform<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Lenin's Bolsheviks promise \"Peace, Land, Bread\" and seize power in the October Revolution (November 1917)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Bolshevik dictatorship, withdrawal from the war (Brest-Litovsk), civil war<\/div><\/div>\n<p><strong>Lenin and the Bolsheviks.<\/strong> <strong>Vladimir Lenin<\/strong> led the <strong>Bolsheviks<\/strong>, the faction of Russia's Marxist party that split from the more moderate <strong>Mensheviks<\/strong> in <strong>1903<\/strong>. Lenin argued that a small, disciplined <strong>vanguard party<\/strong> of professional revolutionaries must lead the workers, and that Russia could leap to socialism without a long capitalist stage. The Germans, hoping to knock Russia out of the war, let him travel home from Switzerland in a sealed train in April 1917. His <strong>April Theses<\/strong> demanded \"<strong>All power to the Soviets<\/strong>,\" and his slogan \"<strong>Peace, Land, and Bread<\/strong>\" spoke directly to soldiers, peasants and workers. After a failed rising in July and a failed right-wing coup by General Kornilov, the Bolsheviks won majorities in the soviets.<\/p>\n<p><strong>The October Revolution.<\/strong> On <strong>October 25, 1917, by the old Russian calendar (November 7 in the Western calendar)<\/strong>, Bolshevik forces organized by <strong>Leon Trotsky<\/strong> seized key points in Petrograd and the <strong>Winter Palace<\/strong>, where the Provisional Government met. Lenin's government decreed peace, gave land to the peasants and put factories under workers' control. When elections to a <strong>Constituent Assembly<\/strong> gave the Bolsheviks only about a quarter of the votes (the peasant-based Socialist Revolutionaries won more), Lenin <strong>dissolved the Assembly<\/strong> in January 1918. He created a secret police, the <strong>Cheka<\/strong>.<\/p>\n<p><strong>Brest-Litovsk and civil war.<\/strong> In the <strong>Treaty of Brest-Litovsk (March 1918)<\/strong> Russia gave up Poland, the Baltic lands, Finland and <strong>Ukraine<\/strong>, about a third of its European population. A brutal <strong>Russian Civil War (1918–1921)<\/strong> followed between the Bolshevik <strong>Reds<\/strong> and the anti-Bolshevik <strong>Whites<\/strong> (monarchists, liberals and others), who received limited help from Allied troops. Trotsky built the disciplined <strong>Red Army<\/strong>. The Bolsheviks shot the <strong>tsar and his family<\/strong> (July 1918). They won because they held the central heartland and railways, were united and ruthless, and the Whites were divided and associated with the return of landlords.<\/p>\n<p>To feed the Red Army, Lenin imposed <strong>War Communism<\/strong>: nationalization of industry and forced <strong>requisitioning of grain<\/strong> from peasants. The economy collapsed and famine followed. When sailors at the <strong>Kronstadt<\/strong> naval base, once Bolshevik heroes, rebelled in 1921, Lenin retreated to the <strong>New Economic Policy (NEP)<\/strong>, which let peasants sell surplus grain and allowed small private businesses, while the state kept the \"commanding heights\" (banks, heavy industry, foreign trade). In <strong>1922<\/strong> the state became the <strong>Union of Soviet Socialist Republics (USSR)<\/strong>. The Communist International (<strong>Comintern<\/strong>, 1919) promoted revolution abroad. Lenin died in <strong>1924<\/strong>, setting off a power struggle between Trotsky and <strong>Joseph Stalin<\/strong> (Unit 11).<\/p>","words":2116,"minutes":15,"mustKnow":["<strong>MAIN causes:<\/strong> militarism (naval race, Schlieffen Plan), alliances (Triple Alliance vs. Triple Entente), imperialism (Moroccan crises), nationalism (Serbian, Pan-Slav, French revanche).","<strong>Balkans:<\/strong> Bosnian Crisis (1908), Balkan Wars (1912–13).","<strong>July Crisis:<\/strong> Sarajevo assassination (June 28, 1914) → German \"blank check\" → ultimatum → war on Serbia → Russian mobilization → Germany invades Belgium → Britain enters (Aug. 4).","<strong>Western Front:<\/strong> Marne (1914) halts Germany → trench stalemate; Verdun and the Somme (1916); machine guns, gas, tanks.","<strong>1917:<\/strong> unrestricted U-boat warfare + Zimmermann Telegram → U.S. enters; Russia exits (Brest-Litovsk, March 1918); armistice Nov. 11, 1918.","<strong>Total war:<\/strong> state economic control, rationing, propaganda, women's labor → women's suffrage (Britain 1918); U.S. becomes creditor.","<strong>Versailles (1919):<\/strong> Article 231 war guilt, reparations, Alsace-Lorraine to France, Polish Corridor, 100,000-man army, demilitarized Rhineland, colonies to mandates; U.S. never joins the League.","<strong>New states:<\/strong> Poland, Czechoslovakia, Yugoslavia, Baltic states; Austria-Hungary and the Ottoman Empire dismantled.","<strong>Russia 1917:<\/strong> February Revolution → tsar abdicates → Provisional Government (Kerensky) + Petrograd Soviet (\"dual power\") → Lenin's \"Peace, Land, Bread\" → October Revolution (Bolsheviks, Trotsky).","<strong>After:<\/strong> Constituent Assembly dissolved, Cheka, civil war (Reds vs. Whites), War Communism → Kronstadt → NEP (1921); USSR (1922)."],"timeline":[{"y":"1903","label":"Bolshevik–Menshevik split","note":"Lenin's vanguard party","key":false},{"y":"1906","label":"HMS Dreadnought launched","note":"Anglo-German naval race intensifies","key":false},{"y":"1908","label":"Bosnian Crisis","note":"Austria-Hungary annexes Bosnia-Herzegovina","key":false},{"y":"1912–1913","label":"Balkan Wars","note":"Serbia expands","key":false},{"y":"1914 (June 28)","label":"Assassination at Sarajevo","note":"Franz Ferdinand killed by Gavrilo Princip","key":true},{"y":"1914 (Aug.)","label":"War begins; Germany invades Belgium","note":"Britain enters the war","key":true},{"y":"1914 (Sept.)","label":"First Battle of the Marne","note":"Schlieffen Plan fails; trench warfare","key":true},{"y":"1915","label":"Gallipoli; Lusitania sunk; Armenian genocide; Italy joins Allies","note":"War widens","key":false},{"y":"1916","label":"Verdun and the Somme","note":"Battles of attrition","key":true},{"y":"1917 (March)","label":"February Revolution","note":"Nicholas II abdicates","key":true},{"y":"1917 (April)","label":"United States enters the war","note":"After U-boat campaign and Zimmermann Telegram","key":true},{"y":"1917 (Nov.)","label":"October Revolution","note":"Bolsheviks seize power","key":true},{"y":"1918 (March)","label":"Treaty of Brest-Litovsk","note":"Russia leaves the war","key":false},{"y":"1918 (Nov. 11)","label":"Armistice","note":"Fighting ends on the Western Front","key":true},{"y":"1918–1921","label":"Russian Civil War","note":"Reds defeat Whites","key":false},{"y":"1919","label":"Treaty of Versailles","note":"War guilt, reparations, League of Nations","key":true},{"y":"1921","label":"Kronstadt rebellion; New Economic Policy","note":"Lenin's partial retreat to markets","key":false},{"y":"1922","label":"USSR founded","note":"Union of Soviet Socialist Republics","key":false},{"y":"1924","label":"Death of Lenin","note":"Power struggle begins","key":false}],"cards":[{"id":"u10c1","front":"MAIN","back":"Long-term causes of WWI: Militarism, Alliances, Imperialism, Nationalism.","person":false},{"id":"u10c2","front":"Schlieffen Plan","back":"German plan to defeat France quickly through Belgium, then turn on Russia.","person":false},{"id":"u10c3","front":"Franz Ferdinand","back":"Austro-Hungarian heir assassinated in Sarajevo on June 28, 1914.","person":true},{"id":"u10c4","front":"Gavrilo Princip","back":"Bosnian Serb nationalist who assassinated Franz Ferdinand.","person":true},{"id":"u10c5","front":"Blank check","back":"Germany's unconditional promise of support to Austria-Hungary (July 1914).","person":false},{"id":"u10c6","front":"First Battle of the Marne (1914)","back":"Stopped the German advance on Paris; led to trench warfare.","person":false},{"id":"u10c7","front":"Battle of Verdun (1916)","back":"Ten-month German attempt to bleed France white.","person":false},{"id":"u10c8","front":"Battle of the Somme (1916)","back":"Massive British-French offensive; 57,000 British casualties on day one; first tanks.","person":false},{"id":"u10c9","front":"Zimmermann Telegram (1917)","back":"German offer of an alliance to Mexico; helped bring the U.S. into the war.","person":false},{"id":"u10c10","front":"Total war","back":"Mobilization of a nation's entire economy and society for war.","person":false},{"id":"u10c11","front":"Treaty of Brest-Litovsk (1918)","back":"Bolshevik Russia left the war, ceding Poland, the Baltics and Ukraine.","person":false},{"id":"u10c12","front":"Armistice (Nov. 11, 1918)","back":"Ended fighting in World War I.","person":false},{"id":"u10c13","front":"Fourteen Points","back":"Wilson's peace plan: self-determination, open diplomacy, League of Nations.","person":false},{"id":"u10c14","front":"Georges Clemenceau","back":"French premier at Paris (1919) who demanded security and harsh terms for Germany.","person":true},{"id":"u10c15","front":"Treaty of Versailles (1919)","back":"Peace with Germany: war guilt, reparations, territorial losses, disarmament.","person":false},{"id":"u10c16","front":"Article 231","back":"The \"war guilt clause\" making Germany responsible for war losses.","person":false},{"id":"u10c17","front":"Mandate system","back":"League arrangement giving former German and Ottoman lands to Britain and France to govern.","person":false},{"id":"u10c18","front":"John Maynard Keynes","back":"Economist who attacked the Versailles reparations as ruinous (1919).","person":true},{"id":"u10c19","front":"Nicholas II","back":"Last Russian tsar; abdicated in March 1917; killed with his family in 1918.","person":true},{"id":"u10c20","front":"Provisional Government","back":"Russia's liberal government (March–Nov. 1917), later led by Kerensky; kept fighting the war.","person":false},{"id":"u10c21","front":"Petrograd Soviet","back":"Council of workers' and soldiers' deputies that shared power with the Provisional Government.","person":false},{"id":"u10c22","front":"Vladimir Lenin","back":"Bolshevik leader; vanguard party; \"Peace, Land, Bread\"; led the October Revolution.","person":true},{"id":"u10c23","front":"Leon Trotsky","back":"Organized the October seizure of power and built the Red Army.","person":true},{"id":"u10c24","front":"October Revolution (1917)","back":"Bolshevik seizure of power in Petrograd (Nov. 7, Western calendar).","person":false},{"id":"u10c25","front":"War Communism","back":"Bolshevik civil-war economy: nationalization and forced grain requisitioning.","person":false},{"id":"u10c26","front":"New Economic Policy (NEP)","back":"Lenin's 1921 partial return to private trade and small business.","person":false}],"hours":2.35,"quizIds":["u10q2","u10q4","u10q5","u10q6","u10q7","u10q16","u10q19","u10q21","u10q25","u10q27","u10q28","u10q33","u10q34","u10q38","u10q44"]},{"id":11,"title":"Europe Between the Wars","short":"Between the Wars","range":"1919–1939","weight":{"min":7,"max":9,"verified":true},"subtopics":["The Great Depression","International politics, 1919–1939","Stalin's five-year plans and purges","Fascism and Nazism","Interwar culture"],"lesson":"<h3>The big picture<\/h3>\n<p>The twenty years between the world wars began with hopes for democracy and ended in dictatorship and war. Democracies were born weak, especially Germany's <strong>Weimar Republic<\/strong>; the <strong>Great Depression<\/strong> after 1929 shattered faith in liberal capitalism; and new <strong>totalitarian<\/strong> regimes, <strong>Mussolini's Fascist Italy, Hitler's Nazi Germany and Stalin's Soviet Union<\/strong>, claimed total control over their citizens. Meanwhile Britain and France, exhausted and fearful of another war, tried <strong>appeasement<\/strong>, which failed. On the exam, know how each dictator rose to power, what each regime did, and the steps from Versailles to September 1939.<\/p>\n<h3>Postwar crises and the Weimar Republic<\/h3>\n<p>Germany's new democracy, the <strong>Weimar Republic<\/strong> (named for the town where its constitution was written in 1919), was blamed from the start for signing the hated Treaty of Versailles. Nationalists spread the \"<strong>stab-in-the-back<\/strong>\" myth that the army had not been defeated but betrayed by socialists, Jews and democratic politicians at home. The republic faced attacks from the left (the communist <strong>Spartacist uprising<\/strong>, January 1919, in which Rosa Luxemburg and Karl Liebknecht were killed) and the right (the <strong>Kapp Putsch<\/strong>, 1920). Its constitution used pure <strong>proportional representation<\/strong>, producing many small parties and unstable coalitions, and <strong>Article 48<\/strong> let the president rule by emergency decree.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Germany falls behind on reparations<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>France and Belgium occupy the Ruhr (1923); Germany prints money to pay striking workers<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Hyperinflation wipes out middle-class savings; extremists gain, including Hitler's failed Beer Hall Putsch<\/div><\/div>\n<p>In <strong>1923<\/strong>, when Germany fell behind on reparations, <strong>France and Belgium occupied the Ruhr<\/strong>, Germany's industrial heartland. The government supported a general strike of \"passive resistance\" by printing money, and <strong>hyperinflation<\/strong> exploded: by November a U.S. dollar cost <strong>4.2 trillion marks<\/strong>. Savings, pensions and the security of the middle class evaporated. In Munich, <strong>Adolf Hitler<\/strong> tried to seize power in the <strong>Beer Hall Putsch<\/strong> (November 1923); it failed, and in prison he wrote <strong><em>Mein Kampf<\/strong><\/em> (<em>My Struggle<\/em>).<\/p>\n<p>Recovery came under Foreign Minister <strong>Gustav Stresemann<\/strong>. A new currency ended inflation; the <strong>Dawes Plan (1924)<\/strong> reduced reparations payments and brought <strong>American loans<\/strong>; at <strong>Locarno (1925)<\/strong> Germany accepted its western borders, and in 1926 it joined the <strong>League of Nations<\/strong>. In the <strong>Kellogg-Briand Pact (1928)<\/strong>, dozens of nations renounced war (with no means of enforcement). The years 1924–1929 were Weimar's \"golden twenties,\" but prosperity rested on borrowed American money.<\/p>\n<p><strong>Culture<\/strong> in the 1920s reflected both disillusionment and experiment. T. S. Eliot's poem <em>The Waste Land<\/em> (1922) and novels of the war's \"lost generation\" expressed despair; Oswald Spengler predicted <em>The Decline of the West<\/em>. Artists in the <strong>Dada<\/strong> movement mocked reason and art itself; the <strong>Surrealists<\/strong> explored dreams and Freud's unconscious; James Joyce (<em>Ulysses<\/em>, 1922) and Virginia Woolf used \"stream of consciousness\"; Franz Kafka depicted people trapped by faceless bureaucracy. The <strong>Bauhaus<\/strong> school under Walter Gropius developed functional modern architecture and design. Radio, cinema and jazz created a new mass culture, and governments soon learned to use them for propaganda.<\/p>\n<h3>Fascist Italy<\/h3>\n<p>Italy was on the winning side in 1918 but felt cheated of promised territory (a \"<strong>mutilated victory<\/strong>\"). Strikes, factory occupations and peasant land seizures in 1919–1920 (the \"red years\") frightened landowners and industrialists. <strong>Benito Mussolini<\/strong>, a former socialist journalist, founded the <strong>Fascist<\/strong> movement in 1919 (from <em>fasces<\/em>, the ancient Roman symbol of authority). His <strong>Blackshirt<\/strong> squads beat socialists and broke strikes, often with police tolerance.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Postwar discontent, strikes and fear of socialist revolution; weak coalition governments<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>March on Rome (1922): the king appoints Mussolini prime minister<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>By 1926 a one-party dictatorship; the first fascist state<\/div><\/div>\n<p>In October 1922 Fascists threatened a <strong>March on Rome<\/strong>. Rather than use the army, <strong>King Victor Emmanuel III<\/strong> appointed Mussolini <strong>prime minister<\/strong>. Mussolini came to power legally, then dismantled democracy: an electoral law gave the largest party two-thirds of the seats; Fascists murdered the socialist deputy <strong>Giacomo Matteotti<\/strong> (1924), who had denounced their violence; and by 1926 opposition parties were banned and the press censored. As <strong>Il Duce<\/strong> (\"the leader\"), Mussolini declared: \"<strong>Everything within the state, nothing outside the state, nothing against the state<\/strong>.\" His <strong>corporate state<\/strong> grouped employers and workers into state-controlled corporations, banning independent unions and strikes. The <strong>Lateran Accords (1929)<\/strong> made peace with the Church, recognizing <strong>Vatican City<\/strong> as independent and Catholicism as the state religion. In 1935–1936 Italy conquered <strong>Ethiopia<\/strong>, defying the League of Nations.<\/p>\n<p><strong>Fascism<\/strong> in general meant: extreme <strong>nationalism<\/strong>, a <strong>single party<\/strong> and cult of the leader, glorification of <strong>violence and war<\/strong>, hatred of <strong>communism<\/strong> and contempt for <strong>liberal democracy<\/strong>, and a state that claimed to embody the nation, while leaving private property and big business in place.<\/p>\n<h3>The Great Depression<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>U.S. stock market crash (October 1929); American loans to Europe are recalled<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Banks fail (Austria's Creditanstalt, 1931); trade collapses behind tariffs; mass unemployment<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Voters turn to extremes; democracies are discredited, especially in Germany<\/div><\/div>\n<p>The <strong>Wall Street Crash of October 1929<\/strong> began a worldwide depression. American lenders recalled their loans to Europe; in 1931 Austria's largest bank, the <strong>Creditanstalt<\/strong>, collapsed, setting off banking panics across central Europe. Countries raised tariffs (the U.S. Smoot-Hawley Tariff, 1930), and world trade shrank by about two-thirds. Unemployment reached about <strong>6 million in Germany<\/strong> (roughly a third of workers) by 1932, and around 3 million in Britain. Britain left the <strong>gold standard<\/strong> in 1931.<\/p>\n<p>Most governments first cut spending to balance budgets, which deepened the slump. The British economist <strong>John Maynard Keynes<\/strong> (<em>The General Theory of Employment, Interest and Money<\/em>, 1936) argued instead that governments should <strong>spend and run deficits<\/strong> in a depression to create demand. In France, the left-wing <strong>Popular Front<\/strong> government of <strong>Léon Blum<\/strong> (1936) introduced the 40-hour week and paid vacations. In <strong>Sweden<\/strong>, Social Democrats built a welfare state with public works, a \"middle way\" between capitalism and socialism.<\/p>\n<h3>Nazi Germany<\/h3>\n<p><strong>Adolf Hitler<\/strong>, an Austrian-born veteran, led the <strong>National Socialist German Workers' (Nazi) Party<\/strong>. Nazi ideology combined extreme nationalism with <strong>racism<\/strong>: Germans were a superior \"Aryan\" race, <strong>Jews<\/strong> were blamed for every disaster from the defeat of 1918 to communism and capitalism, and Germany needed \"<strong>living space<\/strong>\" (<em>Lebensraum<\/em>) in eastern Europe. Nazis promised a unified \"people's community\" (<em>Volksgemeinschaft<\/em>) led by an all-powerful <strong>Führer<\/strong>.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>The Depression brings mass unemployment; Weimar governments rule by decree<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Nazis become the largest party (37 percent, July 1932); conservatives persuade Hindenburg to appoint Hitler chancellor (January 30, 1933)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Reichstag fire decree and Enabling Act (1933) create a legal dictatorship within months<\/div><\/div>\n<p>In 1928 the Nazis won under 3 percent of the vote. The Depression changed everything: in <strong>July 1932<\/strong> they won <strong>37 percent<\/strong>, becoming the largest party in the Reichstag. Hitler never won a majority. Conservative politicians around President <strong>Paul von Hindenburg<\/strong>, led by Franz von Papen, believed they could control him, and on <strong>January 30, 1933<\/strong>, Hindenburg appointed Hitler <strong>chancellor<\/strong>. Hitler came to power legally.<\/p>\n<p>He then destroyed democracy in months. After the <strong>Reichstag fire<\/strong> (February 1933), which Nazis blamed on communists, an emergency decree suspended civil liberties. The <strong>Enabling Act (March 1933)<\/strong> let Hitler's cabinet make laws without the Reichstag for four years. The Nazis banned other parties and trade unions and brought every organization under party control (<em>Gleichschaltung<\/em>, \"coordination\"). In the <strong>Night of the Long Knives (June 1934)<\/strong>, Hitler had the SS murder the leaders of his own storm troopers (the SA), including Ernst Röhm, to reassure the army. When Hindenburg died in August 1934, Hitler combined the offices of president and chancellor as <strong>Führer<\/strong>. The <strong>SS<\/strong> under Heinrich Himmler and the secret police (<strong>Gestapo<\/strong>) enforced terror; Joseph <strong>Goebbels<\/strong> ran propaganda; the <strong>Hitler Youth<\/strong> shaped the young; women were urged to focus on \"children, kitchen, church.\"<\/p>\n<p>Persecution of Jews escalated in stages: boycotts of Jewish shops (1933), dismissal from the civil service, the <strong>Nuremberg Laws (1935)<\/strong>, which stripped Jews of citizenship and banned marriage between Jews and other Germans, and the <strong>Kristallnacht<\/strong> pogrom (<strong>November 1938<\/strong>), when Nazis burned synagogues, smashed Jewish businesses and sent about 30,000 Jewish men to concentration camps. Public works, <strong>rearmament<\/strong> and conscription ended mass unemployment by 1936–37, which won Hitler wide support.<\/p>\n<h3>Stalin's Soviet Union<\/h3>\n<p>After Lenin died in 1924, <strong>Joseph Stalin<\/strong>, the party's <strong>general secretary<\/strong>, used his control over appointments to defeat his rivals. <strong>Leon Trotsky<\/strong> argued for \"<strong>permanent revolution<\/strong>\" spreading communism worldwide; Stalin championed \"<strong>socialism in one country<\/strong>,\" building up the USSR first. Trotsky was expelled in 1929 and murdered in Mexico in 1940 by a Soviet agent.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Stalin wants rapid industrialization to make the USSR a military-industrial power<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Five-Year Plans (from 1928) and forced collectivization of agriculture (from 1929)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Huge industrial growth, but millions die in famine (1932–33), and terror becomes a system of rule<\/div><\/div>\n<p>In 1928 Stalin ended the NEP and launched the first <strong>Five-Year Plan<\/strong>, setting impossible targets for <strong>heavy industry<\/strong> (steel, coal, electricity, tractors) under a <strong>command economy<\/strong> run by the state planning agency. New industr
