ong> to join Piedmont; Cavour paid Napoleon III with <strong>Nice and Savoy<\/strong>.<\/p>\n<p>Then <strong>Giuseppe Garibaldi<\/strong>, a romantic republican guerrilla, sailed with about 1,000 volunteers, the \"<strong>Red Shirts<\/strong>,\" and conquered <strong>Sicily and Naples<\/strong> (1860). Cavour, fearing Garibaldi would march on Rome and provoke France, sent Piedmont's army through the Papal States to meet him. Garibaldi, a patriot first, <strong>handed his conquests to Victor Emmanuel<\/strong>. In <strong>March 1861<\/strong> the <strong>Kingdom of Italy<\/strong> was proclaimed. <strong>Venetia<\/strong> was added in <strong>1866<\/strong> (Italy allied with Prussia against Austria), and <strong>Rome<\/strong> in <strong>1870<\/strong>, when French troops guarding the pope left to fight Prussia. Rome became the capital; the pope refused to recognize the kingdom and called himself the \"prisoner of the Vatican.\"<\/p>\n<p>Unity did not end Italy's problems: a deep gap between the industrializing <strong>north<\/strong> and the poor, rural <strong>south<\/strong>, hostility from the Church, and a narrow electorate. As one politician put it, \"We have made Italy; now we must make Italians.\"<\/p>\n<h3>The unification of Germany<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Prussian king and parliament deadlock over army reform (1862)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Bismarck wins three short wars: Denmark (1864), Austria (1866), France (1870–71)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>German Empire proclaimed at Versailles (January 1871), dominated by Prussia; France loses Alsace-Lorraine and wants revenge<\/div><\/div>\n<p>Prussia had advantages: a strong army, the <strong>Zollverein<\/strong> customs union that already tied most German states to its economy, and booming coal and steel industries. In 1862 King <strong>William I<\/strong> appointed <strong>Otto von Bismarck<\/strong> minister-president to push through an army expansion that the liberal parliament refused to fund. Bismarck simply collected the taxes anyway, declaring that the great questions of the day would be decided \"not by speeches and majority decisions, but by <strong>iron and blood<\/strong>.\"<\/p>\n<p>Bismarck unified Germany through <strong>three wars<\/strong>: 1. The <strong>Danish War (1864)<\/strong>: Prussia and Austria together took <strong>Schleswig and Holstein<\/strong> from Denmark. Their joint administration gave Bismarck a ready-made quarrel with Austria. 2. The <strong>Austro-Prussian (Seven Weeks') War (1866)<\/strong>: after making sure France and Russia would stay out and allying with Italy, Bismarck crushed Austria at <strong>Königgrätz (Sadowa)<\/strong>. He imposed a lenient peace to avoid lasting hatred, but <strong>Austria was excluded from German affairs<\/strong>. Prussia annexed several states and formed the <strong>North German Confederation (1867)<\/strong>. Prussian liberals, dazzled by victory, forgave Bismarck's illegal taxes. 3. The <strong>Franco-Prussian War (1870–1871)<\/strong>: a dispute over a Hohenzollern candidate for the Spanish throne gave Bismarck his chance. He edited the <strong>Ems Dispatch<\/strong>, a telegram about a meeting between William I and the French ambassador, to make it sound insulting; France declared war. The southern German states joined Prussia; the French army collapsed, and <strong>Napoleon III was captured at Sedan<\/strong> (September 1870). Paris was besieged and surrendered in January 1871.<\/p>\n<p>On <strong>January 18, 1871<\/strong>, in the <strong>Hall of Mirrors at Versailles<\/strong>, William I was proclaimed <strong>German Emperor (Kaiser)<\/strong>. In the peace, France paid a large indemnity and lost <strong>Alsace-Lorraine<\/strong>, leaving a lasting French desire for revenge (<em>revanche<\/em>). Germany was unified \"from above,\" by Prussian arms and princes rather than by a liberal parliament.<\/p>\n<p>The new <strong>German Empire<\/strong> was federal and dominated by Prussia. The <strong>Reichstag<\/strong> was elected by <strong>universal male suffrage<\/strong>, but the <strong>chancellor<\/strong> answered to the Kaiser, not to the Reichstag. As chancellor (1871–1890), Bismarck fought the Catholic Church in the <strong>Kulturkampf<\/strong> (\"culture struggle,\" 1870s), then turned against the socialists with the <strong>Anti-Socialist Laws (1878)<\/strong>. To win workers away from socialism he also created the world's first national <strong>social insurance<\/strong>: health insurance (1883), accident insurance (1884), and old-age and disability pensions (1889). In 1888 <strong>William II<\/strong> became Kaiser; he dismissed Bismarck in <strong>1890<\/strong> and pursued a restless <strong>Weltpolitik<\/strong> (\"world policy\"), including a big navy that alarmed Britain.<\/p>\n<h3>Austria-Hungary<\/h3>\n<p>Defeats in 1859 and 1866 forced the Habsburgs to compromise with their largest and most assertive nationality, the <strong>Magyars<\/strong> (Hungarians). The <strong>Compromise (Ausgleich) of 1867<\/strong> created the <strong>Dual Monarchy of Austria-Hungary<\/strong>: Franz Joseph was emperor of Austria and king of Hungary; each half had its own parliament and government, but they shared foreign policy, the army, and the finances for both. Hungary's Magyar elite then pursued <strong>Magyarization<\/strong> of its own minorities. The other nationalities, especially the <strong>Slavs<\/strong> (Czechs, Poles, Croats, Serbs, Slovaks), resented being left out. Nationalism was a constant threat to the empire's survival.<\/p>\n<h3>Russia: reform and reaction<\/h3>\n<p>Defeat in the Crimea convinced <strong>Alexander II<\/strong> (r. 1855–1881) that Russia had to modernize. In <strong>1861<\/strong> he <strong>emancipated the serfs<\/strong>, more than 20 million people. Peasants gained personal freedom and land, but they had to make <strong>redemption payments<\/strong> for decades, and the land was usually held by the village commune (<em>mir<\/em>), which limited mobility. He also created elected local councils (<strong>zemstvos<\/strong>, 1864), reformed the courts with jury trials, and shortened military service. Radicals were not satisfied; populists (<em>narodniki<\/em>) tried to stir the peasants, and the terrorist group <strong>People's Will assassinated Alexander II in 1881<\/strong>.<\/p>\n<p>His son <strong>Alexander III<\/strong> responded with reaction: censorship, police repression and <strong>Russification<\/strong> (forcing Russian language and Orthodoxy on minorities). <strong>Pogroms<\/strong>, violent attacks on Jews, spread, and millions of Jews emigrated. Under <strong>Sergei Witte<\/strong>, finance minister in the 1890s, Russia industrialized rapidly with foreign loans, building the <strong>Trans-Siberian Railway<\/strong>. Defeat by Japan (1904–1905) and the <strong>Revolution of 1905<\/strong> (beginning with <strong>Bloody Sunday<\/strong>, when troops fired on peaceful petitioners) forced <strong>Nicholas II<\/strong> to issue the <strong>October Manifesto<\/strong>, promising civil rights and an elected parliament, the <strong>Duma<\/strong>, which he soon restricted (Unit 10).<\/p>\n<h3>France and Britain: toward democracy<\/h3>\n<p><strong>France.<\/strong> Napoleon III's <strong>Second Empire<\/strong> (1852–1870) rebuilt Paris with wide boulevards (Baron <strong>Haussmann<\/strong>), promoted railways and banks, and liberalized in the 1860s, but collapsed at Sedan. The <strong>Third Republic<\/strong> was born in defeat. In 1871 radical Parisians set up the <strong>Paris Commune<\/strong>, which the national government crushed in \"Bloody Week\" (about 20,000 killed), leaving lasting class bitterness. The Republic survived scandals and the nationalist general <strong>Boulanger<\/strong>. The <strong>Dreyfus Affair<\/strong> (1894–1906), in which <strong>Captain Alfred Dreyfus<\/strong>, a Jewish army officer, was falsely convicted of spying for Germany, split France between the army, Church and anti-Semitic right on one side and republicans, socialists and intellectuals on the other. <strong>Émile Zola's<\/strong> open letter \"<strong>J'accuse!<\/strong>\" (1898) accused the army of a cover-up. Dreyfus was cleared in 1906, and the republicans' victory led to the <strong>separation of church and state (1905)<\/strong>. The affair also convinced journalist <strong>Theodor Herzl<\/strong> that Jews needed their own state, and he founded political <strong>Zionism<\/strong> (1897).<\/p>\n<p><strong>Britain<\/strong> widened democracy by reform rather than revolution. The Conservative <strong>Benjamin Disraeli<\/strong> passed the <strong>Second Reform Act (1867)<\/strong>, enfranchising many urban working men; the Liberal <strong>William Gladstone's<\/strong> governments introduced the <strong>secret ballot (1872)<\/strong> and the <strong>Third Reform Act (1884)<\/strong> for rural workers. Gladstone repeatedly tried, and failed, to give <strong>Home Rule<\/strong> to <strong>Ireland<\/strong>. The <strong>Labour Party<\/strong> formed (1900–1906), the <strong>Parliament Act of 1911<\/strong> ended the House of Lords' veto, and the <strong>suffragettes<\/strong> led by <strong>Emmeline Pankhurst<\/strong> campaigned, sometimes militantly, for women's votes.<\/p>\n<h3>Socialism and labor unions<\/h3>\n<p>Trade unions grew rapidly, especially \"new unions\" of unskilled workers after the 1889 London dock strike. Marx helped found the <strong>First International<\/strong> (1864), which split between Marxists and anarchists led by <strong>Mikhail Bakunin<\/strong>. The <strong>Second International<\/strong> (1889) united national socialist parties. The largest was Germany's <strong>Social Democratic Party (SPD)<\/strong>, which survived the Anti-Socialist Laws and became the <strong>largest party in the Reichstag by 1912<\/strong>.<\/p>\n<p>Socialists argued about strategy. <strong>Eduard Bernstein's revisionism<\/strong> (<em>Evolutionary Socialism<\/em>, 1899) said capitalism was not collapsing and socialism could come gradually through elections and reforms. Orthodox Marxists such as Karl Kautsky insisted on revolution in theory while working within parliaments in practice. <strong>Syndicalists<\/strong> (Georges Sorel) put their faith in the general strike. In Britain, the <strong>Fabian Society<\/strong> pursued gradual, democratic socialism.<\/p>\n<h3>Diplomacy, 1871–1914: Bismarck's system and its collapse<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>A unified Germany fears a French war of revenge over Alsace-Lorraine<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Bismarck builds alliances to keep France isolated (Dual Alliance, Triple Alliance, Reinsurance Treaty)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>William II drops Russia (1890); France and Russia ally (1894); Britain joins them: Europe splits into two armed camps<\/div><\/div>\n<p>After 1871, Bismarck called Germany \"satiated\" and worked to keep the peace and keep France <strong>isolated<\/strong>. His tools: the <strong>Three Emperors' League<\/strong> (Germany, Austria-Hungary, Russia, 1873 and 1881); the <strong>Congress of Berlin (1878)<\/strong>, where he acted as \"honest broker\" after Russia defeated the Ottomans and revised the Treaty of San Stefano: Serbia, Montenegro and Romania became independent, a big Bulgaria was cut down, and Austria-Hungary was allowed to occupy <strong>Bosnia-Herzegovina<\/strong> (which angered Russia); the <strong>Dual Alliance (1879)<\/strong> with Austria-Hungary; the <strong>Triple Alliance (1882)<\/strong> adding Italy; and the secret <strong>Reinsurance Treaty (1887)<\/strong> with Russia.<\/p>\n<p>William II let the Reinsurance Treaty lapse in <strong>1890<\/strong>. France quickly courted Russia with loans and signed the <strong>Franco-Russian Alliance (1894)<\/strong>, the nightmare of a two-front war Bismarck had avoided. Britain, alarmed by Germany's navy, left its \"splendid isolation\": the <strong>Entente Cordiale (1904)<\/strong> settled colonial quarrels with France, and the <strong>Anglo-Russian Entente (1907)<\/strong> did the same with Russia, creating the <strong>Triple Entente<\/strong>. Europe was now divided into two blocs: the <strong>Triple Alliance<\/strong> (Germany, Austria-Hungary, Italy) and the <strong>Triple Entente<\/strong> (France, Russia, Britain).<\/p>","words":1964,"minutes":14,"mustKnow":["<strong>Realpolitik:<\/strong> practical power politics (Cavour, Bismarck) replaced 1848 idealism.","<strong>Crimean War (1853–56):<\/strong> Russia vs. Ottomans, Britain, France, Piedmont; broke the Concert of Europe and isolated Austria.","<strong>Italy:<\/strong> Cavour (diplomacy, French alliance, 1859 war → Lombardy), Garibaldi (Red Shirts take Sicily and Naples, 1860), Victor Emmanuel II king (1861); Venetia 1866, Rome 1870.","<strong>Germany:<\/strong> Bismarck's \"iron and blood\"; three wars (Denmark 1864, Austria 1866, France 1870–71); Ems Dispatch; Empire proclaimed at Versailles (1871); Alsace-Lorraine annexed.","<strong>Bismarck at home:<\/strong> Kulturkampf, Anti-Socialist Laws (1878), first social insurance (1880s).","<strong>Ausgleich (1867):<\/strong> Dual Monarchy of Austria-Hungary; Slavs left out.","<strong>Russia:<\/strong> Alexander II freed the serfs (1861), zemstvos; assassinated 1881; Alexander III's Russification and pogroms; 1905 revolution → Duma.","<strong>France:<\/strong> Paris Commune (1871); Third Republic; <strong>Dreyfus Affair<\/strong> (Zola's \"J'accuse!\") → separation of church and state (1905).","<strong>Britain:<\/strong> Reform Acts of 1867 and 1884, secret ballot (1872), Irish Home Rule fights, suffragettes.","<strong>Alliances:<\/strong> Dual Alliance (1879), Triple Alliance (1882), Reinsurance Treaty lapses (1890), Franco-Russian Alliance (1894), Entente Cordiale (1904), Triple Entente (1907)."],"timeline":[{"y":"1853–1856","label":"Crimean War","note":"Concert of Europe breaks down","key":true},{"y":"1858","label":"Plombières agreement","note":"Cavour secures French help","key":false},{"y":"1859","label":"Franco-Piedmontese war with Austria","note":"Magenta, Solferino; Lombardy to Piedmont","key":true},{"y":"1860","label":"Garibaldi's expedition","note":"Red Shirts conquer Sicily and Naples","key":false},{"y":"1861","label":"Kingdom of Italy; Russian serfs emancipated","note":"Victor Emmanuel II; Alexander II's reform","key":true},{"y":"1862","label":"Bismarck becomes Prussian minister-president","note":"\"Iron and blood\"","key":false},{"y":"1864","label":"Danish War","note":"Schleswig-Holstein seized","key":false},{"y":"1866","label":"Austro-Prussian War (Königgrätz)","note":"Austria excluded from Germany","key":true},{"y":"1867","label":"Ausgleich; Second Reform Act","note":"Dual Monarchy; urban workers vote in Britain","key":true},{"y":"1870–1871","label":"Franco-Prussian War","note":"Sedan; Rome joins Italy; Third Republic","key":true},{"y":"1871","label":"German Empire proclaimed; Paris Commune","note":"Hall of Mirrors; Alsace-Lorraine annexed","key":true},{"y":"1878","label":"Congress of Berlin; Anti-Socialist Laws","note":"Bismarck as honest broker","key":false},{"y":"1879","label":"Dual Alliance","note":"Germany and Austria-Hungary","key":false},{"y":"1881","label":"Alexander II assassinated","note":"Reaction under Alexander III","key":false},{"y":"1882","label":"Triple Alliance","note":"Germany, Austria-Hungary, Italy","key":false},{"y":"1890","label":"Bismarck dismissed","note":"Reinsurance Treaty lapses","key":false},{"y":"1894","label":"Franco-Russian Alliance; Dreyfus convicted","note":"Two-front threat to Germany","key":false},{"y":"1898","label":"Zola's \"J'accuse!\"","note":"Dreyfus Affair peaks","key":false},{"y":"1904","label":"Entente Cordiale","note":"Britain and France settle differences","key":true},{"y":"1905","label":"Russian Revolution of 1905; French separation of church and state","note":"October Manifesto, Duma","key":false},{"y":"1907","label":"Triple Entente","note":"Britain, France, Russia","key":true}],"cards":[{"id":"u8c1","front":"Realpolitik","back":"Politics based on practical power and interests rather than ideals.","person":false},{"id":"u8c2","front":"Crimean War (1853–56)","back":"Russia vs. Ottomans, Britain, France and Piedmont; broke the Concert of Europe.","person":false},{"id":"u8c3","front":"Camillo di Cavour","back":"Prime minister of Piedmont-Sardinia; used diplomacy and French help to unify northern Italy.","person":true},{"id":"u8c4","front":"Giuseppe Garibaldi","back":"Led the Red Shirts to conquer Sicily and Naples (1860), then handed them to Victor Emmanuel II.","person":true},{"id":"u8c5","front":"Victor Emmanuel II","back":"King of Piedmont-Sardinia who became first king of united Italy (1861).","person":true},{"id":"u8c6","front":"Otto von Bismarck","back":"Prussian minister-president and German chancellor; unified Germany through \"iron and blood.\"","person":true},{"id":"u8c7","front":"Ems Dispatch (1870)","back":"Telegram Bismarck edited to provoke France into the Franco-Prussian War.","person":false},{"id":"u8c8","front":"Battle of Sedan (1870)","back":"Prussian victory; Napoleon III captured.","person":false},{"id":"u8c9","front":"German Empire proclaimed (1871)","back":"William I crowned Kaiser in the Hall of Mirrors at Versailles.","person":false},{"id":"u8c10","front":"Kulturkampf","back":"Bismarck's 1870s campaign against the Catholic Church in Germany.","person":false},{"id":"u8c11","front":"Bismarck's social insurance","back":"Health (1883), accident (1884) and old-age (1889) insurance to undercut socialism.","person":false},{"id":"u8c12","front":"Ausgleich (1867)","back":"Compromise creating the Dual Monarchy of Austria-Hungary.","person":false},{"id":"u8c13","front":"Alexander II","back":"Russian tsar who emancipated the serfs (1861); assassinated 1881.","person":true},{"id":"u8c14","front":"Emancipation of the serfs (1861)","back":"Freed Russia's serfs; peasants owed redemption payments; land held by communes.","person":false},{"id":"u8c15","front":"Russification","back":"Forcing Russian language and Orthodoxy on minorities under Alexander III.","person":false},{"id":"u8c16","front":"Paris Commune (1871)","back":"Radical Paris government crushed by the French army in \"Bloody Week.\"","person":false},{"id":"u8c17","front":"Dreyfus Affair","back":"False conviction of a Jewish French officer (1894); exposed anti-Semitism; Zola's \"J'accuse!\"","person":false},{"id":"u8c18","front":"Theodor Herzl","back":"Founder of political Zionism (1897), influenced by the Dreyfus Affair.","person":true},{"id":"u8c19","front":"Eduard Bernstein","back":"Revisionist socialist: reach socialism gradually through elections and reform.","person":true},{"id":"u8c20","front":"Second Reform Act (1867)","back":"Disraeli's law giving the vote to many urban working men in Britain.","person":false},{"id":"u8c21","front":"Triple Alliance (1882)","back":"Germany, Austria-Hungary and Italy.","person":false},{"id":"u8c22","front":"Triple Entente (1907)","back":"France, Russia and Britain.","person":false}],"hours":1.92,"quizIds":["u8q2","u8q4","u8q5","u8q11","u8q14","u8q18","u8q19","u8q23","u8q27","u8q28","u8q30","u8q32","u8q34"]}],"questions":{"u1q1":{"id":"u1q1","unit":1,"diff":"e","pool":"exam1","stem":"<p>Which document, accepted by William and Mary in 1689, guaranteed that Parliament must consent to taxation and to a peacetime standing army?<\/p>","options":["The Petition of Right","The Edict of Nantes","The English Bill of Rights","The Test Act","The Act of Union"],"why":["The Petition of Right dates from 1628, under Charles I, and he ignored it.","The Edict of Nantes (1598) gave French Protestants toleration; it has nothing to do with Parliament.","The 1689 Bill of Rights made these parliamentary powers law as the condition of William and Mary's accession.","The Test Act (1673) barred non-Anglicans from office; it did not define Parliament's powers over taxes.","The Act of Union (1707) joined England and Scotland; it did not set out Parliament's taxing power."],"answer":2},"u1q2":{"id":"u1q2","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Peace of Westphalia (1648) did which of the following?<\/p>","options":["Recognized the independence of the Dutch Republic","Restored the Stuart monarchy in England","Outlawed Calvinism within the Holy Roman Empire","Unified the German states under the Habsburg emperor","Ended the War of the Spanish Succession"],"why":["Westphalia formally recognized the United Provinces' independence from Spain, along with Swiss independence.","The Stuart Restoration happened in 1660 and was an English domestic event.","Westphalia added Calvinism to the faiths a ruler could legally adopt.","It did the opposite: German princes became effectively sovereign and the emperor was weakened.","That war ended with the Treaty of Utrecht in 1713."],"answer":0},"u1q3":{"id":"u1q3","unit":1,"diff":"e","pool":"quiz","stem":"<p>Louis XIV's main purpose in requiring great nobles to live at Versailles was to<\/p>","options":["collect the taxes that the nobles owed the crown","convert them from Protestantism to Catholicism","train them as officers for the French navy","prepare them to serve in the Estates-General","keep them under royal watch and away from independent power bases"],"why":["French nobles were largely exempt from direct taxes; Versailles was not a tax office.","The great nobles were overwhelmingly Catholic already; Versailles was about political control.","Versailles was a court, not a naval academy.","Louis never called the Estates-General.","Busy competing for court honors, nobles could not raise private armies or lead revolts like the Fronde."],"answer":4},"u1q4":{"id":"u1q4","unit":1,"diff":"e","pool":"exam2","stem":"<p>Which ruler is most closely associated with founding St. Petersburg and forcing Russian nobles to adopt Western dress?<\/p>","options":["Alexander I","Michael Romanov","Peter the Great","Ivan the Terrible","Catherine the Great"],"why":["Alexander I ruled 1801–1825 and is known for fighting Napoleon.","Michael founded the Romanov dynasty in 1613; he did not westernize Russia.","Peter founded St. Petersburg in 1703 and imposed beard taxes and Western clothing on the elite.","Ivan IV ruled in the 1500s, long before St. Petersburg existed.","Catherine (r. 1762–1796) came later and is linked to enlightened despotism and the partitions of Poland."],"answer":2},"u1q5":{"id":"u1q5","unit":1,"diff":"e","pool":"exam2","stem":"<p>The Glorious Revolution of 1688 replaced James II with<\/p>","options":["George I of Hanover","William of Orange and Mary","Oliver Cromwell","Charles II","Queen Anne"],"why":["George I came to the throne in 1714 under the Act of Settlement.","Parliament's leaders invited the Protestant William and Mary, James's daughter, to take the throne.","Cromwell died in 1658, thirty years earlier.","Charles II was restored in 1660 and died in 1685; James II was his successor.","Anne followed William in 1702; she did not replace James II."],"answer":1},"u1q6":{"id":"u1q6","unit":1,"diff":"e","pool":"exam1","stem":"<p>In the Dutch Republic of the 1600s, political power rested chiefly with<\/p>","options":["a parliament elected by all adult men","the Spanish viceroy in Brussels","the Catholic bishops of the Netherlands","wealthy merchant oligarchs (regents) in the provinces and towns","an absolute monarch ruling by divine right"],"why":["There was no democratic suffrage; power was oligarchic.","The Dutch had broken away from Spain; Spanish officials governed only the southern (Spanish) Netherlands.","The Republic was officially Calvinist; Catholic bishops held no political power.","The regents dominated provincial estates and town councils; the federation's center was weak.","The Dutch Republic had no king; it was a federal republic."],"answer":3},"u1q7":{"id":"u1q7","unit":1,"diff":"e","pool":"diag","stem":"<p>Which war ended with the Treaty of Utrecht in 1713?<\/p>","options":["The Thirty Years' War","The Seven Years' War","The Great Northern War","The English Civil War","The War of the Spanish Succession"],"why":["The Thirty Years' War ended at Westphalia in 1648.","The Seven Years' War ended in 1763 with the Treaty of Paris.","That war ended with the Treaty of Nystad in 1721.","The English Civil War was a domestic conflict that ended in 1649.","Utrecht (1713, with Rastatt in 1714) settled who would rule Spain."],"answer":4},"u1q8":{"id":"u1q8","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Prussian Junkers were<\/p>","options":["Prussian merchants who financed the royal army","landowning nobles who served as army officers in return for control over their serfs","foreign mercenaries hired by the Great Elector","Protestant refugees from France","elected members of the Prussian parliament"],"why":["Prussia's merchant class was small; Junkers were rural nobles.","This bargain with the Hohenzollerns was the social basis of the Prussian state.","Junkers were native Prussian nobles, not foreign hires.","Huguenot refugees settled in Prussia, but they were not called Junkers.","Prussia had no powerful elected parliament in this period."],"answer":1},"u1q9":{"id":"u1q9","unit":1,"diff":"e","pool":"exam2","stem":"<p>Mercantilism, as practiced by Colbert, held that a nation should<\/p>","options":["let private markets set all prices without state interference","abolish colonies because they drain the home economy","export more than it imports in order to accumulate gold and silver","remove all tariffs and allow free trade","collectivize land and industry under worker control"],"why":["That is laissez-faire, the opposite of Colbert's state-directed economy.","Mercantilists valued colonies as sources of raw materials and markets.","Mercantilists measured wealth in bullion and sought a favorable balance of trade.","Free trade is Adam Smith's later answer to mercantilism.","That describes socialism, a nineteenth-century idea."],"answer":2},"u1q10":{"id":"u1q10","unit":1,"diff":"e","pool":"quiz","stem":"<p>What happened to King Charles I of England in 1649?<\/p>","options":["He was tried and executed by order of Parliament's leaders","He dissolved Parliament and began eleven years of personal rule","He was deposed in a bloodless revolution","He signed the Bill of Rights and became a constitutional monarch","He fled to France and returned as king in 1660"],"why":["His beheading in January 1649 led to the Commonwealth.","His personal rule ran from 1629 to 1640, not 1649.","That describes James II in 1688.","The Bill of Rights was accepted by William and Mary in 1689.","Charles II, his son, returned in 1660; Charles I was dead by then."],"answer":0},"u1q11":{"id":"u1q11","unit":1,"diff":"m","pool":"exam1","stem":"<p>Louis XIV's revocation of the Edict of Nantes in 1685 had which of the following consequences?<\/p>","options":["Many skilled Huguenot artisans and merchants emigrated to France's rivals","The Fronde broke out against royal authority","The pope excommunicated Louis XIV","France became officially Protestant","France's economy immediately surpassed the Dutch Republic's"],"why":["Around 200,000 Huguenots fled to the Dutch Republic, England, Prussia and America, taking skills and capital with them.","The Fronde (1648–53) happened decades earlier.","The revocation pleased many Catholics; there was no excommunication.","The revocation made Protestant worship illegal; France stayed Catholic.","Losing skilled workers hurt France's economy."],"answer":0},"u1q12":{"id":"u1q12","unit":1,"diff":"m","pool":"quiz","stem":"<p>Which pairing of a state and its form of government around 1700 is correct?<\/p>","options":["Prussia: merchant republic run by town councils","Dutch Republic: absolute monarchy under the House of Orange","England: constitutional monarchy with Parliament controlling taxation","Russia: elected monarchy chosen by the nobility","France: limited monarchy under a strong Estates-General"],"why":["Prussia was a militarized absolute monarchy.","The Orange stadtholders were powerful but the Republic had no king.","After 1689 the English crown could not tax without Parliament.","Russia was an autocracy under hereditary tsars.","The Estates-General did not meet between 1614 and 1789; France was absolutist."],"answer":2},"u1q13":{"id":"u1q13","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which event came FIRST?<\/p>","options":["The revocation of the Edict of Nantes","The Glorious Revolution","The founding of St. Petersburg","The Treaty of Utrecht","The beheading of Charles I"],"why":["1685.","1688.","1703.","1713.","1649, the earliest of these."],"answer":4},"u1q14":{"id":"u1q14","unit":1,"diff":"m","pool":"quiz","stem":"<blockquote>\"The royal throne is not the throne of a man, but the throne of God himself... The person of the king is sacred, and to attack him in any way is sacrilege.\"<\/blockquote><p>The passage above best expresses the ideas of<\/p>","options":["Bishop Bossuet, defending divine-right absolutism","Oliver Cromwell, justifying the Protectorate","the Levellers, demanding wider suffrage","Spinoza, arguing for religious toleration","John Locke, defending the Glorious Revolution"],"why":["Bossuet, tutor to Louis XIV's son, argued that kings are God's ministers on earth.","Cromwell had helped execute a king; he did not call kings sacred.","The Levellers were radicals who wanted to limit authority, not sanctify kings.","Spinoza was a rationalist critic of religious authority.","Locke argued that power comes from the consent of the governed, not from God."],"answer":0},"u1q15":{"id":"u1q15","unit":1,"diff":"m","pool":"exam1","stem":"<p>Peter the Great's Table of Ranks (1722) was designed to<\/p>","options":["tie noble status and promotion to service to the state","establish an elected Russian parliament","rank Orthodox clergy above the nobility","free the serfs and give them land","list the provinces that owed tribute to Sweden"],"why":["Rank came from service in the army, navy or bureaucracy, so the nobility worked for the tsar.","Russia had no parliament until the Duma of 1906.","Peter subordinated the Church to the state through the Holy Synod.","Serfdom grew harsher under Peter; emancipation came in 1861.","Russia fought Sweden; it did not pay it tribute."],"answer":0},"u1q16":{"id":"u1q16","unit":1,"diff":"m","pool":"quiz","stem":"<p>The Treaty of Utrecht (1713) is significant because it<\/p>","options":["placed a Habsburg prince on the Spanish throne","created the German Confederation","forced Britain to return Gibraltar to Spain","kept the French and Spanish crowns separate and upheld a balance of power","ended Dutch independence"],"why":["The Bourbon Philip V, Louis XIV's grandson, kept Spain.","The German Confederation was created by the Congress of Vienna in 1815.","Britain gained Gibraltar at Utrecht.","Philip V kept Spain but could never unite it with France, preventing one dominant power.","Dutch independence was not at issue; the Republic was on the winning side."],"answer":3},"u1q17":{"id":"u1q17","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which group was most likely to support Parliament against Charles I in the English Civil War?<\/p>","options":["The great landed nobility of the north and west","Puritans and London merchants","Jesuit missionaries","Irish Catholics","High-church Anglican bishops"],"why":["Many northern and western nobles were Royalists.","Parliament's strongholds were the Puritans, the commercial classes and London.","Jesuits were banned in England and opposed Puritan Parliament.","Irish Catholics were hostile to the Puritan Parliament.","Bishops generally backed the king's religious policies."],"answer":1},"u1q18":{"id":"u1q18","unit":1,"diff":"m","pool":"exam2","stem":"<p>The 1683 Ottoman siege of Vienna is important because its failure<\/p>","options":["made the Ottoman Empire a member of the Holy Roman Empire","caused the Thirty Years' War","led directly to the unification of Germany","began a Habsburg advance that won most of Hungary by 1699","ended Habsburg rule in Austria"],"why":["The Ottomans were never part of the Holy Roman Empire.","That war began in 1618 and ended in 1648.","German unification came in 1871.","After the siege was broken, Austria pushed back the Ottomans and gained Hungary at Karlowitz.","The Habsburgs emerged stronger."],"answer":3},"u1q19":{"id":"u1q19","unit":1,"diff":"m","pool":"quiz","stem":"<p>A historian argues that seventeenth-century rulers became absolute mainly because war had grown too expensive for traditional revenue. Which evidence would best support this?<\/p>","options":["The English Bill of Rights guaranteed free speech in Parliament","Rembrandt painted group portraits of Amsterdam militia companies","Peter the Great required nobles to shave their beards","The Peace of Westphalia tolerated Calvinism","Prussia's Great Elector created a tax bureaucracy specifically to fund a standing army"],"why":["This shows limits on a king, not the fiscal roots of absolutism.","This is cultural evidence, not evidence about state finance.","Beard rules concern cultural westernization, not war finance.","Religious settlement does not show that war costs drove absolutism.","The General War Commissariat shows military needs driving state-building."],"answer":4},"u1q20":{"id":"u1q20","unit":1,"diff":"m","pool":"exam1","stem":"<p>The Dutch Republic in the seventeenth century was notable for<\/p>","options":["its rejection of overseas trade and colonies","being governed directly from Madrid","religious toleration that attracted Jews, Huguenots and other refugees","strict censorship that drove printers abroad","a powerful landed nobility that dominated trade"],"why":["The VOC made it a leading colonial and trading power.","Independence from Spain was recognized in 1648.","Its relative tolerance drew skilled refugees and dissenting thinkers such as Spinoza.","The Republic was Europe's freest publishing center.","Trade was dominated by urban merchants, not landed nobles."],"answer":2},"u1q21":{"id":"u1q21","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which statement best describes Oliver Cromwell's rule as Lord Protector (1653–1658)?<\/p>","options":["It made England an absolute monarchy under divine right","It restored the Catholic Church in England","It was a republic in name but a military dictatorship in practice","It established the first fully democratic government in Europe","It ended when Parliament invited William of Orange to rule"],"why":["Cromwell was not a king, and divine right was the Stuart theory.","Cromwell was a Puritan and hostile to Catholicism.","Cromwell relied on the army and dismissed parliaments that opposed him.","Cromwell rejected the Levellers' demand for wide suffrage.","That happened to James II in 1688."],"answer":2},"u1q22":{"id":"u1q22","unit":1,"diff":"m","pool":"exam2","stem":"<p>Frederick William, the Great Elector of Brandenburg-Prussia, is best known for<\/p>","options":["defeating Napoleon at Leipzig","building a large standing army and a central bureaucracy to pay for it","unifying Germany through \"blood and iron\"","becoming the first Holy Roman Emperor from Prussia","granting a liberal constitution to his subjects"],"why":["The Battle of Leipzig took place in 1813, long after his death in 1688.","He laid the foundations of Prussian militarism and administration.","That was Bismarck in the 1860s.","No Prussian ruler was Holy Roman Emperor.","He ruled as an absolutist."],"answer":1},"u1q23":{"id":"u1q23","unit":1,"diff":"m","pool":"quiz","stem":"<p>The Battle of Poltava (1709) was decisive because it<\/p>","options":["ended the Ottoman threat to Vienna","broke Swedish power and opened Russia's path to the Baltic","made Prussia a kingdom","forced Louis XIV to accept the Treaty of Utrecht","restored the Stuarts to the English throne"],"why":["That was the relief of Vienna in 1683.","Peter's victory over Charles XII led to Russian gains confirmed at Nystad (1721).","Prussia became a kingdom in 1701 by agreement with the emperor.","Utrecht followed battles in western Europe, not Poltava.","The Restoration was in 1660."],"answer":1},"u1q24":{"id":"u1q24","unit":1,"diff":"m","pool":"diag","stem":"<p>\"No taxation without the consent of Parliament\" was a central issue in which conflict?<\/p>","options":["The Fronde in France","The War of the Spanish Succession","The Dutch revolt against Spain","The Great Northern War","The struggle between the Stuart kings and Parliament that led to the English Civil War"],"why":["The Fronde concerned French nobles and courts; there was no Parliament in the English sense.","That war was about who would inherit the Spanish throne.","Taxation was an issue, but \"Parliament\" refers to England.","That war was between Russia and Sweden over the Baltic.","Charles I's attempts to tax without Parliament helped trigger the war in 1642."],"answer":4},"u1q25":{"id":"u1q25","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which of the following best explains why England developed a constitutional monarchy while France developed absolutism?<\/p>","options":["France had already experienced a successful revolution","England was Catholic while France was Protestant","France had no nobility to resist the king","English kings rejected the theory of divine right","English kings depended on Parliament for taxes, while French kings could tax without a national assembly"],"why":["France's revolution came in 1789.","The reverse is closer to the truth: England was Protestant and France Catholic.","France had a powerful nobility; Louis XIV had to tame it.","James I and Charles I strongly believed in divine right.","Control of revenue determined who held power; the French crown never had to call the Estates-General."],"answer":4},"u1q26":{"id":"u1q26","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which development is MOST similar to Louis XIV's use of intendants?<\/p>","options":["The Peace of Westphalia's grant of sovereignty to German princes","Peter the Great's creation of a service bureaucracy loyal to the tsar","England's Bill of Rights limiting the crown","The Dutch reliance on town councils run by regents","The Levellers' call for wider suffrage"],"why":["That decentralized authority within the Empire.","Both rulers bypassed traditional nobles by relying on officials who owed everything to the crown.","That limited royal power rather than extending it.","That decentralized merchant government is the opposite of royal centralization.","That was a popular democratic demand, not a royal administrative tool."],"answer":1},"u1q27":{"id":"u1q27","unit":1,"diff":"h","pool":"exam2","stem":"<p>A French Huguenot silk weaver who left France in 1686 and settled in Berlin would most likely have been<\/p>","options":["expelled immediately as a Catholic","drafted into the Ottoman army","welcomed by the Great Elector, who offered refuge to Huguenots to build Prussia's economy","forced to return to France under the Treaty of Utrecht","required to convert to Russian Orthodoxy"],"why":["Huguenots were Protestants, and Prussia's rulers were Protestant.","Berlin was not Ottoman territory.","His Edict of Potsdam (1685) invited Huguenots, who boosted Berlin's crafts.","Utrecht contained no such provision.","Berlin was in Brandenburg-Prussia, not Russia."],"answer":2},"u1q28":{"id":"u1q28","unit":1,"diff":"h","pool":"exam1","stem":"<p>Which of the following was a provision of the Treaty of Utrecht?<\/p>","options":["Britain received the asiento, the right to supply enslaved Africans to Spanish America","Philip V was required to give Spain to the Habsburgs","Austria received Gibraltar and Minorca","France gained Nova Scotia from Britain","Russia received a Baltic coastline"],"why":["The asiento was one of Britain's chief commercial gains at Utrecht.","Philip V kept Spain.","Britain, not Austria, received Gibraltar and Minorca.","France ceded Acadia (Nova Scotia) to Britain.","Russia's Baltic gains came at Nystad in 1721."],"answer":0},"u1q29":{"id":"u1q29","unit":1,"diff":"h","pool":"quiz","stem":"<p>Locke's Two Treatises of Government (1690) is closely linked to the Glorious Revolution because it<\/p>","options":["urged England to adopt Catholicism","defended the divine right of the Stuart dynasty","called for the abolition of private property","argued that a ruler who violates the people's rights may be replaced","argued for an all-powerful sovereign to prevent civil war"],"why":["Locke supported toleration for Protestants and opposed a Catholic monarch.","That was the position Locke attacked (Filmer's Patriarcha).","Locke made property a natural right.","Locke's case for government by consent justified removing James II.","That is Hobbes's argument in Leviathan (1651)."],"answer":3},"u1q30":{"id":"u1q30","unit":1,"diff":"h","pool":"exam2","stem":"<p>Which statement about the Habsburg monarchy after 1648 is most accurate?<\/p>","options":["It adopted a constitutional monarchy like England's","It was a multiethnic collection of territories held together by the dynasty, Catholicism and the army","It lost Hungary to the Ottomans in 1699","It controlled the German states more tightly after Westphalia","It was a centralized nation-state with a single language"],"why":["The Habsburgs ruled as absolutists where they could.","Austria, Bohemia and Hungary kept separate laws and estates under one ruler.","At Karlowitz (1699) the Ottomans ceded Hungary to Austria.","Westphalia weakened imperial control over the German princes.","The Habsburg lands were linguistically diverse and decentralized."],"answer":1},"u1q31":{"id":"u1q31","unit":1,"diff":"m","pool":"exam2","stem":"<p>The phrase \"one king, one law, one faith\" best summarizes the goals of<\/p>","options":["Louis XIV","William of Orange","John Locke","the Levellers","the Dutch regents"],"why":["His centralization and the 1685 revocation of the Edict of Nantes aimed at uniformity under the crown.","William ruled England under the Bill of Rights and supported toleration for Protestant dissenters.","Locke argued for limited government and toleration.","The Levellers wanted wider rights, not royal uniformity.","The regents governed a decentralized, tolerant republic."],"answer":0},"u1q32":{"id":"u1q32","unit":1,"diff":"e","pool":"exam1","stem":"<p>Who won the English Civil War?<\/p>","options":["The Irish Catholic Confederation","The Scots under James II","The Parliamentarians, led militarily by Oliver Cromwell","The Royalists under Charles I","William of Orange's Dutch army"],"why":["The Irish were defeated by Cromwell in 1649–50.","James II reigned in 1685–88; he did not lead the Scots in the 1640s.","Cromwell's New Model Army defeated the Royalists by 1646 and again in 1648.","Charles I lost and was executed in 1649.","William's landing came in 1688, decades later."],"answer":2},"u1q33":{"id":"u1q33","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which feature distinguished the English Restoration settlement of 1660 from the monarchy before 1640?<\/p>","options":["The monarch was now elected by Parliament","Divine right was written into law","Cromwell's Protectorate continued alongside the king","Parliament kept its control over taxation and could not be ignored by the king","Catholicism became the state religion"],"why":["The crown remained hereditary; Charles II was the son of Charles I.","The settlement limited royal power in practice.","The Protectorate ended in 1659.","The monarchy returned, but the crown could no longer rule and tax without Parliament.","The Church of England was restored, and the Test Act excluded Catholics from office."],"answer":3},"u1q34":{"id":"u1q34","unit":1,"diff":"h","pool":"exam1","stem":"<p>Which comparison of Peter the Great and Louis XIV is most accurate?<\/p>","options":["Both lost their thrones in revolutions","Both strengthened royal power by bringing nobles and the church under tighter state control","Both modeled their reforms on the Dutch republican constitution","Both ruled through powerful elected parliaments","Both revoked edicts of religious toleration for Protestants"],"why":["Both died as reigning monarchs.","Louis used Versailles and Gallican control; Peter used service ranks and the Holy Synod.","Peter admired Dutch shipbuilding, not republicanism; Louis invaded the Dutch.","Neither shared power with a parliament.","Only Louis did this, in 1685."],"answer":1},"u2q1":{"id":"u2q1","unit":2,"diff":"e","pool":"quiz","stem":"<p>In the eighteenth century, the most profitable European colonies in the Americas were the<\/p>","options":["tea plantations of Virginia","gold mines of Louisiana","sugar islands of the Caribbean","farming colonies of New England","fur-trading posts of Canada"],"why":["Virginia grew tobacco; tea came from China.","Louisiana had no gold mines; John Law's promises of wealth there were a fantasy.","Islands such as Saint-Domingue and Jamaica produced sugar that was worth more than any other colonial export.","New England did not produce a major export crop for Europe.","The fur trade was valuable but far smaller than sugar."],"answer":2},"u2q2":{"id":"u2q2","unit":2,"diff":"e","pool":"exam1","stem":"<p>Robert Walpole is significant in British history as<\/p>","options":["the general who captured Quebec","the king who replaced James II","the founder of the Bank of England","the leader of the Puritan army in the Civil War","the first prime minister in practice, governing through a cabinet responsible to Parliament"],"why":["James Wolfe led the attack on Quebec in 1759.","That was William III.","The Bank of England was founded in 1694.","That was Oliver Cromwell.","Walpole led the government from 1721 to 1742 and set the pattern of cabinet rule."],"answer":4},"u2q3":{"id":"u2q3","unit":2,"diff":"e","pool":"exam2","stem":"<p>The Diplomatic Revolution of 1756 refers to<\/p>","options":["France's alliance with the American colonies","Austria allying with its old enemy France, while Britain allied with Prussia","the overthrow of James II in favor of William and Mary","Russia's alliance with Napoleon at Tilsit","the union of England and Scotland"],"why":["That came in 1778 during the American Revolution.","The switch of partners set the sides for the Seven Years' War.","That was the Glorious Revolution of 1688.","Tilsit was in 1807.","That was the Act of Union in 1707."],"answer":1},"u2q4":{"id":"u2q4","unit":2,"diff":"e","pool":"quiz","stem":"<p>Which treaty gave Britain control of Canada?<\/p>","options":["The Treaty of Aix-la-Chapelle (1748)","The Treaty of Paris (1763)","The Treaty of Utrecht (1713)","The Treaty of Nystad (1721)","The Peace of Westphalia (1648)"],"why":["That treaty largely restored colonial conquests.","It ended the Seven Years' War and transferred New France to Britain.","Utrecht gave Britain Nova Scotia, Newfoundland and Hudson Bay, not all of Canada.","Nystad ended the Great Northern War between Russia and Sweden.","Westphalia concerned the Thirty Years' War in Europe."],"answer":1},"u2q5":{"id":"u2q5","unit":2,"diff":"e","pool":"exam1","stem":"<p>The putting-out system involved<\/p>","options":["guild workshops in large cities","merchants supplying raw materials to rural households that produced goods at home","steam-powered textile mills","government factories run by state officials","slave labor on Caribbean plantations"],"why":["Merchants used rural labor to avoid urban guild rules.","Families spun and wove in their cottages; merchants collected and sold the finished cloth.","Mills came with the Industrial Revolution and replaced cottage industry.","The system was private and decentralized.","That was the plantation system."],"answer":1},"u2q6":{"id":"u2q6","unit":2,"diff":"e","pool":"exam2","stem":"<p>Frederick II's invasion of Silesia in 1740 began the<\/p>","options":["Thirty Years' War","Crimean War","War of the Austrian Succession","War of the Spanish Succession","Great Northern War"],"why":["That war ran from 1618 to 1648.","The Crimean War was fought in the 1850s.","Frederick exploited Maria Theresa's accession to seize Silesia.","That war ran from 1701 to 1714.","That war (1700–1721) was fought between Russia and Sweden."],"answer":2},"u2q7":{"id":"u2q7","unit":2,"diff":"m","pool":"quiz","stem":"<p>The main cause of European population growth in the eighteenth century was<\/p>","options":["the spread of modern vaccination and antibiotics","mass immigration from Asia and Africa","government programs encouraging large families","the end of serfdom across Europe","a declining death rate as plague vanished and famines became less frequent"],"why":["Antibiotics came in the 1900s; the smallpox vaccine only in 1796.","There was no large immigration into Europe.","No such programs drove the trend.","Serfdom survived in central and eastern Europe well into the 1800s.","Fewer deaths from plague and famine, not more births, drove the increase."],"answer":4},"u2q8":{"id":"u2q8","unit":2,"diff":"m","pool":"exam1","stem":"<p>Which statement about the Atlantic slave trade in the eighteenth century is accurate?<\/p>","options":["It mainly supplied workers to European factories","It was abolished by Britain at the Treaty of Utrecht","It declined sharply as sugar became less profitable","It was controlled entirely by the Dutch","More enslaved Africans were transported in the 1700s than in any other century"],"why":["Enslaved people were sent to American plantations.","Utrecht gave Britain the asiento; Britain abolished the trade in 1807.","Sugar profits were high, and the trade expanded.","Britain, Portugal and France were the leading carriers in this period.","The trade peaked in the eighteenth century, driven by plantation demand."],"answer":4},"u2q9":{"id":"u2q9","unit":2,"diff":"m","pool":"exam1","stem":"<p>Charles VI's Pragmatic Sanction was intended to<\/p>","options":["ensure that his daughter Maria Theresa inherited the Habsburg lands intact","abolish serfdom in the Habsburg lands","divide Poland among its neighbors","grant religious toleration to Protestants in Austria","unite the crowns of France and Spain"],"why":["Charles had no son and sought international guarantees for her succession.","Serfdom reform came later under Joseph II.","The partitions of Poland began in 1772.","That was Joseph II's Edict of Toleration in 1781.","Utrecht forbade that union, and it was not Charles's aim."],"answer":0},"u2q10":{"id":"u2q10","unit":2,"diff":"m","pool":"exam2","stem":"<p>The South Sea Bubble (1720) and the Mississippi Bubble (1720) were both<\/p>","options":["slave revolts in the Caribbean","speculative financial collapses tied to companies promising colonial trade profits","naval battles between Britain and France","plagues that killed thousands in port cities","treaties that ended the War of the Spanish Succession"],"why":["They were stock-market crashes, not revolts.","Both crashes ruined investors in companies selling dreams of overseas wealth.","Neither was a battle.","The Marseille plague of 1720 is unrelated to these crashes.","That war ended with Utrecht and Rastatt."],"answer":1},"u2q11":{"id":"u2q11","unit":2,"diff":"m","pool":"quiz","stem":"<p>Which of the following was a result of the Seven Years' War?<\/p>","options":["Spain lost all its American colonies","Prussia was forced to return Silesia to Austria","Austria gained control of the Holy Roman Empire's German states","Britain emerged as the dominant colonial power in North America and India","France gained Canada from Britain"],"why":["Spain kept its American empire and received Louisiana from France.","Prussia kept Silesia.","There was no such outcome.","The Treaty of Paris (1763) removed France from Canada and left Britain dominant in India.","France lost Canada."],"answer":3},"u2q12":{"id":"u2q12","unit":2,"diff":"m","pool":"exam2","stem":"<p>Robert Clive's victory at the Battle of Plassey (1757) is significant because it<\/p>","options":["began British East India Company control of Bengal","gave France control of the spice trade","ended the Atlantic slave trade","ended the Mughal Empire's conquest of Europe","opened Japan to Western trade"],"why":["Plassey made the Company the real power in Bengal, a base for wider British rule in India.","France lost ground in India.","Plassey was in India and unrelated to the slave trade.","The Mughals never invaded Europe.","Japan was opened by the United States in the 1850s."],"answer":0},"u2q13":{"id":"u2q13","unit":2,"diff":"m","pool":"diag","stem":"<p>The growth of eighteenth-century consumption of sugar, tea and coffee in Europe most directly encouraged<\/p>","options":["the decline of European port cities","the collapse of the Dutch East India Company within a decade","a fall in the price of land in Britain","the expansion of slave-worked plantations in the Americas","the abandonment of mercantilist policies"],"why":["Ports like Liverpool and Nantes grew rich.","The VOC declined slowly and was dissolved only in 1799.","There is no direct link between colonial goods and British land prices.","Rising demand for sugar and coffee meant more plantations and more enslaved labor.","Mercantilism remained dominant through the century."],"answer":3},"u2q14":{"id":"u2q14","unit":2,"diff":"m","pool":"quiz","stem":"<p>Which pair were allies during the Seven Years' War?<\/p>","options":["France and Prussia","Britain and France","Prussia and Austria","Britain and Austria","Britain and Prussia"],"why":["France switched to Austria's side in 1756.","They were the main colonial rivals.","Austria wanted to reconquer Silesia from Prussia.","They had been allies earlier but split in 1756.","After the Diplomatic Revolution, Britain subsidized Prussia against Austria, France and Russia."],"answer":4},"u2q15":{"id":"u2q15","unit":2,"diff":"m","pool":"exam1","stem":"<p>Frederick William I of Prussia, the \"Soldier King,\" is best known for<\/p>","options":["writing philosophical letters to Voltaire","conquering Silesia from Austria","creating a constitutional monarchy","building a large, well-drilled army and a full treasury through strict economy","leading Prussia to defeat at Jena"],"why":["That was Frederick II.","His son Frederick II did that in 1740.","He was an absolutist.","He made Prussia a major military power while rarely going to war.","Jena was in 1806, under Frederick William III."],"answer":3},"u2q16":{"id":"u2q16","unit":2,"diff":"m","pool":"quiz","stem":"<p>After Louis XIV died in 1715, the Paris parlement regained the right to<\/p>","options":["elect the king of France","object to royal decrees before registering them","declare war without royal approval","abolish noble tax exemptions","appoint the king's ministers"],"why":["The French crown was hereditary.","The parlements later used this right of remonstrance to block tax reforms.","The parlements were law courts with no war powers.","The parlements defended privilege; they did not abolish it.","Ministers were chosen by the king."],"answer":1},"u2q17":{"id":"u2q17","unit":2,"diff":"h","pool":"exam1","stem":"<p>Which development best reflects proto-industrialization in the eighteenth century?<\/p>","options":["The Navigation Acts' restriction of colonial shipping","Rural families earning extra income by spinning and weaving for merchants","The guilds' monopoly over urban textile production","State-run silk factories in Lyon","The building of steam-powered cotton mills in Manchester"],"why":["These were trade laws, not a production system.","Proto-industry was market-oriented rural cottage production that came before factories.","Proto-industry grew in the countryside largely to escape guild control.","Lyon's silk trade was urban and artisanal.","Mills are the factory system itself, not its precursor."],"answer":1},"u2q18":{"id":"u2q18","unit":2,"diff":"h","pool":"quiz","stem":"<p>A historian notes that the national debt of both Britain and France nearly doubled because of the Seven Years' War. Which later development does this best help explain?<\/p>","options":["The Glorious Revolution of 1688","Both the American Revolution and the French fiscal crisis of the 1780s","The South Sea Bubble of 1720","The spread of the potato in eastern Europe","The Diplomatic Revolution of 1756"],"why":["That came long before the war.","British taxes on the colonies and France's bankruptcy both grew out of war debt.","That came before the war.","Crop diffusion is unrelated to war debt.","The alliance switch came before the debts were run up."],"answer":1},"u2q19":{"id":"u2q19","unit":2,"diff":"h","pool":"exam2","stem":"<p>Which factor contributed LEAST to Europe's eighteenth-century population growth?<\/p>","options":["Improved transportation for moving grain","The disappearance of bubonic plague from western Europe","The spread of the potato","Advances in hospital medicine","A milder climate after the seventeenth century"],"why":["Better roads and canals relieved local shortages.","This sharply reduced mortality.","The potato provided cheap calories and reduced famine.","Hospitals of the period often spread disease; medicine had little demographic effect before the 1800s.","Better harvests reduced famine."],"answer":3},"u2q20":{"id":"u2q20","unit":2,"diff":"h","pool":"quiz","stem":"<p>Which statement best compares Britain and France in the mid-1700s?<\/p>","options":["Britain's Parliament-backed credit let it borrow cheaply for war, while France's finances were hampered by privilege and distrust of banks","France had a larger navy and won most colonial wars","Both abolished their colonial empires after 1763","Britain was an absolute monarchy and France a parliamentary state","Neither country participated in the Atlantic slave trade"],"why":["Britain's credit system funded naval victories; France's tax exemptions and memories of John Law's collapse limited its borrowing.","Britain's navy was superior, and Britain won the Seven Years' War.","Both kept empires; France kept its sugar islands.","The reverse is true.","Both were major slave-trading nations."],"answer":0},"u2q21":{"id":"u2q21","unit":2,"diff":"m","pool":"quiz","stem":"<p>What was the asiento that Britain won in 1713?<\/p>","options":["A monopoly on the tea trade with China","A royal charter for the Bank of England","Control of the Mississippi River","The right to supply enslaved Africans to Spanish America","Permanent fishing rights in the Baltic"],"why":["The British East India Company's China trade was unrelated to the asiento.","The Bank of England was chartered in 1694.","The Mississippi remained in French and then Spanish hands until 1803.","The asiento contract was the commercial prize of Utrecht and was later held by the South Sea Company.","The asiento concerned the slave trade."],"answer":3},"u2q22":{"id":"u2q22","unit":2,"diff":"e","pool":"diag","stem":"<p>Which crop from the Americas most helped Europe reduce famine in the eighteenth century?<\/p>","options":["Sugarcane","The potato","Tobacco","Coffee","Rice"],"why":["Sugar was a cash crop grown in the Caribbean, not a European staple.","Potatoes yielded many calories per acre and grew in poor soils.","Tobacco is not a food.","Coffee is a stimulant, not a staple food.","Rice was not a major American crop in Europe's diet."],"answer":1},"u2q23":{"id":"u2q23","unit":2,"diff":"m","pool":"exam2","stem":"<p>Which best describes how mercantilist Britain viewed its colonies?<\/p>","options":["As places to build factories that would compete with Britain","As sources of raw materials and markets that should trade mainly with Britain","As burdens to be abandoned as soon as possible","As independent nations free to trade with anyone","As territories governed directly by Parliament's elected colonial members"],"why":["Colonial manufacturing was discouraged.","The Navigation Acts channeled colonial trade through British ships and ports.","Britain fought major wars to keep and expand them.","Mercantilism restricted colonial trade.","Colonies had no seats in Parliament."],"answer":1},"u2q24":{"id":"u2q24","unit":2,"diff":"h","pool":"quiz","stem":"<p>Which of the following is the best evidence that the Seven Years' War was a \"world war\"?<\/p>","options":["It lasted seven years","It ended with a treaty signed in Paris","Fighting took place in Europe, North America, the Caribbean, India and at sea","It started because of a dynastic succession dispute","It involved more than one German state"],"why":["Length alone does not make a war global.","Many treaties were signed in Paris.","Its theaters spanned several continents and oceans.","It was rooted in Silesia and colonial rivalry, not succession.","German states fought each other in many wars."],"answer":2},"u3q1":{"id":"u3q1","unit":3,"diff":"e","pool":"quiz","stem":"<p>Who first proposed, in a book published in 1543, that the Earth revolves around the Sun?<\/p>","options":["Galileo Galilei","Nicolaus Copernicus","Johannes Kepler","Ptolemy","Isaac Newton"],"why":["Galileo supported heliocentrism with evidence after 1610, but did not first propose it.","His On the Revolutions of the Heavenly Spheres put the Sun at the center.","Kepler refined the model with elliptical orbits after 1600.","Ptolemy was the ancient author of the Earth-centered model.","Newton explained why planets orbit (gravity) in 1687."],"answer":1},"u3q2":{"id":"u3q2","unit":3,"diff":"e","pool":"quiz","stem":"<p>Isaac Newton's Principia (1687) is best known for<\/p>","options":["defending the Earth-centered universe","arguing for the divine right of kings","proving that the mind is a blank slate at birth","the law of universal gravitation and three laws of motion","describing the circulation of the blood"],"why":["Newton's work confirmed the Sun-centered system.","Principia is a work of physics.","That is Locke's Essay (1690).","It showed that one set of physical laws governs both the heavens and the Earth.","That was William Harvey (1628)."],"answer":3},"u3q3":{"id":"u3q3","unit":3,"diff":"e","pool":"exam2","stem":"<p>Which thinker is associated with the statement \"I think, therefore I am\"?<\/p>","options":["René Descartes","John Locke","Francis Bacon","Thomas Hobbes","Blaise Pascal"],"why":["It comes from his Discourse on Method (1637), the starting point of his rationalism.","Locke is known for empiricism and natural rights.","Bacon emphasized observation and experiment.","Hobbes is known for Leviathan.","Pascal is known for his religious Pensées and mathematics."],"answer":0},"u3q4":{"id":"u3q4","unit":3,"diff":"e","pool":"diag","stem":"<p>According to Thomas Hobbes, people in the state of nature live lives that are<\/p>","options":["noble and uncorrupted by civilization","governed by the divine right of kings","organized into democratic assemblies","peaceful and guided by natural rights","\"solitary, poor, nasty, brutish, and short\""],"why":["That is Rousseau's idea of the noble savage, from the 1700s.","Hobbes based authority on a social contract, not on God.","Hobbes's state of nature has no government at all.","That is closer to Locke's view.","Hobbes used this bleak picture to argue for an all-powerful sovereign."],"answer":4},"u3q5":{"id":"u3q5","unit":3,"diff":"e","pool":"exam1","stem":"<p>Galileo's telescope observations included<\/p>","options":["the planet Neptune","the elliptical shape of planetary orbits","bacteria in drops of water","the law of universal gravitation","moons orbiting Jupiter"],"why":["Neptune was discovered in 1846.","Kepler discovered elliptical orbits by calculation.","Leeuwenhoek saw microorganisms with a microscope.","That was Newton's work.","These showed that not every heavenly body circles the Earth."],"answer":4},"u3q6":{"id":"u3q6","unit":3,"diff":"e","pool":"exam2","stem":"<p>Francis Bacon promoted which approach to knowledge?<\/p>","options":["Reliance on the authority of Aristotle","Deduction from self-evident first principles","Ignoring practical uses of science","Accepting truths revealed in dreams and visions","Induction: drawing general conclusions from careful observation and experiment"],"why":["Bacon attacked uncritical reliance on ancient authority.","That is Descartes's rationalism.","Bacon insisted knowledge should be useful.","Bacon demanded empirical evidence.","Bacon's Novum Organum urged experimental investigation of nature."],"answer":4},"u3q7":{"id":"u3q7","unit":3,"diff":"e","pool":"exam1","stem":"<p>William Harvey's major contribution was<\/p>","options":["the first heliocentric model","developing a smallpox vaccine","showing that blood circulates through the body pumped by the heart","the law of gases relating pressure and volume","the discovery of oxygen"],"why":["That was Copernicus.","Jenner developed it in 1796.","His 1628 work overturned Galen's theory of blood.","That is Boyle's law.","Oxygen was identified in the 1770s."],"answer":2},"u3q8":{"id":"u3q8","unit":3,"diff":"m","pool":"diag","stem":"<p>Which statement best contrasts Hobbes and Locke?<\/p>","options":["Both believed rebellion against a government is always justified","Hobbes supported the divine right of kings; Locke supported absolute monarchy","Hobbes thought people must surrender their rights to an absolute ruler; Locke thought government exists to protect natural rights and may be overthrown","Hobbes defended democracy; Locke defended dictatorship","Both rejected the idea of a social contract"],"why":["Hobbes denied any right of rebellion.","Hobbes used a social contract, not divine right, and Locke opposed absolutism.","This is the core difference between Leviathan and the Two Treatises.","Neither description fits.","Both built their theories on a social contract."],"answer":2},"u3q9":{"id":"u3q9","unit":3,"diff":"m","pool":"exam1","stem":"<p>Kepler's laws of planetary motion depended most on<\/p>","options":["Galileo's experiments with falling bodies","the precise observational data collected by Tycho Brahe","Church records of eclipses","Ptolemy's model of epicycles","Newton's law of universal gravitation"],"why":["Those concerned motion on Earth.","Kepler, Brahe's assistant, used his records of Mars to discover elliptical orbits.","Kepler's key source was Brahe's modern observations.","Kepler replaced epicycles.","Newton came after Kepler and explained his laws."],"answer":1},"u3q10":{"id":"u3q10","unit":3,"diff":"m","pool":"exam1","stem":"<p>Galileo's trial before the Inquisition in 1633 resulted from<\/p>","options":["his dissection of human corpses","his invention of calculus","his public defense of the Copernican system in the Dialogue Concerning the Two Chief World Systems","his support of the Protestant Reformation","his claim that the Earth was the center of the universe"],"why":["That was Vesalius's method in anatomy.","Calculus was developed later by Newton and Leibniz.","The Church saw the book as defying its 1616 order not to teach heliocentrism as fact.","Galileo remained a Catholic.","Galileo argued the opposite."],"answer":2},"u3q11":{"id":"u3q11","unit":3,"diff":"m","pool":"exam2","stem":"<p>John Locke's concept of the tabula rasa implied that<\/p>","options":["humans are born with knowledge of God and morality","reason is useless without revelation","kings rule by divine right","education and environment could improve human beings","social classes are fixed by birth"],"why":["Locke rejected innate ideas.","Locke valued reason and experience.","Tabula rasa is a theory of knowledge, not of kingship.","If people are shaped by experience, better institutions could make better people.","The idea undermined claims of inborn superiority."],"answer":3},"u3q12":{"id":"u3q12","unit":3,"diff":"m","pool":"exam2","stem":"<p>Which of the following pairs a thinker with the correct idea?<\/p>","options":["Hobbes: people have a right to overthrow unjust rulers","Bacon: the Earth is the center of the universe","Descartes: knowledge comes only from sense experience","Hugo Grotius: natural law governs relations between nations","Vesalius: planets move in ellipses"],"why":["That is Locke; Hobbes denied any such right.","Bacon did not defend geocentrism.","That is empiricism; Descartes was a rationalist.","Grotius's On the Law of War and Peace founded international law.","Vesalius was an anatomist; Kepler discovered ellipses."],"answer":3},"u3q13":{"id":"u3q13","unit":3,"diff":"m","pool":"exam2","stem":"<p>The founding of the Royal Society of London and the French Academy of Sciences in the 1660s shows that<\/p>","options":["science was considered a threat to every monarchy","women were admitted as full members of scientific bodies","the Catholic Church controlled scientific research in England","universities had become the main centers of scientific innovation","governments and elites had begun to sponsor and organize scientific research"],"why":["Monarchs such as Charles II and Louis XIV supported these bodies.","Women were excluded; Margaret Cavendish was only a visitor.","England was Protestant, and the Royal Society was independent of Rome.","Much innovation happened outside the conservative universities.","State-backed academies gave science institutional prestige and support."],"answer":4},"u3q14":{"id":"u3q14","unit":3,"diff":"m","pool":"quiz","stem":"<blockquote>\"The heavens are perfect and unchanging; the Earth, at the center, is the realm of change and decay.\"<\/blockquote><p>Which observation most directly challenged this view?<\/p>","options":["Locke's argument for a tabula rasa","Boyle's experiments with gases","Harvey's discovery of the circulation of the blood","Descartes's development of analytic geometry","Galileo's sighting of mountains and craters on the Moon"],"why":["This concerned human knowledge.","These concerned chemistry.","This concerned anatomy, not the heavens.","This was a mathematical tool, not an observation.","An uneven, Earth-like Moon showed that heavenly bodies were not perfect."],"answer":4},"u3q15":{"id":"u3q15","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which of the following best describes the \"clockmaker\" view of God that many drew from Newton's work?<\/p>","options":["God reveals scientific truths only through scripture","God designed the universe to run by natural laws and does not intervene in its operation","God punishes scientists who question the Church","God personally moves each planet every day","The universe has no creator"],"why":["Newtonian science relied on observation and mathematics.","This deist image follows from the Newtonian machine universe.","This is not what the metaphor means.","The clockmaker image implies a self-running machine.","The clockmaker image presupposes a designer."],"answer":1},"u3q16":{"id":"u3q16","unit":3,"diff":"m","pool":"exam1","stem":"<p>Vesalius's work in anatomy and Copernicus's work in astronomy, both published in 1543, had in common that they<\/p>","options":["were immediately accepted by all universities","were written to support the Protestant Reformation","relied on the telescope","challenged ancient authorities (Galen and Ptolemy) through new investigation","proved the law of universal gravitation"],"why":["Acceptance came slowly.","Neither was a religious tract.","The telescope was not used in astronomy until 1609.","Both books corrected classical authorities through direct study.","That was Newton in 1687."],"answer":3},"u3q17":{"id":"u3q17","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which work was written in part to justify the Glorious Revolution?<\/p>","options":["Newton's Principia","Hobbes's Leviathan","Bacon's Novum Organum","Descartes's Discourse on Method","Locke's Two Treatises of Government"],"why":["That is a work of physics.","Leviathan appeared in 1651 and defended strong sovereign power.","That was a 1620 treatise on scientific method.","That is a 1637 work of philosophy written in France.","Locke defended the replacement of James II as resistance to a ruler who violated the people's rights."],"answer":4},"u3q18":{"id":"u3q18","unit":3,"diff":"m","pool":"quiz","stem":"<p>Pierre Bayle's Historical and Critical Dictionary (1697) contributed to the new view of society by<\/p>","options":["applying skeptical criticism to religious and historical claims and urging toleration","proving the existence of witches","calling for a return to absolute monarchy","reviving Aristotle's physics","defending the persecution of religious minorities"],"why":["Bayle insisted no belief should be accepted without evidence.","Bayle's skepticism helped end belief in witchcraft.","His work was critical, not a political program for absolutism.","Bayle was a critic, not a defender, of old authorities.","Bayle, a Huguenot exile, argued for toleration."],"answer":0},"u3q19":{"id":"u3q19","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which development came LAST?<\/p>","options":["Publication of Copernicus's On the Revolutions","Galileo's trial before the Inquisition","Publication of Hobbes's Leviathan","Publication of Newton's Principia","Harvey's work on the circulation of the blood"],"why":["1543.","1633.","1651.","1687, the latest of these.","1628."],"answer":3},"u3q20":{"id":"u3q20","unit":3,"diff":"h","pool":"exam1","stem":"<p>A historian argues that the Scientific Revolution changed how educated Europeans decided what was true. Which change best supports this?<\/p>","options":["The Catholic Church immediately endorsed Galileo's work","Universities stopped teaching Latin","Most peasants accepted heliocentrism by 1700","Authority shifted from ancient texts and tradition to observation, experiment and mathematical proof","Scientists rejected all belief in God"],"why":["The Church condemned Galileo in 1633.","Latin remained the language of scholarship.","The new science spread mainly among elites.","This change of method, more than any single discovery, defines the revolution.","Most leading scientists, including Newton, were religious."],"answer":3},"u3q21":{"id":"u3q21","unit":3,"diff":"h","pool":"exam2","stem":"<p>Which of the following was a weakness of Copernicus's original model?<\/p>","options":["It relied on telescope observations that were later shown to be faulty","It denied the existence of the planets","It kept circular orbits, so it predicted planetary positions no better than Ptolemy's","It was based on Newton's flawed equations","It placed the Earth at the center of the universe"],"why":["Copernicus had no telescope.","It described the known planets orbiting the Sun.","Accuracy improved only when Kepler introduced ellipses.","Newton came more than a century later.","Copernicus placed the Sun at the center."],"answer":2},"u3q22":{"id":"u3q22","unit":3,"diff":"h","pool":"quiz","stem":"<p>Hobbes's political conclusions were most directly shaped by<\/p>","options":["the French Revolution","his experience as a minister of Louis XIV","the Glorious Revolution of 1688","the disorder of the English Civil War","the revocation of the Edict of Nantes"],"why":["The French Revolution came more than a century later.","Hobbes was English and never served Louis XIV.","Leviathan was published in 1651, decades earlier.","Having lived through civil war, he valued order above liberty.","That came in 1685, long after Leviathan."],"answer":3},"u3q23":{"id":"u3q23","unit":3,"diff":"h","pool":"exam2","stem":"<p>The combination of Bacon's and Descartes's approaches is significant because<\/p>","options":["modern scientific method joins experimental observation with mathematical reasoning","both men rejected experiment entirely","both men defended the authority of Aristotle","their ideas led directly to the revocation of the Edict of Nantes","Descartes's dualism proved that Bacon's induction was invalid"],"why":["Newton's work showed how experiment and mathematics together produce reliable laws.","Bacon championed experiment.","Both attacked reliance on Aristotle.","The revocation was a religious-political act by Louis XIV.","Neither method disproved the other."],"answer":0},"u3q24":{"id":"u3q24","unit":3,"diff":"h","pool":"quiz","stem":"<p>Which statement about women in the Scientific Revolution is most accurate?<\/p>","options":["Women were barred from all scientific activity by law","Women led the opposition to heliocentrism","Women held most of the seats in the Royal Society","Women founded the French Academy of Sciences","Some women contributed to science, but they were largely excluded from universities and academies"],"why":["No such law existed; women worked in households and family observatories.","There is no evidence of this.","Women were not admitted as fellows until 1945.","It was founded under Louis XIV's minister Colbert.","Maria Winkelmann was denied an academy post despite discovering a comet."],"answer":4},"u3q25":{"id":"u3q25","unit":3,"diff":"h","pool":"exam1","stem":"<p>Which development helped end the European witch hunts by around 1700?<\/p>","options":["Newton's personal campaign against witch trials","The Catholic Church's adoption of heliocentrism","Educated elites adopted a mechanistic, skeptical worldview that made magic seem implausible","The discovery of the circulation of the blood","The Treaty of Utrecht's ban on religious courts"],"why":["Newton led no such campaign.","The Church did not endorse heliocentrism in this period.","Judges and officials stopped accepting accusations as the new science spread.","Harvey's work did not address witchcraft.","Utrecht contained no such provision."],"answer":2},"u3q26":{"id":"u3q26","unit":3,"diff":"m","pool":"quiz","stem":"<p>A thinker who says the mind is like a blank sheet of paper and that all knowledge comes from experience is expressing<\/p>","options":["mercantilism, as in Colbert","divine-right theory, as in Bossuet","geocentrism, as in Ptolemy","empiricism, as in Locke's Essay Concerning Human Understanding","rationalism, as in Descartes's philosophy"],"why":["That is an economic doctrine.","That concerns monarchy, not knowledge.","That is a cosmology.","Locke's empiricism grounded all knowledge in experience.","Descartes believed in innate ideas known by reason."],"answer":3},"u4q1":{"id":"u4q1","unit":4,"diff":"e","pool":"exam2","stem":"<p>Which German Jewish philosopher argued that Jews could be full participants in European culture and loyal citizens?<\/p>","options":["Martin Luther","Immanuel Kant","Johann Gottfried Herder","Karl Marx","Moses Mendelssohn"],"why":["Luther was a sixteenth-century reformer.","Kant was a Prussian philosopher, not Jewish.","Herder wrote on national culture and language.","Marx was a nineteenth-century socialist.","Mendelssohn was a leading voice of the Jewish Enlightenment (Haskalah)."],"answer":4},"u4q2":{"id":"u4q2","unit":4,"diff":"e","pool":"exam1","stem":"<p>Most philosophes were best described as<\/p>","options":["defenders of the Catholic Church's political power","reformers who wanted rational, tolerant government, not necessarily democracy","supporters of the divine right of kings","revolutionaries who demanded immediate democracy everywhere","opponents of all scientific inquiry"],"why":["They generally attacked clerical power.","Many, like Voltaire, hoped for an enlightened monarch rather than popular rule.","They judged government by reason and utility.","Few philosophes before 1789 called for full democracy.","They were enthusiastic about science."],"answer":1},"u4q3":{"id":"u4q3","unit":4,"diff":"e","pool":"quiz","stem":"<p>Which Enlightenment thinker argued for the separation of powers into legislative, executive and judicial branc
