hes?<\/p>","options":["Montesquieu","Rousseau","Adam Smith","Beccaria","Voltaire"],"why":["The Spirit of the Laws (1748) made the separation of powers famous.","Rousseau stressed the general will and popular sovereignty.","Smith wrote on economics.","Beccaria wrote on criminal justice.","Voltaire is best known for toleration and satire."],"answer":0},"u4q4":{"id":"u4q4","unit":4,"diff":"e","pool":"exam1","stem":"<p>Adam Smith's The Wealth of Nations (1776) argued that<\/p>","options":["governments should hoard gold and silver through tariffs","colonies are the only true source of wealth","the state should set all prices and wages","workers should own the means of production","free markets guided by an \"invisible hand\" of competition promote prosperity"],"why":["That is mercantilism, which Smith criticized.","Smith saw labor and productivity as the sources of wealth.","Smith opposed such controls.","That is socialism, which came later.","Smith attacked mercantilist controls and favored laissez-faire."],"answer":4},"u4q5":{"id":"u4q5","unit":4,"diff":"e","pool":"quiz","stem":"<p>The opening line \"Man is born free, and everywhere he is in chains\" comes from<\/p>","options":["Hobbes's Leviathan","Marx's Communist Manifesto","Rousseau's The Social Contract","Locke's Two Treatises of Government","Voltaire's Candide"],"why":["Hobbes described life in the state of nature as \"nasty, brutish, and short.\"","The Manifesto ends \"Workers of the world, unite!\" and dates from 1848.","The 1762 work argued that legitimate government must express the general will.","Locke wrote about natural rights but not this line.","Candide is a satirical novel about optimism."],"answer":2},"u4q6":{"id":"u4q6","unit":4,"diff":"e","pool":"exam2","stem":"<p>Cesare Beccaria's On Crimes and Punishments (1764) called for<\/p>","options":["an end to torture and the death penalty","rule by the Catholic Inquisition","harsher punishments for religious dissenters","the restoration of trial by ordeal","the abolition of all prisons"],"why":["Beccaria argued punishments should prevent crime, not inflict cruelty.","Beccaria criticized arbitrary courts.","Beccaria opposed cruelty and arbitrariness.","Beccaria favored rational justice.","Beccaria favored proportionate punishment, not abolishing prisons."],"answer":0},"u4q7":{"id":"u4q7","unit":4,"diff":"e","pool":"quiz","stem":"<p>Who edited the Encyclopedia, a major summary of Enlightenment knowledge?<\/p>","options":["Catherine the Great","Isaac Newton","Adam Smith","Denis Diderot","Immanuel Kant"],"why":["Catherine was a patron of Diderot but not the editor.","Newton died in 1727 and was a scientist, not an encyclopedist.","Smith wrote The Wealth of Nations.","Diderot and d'Alembert led the project from 1751 to 1772.","Kant was a German philosopher."],"answer":3},"u4q8":{"id":"u4q8","unit":4,"diff":"e","pool":"exam1","stem":"<p>Which ruler was an \"enlightened despot\"?<\/p>","options":["Oliver Cromwell","Charles I of England","William III of England","Louis XIV of France","Frederick II of Prussia"],"why":["Cromwell ruled England in the 1650s, before the Enlightenment.","Charles was a divine-right Stuart king executed in 1649.","William was a constitutional monarch.","Louis XIV was an absolutist before the Enlightenment.","He corresponded with Voltaire, abolished torture and promoted toleration while keeping absolute power."],"answer":4},"u4q9":{"id":"u4q9","unit":4,"diff":"e","pool":"exam2","stem":"<p>Mary Wollstonecraft's A Vindication of the Rights of Woman argued that<\/p>","options":["women should be confined to domestic life","women's suffrage had already been achieved in Britain","women should receive the same education as men because they are equally capable of reason","women should rule as absolute monarchs","women should not be allowed to read novels"],"why":["That was Rousseau's view, which she attacked.","British women gained the vote only in 1918 and 1928.","She blamed women's apparent inferiority on lack of education.","She wrote about rights and education, not monarchy.","Her argument centered on education and reason."],"answer":2},"u4q10":{"id":"u4q10","unit":4,"diff":"m","pool":"exam1","stem":"<p>Joseph II of Austria's reforms differed from those of Frederick II and Catherine II in that Joseph<\/p>","options":["shared power with an elected parliament","strengthened the privileges of the nobility","abolished serfdom, though resistance led to most of his reforms being reversed","ignored Enlightenment ideas completely","refused to grant any religious toleration"],"why":["Joseph remained an absolute ruler.","That fits Catherine's Charter of the Nobility.","Joseph went further than other enlightened despots and paid for it.","He was the most enthusiastic reformer of the three.","His Edict of Toleration (1781) did the opposite."],"answer":2},"u4q11":{"id":"u4q11","unit":4,"diff":"m","pool":"quiz","stem":"<p>Catherine the Great's response to Pugachev's Rebellion (1773–1775) was to<\/p>","options":["ally more closely with the nobility, confirming their privileges in the Charter of the Nobility","emancipate the serfs to win their loyalty","abdicate in favor of her son","call an elected parliament with peasant representatives","adopt Rousseau's general will as Russia's constitution"],"why":["After the revolt she relied on nobles to keep order and expanded serfdom.","Serfdom expanded under Catherine; emancipation came in 1861.","She ruled until her death in 1796.","No such parliament was created.","Catherine never adopted a constitution."],"answer":0},"u4q12":{"id":"u4q12","unit":4,"diff":"m","pool":"exam1","stem":"<p>The partitions of Poland in 1772, 1793 and 1795 were carried out by<\/p>","options":["Russia, Prussia and Austria","Sweden and the Ottoman Empire","the Holy Roman Emperor and the pope","France, Britain and Spain","Napoleon and his allies"],"why":["All three took Polish land in 1772 and 1795; Russia and Prussia alone in 1793.","Neither took part.","The pope had no role.","Western powers did not partition Poland.","Napoleon later created the Duchy of Warsaw out of partitioned land."],"answer":0},"u4q13":{"id":"u4q13","unit":4,"diff":"m","pool":"exam1","stem":"<p>Most philosophes held which view of religion?<\/p>","options":["That religion should control government","Deism, the belief in a rational creator who does not intervene in the world","Strict Catholic orthodoxy","Puritan predestination","Polytheism based on classical gods"],"why":["Philosophes favored toleration and limits on clerical power.","Many, like Voltaire, rejected miracles and church authority but believed in a creator.","Philosophes criticized the Church's power.","Philosophes rejected harsh dogma.","This was not a significant Enlightenment position."],"answer":1},"u4q14":{"id":"u4q14","unit":4,"diff":"m","pool":"diag","stem":"<p>Which of the following institutions did the MOST to spread Enlightenment ideas among elite men and women in Paris?<\/p>","options":["The Jesuit order","Salons hosted by educated women","The royal army","The Estates-General","Guild workshops"],"why":["The Jesuits generally defended the Church against the philosophes.","Salons brought together writers, nobles and officials to discuss new ideas.","The army was not a vehicle for spreading ideas.","It did not meet between 1614 and 1789.","Guilds organized trades, not intellectual debate."],"answer":1},"u4q15":{"id":"u4q15","unit":4,"diff":"m","pool":"exam2","stem":"<blockquote>\"Political liberty is to be found only when there is no abuse of power. But constant experience shows us that every man invested with power is liable to abuse it... To prevent this abuse, it is necessary from the very nature of things that power should be a check to power.\"<\/blockquote><p>The author of this passage would most likely support<\/p>","options":["rule by the Catholic Church","an absolute monarch ruling by divine right","a single assembly with unlimited power","a constitution dividing authority among separate branches of government","abolishing all government"],"why":["The passage concerns dividing power, not clerical rule.","The passage warns against unchecked power.","That would concentrate power, not check it.","This is Montesquieu's argument for checks and balances.","The passage seeks to limit, not abolish, government."],"answer":3},"u4q16":{"id":"u4q16","unit":4,"diff":"m","pool":"exam2","stem":"<p>Voltaire's campaign on behalf of Jean Calas illustrates his commitment to<\/p>","options":["the partition of Poland","religious toleration and fair justice","the general will","the divine right of kings","mercantilist economics"],"why":["The Calas case had nothing to do with Poland.","Calas, a Protestant, was executed after a trial shaped by anti-Protestant prejudice.","That is Rousseau's concept.","Voltaire did not defend divine right.","The Calas case was about justice and religion."],"answer":1},"u4q17":{"id":"u4q17","unit":4,"diff":"m","pool":"exam2","stem":"<p>Which statement about Rousseau distinguishes him from most other philosophes?<\/p>","options":["He supported enlightened despotism","He believed private property was a natural right","He valued emotion and nature and was suspicious of civilization's effects, anticipating Romanticism","He was a devoted Catholic who defended the Church's power","He opposed all forms of education"],"why":["Rousseau favored popular sovereignty.","Rousseau saw property as a source of inequality.","Rousseau's emphasis on feeling and natural man set him apart.","Rousseau was not a defender of Church power.","Emile is a treatise on education."],"answer":2},"u4q18":{"id":"u4q18","unit":4,"diff":"m","pool":"diag","stem":"<p>The physiocrats differed from mercantilists in arguing that<\/p>","options":["the nobility should be abolished","colonies are the key to national power","manufacturing should be state-owned","land and agriculture, not gold and silver, are the true source of wealth","governments should regulate all trade"],"why":["The physiocrats were not social revolutionaries.","That is a mercantilist idea.","The physiocrats favored free markets.","Quesnay and the physiocrats also urged free trade in grain.","That is closer to mercantilism."],"answer":3},"u4q19":{"id":"u4q19","unit":4,"diff":"m","pool":"quiz","stem":"<p>The liberum veto contributed to the partitions of Poland because it<\/p>","options":["banned Poland from having an army","gave the Polish king absolute power","allowed any single noble to block legislation, leaving the state weak","forced the Polish nobility to free their serfs","required Poland to obey the Russian tsar"],"why":["There was no such ban, though the army was small.","Polish kings were elected and weak.","Poland could not raise taxes or armies to defend itself.","It had nothing to do with serfdom.","It was a rule of the Polish parliament itself."],"answer":2},"u4q20":{"id":"u4q20","unit":4,"diff":"m","pool":"exam1","stem":"<p>Frederick II of Prussia described himself as<\/p>","options":["\"Lord Protector\"","\"God's lieutenant on earth\"","\"the first servant of the state\"","\"the state, it is I\"","\"Emperor of the French\""],"why":["That was Cromwell's title.","That expresses Bossuet's divine-right theory.","He presented monarchy as a duty to serve the state, not a personal possession.","That line is attributed to Louis XIV.","That was Napoleon's title from 1804."],"answer":2},"u4q21":{"id":"u4q21","unit":4,"diff":"m","pool":"exam2","stem":"<p>Which work came FIRST?<\/p>","options":["Beccaria's On Crimes and Punishments","Rousseau's The Social Contract","Montesquieu's The Spirit of the Laws","Smith's The Wealth of Nations","Wollstonecraft's A Vindication of the Rights of Woman"],"why":["1764.","1762.","1748.","1776.","1792."],"answer":2},"u4q22":{"id":"u4q22","unit":4,"diff":"h","pool":"quiz","stem":"<p>Which development best illustrates the limits of enlightened despotism?<\/p>","options":["Joseph II granted toleration to Protestants","Catherine II expanded serfdom despite praising Enlightenment ideals","Frederick II abolished judicial torture","Diderot completed the Encyclopedia","Kant wrote \"What Is Enlightenment?\""],"why":["This was a genuine reform.","Rulers took reforms that strengthened the state but kept the social order that supported them.","This was a real Enlightenment reform, not a limit.","This was a philosophe's project, not a monarch's policy.","Kant's essay is not an act of government."],"answer":1},"u4q23":{"id":"u4q23","unit":4,"diff":"h","pool":"exam2","stem":"<p>Kant's motto \"Dare to know!\" (Sapere aude) best captures the Enlightenment's emphasis on<\/p>","options":["the collective will of the nation","the divine right of monarchs","the individual's courage to use reason independently of authority","obedience to established religious authority","emotion as the highest form of truth"],"why":["That is closer to Rousseau or later nationalism.","Kant's essay is about individual reason.","Kant defined enlightenment as leaving \"self-imposed immaturity.\"","Kant urged independence from guardians, including clergy.","That is a Romantic idea."],"answer":2},"u4q24":{"id":"u4q24","unit":4,"diff":"h","pool":"exam2","stem":"<p>An eighteenth-century reformer argues that a prisoner's guilt should be proven by evidence rather than a confession under torture, and that punishments should be certain but moderate. Which work most likely influenced him?<\/p>","options":["Smith's The Wealth of Nations","Hobbes's Leviathan","Rousseau's Emile","Beccaria's On Crimes and Punishments","Bossuet's Politics Drawn from Holy Scripture"],"why":["Smith wrote on economics.","Hobbes defended absolute sovereign power, not legal reform.","Emile concerns education.","These are Beccaria's key arguments.","Bossuet defended divine-right monarchy."],"answer":3},"u4q25":{"id":"u4q25","unit":4,"diff":"h","pool":"exam2","stem":"<p>Which outcome best shows Rousseau's general will being used to justify the suppression of individuals?<\/p>","options":["Revolutionary leaders claiming to embody the people's will while silencing opponents","Montesquieu's praise of the English constitution","Catherine II's Charter of the Nobility","Adam Smith's support for free trade","Joseph II's Edict of Toleration"],"why":["Robespierre and the Jacobins later invoked the general will to justify the Terror.","Montesquieu favored checks on power.","That was a grant of privilege to nobles, not an appeal to the general will.","That is unrelated to the general will.","That expanded individual freedom."],"answer":0},"u4q26":{"id":"u4q26","unit":4,"diff":"h","pool":"exam1","stem":"<p>Which statement best explains why the Enlightenment spread widely in the eighteenth century?<\/p>","options":["Growing literacy, cheaper printing and new public spaces created a reading public for new ideas","The partitions of Poland spread French culture eastward","The Catholic Church officially endorsed the philosophes","Governments everywhere abolished censorship","Most peasants attended universities"],"why":["The public sphere of print, coffeehouses and salons carried ideas beyond small elites.","The partitions were acts of power politics.","The Church condemned many of their works.","Censorship persisted, especially in France.","Universities served a small elite."],"answer":0},"u4q27":{"id":"u4q27","unit":4,"diff":"m","pool":"quiz","stem":"<p>Joseph II's Edict of Toleration (1781) granted<\/p>","options":["religious freedom to Protestants and Orthodox Christians in the Habsburg lands","the vote to all adult men","the Catholic Church control of all schools","noble exemption from all taxation","independence to Hungary"],"why":["It extended toleration beyond Catholicism.","There was no democratic suffrage.","Joseph reduced Church power.","Joseph tried to tax nobles more fairly.","Hungary remained under Habsburg rule."],"answer":0},"u4q28":{"id":"u4q28","unit":4,"diff":"h","pool":"exam1","stem":"<p>The partition of Poland most directly contradicts the claim that enlightened despots<\/p>","options":["read Enlightenment authors","strengthened their states","were interested in reform","were absolute rulers","governed by reason and justice rather than traditional power politics"],"why":["All three did.","The partitions did strengthen their states.","All three made genuine reforms at home.","They were absolute rulers.","Frederick, Catherine and Joseph seized a neighbor's land for gain."],"answer":4},"u4q29":{"id":"u4q29","unit":4,"diff":"e","pool":"diag","stem":"<p>The salon hostesses of eighteenth-century Paris, such as Madame Geoffrin, were important because they<\/p>","options":["controlled the Catholic Church in France","ran the royal treasury","organized gatherings where writers and elites discussed Enlightenment ideas","commanded French armies in the Seven Years' War","wrote the French constitution of 1791"],"why":["They had no Church authority.","They held no state office.","Salons were key meeting places of the Republic of Letters.","Women did not command armies.","The National Assembly wrote that constitution."],"answer":2},"u4q30":{"id":"u4q30","unit":4,"diff":"m","pool":"exam1","stem":"<p>Which pair correctly matches a thinker with a work?<\/p>","options":["Rousseau – The Wealth of Nations","Smith – The Spirit of the Laws","Montesquieu – The Social Contract","Voltaire – Candide","Beccaria – Emile"],"why":["Adam Smith wrote The Wealth of Nations.","Montesquieu wrote The Spirit of the Laws.","Rousseau wrote The Social Contract.","Candide (1759) satirizes the claim that this is \"the best of all possible worlds.\"","Rousseau wrote Emile."],"answer":3},"u4q31":{"id":"u4q31","unit":4,"diff":"h","pool":"quiz","stem":"<p>Which comparison of Locke and Rousseau is most accurate?<\/p>","options":["Both believed private property was the root of all inequality","Locke emphasized protecting individual rights, especially property; Rousseau emphasized the community's general will","Locke supported democracy by majority vote of all citizens; Rousseau supported absolute monarchy","Both wrote before the Glorious Revolution","Both rejected the idea of a social contract"],"why":["That was Rousseau's view, not Locke's.","Locke's liberalism centers on the individual; Rousseau's theory centers on collective sovereignty.","Rousseau favored popular sovereignty.","Rousseau wrote in the 1750s and 1760s.","Both built on a social contract."],"answer":1},"u4q32":{"id":"u4q32","unit":4,"diff":"m","pool":"quiz","stem":"<p>The Enlightenment idea that human institutions should be judged by reason and can be improved is closely linked to<\/p>","options":["the belief in progress","the revival of medieval guilds","the defense of judicial torture","the doctrine of original sin as unchangeable","the divine right of kings"],"why":["Philosophes believed reason could steadily improve society.","Philosophes generally criticized guild restrictions.","Philosophes attacked torture.","Philosophes downplayed original sin.","Divine right placed kingship beyond rational criticism."],"answer":0},"u4q33":{"id":"u4q33","unit":4,"diff":"e","pool":"quiz","stem":"<p>Voltaire's satirical novel Candide (1759) mocked<\/p>","options":["the Scientific Revolution","free-market economics","the partition of Poland","the naive optimism that \"all is for the best in the best of all possible worlds\"","the separation of powers"],"why":["Voltaire popularized Newton's science.","Candide is not about economics.","Candide predates the partitions.","Candide's misfortunes ridicule this philosophy, associated with Leibniz.","Voltaire did not attack Montesquieu's idea."],"answer":3},"u4q34":{"id":"u4q34","unit":4,"diff":"m","pool":"quiz","stem":"<p>Which ruler's reforms were most resisted by nobles, clergy and non-German peoples, leading to their reversal?<\/p>","options":["Frederick II of Prussia","Joseph II of Austria","George III of Britain","Louis XV of France","Catherine II of Russia"],"why":["Frederick avoided challenging the Junkers.","His centralizing and anti-clerical reforms provoked revolts in Hungary and the Austrian Netherlands.","George III was a constitutional monarch.","Louis XV was not a major reformer.","Catherine accommodated the nobility."],"answer":1},"u4q35":{"id":"u4q35","unit":4,"diff":"h","pool":"quiz","stem":"<p>Which development MOST directly reflects the influence of Montesquieu?<\/p>","options":["The Jacobin Reign of Terror","The U.S. Constitution's three branches with checks and balances","Adam Smith's critique of mercantilism","The partitions of Poland","Catherine II's Charter of the Nobility"],"why":["The Terror concentrated power rather than dividing it.","The framers cited Montesquieu more than any other modern author.","That is economics, not constitutional design.","These were acts of conquest.","That confirmed noble privilege."],"answer":1},"u5q1":{"id":"u5q1","unit":5,"diff":"e","pool":"exam1","stem":"<p>The immediate cause of Louis XVI's decision to call the Estates-General in 1789 was<\/p>","options":["Napoleon's coup d'état","the pope's demand for church reform","the execution of Marie Antoinette","the royal government's financial crisis","a British invasion of France"],"why":["Napoleon's coup came in 1799.","The papacy did not ask for the Estates-General.","She was executed in 1793.","Debt and the privileged orders' refusal of new taxes forced the king to summon the Estates-General.","Britain did not invade France in 1789."],"answer":3},"u5q2":{"id":"u5q2","unit":5,"diff":"e","pool":"quiz","stem":"<p>On June 20, 1789, members of the Third Estate swore the Tennis Court Oath, vowing to<\/p>","options":["elect Napoleon as First Consul","remain together until they had written a constitution for France","restore Louis XVI to absolute power","declare war on Austria","execute the king"],"why":["Napoleon took power in 1799.","Locked out of their hall, the deputies of the new National Assembly met on a tennis court.","They were limiting royal power.","War came in April 1792.","The king was executed in 1793."],"answer":1},"u5q3":{"id":"u5q3","unit":5,"diff":"e","pool":"diag","stem":"<p>The Declaration of the Rights of Man and of the Citizen (1789) proclaimed that<\/p>","options":["the Catholic Church is the only legal religion","nobles are exempt from taxes","men are born and remain free and equal in rights","women have equal political rights with men","the king rules by divine right"],"why":["It protected freedom of opinion, including religious opinion.","It required taxes to be shared according to means.","The Declaration set out natural rights and equality before the law.","Its failure to include women prompted Olympe de Gouges's response.","It placed sovereignty in the nation."],"answer":2},"u5q4":{"id":"u5q4","unit":5,"diff":"e","pool":"exam2","stem":"<p>The Reign of Terror is most closely associated with<\/p>","options":["Louis XVIII and the Bourbon Restoration","Napoleon and the Directory","Metternich and the Congress of Vienna","Lafayette and the National Guard","Robespierre and the Committee of Public Safety"],"why":["The Restoration came in 1814.","Napoleon overthrew the Directory in 1799, years after the Terror.","Metternich opposed revolution.","Lafayette was a moderate who fled France in 1792.","The Committee ran the Terror from 1793 to 1794."],"answer":4},"u5q5":{"id":"u5q5","unit":5,"diff":"e","pool":"exam2","stem":"<p>Napoleon's Civil Code (1804) did which of the following?<\/p>","options":["Gave women equal rights with men","Abolished private property","Restored the privileges of the nobility","Made Catholicism compulsory","Established equality of male citizens before the law and protected property rights"],"why":["It made wives legally subordinate to husbands.","It strongly protected property.","It confirmed the abolition of feudal privilege.","It upheld religious freedom.","The Code preserved key liberal gains of the Revolution."],"answer":4},"u5q6":{"id":"u5q6","unit":5,"diff":"e","pool":"exam2","stem":"<p>Which battle in 1805 ended Napoleon's hopes of invading Britain?<\/p>","options":["Trafalgar","Austerlitz","Leipzig","Valmy","Waterloo"],"why":["Nelson's destruction of the Franco-Spanish fleet gave Britain command of the seas.","Austerlitz was a French land victory over Austria and Russia.","Leipzig (1813) was a land battle in Germany.","Valmy (1792) stopped a Prussian invasion of France.","Waterloo (1815) was Napoleon's final defeat on land."],"answer":0},"u5q7":{"id":"u5q7","unit":5,"diff":"e","pool":"exam1","stem":"<p>Napoleon's final defeat came at the Battle of<\/p>","options":["Borodino in 1812","Jena in 1806","Austerlitz in 1805","Trafalgar in 1805","Waterloo in 1815"],"why":["Borodino was a costly French victory before he entered Moscow.","Jena was his victory over Prussia.","Austerlitz was one of his greatest victories.","Trafalgar was a naval defeat, not his final one.","Wellington and Blücher defeated him during the Hundred Days."],"answer":4},"u5q8":{"id":"u5q8","unit":5,"diff":"e","pool":"quiz","stem":"<p>The principal architect of the Congress of Vienna was<\/p>","options":["Napoleon Bonaparte","Camillo di Cavour","Otto von Bismarck of Prussia","Maximilien Robespierre","Klemens von Metternich of Austria"],"why":["Napoleon was the defeated enemy.","Cavour unified Italy in the 1850s and 1860s.","Bismarck led Prussia in the 1860s.","Robespierre died in 1794.","Metternich hosted the Congress and shaped its conservative settlement."],"answer":4},"u5q9":{"id":"u5q9","unit":5,"diff":"e","pool":"quiz","stem":"<p>The Continental System was Napoleon's attempt to<\/p>","options":["free the serfs of Russia","unite all German states under Prussia","establish a common European parliament","restore the Holy Roman Empire","defeat Britain economically by closing European ports to British trade"],"why":["Russian serfdom lasted until 1861.","Napoleon weakened Prussia.","No such parliament existed.","He abolished it in 1806.","The Berlin Decree of 1806 launched the blockade."],"answer":4},"u5q10":{"id":"u5q10","unit":5,"diff":"e","pool":"exam1","stem":"<p>Who led the slave revolution in Saint-Domingue that led to the independence of Haiti?<\/p>","options":["Toussaint Louverture","Horatio Nelson","Simón Bolívar","Georges Danton","Olympe de Gouges"],"why":["He led the revolt and its armies until his capture in 1802; Haiti won independence in 1804.","Nelson was a British admiral.","Bolívar led independence movements in South America.","Danton was a Paris revolutionary leader.","De Gouges was a French writer on women's rights."],"answer":0},"u5q11":{"id":"u5q11","unit":5,"diff":"e","pool":"quiz","stem":"<p>Which group made up about 97 percent of France's population before 1789?<\/p>","options":["The First Estate","The sans-culottes alone","The émigrés","The Third Estate","The Second Estate"],"why":["The clergy was under 1 percent.","The sans-culottes were Parisian workers, only part of the Third Estate.","Émigrés were nobles who fled after 1789.","It included peasants, urban workers and the bourgeoisie.","The nobility was about 2 percent."],"answer":3},"u5q12":{"id":"u5q12","unit":5,"diff":"e","pool":"exam1","stem":"<p>The storming of the Bastille on July 14, 1789, is significant because it<\/p>","options":["showed that the Paris crowd would use force to defend the National Assembly","restored the king's absolute power","began the war with Austria","ended the Reign of Terror","brought Napoleon to power"],"why":["Popular violence saved the Assembly from royal troops and made revolution irreversible.","It weakened royal power.","War came in 1792.","The Terror ended in 1794.","Napoleon took power in 1799."],"answer":0},"u5q13":{"id":"u5q13","unit":5,"diff":"e","pool":"diag","stem":"<p>The Concordat of 1801 was an agreement between Napoleon and<\/p>","options":["the British government","the Directory","Pope Pius VII","Tsar Alexander I","the Jacobin Club"],"why":["Peace with Britain was the Treaty of Amiens (1802).","Napoleon overthrew the Directory.","It restored the Catholic Church in France under state supervision.","Napoleon's treaty with Alexander was Tilsit (1807).","The Jacobin Club was closed in 1794."],"answer":2},"u5q14":{"id":"u5q14","unit":5,"diff":"e","pool":"exam2","stem":"<p>The Congress of Vienna created the German Confederation, which was<\/p>","options":["a loose union of 39 states under Austrian leadership","a French puppet state","part of the Russian Empire","a republic with a national parliament","a unified German empire ruled by Prussia"],"why":["It replaced Napoleon's Confederation of the Rhine and the old Holy Roman Empire.","It was designed to contain France.","It was dominated by Austria.","It had only a diet of state representatives.","German unification under Prussia came in 1871."],"answer":0},"u5q15":{"id":"u5q15","unit":5,"diff":"m","pool":"quiz","stem":"<p>Why did the voting method in the Estates-General become a crisis in 1789?<\/p>","options":["The clergy refused to attend","The king insisted that only nobles could vote","The Third Estate wanted to vote by order to protect peasants","Voting by order let the two privileged estates outvote the Third Estate, which demanded voting by head","The Estates-General voted to abolish itself"],"why":["The clergy attended; many parish priests later joined the Third.","All three estates had deputies.","The Third Estate wanted voting by head.","The Third Estate had as many deputies as the other two combined but would lose 2 to 1 by order.","The Third Estate instead declared itself the National Assembly."],"answer":3},"u5q16":{"id":"u5q16","unit":5,"diff":"m","pool":"exam2","stem":"<p>The Civil Constitution of the Clergy (1790) was significant because it<\/p>","options":["ended the Revolution's conflict with the Church","made Protestantism the official religion of France","divided Catholics and turned many devout French people against the Revolution","restored the Church lands seized in 1789","was welcomed by the pope as a fair compromise"],"why":["It intensified that conflict.","It reorganized the Catholic Church.","Requiring an oath split the clergy and fueled counter-revolution, notably in the Vendée.","The lands stayed nationalized.","Pope Pius VI condemned it."],"answer":2},"u5q17":{"id":"u5q17","unit":5,"diff":"m","pool":"exam2","stem":"<p>Which event came FIRST?<\/p>","options":["The levée en masse","The execution of Louis XVI","The declaration of war on Austria","The Flight to Varennes","The October Days march on Versailles"],"why":["August 1793.","January 1793.","April 1792.","June 1791.","October 1789."],"answer":4},"u5q18":{"id":"u5q18","unit":5,"diff":"m","pool":"exam2","stem":"<p>The levée en masse of 1793 was significant because it<\/p>","options":["mobilized the entire nation for war, creating a mass citizen army","returned confiscated lands to the Church","ended the war with Austria and Prussia","abolished the French army","gave women the right to vote"],"why":["It marked the start of modern total war.","It concerned military mobilization.","The war continued.","It vastly expanded the army.","Women did not gain the vote in France until 1944."],"answer":0},"u5q19":{"id":"u5q19","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which statement best describes the Directory (1795–1799)?<\/p>","options":["An absolute monarchy restored under Louis XVIII","A conservative republic run by property owners that was weak, corrupt and dependent on the army","A radical dictatorship that executed thousands","A military government led by Robespierre","A democratic government elected by all adults"],"why":["The Bourbons returned only in 1814.","Its instability made Napoleon's coup possible.","That describes the Terror.","Robespierre had been executed in 1794.","Voting was limited to property owners."],"answer":1},"u5q20":{"id":"u5q20","unit":5,"diff":"m","pool":"exam2","stem":"<p>Which group was most likely to support the Jacobins in 1793?<\/p>","options":["The Paris sans-culottes","Refractory priests","Émigré nobles","Austrian diplomats","Peasants of the Vendée"],"why":["Working-class Parisians backed radical measures like price controls.","Priests who refused the oath opposed the Revolution.","Émigrés sought to overthrow the Revolution.","Austria was at war with the Republic.","The Vendée rose in royalist, Catholic revolt."],"answer":0},"u5q21":{"id":"u5q21","unit":5,"diff":"m","pool":"diag","stem":"<p>Napoleon's use of plebiscites to approve his rise to power illustrates<\/p>","options":["his use of democratic forms to legitimize authoritarian rule","his restoration of the Estates-General","his dependence on the pope","his alliance with the Jacobins","his commitment to parliamentary government"],"why":["Voters approved his constitutions, but real power stayed with him.","He never restored it.","Plebiscites appealed to the people, not the Church.","He suppressed Jacobins.","He reduced legislatures to rubber stamps."],"answer":0},"u5q22":{"id":"u5q22","unit":5,"diff":"m","pool":"quiz","stem":"<blockquote>\"If the basis of popular government in time of peace is virtue, its basis in time of revolution is both virtue and terror: virtue, without which terror is murderous; terror, without which virtue is powerless.\"<\/blockquote><p>The speaker was most likely<\/p>","options":["Edmund Burke, attacking the French Revolution","Napoleon Bonaparte, explaining the Civil Code","Maximilien Robespierre, justifying the Reign of Terror","Metternich, defending the Concert of Europe","Louis XVI, addressing the Estates-General"],"why":["Burke condemned the Revolution's violence.","Napoleon did not speak of terror and virtue this way.","Robespierre gave this argument in February 1794.","Metternich opposed revolutionary terror.","The king did not justify revolutionary terror."],"answer":2},"u5q23":{"id":"u5q23","unit":5,"diff":"m","pool":"diag","stem":"<p>Which of the following was a major cause of Napoleon's downfall?<\/p>","options":["The disastrous invasion of Russia in 1812","His refusal to fight in Spain","His defeat at Austerlitz","The success of the Continental System in ruining Britain","His alliance with Britain after 1807"],"why":["He lost most of his Grand Army, encouraging a new coalition.","He invaded Spain in 1808.","Austerlitz was a great victory.","The system failed and alienated Europe.","Britain remained his enemy."],"answer":0},"u5q24":{"id":"u5q24","unit":5,"diff":"m","pool":"exam2","stem":"<p>The Peninsular War (1808–1814) is significant because it<\/p>","options":["led to Napoleon's coronation as emperor","ended with France annexing Portugal permanently","showed how nationalist guerrilla resistance could drain Napoleon's armies","was fought between Prussia and Russia","caused the abolition of the Holy Roman Empire"],"why":["He was crowned in 1804.","The French were driven out.","Spanish guerrillas and Wellington's army tied down hundreds of thousands of French troops.","It was fought in Spain and Portugal.","That was in 1806, before the war."],"answer":2},"u5q25":{"id":"u5q25","unit":5,"diff":"m","pool":"quiz","stem":"<p>The Congress of Vienna's decision to strengthen the Netherlands, Prussia and Piedmont-Sardinia was intended to<\/p>","options":["give them overseas colonies","punish them for supporting Napoleon","reward them for revolutionary reforms","prepare them to unify Italy and Germany","contain France by surrounding it with stronger buffer states"],"why":["Britain, not these states, made colonial gains.","They were strengthened, not punished.","The Congress opposed revolution.","Unification was not a goal; the Congress opposed nationalism.","These states guarded France's northern and eastern borders."],"answer":4},"u5q26":{"id":"u5q26","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which principle guided the Congress of Vienna's restoration of the Bourbons to the French throne?<\/p>","options":["Collective security","Popular sovereignty","Legitimacy","Laissez-faire","National self-determination"],"why":["That concept belongs to the League of Nations.","The Congress rejected popular sovereignty.","The Congress restored \"legitimate\" pre-revolutionary dynasties.","That is an economic doctrine.","That principle shaped the 1919 settlement."],"answer":2},"u5q27":{"id":"u5q27","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which statement about women in the French Revolution is most accurate?<\/p>","options":["The Napoleonic Code made women legally equal to men","Women took part in key events but were denied political rights, and their clubs were banned in 1793","Women won the right to vote in the Constitution of 1791","Olympe de Gouges became a leader of the Directory","Women led the Committee of Public Safety"],"why":["The Code subordinated wives to husbands.","Women marched in the October Days, yet the Convention closed women's political clubs.","Only male \"active citizens\" voted.","She was executed in 1793.","All its members were men."],"answer":1},"u5q28":{"id":"u5q28","unit":5,"diff":"m","pool":"exam2","stem":"<p>After the Thermidorian Reaction of 1794, the Convention<\/p>","options":["declared war on Russia","abolished private property","restored Louis XVI to the throne","crowned Napoleon emperor","ended the Terror and dismantled radical measures such as price controls"],"why":["France invaded Russia in 1812.","The Thermidorians protected property owners.","Louis XVI had already been executed in 1793.","That happened in 1804.","Thermidor closed the Jacobin Club and lifted the Maximum."],"answer":4},"u5q29":{"id":"u5q29","unit":5,"diff":"m","pool":"exam1","stem":"<p>The Battle of Austerlitz (1805) was significant because Napoleon<\/p>","options":["lost his navy to the British","was forced into exile on Elba","defeated the Prussian army","captured Moscow","defeated the combined armies of Austria and Russia"],"why":["That was Trafalgar.","That followed his 1814 abdication.","Prussia was defeated at Jena (1806).","He entered Moscow in 1812.","The \"Battle of the Three Emperors\" led Austria to make peace and paved the way to dissolving the Holy Roman Empire."],"answer":4},"u5q30":{"id":"u5q30","unit":5,"diff":"m","pool":"exam1","stem":"<p>The Declaration of Pillnitz (1791) increased tension because Austria and Prussia<\/p>","options":["promised to abolish serfdom","declared war on Britain","recognized the French Republic","suggested they would act to restore Louis XVI's authority","agreed to partition France"],"why":["The declaration concerned France.","Neither did so.","France was not a republic until 1792.","French revolutionaries took it as a threat, contributing to war in 1792.","There was no such agreement."],"answer":3},"u5q31":{"id":"u5q31","unit":5,"diff":"m","pool":"exam2","stem":"<p>Which reform of the National Assembly (1789–1791) reflected liberal economic ideas?<\/p>","options":["The dechristianization campaign","The Maximum on bread prices","The levée en masse","The abolition of guilds and internal tolls","The Continental System"],"why":["That was a radical cultural program of 1793–94.","Price controls were a radical Jacobin measure of 1793.","That was a military measure.","Removing these barriers fostered a free market in labor and goods.","That was Napoleon's blockade."],"answer":3},"u5q32":{"id":"u5q32","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which settlement made by the Congress of Vienna proved a long-term source of nationalist resentment?<\/p>","options":["The creation of a Concert of Europe","Austrian control of Lombardy-Venetia in Italy","The restoration of the Bourbons in France","Britain's acquisition of the Cape Colony","The return of the pope to Rome"],"why":["The Concert was a diplomatic practice, not a territorial grievance.","Italian nationalists later fought to expel Austria.","The French overthrew Charles X in 1830, but this was not a nationalist grievance.","This did not provoke European nationalism.","Not mainly a nationalist grievance in 1815."],"answer":1},"u5q33":{"id":"u5q33","unit":5,"diff":"h","pool":"exam2","stem":"<p>A historian argues that the French Revolution began as a \"revolt of the nobility.\" Which evidence best supports this?<\/p>","options":["The sans-culottes demanded price controls","The parlements and the Assembly of Notables blocked royal tax reforms and demanded the Estates-General","The Third Estate declared itself the National Assembly","Parisian women marched to Versailles","Peasants burned manor records during the Great Fear"],"why":["That was a working-class demand.","Privileged groups' resistance in 1787–88 forced the crisis that opened the door to revolution.","That was a bourgeois-led act.","That was a popular action.","That was a peasant revolt against lords."],"answer":1},"u5q34":{"id":"u5q34","unit":5,"diff":"h","pool":"quiz","stem":"<p>Which of the following was a long-term consequence of Napoleon's conquests in Europe?<\/p>","options":["The permanent restoration of feudal privileges in Germany","Russia's adoption of the Napoleonic Code","The spread of legal equality and the growth of nationalism among conquered peoples","The revival of the Holy Roman Empire","A unified Italian state in 1815"],"why":["Feudal dues were weakened, not restored, in many areas.","Russia did not adopt it.","The Code spread reforms, while occupation provoked national resistance.","It was never revived.","Italy remained divided until 1861."],"answer":2},"u5q35":{"id":"u5q35","unit":5,"diff":"h","pool":"exam2","stem":"<p>Which statement best compares the American and French Revolutions?<\/p>","options":["Both began as a result of foreign invasion","Both were opposed by Enlightenment thinkers","Both abolished slavery immediately","Both ended with a military emperor","Both drew on Enlightenment ideas of natural rights, but the French Revolution also attacked an entrenched aristocracy and established church"],"why":["Neither began with an invasion.","Both drew on Enlightenment thought.","The United States kept slavery until 1865; France abolished it in 1794 but Napoleon restored it.","Only France produced Napoleon.","The French Revolution was more socially radical."],"answer":4},"u5q36":{"id":"u5q36","unit":5,"diff":"h","pool":"quiz","stem":"<p>The Napoleonic Code is best described as both revolutionary and conservative because it<\/p>","options":["was written by Robespierre and enforced by Louis XVIII","preserved legal equality and property rights while strengthening the authority of fathers and husbands","abolished religion but restored nobility","restored the monarchy but kept the Terror's courts","gave workers the right to strike while abolishing property"],"why":["Napoleon's jurists wrote it in 1804.","It kept the Revolution's civil equality but rolled back gains for women.","It protected religious freedom and did not restore feudal privilege.","It did neither.","It restricted workers and protected property."],"answer":1},"u5q37":{"id":"u5q37","unit":5,"diff":"h","pool":"exam1","stem":"<p>Which development most directly allowed the French Republic to survive the military crisis of 1793?<\/p>","options":["The mobilization of mass citizen armies under the Committee of Public Safety","The restoration of Louis XVI","Austria's decision to remain neutral","An alliance with Britain","Napoleon's victory at Austerlitz"],"why":["Conscription, centralized control and wartime production turned the tide by 1794.","Louis XVI had been executed.","Austria was France's main enemy.","Britain was at war with France.","Austerlitz came in 1805."],"answer":0},"u5q38":{"id":"u5q38","unit":5,"diff":"h","pool":"quiz","stem":"<p>A peasant in the Vendée in 1793 would most likely have opposed the Revolution because of<\/p>","options":["the abolition of feudal dues","the restoration of the monarchy","the Concordat of 1801","the attack on the Catholic Church and military conscription","the Congress of Vienna"],"why":["Peasants welcomed that.","The monarchy had just been abolished.","The Concordat came years later and reconciled Catholics.","Religious grievances and the 1793 draft sparked the Vendée rising.","That came in 1814–15."],"answer":3},"u5q39":{"id":"u5q39","unit":5,"diff":"h","pool":"exam1","stem":"<p>Which of the following best explains why the Congress of Vienna treated defeated France leniently?<\/p>","options":["Because France had won the war","To avoid creating a vengeful France and to keep the restored Bourbons stable","Because Britain wanted France to dominate Europe","Because Napoleon remained on the throne","Because Metternich wished to spread revolutionary ideas"],"why":["France was defeated.","A moderate peace supported the balance of power.","Britain wanted a balance of power.","Napoleon was exiled.","Metternich opposed revolution."],"answer":1},"u5q40":{"id":"u5q40","unit":5,"diff":"h","pool":"exam2","stem":"<p>The Haitian Revolution differed from the French Revolution in that it<\/p>","options":["was inspired by opposition to Enlightenment ideas","restored an absolute monarchy under Louis XVIII","was supported by Napoleon throughout","ended with the creation of a French colony","was led by formerly enslaved people and created an independent state that abolished slavery permanently"],"why":["Its leaders invoked the rights of man.","Haiti broke away from France.","Napoleon tried to crush it and restore slavery.","It ended French rule.","Haiti became the first state founded by people who had freed themselves from slavery."],"answer":4},"u5q41":{"id":"u5q41","unit":5,"diff":"m","pool":"exam1","stem":"<p>The Great Fear of 1789 refers to<\/p>","options":["the Terror of 1793–1794","peasant revolts and panic in the countryside, with attacks on manor houses and records of dues","the fear of a British invasion in 1805","the panic after the Russian campaign of 1812","the royal family's fear during the October Days"],"why":["That came four years later.","Rumors of aristocratic plots led peasants to attack the symbols of seigneurialism.","That is unrelated to 1789.","That came much later.","The October Days were a separate Paris event."],"answer":1},"u5q42":{"id":"u5q42","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which of these was a goal of the Concert of Europe?<\/p>","options":["Uniting Germany under Prussia","Supporting Napoleon's return in 1815","Maintaining the 1815 settlement by cooperation among the great powers","Spreading republican government across Europe","Ending all monarchies in Europe"],"why":["The Concert supported the German Confederation.","The allies defeated him at Waterloo.","The powers met periodically to suppress threats to order.","The Concert opposed revolution.","The Concert defended monarchy."],"answer":2},"u5q43":{"id":"u5q43","unit":5,"diff":"h","pool":"exam1","stem":"<p>Which of the following was the MOST radical measure of the National Convention, 1792–1794?<\/p>","options":["Creating the departments","Adopting the Declaration of the Rights of Man","Issuing assignats backed by Church lands","Establishing the Bank of France","Abolishing the monarchy, executing the king, and attempting to dechristianize France"],"why":["That was a reform of 1790.","That was the National Assembly's work in 1789.","That began in 1789–90.","That was Napoleon's work in 1800.","These went far beyond the moderate reforms of 1789–91."],"answer":4},"u5q44":{"id":"u5q44","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which event marks the formal end of the Holy Roman Empire?<\/p>","options":["The unification of Germany in 1871","The Peace of Westphalia in 1648","The Treaty of Utrecht in 1713","Napoleon's reorganization of Germany in 1806","The Congress of Vienna in 1815"],"why":["The Empire had been gone for 65 years by then.","Westphalia weakened but did not end the Empire.","Utrecht did not end the Empire.","After Austerlitz, the emperor dissolved the Empire and Napoleon created the Confederation of the Rhine.","Vienna did not revive the Empire; it created the German Confederation."],"answer":3},"u5q45":{"id":"u5q45","unit":5,"diff":"m","pool":"quiz","stem":"<p>Edmund Burke's Reflections on the Revolution in France (1790) argued that<\/p>","options":["the Revolution should spread to Britain as soon as possible","the Third Estate was \"everything\"","laissez-faire economics required revolution","Louis XVI should be executed for treason","destroying long-standing institutions in the name of abstract rights would lead to chaos and tyranny"],"why":["Burke opposed the Revolution.","That was Sieyès's claim.","Burke's book is about political tradition, not economics.","Burke defended the monarchy.","Burke defended gradual change rooted in tradition; he is the founder of modern conservatism."],"answer":4},"u5q46":{"id":"u5q46","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which work was written to DEFEND the French Revolution against Burke's criticism?<\/p>","options":["Thomas Paine's The Rights of Man","Napoleon's Civil Code","Metternich's memoirs","Bossuet's Politics Drawn from Holy Scripture","Joseph de Maistre's Considerations on France"],"why":["Paine defended popular sovereignty and natural rights in 1791.","The Code is a law code, not a reply to Burke.","Metternich was a conservative opponent of revolution.","Bossuet defended absolute monarchy a century earlier.","De Maistre was a fierce conservative critic."],"answer":0},"u5q47":{"id":"u5q47","unit":5,"diff":"m","pool":"exam1","stem":"<p>The Treaty of Tilsit (1807) is significant because it<\/p>","options":["restored the Bourbons","ended the Peninsular War","marked Napoleon's peace with Russia and the height of his power on the continent","created the German Confederation","forced Napoleon into exile on Elba"],"why":["The Bourbons returned in 1814.","The Peninsular War began in 1808.","Alexander I joined the Continental System, and Prussia lost half its territory.","That was created in 1815.","That followed his 1814 abdication."],"answer":2},"u6q1":{"id":"u6q1","unit":6,"diff":"e","pool":"quiz","stem":"<p>The Industrial Revolution began in which country?<\/p>","options":["Italy","Spain","Great Britain","Russia","France"],"why":["Italy industrialized late, mainly in the north.","Spain industrialized late and unevenly.","Britain's coal, capital, markets and stable government made it the first industrial nation.","Russia industrialized late in the nineteenth century.","France industrialized later, slowed by revolution and war."],"answer":2},"u6q2":{"id":"u6q2","unit":6,"diff":"e","pool":"exam1","stem":"<p>James Watt is best known for<\/p>","options":["greatly improving the efficiency of the steam engine","inventing the spinning jenny","writing The Wealth of Nations","leading the Chartist movement","building the first railway locomotive to win the Rainhill trials"],"why":["His separate condenser and rotary motion made steam power practical for factories.","That was James Hargreaves.","That was Adam Smith.","Chartism was a working-class movement of the 1830s and 1840s.","That was George Stephenson's Rocket."],"answer":0},"u6q3":{"id":"u6q3","unit":6,"diff":"e","pool":"exam2","stem":"<p>The first industry to be transformed by factory production in Britain was<\/p>","options":["chemical dyes","cotton textiles","shipbuilding","automobile manufacturing","electrical goods"],"why":["Synthetic dyes came in the mid-1800s, led by Germany.","Spinning and weaving machines created the first factories.","Shipbuilding mechanized later.","Automobiles came in the late 1800s.","Electricity came in the late 1800s."],"answer":1},"u6q4":{"id":"u6q4","unit":6,"diff":"e","pool":"diag","stem":"<p>The Luddites were<\/p>","options":["workers who destroyed textile machinery they blamed for taking their jobs","landowners who supported the Corn Laws","socialist followers of Karl Marx","middle-class reformers who campaigned for free trade","engineers who promoted railways"],"why":["The Luddite riots took place in 1811–1816.","Landowners were not Luddites.","Marx wrote later, in the 1840s.","That describes the Anti-Corn Law League.","Luddites opposed machines."],"answer":0},"u6q5":{"id":"u6q5","unit":6,"diff":"e","pool":"quiz","stem":"<p>Which law gave the vote to many middle-class men in Britain?<\/p>","options":["The Poor Law Amendment Act of 1834","The Factory Act of 1833","The Combination Acts","The Reform Act of 1832","The Corn Laws of 1815"],"why":["That created the workhouse system.","That regulated child labor.","Those banned trade unions.","It redistributed seats to industrial towns and enfranchised middle-class property holders.","Those were tariffs on grain."],"answer":3},"u6q6":{"id":"u6q6","unit":6,"diff":"e","pool":"exam2","stem":"<p>The People's Charter of 1838 demanded<\/p>","options":["a return to the putting-out system","votes for women","the abolition of the monarchy","universal male suffrage and a secret ballot","higher tariffs on grain"],"why":["Chartists sought political rights.","The Charter called for manhood suffrage only.","The Charter sought parliamentary reform, not a republic.","These were two of the Chartists' six points.","Chartists generally opposed the Corn Laws."],"answer":3},"u6q7":{"id":"u6q7","unit":6,"diff":"e","pool":"exam1","stem":"<p>Enclosure in eighteenth-century Britain involved<\/p>","options":["banning the import of foreign grain","creating collective farms run by the state","forcing peasants to live in walled cities","closing factories to protect artisans","consolidating open fields and common lands into private, fenced farms"],"why":["That was the Corn Laws.","That describes Soviet collectivization in the 1930s.","Enclosure concerned land, not urban walls.","Enclosure was agricultural.","Enclosure raised productivity but displaced many small farmers."],"answer":4},"u6q8":{"id":"u6q8","unit":6,"diff":"e","pool":"exam1","stem":"<p>Which city became the symbol of the cotton industry and was nicknamed \"Cottonopolis\"?<\/p>","options":["Vienna","Rome","Paris","Edinburgh","Manchester"],"why":["Vienna was not a major industrial city in this era.","Rome was not industrial.","Paris was not a cotton-manufacturing center.","Edinburgh was a financial and intellectual center.","Manchester's mills made it the center of the cotton industry."],"answer":4},"u6q9":{"id":"u6q9","unit":6,"diff":"e","pool":"quiz","stem":"<p>Which economist argued that population grows faster than the food supply?<\/p>","options":["Thomas Malthus","Karl Marx","Adam Smith","John Stuart Mill","Friedrich List"],"why":["His Essay on the Principle of Population (1798) predicted persistent poverty.","Marx blamed capitalism, not population, for poverty.","Smith wrote about free markets and the division of labor.","Mill was a liberal philosopher of the mid-1800s.","List argued for protective tariffs."],"answer":0},"u6q10":{"id":"u6q10","unit":6,"diff":"e","pool":"exam2","stem":"<p>The Factory Act of 1833 is significant because it<\/p>","options":["abolished factories in British cities","gave factory workers the vote","legalized trade unions","repealed the Corn Laws","limited child labor in textile mills and created government inspectors"],"why":["Factories kept growing.","Workers did not gain the vote until 1867 and after.","Unions were legalized by repeal of the Combination Acts in 1824.","That happened in 1846.","It was the first effective factory regulation."],"answer":4},"u6q11":{"id":"u6q11","unit":6,"diff":"m","pool":"exam1","stem":"<p>Which of the following best explains why Britain industrialized first?<\/p>","options":["It had the largest population in Europe","It had abolished private property","It had no overseas colonies to distract it","It combined coal and iron deposits, capital from trade, a large market and a stable, pro-business government","Its government owned and ran all factories"],"why":["France and Russia had larger populations.","Secure property rights encouraged investment.","Britain had a large empire that supplied markets and raw materials.","No single factor explains it; the combination mattered.","British industry was privately owned."],"answer":3},"u6q12":{"id":"u6q12","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which sequence of inventions is in the correct chronological order?<\/p>","options":["Flying shuttle, spinning jenny, power loom","Power loom, flying shuttle, spinning jenny","Spinning jenny, flying shuttle, power loom","Flying shuttle, power loom, spinning jenny","Power loom, spinning jenny, flying shuttle"],"why":["1733, c. 1765, 1785.","The power loom came last, in 1785.","The flying shuttle (1733) came before the jenny.","The jenny came before the power loom.","This reverses the order."],"answer":0},"u6q13":{"id":"u6q13","unit":6,"diff":"m","pool":"exam2","stem":"<p>The agricultural revolution contributed to industrialization chiefly by<\/p>","options":["ending the need for coal","reducing the population of Britain","restoring feudal obligations","producing more food with fewer workers, freeing labor and supporting population growth","increasing the number of small family farms"],"why":["Coal demand grew.","Population grew rapidly.","Feudal obligations were long gone in England.","Surplus food and labor fed the growing factory towns.","Enclosure reduced small farms."],"answer":3},"u6q14":{"id":"u6q14","unit":6,"diff":"m","pool":"exam1","stem":"<p>The Great Reform Act of 1832 is best described as<\/p>","options":["a revolutionary law granting universal suffrage","a measure to restore royal power over Parliament","the law that created the workhouse system","a moderate reform that brought the middle class into politics while excluding workers","the law that legalized trade unions"],"why":["Only about one in five adult men in England could vote.","It strengthened the House of Commons.","That was the Poor Law of 1834.","It removed rotten boroughs and widened the franchise to middle-class property owners.","That was the repeal of the Combination Acts in 1824."],"answer":3},"u6q15":{"id":"u6q15","unit":6,"diff":"m","pool":"exam2","stem":"<p>The repeal of the Corn Laws in 1846 represented a victory for<\/p>","options":["Chartists over Parliament","mercantilists over classical economists","industrialists and advocates of free trade over landowners","landed aristocrats over manufacturers","Irish nationalists over British rule"],"why":["Chartist petitions were rejected.","Repeal was a free-trade, anti-mercantilist measure.","Cheaper grain helped manufacturers and workers; landowners lost protection.","The Corn Laws had protected landowners.","Repeal was a British economic policy, though the Irish famine helped prompt it."],"answer":2},"u6q16":{"id":"u6q16","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which of the following was a common feature of early factory work?<\/p>","options":["Work done at home with family members","Worker ownership of the machines","Strict time discipline with long hours and fines for lateness","High wages for child workers to attract them","An eight-hour working day guaranteed by law"],"why":["That was the putting-out system.","Owners controlled the machinery.","Factories ran on the clock and bell.","Children were hired because they were cheap.","The eight-hour day came much later."],"answer":2},"u6q17":{"id":"u6q17","unit":6,"diff":"m","pool":"exam1","stem":"<p>Friedrich Engels's The Condition of the Working Class in England (1845) described<\/p>","options":["the agricultural revolution in Norfolk","the overcrowded, unhealthy living and working conditions of industrial Manchester","the campaign to repeal the Corn Laws","the luxurious lives of factory workers","the success of the Chartists in winning the vote"],"why":["His subject was industrial cities.","Engels drew on what he saw in his family's mill town.","That was not his focus.","Engels described misery.","The Chartists did not win in his lifetime."],"answer":1},"u6q18":{"id":"u6q18","unit":6,"diff":"m","pool":"exam2","stem":"<p>Abraham Darby's use of coke to smelt iron was important because<\/p>","options":["it mechanized cotton spinning","it made iron too expensive for railways","it ended Britain's need for coal","it freed iron production from dependence on scarce charcoal","it created the first steam locomotive"],"why":["That was the work of Hargreaves, Arkwright and Crompton.","Cheaper iron made railways possible.","Coke is made from coal.","Coal-based coke allowed iron output to expand enormously.","Locomotives came a century later."],"answer":3},"u6q19":{"id":"u6q19","unit":6,"diff":"m","pool":"exam2","stem":"<p>The Peterloo Massacre (1819) occurred when<\/p>","options":["Luddites burned factories in Yorkshire","strikers seized the Bank of England","the French army defeated the British at Waterloo","Chartists stormed Parliament in 1848","cavalry attacked a peaceful crowd demanding parliamentary reform in Manchester"],"why":["Luddite actions were different events.","No such event occurred.","Wellington defeated Napoleon at Waterloo in 1815.","The 1848 Chartist rally was peaceful.","About fifteen people were killed; it became a symbol of repression."],"answer":4},"u6q20":{"id":"u6q20","unit":6,"diff":"m","pool":"diag","stem":"<p>The Poor Law Amendment Act of 1834 reflected the belief that<\/p>","options":["relief should be made harsh so that the able-bodied poor would prefer to work","poverty was caused mainly by low wages set by employers","the state should guarantee a minimum income for all","the Church should take over all poor relief","workers should own the factories"],"why":["Workhouses were deliberately unpleasant to discourage dependence.","The act blamed idleness rather than wages.","The act was designed to cut relief costs.","Relief was organized by local boards of guardians.","That is a socialist idea."],"answer":0},"u6q21":{"id":"u6q21","unit":6,"diff":"m","pool":"exam2","stem":"<p>Which statement about Chartism is most accurate?<\/p>","options":["It was organized mainly by landowners","It succeeded immediately in winning universal male suffrage in 1838","It was a middle-class movement for free trade","It failed in the short run, but most of its demands later became law","It sought the overthrow of capitalism by armed revolution"],"why":["Its base was the working class.","Universal male suffrage came in 1918.","That was the Anti-Corn Law League.","Petitions were rejected in 1839, 1842 and 1848, yet by 1918 all points except annual parliaments were enacted.","Most Chartists sought political reform."],"answer":3},"u6q22":{"id":"u6q22","unit":6,"diff":"m","pool":"exam1","stem":"<p>On the continent, the Zollverein (1834) contributed to German industrialization by<\/p>","options":["building Germany's first steam engines","uniting Germany politically under Austria","imposing tariffs on goods traded between German states","removing tariffs among most German states and creating a larger market","abolishing serfdom in Prussia"],"why":["Steam engines were imported from Britain earlier.","Austria was excluded.","It removed them.","The Prussian-led customs union promoted trade and economic unity.","Prussian serfdom was abolished in reforms beginning in 1807."],"answer":3},"u6q23":{"id":"u6q23","unit":6,"diff":"m","pool":"quiz","stem":"<p>\"Separate spheres\" refers to the middle-class ideal that<\/p>","options":["church and state should be separated","workers and owners should live in separate parts of town","agriculture and industry should be taxed separately","Britain and its colonies should have separate economies","men belonged in the public world of work and politics and women in the home"],"why":["That is a different principle.","The term refers to gender roles.","The term has nothing to do with taxation.","The term refers to gender roles.","This ideology shaped nineteenth-century gender roles."],"answer":4},"u6q24":{"id":"u6q24","unit":6,"diff":"m","pool":"exam1","stem":"<blockquote>\"In Manchester... the cottages are old, dirty, and of the smallest sort, the streets uneven, fallen into ruts and in part without drains or pavement; masses of refuse, offal and sickening filth lie among standing pools in all directions.\"<\/blockquote><p>This description is most useful as evidence of<\/p>","options":["conditions on enclosed farms","the effects of the Continental System","middle-class life in London","the effects of rapid, unplanned urbanization on industrial workers","the success of the Factory Act of 1833"],"why":["The passage describes a city.","The passage concerns urban conditions.","It describes working-class districts in Manchester.","It describes housing and sanitation in an industrial city.","The passage does not concern factory regulation."],"answer":3},"u6q25":{"id":"u6q25","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which group was the core of the Anti-Corn Law League?<\/p>","options":["Catholic clergy","Luddite machine-breakers","Aristocratic landowners","Prussian Junkers","Middle-class manufacturers and merchants who wanted free trade"],"why":["The League was a secular economic campaign.","The League worked through petitions and Parliament.","They benefited from the Corn Laws.","The League was British.","Cobden and Bright led businessmen who wanted cheaper food and wider markets."],"answer":4},"u6q26":{"id":"u6q26","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which change resulted from Richard Arkwright's water frame?<\/p>","options":["Coal mining was banned","The putting-out system expanded","Spinning moved from homes to large water-powered mills","Weaving was mechanized for the first time","Steam locomotives replaced canals"],"why":["Mining expanded.","Factory spinning undercut cottage spinning.","The water frame was too large for cottages and needed river power.","The water frame spun thread; Cartwright's power loom mechanized weaving.","That came with the railways after 1830."],"answer":2},"u6q27":{"id":"u6q27","unit":6,"diff":"h","pool":"exam2","stem":"<p>Which development MOST directly resulted from the high cost of transporting coal before 1830?<\/p>","options":["The decline of the cotton industry","The building of canals and then railways","The Great Reform Act","The Luddite movement","The repeal of the Corn Laws"],"why":["Cotton grew.","Moving bulky coal cheaply drove the canal age and the first railways.","That concerned representation.","Luddites protested machines.","That concerned grain tariffs."],"answer":1},"u6q28":{"id":"u6q28","unit":6,"diff":"h","pool":"quiz","stem":"<p>A historian argues that the early Industrial Revolution lowered living standards for many workers before raising them. Which evidence would best support this?<\/p>","options":["Data showing stagnant real wages and rising urban death rates before the 1840s, followed by rising real wages afterward","The growth of Britain's total GDP after 1780","The passage of the Reform Act of 1832","The founding of the Bank of England in 1694","The invention of the spinning jenny in the 1760s"],"why":["This is the \"pessimist\" position in the standard-of-living debate.","Total output can rise while workers' wages lag.","That concerns voting rights.","That predates industrialization.","An invention does not show workers' living standards."],"answer":0},"u6q29":{"id":"u6q29","unit":6,"diff":"h","pool":"exam2","stem":"<p>Continental European industrialization differed from British industrialization mainly in that<\/p>","options":["governments played a larger role through tariffs, banks and state-built railways","it was led by the textile industry in Russia","it rejected railways in favor of canals","it relied entirely on water power","it began earlier than in Britain"],"why":["Latecomers used the state to catch up with Britain.","Russia industrialized late.","Railways were central on the continent.","Continental industry used steam and coal.","It came later."],"answer":0},"u6q30":{"id":"u6q30","unit":6,"diff":"h","pool":"exam1","stem":"<p>David Ricardo's \"iron law of wages\" was used to argue that<\/p>","options":["workers should seize factories in a revolution","efforts to raise workers' wages through regulation would fail in the long run","governments should set a minimum wage","women should be paid the same as men","landowners should give land to peasants"],"why":["Marx drew revolutionary conclusions; Ricardo did not.","If wages tend to subsistence, intervention seemed pointless to classical economists.","Ricardo's theory argued against such intervention.","Ricardo's law was not about gender pay.","Ricardo did not propose land redistribution."],"answer":1},"u6q31":{"id":"u6q31","unit":6,"diff":"h","pool":"quiz","stem":"<p>Which statement best explains why Britain avoided revolution in 1848 when much of Europe did not?<\/p>","options":["The British army had been disbanded after Waterloo","Britain had no industrial working class","Earlier reforms (1832, factory acts, Corn Law repeal) had given the middle class a stake in the system and eased some grievances","Britain had already become a republic","Chartism had already achieved universal suffrage"],"why":["Britain kept an army.","It had Europe's largest industrial working class.","Gradual reform defused pressure, and the Chartists' 1848 rally ended peacefully.","Britain remained a monarchy.","Universal male suffrage came in 1918."],"answer":2},"u6q32":{"id":"u6q32","unit":6,"diff":"h","pool":"quiz","stem":"<p>Which statement about child labor in early British factories is most accurate?<\/p>","options":["Parliament abolished all child labor in 1802","Child labor was invented by the factory system","Children were paid more than adult men","Children were banned from factories from the start of industrialization","Children were employed because they were cheap and nimble, and legislation limited their work only gradually"],"why":["The 1802 act applied only to pauper apprentices and was poorly enforced.","Children had always worked on farms and in cottage industry.","Children were paid much less.","Children worked in mills from the beginning.","The 1833 Factory Act and later laws restricted child labor step by step."],"answer":4},"u6q33":{"id":"u6q33","unit":6,"diff":"m","pool":"quiz","stem":"<p>The Mines Act of 1842 prohibited<\/p>","options":["trade unions among miners","the export of coal to the continent","the use of steam engines in mines","all coal mining in Britain","women and girls, and boys under 10, from working underground in mines"],"why":["Unions were legal after 1824.","The act concerned labor.","Steam engines were essential for pumping.","Mining expanded.","Reports on mine conditions shocked the public and led to the law."],"answer":4},"u6q34":{"id":"u6q34","unit":6,"diff":"h","pool":"exam1","stem":"<p>Which pairing correctly links a cause to its consequence in British industrialization?<\/p>","options":["The Peterloo Massacre → the abolition of the monarchy","The Chartist petitions → universal male suffrage in 1848","The repeal of the Corn Laws → the invention of the spinning jenny","The Factory Act of 1833 → the start of child labor","Watt's efficient steam engine → factories no longer had to be built beside rivers"],"why":["Britain remained a monarchy.","Parliament rejected the petitions.","The jenny came about eighty years before repeal.","The act limited child labor.","Steam power let factories concentrate in coal towns and cities."],"answer":4},"u7q1":{"id":"u7q1","unit":7,"diff":"e","pool":"quiz","stem":"<p>Which ideology most strongly emphasized tradition, monarchy and an established church?<\/p>","options":["Socialism","Anarchism","Utilitarianism","Conservatism","Liberalism"],"why":["Socialists attacked private property and inequality.","Anarchists rejected all state authority.","Utilitarians judged institutions by usefulness, not tradition.","Conservatives like Burke and Metternich defended the old order.","Liberals sought constitutions and individual rights."],"answer":3},"u7q2":{"id":"u7q2","unit":7,"diff":"e","pool":"exam1","stem":"<p>The Communist Manifesto (1848) argued that<\/p>","options":["history is the history of class struggles and the proletariat will overthrow the bourgeoisie","workers and owners share the same interests","society should return to medieval guilds","monarchy is the best form of government","private property is a sacred natural right"],"why":["Marx and Engels predicted a workers' revolution.","Marx saw their interests as opposed.","Marx looked forward, not backward.","The Manifesto is revolutionary and anti-monarchical.","Marx called for abolishing bourgeois property."],"answer":0},"u7q3":{"id":"u7q3","unit":7,"diff":"e","pool":"diag","stem":"<p>Romanticism emphasized<\/p>","options":["realistic depiction of urban poverty","the benefits of factory life","strict reason and mathematical order","emotion, imagination and nature","obedience to the Concert of Europe"],"why":["That characterizes later Realism.","Romantics often criticized industrialization.","That characterizes the Enlightenment and classicism.","Romantics reacted against Enlightenment rationalism.","Romanticism was a cultural movement, often linked to nationalism."],"answer":3},"u7q4":{"id":"u7q4","unit":7,"diff":"e","pool":"exam1","stem":"<p>Giuseppe Mazzini is best known for<\/p>","options":["founding Young Italy to work for a united, democratic Italy","writing The Communist Manifesto","serving as Austria's foreign minister","leading the Decembrist Revolt","painting Liberty Leading the People"],"why":["Mazzini was the prophet of Italian nationalism.","That was Marx and Engels.","That was Metternich.","That took place in Russia in 1825.","That was Delacroix."],"answer":0},"u7q5":{"id":"u7q5","unit":7,"diff":"e","pool":"exam1","stem":"<p>The July Revolution of 1830 in France replaced Charles X with<\/p>","options":["Napoleon Bonaparte","Louis XVIII","Napoleon III","Louis XVI","Louis-Philippe"],"why":["Napoleon died in exile in 1821.","Louis XVIII ruled 1814–1824.","Louis Napoleon became president in 1848 and emperor in 1852.","Louis XVI was executed in 1793.","The \"citizen king\" ruled until 1848."],"answer":4},"u7q6":{"id":"u7q6","unit":7,"diff":"e","pool":"quiz","stem":"<p>Which of the following won its independence from the Ottoman Empire in the 1820s with help from Britain, France and Russia?<\/p>","options":["Poland","Italy","Greece","Belgium","Hungary"],"why":["Poland was under Russian rule, and its 1830 revolt failed.","Italy was not united until 1861 and was not under the Ottomans.","Navarino (1827) and Russian pressure secured Greek independence.","Belgium broke away from the Netherlands in 1830.","Hungary was part of the Austrian Empire."],"answer":2},"u7q7":{"id":"u7q7","unit":7,"diff":"e","pool":"exam2","stem":"<p>The Carlsbad Decrees (1819) were designed to<\/p>","options":["unify Germany under Prussia","create a customs union","abolish serfdom in Austria","grant constitutions to all German states","suppress liberal and nationalist activity in German universities and the press"],"why":["They aimed to prevent nationalist agitation.","That was the Zollverein (1834).","Serfdom was abolished in 1848.","They restricted liberal movements.","Metternich used them to censor and dissolve student societies."],"answer":4},"u7q8":{"id":"u7q8","unit":7,"diff":"e","pool":"quiz","stem":"<p>Which utopian socialist built a model industrial community at New Lanark, Scotland?<\/p>","options":["Karl Marx","Robert Owen","Lord Byron","Edmund Burke","Jeremy Bentham"],"why":["Marx rejected utopian experiments.","Owen provided schools, housing and shorter hours for his mill workers.","Byron was a Romantic poet.","Burke was a conservative.","Bentham was a utilitarian philosopher."],"answer":1},"u7q9":{"id":"u7q9","unit":7,"diff":"e","pool":"exam2","stem":"<p>The Frankfurt Parliament of 1848–1849 attempted to<\/p>","options":["restore Napoleon's Confederation of the Rhine","abolish the Prussian army","partition Poland","unify Germany under a liberal constitution","elect Metternich as German emperor"],"why":["It sought a new national state.","It had no power over the army.","It did not concern Poland's partition.","It offered the crown to Frederick William IV, who refused.","Metternich had fled Vienna."],"answer":3},"u7q10":{"id":"u7q10","unit":7,"diff":"m","pool":"exam1","stem":"<p>Most liberals in the early nineteenth century supported<\/p>","options":["state ownership of industry","constitutional government with voting limited to property owners","the abolition of all government","universal suffrage for men and women","absolute monarchy by divine right"],"why":["That is socialist.","Liberals feared democracy as well as absolutism.","That is anarchist.","Most liberals opposed even universal male suffrage.","That is conservative or absolutist."],"answer":1},"u7q11":{"id":"u7q11","unit":7,"diff":"m","pool":"exam1","stem":"<blockquote>\"A nation is a community of people united by a common language, history and spirit; every such people has the right to govern itself in its own state.\"<\/blockquote><p>This statement best expresses the ideology of<\/p>","options":["nationalism","utilitarianism","utopian socialism","conservatism, as defended by Metternich","laissez-faire liberalism"],"why":["It defines the nation by culture and claims a right to statehood.","Utilitarianism judges by the greatest happiness, not by nationhood.","Socialists focused on class, not nation.","Metternich opposed nationalism as a threat to the Austrian Empire.","This statement concerns national self-rule, not markets."],"answer":0},"u7q12":{"id":"u7q12","unit":7,"diff":"m","pool":"exam1","stem":"<p>Why was Metternich especially hostile to nationalism?<\/p>","options":["Austria wanted to unite Italy under its rule","Austria was a nation-state with one language","It threatened to break apart the multinational Austrian Empire","Nationalism was a conservative ideology","Nationalism required the restoration of the Holy Roman Empire"],"why":["Austria opposed Italian unification.","Austria was the opposite.","Austria ruled Germans, Hungarians, Czechs, Poles, Italians and others.","In 1815 nationalism was revolutionary.","Nationalists sought new nation-states."],"answer":2},"u7q13":{"id":"u7q13","unit":7,"diff":"m","pool":"exam2","stem":"<p>Utopian socialists differed from Marx in that they<\/p>","options":["hoped to reform society by example and persuasion rather than through class revolution","denied that workers suffered under industrialization","were all government officials","wanted to restore absolute monarchy","supported laissez-faire capitalism"],"why":["Owen and Fourier built model communities; Marx predicted revolution.","They were responding to workers' suffering.","Most were private reformers and writers.","They sought social reform.","They criticized capitalist competition."],"answer":0},"u7q14":{"id":"u7q14","unit":7,"diff":"m","pool":"quiz","stem":"<p>The revolutions of 1848 failed mainly because<\/p>","options":["liberals, radicals and rival nationalities divided while royal armies stayed loyal","the revolutionaries had won universal suffrage everywhere","no revolutions broke out outside France","Marx ordered the workers to stop fighting","Britain sent armies to restore the monarchs"],"why":["Divisions let monarchs regain control in 1848–49.","They had not.","Revolution spread across central Europe and Italy.","Marx had no such authority.","Britain did not intervene; Russia did in Hungary."],"answer":0},"u7q15":{"id":"u7q15","unit":7,"diff":"m","pool":"diag","stem":"<p>Which was a lasting result of the 1848 revolutions in the Austrian Empire?<\/p>","options":["The unification of Germany under Austria","Hungarian independence","Metternich's permanent return to power","The creation of a democratic republic","The abolition of serfdom"],"why":["Germany was unified in 1871 without Austria.","Hungary was crushed in 1849, with Russian help.","Metternich never regained office.","The Habsburg monarchy survived under Franz Joseph.","The emancipation of 1848 was not reversed."],"answer":4},"u7q16":{"id":"u7q16","unit":7,"diff":"m","pool":"exam2","stem":"<p>The June Days of
