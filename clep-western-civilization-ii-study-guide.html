<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Western Civ II Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: archive ledger. Fixed index rail on the left (desktop) / drawer (phone),
   one reading column at ~68ch. Prussian blue (first synthetic pigment, Berlin 1706)
   is the accent; gilt marks the "must know" material. System fonts only: works offline. */
:root {
  --paper: #f4f5f1;
  --surface: #ffffff;
  --sunk: #eceee8;
  --ink: #18212b;
  --muted: #5a6470;
  --line: #d8dcd6;
  --accent: #1d4e7c;
  --accent-ink: #ffffff;
  --accent-soft: #e2eaf3;
  --gilt: #8a5f0f;
  --gilt-soft: #f5ecd8;
  --good: #23704a;
  --good-soft: #e1f1e7;
  --warn: #8a5a00;
  --warn-soft: #fbefd4;
  --bad: #ad2a22;
  --bad-soft: #f8e3e1;
  --focus: #2f7bd0;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --step--1: 0.85rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d25; --sunk: #1c242e; --ink: #e4e8ec; --muted: #9aa5b1;
    --line: #2a3542; --accent: #8db8e3; --accent-ink: #0f141a; --accent-soft: #1b2c3e;
    --gilt: #d9b166; --gilt-soft: #2a2416; --good: #74c99a; --good-soft: #15291f;
    --warn: #e0b45a; --warn-soft: #2b2312; --bad: #f08c84; --bad-soft: #2f1a19; --focus: #8db8e3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #161d25; --sunk: #1c242e; --ink: #e4e8ec; --muted: #9aa5b1;
  --line: #2a3542; --accent: #8db8e3; --accent-ink: #0f141a; --accent-soft: #1b2c3e;
  --gilt: #d9b166; --gilt-soft: #2a2416; --good: #74c99a; --good-soft: #15291f;
  --warn: #e0b45a; --warn-soft: #2b2312; --bad: #f08c84; --bad-soft: #2f1a19; --focus: #8db8e3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans);
  font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.2; text-wrap: balance; margin: 0; font-weight: 600; }
h1 { font-size: var(--step-3); }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Shell */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--line); padding: 20px 14px 32px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; text-decoration: none; color: var(--ink); }
.brand-eyebrow { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.brand-name { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; }
.brand-span { font-family: var(--serif); color: var(--accent); font-size: 0.95rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 10px 8px 4px; }
.nav a {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius);
  color: var(--ink); text-decoration: none; font-size: 0.93rem;
}
.nav a:hover { background: var(--sunk); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .u-no { font-family: var(--serif); color: var(--muted); width: 1.6em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.nav .u-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line); }
.dot.prog { background: var(--warn); }
.dot.done { background: var(--good); }
.rail-foot { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; padding: 0 8px; }

.topbar { display: none; }
main {
  min-width: 0; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.col.wide { max-width: 1000px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); height: auto;
    transform: translateX(-102%); transition: transform 0.2s ease;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px));
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.25);
  }
  .rail.open { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, 0.35); }
  .topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .topbar .brand-name { font-size: 1.05rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { padding-block: 18px 72px; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

/* Common pieces */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: var(--radius);
  cursor: pointer; text-decoration: none; font-size: 0.95rem; line-height: 1.3;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 0.85rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; justify-content: space-between; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.tight { padding: 14px; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 0.78rem;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: var(--surface);
}
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.unverified { background: var(--warn-soft); color: var(--warn); border-color: transparent; font-weight: 600; }
.muted { color: var(--muted); }
.url { overflow-wrap: anywhere; }
.small { font-size: 0.88rem; }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; min-width: 60px; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > span { background: var(--good); }
.bar.warn > span { background: var(--warn); }
.bar.bad > span { background: var(--bad); }
.tablewrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: 0.92rem; }
.notice.info { background: var(--accent-soft); }
.notice.bad { background: var(--bad-soft); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--serif); font-size: 1.7rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.85rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; }
input[type="number"], input[type="date"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; max-width: 100%;
}
textarea { width: 100%; min-height: 120px; font-family: var(--mono); font-size: 0.8rem; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: var(--radius); font-size: 0.92rem; max-width: 90vw;
}

/* Home */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); }
.hero h1 .dates { color: var(--accent); }
.next { border-left: 4px solid var(--accent); }
.meter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.meter > div { height: 10px; border-radius: 3px; background: var(--sunk); }
.meter > div.on { background: var(--good); }
.meter > div.part { background: var(--warn); }
.ready-badge { font-family: var(--serif); font-size: 1.25rem; font-weight: 600; }
.ready-badge.yes { color: var(--good); }
.unit-table td:first-child { font-family: var(--serif); color: var(--muted); width: 2em; }
.unit-table a { color: var(--ink); text-decoration: none; }
.unit-table a:hover { color: var(--accent); text-decoration: underline; }

/* Lesson */
.unit-head { display: flex; flex-direction: column; gap: 8px; }
.unit-head .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lesson { font-size: 1.04rem; display: flex; flex-direction: column; gap: 14px; max-width: 68ch; }
.lesson h3 { margin-top: 12px; font-size: 1.3rem; }
.lesson strong { font-weight: 650; }
.chain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.chain-step { padding: 10px 12px; font-size: 0.93rem; position: relative; min-width: 0; }
.chain-step + .chain-step { border-left: 1px solid var(--line); }
.chain-step + .chain-step::before {
  content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; margin-top: -6px;
  background: var(--surface); border-top: 1px solid var(--line); border-right: 1px solid var(--line); transform: rotate(45deg);
}
.chain-label { display: block; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
@media (max-width: 560px) {
  .chain { grid-template-columns: minmax(0, 1fr); }
  .chain-step + .chain-step { border-left: 0; border-top: 1px solid var(--line); }
  .chain-step + .chain-step::before { left: 50%; top: -7px; margin: 0 0 0 -6px; transform: rotate(135deg); }
}
.mustknow { background: var(--gilt-soft); border: 1px solid transparent; border-radius: var(--radius); padding: 16px 18px; }
.mustknow h3 { color: var(--gilt); font-size: 1.1rem; margin-bottom: 8px; }
.mustknow ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 4.6em; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.timeline li { display: grid; grid-template-columns: 4em 1.2em minmax(0, 1fr); gap: 8px; padding: 6px 0; align-items: start; }
.timeline .yr { font-family: var(--serif); font-weight: 600; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.timeline .pin { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); margin-top: 6px; justify-self: center; position: relative; z-index: 1; }
.timeline li.key .pin { background: var(--accent); }
.timeline .ev b { font-weight: 600; }
.timeline .ev span { display: block; color: var(--muted); font-size: 0.9rem; }
.lesson-actions { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.lesson-actions .panel { box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12); flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; }

/* Question runner */
.runner { display: flex; flex-direction: column; gap: 16px; }
.runner-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.timer { font-family: var(--mono); font-size: 1.1rem; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: var(--radius); background: var(--sunk); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.stem { font-size: 1.08rem; display: flex; flex-direction: column; gap: 10px; }
.stem blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--gilt); background: var(--gilt-soft); font-family: var(--serif); font-size: 1rem; border-radius: 0 var(--radius) var(--radius) 0; }
.qtable { font-size: 0.92rem; background: var(--surface); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; width: 100%;
  padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); cursor: pointer; line-height: 1.45;
}
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .k {
  display: inline-flex; width: 1.8em; height: 1.8em; align-items: center; justify-content: center; border-radius: 50%;
  border: 1px solid var(--line); font-weight: 600; font-size: 0.85rem; color: var(--muted);
}
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: var(--surface); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.why { display: flex; flex-direction: column; gap: 8px; font-size: 0.93rem; }
.why li { list-style: none; display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 6px; }
.why ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.why .mk { font-weight: 700; }
.why .mk.ok { color: var(--good); }
.why .mk.no { color: var(--bad); }
.verdict { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
.qgrid button {
  height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; cursor: pointer;
  font-size: 0.78rem; font-variant-numeric: tabular-nums; position: relative;
}
.qgrid button.ans { background: var(--accent-soft); border-color: var(--accent-soft); }
.qgrid button.cur { outline: 2px solid var(--accent); outline-offset: -2px; }
.qgrid button.flag::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--gilt); }
.kbd { font-family: var(--mono); font-size: 0.78rem; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); }
.review-item { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
details > summary { cursor: pointer; }

/* Flashcards */
.card-stage { perspective: 1200px; }
.fcard {
  min-height: 220px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 28px 22px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; cursor: pointer;
}
.fcard .front { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; }
.fcard .back { font-size: 1.05rem; max-width: 52ch; }
.fcard.flipped { border-color: var(--accent); }
.boxes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.boxes > div { background: var(--sunk); border-radius: var(--radius); padding: 8px; text-align: center; }
.boxes b { display: block; font-family: var(--serif); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.boxes span { font-size: 0.75rem; color: var(--muted); }

/* Plan */
.plan-table td:nth-child(1) { white-space: nowrap; }
.plan-table tr.exam td { background: var(--accent-soft); }
.plan-table tr.examday td { background: var(--gilt-soft); font-weight: 600; }
.plan-table ul { margin: 0; padding-left: 1.1em; }

/* Cheat sheet */
.cheat h2 { font-size: 1.2rem; border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin-top: 8px; }
.cheat-cols { columns: 2 300px; column-gap: 28px; font-size: 0.9rem; }
.cheat-cols > div { break-inside: avoid; padding: 2px 0; display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 8px; }
.cheat-cols .y { font-family: var(--serif); font-weight: 600; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.who { columns: 2 300px; column-gap: 28px; font-size: 0.9rem; }
.who p { break-inside: avoid; margin-bottom: 4px; }
.who b { font-weight: 650; }
.cheat .hideable.masked { color: transparent; background: var(--sunk); border-radius: 3px; user-select: none; }
.unit-mini { font-size: 0.86rem; }
.unit-mini h4 { font-size: 0.95rem; margin: 6px 0 2px; }
.unit-mini ul { margin: 0; padding-left: 1.1em; }

@media print {
  :root { --paper: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #bbb; --accent: #1d4e7c; --sunk: #fff; color-scheme: light; }
  .rail, .topbar, .no-print, .scrim, .toast { display: none !important; }
  .shell { display: block; }
  main { padding: 0; }
  .col, .col.wide { max-width: none; gap: 8px; }
  body { font-size: 8.5pt; line-height: 1.3; background: #fff; }
  .cheat-cols, .who { columns: 3; column-gap: 14px; font-size: 7.5pt; }
  .cheat h2 { font-size: 10pt; margin-top: 4px; }
  .cheat .hideable.masked { color: #000; background: none; }
  @page { margin: 10mm; }
}
</style>
</head>
<body>
<div class="topbar no-print">
  <button class="btn small" type="button" data-act="menu" aria-label="Open menu" aria-expanded="false" id="menuBtn">☰ Menu</button>
  <span class="brand-name">Western Civ II</span>
  <button class="btn small ghost" type="button" data-act="theme" aria-label="Toggle dark mode" id="themeBtnTop">◐</button>
</div>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Study guide navigation">
    <a class="brand" href="#home" data-nav>
      <span class="brand-eyebrow">CLEP study guide</span>
      <span class="brand-name">Western Civ II</span>
      <span class="brand-span">1648 → the present</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <button class="btn small" type="button" data-act="theme" id="themeBtn">◐ Theme: system</button>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim" hidden data-act="menu"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
const DATA = {"meta":{"exam":"CLEP Western Civilization II: 1648 to the Present","format":{"questions":120,"time_minutes":90,"note":"Approximately 120 questions in 90 minutes; some are unscored pretest questions. Passing score: 50 on a 20-80 scale (ACE recommended credit score).","verified":true},"sources":[{"label":"College Board exam page","url":"https://clep.collegeboard.org/exam/western-civilization-ii"},{"label":"College Board exam page (alt URL)","url":"https://clep.collegeboard.org/clep-exams/western-civilization-2"},{"label":"College Board 'At a Glance' fact sheet (PDF)","url":"https://secure-media.collegeboard.org/digitalServices/pdf/clep/western_civiliation_II_fact_sheet.pdf"}],"verificationNote":"collegeboard.org could not be fetched directly from the build environment (network policy). Weights marked verified=true were confirmed from search-engine excerpts of the College Board page/fact sheet; verified=false means only third-party prep sites confirmed the figure. Subtopic wording is paraphrased.","skills":["Understanding important factual knowledge of developments in Western civilization","Ability to identify the causes and effects of major historical events","Ability to analyze, interpret, and evaluate textual and graphic historical materials","Ability to distinguish the relevant from the irrelevant","Ability to reach conclusions on the basis of facts"]},"outline":[{"id":1,"title":"Absolutism and Constitutionalism, 1648–1715","min":7,"max":9,"verified":true,"subtopics":["The Dutch Republic","The English Revolution","France under Louis XIV","Formation of Austria and Prussia","The 'westernization' of Russia"]},{"id":2,"title":"Competition for Empire and Economic Expansion","min":4,"max":6,"verified":true,"subtopics":["Global economy of the eighteenth century","Europe after Utrecht, 1713–1740","Demographic change in the eighteenth century"]},{"id":3,"title":"The Scientific View of the World","min":5,"max":7,"verified":true,"subtopics":["Major figures of the scientific revolution","New knowledge of man and society","Political theory"]},{"id":4,"title":"Period of Enlightenment","min":7,"max":9,"verified":true,"subtopics":["Enlightenment thought","Enlightened despotism","Partitions of Poland"]},{"id":5,"title":"Revolution and Napoleonic Europe","min":10,"max":13,"verified":true,"subtopics":["The Revolution in France","The Revolution in Europe","The Napoleonic era","Congress of Vienna"]},{"id":6,"title":"The Industrial Revolution","min":7,"max":9,"verified":true,"subtopics":["Agricultural and industrial revolution","Causes of revolution","Economic and social impact on working and middle class","British reform legislation","Chartism"]},{"id":7,"title":"Political and Cultural Developments, 1815–1848","min":6,"max":8,"verified":false,"subtopics":["Conservatism","Liberalism","Nationalism","Socialism","Romanticism","Revolutions of 1830 and 1848"]},{"id":8,"title":"Politics and Diplomacy in the Age of Nationalism, 1850–1914","min":8,"max":10,"verified":true,"subtopics":["The unification of Italy and Germany","Austria-Hungary","Russia","France","Socialism and labor unions","European diplomacy, 1871–1900"]},{"id":9,"title":"Economy, Culture, and Imperialism, 1850–1914","min":7,"max":9,"verified":true,"subtopics":["Demography","Mass politics","Science, technology, and industrial growth","Imperialism in Africa and Asia","Modern art, thought, and literature"]},{"id":10,"title":"The First World War and the Russian Revolution","min":10,"max":12,"verified":true,"subtopics":["Causes of the First World War","Economic and social impact of the war","The peace settlements","The Russian Revolution of 1917"]},{"id":11,"title":"Europe Between the Wars","min":7,"max":9,"verified":true,"subtopics":["The Great Depression","International politics, 1919–1939","Stalin's five-year plans and purges","Fascism and Nazism","Interwar culture"]},{"id":12,"title":"The Second World War and Contemporary Europe","min":8,"max":10,"verified":true,"subtopics":["Causes and course of the Second World War","Postwar Europe and the Cold War","Decolonization","European integration","The collapse of communism and contemporary Europe"]}],"units":[{"id":1,"title":"Absolutism and Constitutionalism, 1648–1715","short":"Absolutism & Constitutionalism","range":"1648–1715","weight":{"min":7,"max":9,"verified":true},"subtopics":["The Dutch Republic","The English Revolution","France under Louis XIV","Formation of Austria and Prussia","The 'westernization' of Russia"],"lesson":"<h3>The big picture<\/h3>\n<p>In 1648 the <strong>Peace of Westphalia<\/strong> ended the Thirty Years' War, the last great war fought mainly over religion in Europe. From then on, rulers fought for power, territory and trade rather than faith. The treaty recognized the independence of the <strong>Dutch Republic<\/strong> and Switzerland, let each German prince run his own state (making the Holy Roman Emperor weak), and accepted Calvinism alongside Catholicism and Lutheranism. Historians often treat Westphalia as the birth of the modern system of <strong>sovereign states<\/strong>.<\/p>\n<p>The central question of the next seventy years was simple: <strong>who holds supreme power in a state?<\/strong> Two answers competed. <strong>Absolutism<\/strong> said the monarch rules alone, answering only to God (<strong>divine right of kings<\/strong>), with no parliament able to block him. <strong>Constitutionalism<\/strong> said the ruler's power is limited by law and shared with a representative body. France under Louis XIV became the model of the first answer; England and the Dutch Republic became the models of the second.<\/p>\n<h3>France: Louis XIV, the model absolute monarch<\/h3>\n<p>Louis XIV became king in 1643 at age four and reigned until 1715, the longest reign in European history. As a boy he lived through the <strong>Fronde<\/strong> (1648–1653), a series of revolts by nobles and the Paris law courts against the regency government of Cardinal <strong>Mazarin<\/strong>. Louis never forgot being forced to flee Paris. He drew a lesson: the nobility must be tamed.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Noble revolts of the Fronde humiliate the young king<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Louis XIV builds Versailles and moves the court there (1682)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Great nobles trade political power for court rituals and royal favor<\/div><\/div>\n<p>At <strong>Versailles<\/strong>, a giant palace outside Paris, the most powerful nobles were expected to live at court, where they competed for honors such as handing the king his shirt. Nobles busy with etiquette were not raising armies. Louis governed through middle-class officials and royal agents called <strong>intendants<\/strong>, who carried his orders to the provinces. He never called the <strong>Estates-General<\/strong>, France's national assembly, which did not meet from 1614 until 1789. The bishop <strong>Jacques-Bénigne Bossuet<\/strong> gave the theory: kings are God's lieutenants on earth. The phrase \"L'état, c'est moi\" (\"I am the state\") is attributed to Louis, though he probably never said it.<\/p>\n<p>His finance minister <strong>Jean-Baptiste Colbert<\/strong> practiced <strong>mercantilism<\/strong>: the idea that a nation's wealth is a fixed pie measured in gold and silver, so the state should export more than it imports, protect home industries with tariffs, build roads and canals, and found colonies to supply raw materials.<\/p>\n<p>Louis wanted \"one king, one law, one faith.\" In 1685 he <strong>revoked the Edict of Nantes<\/strong> (which since 1598 had protected French Protestants, the <strong>Huguenots<\/strong>). About 200,000 skilled Huguenots fled to the Dutch Republic, England, Prussia and America, taking their crafts and capital with them. It was a gift to France's rivals.<\/p>\n<p>Louis also fought almost constantly to push France's borders to the Rhine. His last and biggest war, the <strong>War of the Spanish Succession<\/strong> (1701–1714), began when the childless Spanish king left his throne to Louis's grandson Philip. England, the Dutch and Austria feared a French-Spanish superstate and formed a grand alliance against him. The <strong>Treaty of Utrecht (1713)<\/strong> let Philip V keep Spain but ruled that the French and Spanish crowns could never be united. Britain took <strong>Gibraltar<\/strong>, Minorca, Newfoundland, Nova Scotia (Acadia) and the <strong>asiento<\/strong> (the right to sell enslaved Africans in Spanish America). Utrecht established the principle of the <strong>balance of power<\/strong>: no single state should dominate Europe. Louis died in 1715 leaving France victorious in prestige but deeply in debt.<\/p>\n<h3>England: from civil war to constitutional monarchy<\/h3>\n<p>England's Stuart kings, <strong>James I<\/strong> and <strong>Charles I<\/strong>, also believed in divine right, but they needed Parliament's consent to raise taxes. Charles I collected taxes without Parliament, accepted the <strong>Petition of Right (1628)<\/strong> and then ignored it, and ruled without Parliament from 1629 to 1640. A Scottish revolt over religion forced him to call Parliament again for money. That <strong>Long Parliament<\/strong> demanded reforms, and in 1642 the <strong>English Civil War<\/strong> began.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Charles I taxes without Parliament and pushes high-church religion on Puritans and Scots<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>English Civil War, 1642–1649<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Charles I executed (1649); England becomes a republic<\/div><\/div>\n<p>The <strong>Royalists<\/strong> (Cavaliers) fought the <strong>Parliamentarians<\/strong> (Roundheads), who were strongest among Puritans, merchants and London. <strong>Oliver Cromwell<\/strong> led Parliament's disciplined <strong>New Model Army<\/strong> to victory. In 1649 Charles I was tried and <strong>beheaded<\/strong>, a shocking act in a Europe of kings. England became a republic, the <strong>Commonwealth<\/strong>. Radical groups appeared, such as the <strong>Levellers<\/strong>, who wanted votes for most men. Cromwell dissolved Parliament and ruled as <strong>Lord Protector<\/strong> (1653–1658), a military dictatorship in practice. Puritan rule (theaters closed, strict morality) grew unpopular.<\/p>\n<p>After Cromwell died, the monarchy was <strong>restored in 1660<\/strong> under <strong>Charles II<\/strong>. Parliament now held the upper hand on taxes. Two political factions formed: <strong>Whigs<\/strong>, who wanted to limit the king and exclude Catholics from the throne, and <strong>Tories<\/strong>, who supported royal authority and hereditary right. The <strong>Test Act (1673)<\/strong> barred non-Anglicans from public office.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Catholic James II rules by decree and his son is born, promising a Catholic dynasty<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Glorious Revolution (1688): Parliament invites William of Orange and Mary<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Bill of Rights (1689) makes Parliament supreme: constitutional monarchy<\/div><\/div>\n<p>Charles's brother <strong>James II<\/strong> was openly Catholic and ignored laws he disliked. When his son was born in 1688, Parliament's leaders invited the Protestant Dutch prince <strong>William of Orange<\/strong> and his wife <strong>Mary<\/strong> (James's Protestant daughter) to take the throne. James fled with almost no bloodshed: the <strong>Glorious Revolution<\/strong>. William and Mary accepted the <strong>Bill of Rights (1689)<\/strong>: no taxes or standing army in peacetime without Parliament's consent, free elections, free speech in Parliament, and no Catholic monarch. The <strong>Toleration Act (1689)<\/strong> allowed Protestant dissenters to worship (but not Catholics). <strong>John Locke's<\/strong> <em>Two Treatises of Government<\/em> (1690) justified the revolution: government rests on the consent of the governed. The <strong>Act of Union (1707)<\/strong> joined England and Scotland as <strong>Great Britain<\/strong>.<\/p>\n<h3>The Dutch Republic: a merchant republic<\/h3>\n<p>The <strong>United Provinces of the Netherlands<\/strong> won independence from Spain (recognized in 1648). It was a loose federation of seven provinces with a weak central <strong>States General<\/strong>. Power lay with wealthy merchant oligarchs called <strong>regents<\/strong>, while the princes of the House of <strong>Orange<\/strong> held the office of <strong>stadtholder<\/strong> (military leader) and gained power in wartime crises. In the \"disaster year\" of <strong>1672<\/strong>, when France invaded, the Dutch turned to <strong>William III of Orange<\/strong>, the same William who later took England's throne.<\/p>\n<p>The seventeenth century was the <strong>Dutch Golden Age<\/strong>. The <strong>Dutch East India Company<\/strong> (VOC, founded 1602) dominated the Asian spice trade; Amsterdam had the world's leading stock exchange and the <strong>Bank of Amsterdam<\/strong>; Dutch ships carried much of Europe's trade. The Republic practiced unusual <strong>religious toleration<\/strong>, sheltering Jews, Huguenots and dissenters like the philosopher <strong>Spinoza<\/strong>. Painters such as <strong>Rembrandt<\/strong> and <strong>Vermeer<\/strong> painted merchants and everyday life rather than kings and saints. By 1700, wars with England and France had drained the Dutch, and Britain overtook them as the leading commercial power.<\/p>\n<h3>Central and Eastern Europe: Austria, Prussia, Russia<\/h3>\n<p>After 1648 the Habsburg emperors in Vienna gave up on controlling Germany and built a Danube empire: Austria, Bohemia and Hungary. In <strong>1683 the Ottoman Turks besieged Vienna<\/strong> for the last time; a relief army led by the Polish king <strong>Jan Sobieski<\/strong> broke the siege. In the <strong>Treaty of Karlowitz (1699)<\/strong> the Ottomans surrendered most of <strong>Hungary<\/strong> to Austria. The Habsburg lands stayed a patchwork of peoples and laws held together by the dynasty, the Catholic Church and the army, never as centralized as France.<\/p>\n<p><strong>Brandenburg-Prussia<\/strong>, ruled by the <strong>Hohenzollern<\/strong> family, was poor and scattered across northern Germany. <strong>Frederick William, the Great Elector<\/strong> (r. 1640–1688), built a large standing army and a tax bureaucracy (the General War Commissariat). He made a bargain with the landowning nobles, the <strong>Junkers<\/strong>: they accepted royal taxes and served as army officers in return for total control over their serfs. His son became <strong>King in Prussia<\/strong> in 1701. Prussia became famous as an army with a state attached.<\/p>\n<p>In Russia, <strong>Peter the Great<\/strong> (r. 1682–1725) toured Western Europe incognito in the <strong>Grand Embassy<\/strong> (1697–1698) to study shipbuilding and technology. Back home he forced <strong>westernization<\/strong> from the top: nobles had to shave their beards (or pay a beard tax) and wear Western clothes; he built a navy; he crushed the rebellious palace guard (the <strong>streltsy<\/strong>); he created the <strong>Table of Ranks<\/strong> (1722), which ranked nobles by state service rather than birth; and he put the Orthodox Church under a government committee, the <strong>Holy Synod<\/strong>. He fought Sweden in the <strong>Great Northern War<\/strong> (1700–1721), won the decisive <strong>Battle of Poltava (1709)<\/strong> against Charles XII, and gained the Baltic coast in the <strong>Treaty of Nystad (1721)<\/strong>. There he built his new capital, <strong>St. Petersburg<\/strong> (founded 1703), his \"window on the West.\" Westernization touched the elite; for peasants, <strong>serfdom<\/strong> grew harsher.<\/p>\n<h3>How it fits together<\/h3>\n<p>Every state faced the same pressure: war had become enormously expensive (standing armies, navies, fortresses). Rulers who could raise money without asking anyone, as in France, Prussia and Russia, became absolutist. Where a parliament controlled taxes, as in England, or merchants controlled the state, as in the Dutch Republic, power was shared under law. Exam questions often ask you to match a state to its model and to name the document or event that defined it.<\/p>","words":1561,"minutes":11,"mustKnow":["<strong>Peace of Westphalia (1648):<\/strong> ended the Thirty Years' War, recognized Dutch and Swiss independence, weakened the Holy Roman Emperor, birth of the sovereign-state system.","<strong>Louis XIV<\/strong> (r. 1643–1715) is the model absolutist: Versailles to tame nobles, intendants, never called the Estates-General, Bossuet's divine right, Colbert's mercantilism.","<strong>Revocation of the Edict of Nantes (1685)<\/strong> drove out the Huguenots, a skilled population that strengthened France's rivals.","<strong>Treaty of Utrecht (1713):<\/strong> Bourbon Philip V keeps Spain but the crowns stay separate; Britain gains Gibraltar and the asiento; balance-of-power principle.","<strong>English Civil War (1642–49)<\/strong> → Charles I executed (1649) → Cromwell's Commonwealth/Protectorate → Restoration (1660).","<strong>Glorious Revolution (1688)<\/strong> → William and Mary accept the <strong>Bill of Rights (1689)<\/strong>: Parliament supreme, constitutional monarchy.","<strong>Dutch Republic:<\/strong> merchant oligarchy, stadtholder from House of Orange, VOC, toleration, Golden Age art.","<strong>Prussia:<\/strong> Great Elector, standing army, Junker bargain (nobles serve the state, keep their serfs).","<strong>Peter the Great:<\/strong> westernization from above, Table of Ranks, Holy Synod, Great Northern War, Poltava (1709), St. Petersburg.","<strong>Austria:<\/strong> repelled the Ottoman siege of Vienna (1683), gained Hungary at Karlowitz (1699); a multiethnic dynastic state."],"timeline":[{"y":"1648","label":"Peace of Westphalia","note":"Ends the Thirty Years' War; Dutch independence recognized","key":true},{"y":"1648–1653","label":"The Fronde","note":"Noble and judicial revolts against Mazarin's regency in France","key":false},{"y":"1649","label":"Charles I executed","note":"England becomes a republic (Commonwealth)","key":true},{"y":"1653–1658","label":"Cromwell's Protectorate","note":"Military rule under the Lord Protector","key":false},{"y":"1660","label":"Stuart Restoration","note":"Charles II returns; Parliament keeps control of taxes","key":true},{"y":"1682","label":"Court moves to Versailles","note":"Louis XIV domesticates the high nobility","key":false},{"y":"1683","label":"Ottoman siege of Vienna fails","note":"Start of the Habsburg advance into Hungary","key":true},{"y":"1685","label":"Edict of Nantes revoked","note":"Huguenots flee France","key":true},{"y":"1688–1689","label":"Glorious Revolution; Bill of Rights","note":"Constitutional monarchy in England","key":true},{"y":"1697–1698","label":"Peter the Great's Grand Embassy","note":"Peter studies Western technology","key":false},{"y":"1699","label":"Treaty of Karlowitz","note":"Ottomans cede Hungary to Austria","key":false},{"y":"1700–1721","label":"Great Northern War","note":"Russia defeats Sweden (Poltava 1709); Nystad 1721","key":false},{"y":"1701","label":"Prussia becomes a kingdom","note":"Elector Frederick III crowned Frederick I, King in Prussia","key":false},{"y":"1703","label":"St. Petersburg founded","note":"Russia's \"window on the West\"","key":false},{"y":"1707","label":"Act of Union","note":"England and Scotland form Great Britain","key":false},{"y":"1713","label":"Treaty of Utrecht","note":"Ends War of the Spanish Succession; balance of power","key":true},{"y":"1715","label":"Death of Louis XIV","note":"Ends the age of the Sun King","key":false}],"cards":[{"id":"u1c1","front":"Peace of Westphalia (1648)","back":"Ended the Thirty Years' War; recognized Dutch and Swiss independence; German princes became sovereign; Calvinism tolerated.","person":false},{"id":"u1c2","front":"Absolutism","back":"Rule by a monarch with no legal limits from a parliament, justified by divine right.","person":false},{"id":"u1c3","front":"Constitutionalism","back":"Government whose power is limited by law and shared with a representative body.","person":false},{"id":"u1c4","front":"Divine right of kings","back":"Theory that monarchs get their authority from God and answer only to God.","person":false},{"id":"u1c5","front":"Louis XIV","back":"The \"Sun King\" of France (r. 1643–1715); model absolutist; built Versailles, revoked the Edict of Nantes.","person":true},{"id":"u1c6","front":"The Fronde","back":"Revolts by French nobles and courts (1648–53) against Mazarin's regency; taught Louis XIV to tame the nobility.","person":false},{"id":"u1c7","front":"Versailles","back":"Louis XIV's palace; the court moved there in 1682 to keep great nobles busy and under watch.","person":false},{"id":"u1c8","front":"Intendants","back":"Royal agents who enforced the French king's orders in the provinces.","person":false},{"id":"u1c9","front":"Jean-Baptiste Colbert","back":"Louis XIV's finance minister; mercantilism: tariffs, state-backed industry, colonies.","person":true},{"id":"u1c10","front":"Mercantilism","back":"Policy of building national wealth (gold and silver) through a favorable balance of trade, tariffs and colonies.","person":false},{"id":"u1c11","front":"Huguenots","back":"French Protestants; about 200,000 fled after the 1685 revocation of the Edict of Nantes.","person":false},{"id":"u1c12","front":"Treaty of Utrecht (1713)","back":"Philip V keeps Spain but French and Spanish crowns stay separate; Britain gains Gibraltar and the asiento.","person":false},{"id":"u1c13","front":"Oliver Cromwell","back":"Led Parliament's New Model Army in the English Civil War; ruled as Lord Protector 1653–58.","person":true},{"id":"u1c14","front":"Glorious Revolution (1688)","back":"Bloodless replacement of Catholic James II by William and Mary; Parliament's victory.","person":false},{"id":"u1c15","front":"English Bill of Rights (1689)","back":"No taxes or peacetime army without Parliament; free elections; no Catholic monarch.","person":false},{"id":"u1c16","front":"Whigs and Tories","back":"Restoration-era factions: Whigs favored limiting the king; Tories backed royal authority.","person":false},{"id":"u1c17","front":"Stadtholder","back":"Military and executive leader in the Dutch provinces, usually from the House of Orange.","person":false},{"id":"u1c18","front":"Junkers","back":"Prussian landed nobility; served as army officers and kept control of their serfs.","person":false},{"id":"u1c19","front":"Peter the Great","back":"Russian tsar (r. 1682–1725) who westernized Russia from above, founded St. Petersburg, beat Sweden.","person":true},{"id":"u1c20","front":"Table of Ranks (1722)","back":"Peter the Great's system ranking nobles by state service rather than birth.","person":false}],"hours":1.71,"quizIds":["u1q2","u1q3","u1q8","u1q10","u1q12","u1q14","u1q16","u1q19","u1q23","u1q25","u1q26","u1q29"]}],"questions":{"u1q1":{"id":"u1q1","unit":1,"diff":"e","pool":"exam1","stem":"<p>Which document, accepted by William and Mary in 1689, guaranteed that Parliament must consent to taxation and to a peacetime standing army?<\/p>","options":["The Test Act","The Edict of Nantes","The Petition of Right","The English Bill of Rights","The Act of Union"],"why":["The Test Act (1673) barred non-Anglicans from office; it did not define Parliament's powers over taxes.","The Edict of Nantes (1598) gave French Protestants toleration; it has nothing to do with Parliament.","The Petition of Right dates from 1628, under Charles I, and he ignored it.","The 1689 Bill of Rights made these parliamentary powers law as the condition of William and Mary's accession.","The Act of Union (1707) joined England and Scotland; it did not set out Parliament's taxing power."],"answer":3},"u1q2":{"id":"u1q2","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Peace of Westphalia (1648) did which of the following?<\/p>","options":["Ended the War of the Spanish Succession","Outlawed Calvinism within the Holy Roman Empire","Recognized the independence of the Dutch Republic","Unified the German states under the Habsburg emperor","Restored the Stuart monarchy in England"],"why":["That war ended with the Treaty of Utrecht in 1713.","Westphalia added Calvinism to the faiths a ruler could legally adopt.","Westphalia formally recognized the United Provinces' independence from Spain, along with Swiss independence.","It did the opposite: German princes became effectively sovereign and the emperor was weakened.","The Stuart Restoration happened in 1660 and was an English domestic event."],"answer":2},"u1q3":{"id":"u1q3","unit":1,"diff":"e","pool":"quiz","stem":"<p>Louis XIV's main purpose in requiring great nobles to live at Versailles was to<\/p>","options":["keep them under royal watch and away from independent power bases","convert them from Protestantism to Catholicism","collect the taxes that the nobles owed the crown","prepare them to serve in the Estates-General","train them as officers for the French navy"],"why":["Busy competing for court honors, nobles could not raise private armies or lead revolts like the Fronde.","The great nobles were overwhelmingly Catholic already; Versailles was about political control.","French nobles were largely exempt from direct taxes; Versailles was not a tax office.","Louis never called the Estates-General.","Versailles was a court, not a naval academy."],"answer":0},"u1q4":{"id":"u1q4","unit":1,"diff":"e","pool":"exam2","stem":"<p>Which ruler is most closely associated with founding St. Petersburg and forcing Russian nobles to adopt Western dress?<\/p>","options":["Peter the Great","Ivan the Terrible","Catherine the Great","Alexander I","Michael Romanov"],"why":["Peter founded St. Petersburg in 1703 and imposed beard taxes and Western clothing on the elite.","Ivan IV ruled in the 1500s, long before St. Petersburg existed.","Catherine (r. 1762–1796) came later and is linked to enlightened despotism and the partitions of Poland.","Alexander I ruled 1801–1825 and is known for fighting Napoleon.","Michael founded the Romanov dynasty in 1613; he did not westernize Russia."],"answer":0},"u1q5":{"id":"u1q5","unit":1,"diff":"e","pool":"exam2","stem":"<p>The Glorious Revolution of 1688 replaced James II with<\/p>","options":["Oliver Cromwell","William of Orange and Mary","George I of Hanover","Queen Anne","Charles II"],"why":["Cromwell died in 1658, thirty years earlier.","Parliament's leaders invited the Protestant William and Mary, James's daughter, to take the throne.","George I came to the throne in 1714 under the Act of Settlement.","Anne followed William in 1702; she did not replace James II.","Charles II was restored in 1660 and died in 1685; James II was his successor."],"answer":1},"u1q6":{"id":"u1q6","unit":1,"diff":"e","pool":"exam1","stem":"<p>In the Dutch Republic of the 1600s, political power rested chiefly with<\/p>","options":["the Spanish viceroy in Brussels","an absolute monarch ruling by divine right","wealthy merchant oligarchs (regents) in the provinces and towns","a parliament elected by all adult men","the Catholic bishops of the Netherlands"],"why":["The Dutch had broken away from Spain; Spanish officials governed only the southern (Spanish) Netherlands.","The Dutch Republic had no king; it was a federal republic.","The regents dominated provincial estates and town councils; the federation's center was weak.","There was no democratic suffrage; power was oligarchic.","The Republic was officially Calvinist; Catholic bishops held no political power."],"answer":2},"u1q7":{"id":"u1q7","unit":1,"diff":"e","pool":"diag","stem":"<p>Which war ended with the Treaty of Utrecht in 1713?<\/p>","options":["The War of the Spanish Succession","The Seven Years' War","The English Civil War","The Thirty Years' War","The Great Northern War"],"why":["Utrecht (1713, with Rastatt in 1714) settled who would rule Spain.","The Seven Years' War ended in 1763 with the Treaty of Paris.","The English Civil War was a domestic conflict that ended in 1649.","The Thirty Years' War ended at Westphalia in 1648.","That war ended with the Treaty of Nystad in 1721."],"answer":0},"u1q8":{"id":"u1q8","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Prussian Junkers were<\/p>","options":["Protestant refugees from France","Prussian merchants who financed the royal army","landowning nobles who served as army officers in return for control over their serfs","elected members of the Prussian parliament","foreign mercenaries hired by the Great Elector"],"why":["Huguenot refugees settled in Prussia, but they were not called Junkers.","Prussia's merchant class was small; Junkers were rural nobles.","This bargain with the Hohenzollerns was the social basis of the Prussian state.","Prussia had no powerful elected parliament in this period.","Junkers were native Prussian nobles, not foreign hires."],"answer":2},"u1q9":{"id":"u1q9","unit":1,"diff":"e","pool":"exam2","stem":"<p>Mercantilism, as practiced by Colbert, held that a nation should<\/p>","options":["remove all tariffs and allow free trade","collectivize land and industry under worker control","abolish colonies because they drain the home economy","export more than it imports in order to accumulate gold and silver","let private markets set all prices without state interference"],"why":["Free trade is Adam Smith's later answer to mercantilism.","That describes socialism, a nineteenth-century idea.","Mercantilists valued colonies as sources of raw materials and markets.","Mercantilists measured wealth in bullion and sought a favorable balance of trade.","That is laissez-faire, the opposite of Colbert's state-directed economy."],"answer":3},"u1q10":{"id":"u1q10","unit":1,"diff":"e","pool":"quiz","stem":"<p>What happened to King Charles I of England in 1649?<\/p>","options":["He was tried and executed by order of Parliament's leaders","He was deposed in a bloodless revolution","He signed the Bill of Rights and became a constitutional monarch","He fled to France and returned as king in 1660","He dissolved Parliament and began eleven years of personal rule"],"why":["His beheading in January 1649 led to the Commonwealth.","That describes James II in 1688.","The Bill of Rights was accepted by William and Mary in 1689.","Charles II, his son, returned in 1660; Charles I was dead by then.","His personal rule ran from 1629 to 1640, not 1649."],"answer":0},"u1q11":{"id":"u1q11","unit":1,"diff":"m","pool":"exam1","stem":"<p>Louis XIV's revocation of the Edict of Nantes in 1685 had which of the following consequences?<\/p>","options":["The Fronde broke out against royal authority","Many skilled Huguenot artisans and merchants emigrated to France's rivals","France's economy immediately surpassed the Dutch Republic's","The pope excommunicated Louis XIV","France became officially Protestant"],"why":["The Fronde (1648–53) happened decades earlier.","Around 200,000 Huguenots fled to the Dutch Republic, England, Prussia and America, taking skills and capital with them.","Losing skilled workers hurt France's economy.","The revocation pleased many Catholics; there was no excommunication.","The revocation made Protestant worship illegal; France stayed Catholic."],"answer":1},"u1q12":{"id":"u1q12","unit":1,"diff":"m","pool":"quiz","stem":"<p>Which pairing of a state and its form of government around 1700 is correct?<\/p>","options":["England: constitutional monarchy with Parliament controlling taxation","Russia: elected monarchy chosen by the nobility","Dutch Republic: absolute monarchy under the House of Orange","France: limited monarchy under a strong Estates-General","Prussia: merchant republic run by town councils"],"why":["After 1689 the English crown could not tax without Parliament.","Russia was an autocracy under hereditary tsars.","The Orange stadtholders were powerful but the Republic had no king.","The Estates-General did not meet between 1614 and 1789; France was absolutist.","Prussia was a militarized absolute monarchy."],"answer":0},"u1q13":{"id":"u1q13","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which event came FIRST?<\/p>","options":["The Glorious Revolution","The Treaty of Utrecht","The founding of St. Petersburg","The beheading of Charles I","The revocation of the Edict of Nantes"],"why":["1688.","1713.","1703.","1649, the earliest of these.","1685."],"answer":3},"u1q14":{"id":"u1q14","unit":1,"diff":"m","pool":"quiz","stem":"<blockquote>\"The royal throne is not the throne of a man, but the throne of God himself... The person of the king is sacred, and to attack him in any way is sacrilege.\"<\/blockquote><p>The passage above best expresses the ideas of<\/p>","options":["Oliver Cromwell, justifying the Protectorate","Spinoza, arguing for religious toleration","John Locke, defending the Glorious Revolution","the Levellers, demanding wider suffrage","Bishop Bossuet, defending divine-right absolutism"],"why":["Cromwell had helped execute a king; he did not call kings sacred.","Spinoza was a rationalist critic of religious authority.","Locke argued that power comes from the consent of the governed, not from God.","The Levellers were radicals who wanted to limit authority, not sanctify kings.","Bossuet, tutor to Louis XIV's son, argued that kings are God's ministers on earth."],"answer":4},"u1q15":{"id":"u1q15","unit":1,"diff":"m","pool":"exam1","stem":"<p>Peter the Great's Table of Ranks (1722) was designed to<\/p>","options":["tie noble status and promotion to service to the state","establish an elected Russian parliament","free the serfs and give them land","rank Orthodox clergy above the nobility","list the provinces that owed tribute to Sweden"],"why":["Rank came from service in the army, navy or bureaucracy, so the nobility worked for the tsar.","Russia had no parliament until the Duma of 1906.","Serfdom grew harsher under Peter; emancipation came in 1861.","Peter subordinated the Church to the state through the Holy Synod.","Russia fought Sweden; it did not pay it tribute."],"answer":0},"u1q16":{"id":"u1q16","unit":1,"diff":"m","pool":"quiz","stem":"<p>The Treaty of Utrecht (1713) is significant because it<\/p>","options":["placed a Habsburg prince on the Spanish throne","kept the French and Spanish crowns separate and upheld a balance of power","forced Britain to return Gibraltar to Spain","ended Dutch independence","created the German Confederation"],"why":["The Bourbon Philip V, Louis XIV's grandson, kept Spain.","Philip V kept Spain but could never unite it with France, preventing one dominant power.","Britain gained Gibraltar at Utrecht.","Dutch independence was not at issue; the Republic was on the winning side.","The German Confederation was created by the Congress of Vienna in 1815."],"answer":1},"u1q17":{"id":"u1q17","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which group was most likely to support Parliament against Charles I in the English Civil War?<\/p>","options":["Jesuit missionaries","Puritans and London merchants","The great landed nobility of the north and west","High-church Anglican bishops","Irish Catholics"],"why":["Jesuits were banned in England and opposed Puritan Parliament.","Parliament's strongholds were the Puritans, the commercial classes and London.","Many northern and western nobles were Royalists.","Bishops generally backed the king's religious policies.","Irish Catholics were hostile to the Puritan Parliament."],"answer":1},"u1q18":{"id":"u1q18","unit":1,"diff":"m","pool":"exam2","stem":"<p>The 1683 Ottoman siege of Vienna is important because its failure<\/p>","options":["began a Habsburg advance that won most of Hungary by 1699","ended Habsburg rule in Austria","caused the Thirty Years' War","led directly to the unification of Germany","made the Ottoman Empire a member of the Holy Roman Empire"],"why":["After the siege was broken, Austria pushed back the Ottomans and gained Hungary at Karlowitz.","The Habsburgs emerged stronger.","That war began in 1618 and ended in 1648.","German unification came in 1871.","The Ottomans were never part of the Holy Roman Empire."],"answer":0},"u1q19":{"id":"u1q19","unit":1,"diff":"m","pool":"quiz","stem":"<p>A historian argues that seventeenth-century rulers became absolute mainly because war had grown too expensive for traditional revenue. Which evidence would best support this?<\/p>","options":["The Peace of Westphalia tolerated Calvinism","The English Bill of Rights guaranteed free speech in Parliament","Peter the Great required nobles to shave their beards","Rembrandt painted group portraits of Amsterdam militia companies","Prussia's Great Elector created a tax bureaucracy specifically to fund a standing army"],"why":["Religious settlement does not show that war costs drove absolutism.","This shows limits on a king, not the fiscal roots of absolutism.","Beard rules concern cultural westernization, not war finance.","This is cultural evidence, not evidence about state finance.","The General War Commissariat shows military needs driving state-building."],"answer":4},"u1q20":{"id":"u1q20","unit":1,"diff":"m","pool":"exam1","stem":"<p>The Dutch Republic in the seventeenth century was notable for<\/p>","options":["its rejection of overseas trade and colonies","being governed directly from Madrid","a powerful landed nobility that dominated trade","strict censorship that drove printers abroad","religious toleration that attracted Jews, Huguenots and other refugees"],"why":["The VOC made it a leading colonial and trading power.","Independence from Spain was recognized in 1648.","Trade was dominated by urban merchants, not landed nobles.","The Republic was Europe's freest publishing center.","Its relative tolerance drew skilled refugees and dissenting thinkers such as Spinoza."],"answer":4},"u1q21":{"id":"u1q21","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which statement best describes Oliver Cromwell's rule as Lord Protector (1653–1658)?<\/p>","options":["It was a republic in name but a military dictatorship in practice","It made England an absolute monarchy under divine right","It restored the Catholic Church in England","It established the first fully democratic government in Europe","It ended when Parliament invited William of Orange to rule"],"why":["Cromwell relied on the army and dismissed parliaments that opposed him.","Cromwell was not a king, and divine right was the Stuart theory.","Cromwell was a Puritan and hostile to Catholicism.","Cromwell rejected the Levellers' demand for wide suffrage.","That happened to James II in 1688."],"answer":0},"u1q22":{"id":"u1q22","unit":1,"diff":"m","pool":"exam2","stem":"<p>Frederick William, the Great Elector of Brandenburg-Prussia, is best known for<\/p>","options":["becoming the first Holy Roman Emperor from Prussia","granting a liberal constitution to his subjects","unifying Germany through \"blood and iron\"","defeating Napoleon at Leipzig","building a large standing army and a central bureaucracy to pay for it"],"why":["No Prussian ruler was Holy Roman Emperor.","He ruled as an absolutist.","That was Bismarck in the 1860s.","The Battle of Leipzig took place in 1813, long after his death in 1688.","He laid the foundations of Prussian militarism and administration."],"answer":4},"u1q23":{"id":"u1q23","unit":1,"diff":"m","pool":"quiz","stem":"<p>The Battle of Poltava (1709) was decisive because it<\/p>","options":["ended the Ottoman threat to Vienna","broke Swedish power and opened Russia's path to the Baltic","made Prussia a kingdom","restored the Stuarts to the English throne","forced Louis XIV to accept the Treaty of Utrecht"],"why":["That was the relief of Vienna in 1683.","Peter's victory over Charles XII led to Russian gains confirmed at Nystad (1721).","Prussia became a kingdom in 1701 by agreement with the emperor.","The Restoration was in 1660.","Utrecht followed battles in western Europe, not Poltava."],"answer":1},"u1q24":{"id":"u1q24","unit":1,"diff":"m","pool":"diag","stem":"<p>\"No taxation without the consent of Parliament\" was a central issue in which conflict?<\/p>","options":["The Fronde in France","The struggle between the Stuart kings and Parliament that led to the English Civil War","The Great Northern War","The War of the Spanish Succession","The Dutch revolt against Spain"],"why":["The Fronde concerned French nobles and courts; there was no Parliament in the English sense.","Charles I's attempts to tax without Parliament helped trigger the war in 1642.","That war was between Russia and Sweden over the Baltic.","That war was about who would inherit the Spanish throne.","Taxation was an issue, but \"Parliament\" refers to England."],"answer":1},"u1q25":{"id":"u1q25","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which of the following best explains why England developed a constitutional monarchy while France developed absolutism?<\/p>","options":["France had no nobility to resist the king","English kings rejected the theory of divine right","France had already experienced a successful revolution","English kings depended on Parliament for taxes, while French kings could tax without a national assembly","England was Catholic while France was Protestant"],"why":["France had a powerful nobility; Louis XIV had to tame it.","James I and Charles I strongly believed in divine right.","France's revolution came in 1789.","Control of revenue determined who held power; the French crown never had to call the Estates-General.","The reverse is closer to the truth: England was Protestant and France Catholic."],"answer":3},"u1q26":{"id":"u1q26","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which development is MOST similar to Louis XIV's use of intendants?<\/p>","options":["The Peace of Westphalia's grant of sovereignty to German princes","Peter the Great's creation of a service bureaucracy loyal to the tsar","The Dutch reliance on town councils run by regents","The Levellers' call for wider suffrage","England's Bill of Rights limiting the crown"],"why":["That decentralized authority within the Empire.","Both rulers bypassed traditional nobles by relying on officials who owed everything to the crown.","That decentralized merchant government is the opposite of royal centralization.","That was a popular democratic demand, not a royal administrative tool.","That limited royal power rather than extending it."],"answer":1},"u1q27":{"id":"u1q27","unit":1,"diff":"h","pool":"exam2","stem":"<p>A French Huguenot silk weaver who left France in 1686 and settled in Berlin would most likely have been<\/p>","options":["expelled immediately as a Catholic","forced to return to France under the Treaty of Utrecht","welcomed by the Great Elector, who offered refuge to Huguenots to build Prussia's economy","drafted into the Ottoman army","required to convert to Russian Orthodoxy"],"why":["Huguenots were Protestants, and Prussia's rulers were Protestant.","Utrecht contained no such provision.","His Edict of Potsdam (1685) invited Huguenots, who boosted Berlin's crafts.","Berlin was not Ottoman territory.","Berlin was in Brandenburg-Prussia, not Russia."],"answer":2},"u1q28":{"id":"u1q28","unit":1,"diff":"h","pool":"exam1","stem":"<p>Which of the following was a provision of the Treaty of Utrecht?<\/p>","options":["France gained Nova Scotia from Britain","Britain received the asiento, the right to supply enslaved Africans to Spanish America","Austria received Gibraltar and Minorca","Russia received a Baltic coastline","Philip V was required to give Spain to the Habsburgs"],"why":["France ceded Acadia (Nova Scotia) to Britain.","The asiento was one of Britain's chief commercial gains at Utrecht.","Britain, not Austria, received Gibraltar and Minorca.","Russia's Baltic gains came at Nystad in 1721.","Philip V kept Spain."],"answer":1},"u1q29":{"id":"u1q29","unit":1,"diff":"h","pool":"quiz","stem":"<p>Locke's Two Treatises of Government (1690) is closely linked to the Glorious Revolution because it<\/p>","options":["urged England to adopt Catholicism","argued for an all-powerful sovereign to prevent civil war","defended the divine right of the Stuart dynasty","argued that a ruler who violates the people's rights may be replaced","called for the abolition of private property"],"why":["Locke supported toleration for Protestants and opposed a Catholic monarch.","That is Hobbes's argument in Leviathan (1651).","That was the position Locke attacked (Filmer's Patriarcha).","Locke's case for government by consent justified removing James II.","Locke made property a natural right."],"answer":3},"u1q30":{"id":"u1q30","unit":1,"diff":"h","pool":"exam2","stem":"<p>Which statement about the Habsburg monarchy after 1648 is most accurate?<\/p>","options":["It lost Hungary to the Ottomans in 1699","It adopted a constitutional monarchy like England's","It controlled the German states more tightly after Westphalia","It was a centralized nation-state with a single language","It was a multiethnic collection of territories held together by the dynasty, Catholicism and the army"],"why":["At Karlowitz (1699) the Ottomans ceded Hungary to Austria.","The Habsburgs ruled as absolutists where they could.","Westphalia weakened imperial control over the German princes.","The Habsburg lands were linguistically diverse and decentralized.","Austria, Bohemia and Hungary kept separate laws and estates under one ruler."],"answer":4},"u1q31":{"id":"u1q31","unit":1,"diff":"m","pool":"exam2","stem":"<p>The phrase \"one king, one law, one faith\" best summarizes the goals of<\/p>","options":["the Levellers","John Locke","the Dutch regents","Louis XIV","William of Orange"],"why":["The Levellers wanted wider rights, not royal uniformity.","Locke argued for limited government and toleration.","The regents governed a decentralized, tolerant republic.","His centralization and the 1685 revocation of the Edict of Nantes aimed at uniformity under the crown.","William ruled England under the Bill of Rights and supported toleration for Protestant dissenters."],"answer":3},"u1q32":{"id":"u1q32","unit":1,"diff":"e","pool":"exam1","stem":"<p>Who won the English Civil War?<\/p>","options":["William of Orange's Dutch army","The Royalists under Charles I","The Irish Catholic Confederation","The Scots under James II","The Parliamentarians, led militarily by Oliver Cromwell"],"why":["William's landing came in 1688, decades later.","Charles I lost and was executed in 1649.","The Irish were defeated by Cromwell in 1649–50.","James II reigned in 1685–88; he did not lead the Scots in the 1640s.","Cromwell's New Model Army defeated the Royalists by 1646 and again in 1648."],"answer":4},"u1q33":{"id":"u1q33","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which feature distinguished the English Restoration settlement of 1660 from the monarchy before 1640?<\/p>","options":["Cromwell's Protectorate continued alongside the king","Divine right was written into law","Parliament kept its control over taxation and could not be ignored by the king","The monarch was now elected by Parliament","Catholicism became the state religion"],"why":["The Protectorate ended in 1659.","The settlement limited royal power in practice.","The monarchy returned, but the crown could no longer rule and tax without Parliament.","The crown remained hereditary; Charles II was the son of Charles I.","The Church of England was restored, and the Test Act excluded Catholics from office."],"answer":2},"u1q34":{"id":"u1q34","unit":1,"diff":"h","pool":"exam1","stem":"<p>Which comparison of Peter the Great and Louis XIV is most accurate?<\/p>","options":["Both revoked edicts of religious toleration for Protestants","Both lost their thrones in revolutions","Both strengthened royal power by bringing nobles and the church under tighter state control","Both modeled their reforms on the Dutch republican constitution","Both ruled through powerful elected parliaments"],"why":["Only Louis did this, in 1685.","Both died as reigning monarchs.","Louis used Versailles and Gallican control; Peter used service ranks and the Holy Synod.","Peter admired Dutch shipbuilding, not republicanism; Louis invaded the Dutch.","Neither shared power with a parliament."],"answer":2}},"pools":{"diag":["u1q24","u1q7"],"exam1":["u1q1","u1q15","u1q28","u1q32","u1q11","u1q13","u1q20","u1q34","u1q6","u1q21"],"exam2":["u1q31","u1q33","u1q17","u1q22","u1q18","u1q9","u1q30","u1q27","u1q5","u1q4"]}};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (c, t) => (t ? Math.round((100 * c) / t) : 0);
const LETTERS = ["A", "B", "C", "D", "E"];
const UNITS = DATA.units;
const Q = DATA.questions;
const unitById = (id) => UNITS.find((u) => u.id === +id);
const dayNum = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5);
const isoDate = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const fmtH = (h) => (h < 1 ? Math.round(h * 60) + " min" : (Math.round(h * 10) / 10).toFixed(1).replace(/\.0$/, "") + " h");
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600); }
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ---------- storage (always wrapped: works with storage blocked) ---------- */
const KEY = "clep-wc2-guide-v1";
const EXAM_MINUTES = DATA.meta.format.time_minutes || 90;
const BOX_DAYS = [0, 0, 1, 3, 7, 14]; // Leitner box -> days until next review
function fresh() {
  return { v: 1, theme: "system", diag: null, units: {}, cards: {}, mistakes: {}, exams: {}, plan: { hours: 2, date: "", start: "" }, created: isoDate() };
}
let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    return Object.assign(fresh(), JSON.parse(raw));
  } catch (e) { storageOK = false; return fresh(); }
}
let ST = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(ST)); storageOK = true; }
  catch (e) { storageOK = false; }
}
const U = (id) => (ST.units[id] = ST.units[id] || { read: false, quiz: [] });

/* ---------- derived progress ---------- */
function quizBest(id) { const q = U(id).quiz; return q.length ? Math.max(...q.map((r) => r.score / r.total)) : null; }
function diagRec(id) {
  if (!ST.diag) return null;
  const [c, t] = ST.diag.byUnit[id] || [0, 0];
  if (!t) return null;
  const p = c / t;
  return p >= 0.75 ? "skim" : p >= 0.5 ? "review" : "study";
}
function cardStats(unitId) {
  const cards = unitId ? unitById(unitId).cards : UNITS.flatMap((u) => u.cards);
  let mastered = 0, seen = 0, due = 0;
  const today = dayNum();
  for (const c of cards) {
    const s = ST.cards[c.id];
    if (s) { seen++; if (s.box >= 3) mastered++; if (s.due <= today) due++; }
  }
  return { total: cards.length, mastered, seen, due, fresh: cards.length - seen };
}
function unitStatus(id) {
  const u = U(id), best = quizBest(id);
  const passed = best !== null && best >= 0.7;
  if (passed && (u.read || diagRec(id) === "skim")) return "done";
  if (u.read || u.quiz.length) return "prog";
  return "todo";
}
function unitRemainingHours(unit) {
  const u = U(unit.id), best = quizBest(unit.id), cs = cardStats(unit.id);
  let left = 1 - (u.read ? 0.4 : 0) - (best !== null && best >= 0.7 ? 0.4 : 0) - 0.2 * (cs.total ? cs.mastered / cs.total : 0);
  const factor = diagRec(unit.id) === "skim" ? 0.5 : 1;
  return Math.max(0, unit.hours * factor * left);
}
const EXTRA = { diag: 0.5, exam: 2.5, final: 2 };
function hoursLeft() {
  let h = UNITS.reduce((s, u) => s + unitRemainingHours(u), 0);
  if (!ST.diag) h += EXTRA.diag;
  for (const k of ["exam1", "exam2"]) if (!(ST.exams[k] && ST.exams[k].status === "done")) h += EXTRA.exam;
  if (!(ST.exams.exam2 && ST.exams.exam2.status === "done")) h += EXTRA.final;
  return h;
}
const totalPlannedHours = () => UNITS.reduce((s, u) => s + u.hours, 0) + EXTRA.diag + 2 * EXTRA.exam + EXTRA.final;
function examScore(k) { const e = ST.exams[k]; return e && e.status === "done" ? e.score / e.total : null; }
function readiness() {
  const s1 = examScore("exam1"), s2 = examScore("exam2");
  return { s1, s2, ready: s1 !== null && s2 !== null && s1 >= 0.75 && s2 >= 0.75 };
}

/* ---------- mistakes ---------- */
function recordAnswer(qid, correct) {
  const m = ST.mistakes[qid];
  if (!correct) {
    ST.mistakes[qid] = { n: (m ? m.n : 0) + 1, last: isoDate(), streak: 0, cleared: false };
  } else if (m && !m.cleared) {
    m.streak = (m.streak || 0) + 1;
    if (m.streak >= 2) m.cleared = true;
  }
}
const openMistakes = () => Object.keys(ST.mistakes).filter((id) => Q[id] && !ST.mistakes[id].cleared);

/* ---------- router ---------- */
let S = { session: null, result: null, cardSession: null, confirm: null };
function route() { return (location.hash || "#home").slice(1) || "home"; }
function go(r) { if (route() === r) render(); else location.hash = r; }
window.addEventListener("hashchange", () => { closeMenu(); render(); window.scrollTo(0, 0); });

function navHTML() {
  const r = route();
  const cur = (x) => (r === x || r.startsWith(x + "-") ? ' aria-current="page"' : "");
  const mist = openMistakes().length;
  const due = cardStats().due;
  const item = (h, label, extra = "") => `<a href="#${h}"${cur(h)}><span class="u-name">${label}</span>${extra}</a>`;
  let s = item("home", "Dashboard") + item("diagnostic", "Diagnostic test", ST.diag ? '<span class="chip good">done</span>' : "");
  s += '<div class="nav-label">Units</div>';
  for (const u of UNITS) {
    const st = unitStatus(u.id);
    s += `<a href="#unit-${u.id}"${r === "unit-" + u.id ? ' aria-current="page"' : ""} title="${esc(u.title)}"><span class="u-no">${u.id}</span><span class="u-name">${esc(u.short)}</span><span class="dot ${st}" aria-label="${st === "done" ? "complete" : st === "prog" ? "in progress" : "not started"}"></span></a>`;
  }
  s += '<div class="nav-label">Practice</div>';
  s += item("cards", "Flashcards", due ? `<span class="chip accent num">${due} due</span>` : "");
  s += item("mistakes", "Mistake log", mist ? `<span class="chip bad num">${mist}</span>` : "");

}

function render() {
  const r = route();

    // An exam clock is running: keep the way back obvious.
    html = `<div class="notice bad no-print">Practice ${running === "exam1" ? "Exam 1" : "Exam 2"} is running and the clock does not stop. <a href="#session" data-act="resume-exam" data-k="${running}">Return to the exam</a></div>`;
  } else html = "";

  else if (/^unit-\d+$/.test(r) && unitById(r.slice(5))) html += viewUnit(unitById(r.slice(5)));

  else if (r === "result") html += viewResult();

  else if (r === "mistakes") html += viewMistakes();

}
