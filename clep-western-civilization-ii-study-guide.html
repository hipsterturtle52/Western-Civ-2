bits after 1600.","Newton explained why planets orbit (gravity) in 1687.","His On the Revolutions of the Heavenly Spheres put the Sun at the center.","Galileo supported heliocentrism with evidence after 1610, but did not first propose it.","Ptolemy was the ancient author of the Earth-centered model."],"answer":2},"u3q2":{"id":"u3q2","unit":3,"diff":"e","pool":"exam1","stem":"<p>Isaac Newton's Principia (1687) is best known for<\/p>","options":["arguing for the divine right of kings","defending the Earth-centered universe","describing the circulation of the blood","proving that the human mind is a blank slate at birth","universal gravitation and the laws of motion"],"why":["Principia is a work of physics.","Newton's work confirmed the Sun-centered system.","That was William Harvey (1628).","That is Locke's Essay (1690).","It showed that one set of physical laws governs both the heavens and the Earth."],"answer":4},"u3q3":{"id":"u3q3","unit":3,"diff":"e","pool":"exam2","stem":"<p>Which thinker is associated with the statement \"I think, therefore I am\"?<\/p>","options":["Francis Bacon","Thomas Hobbes","John Locke","René Descartes","Blaise Pascal"],"why":["Bacon emphasized observation and experiment.","Hobbes is known for Leviathan.","Locke is known for empiricism and natural rights.","It comes from his Discourse on Method (1637), the starting point of his rationalism.","Pascal is known for his religious Pensées and mathematics."],"answer":3},"u3q4":{"id":"u3q4","unit":3,"diff":"e","pool":"diag","stem":"<p>According to Thomas Hobbes, people in the state of nature live lives that are<\/p>","options":["peaceful and guided by natural rights","\"solitary, poor, nasty, brutish, and short\"","organized into democratic assemblies","governed by the divine right of kings","noble and uncorrupted by civilization"],"why":["That is closer to Locke's view.","Hobbes used this bleak picture to argue for an all-powerful sovereign.","Hobbes's state of nature has no government at all.","Hobbes based authority on a social contract, not on God.","That is Rousseau's idea of the noble savage, from the 1700s."],"answer":1},"u3q5":{"id":"u3q5","unit":3,"diff":"e","pool":"quiz","stem":"<p>Galileo's telescope observations included<\/p>","options":["moons orbiting Jupiter","the law of universal gravitation","bacteria in drops of water","the elliptical shape of planetary orbits","the planet Neptune"],"why":["These showed that not every heavenly body circles the Earth.","That was Newton's work.","Leeuwenhoek saw microorganisms with a microscope.","Kepler discovered elliptical orbits by calculation.","Neptune was discovered in 1846."],"answer":0},"u3q6":{"id":"u3q6","unit":3,"diff":"e","pool":"quiz","stem":"<p>Francis Bacon promoted which approach to knowledge?<\/p>","options":["Accepting truths revealed in dreams, visions and prophecy","Deduction from self-evident first principles","Reliance on the authority of Aristotle","Ignoring practical uses of science","Induction from observation and experiment"],"why":["Bacon demanded empirical evidence.","That is Descartes's rationalism.","Bacon attacked uncritical reliance on ancient authority.","Bacon insisted knowledge should be useful.","Bacon's Novum Organum urged experimental investigation of nature."],"answer":4},"u3q7":{"id":"u3q7","unit":3,"diff":"e","pool":"exam2","stem":"<p>William Harvey's major contribution was<\/p>","options":["developing a smallpox vaccine","the discovery of oxygen","the law of gases relating pressure and volume in a container","showing that the heart circulates the blood","the first heliocentric model"],"why":["Jenner developed it in 1796.","Oxygen was identified in the 1770s.","That is Boyle's law.","His 1628 work overturned Galen's theory of blood.","That was Copernicus."],"answer":3},"u3q8":{"id":"u3q8","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which statement best contrasts Hobbes and Locke?<\/p>","options":["Hobbes wanted an absolute sovereign; Locke allowed revolt against rulers who violate rights","Hobbes supported the divine right of kings, while Locke supported absolute monarchy","Both believed rebellion against any government is always justified, whatever its conduct","Both rejected the idea of a social contract","Hobbes defended democracy; Locke defended dictatorship"],"why":["This is the core difference between Leviathan and the Two Treatises.","Hobbes used a social contract, not divine right, and Locke opposed absolutism.","Hobbes denied any right of rebellion.","Both built their theories on a social contract.","Neither description fits."],"answer":0},"u3q9":{"id":"u3q9","unit":3,"diff":"m","pool":"quiz","stem":"<p>Kepler's laws of planetary motion depended most on<\/p>","options":["Newton's law of universal gravitation","Ptolemy's model of epicycles","Tycho Brahe's precise observations","Galileo's experiments with falling bodies","Church records of eclipses kept by monasteries since the Middle Ages"],"why":["Newton came after Kepler and explained his laws.","Kepler replaced epicycles.","Kepler, Brahe's assistant, used his records of Mars to discover elliptical orbits.","Those concerned motion on Earth.","Kepler's key source was Brahe's modern observations."],"answer":2},"u3q10":{"id":"u3q10","unit":3,"diff":"m","pool":"quiz","stem":"<p>Galileo's trial before the Inquisition in 1633 resulted from<\/p>","options":["his claim that the Earth stood still at the center of the universe","his defense of the Copernican system in print","his dissection of human corpses","his support of the Protestant Reformation","his invention of calculus"],"why":["Galileo argued the opposite.","The Church saw the book as defying its 1616 order not to teach heliocentrism as fact.","That was Vesalius's method in anatomy.","Galileo remained a Catholic.","Calculus was developed later by Newton and Leibniz."],"answer":1},"u3q11":{"id":"u3q11","unit":3,"diff":"m","pool":"exam2","stem":"<p>John Locke's concept of the tabula rasa implied that<\/p>","options":["humans are born with knowledge of God and of morality","kings rule by divine right","reason is useless without revelation","social classes are fixed by birth","education and environment shape people"],"why":["Locke rejected innate ideas.","Tabula rasa is a theory of knowledge, not of kingship.","Locke valued reason and experience.","The idea undermined claims of inborn superiority.","If people are shaped by experience, better institutions could make better people."],"answer":4},"u3q12":{"id":"u3q12","unit":3,"diff":"m","pool":"diag","stem":"<p>Which of the following pairs a thinker with the correct idea?<\/p>","options":["Descartes: knowledge comes only from sense experience","Hobbes: people have a right to overthrow unjust rulers","Hugo Grotius: natural law governs relations between nations","Bacon: the Earth is the center of the universe","Vesalius: planets move in ellipses"],"why":["That is empiricism; Descartes was a rationalist.","That is Locke; Hobbes denied any such right.","Grotius's On the Law of War and Peace founded international law.","Bacon did not defend geocentrism.","Vesalius was an anatomist; Kepler discovered ellipses."],"answer":2},"u3q13":{"id":"u3q13","unit":3,"diff":"m","pool":"exam1","stem":"<p>The founding of the Royal Society of London and the French Academy of Sciences in the 1660s shows that<\/p>","options":["governments and elites had begun to sponsor and organize scientific research","science was considered a threat to every monarchy","women were admitted as full members of scientific bodies","the Catholic Church controlled scientific research in England","universities had become the main centers of scientific innovation"],"why":["State-backed academies gave science institutional prestige and support.","Monarchs such as Charles II and Louis XIV supported these bodies.","Women were excluded; Margaret Cavendish was only a visitor.","England was Protestant, and the Royal Society was independent of Rome.","Much innovation happened outside the conservative universities."],"answer":0},"u3q14":{"id":"u3q14","unit":3,"diff":"m","pool":"exam1","stem":"<blockquote>\"The heavens are perfect and unchanging; the Earth, at the center, is the realm of change and decay.\"<\/blockquote><p>Which observation most directly challenged this view?<\/p>","options":["Boyle's experiments with gases","Descartes's development of analytic geometry","Harvey's discovery of the circulation of the blood","Galileo's sighting of mountains and craters on the Moon","Locke's argument for a tabula rasa"],"why":["These concerned chemistry.","This was a mathematical tool, not an observation.","This concerned anatomy, not the heavens.","An uneven, Earth-like Moon showed that heavenly bodies were not perfect.","This concerned human knowledge."],"answer":3},"u3q15":{"id":"u3q15","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which of the following best describes the \"clockmaker\" view of God that many drew from Newton's work?<\/p>","options":["God personally moves each planet every day","The universe has no creator","God punishes scientists who question the Church","God designed a universe that runs by natural law","God reveals scientific truths only through scripture and the Church"],"why":["The clockmaker image implies a self-running machine.","The clockmaker image presupposes a designer.","This is not what the metaphor means.","This deist image follows from the Newtonian machine universe.","Newtonian science relied on observation and mathematics."],"answer":3},"u3q16":{"id":"u3q16","unit":3,"diff":"m","pool":"exam2","stem":"<p>Vesalius's work in anatomy and Copernicus's work in astronomy, both published in 1543, had in common that they<\/p>","options":["were written to support the Protestant Reformation","relied on the telescope","were immediately accepted by all the universities of Europe","proved the law of universal gravitation","challenged ancient authorities such as Galen and Ptolemy"],"why":["Neither was a religious tract.","The telescope was not used in astronomy until 1609.","Acceptance came slowly.","That was Newton in 1687.","Both books corrected classical authorities through direct study."],"answer":4},"u3q17":{"id":"u3q17","unit":3,"diff":"m","pool":"exam2","stem":"<p>Which work was written in part to justify the Glorious Revolution?<\/p>","options":["Locke's Two Treatises","Newton's Principia","Descartes's Discourse on Method","Bacon's Novum Organum","Hobbes's Leviathan"],"why":["Locke defended the replacement of James II as resistance to a ruler who violated the people's rights.","That is a work of physics.","That is a 1637 work of philosophy written in France.","That was a 1620 treatise on scientific method.","Leviathan appeared in 1651 and defended strong sovereign power."],"answer":0},"u3q18":{"id":"u3q18","unit":3,"diff":"m","pool":"exam1","stem":"<p>Pierre Bayle's Historical and Critical Dictionary (1697) contributed to the new view of society by<\/p>","options":["defending the persecution of religious minorities by the state","reviving Aristotle's physics","applying skepticism to religious claims","calling for a return to absolute monarchy","proving the existence of witches"],"why":["Bayle, a Huguenot exile, argued for toleration.","Bayle was a critic, not a defender, of old authorities.","Bayle insisted no belief should be accepted without evidence.","His work was critical, not a political program for absolutism.","Bayle's skepticism helped end belief in witchcraft."],"answer":2},"u3q19":{"id":"u3q19","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which development of the Scientific Revolution came LAST?<\/p>","options":["Galileo's trial before the Inquisition","Publication of Hobbes's Leviathan","Publication of Newton's Principia","Harvey's work on the circulation of the blood","Publication of Copernicus's On the Revolutions"],"why":["Galileo's trial before the Inquisition dates from 1633, earlier than 1687.","Publication of Hobbes's Leviathan dates from 1651, earlier than 1687.","Publication of Newton's Principia dates from 1687, the latest of the five.","Harvey's work on the circulation of the blood dates from 1628, earlier than 1687.","Publication of Copernicus's On the Revolutions dates from 1543, earlier than 1687."],"answer":2},"u3q20":{"id":"u3q20","unit":3,"diff":"h","pool":"exam2","stem":"<p>A historian argues that the Scientific Revolution changed how educated Europeans decided what was true. Which change best supports this?<\/p>","options":["The Catholic Church immediately endorsed Galileo's work in astronomy","Most peasants accepted heliocentrism by 1700","Scientists rejected all belief in God","Universities stopped teaching Latin","Evidence and experiment replaced ancient authority"],"why":["The Church condemned Galileo in 1633.","The new science spread mainly among elites.","Most leading scientists, including Newton, were religious.","Latin remained the language of scholarship.","This change of method, more than any single discovery, defines the revolution."],"answer":4},"u3q21":{"id":"u3q21","unit":3,"diff":"h","pool":"exam2","stem":"<p>Which of the following was a weakness of Copernicus's original model?<\/p>","options":["It was based on Newton's flawed equations","It relied on telescope observations later shown to be faulty","It placed the Earth at the center of the universe","It kept circular orbits, so it was no more accurate","It denied the existence of the planets"],"why":["Newton came more than a century later.","Copernicus had no telescope.","Copernicus placed the Sun at the center.","Accuracy improved only when Kepler introduced ellipses.","It described the known planets orbiting the Sun."],"answer":3},"u3q22":{"id":"u3q22","unit":3,"diff":"h","pool":"exam1","stem":"<p>Hobbes's political conclusions were most directly shaped by<\/p>","options":["his experience as a minister of Louis XIV","the Glorious Revolution of 1688","the revocation of the Edict of Nantes","the disorder of the English Civil War","the French Revolution"],"why":["Hobbes was English and never served Louis XIV.","Leviathan was published in 1651, decades earlier.","That came in 1685, long after Leviathan.","Having lived through civil war, he valued order above liberty.","The French Revolution came more than a century later."],"answer":3},"u3q23":{"id":"u3q23","unit":3,"diff":"h","pool":"quiz","stem":"<p>The combination of Bacon's and Descartes's approaches is significant because<\/p>","options":["the scientific method joins experiment and mathematics","both men rejected experiment entirely","both men defended the authority of Aristotle","their ideas led directly to the revocation of the Edict of Nantes","Descartes's dualism proved that Bacon's method of induction was invalid"],"why":["Newton's work showed how experiment and mathematics together produce reliable laws.","Bacon championed experiment.","Both attacked reliance on Aristotle.","The revocation was a religious-political act by Louis XIV.","Neither method disproved the other."],"answer":0},"u3q24":{"id":"u3q24","unit":3,"diff":"h","pool":"exam1","stem":"<p>Which statement about women in the Scientific Revolution is most accurate?<\/p>","options":["Women were barred by law from all forms of scientific activity","Women founded the French Academy of Sciences","Women led the opposition to heliocentrism","Some women did science but were kept out of academies","Women held most of the seats in the Royal Society"],"why":["No such law existed; women worked in households and family observatories.","It was founded under Louis XIV's minister Colbert.","There is no evidence of this.","Maria Winkelmann was denied an academy post despite discovering a comet.","Women were not admitted as fellows until 1945."],"answer":3},"u3q25":{"id":"u3q25","unit":3,"diff":"h","pool":"quiz","stem":"<p>Which development helped end the European witch hunts by around 1700?<\/p>","options":["Elites adopted a skeptical, mechanistic worldview","The discovery of the circulation of the blood","The Treaty of Utrecht's ban on church courts across Europe","Newton's personal campaign against witch trials","The Catholic Church's adoption of heliocentrism"],"why":["Judges and officials stopped accepting accusations as the new science spread.","Harvey's work did not address witchcraft.","Utrecht contained no such provision.","Newton led no such campaign.","The Church did not endorse heliocentrism in this period."],"answer":0},"u3q26":{"id":"u3q26","unit":3,"diff":"m","pool":"quiz","stem":"<p>A thinker who says the mind is like a blank sheet of paper and that all knowledge comes from experience is expressing<\/p>","options":["mercantilism, as in Colbert","geocentrism, as in Ptolemy","rationalism, as in Descartes's Discourse on Method","divine-right theory, as in Bossuet","empiricism, as in Locke's Essay"],"why":["That is an economic doctrine.","That is a cosmology.","Descartes believed in innate ideas known by reason.","That concerns monarchy, not knowledge.","Locke's empiricism grounded all knowledge in experience."],"answer":4},"u4q1":{"id":"u4q1","unit":4,"diff":"e","pool":"exam1","stem":"<p>Which German Jewish philosopher argued that Jews could be full participants in European culture and loyal citizens?<\/p>","options":["Martin Luther","Johann Gottfried Herder","Immanuel Kant","Karl Marx","Moses Mendelssohn"],"why":["Luther was a sixteenth-century reformer.","Herder wrote on national culture and language.","Kant was a Prussian philosopher, not Jewish.","Marx was a nineteenth-century socialist.","Mendelssohn was a leading voice of the Jewish Enlightenment (Haskalah)."],"answer":4},"u4q2":{"id":"u4q2","unit":4,"diff":"e","pool":"exam1","stem":"<p>Most philosophes were best described as<\/p>","options":["reformers more than democrats","supporters of the divine right of kings","defenders of the Catholic Church's political power","opponents of all scientific inquiry","revolutionaries who demanded immediate democracy"],"why":["Many, like Voltaire, hoped for an enlightened monarch rather than popular rule.","They judged government by reason and utility.","They generally attacked clerical power.","They were enthusiastic about science.","Few philosophes before 1789 called for full democracy."],"answer":0},"u4q3":{"id":"u4q3","unit":4,"diff":"e","pool":"exam2","stem":"<p>Which Enlightenment thinker argued for the separation of powers into legislative, executive and judicial branches?<\/p>","options":["Voltaire","Beccaria","Rousseau","Adam Smith","Montesquieu"],"why":["Voltaire is best known for toleration and satire.","Beccaria wrote on criminal justice.","Rousseau stressed the general will and popular sovereignty.","Smith wrote on economics.","The Spirit of the Laws (1748) made the separation of powers famous."],"answer":4},"u4q4":{"id":"u4q4","unit":4,"diff":"e","pool":"quiz","stem":"<p>Adam Smith's The Wealth of Nations (1776) argued that<\/p>","options":["governments should hoard gold and silver by means of high tariffs","the state should set all prices and wages","workers should own the means of production","colonies are the only true source of wealth","free markets and competition create prosperity"],"why":["That is mercantilism, which Smith criticized.","Smith opposed such controls.","That is socialism, which came later.","Smith saw labor and productivity as the sources of wealth.","Smith attacked mercantilist controls and favored laissez-faire."],"answer":4},"u4q5":{"id":"u4q5","unit":4,"diff":"e","pool":"exam2","stem":"<p>The opening line \"Man is born free, and everywhere he is in chains\" comes from<\/p>","options":["Marx's Communist Manifesto","Voltaire's Candide","Hobbes's Leviathan","Locke's Two Treatises of Government","Rousseau's The Social Contract"],"why":["The Manifesto ends \"Workers of the world, unite!\" and dates from 1848.","Candide is a satirical novel about optimism.","Hobbes described life in the state of nature as \"nasty, brutish, and short.\"","Locke wrote about natural rights but not this line.","The 1762 work argued that legitimate government must express the general will."],"answer":4},"u4q6":{"id":"u4q6","unit":4,"diff":"e","pool":"quiz","stem":"<p>Cesare Beccaria's On Crimes and Punishments (1764) called for<\/p>","options":["rule by the Catholic Inquisition","harsher punishments for religious dissenters","the abolition of all prisons","the restoration of trial by ordeal","an end to torture and the death penalty"],"why":["Beccaria criticized arbitrary courts.","Beccaria opposed cruelty and arbitrariness.","Beccaria favored proportionate punishment, not abolishing prisons.","Beccaria favored rational justice.","Beccaria argued punishments should prevent crime, not inflict cruelty."],"answer":4},"u4q7":{"id":"u4q7","unit":4,"diff":"e","pool":"exam1","stem":"<p>Who edited the Encyclopedia, a major summary of Enlightenment knowledge?<\/p>","options":["Isaac Newton","Catherine the Great","Adam Smith","Immanuel Kant","Denis Diderot"],"why":["Newton died in 1727 and was a scientist, not an encyclopedist.","Catherine was a patron of Diderot but not the editor.","Smith wrote The Wealth of Nations.","Kant was a German philosopher.","Diderot and d'Alembert led the project from 1751 to 1772."],"answer":4},"u4q8":{"id":"u4q8","unit":4,"diff":"e","pool":"exam2","stem":"<p>Which ruler was an \"enlightened despot\"?<\/p>","options":["Charles I of England","William III of England","Oliver Cromwell","Louis XIV of France","Frederick II of Prussia"],"why":["Charles was a divine-right Stuart king executed in 1649.","William was a constitutional monarch.","Cromwell ruled England in the 1650s, before the Enlightenment.","Louis XIV was an absolutist before the Enlightenment.","He corresponded with Voltaire, abolished torture and promoted toleration while keeping absolute power."],"answer":4},"u4q9":{"id":"u4q9","unit":4,"diff":"e","pool":"diag","stem":"<p>Mary Wollstonecraft's A Vindication of the Rights of Woman argued that<\/p>","options":["women's suffrage had already been won in Britain and France","women should rule as absolute monarchs","women should be confined to domestic life","women should not be allowed to read novels","women deserve the same education as men"],"why":["British women gained the vote only in 1918 and 1928.","She wrote about rights and education, not monarchy.","That was Rousseau's view, which she attacked.","Her argument centered on education and reason.","She blamed women's apparent inferiority on lack of education."],"answer":4},"u4q10":{"id":"u4q10","unit":4,"diff":"m","pool":"exam1","stem":"<p>Joseph II of Austria's reforms differed from those of Frederick II and Catherine II in that Joseph<\/p>","options":["shared power with an elected parliament of nobles and townsmen","strengthened the privileges of the nobility","ignored Enlightenment ideas completely","abolished serfdom, though most reforms were reversed","refused to grant any religious toleration"],"why":["Joseph remained an absolute ruler.","That fits Catherine's Charter of the Nobility.","He was the most enthusiastic reformer of the three.","Joseph went further than other enlightened despots and paid for it.","His Edict of Toleration (1781) did the opposite."],"answer":3},"u4q11":{"id":"u4q11","unit":4,"diff":"m","pool":"exam2","stem":"<p>Catherine the Great's response to Pugachev's Rebellion (1773–1775) was to<\/p>","options":["abdicate in favor of her son","adopt Rousseau's general will as the basis of Russia's constitution","call an elected parliament with peasant representatives","emancipate the serfs to win their loyalty","side with the nobility and confirm its privileges"],"why":["She ruled until her death in 1796.","Catherine never adopted a constitution.","No such parliament was created.","Serfdom expanded under Catherine; emancipation came in 1861.","After the revolt she relied on nobles to keep order and expanded serfdom."],"answer":4},"u4q12":{"id":"u4q12","unit":4,"diff":"m","pool":"quiz","stem":"<p>The partitions of Poland in 1772, 1793 and 1795 were carried out by<\/p>","options":["Napoleon and his allies","the Holy Roman Emperor and the pope","Sweden and the Ottoman Empire","France, Britain and Spain","Russia, Prussia and Austria"],"why":["Napoleon later created the Duchy of Warsaw out of partitioned land.","The pope had no role.","Neither took part.","Western powers did not partition Poland.","All three took Polish land in 1772 and 1795; Russia and Prussia alone in 1793."],"answer":4},"u4q13":{"id":"u4q13","unit":4,"diff":"m","pool":"quiz","stem":"<p>Most philosophes held which view of religion?<\/p>","options":["That religion should control government","Polytheism based on classical gods","Puritan predestination","Deism","Strict Catholic orthodoxy"],"why":["Philosophes favored toleration and limits on clerical power.","This was not a significant Enlightenment position.","Philosophes rejected harsh dogma.","Many, like Voltaire, rejected miracles and church authority but believed in a creator.","Philosophes criticized the Church's power."],"answer":3},"u4q14":{"id":"u4q14","unit":4,"diff":"m","pool":"quiz","stem":"<p>Which of the following institutions did the MOST to spread Enlightenment ideas among elite men and women in Paris?<\/p>","options":["Salons","The Jesuit order","The Estates-General","The royal army","Guild workshops"],"why":["Salons brought together writers, nobles and officials to discuss new ideas.","The Jesuits generally defended the Church against the philosophes.","It did not meet between 1614 and 1789.","The army was not a vehicle for spreading ideas.","Guilds organized trades, not intellectual debate."],"answer":0},"u4q15":{"id":"u4q15","unit":4,"diff":"m","pool":"quiz","stem":"<blockquote>\"Political liberty is to be found only when there is no abuse of power. But constant experience shows us that every man invested with power is liable to abuse it... To prevent this abuse, it is necessary from the very nature of things that power should be a check to power.\"<\/blockquote><p>The author of this passage would most likely support<\/p>","options":["rule by the Catholic Church and its bishops","abolishing all government","a single elected assembly holding unlimited power","a constitution dividing power among branches","an absolute monarch ruling by divine right"],"why":["The passage concerns dividing power, not clerical rule.","The passage seeks to limit, not abolish, government.","That would concentrate power, not check it.","This is Montesquieu's argument for checks and balances.","The passage warns against unchecked power."],"answer":3},"u4q16":{"id":"u4q16","unit":4,"diff":"m","pool":"exam1","stem":"<p>Voltaire's campaign on behalf of Jean Calas illustrates his commitment to<\/p>","options":["the general will","the divine right of kings","the partition of Poland among its neighbors","mercantilist economics","toleration and fair trials"],"why":["That is Rousseau's concept.","Voltaire did not defend divine right.","The Calas case had nothing to do with Poland.","The Calas case was about justice and religion.","Calas, a Protestant, was executed after a trial shaped by anti-Protestant prejudice."],"answer":4},"u4q17":{"id":"u4q17","unit":4,"diff":"m","pool":"quiz","stem":"<p>Which statement about Rousseau distinguishes him from most other philosophes?<\/p>","options":["He believed private property was a natural right","He supported enlightened despotism","He opposed all forms of education","He was a devoted Catholic who defended the Church's political power","He valued emotion and nature over polished civilization"],"why":["Rousseau saw property as a source of inequality.","Rousseau favored popular sovereignty.","Emile is a treatise on education.","Rousseau was not a defender of Church power.","Rousseau's emphasis on feeling and natural man set him apart."],"answer":4},"u4q18":{"id":"u4q18","unit":4,"diff":"m","pool":"exam1","stem":"<p>The physiocrats differed from mercantilists in arguing that<\/p>","options":["colonies are the key to national power","the nobility should be abolished","land, not gold, is the source of wealth","governments should regulate all trade closely","manufacturing should be state-owned"],"why":["That is a mercantilist idea.","The physiocrats were not social revolutionaries.","Quesnay and the physiocrats also urged free trade in grain.","That is closer to mercantilism.","The physiocrats favored free markets."],"answer":2},"u4q19":{"id":"u4q19","unit":4,"diff":"m","pool":"exam2","stem":"<p>The liberum veto contributed to the partitions of Poland because it<\/p>","options":["required Poland to obey the Russian tsar in foreign affairs","banned Poland from having an army","let any one noble block laws","gave the Polish king absolute power","forced the Polish nobility to free their serfs"],"why":["It was a rule of the Polish parliament itself.","There was no such ban, though the army was small.","Poland could not raise taxes or armies to defend itself.","Polish kings were elected and weak.","It had nothing to do with serfdom."],"answer":2},"u4q20":{"id":"u4q20","unit":4,"diff":"m","pool":"diag","stem":"<p>Frederick II of Prussia described himself as<\/p>","options":["\"Emperor of the French\"","\"the state, it is I\"","\"God's lieutenant on earth\"","\"the first servant of the state\"","\"Lord Protector\""],"why":["That was Napoleon's title from 1804.","That line is attributed to Louis XIV.","That expresses Bossuet's divine-right theory.","He presented monarchy as a duty to serve the state, not a personal possession.","That was Cromwell's title."],"answer":3},"u4q21":{"id":"u4q21","unit":4,"diff":"m","pool":"exam1","stem":"<p>Which Enlightenment work was published FIRST?<\/p>","options":["Montesquieu's The Spirit of the Laws","Rousseau's The Social Contract","Beccaria's On Crimes and Punishments","Wollstonecraft's A Vindication of the Rights of Woman","Smith's The Wealth of Nations"],"why":["Montesquieu's The Spirit of the Laws dates from 1748, the earliest of the five.","Rousseau's The Social Contract dates from 1762, later than 1748.","Beccaria's On Crimes and Punishments dates from 1764, later than 1748.","Wollstonecraft's A Vindication of the Rights of Woman dates from 1792, later than 1748.","Smith's The Wealth of Nations dates from 1776, later than 1748."],"answer":0},"u4q22":{"id":"u4q22","unit":4,"diff":"h","pool":"quiz","stem":"<p>Which development best illustrates the limits of enlightened despotism?<\/p>","options":["Joseph II's grant of toleration to Protestants","Catherine II's expansion of serfdom","Diderot's completion of the Encyclopedia","Frederick II's abolition of judicial torture in Prussia","Kant's essay \"What Is Enlightenment?\""],"why":["This was a genuine reform.","Rulers took reforms that strengthened the state but kept the social order that supported them.","This was a philosophe's project, not a monarch's policy.","This was a real Enlightenment reform, not a limit.","Kant's essay is not an act of government."],"answer":1},"u4q23":{"id":"u4q23","unit":4,"diff":"h","pool":"exam2","stem":"<p>Kant's motto \"Dare to know!\" (Sapere aude) best captures the Enlightenment's emphasis on<\/p>","options":["the divine right of monarchs","using one's own reason","obedience to established religious and political authority","the collective will of the nation","emotion as the highest form of truth"],"why":["Kant's essay is about individual reason.","Kant defined enlightenment as leaving \"self-imposed immaturity.\"","Kant urged independence from guardians, including clergy.","That is closer to Rousseau or later nationalism.","That is a Romantic idea."],"answer":1},"u4q24":{"id":"u4q24","unit":4,"diff":"h","pool":"quiz","stem":"<p>An eighteenth-century reformer argues that a prisoner's guilt should be proven by evidence rather than a confession under torture, and that punishments should be certain but moderate. Which work most likely influenced him?<\/p>","options":["Hobbes's Leviathan","Bossuet's Politics Drawn from Holy Scripture","Beccaria's On Crimes and Punishments","Rousseau's Emile","Smith's The Wealth of Nations"],"why":["Hobbes defended absolute sovereign power, not legal reform.","Bossuet defended divine-right monarchy.","These are Beccaria's key arguments.","Emile concerns education.","Smith wrote on economics."],"answer":2},"u4q25":{"id":"u4q25","unit":4,"diff":"h","pool":"exam2","stem":"<p>Which outcome best shows Rousseau's general will being used to justify the suppression of individuals?<\/p>","options":["Jacobins silencing opponents in the people's name","Montesquieu's praise of the English constitution and its balance","Joseph II's Edict of Toleration","Catherine II's Charter of the Nobility","Adam Smith's support for free trade"],"why":["Robespierre and the Jacobins later invoked the general will to justify the Terror.","Montesquieu favored checks on power.","That expanded individual freedom.","That was a grant of privilege to nobles, not an appeal to the general will.","That is unrelated to the general will."],"answer":0},"u4q26":{"id":"u4q26","unit":4,"diff":"h","pool":"quiz","stem":"<p>Which statement best explains why the Enlightenment spread widely in the eighteenth century?<\/p>","options":["Most peasants attended universities","Rising literacy and cheap print created a reading public","The Catholic Church officially endorsed the philosophes","Governments everywhere abolished censorship","The partitions of Poland spread French culture eastward into Russia"],"why":["Universities served a small elite.","The public sphere of print, coffeehouses and salons carried ideas beyond small elites.","The Church condemned many of their works.","Censorship persisted, especially in France.","The partitions were acts of power politics."],"answer":1},"u4q27":{"id":"u4q27","unit":4,"diff":"m","pool":"exam1","stem":"<p>Joseph II's Edict of Toleration (1781) granted<\/p>","options":["control of all schools to the Catholic Church","toleration to non-Catholic Christians","the vote to all adult men","independence to Hungary","nobles a permanent exemption from all taxation"],"why":["Joseph reduced Church power.","It extended toleration beyond Catholicism.","There was no democratic suffrage.","Hungary remained under Habsburg rule.","Joseph tried to tax nobles more fairly."],"answer":1},"u4q28":{"id":"u4q28","unit":4,"diff":"h","pool":"diag","stem":"<p>The partition of Poland most directly contradicts the claim that enlightened despots<\/p>","options":["were absolute rulers","strengthened their states","governed by reason, not power politics","were interested in domestic reform","read and corresponded with Enlightenment authors"],"why":["They were absolute rulers.","The partitions did strengthen their states.","Frederick, Catherine and Joseph seized a neighbor's land for gain.","All three made genuine reforms at home.","All three did."],"answer":2},"u4q29":{"id":"u4q29","unit":4,"diff":"e","pool":"quiz","stem":"<p>The salon hostesses of eighteenth-century Paris, such as Madame Geoffrin, were important because they<\/p>","options":["commanded French armies in the Seven Years' War","ran the royal treasury","wrote the French constitution of 1791","controlled the appointment of bishops in France","hosted gatherings where ideas were debated"],"why":["Women did not command armies.","They held no state office.","The National Assembly wrote that constitution.","They had no Church authority.","Salons were key meeting places of the Republic of Letters."],"answer":4},"u4q30":{"id":"u4q30","unit":4,"diff":"m","pool":"exam2","stem":"<p>Which pair correctly matches a thinker with a work?<\/p>","options":["Smith – The Spirit of the Laws","Beccaria – Emile","Rousseau – The Wealth of Nations","Voltaire – Candide","Montesquieu – The Social Contract"],"why":["Montesquieu wrote The Spirit of the Laws.","Rousseau wrote Emile.","Adam Smith wrote The Wealth of Nations.","Candide (1759) satirizes the claim that this is \"the best of all possible worlds.\"","Rousseau wrote The Social Contract."],"answer":3},"u4q31":{"id":"u4q31","unit":4,"diff":"h","pool":"exam1","stem":"<p>Which comparison of Locke and Rousseau is most accurate?<\/p>","options":["Both wrote before the Glorious Revolution","Locke stressed individual rights; Rousseau the general will","Locke supported democracy by majority vote of all citizens; Rousseau supported absolute monarchy","Both believed that private property was the root of all inequality among people","Both rejected the idea of a social contract"],"why":["Rousseau wrote in the 1750s and 1760s.","Locke's liberalism centers on the individual; Rousseau's theory centers on collective sovereignty.","Rousseau favored popular sovereignty.","That was Rousseau's view, not Locke's.","Both built on a social contract."],"answer":1},"u4q32":{"id":"u4q32","unit":4,"diff":"m","pool":"exam2","stem":"<p>The Enlightenment idea that human institutions should be judged by reason and can be improved is closely linked to<\/p>","options":["the defense of judicial torture","the belief in progress","the revival of medieval guilds","the divine right of kings","the doctrine of original sin as unchangeable"],"why":["Philosophes attacked torture.","Philosophes believed reason could steadily improve society.","Philosophes generally criticized guild restrictions.","Divine right placed kingship beyond rational criticism.","Philosophes downplayed original sin."],"answer":1},"u4q33":{"id":"u4q33","unit":4,"diff":"e","pool":"quiz","stem":"<p>Voltaire's satirical novel Candide (1759) mocked<\/p>","options":["the separation of powers","free-market economics","naive optimism","the partition of Poland","the Scientific Revolution"],"why":["Voltaire did not attack Montesquieu's idea.","Candide is not about economics.","Candide's misfortunes ridicule this philosophy, associated with Leibniz.","Candide predates the partitions.","Voltaire popularized Newton's science."],"answer":2},"u4q34":{"id":"u4q34","unit":4,"diff":"m","pool":"exam2","stem":"<p>Which ruler's reforms were most resisted by nobles, clergy and non-German peoples, leading to their reversal?<\/p>","options":["Frederick II of Prussia","Joseph II of Austria","Louis XV of France","George III of Britain","Catherine II of Russia"],"why":["Frederick avoided challenging the Junkers.","His centralizing and anti-clerical reforms provoked revolts in Hungary and the Austrian Netherlands.","Louis XV was not a major reformer.","George III was a constitutional monarch.","Catherine accommodated the nobility."],"answer":1},"u4q35":{"id":"u4q35","unit":4,"diff":"h","pool":"exam1","stem":"<p>Which development MOST directly reflects the influence of Montesquieu?<\/p>","options":["The partitions of Poland","Catherine II's Charter of the Nobility","Adam Smith's critique of mercantilism and colonial monopolies","The U.S. Constitution's checks and balances","The Jacobin Reign of Terror"],"why":["These were acts of conquest.","That confirmed noble privilege.","That is economics, not constitutional design.","The framers cited Montesquieu more than any other modern author.","The Terror concentrated power rather than dividing it."],"answer":3},"u5q1":{"id":"u5q1","unit":5,"diff":"e","pool":"diag","stem":"<p>The immediate cause of Louis XVI's decision to call the Estates-General in 1789 was<\/p>","options":["royal bankruptcy","the execution of Marie Antoinette","the pope's demand for reform of the French church","Napoleon's coup d'état","a British invasion of France"],"why":["Debt and the privileged orders' refusal of new taxes forced the king to summon the Estates-General.","She was executed in 1793.","The papacy did not ask for the Estates-General.","Napoleon's coup came in 1799.","Britain did not invade France in 1789."],"answer":0},"u5q2":{"id":"u5q2","unit":5,"diff":"e","pool":"exam1","stem":"<p>On June 20, 1789, members of the Third Estate swore the Tennis Court Oath, vowing to<\/p>","options":["elect Napoleon Bonaparte as First Consul of the Republic","stay together until France had a constitution","declare war on Austria","execute the king","restore Louis XVI to his full absolute power"],"why":["Napoleon took power in 1799.","Locked out of their hall, the deputies of the new National Assembly met on a tennis court.","War came in April 1792.","The king was executed in 1793.","They were limiting royal power."],"answer":1},"u5q3":{"id":"u5q3","unit":5,"diff":"e","pool":"exam1","stem":"<p>The Declaration of the Rights of Man and of the Citizen (1789) proclaimed that<\/p>","options":["the king rules by divine right","women have equal political rights with men","nobles are exempt from taxes","men are born and remain free and equal in rights","the Catholic Church is the only legal religion in France"],"why":["It placed sovereignty in the nation.","Its failure to include women prompted Olympe de Gouges's response.","It required taxes to be shared according to means.","The Declaration set out natural rights and equality before the law.","It protected freedom of opinion, including religious opinion."],"answer":3},"u5q4":{"id":"u5q4","unit":5,"diff":"e","pool":"quiz","stem":"<p>The Reign of Terror is most closely associated with<\/p>","options":["Robespierre and the Committee of Public Safety","Metternich and the Congress of Vienna","Lafayette and the National Guard of Paris","Louis XVIII and the Bourbon Restoration","Napoleon and the Directory"],"why":["The Committee ran the Terror from 1793 to 1794.","Metternich opposed revolution.","Lafayette was a moderate who fled France in 1792.","The Restoration came in 1814.","Napoleon overthrew the Directory in 1799, years after the Terror."],"answer":0},"u5q5":{"id":"u5q5","unit":5,"diff":"e","pool":"exam2","stem":"<p>Napoleon's Civil Code (1804) did which of the following?<\/p>","options":["Abolished private property","Gave women equal rights with men","Made men equal before the law","Made Catholicism compulsory for all citizens","Restored the tax privileges of the nobility"],"why":["It strongly protected property.","It made wives legally subordinate to husbands.","The Code preserved key liberal gains of the Revolution.","It upheld religious freedom.","It confirmed the abolition of feudal privilege."],"answer":2},"u5q6":{"id":"u5q6","unit":5,"diff":"e","pool":"exam2","stem":"<p>Which battle in 1805 ended Napoleon's hopes of invading Britain?<\/p>","options":["Valmy","Austerlitz","Waterloo","Trafalgar","Leipzig"],"why":["Valmy (1792) stopped a Prussian invasion of France.","Austerlitz was a French land victory over Austria and Russia.","Waterloo (1815) was Napoleon's final defeat on land.","Nelson's destruction of the Franco-Spanish fleet gave Britain command of the seas.","Leipzig (1813) was a land battle in Germany."],"answer":3},"u5q7":{"id":"u5q7","unit":5,"diff":"e","pool":"quiz","stem":"<p>Napoleon's final defeat came at the Battle of<\/p>","options":["Waterloo in 1815","Austerlitz in 1805","Trafalgar in 1805","Borodino in 1812","Jena in 1806"],"why":["Wellington and Blücher defeated him during the Hundred Days.","Austerlitz was one of his greatest victories.","Trafalgar was a naval defeat, not his final one.","Borodino was a costly French victory before he entered Moscow.","Jena was his victory over Prussia."],"answer":0},"u5q8":{"id":"u5q8","unit":5,"diff":"e","pool":"quiz","stem":"<p>The principal architect of the Congress of Vienna was<\/p>","options":["Otto von Bismarck of Prussia","Metternich of Austria","Camillo di Cavour","Maximilien Robespierre","Napoleon Bonaparte"],"why":["Bismarck led Prussia in the 1860s.","Metternich hosted the Congress and shaped its conservative settlement.","Cavour unified Italy in the 1850s and 1860s.","Robespierre died in 1794.","Napoleon was the defeated enemy."],"answer":1},"u5q9":{"id":"u5q9","unit":5,"diff":"e","pool":"exam1","stem":"<p>The Continental System was Napoleon's attempt to<\/p>","options":["free the serfs of Russia","unite all the German states under Prussian leadership","ruin Britain by closing Europe to its trade","restore the Holy Roman Empire","establish a common European parliament in Paris"],"why":["Russian serfdom lasted until 1861.","Napoleon weakened Prussia.","The Berlin Decree of 1806 launched the blockade.","He abolished it in 1806.","No such parliament existed."],"answer":2},"u5q10":{"id":"u5q10","unit":5,"diff":"e","pool":"exam2","stem":"<p>Who led the slave revolution in Saint-Domingue that led to the independence of Haiti?<\/p>","options":["Georges Danton","Toussaint Louverture","Horatio Nelson","Simón Bolívar","Olympe de Gouges"],"why":["Danton was a Paris revolutionary leader.","He led the revolt and its armies until his capture in 1802; Haiti won independence in 1804.","Nelson was a British admiral.","Bolívar led independence movements in South America.","De Gouges was a French writer on women's rights."],"answer":1},"u5q11":{"id":"u5q11","unit":5,"diff":"e","pool":"quiz","stem":"<p>Which group made up about 97 percent of France's population before 1789?<\/p>","options":["The Second Estate","The First Estate","The sans-culottes alone","The émigrés","The Third Estate"],"why":["The nobility was about 2 percent.","The clergy was under 1 percent.","The sans-culottes were Parisian workers, only part of the Third Estate.","Émigrés were nobles who fled after 1789.","It included peasants, urban workers and the bourgeoisie."],"answer":4},"u5q12":{"id":"u5q12","unit":5,"diff":"e","pool":"quiz","stem":"<p>The storming of the Bastille on July 14, 1789, is significant because it<\/p>","options":["ended the Reign of Terror","began the war with Austria","showed the crowd would defend the Assembly by force","brought Napoleon to power","restored the king's absolute power over the Assembly"],"why":["The Terror ended in 1794.","War came in 1792.","Popular violence saved the Assembly from royal troops and made revolution irreversible.","Napoleon took power in 1799.","It weakened royal power."],"answer":2},"u5q13":{"id":"u5q13","unit":5,"diff":"e","pool":"exam2","stem":"<p>The Concordat of 1801 was an agreement between Napoleon and<\/p>","options":["Tsar Alexander I","the British government","Pope Pius VII","the Directory","the Jacobin Club"],"why":["Napoleon's treaty with Alexander was Tilsit (1807).","Peace with Britain was the Treaty of Amiens (1802).","It restored the Catholic Church in France under state supervision.","Napoleon overthrew the Directory.","The Jacobin Club was closed in 1794."],"answer":2},"u5q14":{"id":"u5q14","unit":5,"diff":"e","pool":"exam1","stem":"<p>The Congress of Vienna created the German Confederation, which was<\/p>","options":["a unified German empire ruled by the king of Prussia","a republic with a national parliament","a loose union led by Austria","a French puppet state","part of the Russian Empire"],"why":["German unification under Prussia came in 1871.","It had only a diet of state representatives.","It replaced Napoleon's Confederation of the Rhine and the old Holy Roman Empire.","It was designed to contain France.","It was dominated by Austria."],"answer":2},"u5q15":{"id":"u5q15","unit":5,"diff":"m","pool":"exam1","stem":"<p>Why did the voting method in the Estates-General become a crisis in 1789?<\/p>","options":["Voting by order let the privileged estates outvote the Third","The Third Estate wanted to vote by order to protect the peasants","The king insisted that only nobles could vote","The Estates-General voted to abolish itself and go home","The clergy refused to attend"],"why":["The Third Estate had as many deputies as the other two combined but would lose 2 to 1 by order.","The Third Estate wanted voting by head.","All three estates had deputies.","The Third Estate instead declared itself the National Assembly.","The clergy attended; many parish priests later joined the Third."],"answer":0},"u5q16":{"id":"u5q16","unit":5,"diff":"m","pool":"exam2","stem":"<p>The Civil Constitution of the Clergy (1790) was significant because it<\/p>","options":["restored the Church lands seized in 1789","split Catholics over the Revolution","was welcomed by the pope as a fair compromise with Rome","made Protestantism the official religion of France","ended the Revolution's conflict with the Church"],"why":["The lands stayed nationalized.","Requiring an oath split the clergy and fueled counter-revolution, notably in the Vendée.","Pope Pius VI condemned it.","It reorganized the Catholic Church.","It intensified that conflict."],"answer":1},"u5q17":{"id":"u5q17","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which event of the French Revolution came FIRST?<\/p>","options":["The declaration of war on Austria","The October Days march on Versailles","The Flight to Varennes","The levée en masse","The execution of Louis XVI"],"why":["The declaration of war on Austria dates from April 1792, later than October 1789.","The October Days march on Versailles dates from October 1789, the earliest of the five.","The Flight to Varennes dates from June 1791, later than October 1789.","The levée en masse dates from August 1793, later than October 1789.","The execution of Louis XVI dates from January 1793, later than October 1789."],"answer":1},"u5q18":{"id":"u5q18","unit":5,"diff":"m","pool":"quiz","stem":"<p>The levée en masse of 1793 was significant because it<\/p>","options":["abolished the French army","returned confiscated lands to the Church","gave women the right to vote","mobilized the whole nation for war","ended the war with Austria and Prussia on favorable terms"],"why":["It vastly expanded the army.","It concerned military mobilization.","Women did not gain the vote in France until 1944.","It marked the start of modern total war.","The war continued."],"answer":3},"u5q19":{"id":"u5q19","unit":5,"diff":"m","pool":"exam2","stem":"<p>Which statement best describes the Directory (1795–1799)?<\/p>","options":["A military government led by Robespierre","A weak, corrupt republic of property owners","A radical dictatorship that executed thousands","An absolute monarchy restored under Louis XVIII","A democratic government elected by all adult men and women"],"why":["Robespierre had been executed in 1794.","Its instability made Napoleon's coup possible.","That describes the Terror.","The Bourbons returned only in 1814.","Voting was limited to property owners."],"answer":1},"u5q20":{"id":"u5q20","unit":5,"diff":"m","pool":"exam2","stem":"<p>Which group was most likely to support the Jacobins in 1793?<\/p>","options":["Austrian diplomats","The Paris sans-culottes","Peasants of the Vendée","Émigré nobles","Refractory priests"],"why":["Austria was at war with the Republic.","Working-class Parisians backed radical measures like price controls.","The Vendée rose in royalist, Catholic revolt.","Émigrés sought to overthrow the Revolution.","Priests who refused the oath opposed the Revolution."],"answer":1},"u5q21":{"id":"u5q21","unit":5,"diff":"m","pool":"exam1","stem":"<p>Napoleon's use of plebiscites to approve his rise to power illustrates<\/p>","options":["his restoration of the Estates-General","his dependence on the pope","using votes to legitimize dictatorship","his alliance with the Jacobins","his commitment to parliamentary government and free debate"],"why":["He never restored it.","Plebiscites appealed to the people, not the Church.","Voters approved his constitutions, but real power stayed with him.","He suppressed Jacobins.","He reduced legislatures to rubber stamps."],"answer":2},"u5q22":{"id":"u5q22","unit":5,"diff":"m","pool":"exam1","stem":"<blockquote>\"If the basis of popular government in time of peace is virtue, its basis in time of revolution is both virtue and terror: virtue, without which terror is murderous; terror, without which virtue is powerless.\"<\/blockquote><p>The speaker was most likely<\/p>","options":["Napoleon Bonaparte, explaining the Civil Code","Metternich, defending the Concert of Europe","Louis XVI, addressing the Estates-General","Maximilien Robespierre, justifying the Reign of Terror","Edmund Burke, attacking the French Revolution"],"why":["Napoleon did not speak of terror and virtue this way.","Metternich opposed revolutionary terror.","The king did not justify revolutionary terror.","Robespierre gave this argument in February 1794.","Burke condemned the Revolution's violence."],"answer":3},"u5q23":{"id":"u5q23","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which of the following was a major cause of Napoleon's downfall?<\/p>","options":["His defeat at Austerlitz","The success of the Continental System in ruining Britain","His alliance with Britain after 1807","The disastrous invasion of Russia in 1812","His refusal to fight in Spain"],"why":["Austerlitz was a great victory.","The system failed and alienated Europe.","Britain remained his enemy.","He lost most of his Grand Army, encouraging a new coalition.","He invaded Spain in 1808."],"answer":3},"u5q24":{"id":"u5q24","unit":5,"diff":"m","pool":"diag","stem":"<p>The Peninsular War (1808–1814) is significant because it<\/p>","options":["ended with France annexing Portugal and Spain permanently","was fought between Prussia and Russia","caused the abolition of the Holy Roman Empire","showed guerrilla resistance could drain his armies","led to Napoleon's coronation as emperor"],"why":["The French were driven out.","It was fought in Spain and Portugal.","That was in 1806, before the war.","Spanish guerrillas and Wellington's army tied down hundreds of thousands of French troops.","He was crowned in 1804."],"answer":3},"u5q25":{"id":"u5q25","unit":5,"diff":"m","pool":"exam2","stem":"<p>The Congress of Vienna's decision to strengthen the Netherlands, Prussia and Piedmont-Sardinia was intended to<\/p>","options":["give them overseas colonies","prepare them to lead the unification of Italy and Germany","punish them for supporting Napoleon","contain France with buffer states","reward them for revolutionary reforms"],"why":["Britain, not these states, made colonial gains.","Unification was not a goal; the Congress opposed nationalism.","They were strengthened, not punished.","These states guarded France's northern and eastern borders.","The Congress opposed revolution."],"answer":3},"u5q26":{"id":"u5q26","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which principle guided the Congress of Vienna's restoration of the Bourbons to the French throne?<\/p>","options":["National self-determination","Legitimacy","Laissez-faire","Popular sovereignty","Collective security"],"why":["That principle shaped the 1919 settlement.","The Congress restored \"legitimate\" pre-revolutionary dynasties.","That is an economic doctrine.","The Congress rejected popular sovereignty.","That concept belongs to the League of Nations."],"answer":1},"u5q27":{"id":"u5q27","unit":5,"diff":"m","pool":"exam2","stem":"<p>Which statement about women in the French Revolution is most accurate?<\/p>","options":["Women won the right to vote in the Constitution of 1791","Women led the Committee of Public Safety","The Napoleonic Code made wives legally equal to their husbands","Women took part in events but were denied political rights","Olympe de Gouges became a leader of the Directory in 1795"],"why":["Only male \"active citizens\" voted.","All its members were men.","The Code subordinated wives to husbands.","Women marched in the October Days, yet the Convention closed women's political clubs.","She was executed in 1793."],"answer":3},"u5q28":{"id":"u5q28","unit":5,"diff":"m","pool":"quiz","stem":"<p>After the Thermidorian Reaction of 1794, the Convention<\/p>","options":["declared war on Russia","crowned Napoleon emperor","restored Louis XVI to the throne as a constitutional king","abolished private property","ended the Terror and price controls"],"why":["France invaded Russia in 1812.","That happened in 1804.","Louis XVI had already been executed in 1793.","The Thermidorians protected property owners.","Thermidor closed the Jacobin Club and lifted the Maximum."],"answer":4},"u5q29":{"id":"u5q29","unit":5,"diff":"m","pool":"exam2","stem":"<p>The Battle of Austerlitz (1805) was significant because Napoleon<\/p>","options":["was forced into exile on the island of Elba","lost his navy to the British","captured Moscow","beat Austria and Russia together","defeated the Prussian army"],"why":["That followed his 1814 abdication.","That was Trafalgar.","He entered Moscow in 1812.","The \"Battle of the Three Emperors\" led Austria to make peace and paved the way to dissolving the Holy Roman Empire.","Prussia was defeated at Jena (1806)."],"answer":3},"u5q30":{"id":"u5q30","unit":5,"diff":"m","pool":"quiz","stem":"<p>The Declaration of Pillnitz (1791) increased tension because Austria and Prussia<\/p>","options":["declared war on Britain","agreed to partition France","recognized the French Republic","hinted they might restore the king","promised to abolish serfdom in their own lands"],"why":["Neither did so.","There was no such agreement.","France was not a republic until 1792.","French revolutionaries took it as a threat, contributing to war in 1792.","The declaration concerned France."],"answer":3},"u5q31":{"id":"u5q31","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which reform of the National Assembly (1789–1791) reflected liberal economic ideas?<\/p>","options":["The levée en masse","Abolishing guilds and tolls","The Maximum on bread prices","The Continental System","The dechristianization campaign of 1793–94"],"why":["That was a military measure.","Removing these barriers fostered a free market in labor and goods.","Price controls were a radical Jacobin measure of 1793.","That was Napoleon's blockade.","That was a radical cultural program of 1793–94."],"answer":1},"u5q32":{"id":"u5q32","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which settlement made by the Congress of Vienna proved a long-term source of nationalist resentment?<\/p>","options":["Austrian control of Lombardy-Venetia in Italy","The return of the pope to Rome","The creation of a Concert of Europe","Britain's acquisition of the Cape Colony","The restoration of the Bourbons in France"],"why":["Italian nationalists later fought to expel Austria.","Not mainly a nationalist grievance in 1815.","The Concert was a diplomatic practice, not a territorial grievance.","This did not provoke European nationalism.","The French overthrew Charles X in 1830, but this was not a nationalist grievance."],"answer":0},"u5q33":{"id":"u5q33","unit":5,"diff":"h","pool":"quiz","stem":"<p>A historian argues that the French Revolution began as a \"revolt of the nobility.\" Which evidence best supports this?<\/p>","options":["Peasants burned manor records during the Great Fear of 1789","The Third Estate declared itself the National Assembly","The sans-culottes demanded price controls","Privileged bodies blocked royal tax reform in 1787–88","Parisian women marched to Versailles"],"why":["That was a peasant revolt against lords.","That was a bourgeois-led act.","That was a working-class demand.","Privileged groups' resistance in 1787–88 forced the crisis that opened the door to revolution.","That was a popular action."],"answer":3},"u5q34":{"id":"u5q34","unit":5,"diff":"h","pool":"quiz","stem":"<p>Which of the following was a long-term consequence of Napoleon's conquests in Europe?<\/p>","options":["The permanent restoration of feudal privileges in the German states","Legal equality and nationalism spread","Russia's adoption of the Napoleonic Code","The revival of the Holy Roman Empire","A unified Italian state in 1815"],"why":["Feudal dues were weakened, not restored, in many areas.","The Code spread reforms, while occupation provoked national resistance.","Russia did not adopt it.","It was never revived.","Italy remained divided until 1861."],"answer":1},"u5q35":{"id":"u5q35","unit":5,"diff":"h","pool":"exam2","stem":"<p>Which statement best compares the American and French Revolutions?<\/p>","options":["Both used natural-rights ideas, but France's attacked aristocracy and church","Both began as a result of a foreign invasion of the homeland","Both were opposed by the leading Enlightenment thinkers of the day","Both ended with a military emperor","Both abolished slavery immediately"],"why":["The French Revolution was more socially radical.","Neither began with an invasion.","Both drew on Enlightenment thought.","Only France produced Napoleon.","The United States kept slavery until 1865; France abolished it in 1794 but Napoleon restored it."],"answer":0},"u5q36":{"id":"u5q36","unit":5,"diff":"h","pool":"exam1","stem":"<p>The Napoleonic Code is best described as both revolutionary and conservative because it<\/p>","options":["gave workers the right to strike while abolishing property","restored the monarchy but kept the Terror's courts","abolished religion but restored nobility","kept legal equality but strengthened husbands' authority","was written by Robespierre and later enforced by Louis XVIII"],"why":["It restricted workers and protected property.","It did neither.","It protected religious freedom and did not restore feudal privilege.","It kept the Revolution's civil equality but rolled back gains for women.","Napoleon's jurists wrote it in 1804."],"answer":3},"u5q37":{"id":"u5q37","unit":5,"diff":"h","pool":"quiz","stem":"<p>Which development most directly allowed the French Republic to survive the military crisis of 1793?<\/p>","options":["Austria's decision to remain neutral in the war with France","Mass mobilization by the Committee of Public Safety","Napoleon's victory at Austerlitz","An alliance with Britain","The restoration of Louis XVI"],"why":["Austria was France's main enemy.","Conscription, centralized control and wartime production turned the tide by 1794.","Austerlitz came in 1805.","Britain was at war with France.","Louis XVI had been executed."],"answer":1},"u5q38":{"id":"u5q38","unit":5,"diff":"h","pool":"exam1","stem":"<p>A peasant in the Vendée in 1793 would most likely have opposed the Revolution because of<\/p>","options":["the restoration of the monarchy","the Congress of Vienna","attacks on the Church and the draft","the abolition of the feudal dues he had owed his lord","the Concordat of 1801"],"why":["The monarchy had just been abolished.","That came in 1814–15.","Religious grievances and the 1793 draft sparked the Vendée rising.","Peasants welcomed that.","The Concordat came years later and reconciled Catholics."],"answer":2},"u5q39":{"id":"u5q39","unit":5,"diff":"h","pool":"exam2","stem":"<p>Which of the following best explains why the Congress of Vienna treated defeated France leniently?<\/p>","options":["Because Napoleon remained on the throne","To avoid creating a vengeful France and to keep the restored Bourbons stable","Because Britain wanted France to dominate Europe","Because Metternich wished to spread revolutionary ideas","Because France had won the war"],"why":["Napoleon was exiled.","A moderate peace supported the balance of power.","Britain wanted a balance of power.","Metternich opposed revolution.","France was defeated."],"answer":1},"u5q40":{"id":"u5q40","unit":5,"diff":"h","pool":"diag","stem":"<p>The Haitian Revolution differed from the French Revolution in that it<\/p>","options":["restored an absolute monarchy under Louis XVIII","was supported by Napoleon throughout","ended with the creation of a French colony","was inspired by opposition to Enlightenment ideas of rights","was led by the enslaved and ended slavery for good"],"why":["Haiti broke away from France.","Napoleon tried to crush it and restore slavery.","It ended French rule.","Its leaders invoked the rights of man.","Haiti became the first state founded by people who had freed themselves from slavery."],"answer":4},"u5q41":{"id":"u5q41","unit":5,"diff":"m","pool":"quiz","stem":"<p>The Great Fear of 1789 refers to<\/p>","options":["rural panic and attacks on manors","the royal family's fear during the October Days at Versailles","the panic after the Russian campaign of 1812","the Terror of 1793–1794","the fear of a British invasion in 1805"],"why":["Rumors of aristocratic plots led peasants to attack the symbols of seigneurialism.","The October Days were a separate Paris event.","That came much later.","That came four years later.","That is unrelated to 1789."],"answer":0},"u5q42":{"id":"u5q42","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which of these was a goal of the Concert of Europe?<\/p>","options":["Spreading republican government across Europe and Latin America","Uniting Germany under Prussia","Preserving the 1815 settlement","Supporting Napoleon's return in 1815","Ending all monarchies in Europe"],"why":["The Concert opposed revolution.","The Concert supported the German Confederation.","The powers met periodically to suppress threats to order.","The allies defeated him at Waterloo.","The Concert defended monarchy."],"answer":2},"u5q43":{"id":"u5q43","unit":5,"diff":"h","pool":"exam2","stem":"<p>Which of the following was the MOST radical measure of the National Convention, 1792–1794?<\/p>","options":["Adopting the Declaration of the Rights of Man","Creating the departments","Establishing the Bank of France","Issuing paper assignats backed by confiscated Church lands","Executing the king and dechristianizing France"],"why":["That was the National Assembly's work in 1789.","That was a reform of 1790.","That was Napoleon's work in 1800.","That began in 1789–90.","These went far beyond the moderate reforms of 1789–91."],"answer":4},"u5q44":{"id":"u5q44","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which event marks the formal end of the Holy Roman Empire?<\/p>","options":["The Congress of Vienna in 1815","Napoleon's reorganization of Germany in 1806","The unification of Germany in 1871","The Treaty of Utrecht in 1713","The Peace of Westphalia in 1648"],"why":["Vienna did not revive the Empire; it created the German Confederation.","After Austerlitz, the emperor dissolved the Empire and Napoleon created the Confederation of the Rhine.","The Empire had been gone for 65 years by then.","Utrecht did not end the Empire.","Westphalia weakened but did not end the Empire."],"answer":1},"u5q45":{"id":"u5q45","unit":5,"diff":"m","pool":"exam1","stem":"<p>Edmund Burke's Reflections on the Revolution in France (1790) argued that<\/p>","options":["laissez-faire economics required revolution","tearing down old institutions would bring tyranny","the Third Estate was \"everything\"","the Revolution should spread to Britain and Ireland as soon as possible","Louis XVI should be executed for treason"],"why":["Burke's book is about political tradition, not economics.","Burke defended gradual change rooted in tradition; he is the founder of modern conservatism.","That was Sieyès's claim.","Burke opposed the Revolution.","Burke defended the monarchy."],"answer":1},"u5q46":{"id":"u5q46","unit":5,"diff":"m","pool":"diag","stem":"<p>Which work was written to DEFEND the French Revolution against Burke's criticism?<\/p>","options":["Thomas Paine's The Rights of Man","Metternich's memoirs","Bossuet's Politics Drawn from Holy Scripture","Joseph de Maistre's Considerations on France","Napoleon's Civil Code"],"why":["Paine defended popular sovereignty and natural rights in 1791.","Metternich was a conservative opponent of revolution.","Bossuet defended absolute monarchy a century earlier.","De Maistre was a fierce conservative critic.","The Code is a law code, not a reply to Burke."],"answer":0},"u5q47":{"id":"u5q47","unit":5,"diff":"m","pool":"exam2","stem":"<p>The Treaty of Tilsit (1807) is significant because it<\/p>","options":["forced Napoleon into exile on the island of Elba","ended the Peninsular War","restored the Bourbons","created the German Confederation","marked the peak of Napoleon's power"],"why":["That followed his 1814 abdication.","The Peninsular War began in 1808.","The Bourbons returned in 1814.","That was created in 1815.","Alexander I joined the Continental System, and Prussia lost half its territory."],"answer":4},"u6q1":{"id":"u6q1","unit":6,"diff":"e","pool":"quiz","stem":"<p>The Industrial Revolution began in which country?<\/p>","options":["France","Russia","Spain","Great Britain","Italy"],"why":["France industrialized later, slowed by revolution and war.","Russia industrialized late in the nineteenth century.","Spain industrialized late and unevenly.","Britain's coal, capital, markets and stable government made it the first industrial nation.","Italy industrialized late, mainly in the north."],"answer":3},"u6q2":{"id":"u6q2","unit":6,"diff":"e","pool":"quiz","stem":"<p>James Watt is best known for<\/p>","options":["improving the steam engine","leading the Chartist movement","building the first railway locomotive to win the Rainhill trials","writing The Wealth of Nations","inventing the spinning jenny"],"why":["His separate condenser and rotary motion made steam power practical for factories.","Chartism was a working-class movement of the 1830s and 1840s.","That was George Stephenson's Rocket.","That was Adam Smith.","That was James Hargreaves."],"answer":0},"u6q3":{"id":"u6q3","unit":6,"diff":"e","pool":"quiz","stem":"<p>The first industry to be transformed by factory production in Britain was<\/p>","options":["cotton textiles","shipbuilding","automobile manufacturing","chemical dyes","electrical goods"],"why":["Spinning and weaving machines created the first factories.","Shipbuilding mechanized later.","Automobiles came in the late 1800s.","Synthetic dyes came in the mid-1800s, led by Germany.","Electricity came in the late 1800s."],"answer":0},"u6q4":{"id":"u6q4","unit":6,"diff":"e","pool":"exam1","stem":"<p>The Luddites were<\/p>","options":["workers who smashed textile machines","landowners who supported the Corn Laws","engineers who promoted railways","socialist followers of Karl Marx and Friedrich Engels","middle-class reformers who campaigned for free trade in grain"],"why":["The Luddite riots took place in 1811–1816.","Landowners were not Luddites.","Luddites opposed machines.","Marx wrote later, in the 1840s.","That describes the Anti-Corn Law League."],"answer":0},"u6q5":{"id":"u6q5","unit":6,"diff":"e","pool":"exam2","stem":"<p>Which law gave the vote to many middle-class men in Britain?<\/p>","options":["The Factory Act of 1833","The Poor Law Amendment Act of 1834","The Reform Act of 1832","The Corn Laws of 1815","The Combination Acts"],"why":["That regulated child labor.","That created the workhouse system.","It redistributed seats to industrial towns and enfranchised middle-class property holders.","Those were tariffs on grain.","Those banned trade unions."],"answer":2},"u6q6":{"id":"u6q6","unit":6,"diff":"e","pool":"quiz","stem":"<p>The People's Charter of 1838 demanded<\/p>","options":["the abolition of the monarchy","votes for women on the same terms as men","universal male suffrage and a secret ballot","a return to the putting-out system","higher tariffs on grain"],"why":["The Charter sought parliamentary reform, not a republic.","The Charter called for manhood suffrage only.","These were two of the Chartists' six points.","Chartists sought political rights.","Chartists generally opposed the Corn Laws."],"answer":2},"u6q7":{"id":"u6q7","unit":6,"diff":"e","pool":"exam2","stem":"<p>Enclosure in eighteenth-century Britain involved<\/p>","options":["creating large collective farms run by state officials","closing factories to protect artisans","forcing peasants to live in walled cities","banning the import of foreign grain","fencing open fields into private farms"],"why":["That describes Soviet collectivization in the 1930s.","Enclosure was agricultural.","Enclosure concerned land, not urban walls.","That was the Corn Laws.","Enclosure raised productivity but displaced many small farmers."],"answer":4},"u6q8":{"id":"u6q8","unit":6,"diff":"e","pool":"exam1","stem":"<p>Which city became the symbol of the cotton industry and was nicknamed \"Cottonopolis\"?<\/p>","options":["Edinburgh","Paris","Rome","Manchester","Vienna"],"why":["Edinburgh was a financial and intellectual center.","Paris was not a cotton-manufacturing center.","Rome was not industrial.","Manchester's mills made it the center of the cotton industry.","Vienna was not a major industrial city in this era."],"answer":3},"u6q9":{"id":"u6q9","unit":6,"diff":"e","pool":"exam1","stem":"<p>Which economist argued that population grows faster than the food supply?<\/p>","options":["Adam Smith","Karl Marx","Thomas Malthus","John Stuart Mill","Friedrich List"],"why":["Smith wrote about free markets and the division of labor.","Marx blamed capitalism, not population, for poverty.","His Essay on the Principle of Population (1798) predicted persistent poverty.","Mill was a liberal philosopher of the mid-1800s.","List argued for protective tariffs."],"answer":2},"u6q10":{"id":"u6q10","unit":6,"diff":"e","pool":"exam2","stem":"<p>The Factory Act of 1833 is significant because it<\/p>","options":["legalized trade unions","gave adult male factory workers the vote","abolished factories inside the boundaries of British cities","limited child labor and created inspectors","repealed the Corn Laws"],"why":["Unions were legalized by repeal of the Combination Acts in 1824.","Workers did not gain the vote until 1867 and after.","Factories kept growing.","It was the first effective factory regulation.","That happened in 1846."],"answer":3},"u6q11":{"id":"u6q11","unit":6,"diff":"m","pool":"diag","stem":"<p>Which of the following best explains why Britain industrialized first?<\/p>","options":["It had the largest population in Europe","It combined coal, capital, markets and stable government","It had abolished private property","Its government owned and ran all the factories through state ministries","It had no overseas colonies to distract it from home industry"],"why":["France and Russia had larger populations.","No single factor explains it; the combination mattered.","Secure property rights encouraged investment.","British industry was privately owned.","Britain had a large empire that supplied markets and raw materials."],"answer":1},"u6q12":{"id":"u6q12","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which sequence of inventions is in the correct chronological order?<\/p>","options":["Power loom, spinning jenny, flying shuttle","Power loom, flying shuttle, spinning jenny","Spinning jenny, flying shuttle, power loom","Flying shuttle, power loom, spinning jenny","Flying shuttle, spinning jenny, power loom"],"why":["This reverses the order.","The power loom came last, in 1785.","The flying shuttle (1733) came before the jenny.","The jenny came before the power loom.","1733, c. 1765, 1785."],"answer":4},"u6q13":{"id":"u6q13","unit":6,"diff":"m","pool":"exam2","stem":"<p>The agricultural revolution contributed to industrialization chiefly by<\/p>","options":["ending the need for coal","restoring feudal obligations","increasing the number of small family farms and smallholders","producing more food with fewer workers","reducing the population of Britain"],"why":["Coal demand grew.","Feudal obligations were long gone in England.","Enclosure reduced small farms.","Surplus food and labor fed the growing factory towns.","Population grew rapidly."],"answer":3},"u6q14":{"id":"u6q14","unit":6,"diff":"m","pool":"exam1","stem":"<p>The Great Reform Act of 1832 is best described as<\/p>","options":["a moderate reform for the middle class","a revolutionary law granting universal suffrage","the law that created the workhouse system","a measure to restore the king's power over Parliament","the law that legalized trade unions"],"why":["It removed rotten boroughs and widened the franchise to middle-class property owners.","Only about one in five adult men in England could vote.","That was the Poor Law of 1834.","It strengthened the House of Commons.","That was the repeal of the Combination Acts in 1824."],"answer":0},"u6q15":{"id":"u6q15","unit":6,"diff":"m","pool":"exam1","stem":"<p>The repeal of the Corn Laws in 1846 represented a victory for<\/p>","options":["Chartists over Parliament","Irish nationalists over British rule","landed aristocrats over manufacturers","mercantilists over the classical economists","free traders over landowners"],"why":["Chartist petitions were rejected.","Repeal was a British economic policy, though the Irish famine helped prompt it.","The Corn Laws had protected landowners.","Repeal was a free-trade, anti-mercantilist measure.","Cheaper grain helped manufacturers and workers; landowners lost protection."],"answer":4},"u6q16":{"id":"u6q16","unit":6,"diff":"m","pool":"exam2","stem":"<p>Which of the following was a common feature of early factory work?<\/p>","options":["Worker ownership of the machines","Work done at home with family members","An eight-hour working day guaranteed by law","Long hours and strict time discipline","High wages for child workers to attract them from farms"],"why":["Owners controlled the machinery.","That was the putting-out system.","The eight-hour day came much later.","Factories ran on the clock and bell.","Children were hired because they were cheap."],"answer":3},"u6q17":{"id":"u6q17","unit":6,"diff":"m","pool":"quiz","stem":"<p>Friedrich Engels's The Condition of the Working Class in England (1845) described<\/p>","options":["the success of the Chartists in winning the vote for workers","working-class misery in Manchester","the agricultural revolution in Norfolk","the luxurious lives of factory workers","the campaign to repeal the Corn Laws"],"why":["The Chartists did not win in his lifetime.","Engels drew on what he saw in his family's mill town.","His subject was industrial cities.","Engels described misery.","That was not his focus."],"answer":1},"u6q18":{"id":"u6q18","unit":6,"diff":"m","pool":"diag","stem":"<p>Abraham Darby's use of coke to smelt iron was important because<\/p>","options":["it created the first steam locomotive","it ended Britain's need for coal","it made iron too expensive for use in railways and bridges","it mechanized cotton spinning","it freed ironmaking from charcoal"],"why":["Locomotives came a century later.","Coke is made from coal.","Cheaper iron made railways possible.","That was the work of Hargreaves, Arkwright and Crompton.","Coal-based coke allowed iron output to expand enormously."],"answer":4},"u6q19":{"id":"u6q19","unit":6,"diff":"m","pool":"exam2","stem":"<p>The Peterloo Massacre (1819) occurred when<\/p>","options":["Luddites burned factories in Yorkshire","strikers seized the Bank of England","cavalry charged a reform rally","Chartists stormed Parliament in 1848","the French army defeated the British army at Waterloo"],"why":["Luddite actions were different events.","No such event occurred.","About fifteen people were killed; it became a symbol of repression.","The 1848 Chartist rally was peaceful.","Wellington defeated Napoleon at Waterloo in 1815."],"answer":2},"u6q20":{"id":"u6q20","unit":6,"diff":"m","pool":"quiz","stem":"<p>The Poor Law Amendment Act of 1834 reflected the belief that<\/p>","options":["the state should guarantee a minimum income for all","workers should own the factories","relief should be harsh to push the poor to work","the Church of England should take over all poor relief","poverty was caused mainly by low wages set by employers"],"why":["The act was designed to cut relief costs.","That is a socialist idea.","Workhouses were deliberately unpleasant to discourage dependence.","Relief was organized by local boards of guardians.","The act blamed idleness rather than wages."],"answer":2},"u6q21":{"id":"u6q21","unit":6,"diff":"m","pool":"exam2","stem":"<p>Which statement about Chartism is most accurate?<\/p>","options":["It was a middle-class movement for free trade","It sought the overthrow of capitalism by armed revolution","It was organized mainly by landowners","It succeeded immediately in winning universal male suffrage in 1838","It failed at first, but most demands later became law"],"why":["That was the Anti-Corn Law League.","Most Chartists sought politica
