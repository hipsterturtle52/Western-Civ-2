ong> to join Piedmont; Cavour paid Napoleon III with <strong>Nice and Savoy<\/strong>.<\/p>\n<p>Then <strong>Giuseppe Garibaldi<\/strong>, a romantic republican guerrilla, sailed with about 1,000 volunteers, the \"<strong>Red Shirts<\/strong>,\" and conquered <strong>Sicily and Naples<\/strong> (1860). Cavour, fearing Garibaldi would march on Rome and provoke France, sent Piedmont's army through the Papal States to meet him. Garibaldi, a patriot first, <strong>handed his conquests to Victor Emmanuel<\/strong>. In <strong>March 1861<\/strong> the <strong>Kingdom of Italy<\/strong> was proclaimed. <strong>Venetia<\/strong> was added in <strong>1866<\/strong> (Italy allied with Prussia against Austria), and <strong>Rome<\/strong> in <strong>1870<\/strong>, when French troops guarding the pope left to fight Prussia. Rome became the capital; the pope refused to recognize the kingdom and called himself the \"prisoner of the Vatican.\"<\/p>\n<p>Unity did not end Italy's problems: a deep gap between the industrializing <strong>north<\/strong> and the poor, rural <strong>south<\/strong>, hostility from the Church, and a narrow electorate. As one politician put it, \"We have made Italy; now we must make Italians.\"<\/p>\n<h3>The unification of Germany<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Prussian king and parliament deadlock over army reform (1862)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Bismarck wins three short wars: Denmark (1864), Austria (1866), France (1870–71)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>German Empire proclaimed at Versailles (January 1871), dominated by Prussia; France loses Alsace-Lorraine and wants revenge<\/div><\/div>\n<p>Prussia had advantages: a strong army, the <strong>Zollverein<\/strong> customs union that already tied most German states to its economy, and booming coal and steel industries. In 1862 King <strong>William I<\/strong> appointed <strong>Otto von Bismarck<\/strong> minister-president to push through an army expansion that the liberal parliament refused to fund. Bismarck simply collected the taxes anyway, declaring that the great questions of the day would be decided \"not by speeches and majority decisions, but by <strong>iron and blood<\/strong>.\"<\/p>\n<p>Bismarck unified Germany through <strong>three wars<\/strong>: 1. The <strong>Danish War (1864)<\/strong>: Prussia and Austria together took <strong>Schleswig and Holstein<\/strong> from Denmark. Their joint administration gave Bismarck a ready-made quarrel with Austria. 2. The <strong>Austro-Prussian (Seven Weeks') War (1866)<\/strong>: after making sure France and Russia would stay out and allying with Italy, Bismarck crushed Austria at <strong>Königgrätz (Sadowa)<\/strong>. He imposed a lenient peace to avoid lasting hatred, but <strong>Austria was excluded from German affairs<\/strong>. Prussia annexed several states and formed the <strong>North German Confederation (1867)<\/strong>. Prussian liberals, dazzled by victory, forgave Bismarck's illegal taxes. 3. The <strong>Franco-Prussian War (1870–1871)<\/strong>: a dispute over a Hohenzollern candidate for the Spanish throne gave Bismarck his chance. He edited the <strong>Ems Dispatch<\/strong>, a telegram about a meeting between William I and the French ambassador, to make it sound insulting; France declared war. The southern German states joined Prussia; the French army collapsed, and <strong>Napoleon III was captured at Sedan<\/strong> (September 1870). Paris was besieged and surrendered in January 1871.<\/p>\n<p>On <strong>January 18, 1871<\/strong>, in the <strong>Hall of Mirrors at Versailles<\/strong>, William I was proclaimed <strong>German Emperor (Kaiser)<\/strong>. In the peace, France paid a large indemnity and lost <strong>Alsace-Lorraine<\/strong>, leaving a lasting French desire for revenge (<em>revanche<\/em>). Germany was unified \"from above,\" by Prussian arms and princes rather than by a liberal parliament.<\/p>\n<p>The new <strong>German Empire<\/strong> was federal and dominated by Prussia. The <strong>Reichstag<\/strong> was elected by <strong>universal male suffrage<\/strong>, but the <strong>chancellor<\/strong> answered to the Kaiser, not to the Reichstag. As chancellor (1871–1890), Bismarck fought the Catholic Church in the <strong>Kulturkampf<\/strong> (\"culture struggle,\" 1870s), then turned against the socialists with the <strong>Anti-Socialist Laws (1878)<\/strong>. To win workers away from socialism he also created the world's first national <strong>social insurance<\/strong>: health insurance (1883), accident insurance (1884), and old-age and disability pensions (1889). In 1888 <strong>William II<\/strong> became Kaiser; he dismissed Bismarck in <strong>1890<\/strong> and pursued a restless <strong>Weltpolitik<\/strong> (\"world policy\"), including a big navy that alarmed Britain.<\/p>\n<h3>Austria-Hungary<\/h3>\n<p>Defeats in 1859 and 1866 forced the Habsburgs to compromise with their largest and most assertive nationality, the <strong>Magyars<\/strong> (Hungarians). The <strong>Compromise (Ausgleich) of 1867<\/strong> created the <strong>Dual Monarchy of Austria-Hungary<\/strong>: Franz Joseph was emperor of Austria and king of Hungary; each half had its own parliament and government, but they shared foreign policy, the army, and the finances for both. Hungary's Magyar elite then pursued <strong>Magyarization<\/strong> of its own minorities. The other nationalities, especially the <strong>Slavs<\/strong> (Czechs, Poles, Croats, Serbs, Slovaks), resented being left out. Nationalism was a constant threat to the empire's survival.<\/p>\n<h3>Russia: reform and reaction<\/h3>\n<p>Defeat in the Crimea convinced <strong>Alexander II<\/strong> (r. 1855–1881) that Russia had to modernize. In <strong>1861<\/strong> he <strong>emancipated the serfs<\/strong>, more than 20 million people. Peasants gained personal freedom and land, but they had to make <strong>redemption payments<\/strong> for decades, and the land was usually held by the village commune (<em>mir<\/em>), which limited mobility. He also created elected local councils (<strong>zemstvos<\/strong>, 1864), reformed the courts with jury trials, and shortened military service. Radicals were not satisfied; populists (<em>narodniki<\/em>) tried to stir the peasants, and the terrorist group <strong>People's Will assassinated Alexander II in 1881<\/strong>.<\/p>\n<p>His son <strong>Alexander III<\/strong> responded with reaction: censorship, police repression and <strong>Russification<\/strong> (forcing Russian language and Orthodoxy on minorities). <strong>Pogroms<\/strong>, violent attacks on Jews, spread, and millions of Jews emigrated. Under <strong>Sergei Witte<\/strong>, finance minister in the 1890s, Russia industrialized rapidly with foreign loans, building the <strong>Trans-Siberian Railway<\/strong>. Defeat by Japan (1904–1905) and the <strong>Revolution of 1905<\/strong> (beginning with <strong>Bloody Sunday<\/strong>, when troops fired on peaceful petitioners) forced <strong>Nicholas II<\/strong> to issue the <strong>October Manifesto<\/strong>, promising civil rights and an elected parliament, the <strong>Duma<\/strong>, which he soon restricted (Unit 10).<\/p>\n<h3>France and Britain: toward democracy<\/h3>\n<p><strong>France.<\/strong> Napoleon III's <strong>Second Empire<\/strong> (1852–1870) rebuilt Paris with wide boulevards (Baron <strong>Haussmann<\/strong>), promoted railways and banks, and liberalized in the 1860s, but collapsed at Sedan. The <strong>Third Republic<\/strong> was born in defeat. In 1871 radical Parisians set up the <strong>Paris Commune<\/strong>, which the national government crushed in \"Bloody Week\" (about 20,000 killed), leaving lasting class bitterness. The Republic survived scandals and the nationalist general <strong>Boulanger<\/strong>. The <strong>Dreyfus Affair<\/strong> (1894–1906), in which <strong>Captain Alfred Dreyfus<\/strong>, a Jewish army officer, was falsely convicted of spying for Germany, split France between the army, Church and anti-Semitic right on one side and republicans, socialists and intellectuals on the other. <strong>Émile Zola's<\/strong> open letter \"<strong>J'accuse!<\/strong>\" (1898) accused the army of a cover-up. Dreyfus was cleared in 1906, and the republicans' victory led to the <strong>separation of church and state (1905)<\/strong>. The affair also convinced journalist <strong>Theodor Herzl<\/strong> that Jews needed their own state, and he founded political <strong>Zionism<\/strong> (1897).<\/p>\n<p><strong>Britain<\/strong> widened democracy by reform rather than revolution. The Conservative <strong>Benjamin Disraeli<\/strong> passed the <strong>Second Reform Act (1867)<\/strong>, enfranchising many urban working men; the Liberal <strong>William Gladstone's<\/strong> governments introduced the <strong>secret ballot (1872)<\/strong> and the <strong>Third Reform Act (1884)<\/strong> for rural workers. Gladstone repeatedly tried, and failed, to give <strong>Home Rule<\/strong> to <strong>Ireland<\/strong>. The <strong>Labour Party<\/strong> formed (1900–1906), the <strong>Parliament Act of 1911<\/strong> ended the House of Lords' veto, and the <strong>suffragettes<\/strong> led by <strong>Emmeline Pankhurst<\/strong> campaigned, sometimes militantly, for women's votes.<\/p>\n<h3>Socialism and labor unions<\/h3>\n<p>Trade unions grew rapidly, especially \"new unions\" of unskilled workers after the 1889 London dock strike. Marx helped found the <strong>First International<\/strong> (1864), which split between Marxists and anarchists led by <strong>Mikhail Bakunin<\/strong>. The <strong>Second International<\/strong> (1889) united national socialist parties. The largest was Germany's <strong>Social Democratic Party (SPD)<\/strong>, which survived the Anti-Socialist Laws and became the <strong>largest party in the Reichstag by 1912<\/strong>.<\/p>\n<p>Socialists argued about strategy. <strong>Eduard Bernstein's revisionism<\/strong> (<em>Evolutionary Socialism<\/em>, 1899) said capitalism was not collapsing and socialism could come gradually through elections and reforms. Orthodox Marxists such as Karl Kautsky insisted on revolution in theory while working within parliaments in practice. <strong>Syndicalists<\/strong> (Georges Sorel) put their faith in the general strike. In Britain, the <strong>Fabian Society<\/strong> pursued gradual, democratic socialism.<\/p>\n<h3>Diplomacy, 1871–1914: Bismarck's system and its collapse<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>A unified Germany fears a French war of revenge over Alsace-Lorraine<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Bismarck builds alliances to keep France isolated (Dual Alliance, Triple Alliance, Reinsurance Treaty)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>William II drops Russia (1890); France and Russia ally (1894); Britain joins them: Europe splits into two armed camps<\/div><\/div>\n<p>After 1871, Bismarck called Germany \"satiated\" and worked to keep the peace and keep France <strong>isolated<\/strong>. His tools: the <strong>Three Emperors' League<\/strong> (Germany, Austria-Hungary, Russia, 1873 and 1881); the <strong>Congress of Berlin (1878)<\/strong>, where he acted as \"honest broker\" after Russia defeated the Ottomans and revised the Treaty of San Stefano: Serbia, Montenegro and Romania became independent, a big Bulgaria was cut down, and Austria-Hungary was allowed to occupy <strong>Bosnia-Herzegovina<\/strong> (which angered Russia); the <strong>Dual Alliance (1879)<\/strong> with Austria-Hungary; the <strong>Triple Alliance (1882)<\/strong> adding Italy; and the secret <strong>Reinsurance Treaty (1887)<\/strong> with Russia.<\/p>\n<p>William II let the Reinsurance Treaty lapse in <strong>1890<\/strong>. France quickly courted Russia with loans and signed the <strong>Franco-Russian Alliance (1894)<\/strong>, the nightmare of a two-front war Bismarck had avoided. Britain, alarmed by Germany's navy, left its \"splendid isolation\": the <strong>Entente Cordiale (1904)<\/strong> settled colonial quarrels with France, and the <strong>Anglo-Russian Entente (1907)<\/strong> did the same with Russia, creating the <strong>Triple Entente<\/strong>. Europe was now divided into two blocs: the <strong>Triple Alliance<\/strong> (Germany, Austria-Hungary, Italy) and the <strong>Triple Entente<\/strong> (France, Russia, Britain).<\/p>","words":1964,"minutes":14,"mustKnow":["<strong>Realpolitik:<\/strong> practical power politics (Cavour, Bismarck) replaced 1848 idealism.","<strong>Crimean War (1853–56):<\/strong> Russia vs. Ottomans, Britain, France, Piedmont; broke the Concert of Europe and isolated Austria.","<strong>Italy:<\/strong> Cavour (diplomacy, French alliance, 1859 war → Lombardy), Garibaldi (Red Shirts take Sicily and Naples, 1860), Victor Emmanuel II king (1861); Venetia 1866, Rome 1870.","<strong>Germany:<\/strong> Bismarck's \"iron and blood\"; three wars (Denmark 1864, Austria 1866, France 1870–71); Ems Dispatch; Empire proclaimed at Versailles (1871); Alsace-Lorraine annexed.","<strong>Bismarck at home:<\/strong> Kulturkampf, Anti-Socialist Laws (1878), first social insurance (1880s).","<strong>Ausgleich (1867):<\/strong> Dual Monarchy of Austria-Hungary; Slavs left out.","<strong>Russia:<\/strong> Alexander II freed the serfs (1861), zemstvos; assassinated 1881; Alexander III's Russification and pogroms; 1905 revolution → Duma.","<strong>France:<\/strong> Paris Commune (1871); Third Republic; <strong>Dreyfus Affair<\/strong> (Zola's \"J'accuse!\") → separation of church and state (1905).","<strong>Britain:<\/strong> Reform Acts of 1867 and 1884, secret ballot (1872), Irish Home Rule fights, suffragettes.","<strong>Alliances:<\/strong> Dual Alliance (1879), Triple Alliance (1882), Reinsurance Treaty lapses (1890), Franco-Russian Alliance (1894), Entente Cordiale (1904), Triple Entente (1907)."],"timeline":[{"y":"1853–1856","label":"Crimean War","note":"Concert of Europe breaks down","key":true},{"y":"1858","label":"Plombières agreement","note":"Cavour secures French help","key":false},{"y":"1859","label":"Franco-Piedmontese war with Austria","note":"Magenta, Solferino; Lombardy to Piedmont","key":true},{"y":"1860","label":"Garibaldi's expedition","note":"Red Shirts conquer Sicily and Naples","key":false},{"y":"1861","label":"Kingdom of Italy; Russian serfs emancipated","note":"Victor Emmanuel II; Alexander II's reform","key":true},{"y":"1862","label":"Bismarck becomes Prussian minister-president","note":"\"Iron and blood\"","key":false},{"y":"1864","label":"Danish War","note":"Schleswig-Holstein seized","key":false},{"y":"1866","label":"Austro-Prussian War (Königgrätz)","note":"Austria excluded from Germany","key":true},{"y":"1867","label":"Ausgleich; Second Reform Act","note":"Dual Monarchy; urban workers vote in Britain","key":true},{"y":"1870–1871","label":"Franco-Prussian War","note":"Sedan; Rome joins Italy; Third Republic","key":true},{"y":"1871","label":"German Empire proclaimed; Paris Commune","note":"Hall of Mirrors; Alsace-Lorraine annexed","key":true},{"y":"1878","label":"Congress of Berlin; Anti-Socialist Laws","note":"Bismarck as honest broker","key":false},{"y":"1879","label":"Dual Alliance","note":"Germany and Austria-Hungary","key":false},{"y":"1881","label":"Alexander II assassinated","note":"Reaction under Alexander III","key":false},{"y":"1882","label":"Triple Alliance","note":"Germany, Austria-Hungary, Italy","key":false},{"y":"1890","label":"Bismarck dismissed","note":"Reinsurance Treaty lapses","key":false},{"y":"1894","label":"Franco-Russian Alliance; Dreyfus convicted","note":"Two-front threat to Germany","key":false},{"y":"1898","label":"Zola's \"J'accuse!\"","note":"Dreyfus Affair peaks","key":false},{"y":"1904","label":"Entente Cordiale","note":"Britain and France settle differences","key":true},{"y":"1905","label":"Russian Revolution of 1905; French separation of church and state","note":"October Manifesto, Duma","key":false},{"y":"1907","label":"Triple Entente","note":"Britain, France, Russia","key":true}],"cards":[{"id":"u8c1","front":"Realpolitik","back":"Politics based on practical power and interests rather than ideals.","person":false},{"id":"u8c2","front":"Crimean War (1853–56)","back":"Russia vs. Ottomans, Britain, France and Piedmont; broke the Concert of Europe.","person":false},{"id":"u8c3","front":"Camillo di Cavour","back":"Prime minister of Piedmont-Sardinia; used diplomacy and French help to unify northern Italy.","person":true},{"id":"u8c4","front":"Giuseppe Garibaldi","back":"Led the Red Shirts to conquer Sicily and Naples (1860), then handed them to Victor Emmanuel II.","person":true},{"id":"u8c5","front":"Victor Emmanuel II","back":"King of Piedmont-Sardinia who became first king of united Italy (1861).","person":true},{"id":"u8c6","front":"Otto von Bismarck","back":"Prussian minister-president and German chancellor; unified Germany through \"iron and blood.\"","person":true},{"id":"u8c7","front":"Ems Dispatch (1870)","back":"Telegram Bismarck edited to provoke France into the Franco-Prussian War.","person":false},{"id":"u8c8","front":"Battle of Sedan (1870)","back":"Prussian victory; Napoleon III captured.","person":false},{"id":"u8c9","front":"German Empire proclaimed (1871)","back":"William I crowned Kaiser in the Hall of Mirrors at Versailles.","person":false},{"id":"u8c10","front":"Kulturkampf","back":"Bismarck's 1870s campaign against the Catholic Church in Germany.","person":false},{"id":"u8c11","front":"Bismarck's social insurance","back":"Health (1883), accident (1884) and old-age (1889) insurance to undercut socialism.","person":false},{"id":"u8c12","front":"Ausgleich (1867)","back":"Compromise creating the Dual Monarchy of Austria-Hungary.","person":false},{"id":"u8c13","front":"Alexander II","back":"Russian tsar who emancipated the serfs (1861); assassinated 1881.","person":true},{"id":"u8c14","front":"Emancipation of the serfs (1861)","back":"Freed Russia's serfs; peasants owed redemption payments; land held by communes.","person":false},{"id":"u8c15","front":"Russification","back":"Forcing Russian language and Orthodoxy on minorities under Alexander III.","person":false},{"id":"u8c16","front":"Paris Commune (1871)","back":"Radical Paris government crushed by the French army in \"Bloody Week.\"","person":false},{"id":"u8c17","front":"Dreyfus Affair","back":"False conviction of a Jewish French officer (1894); exposed anti-Semitism; Zola's \"J'accuse!\"","person":false},{"id":"u8c18","front":"Theodor Herzl","back":"Founder of political Zionism (1897), influenced by the Dreyfus Affair.","person":true},{"id":"u8c19","front":"Eduard Bernstein","back":"Revisionist socialist: reach socialism gradually through elections and reform.","person":true},{"id":"u8c20","front":"Second Reform Act (1867)","back":"Disraeli's law giving the vote to many urban working men in Britain.","person":false},{"id":"u8c21","front":"Triple Alliance (1882)","back":"Germany, Austria-Hungary and Italy.","person":false},{"id":"u8c22","front":"Triple Entente (1907)","back":"France, Russia and Britain.","person":false}],"hours":1.92,"quizIds":["u8q2","u8q4","u8q5","u8q11","u8q14","u8q18","u8q19","u8q23","u8q27","u8q28","u8q30","u8q32","u8q34"]},{"id":9,"title":"Economy, Culture, and Imperialism, 1850–1914","short":"Economy, Culture & Empire","range":"1850–1914","weight":{"min":7,"max":9,"verified":true},"subtopics":["Demography","Mass politics","Science, technology, and industrial growth","Imperialism in Africa and Asia","Modern art, thought, and literature"],"lesson":"<h3>The big picture<\/h3>\n<p>Between 1850 and 1914 Europe reached the peak of its power and confidence. A <strong>Second Industrial Revolution<\/strong> built on steel, chemicals, electricity and oil made Europe and the United States the workshops of the world. Population soared, cities were cleaned up, and tens of millions emigrated. Ordinary people became literate voters reading cheap newspapers: the age of <strong>mass politics<\/strong>. Europeans used their new technology to seize most of Africa and much of Asia in the <strong>New Imperialism<\/strong>. Yet at the same time, scientists and artists such as <strong>Darwin, Freud, Nietzsche, Einstein and Picasso<\/strong> undermined older certainties about humanity, reason and reality. This unit mixes economics, empire and culture; expect \"match the thinker to the idea\" and \"what motivated imperialism\" questions.<\/p>\n<h3>The Second Industrial Revolution<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>New processes and science-based industry: Bessemer steel (1856), synthetic chemicals, electricity, the internal combustion engine<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Mass production, big corporations and cartels; Germany and the U.S. overtake Britain<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>A global economy, consumer goods, and fierce competition for markets and raw materials<\/div><\/div>\n<p>The first industrial revolution ran on cotton, coal, iron and steam. The second (about <strong>1870–1914<\/strong>) ran on: - <strong>Steel:<\/strong> Henry Bessemer's converter (1856) made cheap steel for railways, ships, bridges and weapons. - <strong>Chemicals:<\/strong> German firms led in synthetic dyes, fertilizers, pharmaceuticals and explosives, often employing university-trained scientists. - <strong>Electricity:<\/strong> dynamos and power stations; Thomas Edison's practical light bulb (1879); electric trams and factory motors. - <strong>Oil and the internal combustion engine:<\/strong> Gottlieb Daimler and Karl Benz built early automobiles in the 1880s; Rudolf Diesel his engine in the 1890s. - <strong>Communications:<\/strong> the telephone (Bell, 1876) and radio (Marconi, 1890s), plus undersea telegraph cables.<\/p>\n<p><strong>Germany<\/strong> became the industrial leader of the continent and, with the <strong>United States<\/strong>, overtook Britain in steel production by about 1900. Businesses grew into giant corporations; in Germany, firms formed <strong>cartels<\/strong> that fixed prices and shared markets. A long slump in prices and profits, the <strong>Long Depression<\/strong> (about 1873–1896), led most countries except Britain to abandon free trade for <strong>protective tariffs<\/strong> (Germany in 1879). Wages slowly rose; department stores, advertising and brand-name goods created a <strong>consumer society<\/strong> for the middle class and better-off workers.<\/p>\n<h3>Demography: more people, healthier cities, mass migration<\/h3>\n<p>Europe's population rose from about <strong>266 million in 1850 to more than 450 million by 1914<\/strong>. The main reason was again a falling death rate, now helped by real medical and sanitary advances. <strong>Louis Pasteur<\/strong> proved the <strong>germ theory of disease<\/strong> in the 1860s (and developed pasteurization and vaccines); <strong>Robert Koch<\/strong> identified the bacteria causing tuberculosis (1882) and cholera; <strong>Joseph Lister<\/strong> introduced antiseptic surgery (1867). Governments built <strong>sewers and clean water systems<\/strong>; after London's \"Great Stink\" of 1858, engineers built a modern sewer network. In Paris, Baron <strong>Haussmann<\/strong> replaced slums with broad boulevards, parks and sewers. Late in the century, birth rates also began to fall, first in France, as middle-class families chose to have fewer children.<\/p>\n<p>Even so, Europe could not employ everyone. Between 1815 and 1914 about <strong>50 million Europeans emigrated<\/strong>, mostly to the <strong>United States<\/strong>, Canada, Argentina, Brazil and Australia. Early waves came from Ireland (driven by the <strong>potato famine<\/strong> of 1845–1852, which killed about a million people) and Germany; later waves from <strong>Italy<\/strong>, Austria-Hungary and the Russian Empire, including many Jews fleeing pogroms.<\/p>\n<h3>Mass politics and society<\/h3>\n<p>By 1914 most Western European men could vote. To vote sensibly, the argument went, citizens needed schools: states created <strong>free, compulsory primary education<\/strong> (Britain from 1870; France under the <strong>Ferry laws<\/strong> of the 1880s, which made schools secular). Literacy brought a cheap <strong>mass press<\/strong> (Britain's <em>Daily Mail<\/em>, 1896) that often whipped up nationalism. <strong>Mass political parties<\/strong> with dues-paying members, newspapers and clubs replaced loose groups of notables: socialist parties on the left, Catholic parties, and new <strong>radical-right<\/strong> movements that mixed nationalism, anti-Semitism and hostility to liberalism (for example, Karl Lueger, the anti-Semitic mayor of Vienna).<\/p>\n<p>Women organized too. <strong>Feminists<\/strong> campaigned for property rights, education, entry into professions and the vote. The <strong>suffragists<\/strong> used petitions and persuasion; the British <strong>suffragettes<\/strong> of Emmeline Pankhurst's Women's Social and Political Union (founded 1903) used militant tactics. Before 1914 only <strong>Finland (1906)<\/strong> and <strong>Norway (1913)<\/strong> gave women the national vote in Europe.<\/p>\n<h3>The New Imperialism, 1880–1914<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Industrial economies want raw materials, markets and investment outlets; nationalist rivalry; social Darwinist and \"civilizing\" ideas<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>The Scramble for Africa and expansion in Asia, made possible by steamships, quinine, railways and the machine gun<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>By 1914 Europeans control about 90 percent of Africa; colonized peoples suffer exploitation and violence; rivalries worsen tensions in Europe<\/div><\/div>\n<p>Europeans had held coastal trading posts for centuries. After about 1880, they rushed to conquer and directly rule vast interiors. Historians list several <strong>motives<\/strong>: - <strong>Economic:<\/strong> raw materials (rubber, cotton, copper, palm oil), new markets and investment opportunities. The British economist <strong>J. A. Hobson<\/strong> (<em>Imperialism<\/em>, 1902) argued that capitalists pushed imperialism to find profitable investments; <strong>Lenin<\/strong> later called imperialism \"the highest stage of capitalism\" (1916). - <strong>Political and strategic:<\/strong> national prestige, coaling stations and naval bases, and fear of rivals grabbing land first. - <strong>Ideological:<\/strong> <strong>social Darwinism<\/strong>, the misapplication of Darwin's ideas to claim that some races and nations were \"fitter\" than others; the \"<strong>civilizing mission<\/strong>\"; and Christian <strong>missionaries<\/strong>. <strong>Rudyard Kipling's<\/strong> poem \"<strong>The White Man's Burden<\/strong>\" (1899) urged Americans and Britons to rule \"new-caught, sullen peoples\" as a duty. - <strong>Enablers:<\/strong> the steamship, telegraph and railway; <strong>quinine<\/strong>, which protected Europeans against malaria; and the <strong>Maxim gun<\/strong>, an early machine gun. As one poet put it, \"Whatever happens, we have got the Maxim gun, and they have not.\"<\/p>\n<p><strong>Africa.<\/strong> To avoid war over Africa, Bismarck hosted the <strong>Berlin Conference (1884–1885)<\/strong>, which set the rule that a power must \"effectively occupy\" territory to claim it. No Africans were invited. Within twenty years almost the whole continent was divided; only <strong>Ethiopia<\/strong>, which crushed an Italian army at <strong>Adwa (1896)<\/strong>, and <strong>Liberia<\/strong> stayed independent. King <strong>Leopold II of Belgium<\/strong> ran the <strong>Congo Free State<\/strong> as his personal property, forcing Africans to gather rubber under a regime of terror and mutilation that killed millions; international outrage forced Belgium to take over the colony in 1908. Britain bought shares in the <strong>Suez Canal<\/strong> (1875), occupied <strong>Egypt<\/strong> (1882), and dreamed (with <strong>Cecil Rhodes<\/strong>) of a \"Cape to Cairo\" railway. British and French expansion collided at <strong>Fashoda<\/strong> in Sudan (1898); France backed down. Britain fought the Dutch-descended <strong>Boers<\/strong> in the <strong>South African (Boer) War (1899–1902)<\/strong>, using concentration camps in which tens of thousands of Boer and African civilians died. In German Southwest Africa (Namibia), the army's campaign against the <strong>Herero and Nama<\/strong> (1904–1907) killed most of the Herero people, now widely recognized as genocide.<\/p>\n<p><strong>Asia.<\/strong> In <strong>India<\/strong>, the <strong>Indian Rebellion (Sepoy Mutiny) of 1857<\/strong> led Britain to end East India Company rule; from <strong>1858<\/strong> the British crown ruled directly (the <strong>Raj<\/strong>), and Queen Victoria became Empress of India in 1876. In <strong>China<\/strong>, Britain's victory in the <strong>Opium War (1839–1842)<\/strong> forced open ports and gave it <strong>Hong Kong<\/strong>; later \"unequal treaties\" carved China into foreign <strong>spheres of influence<\/strong>, and the anti-foreign <strong>Boxer Rebellion (1900)<\/strong> was crushed by an international force. France took <strong>Indochina<\/strong> (Vietnam, Cambodia, Laos). <strong>Japan<\/strong> responded differently: after the <strong>Meiji Restoration (1868)<\/strong> it rapidly modernized on Western lines, defeated China (1895) and then <strong>Russia (1905)<\/strong>, the first modern Asian victory over a European great power.<\/p>\n<h3>Science and thought: new certainties and new doubts<\/h3>\n<p><strong>Charles Darwin's <em>On the Origin of Species<\/em> (1859)<\/strong> argued that species evolve through <strong>natural selection<\/strong>: individuals with traits better suited to their environment survive and reproduce. <em>The Descent of Man<\/em> (1871) placed humans in the same process. Darwin shocked religious believers who read Genesis literally. <strong>Herbert Spencer<\/strong> coined \"<strong>survival of the fittest<\/strong>\" and applied it to society, giving rise to <strong>social Darwinism<\/strong>, used to justify laissez-faire, imperialism and racism.<\/p>\n<p>Physics overturned the Newtonian world: <strong>Wilhelm Röntgen<\/strong> discovered X-rays (1895); <strong>Marie Curie<\/strong> (with Pierre Curie) studied <strong>radioactivity<\/strong> and won two Nobel Prizes; <strong>Max Planck<\/strong> proposed quantum theory (1900); <strong>Albert Einstein's<\/strong> theory of <strong>relativity<\/strong> (1905) showed that time and space are not absolute.<\/p>\n<p><strong>Sigmund Freud<\/strong>, a Viennese doctor, founded <strong>psychoanalysis<\/strong> (<em>The Interpretation of Dreams<\/em>, 1900). He argued that human behavior is driven largely by the <strong>unconscious<\/strong>, by repressed desires (especially sexual and aggressive drives), and he described the mind as the id, ego and superego. Humans were less rational than the Enlightenment had believed.<\/p>\n<p><strong>Friedrich Nietzsche<\/strong> attacked Christianity and middle-class morality as \"slave morality,\" declared \"<strong>God is dead<\/strong>,\" praised the <strong>will to power<\/strong>, and imagined a \"superman\" (<em>Übermensch<\/em>) who would create his own values. Others built new social sciences: Auguste Comte's <strong>positivism<\/strong> (only scientific knowledge is real), and the sociologists <strong>Émile Durkheim<\/strong> and <strong>Max Weber<\/strong> (<em>The Protestant Ethic and the Spirit of Capitalism<\/em>, 1905).<\/p>\n<h3>Literature and the arts: from Realism to Modernism<\/h3>\n<p>Mid-century <strong>Realism<\/strong> rejected Romantic idealism to show ordinary life truthfully: <strong>Gustave Courbet<\/strong> painted laborers (<em>The Stone Breakers<\/em>); novelists <strong>Gustave Flaubert<\/strong> (<em>Madame Bovary<\/em>, 1857), <strong>Charles Dickens<\/strong>, <strong>Leo Tolstoy<\/strong> and <strong>Émile Zola<\/strong> (whose \"naturalism\" showed people shaped by heredity and environment) described society in detail. Henrik <strong>Ibsen's<\/strong> play <em>A Doll's House<\/em> (1879) challenged women's roles in marriage.<\/p>\n<p><strong>Impressionists<\/strong> such as <strong>Claude Monet<\/strong> and Pierre-Auguste Renoir (first group show 1874) painted outdoors to capture fleeting effects of <strong>light and color<\/strong>. <strong>Post-Impressionists<\/strong> (Paul <strong>Cézanne<\/strong>, Vincent <strong>van Gogh<\/strong>, Paul Gauguin) used color and form to express structure and emotion. By 1914 <strong>Modernism<\/strong> broke with tradition entirely: <strong>Pablo Picasso<\/strong> and Georges Braque invented <strong>Cubism<\/strong>, showing objects from several viewpoints at once (<em>Les Demoiselles d'Avignon<\/em>, 1907); Expressionists painted inner anxiety; and <strong>Igor Stravinsky's<\/strong> ballet <strong><em>The Rite of Spring<\/strong><\/em> caused a riot at its 1913 Paris premiere. Artists and thinkers alike suggested that the world was less orderly and rational than Europe's confident leaders believed.<\/p>","words":1614,"minutes":12,"mustKnow":["<strong>Second Industrial Revolution<\/strong> (c. 1870–1914): steel (Bessemer), chemicals, electricity, oil and the internal combustion engine; Germany and the U.S. overtake Britain; cartels; return to tariffs.","<strong>Public health:<\/strong> Pasteur's germ theory, Koch, Lister; sewers and clean water; death rates fall.","<strong>Mass emigration:<\/strong> about 50 million Europeans left (1815–1914), especially to the U.S.; Irish potato famine.","<strong>Mass politics:<\/strong> wider male suffrage, compulsory schooling, mass press, mass parties; women's suffrage movement (Pankhurst).","<strong>New Imperialism motives:<\/strong> economic (Hobson, Lenin), strategic and nationalist rivalry, social Darwinism and the \"civilizing mission\" (\"White Man's Burden\"); enabled by steamships, quinine, the Maxim gun.","<strong>Berlin Conference (1884–85):<\/strong> rules for dividing Africa; only Ethiopia (Adwa 1896) and Liberia stayed free; Leopold II's Congo atrocities; Fashoda (1898); Boer War (1899–1902).","<strong>Asia:<\/strong> Indian Rebellion (1857) → British Raj (1858); Opium Wars and spheres of influence in China; Boxer Rebellion (1900); Japan's Meiji modernization beats Russia (1905).","<strong>Darwin<\/strong> (natural selection, 1859) → Spencer's <strong>social Darwinism<\/strong>.","<strong>Freud<\/strong> (the unconscious), <strong>Nietzsche<\/strong> (\"God is dead,\" will to power), <strong>Einstein<\/strong> (relativity), <strong>Curie<\/strong> (radioactivity).","<strong>Art:<\/strong> Realism (Courbet) → Impressionism (Monet: light) → Post-Impressionism (Van Gogh, Cézanne) → Cubism (Picasso)."],"timeline":[{"y":"1845–1852","label":"Irish potato famine","note":"About a million die; mass emigration","key":false},{"y":"1856","label":"Bessemer process","note":"Cheap steel","key":false},{"y":"1857–1858","label":"Indian Rebellion; British Raj begins","note":"Crown rule replaces the East India Company","key":true},{"y":"1859","label":"Darwin's On the Origin of Species","note":"Natural selection","key":true},{"y":"1860s","label":"Pasteur's germ theory","note":"Modern public health","key":false},{"y":"1868","label":"Meiji Restoration in Japan","note":"Rapid Westernization","key":false},{"y":"1874","label":"First Impressionist exhibition","note":"Monet and others","key":false},{"y":"1879","label":"Germany adopts protective tariffs","note":"End of free-trade era on the continent","key":false},{"y":"1882","label":"Britain occupies Egypt","note":"Control of the Suez route","key":false},{"y":"1884–1885","label":"Berlin Conference","note":"Rules for the Scramble for Africa","key":true},{"y":"1896","label":"Battle of Adwa","note":"Ethiopia defeats Italy","key":false},{"y":"1898","label":"Fashoda Crisis","note":"Anglo-French showdown in Sudan","key":false},{"y":"1899–1902","label":"Boer War","note":"British war in South Africa","key":false},{"y":"1900","label":"Freud's Interpretation of Dreams; Boxer Rebellion","note":"The unconscious; anti-foreign rising in China","key":true},{"y":"1903","label":"Women's Social and Political Union founded","note":"Militant suffragettes","key":false},{"y":"1905","label":"Einstein's relativity; Japan defeats Russia","note":"New physics; Asian power rises","key":true},{"y":"1907","label":"Picasso's Les Demoiselles d'Avignon","note":"Toward Cubism","key":false}],"cards":[{"id":"u9c1","front":"Second Industrial Revolution","back":"c. 1870–1914: steel, chemicals, electricity, oil; Germany and the U.S. take the lead.","person":false},{"id":"u9c2","front":"Cartels","back":"Agreements among firms (especially in Germany) to fix prices and divide markets.","person":false},{"id":"u9c3","front":"Louis Pasteur","back":"Proved germ theory of disease; pasteurization and vaccines.","person":true},{"id":"u9c4","front":"Mass politics","back":"Era of wide suffrage, mass parties, compulsory schooling and a popular press.","person":false},{"id":"u9c5","front":"Emmeline Pankhurst","back":"Led Britain's militant suffragettes (WSPU, founded 1903).","person":true},{"id":"u9c6","front":"New Imperialism","back":"1880–1914 drive to conquer and directly rule Africa and Asia.","person":false},{"id":"u9c7","front":"Social Darwinism","back":"Misuse of Darwin's ideas to claim some races or nations were \"fitter\" and should dominate.","person":false},{"id":"u9c8","front":"\"The White Man's Burden\"","back":"Kipling's 1899 poem urging Westerners to rule colonized peoples as a duty.","person":false},{"id":"u9c9","front":"J. A. Hobson","back":"British economist (Imperialism, 1902) who blamed imperialism on capitalist search for investment.","person":true},{"id":"u9c10","front":"Berlin Conference (1884–85)","back":"Set rules (\"effective occupation\") for European partition of Africa.","person":false},{"id":"u9c11","front":"Leopold II","back":"Belgian king whose Congo Free State used terror to extract rubber.","person":true},{"id":"u9c12","front":"Battle of Adwa (1896)","back":"Ethiopia defeated Italy and kept its independence.","person":false},{"id":"u9c13","front":"Boer War (1899–1902)","back":"British war against Dutch-descended settlers in South Africa; concentration camps.","person":false},{"id":"u9c14","front":"Indian Rebellion (1857)","back":"Revolt against East India Company rule; led to direct British crown rule (the Raj).","person":false},{"id":"u9c15","front":"Boxer Rebellion (1900)","back":"Anti-foreign uprising in China crushed by an international force.","person":false},{"id":"u9c16","front":"Charles Darwin","back":"On the Origin of Species (1859): evolution by natural selection.","person":true},{"id":"u9c17","front":"Sigmund Freud","back":"Founder of psychoanalysis; behavior driven by the unconscious.","person":true},{"id":"u9c18","front":"Friedrich Nietzsche","back":"\"God is dead\"; will to power; attacked Christian and bourgeois morality.","person":true},{"id":"u9c19","front":"Albert Einstein","back":"Theory of relativity (1905): time and space are not absolute.","person":true},{"id":"u9c20","front":"Impressionism","back":"Late-1800s painting capturing light and fleeting moments (Monet, Renoir).","person":false}],"hours":1.71,"quizIds":["u9q3","u9q4","u9q6","u9q11","u9q13","u9q16","u9q18","u9q19","u9q20","u9q23","u9q29","u9q33"]}],"questions":{"u1q1":{"id":"u1q1","unit":1,"diff":"e","pool":"exam1","stem":"<p>Which document, accepted by William and Mary in 1689, guaranteed that Parliament must consent to taxation and to a peacetime standing army?<\/p>","options":["The Act of Union","The English Bill of Rights","The Edict of Nantes","The Test Act","The Petition of Right"],"why":["The Act of Union (1707) joined England and Scotland; it did not set out Parliament's taxing power.","The 1689 Bill of Rights made these parliamentary powers law as the condition of William and Mary's accession.","The Edict of Nantes (1598) gave French Protestants toleration; it has nothing to do with Parliament.","The Test Act (1673) barred non-Anglicans from office; it did not define Parliament's powers over taxes.","The Petition of Right dates from 1628, under Charles I, and he ignored it."],"answer":1},"u1q2":{"id":"u1q2","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Peace of Westphalia (1648) did which of the following?<\/p>","options":["Restored the Stuart monarchy in England","Unified the German states under the Habsburg emperor","Outlawed Calvinism within the Holy Roman Empire","Recognized the independence of the Dutch Republic","Ended the War of the Spanish Succession"],"why":["The Stuart Restoration happened in 1660 and was an English domestic event.","It did the opposite: German princes became effectively sovereign and the emperor was weakened.","Westphalia added Calvinism to the faiths a ruler could legally adopt.","Westphalia formally recognized the United Provinces' independence from Spain, along with Swiss independence.","That war ended with the Treaty of Utrecht in 1713."],"answer":3},"u1q3":{"id":"u1q3","unit":1,"diff":"e","pool":"quiz","stem":"<p>Louis XIV's main purpose in requiring great nobles to live at Versailles was to<\/p>","options":["train them as officers for the French navy","prepare them to serve in the Estates-General","keep them under royal watch and away from independent power bases","collect the taxes that the nobles owed the crown","convert them from Protestantism to Catholicism"],"why":["Versailles was a court, not a naval academy.","Louis never called the Estates-General.","Busy competing for court honors, nobles could not raise private armies or lead revolts like the Fronde.","French nobles were largely exempt from direct taxes; Versailles was not a tax office.","The great nobles were overwhelmingly Catholic already; Versailles was about political control."],"answer":2},"u1q4":{"id":"u1q4","unit":1,"diff":"e","pool":"exam2","stem":"<p>Which ruler is most closely associated with founding St. Petersburg and forcing Russian nobles to adopt Western dress?<\/p>","options":["Peter the Great","Alexander I","Ivan the Terrible","Michael Romanov","Catherine the Great"],"why":["Peter founded St. Petersburg in 1703 and imposed beard taxes and Western clothing on the elite.","Alexander I ruled 1801–1825 and is known for fighting Napoleon.","Ivan IV ruled in the 1500s, long before St. Petersburg existed.","Michael founded the Romanov dynasty in 1613; he did not westernize Russia.","Catherine (r. 1762–1796) came later and is linked to enlightened despotism and the partitions of Poland."],"answer":0},"u1q5":{"id":"u1q5","unit":1,"diff":"e","pool":"exam2","stem":"<p>The Glorious Revolution of 1688 replaced James II with<\/p>","options":["Queen Anne","George I of Hanover","William of Orange and Mary","Oliver Cromwell","Charles II"],"why":["Anne followed William in 1702; she did not replace James II.","George I came to the throne in 1714 under the Act of Settlement.","Parliament's leaders invited the Protestant William and Mary, James's daughter, to take the throne.","Cromwell died in 1658, thirty years earlier.","Charles II was restored in 1660 and died in 1685; James II was his successor."],"answer":2},"u1q6":{"id":"u1q6","unit":1,"diff":"e","pool":"exam1","stem":"<p>In the Dutch Republic of the 1600s, political power rested chiefly with<\/p>","options":["the Catholic bishops of the Netherlands","the Spanish viceroy in Brussels","wealthy merchant oligarchs (regents) in the provinces and towns","a parliament elected by all adult men","an absolute monarch ruling by divine right"],"why":["The Republic was officially Calvinist; Catholic bishops held no political power.","The Dutch had broken away from Spain; Spanish officials governed only the southern (Spanish) Netherlands.","The regents dominated provincial estates and town councils; the federation's center was weak.","There was no democratic suffrage; power was oligarchic.","The Dutch Republic had no king; it was a federal republic."],"answer":2},"u1q7":{"id":"u1q7","unit":1,"diff":"e","pool":"diag","stem":"<p>Which war ended with the Treaty of Utrecht in 1713?<\/p>","options":["The Thirty Years' War","The Seven Years' War","The Great Northern War","The War of the Spanish Succession","The English Civil War"],"why":["The Thirty Years' War ended at Westphalia in 1648.","The Seven Years' War ended in 1763 with the Treaty of Paris.","That war ended with the Treaty of Nystad in 1721.","Utrecht (1713, with Rastatt in 1714) settled who would rule Spain.","The English Civil War was a domestic conflict that ended in 1649."],"answer":3},"u1q8":{"id":"u1q8","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Prussian Junkers were<\/p>","options":["foreign mercenaries hired by the Great Elector","Protestant refugees from France","Prussian merchants who financed the royal army","landowning nobles who served as army officers in return for control over their serfs","elected members of the Prussian parliament"],"why":["Junkers were native Prussian nobles, not foreign hires.","Huguenot refugees settled in Prussia, but they were not called Junkers.","Prussia's merchant class was small; Junkers were rural nobles.","This bargain with the Hohenzollerns was the social basis of the Prussian state.","Prussia had no powerful elected parliament in this period."],"answer":3},"u1q9":{"id":"u1q9","unit":1,"diff":"e","pool":"exam2","stem":"<p>Mercantilism, as practiced by Colbert, held that a nation should<\/p>","options":["abolish colonies because they drain the home economy","export more than it imports in order to accumulate gold and silver","let private markets set all prices without state interference","collectivize land and industry under worker control","remove all tariffs and allow free trade"],"why":["Mercantilists valued colonies as sources of raw materials and markets.","Mercantilists measured wealth in bullion and sought a favorable balance of trade.","That is laissez-faire, the opposite of Colbert's state-directed economy.","That describes socialism, a nineteenth-century idea.","Free trade is Adam Smith's later answer to mercantilism."],"answer":1},"u1q10":{"id":"u1q10","unit":1,"diff":"e","pool":"quiz","stem":"<p>What happened to King Charles I of England in 1649?<\/p>","options":["He was tried and executed by order of Parliament's leaders","He signed the Bill of Rights and became a constitutional monarch","He fled to France and returned as king in 1660","He was deposed in a bloodless revolution","He dissolved Parliament and began eleven years of personal rule"],"why":["His beheading in January 1649 led to the Commonwealth.","The Bill of Rights was accepted by William and Mary in 1689.","Charles II, his son, returned in 1660; Charles I was dead by then.","That describes James II in 1688.","His personal rule ran from 1629 to 1640, not 1649."],"answer":0},"u1q11":{"id":"u1q11","unit":1,"diff":"m","pool":"exam1","stem":"<p>Louis XIV's revocation of the Edict of Nantes in 1685 had which of the following consequences?<\/p>","options":["France's economy immediately surpassed the Dutch Republic's","France became officially Protestant","Many skilled Huguenot artisans and merchants emigrated to France's rivals","The Fronde broke out against royal authority","The pope excommunicated Louis XIV"],"why":["Losing skilled workers hurt France's economy.","The revocation made Protestant worship illegal; France stayed Catholic.","Around 200,000 Huguenots fled to the Dutch Republic, England, Prussia and America, taking skills and capital with them.","The Fronde (1648–53) happened decades earlier.","The revocation pleased many Catholics; there was no excommunication."],"answer":2},"u1q12":{"id":"u1q12","unit":1,"diff":"m","pool":"quiz","stem":"<p>Which pairing of a state and its form of government around 1700 is correct?<\/p>","options":["France: limited monarchy under a strong Estates-General","Prussia: merchant republic run by town councils","Russia: elected monarchy chosen by the nobility","Dutch Republic: absolute monarchy under the House of Orange","England: constitutional monarchy with Parliament controlling taxation"],"why":["The Estates-General did not meet between 1614 and 1789; France was absolutist.","Prussia was a militarized absolute monarchy.","Russia was an autocracy under hereditary tsars.","The Orange stadtholders were powerful but the Republic had no king.","After 1689 the English crown could not tax without Parliament."],"answer":4},"u1q13":{"id":"u1q13","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which event came FIRST?<\/p>","options":["The Glorious Revolution","The beheading of Charles I","The revocation of the Edict of Nantes","The Treaty of Utrecht","The founding of St. Petersburg"],"why":["1688.","1649, the earliest of these.","1685.","1713.","1703."],"answer":1},"u1q14":{"id":"u1q14","unit":1,"diff":"m","pool":"quiz","stem":"<blockquote>\"The royal throne is not the throne of a man, but the throne of God himself... The person of the king is sacred, and to attack him in any way is sacrilege.\"<\/blockquote><p>The passage above best expresses the ideas of<\/p>","options":["Oliver Cromwell, justifying the Protectorate","Bishop Bossuet, defending divine-right absolutism","John Locke, defending the Glorious Revolution","Spinoza, arguing for religious toleration","the Levellers, demanding wider suffrage"],"why":["Cromwell had helped execute a king; he did not call kings sacred.","Bossuet, tutor to Louis XIV's son, argued that kings are God's ministers on earth.","Locke argued that power comes from the consent of the governed, not from God.","Spinoza was a rationalist critic of religious authority.","The Levellers were radicals who wanted to limit authority, not sanctify kings."],"answer":1},"u1q15":{"id":"u1q15","unit":1,"diff":"m","pool":"exam1","stem":"<p>Peter the Great's Table of Ranks (1722) was designed to<\/p>","options":["free the serfs and give them land","list the provinces that owed tribute to Sweden","tie noble status and promotion to service to the state","rank Orthodox clergy above the nobility","establish an elected Russian parliament"],"why":["Serfdom grew harsher under Peter; emancipation came in 1861.","Russia fought Sweden; it did not pay it tribute.","Rank came from service in the army, navy or bureaucracy, so the nobility worked for the tsar.","Peter subordinated the Church to the state through the Holy Synod.","Russia had no parliament until the Duma of 1906."],"answer":2},"u1q16":{"id":"u1q16","unit":1,"diff":"m","pool":"quiz","stem":"<p>The Treaty of Utrecht (1713) is significant because it<\/p>","options":["forced Britain to return Gibraltar to Spain","placed a Habsburg prince on the Spanish throne","ended Dutch independence","created the German Confederation","kept the French and Spanish crowns separate and upheld a balance of power"],"why":["Britain gained Gibraltar at Utrecht.","The Bourbon Philip V, Louis XIV's grandson, kept Spain.","Dutch independence was not at issue; the Republic was on the winning side.","The German Confederation was created by the Congress of Vienna in 1815.","Philip V kept Spain but could never unite it with France, preventing one dominant power."],"answer":4},"u1q17":{"id":"u1q17","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which group was most likely to support Parliament against Charles I in the English Civil War?<\/p>","options":["Jesuit missionaries","High-church Anglican bishops","Irish Catholics","The great landed nobility of the north and west","Puritans and London merchants"],"why":["Jesuits were banned in England and opposed Puritan Parliament.","Bishops generally backed the king's religious policies.","Irish Catholics were hostile to the Puritan Parliament.","Many northern and western nobles were Royalists.","Parliament's strongholds were the Puritans, the commercial classes and London."],"answer":4},"u1q18":{"id":"u1q18","unit":1,"diff":"m","pool":"exam2","stem":"<p>The 1683 Ottoman siege of Vienna is important because its failure<\/p>","options":["ended Habsburg rule in Austria","caused the Thirty Years' War","began a Habsburg advance that won most of Hungary by 1699","made the Ottoman Empire a member of the Holy Roman Empire","led directly to the unification of Germany"],"why":["The Habsburgs emerged stronger.","That war began in 1618 and ended in 1648.","After the siege was broken, Austria pushed back the Ottomans and gained Hungary at Karlowitz.","The Ottomans were never part of the Holy Roman Empire.","German unification came in 1871."],"answer":2},"u1q19":{"id":"u1q19","unit":1,"diff":"m","pool":"quiz","stem":"<p>A historian argues that seventeenth-century rulers became absolute mainly because war had grown too expensive for traditional revenue. Which evidence would best support this?<\/p>","options":["Rembrandt painted group portraits of Amsterdam militia companies","Prussia's Great Elector created a tax bureaucracy specifically to fund a standing army","Peter the Great required nobles to shave their beards","The English Bill of Rights guaranteed free speech in Parliament","The Peace of Westphalia tolerated Calvinism"],"why":["This is cultural evidence, not evidence about state finance.","The General War Commissariat shows military needs driving state-building.","Beard rules concern cultural westernization, not war finance.","This shows limits on a king, not the fiscal roots of absolutism.","Religious settlement does not show that war costs drove absolutism."],"answer":1},"u1q20":{"id":"u1q20","unit":1,"diff":"m","pool":"exam1","stem":"<p>The Dutch Republic in the seventeenth century was notable for<\/p>","options":["being governed directly from Madrid","religious toleration that attracted Jews, Huguenots and other refugees","its rejection of overseas trade and colonies","strict censorship that drove printers abroad","a powerful landed nobility that dominated trade"],"why":["Independence from Spain was recognized in 1648.","Its relative tolerance drew skilled refugees and dissenting thinkers such as Spinoza.","The VOC made it a leading colonial and trading power.","The Republic was Europe's freest publishing center.","Trade was dominated by urban merchants, not landed nobles."],"answer":1},"u1q21":{"id":"u1q21","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which statement best describes Oliver Cromwell's rule as Lord Protector (1653–1658)?<\/p>","options":["It was a republic in name but a military dictatorship in practice","It ended when Parliament invited William of Orange to rule","It established the first fully democratic government in Europe","It restored the Catholic Church in England","It made England an absolute monarchy under divine right"],"why":["Cromwell relied on the army and dismissed parliaments that opposed him.","That happened to James II in 1688.","Cromwell rejected the Levellers' demand for wide suffrage.","Cromwell was a Puritan and hostile to Catholicism.","Cromwell was not a king, and divine right was the Stuart theory."],"answer":0},"u1q22":{"id":"u1q22","unit":1,"diff":"m","pool":"exam2","stem":"<p>Frederick William, the Great Elector of Brandenburg-Prussia, is best known for<\/p>","options":["defeating Napoleon at Leipzig","becoming the first Holy Roman Emperor from Prussia","building a large standing army and a central bureaucracy to pay for it","granting a liberal constitution to his subjects","unifying Germany through \"blood and iron\""],"why":["The Battle of Leipzig took place in 1813, long after his death in 1688.","No Prussian ruler was Holy Roman Emperor.","He laid the foundations of Prussian militarism and administration.","He ruled as an absolutist.","That was Bismarck in the 1860s."],"answer":2},"u1q23":{"id":"u1q23","unit":1,"diff":"m","pool":"quiz","stem":"<p>The Battle of Poltava (1709) was decisive because it<\/p>","options":["ended the Ottoman threat to Vienna","broke Swedish power and opened Russia's path to the Baltic","forced Louis XIV to accept the Treaty of Utrecht","made Prussia a kingdom","restored the Stuarts to the English throne"],"why":["That was the relief of Vienna in 1683.","Peter's victory over Charles XII led to Russian gains confirmed at Nystad (1721).","Utrecht followed battles in western Europe, not Poltava.","Prussia became a kingdom in 1701 by agreement with the emperor.","The Restoration was in 1660."],"answer":1},"u1q24":{"id":"u1q24","unit":1,"diff":"m","pool":"diag","stem":"<p>\"No taxation without the consent of Parliament\" was a central issue in which conflict?<\/p>","options":["The Dutch revolt against Spain","The struggle between the Stuart kings and Parliament that led to the English Civil War","The War of the Spanish Succession","The Great Northern War","The Fronde in France"],"why":["Taxation was an issue, but \"Parliament\" refers to England.","Charles I's attempts to tax without Parliament helped trigger the war in 1642.","That war was about who would inherit the Spanish throne.","That war was between Russia and Sweden over the Baltic.","The Fronde concerned French nobles and courts; there was no Parliament in the English sense."],"answer":1},"u1q25":{"id":"u1q25","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which of the following best explains why England developed a constitutional monarchy while France developed absolutism?<\/p>","options":["English kings rejected the theory of divine right","English kings depended on Parliament for taxes, while French kings could tax without a national assembly","France had already experienced a successful revolution","England was Catholic while France was Protestant","France had no nobility to resist the king"],"why":["James I and Charles I strongly believed in divine right.","Control of revenue determined who held power; the French crown never had to call the Estates-General.","France's revolution came in 1789.","The reverse is closer to the truth: England was Protestant and France Catholic.","France had a powerful nobility; Louis XIV had to tame it."],"answer":1},"u1q26":{"id":"u1q26","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which development is MOST similar to Louis XIV's use of intendants?<\/p>","options":["The Levellers' call for wider suffrage","England's Bill of Rights limiting the crown","The Peace of Westphalia's grant of sovereignty to German princes","The Dutch reliance on town councils run by regents","Peter the Great's creation of a service bureaucracy loyal to the tsar"],"why":["That was a popular democratic demand, not a royal administrative tool.","That limited royal power rather than extending it.","That decentralized authority within the Empire.","That decentralized merchant government is the opposite of royal centralization.","Both rulers bypassed traditional nobles by relying on officials who owed everything to the crown."],"answer":4},"u1q27":{"id":"u1q27","unit":1,"diff":"h","pool":"exam2","stem":"<p>A French Huguenot silk weaver who left France in 1686 and settled in Berlin would most likely have been<\/p>","options":["expelled immediately as a Catholic","drafted into the Ottoman army","forced to return to France under the Treaty of Utrecht","required to convert to Russian Orthodoxy","welcomed by the Great Elector, who offered refuge to Huguenots to build Prussia's economy"],"why":["Huguenots were Protestants, and Prussia's rulers were Protestant.","Berlin was not Ottoman territory.","Utrecht contained no such provision.","Berlin was in Brandenburg-Prussia, not Russia.","His Edict of Potsdam (1685) invited Huguenots, who boosted Berlin's crafts."],"answer":4},"u1q28":{"id":"u1q28","unit":1,"diff":"h","pool":"exam1","stem":"<p>Which of the following was a provision of the Treaty of Utrecht?<\/p>","options":["Russia received a Baltic coastline","Austria received Gibraltar and Minorca","Britain received the asiento, the right to supply enslaved Africans to Spanish America","France gained Nova Scotia from Britain","Philip V was required to give Spain to the Habsburgs"],"why":["Russia's Baltic gains came at Nystad in 1721.","Britain, not Austria, received Gibraltar and Minorca.","The asiento was one of Britain's chief commercial gains at Utrecht.","France ceded Acadia (Nova Scotia) to Britain.","Philip V kept Spain."],"answer":2},"u1q29":{"id":"u1q29","unit":1,"diff":"h","pool":"quiz","stem":"<p>Locke's Two Treatises of Government (1690) is closely linked to the Glorious Revolution because it<\/p>","options":["defended the divine right of the Stuart dynasty","argued that a ruler who violates the people's rights may be replaced","urged England to adopt Catholicism","called for the abolition of private property","argued for an all-powerful sovereign to prevent civil war"],"why":["That was the position Locke attacked (Filmer's Patriarcha).","Locke's case for government by consent justified removing James II.","Locke supported toleration for Protestants and opposed a Catholic monarch.","Locke made property a natural right.","That is Hobbes's argument in Leviathan (1651)."],"answer":1},"u1q30":{"id":"u1q30","unit":1,"diff":"h","pool":"exam2","stem":"<p>Which statement about the Habsburg monarchy after 1648 is most accurate?<\/p>","options":["It was a multiethnic collection of territories held together by the dynasty, Catholicism and the army","It lost Hungary to the Ottomans in 1699","It was a centralized nation-state with a single language","It controlled the German states more tightly after Westphalia","It adopted a constitutional monarchy like England's"],"why":["Austria, Bohemia and Hungary kept separate laws and estates under one ruler.","At Karlowitz (1699) the Ottomans ceded Hungary to Austria.","The Habsburg lands were linguistically diverse and decentralized.","Westphalia weakened imperial control over the German princes.","The Habsburgs ruled as absolutists where they could."],"answer":0},"u1q31":{"id":"u1q31","unit":1,"diff":"m","pool":"exam2","stem":"<p>The phrase \"one king, one law, one faith\" best summarizes the goals of<\/p>","options":["the Levellers","the Dutch regents","John Locke","Louis XIV","William of Orange"],"why":["The Levellers wanted wider rights, not royal uniformity.","The regents governed a decentralized, tolerant republic.","Locke argued for limited government and toleration.","His centralization and the 1685 revocation of the Edict of Nantes aimed at uniformity under the crown.","William ruled England under the Bill of Rights and supported toleration for Protestant dissenters."],"answer":3},"u1q32":{"id":"u1q32","unit":1,"diff":"e","pool":"exam1","stem":"<p>Who won the English Civil War?<\/p>","options":["The Irish Catholic Confederation","The Parliamentarians, led militarily by Oliver Cromwell","The Scots under James II","The Royalists under Charles I","William of Orange's Dutch army"],"why":["The Irish were defeated by Cromwell in 1649–50.","Cromwell's New Model Army defeated the Royalists by 1646 and again in 1648.","James II reigned in 1685–88; he did not lead the Scots in the 1640s.","Charles I lost and was executed in 1649.","William's landing came in 1688, decades later."],"answer":1},"u1q33":{"id":"u1q33","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which feature distinguished the English Restoration settlement of 1660 from the monarchy before 1640?<\/p>","options":["Cromwell's Protectorate continued alongside the king","Parliament kept its control over taxation and could not be ignored by the king","Divine right was written into law","Catholicism became the state religion","The monarch was now elected by Parliament"],"why":["The Protectorate ended in 1659.","The monarchy returned, but the crown could no longer rule and tax without Parliament.","The settlement limited royal power in practice.","The Church of England was restored, and the Test Act excluded Catholics from office.","The crown remained hereditary; Charles II was the son of Charles I."],"answer":1},"u1q34":{"id":"u1q34","unit":1,"diff":"h","pool":"exam1","stem":"<p>Which comparison of Peter the Great and Louis XIV is most accurate?<\/p>","options":["Both ruled through powerful elected parliaments","Both lost their thrones in revolutions","Both revoked edicts of religious toleration for Protestants","Both strengthened royal power by bringing nobles and the church under tighter state control","Both modeled their reforms on the Dutch republican constitution"],"why":["Neither shared power with a parliament.","Both died as reigning monarchs.","Only Louis did this, in 1685.","Louis used Versailles and Gallican control; Peter used service ranks and the Holy Synod.","Peter admired Dutch shipbuilding, not republicanism; Louis invaded the Dutch."],"answer":3},"u2q1":{"id":"u2q1","unit":2,"diff":"e","pool":"quiz","stem":"<p>In the eighteenth century, the most profitable European colonies in the Americas were the<\/p>","options":["tea plantations of Virginia","gold mines of Louisiana","sugar islands of the Caribbean","farming colonies of New England","fur-trading posts of Canada"],"why":["Virginia grew tobacco; tea came from China.","Louisiana had no gold mines; John Law's promises of wealth there were a fantasy.","Islands such as Saint-Domingue and Jamaica produced sugar that was worth more than any other colonial export.","New England did not produce a major export crop for Europe.","The fur trade was valuable but far smaller than sugar."],"answer":2},"u2q2":{"id":"u2q2","unit":2,"diff":"e","pool":"exam1","stem":"<p>Robert Walpole is significant in British history as<\/p>","options":["the general who captured Quebec","the first prime minister in practice, governing through a cabinet responsible to Parliament","the leader of the Puritan army in the Civil War","the king who replaced James II","the founder of the Bank of England"],"why":["James Wolfe led the attack on Quebec in 1759.","Walpole led the government from 1721 to 1742 and set the pattern of cabinet rule.","That was Oliver Cromwell.","That was William III.","The Bank of England was founded in 1694."],"answer":1},"u2q3":{"id":"u2q3","unit":2,"diff":"e","pool":"exam2","stem":"<p>The Diplomatic Revolution of 1756 refers to<\/p>","options":["the overthrow of James II in favor of William and Mary","Austria allying with its old enemy France, while Britain allied with Prussia","Russia's alliance with Napoleon at Tilsit","France's alliance with the American colonies","the union of England and Scotland"],"why":["That was the Glorious Revolution of 1688.","The switch of partners set the sides for the Seven Years' War.","Tilsit was in 1807.","That came in 1778 during the American Revolution.","That was the Act of Union in 1707."],"answer":1},"u2q4":{"id":"u2q4","unit":2,"diff":"e","pool":"quiz","stem":"<p>Which treaty gave Britain control of Canada?<\/p>","options":["The Treaty of Nystad (1721)","The Treaty of Utrecht (1713)","The Treaty of Paris (1763)","The Peace of Westphalia (1648)","The Treaty of Aix-la-Chapelle (1748)"],"why":["Nystad ended the Great Northern War between Russia and Sweden.","Utrecht gave Britain Nova Scotia, Newfoundland and Hudson Bay, not all of Canada.","It ended the Seven Years' War and transferred New France to Britain.","Westphalia concerned the Thirty Years' War in Europe.","That treaty largely restored colonial conquests."],"answer":2},"u2q5":{"id":"u2q5","unit":2,"diff":"e","pool":"exam1","stem":"<p>The putting-out system involved<\/p>","options":["slave labor on Caribbean plantations","merchants supplying raw materials to rural households that produced goods at home","steam-powered textile mills","guild workshops in large cities","government factories run by state officials"],"why":["That was the plantation system.","Families spun and wove in their cottages; merchants collected and sold the finished cloth.","Mills came with the Industrial Revolution and replaced cottage industry.","Merchants used rural labor to avoid urban guild rules.","The system was private and decentralized."],"answer":1},"u2q6":{"id":"u2q6","unit":2,"diff":"e","pool":"exam2","stem":"<p>Frederick II's invasion of Silesia in 1740 began the<\/p>","options":["Thirty Years' War","War of the Spanish Succession","Great Northern War","War of the Austrian Succession","Crimean War"],"why":["That war ran from 1618 to 1648.","That war ran from 1701 to 1714.","That war (1700–1721) was fought between Russia and Sweden.","Frederick exploited Maria Theresa's accession to seize Silesia.","The Crimean War was fought in the 1850s."],"answer":3},"u2q7":{"id":"u2q7","unit":2,"diff":"m","pool":"quiz","stem":"<p>The main cause of European population growth in the eighteenth century was<\/p>","options":["mass immigration from Asia and Africa","the end of serfdom across Europe","a declining death rate as plague vanished and famines became less frequent","the spread of modern vaccination and antibiotics","government programs encouraging large families"],"why":["There was no large immigration into Europe.","Serfdom survived in central and eastern Europe well into the 1800s.","Fewer deaths from plague and famine, not more births, drove the increase.","Antibiotics came in the 1900s; the smallpox vaccine only in 1796.","No such programs drove the trend."],"answer":2},"u2q8":{"id":"u2q8","unit":2,"diff":"m","pool":"exam1","stem":"<p>Which statement about the Atlantic slave trade in the eighteenth century is accurate?<\/p>","options":["It was controlled entirely by the Dutch","It mainly supplied workers to European factories","It declined sharply as sugar became less profitable","It was abolished by Britain at the Treaty of Utrecht","More enslaved Africans were transported in the 1700s than in any other century"],"why":["Britain, Portugal and France were the leading carriers in this period.","Enslaved people were sent to American plantations.","Sugar profits were high, and the trade expanded.","Utrecht gave Britain the asiento; Britain abolished the trade in 1807.","The trade peaked in the eighteenth century, driven by plantation demand."],"answer":4},"u2q9":{"id":"u2q9","unit":2,"diff":"m","pool":"exam1","stem":"<p>Charles VI's Pragmatic Sanction was intended to<\/p>","options":["abolish serfdom in the Habsburg lands","divide Poland among its neighbors","ensure that his daughter Maria Theresa inherited the Habsburg lands intact","unite the crowns of France and Spain","grant religious toleration to Protestants in Austria"],"why":["Serfdom reform came later under Joseph II.","The partitions of Poland began in 1772.","Charles had no son and sought international guarantees for her succession.","Utrecht forbade that union, and it was not Charles's aim.","That was Joseph II's Edict of Toleration in 1781."],"answer":2},"u2q10":{"id":"u2q10","unit":2,"diff":"m","pool":"exam2","stem":"<p>The South Sea Bubble (1720) and the Mississippi Bubble (1720) were both<\/p>","options":["plagues that killed thousands in port cities","treaties that ended the War of the Spanish Succession","naval battles between Britain and France","slave revolts in the Caribbean","speculative financial collapses tied to companies promising colonial trade profits"],"why":["The Marseille plague of 1720 is unrelated to these crashes.","That war ended with Utrecht and Rastatt.","Neither was a battle.","They were stock-market crashes, not revolts.","Both crashes ruined investors in companies selling dreams of overseas wealth."],"answer":4},"u2q11":{"id":"u2q11","unit":2,"diff":"m","pool":"quiz","stem":"<p>Which of the following was a result of the Seven Years' War?<\/p>","options":["Britain emerged as the dominant colonial power in North America and India","Spain lost all its American colonies","Prussia was forced to return Silesia to Austria","Austria gained control of the Holy Roman Empire's German states","France gained Canada from Britain"],"why":["The Treaty of Paris (1763) removed France from Canada and left Britain dominant in India.","Spain kept its American empire and received Louisiana from France.","Prussia kept Silesia.","There was no such outcome.","France lost Canada."],"answer":0},"u2q12":{"id":"u2q12","unit":2,"diff":"m","pool":"exam2","stem":"<p>Robert Clive's victory at the Battle of Plassey (1757) is significant because it<\/p>","options":["ended the Atlantic slave trade","opened Japan to Western trade","began British East India Company control of Bengal","ended the Mughal Empire's conquest of Europe","gave France control of the spice trade"],"why":["Plassey was in India and unrelated to the slave trade.","Japan was opened by the United States in the 1850s.","Plassey made the Company the real power in Bengal, a base for wider British rule in India.","The Mughals never invaded Europe.","France lost ground in India."],"answer":2},"u2q13":{"id":"u2q13","unit":2,"diff":"m","pool":"diag","stem":"<p>The growth of eighteenth-century consumption of sugar, tea and coffee in Europe most directly encouraged<\/p>","options":["the abandonment of mercantilist policies","a fall in the price of land in Britain","the collapse of the Dutch East India Company within a decade","the decline of European port cities","the expansion of slave-worked plantations in the Americas"],"why":["Mercantilism remained dominant through the century.","There is no direct link between colonial goods and British land prices.","The VOC declined slowly and was dissolved only in 1799.","Ports like Liverpool and Nantes grew rich.","Rising demand for sugar and coffee meant more plantations and more enslaved labor."],"answer":4},"u2q14":{"id":"u2q14","unit":2,"diff":"m","pool":"quiz","stem":"<p>Which pair were allies during the Seven Years' War?<\/p>","options":["Britain and France","Britain and Prussia","Britain and Austria","France and Prussia","Prussia and Austria"],"why":["They were the main colonial rivals.","After the Diplomatic Revolution, Britain subsidized Prussia against Austria, France and Russia.","They had been allies earlier but split in 1756.","France switched to Austria's side in 1756.","Austria wanted to reconquer Silesia from Prussia."],"answer":1},"u2q15":{"id":"u2q15","unit":2,"diff":"m","pool":"exam1","stem":"<p>Frederick William I of Prussia, the \"Soldier King,\" is best known for<\/p>","options":["writing philosophical letters to Voltaire","conquering Silesia from Austria","leading Prussia to defeat at Jena","creating a constitutional monarchy","building a large, well-drilled army and a full treasury through strict economy"],"why":["That was Frederick II.","His son Frederick II did that in 1740.","Jena was in 1806, under Frederick William III.","He was an absolutist.","He made Prussia a major military power while rarely going to war."],"answer":4},"u2q16":{"id":"u2q16","unit":2,"diff":"m","pool":"quiz","stem":"<p>After Louis XIV died in 1715, the Paris parlement regained the right to<\/p>","options":["object to royal decrees before registering them","appoint the king's ministers","elect the king of France","declare war without royal approval","abolish noble tax exemptions"],"why":["The parlements later used this right of remonstrance to block tax reforms.","Ministers were chosen by the king.","The French crown was hereditary.","The parlements were law courts with no war powers.","The parlements defended privilege; they did not abolish it."],"answer":0},"u2q17":{"id":"u2q17","unit":2,"diff":"h","pool":"exam1","stem":"<p>Which development best reflects proto-industrialization in the eighteenth century?<\/p>","options":["The Navigation Acts' restriction of colonial shipping","The guilds' monopoly over urban textile production","The building of steam-powered cotton mills in Manchester","Rural families earning extra income by spinning and weaving for merchants","State-run silk factories in Lyon"],"why":["These were trade laws, not a production system.","Proto-industry grew in the countryside largely to escape guild control.","Mills are the factory system itself, not its precursor.","Proto-industry was market-oriented rural cottage production that came before factories.","Lyon's silk trade was urban and artisanal."],"answer":3},"u2q18":{"id":"u2q18","unit":2,"diff":"h","pool":"quiz","stem":"<p>A historian notes that the national debt of both Britain and France nearly doubled because of the Seven Years' War. Which later development does this best help explain?<\/p>","options":["The South Sea Bubble of 1720","The Glorious Revolution of 1688","The Diplomatic Revolution of 1756","The spread of the potato in eastern Europe","Both the American Revolution and the French fiscal crisis of the 1780s"],"why":["That came before the war.","That came long before the war.","The alliance switch came before the debts were run up.","Crop diffusion is unrelated to war debt.","British taxes on the colonies and France's bankruptcy both grew out of war debt."],"answer":4},"u2q19":{"id":"u2q19","unit":2,"diff":"h","pool":"exam2","stem":"<p>Which factor contributed LEAST to Europe's eighteenth-century population growth?<\/p>","options":["The disappearance of bubonic plague from western Europe","A milder climate after the seventeenth century","The spread of the potato","Improved transportation for moving grain","Advances in hospital medicine"],"why":["This sharply reduced mortality.","Better harvests reduced famine.","The potato provided cheap calories and reduced famine.","Better roads and canals relieved local shortages.","Hospitals of the period often spread disease; medicine had little demographic effect before the 1800s."],"answer":4},"u2q20":{"id":"u2q20","unit":2,"diff":"h","pool":"quiz","stem":"<p>Which statement best compares Britain and France in the mid-1700s?<\/p>","options":["Neither country participated in the Atlantic slave trade","Britain was an absolute monarchy and France a parliamentary state","Britain's Parliament-backed credit let it borrow cheaply for war, while France's finances were hampered by privilege and distrust of banks","France had a larger navy and won most colonial wars","Both abolished their colonial empires after 1763"],"why":["Both were major slave-trading nations.","The reverse is true.","Britain's credit system funded naval victories; France's tax exemptions and memories of John Law's collapse limited its borrowing.","Britain's navy was superior, and Britain won the Seven Years' War.","Both kept empires; France kept its sugar islands."],"answer":2},"u2q21":{"id":"u2q21","unit":2,"diff":"m","pool":"quiz","stem":"<p>What was the asiento that Britain won in 1713?<\/p>","options":["The right to supply enslaved Africans to Spanish America","A royal charter for the Bank of England","A monopoly on the tea trade with China","Permanent fishing rights in the Baltic","Control of the Mississippi River"],"why":["The asiento contract was the commercial prize of Utrecht and was later held by the South Sea Company.","The Bank of England was chartered in 1694.","The British East India Company's China trade was unrelated to the asiento.","The asiento concerned the slave trade.","The Mississippi remained in French and then Spanish hands until 1803."],"answer":0},"u2q22":{"id":"u2q22","unit":2,"diff":"e","pool":"diag","stem":"<p>Which crop from the Americas most helped Europe reduc
