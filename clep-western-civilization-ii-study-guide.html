e famine in the eighteenth century?<\/p>","options":["The potato","Sugarcane","Coffee","Rice","Tobacco"],"why":["Potatoes yielded many calories per acre and grew in poor soils.","Sugar was a cash crop grown in the Caribbean, not a European staple.","Coffee is a stimulant, not a staple food.","Rice was not a major American crop in Europe's diet.","Tobacco is not a food."],"answer":0},"u2q23":{"id":"u2q23","unit":2,"diff":"m","pool":"exam2","stem":"<p>Which best describes how mercantilist Britain viewed its colonies?<\/p>","options":["As territories governed directly by Parliament's elected colonial members","As places to build factories that would compete with Britain","As sources of raw materials and markets that should trade mainly with Britain","As burdens to be abandoned as soon as possible","As independent nations free to trade with anyone"],"why":["Colonies had no seats in Parliament.","Colonial manufacturing was discouraged.","The Navigation Acts channeled colonial trade through British ships and ports.","Britain fought major wars to keep and expand them.","Mercantilism restricted colonial trade."],"answer":2},"u2q24":{"id":"u2q24","unit":2,"diff":"h","pool":"quiz","stem":"<p>Which of the following is the best evidence that the Seven Years' War was a \"world war\"?<\/p>","options":["It started because of a dynastic succession dispute","It involved more than one German state","It lasted seven years","Fighting took place in Europe, North America, the Caribbean, India and at sea","It ended with a treaty signed in Paris"],"why":["It was rooted in Silesia and colonial rivalry, not succession.","German states fought each other in many wars.","Length alone does not make a war global.","Its theaters spanned several continents and oceans.","Many treaties were signed in Paris."],"answer":3},"u3q1":{"id":"u3q1","unit":3,"diff":"e","pool":"quiz","stem":"<p>Who first proposed, in a book published in 1543, that the Earth revolves around the Sun?<\/p>","options":["Isaac Newton","Nicolaus Copernicus","Johannes Kepler","Ptolemy","Galileo Galilei"],"why":["Newton explained why planets orbit (gravity) in 1687.","His On the Revolutions of the Heavenly Spheres put the Sun at the center.","Kepler refined the model with elliptical orbits after 1600.","Ptolemy was the ancient author of the Earth-centered model.","Galileo supported heliocentrism with evidence after 1610, but did not first propose it."],"answer":1},"u3q2":{"id":"u3q2","unit":3,"diff":"e","pool":"quiz","stem":"<p>Isaac Newton's Principia (1687) is best known for<\/p>","options":["arguing for the divine right of kings","the law of universal gravitation and three laws of motion","describing the circulation of the blood","proving that the mind is a blank slate at birth","defending the Earth-centered universe"],"why":["Principia is a work of physics.","It showed that one set of physical laws governs both the heavens and the Earth.","That was William Harvey (1628).","That is Locke's Essay (1690).","Newton's work confirmed the Sun-centered system."],"answer":1},"u3q3":{"id":"u3q3","unit":3,"diff":"e","pool":"exam2","stem":"<p>Which thinker is associated with the statement \"I think, therefore I am\"?<\/p>","options":["René Descartes","Thomas Hobbes","John Locke","Blaise Pascal","Francis Bacon"],"why":["It comes from his Discourse on Method (1637), the starting point of his rationalism.","Hobbes is known for Leviathan.","Locke is known for empiricism and natural rights.","Pascal is known for his religious Pensées and mathematics.","Bacon emphasized observation and experiment."],"answer":0},"u3q4":{"id":"u3q4","unit":3,"diff":"e","pool":"diag","stem":"<p>According to Thomas Hobbes, people in the state of nature live lives that are<\/p>","options":["noble and uncorrupted by civilization","governed by the divine right of kings","organized into democratic assemblies","peaceful and guided by natural rights","\"solitary, poor, nasty, brutish, and short\""],"why":["That is Rousseau's idea of the noble savage, from the 1700s.","Hobbes based authority on a social contract, not on God.","Hobbes's state of nature has no government at all.","That is closer to Locke's view.","Hobbes used this bleak picture to argue for an all-powerful sovereign."],"answer":4},"u3q5":{"id":"u3q5","unit":3,"diff":"e","pool":"exam1","stem":"<p>Galileo's telescope observations included<\/p>","options":["moons orbiting Jupiter","the law of universal gravitation","the planet Neptune","the elliptical shape of planetary orbits","bacteria in drops of water"],"why":["These showed that not every heavenly body circles the Earth.","That was Newton's work.","Neptune was discovered in 1846.","Kepler discovered elliptical orbits by calculation.","Leeuwenhoek saw microorganisms with a microscope."],"answer":0},"u3q6":{"id":"u3q6","unit":3,"diff":"e","pool":"exam2","stem":"<p>Francis Bacon promoted which approach to knowledge?<\/p>","options":["Reliance on the authority of Aristotle","Ignoring practical uses of science","Accepting truths revealed in dreams and visions","Induction: drawing general conclusions from careful observation and experiment","Deduction from self-evident first principles"],"why":["Bacon attacked uncritical reliance on ancient authority.","Bacon insisted knowledge should be useful.","Bacon demanded empirical evidence.","Bacon's Novum Organum urged experimental investigation of nature.","That is Descartes's rationalism."],"answer":3},"u3q7":{"id":"u3q7","unit":3,"diff":"e","pool":"exam1","stem":"<p>William Harvey's major contribution was<\/p>","options":["showing that blood circulates through the body pumped by the heart","the law of gases relating pressure and volume","developing a smallpox vaccine","the first heliocentric model","the discovery of oxygen"],"why":["His 1628 work overturned Galen's theory of blood.","That is Boyle's law.","Jenner developed it in 1796.","That was Copernicus.","Oxygen was identified in the 1770s."],"answer":0},"u3q8":{"id":"u3q8","unit":3,"diff":"m","pool":"diag","stem":"<p>Which statement best contrasts Hobbes and Locke?<\/p>","options":["Both believed rebellion against a government is always justified","Hobbes defended democracy; Locke defended dictatorship","Both rejected the idea of a social contract","Hobbes thought people must surrender their rights to an absolute ruler; Locke thought government exists to protect natural rights and may be overthrown","Hobbes supported the divine right of kings; Locke supported absolute monarchy"],"why":["Hobbes denied any right of rebellion.","Neither description fits.","Both built their theories on a social contract.","This is the core difference between Leviathan and the Two Treatises.","Hobbes used a social contract, not divine right, and Locke opposed absolutism."],"answer":3},"u3q9":{"id":"u3q9","unit":3,"diff":"m","pool":"exam1","stem":"<p>Kepler's laws of planetary motion depended most on<\/p>","options":["Newton's law of universal gravitation","the precise observational data collected by Tycho Brahe","Ptolemy's model of epicycles","Galileo's experiments with falling bodies","Church records of eclipses"],"why":["Newton came after Kepler and explained his laws.","Kepler, Brahe's assistant, used his records of Mars to discover elliptical orbits.","Kepler replaced epicycles.","Those concerned motion on Earth.","Kepler's key source was Brahe's modern observations."],"answer":1},"u3q10":{"id":"u3q10","unit":3,"diff":"m","pool":"exam1","stem":"<p>Galileo's trial before the Inquisition in 1633 resulted from<\/p>","options":["his invention of calculus","his dissection of human corpses","his public defense of the Copernican system in the Dialogue Concerning the Two Chief World Systems","his support of the Protestant Reformation","his claim that the Earth was the center of the universe"],"why":["Calculus was developed later by Newton and Leibniz.","That was Vesalius's method in anatomy.","The Church saw the book as defying its 1616 order not to teach heliocentrism as fact.","Galileo remained a Catholic.","Galileo argued the opposite."],"answer":2},"u3q11":{"id":"u3q11","unit":3,"diff":"m","pool":"exam2","stem":"<p>John Locke's concept of the tabula rasa implied that<\/p>","options":["social classes are fixed by birth","humans are born with knowledge of God and morality","reason is useless without revelation","kings rule by divine right","education and environment could improve human beings"],"why":["The idea undermined claims of inborn superiority.","Locke rejected innate ideas.","Locke valued reason and experience.","Tabula rasa is a theory of knowledge, not of kingship.","If people are shaped by experience, better institutions could make better people."],"answer":4},"u3q12":{"id":"u3q12","unit":3,"diff":"m","pool":"exam2","stem":"<p>Which of the following pairs a thinker with the correct idea?<\/p>","options":["Bacon: the Earth is the center of the universe","Descartes: knowledge comes only from sense experience","Hugo Grotius: natural law governs relations between nations","Vesalius: planets move in ellipses","Hobbes: people have a right to overthrow unjust rulers"],"why":["Bacon did not defend geocentrism.","That is empiricism; Descartes was a rationalist.","Grotius's On the Law of War and Peace founded international law.","Vesalius was an anatomist; Kepler discovered ellipses.","That is Locke; Hobbes denied any such right."],"answer":2},"u3q13":{"id":"u3q13","unit":3,"diff":"m","pool":"exam2","stem":"<p>The founding of the Royal Society of London and the French Academy of Sciences in the 1660s shows that<\/p>","options":["women were admitted as full members of scientific bodies","science was considered a threat to every monarchy","the Catholic Church controlled scientific research in England","governments and elites had begun to sponsor and organize scientific research","universities had become the main centers of scientific innovation"],"why":["Women were excluded; Margaret Cavendish was only a visitor.","Monarchs such as Charles II and Louis XIV supported these bodies.","England was Protestant, and the Royal Society was independent of Rome.","State-backed academies gave science institutional prestige and support.","Much innovation happened outside the conservative universities."],"answer":3},"u3q14":{"id":"u3q14","unit":3,"diff":"m","pool":"quiz","stem":"<blockquote>\"The heavens are perfect and unchanging; the Earth, at the center, is the realm of change and decay.\"<\/blockquote><p>Which observation most directly challenged this view?<\/p>","options":["Harvey's discovery of the circulation of the blood","Boyle's experiments with gases","Descartes's development of analytic geometry","Galileo's sighting of mountains and craters on the Moon","Locke's argument for a tabula rasa"],"why":["This concerned anatomy, not the heavens.","These concerned chemistry.","This was a mathematical tool, not an observation.","An uneven, Earth-like Moon showed that heavenly bodies were not perfect.","This concerned human knowledge."],"answer":3},"u3q15":{"id":"u3q15","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which of the following best describes the \"clockmaker\" view of God that many drew from Newton's work?<\/p>","options":["The universe has no creator","God reveals scientific truths only through scripture","God designed the universe to run by natural laws and does not intervene in its operation","God personally moves each planet every day","God punishes scientists who question the Church"],"why":["The clockmaker image presupposes a designer.","Newtonian science relied on observation and mathematics.","This deist image follows from the Newtonian machine universe.","The clockmaker image implies a self-running machine.","This is not what the metaphor means."],"answer":2},"u3q16":{"id":"u3q16","unit":3,"diff":"m","pool":"exam1","stem":"<p>Vesalius's work in anatomy and Copernicus's work in astronomy, both published in 1543, had in common that they<\/p>","options":["challenged ancient authorities (Galen and Ptolemy) through new investigation","were immediately accepted by all universities","relied on the telescope","were written to support the Protestant Reformation","proved the law of universal gravitation"],"why":["Both books corrected classical authorities through direct study.","Acceptance came slowly.","The telescope was not used in astronomy until 1609.","Neither was a religious tract.","That was Newton in 1687."],"answer":0},"u3q17":{"id":"u3q17","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which work was written in part to justify the Glorious Revolution?<\/p>","options":["Newton's Principia","Hobbes's Leviathan","Descartes's Discourse on Method","Locke's Two Treatises of Government","Bacon's Novum Organum"],"why":["That is a work of physics.","Leviathan appeared in 1651 and defended strong sovereign power.","That is a 1637 work of philosophy written in France.","Locke defended the replacement of James II as resistance to a ruler who violated the people's rights.","That was a 1620 treatise on scientific method."],"answer":3},"u3q18":{"id":"u3q18","unit":3,"diff":"m","pool":"quiz","stem":"<p>Pierre Bayle's Historical and Critical Dictionary (1697) contributed to the new view of society by<\/p>","options":["defending the persecution of religious minorities","applying skeptical criticism to religious and historical claims and urging toleration","reviving Aristotle's physics","calling for a return to absolute monarchy","proving the existence of witches"],"why":["Bayle, a Huguenot exile, argued for toleration.","Bayle insisted no belief should be accepted without evidence.","Bayle was a critic, not a defender, of old authorities.","His work was critical, not a political program for absolutism.","Bayle's skepticism helped end belief in witchcraft."],"answer":1},"u3q19":{"id":"u3q19","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which development came LAST?<\/p>","options":["Harvey's work on the circulation of the blood","Publication of Newton's Principia","Publication of Hobbes's Leviathan","Publication of Copernicus's On the Revolutions","Galileo's trial before the Inquisition"],"why":["1628.","1687, the latest of these.","1651.","1543.","1633."],"answer":1},"u3q20":{"id":"u3q20","unit":3,"diff":"h","pool":"exam1","stem":"<p>A historian argues that the Scientific Revolution changed how educated Europeans decided what was true. Which change best supports this?<\/p>","options":["The Catholic Church immediately endorsed Galileo's work","Universities stopped teaching Latin","Scientists rejected all belief in God","Most peasants accepted heliocentrism by 1700","Authority shifted from ancient texts and tradition to observation, experiment and mathematical proof"],"why":["The Church condemned Galileo in 1633.","Latin remained the language of scholarship.","Most leading scientists, including Newton, were religious.","The new science spread mainly among elites.","This change of method, more than any single discovery, defines the revolution."],"answer":4},"u3q21":{"id":"u3q21","unit":3,"diff":"h","pool":"exam2","stem":"<p>Which of the following was a weakness of Copernicus's original model?<\/p>","options":["It kept circular orbits, so it predicted planetary positions no better than Ptolemy's","It relied on telescope observations that were later shown to be faulty","It denied the existence of the planets","It placed the Earth at the center of the universe","It was based on Newton's flawed equations"],"why":["Accuracy improved only when Kepler introduced ellipses.","Copernicus had no telescope.","It described the known planets orbiting the Sun.","Copernicus placed the Sun at the center.","Newton came more than a century later."],"answer":0},"u3q22":{"id":"u3q22","unit":3,"diff":"h","pool":"quiz","stem":"<p>Hobbes's political conclusions were most directly shaped by<\/p>","options":["his experience as a minister of Louis XIV","the Glorious Revolution of 1688","the revocation of the Edict of Nantes","the disorder of the English Civil War","the French Revolution"],"why":["Hobbes was English and never served Louis XIV.","Leviathan was published in 1651, decades earlier.","That came in 1685, long after Leviathan.","Having lived through civil war, he valued order above liberty.","The French Revolution came more than a century later."],"answer":3},"u3q23":{"id":"u3q23","unit":3,"diff":"h","pool":"exam2","stem":"<p>The combination of Bacon's and Descartes's approaches is significant because<\/p>","options":["Descartes's dualism proved that Bacon's induction was invalid","modern scientific method joins experimental observation with mathematical reasoning","their ideas led directly to the revocation of the Edict of Nantes","both men defended the authority of Aristotle","both men rejected experiment entirely"],"why":["Neither method disproved the other.","Newton's work showed how experiment and mathematics together produce reliable laws.","The revocation was a religious-political act by Louis XIV.","Both attacked reliance on Aristotle.","Bacon championed experiment."],"answer":1},"u3q24":{"id":"u3q24","unit":3,"diff":"h","pool":"quiz","stem":"<p>Which statement about women in the Scientific Revolution is most accurate?<\/p>","options":["Some women contributed to science, but they were largely excluded from universities and academies","Women were barred from all scientific activity by law","Women held most of the seats in the Royal Society","Women led the opposition to heliocentrism","Women founded the French Academy of Sciences"],"why":["Maria Winkelmann was denied an academy post despite discovering a comet.","No such law existed; women worked in households and family observatories.","Women were not admitted as fellows until 1945.","There is no evidence of this.","It was founded under Louis XIV's minister Colbert."],"answer":0},"u3q25":{"id":"u3q25","unit":3,"diff":"h","pool":"exam1","stem":"<p>Which development helped end the European witch hunts by around 1700?<\/p>","options":["Educated elites adopted a mechanistic, skeptical worldview that made magic seem implausible","Newton's personal campaign against witch trials","The Treaty of Utrecht's ban on religious courts","The discovery of the circulation of the blood","The Catholic Church's adoption of heliocentrism"],"why":["Judges and officials stopped accepting accusations as the new science spread.","Newton led no such campaign.","Utrecht contained no such provision.","Harvey's work did not address witchcraft.","The Church did not endorse heliocentrism in this period."],"answer":0},"u3q26":{"id":"u3q26","unit":3,"diff":"m","pool":"quiz","stem":"<p>A thinker who says the mind is like a blank sheet of paper and that all knowledge comes from experience is expressing<\/p>","options":["rationalism, as in Descartes's philosophy","empiricism, as in Locke's Essay Concerning Human Understanding","divine-right theory, as in Bossuet","geocentrism, as in Ptolemy","mercantilism, as in Colbert"],"why":["Descartes believed in innate ideas known by reason.","Locke's empiricism grounded all knowledge in experience.","That concerns monarchy, not knowledge.","That is a cosmology.","That is an economic doctrine."],"answer":1},"u4q1":{"id":"u4q1","unit":4,"diff":"e","pool":"exam2","stem":"<p>Which German Jewish philosopher argued that Jews could be full participants in European culture and loyal citizens?<\/p>","options":["Karl Marx","Johann Gottfried Herder","Moses Mendelssohn","Martin Luther","Immanuel Kant"],"why":["Marx was a nineteenth-century socialist.","Herder wrote on national culture and language.","Mendelssohn was a leading voice of the Jewish Enlightenment (Haskalah).","Luther was a sixteenth-century reformer.","Kant was a Prussian philosopher, not Jewish."],"answer":2},"u4q2":{"id":"u4q2","unit":4,"diff":"e","pool":"exam1","stem":"<p>Most philosophes were best described as<\/p>","options":["defenders of the Catholic Church's political power","revolutionaries who demanded immediate democracy everywhere","opponents of all scientific inquiry","reformers who wanted rational, tolerant government, not necessarily democracy","supporters of the divine right of kings"],"why":["They generally attacked clerical power.","Few philosophes before 1789 called for full democracy.","They were enthusiastic about science.","Many, like Voltaire, hoped for an enlightened monarch rather than popular rule.","They judged government by reason and utility."],"answer":3},"u4q3":{"id":"u4q3","unit":4,"diff":"e","pool":"quiz","stem":"<p>Which Enlightenment thinker argued for the separation of powers into legislative, executive and judicial branches?<\/p>","options":["Adam Smith","Montesquieu","Beccaria","Voltaire","Rousseau"],"why":["Smith wrote on economics.","The Spirit of the Laws (1748) made the separation of powers famous.","Beccaria wrote on criminal justice.","Voltaire is best known for toleration and satire.","Rousseau stressed the general will and popular sovereignty."],"answer":1},"u4q4":{"id":"u4q4","unit":4,"diff":"e","pool":"exam1","stem":"<p>Adam Smith's The Wealth of Nations (1776) argued that<\/p>","options":["free markets guided by an \"invisible hand\" of competition promote prosperity","workers should own the means of production","governments should hoard gold and silver through tariffs","colonies are the only true source of wealth","the state should set all prices and wages"],"why":["Smith attacked mercantilist controls and favored laissez-faire.","That is socialism, which came later.","That is mercantilism, which Smith criticized.","Smith saw labor and productivity as the sources of wealth.","Smith opposed such controls."],"answer":0},"u4q5":{"id":"u4q5","unit":4,"diff":"e","pool":"quiz","stem":"<p>The opening line \"Man is born free, and everywhere he is in chains\" comes from<\/p>","options":["Voltaire's Candide","Locke's Two Treatises of Government","Rousseau's The Social Contract","Hobbes's Leviathan","Marx's Communist Manifesto"],"why":["Candide is a satirical novel about optimism.","Locke wrote about natural rights but not this line.","The 1762 work argued that legitimate government must express the general will.","Hobbes described life in the state of nature as \"nasty, brutish, and short.\"","The Manifesto ends \"Workers of the world, unite!\" and dates from 1848."],"answer":2},"u4q6":{"id":"u4q6","unit":4,"diff":"e","pool":"exam2","stem":"<p>Cesare Beccaria's On Crimes and Punishments (1764) called for<\/p>","options":["harsher punishments for religious dissenters","the abolition of all prisons","the restoration of trial by ordeal","rule by the Catholic Inquisition","an end to torture and the death penalty"],"why":["Beccaria opposed cruelty and arbitrariness.","Beccaria favored proportionate punishment, not abolishing prisons.","Beccaria favored rational justice.","Beccaria criticized arbitrary courts.","Beccaria argued punishments should prevent crime, not inflict cruelty."],"answer":4},"u4q7":{"id":"u4q7","unit":4,"diff":"e","pool":"quiz","stem":"<p>Who edited the Encyclopedia, a major summary of Enlightenment knowledge?<\/p>","options":["Denis Diderot","Adam Smith","Catherine the Great","Isaac Newton","Immanuel Kant"],"why":["Diderot and d'Alembert led the project from 1751 to 1772.","Smith wrote The Wealth of Nations.","Catherine was a patron of Diderot but not the editor.","Newton died in 1727 and was a scientist, not an encyclopedist.","Kant was a German philosopher."],"answer":0},"u4q8":{"id":"u4q8","unit":4,"diff":"e","pool":"exam1","stem":"<p>Which ruler was an \"enlightened despot\"?<\/p>","options":["Louis XIV of France","Frederick II of Prussia","Oliver Cromwell","William III of England","Charles I of England"],"why":["Louis XIV was an absolutist before the Enlightenment.","He corresponded with Voltaire, abolished torture and promoted toleration while keeping absolute power.","Cromwell ruled England in the 1650s, before the Enlightenment.","William was a constitutional monarch.","Charles was a divine-right Stuart king executed in 1649."],"answer":1},"u4q9":{"id":"u4q9","unit":4,"diff":"e","pool":"exam2","stem":"<p>Mary Wollstonecraft's A Vindication of the Rights of Woman argued that<\/p>","options":["women should not be allowed to read novels","women should receive the same education as men because they are equally capable of reason","women's suffrage had already been achieved in Britain","women should be confined to domestic life","women should rule as absolute monarchs"],"why":["Her argument centered on education and reason.","She blamed women's apparent inferiority on lack of education.","British women gained the vote only in 1918 and 1928.","That was Rousseau's view, which she attacked.","She wrote about rights and education, not monarchy."],"answer":1},"u4q10":{"id":"u4q10","unit":4,"diff":"m","pool":"exam1","stem":"<p>Joseph II of Austria's reforms differed from those of Frederick II and Catherine II in that Joseph<\/p>","options":["abolished serfdom, though resistance led to most of his reforms being reversed","ignored Enlightenment ideas completely","shared power with an elected parliament","refused to grant any religious toleration","strengthened the privileges of the nobility"],"why":["Joseph went further than other enlightened despots and paid for it.","He was the most enthusiastic reformer of the three.","Joseph remained an absolute ruler.","His Edict of Toleration (1781) did the opposite.","That fits Catherine's Charter of the Nobility."],"answer":0},"u4q11":{"id":"u4q11","unit":4,"diff":"m","pool":"quiz","stem":"<p>Catherine the Great's response to Pugachev's Rebellion (1773–1775) was to<\/p>","options":["ally more closely with the nobility, confirming their privileges in the Charter of the Nobility","call an elected parliament with peasant representatives","adopt Rousseau's general will as Russia's constitution","emancipate the serfs to win their loyalty","abdicate in favor of her son"],"why":["After the revolt she relied on nobles to keep order and expanded serfdom.","No such parliament was created.","Catherine never adopted a constitution.","Serfdom expanded under Catherine; emancipation came in 1861.","She ruled until her death in 1796."],"answer":0},"u4q12":{"id":"u4q12","unit":4,"diff":"m","pool":"exam1","stem":"<p>The partitions of Poland in 1772, 1793 and 1795 were carried out by<\/p>","options":["Russia, Prussia and Austria","Sweden and the Ottoman Empire","the Holy Roman Emperor and the pope","France, Britain and Spain","Napoleon and his allies"],"why":["All three took Polish land in 1772 and 1795; Russia and Prussia alone in 1793.","Neither took part.","The pope had no role.","Western powers did not partition Poland.","Napoleon later created the Duchy of Warsaw out of partitioned land."],"answer":0},"u4q13":{"id":"u4q13","unit":4,"diff":"m","pool":"exam1","stem":"<p>Most philosophes held which view of religion?<\/p>","options":["Strict Catholic orthodoxy","Polytheism based on classical gods","That religion should control government","Deism, the belief in a rational creator who does not intervene in the world","Puritan predestination"],"why":["Philosophes criticized the Church's power.","This was not a significant Enlightenment position.","Philosophes favored toleration and limits on clerical power.","Many, like Voltaire, rejected miracles and church authority but believed in a creator.","Philosophes rejected harsh dogma."],"answer":3},"u4q14":{"id":"u4q14","unit":4,"diff":"m","pool":"diag","stem":"<p>Which of the following institutions did the MOST to spread Enlightenment ideas among elite men and women in Paris?<\/p>","options":["The Estates-General","Guild workshops","The Jesuit order","The royal army","Salons hosted by educated women"],"why":["It did not meet between 1614 and 1789.","Guilds organized trades, not intellectual debate.","The Jesuits generally defended the Church against the philosophes.","The army was not a vehicle for spreading ideas.","Salons brought together writers, nobles and officials to discuss new ideas."],"answer":4},"u4q15":{"id":"u4q15","unit":4,"diff":"m","pool":"exam2","stem":"<blockquote>\"Political liberty is to be found only when there is no abuse of power. But constant experience shows us that every man invested with power is liable to abuse it... To prevent this abuse, it is necessary from the very nature of things that power should be a check to power.\"<\/blockquote><p>The author of this passage would most likely support<\/p>","options":["a single assembly with unlimited power","abolishing all government","an absolute monarch ruling by divine right","a constitution dividing authority among separate branches of government","rule by the Catholic Church"],"why":["That would concentrate power, not check it.","The passage seeks to limit, not abolish, government.","The passage warns against unchecked power.","This is Montesquieu's argument for checks and balances.","The passage concerns dividing power, not clerical rule."],"answer":3},"u4q16":{"id":"u4q16","unit":4,"diff":"m","pool":"exam2","stem":"<p>Voltaire's campaign on behalf of Jean Calas illustrates his commitment to<\/p>","options":["the partition of Poland","mercantilist economics","religious toleration and fair justice","the general will","the divine right of kings"],"why":["The Calas case had nothing to do with Poland.","The Calas case was about justice and religion.","Calas, a Protestant, was executed after a trial shaped by anti-Protestant prejudice.","That is Rousseau's concept.","Voltaire did not defend divine right."],"answer":2},"u4q17":{"id":"u4q17","unit":4,"diff":"m","pool":"exam2","stem":"<p>Which statement about Rousseau distinguishes him from most other philosophes?<\/p>","options":["He opposed all forms of education","He supported enlightened despotism","He was a devoted Catholic who defended the Church's power","He valued emotion and nature and was suspicious of civilization's effects, anticipating Romanticism","He believed private property was a natural right"],"why":["Emile is a treatise on education.","Rousseau favored popular sovereignty.","Rousseau was not a defender of Church power.","Rousseau's emphasis on feeling and natural man set him apart.","Rousseau saw property as a source of inequality."],"answer":3},"u4q18":{"id":"u4q18","unit":4,"diff":"m","pool":"diag","stem":"<p>The physiocrats differed from mercantilists in arguing that<\/p>","options":["the nobility should be abolished","colonies are the key to national power","land and agriculture, not gold and silver, are the true source of wealth","manufacturing should be state-owned","governments should regulate all trade"],"why":["The physiocrats were not social revolutionaries.","That is a mercantilist idea.","Quesnay and the physiocrats also urged free trade in grain.","The physiocrats favored free markets.","That is closer to mercantilism."],"answer":2},"u4q19":{"id":"u4q19","unit":4,"diff":"m","pool":"quiz","stem":"<p>The liberum veto contributed to the partitions of Poland because it<\/p>","options":["allowed any single noble to block legislation, leaving the state weak","required Poland to obey the Russian tsar","banned Poland from having an army","forced the Polish nobility to free their serfs","gave the Polish king absolute power"],"why":["Poland could not raise taxes or armies to defend itself.","It was a rule of the Polish parliament itself.","There was no such ban, though the army was small.","It had nothing to do with serfdom.","Polish kings were elected and weak."],"answer":0},"u4q20":{"id":"u4q20","unit":4,"diff":"m","pool":"exam1","stem":"<p>Frederick II of Prussia described himself as<\/p>","options":["\"the state, it is I\"","\"God's lieutenant on earth\"","\"the first servant of the state\"","\"Lord Protector\"","\"Emperor of the French\""],"why":["That line is attributed to Louis XIV.","That expresses Bossuet's divine-right theory.","He presented monarchy as a duty to serve the state, not a personal possession.","That was Cromwell's title.","That was Napoleon's title from 1804."],"answer":2},"u4q21":{"id":"u4q21","unit":4,"diff":"m","pool":"exam2","stem":"<p>Which work came FIRST?<\/p>","options":["Montesquieu's The Spirit of the Laws","Beccaria's On Crimes and Punishments","Wollstonecraft's A Vindication of the Rights of Woman","Smith's The Wealth of Nations","Rousseau's The Social Contract"],"why":["1748.","1764.","1792.","1776.","1762."],"answer":0},"u4q22":{"id":"u4q22","unit":4,"diff":"h","pool":"quiz","stem":"<p>Which development best illustrates the limits of enlightened despotism?<\/p>","options":["Kant wrote \"What Is Enlightenment?\"","Catherine II expanded serfdom despite praising Enlightenment ideals","Joseph II granted toleration to Protestants","Frederick II abolished judicial torture","Diderot completed the Encyclopedia"],"why":["Kant's essay is not an act of government.","Rulers took reforms that strengthened the state but kept the social order that supported them.","This was a genuine reform.","This was a real Enlightenment reform, not a limit.","This was a philosophe's project, not a monarch's policy."],"answer":1},"u4q23":{"id":"u4q23","unit":4,"diff":"h","pool":"exam2","stem":"<p>Kant's motto \"Dare to know!\" (Sapere aude) best captures the Enlightenment's emphasis on<\/p>","options":["the divine right of monarchs","obedience to established religious authority","emotion as the highest form of truth","the collective will of the nation","the individual's courage to use reason independently of authority"],"why":["Kant's essay is about individual reason.","Kant urged independence from guardians, including clergy.","That is a Romantic idea.","That is closer to Rousseau or later nationalism.","Kant defined enlightenment as leaving \"self-imposed immaturity.\""],"answer":4},"u4q24":{"id":"u4q24","unit":4,"diff":"h","pool":"exam2","stem":"<p>An eighteenth-century reformer argues that a prisoner's guilt should be proven by evidence rather than a confession under torture, and that punishments should be certain but moderate. Which work most likely influenced him?<\/p>","options":["Rousseau's Emile","Smith's The Wealth of Nations","Bossuet's Politics Drawn from Holy Scripture","Beccaria's On Crimes and Punishments","Hobbes's Leviathan"],"why":["Emile concerns education.","Smith wrote on economics.","Bossuet defended divine-right monarchy.","These are Beccaria's key arguments.","Hobbes defended absolute sovereign power, not legal reform."],"answer":3},"u4q25":{"id":"u4q25","unit":4,"diff":"h","pool":"exam2","stem":"<p>Which outcome best shows Rousseau's general will being used to justify the suppression of individuals?<\/p>","options":["Adam Smith's support for free trade","Catherine II's Charter of the Nobility","Revolutionary leaders claiming to embody the people's will while silencing opponents","Joseph II's Edict of Toleration","Montesquieu's praise of the English constitution"],"why":["That is unrelated to the general will.","That was a grant of privilege to nobles, not an appeal to the general will.","Robespierre and the Jacobins later invoked the general will to justify the Terror.","That expanded individual freedom.","Montesquieu favored checks on power."],"answer":2},"u4q26":{"id":"u4q26","unit":4,"diff":"h","pool":"exam1","stem":"<p>Which statement best explains why the Enlightenment spread widely in the eighteenth century?<\/p>","options":["The Catholic Church officially endorsed the philosophes","Governments everywhere abolished censorship","The partitions of Poland spread French culture eastward","Growing literacy, cheaper printing and new public spaces created a reading public for new ideas","Most peasants attended universities"],"why":["The Church condemned many of their works.","Censorship persisted, especially in France.","The partitions were acts of power politics.","The public sphere of print, coffeehouses and salons carried ideas beyond small elites.","Universities served a small elite."],"answer":3},"u4q27":{"id":"u4q27","unit":4,"diff":"m","pool":"quiz","stem":"<p>Joseph II's Edict of Toleration (1781) granted<\/p>","options":["religious freedom to Protestants and Orthodox Christians in the Habsburg lands","the Catholic Church control of all schools","independence to Hungary","noble exemption from all taxation","the vote to all adult men"],"why":["It extended toleration beyond Catholicism.","Joseph reduced Church power.","Hungary remained under Habsburg rule.","Joseph tried to tax nobles more fairly.","There was no democratic suffrage."],"answer":0},"u4q28":{"id":"u4q28","unit":4,"diff":"h","pool":"exam1","stem":"<p>The partition of Poland most directly contradicts the claim that enlightened despots<\/p>","options":["read Enlightenment authors","were interested in reform","governed by reason and justice rather than traditional power politics","strengthened their states","were absolute rulers"],"why":["All three did.","All three made genuine reforms at home.","Frederick, Catherine and Joseph seized a neighbor's land for gain.","The partitions did strengthen their states.","They were absolute rulers."],"answer":2},"u4q29":{"id":"u4q29","unit":4,"diff":"e","pool":"diag","stem":"<p>The salon hostesses of eighteenth-century Paris, such as Madame Geoffrin, were important because they<\/p>","options":["controlled the Catholic Church in France","organized gatherings where writers and elites discussed Enlightenment ideas","wrote the French constitution of 1791","commanded French armies in the Seven Years' War","ran the royal treasury"],"why":["They had no Church authority.","Salons were key meeting places of the Republic of Letters.","The National Assembly wrote that constitution.","Women did not command armies.","They held no state office."],"answer":1},"u4q30":{"id":"u4q30","unit":4,"diff":"m","pool":"exam1","stem":"<p>Which pair correctly matches a thinker with a work?<\/p>","options":["Voltaire – Candide","Rousseau – The Wealth of Nations","Montesquieu – The Social Contract","Smith – The Spirit of the Laws","Beccaria – Emile"],"why":["Candide (1759) satirizes the claim that this is \"the best of all possible worlds.\"","Adam Smith wrote The Wealth of Nations.","Rousseau wrote The Social Contract.","Montesquieu wrote The Spirit of the Laws.","Rousseau wrote Emile."],"answer":0},"u4q31":{"id":"u4q31","unit":4,"diff":"h","pool":"quiz","stem":"<p>Which comparison of Locke and Rousseau is most accurate?<\/p>","options":["Locke supported democracy by majority vote of all citizens; Rousseau supported absolute monarchy","Both rejected the idea of a social contract","Both wrote before the Glorious Revolution","Both believed private property was the root of all inequality","Locke emphasized protecting individual rights, especially property; Rousseau emphasized the community's general will"],"why":["Rousseau favored popular sovereignty.","Both built on a social contract.","Rousseau wrote in the 1750s and 1760s.","That was Rousseau's view, not Locke's.","Locke's liberalism centers on the individual; Rousseau's theory centers on collective sovereignty."],"answer":4},"u4q32":{"id":"u4q32","unit":4,"diff":"m","pool":"quiz","stem":"<p>The Enlightenment idea that human institutions should be judged by reason and can be improved is closely linked to<\/p>","options":["the divine right of kings","the belief in progress","the revival of medieval guilds","the defense of judicial torture","the doctrine of original sin as unchangeable"],"why":["Divine right placed kingship beyond rational criticism.","Philosophes believed reason could steadily improve society.","Philosophes generally criticized guild restrictions.","Philosophes attacked torture.","Philosophes downplayed original sin."],"answer":1},"u4q33":{"id":"u4q33","unit":4,"diff":"e","pool":"quiz","stem":"<p>Voltaire's satirical novel Candide (1759) mocked<\/p>","options":["the separation of powers","the partition of Poland","free-market economics","the Scientific Revolution","the naive optimism that \"all is for the best in the best of all possible worlds\""],"why":["Voltaire did not attack Montesquieu's idea.","Candide predates the partitions.","Candide is not about economics.","Voltaire popularized Newton's science.","Candide's misfortunes ridicule this philosophy, associated with Leibniz."],"answer":4},"u4q34":{"id":"u4q34","unit":4,"diff":"m","pool":"quiz","stem":"<p>Which ruler's reforms were most resisted by nobles, clergy and non-German peoples, leading to their reversal?<\/p>","options":["Frederick II of Prussia","George III of Britain","Joseph II of Austria","Louis XV of France","Catherine II of Russia"],"why":["Frederick avoided challenging the Junkers.","George III was a constitutional monarch.","His centralizing and anti-clerical reforms provoked revolts in Hungary and the Austrian Netherlands.","Louis XV was not a major reformer.","Catherine accommodated the nobility."],"answer":2},"u4q35":{"id":"u4q35","unit":4,"diff":"h","pool":"quiz","stem":"<p>Which development MOST directly reflects the influence of Montesquieu?<\/p>","options":["The partitions of Poland","Catherine II's Charter of the Nobility","The U.S. Constitution's three branches with checks and balances","The Jacobin Reign of Terror","Adam Smith's critique of mercantilism"],"why":["These were acts of conquest.","That confirmed noble privilege.","The framers cited Montesquieu more than any other modern author.","The Terror concentrated power rather than dividing it.","That is economics, not constitutional design."],"answer":2},"u5q1":{"id":"u5q1","unit":5,"diff":"e","pool":"exam1","stem":"<p>The immediate cause of Louis XVI's decision to call the Estates-General in 1789 was<\/p>","options":["the royal government's financial crisis","a British invasion of France","Napoleon's coup d'état","the pope's demand for church reform","the execution of Marie Antoinette"],"why":["Debt and the privileged orders' refusal of new taxes forced the king to summon the Estates-General.","Britain did not invade France in 1789.","Napoleon's coup came in 1799.","The papacy did not ask for the Estates-General.","She was executed in 1793."],"answer":0},"u5q2":{"id":"u5q2","unit":5,"diff":"e","pool":"quiz","stem":"<p>On June 20, 1789, members of the Third Estate swore the Tennis Court Oath, vowing to<\/p>","options":["restore Louis XVI to absolute power","remain together until they had written a constitution for France","declare war on Austria","elect Napoleon as First Consul","execute the king"],"why":["They were limiting royal power.","Locked out of their hall, the deputies of the new National Assembly met on a tennis court.","War came in April 1792.","Napoleon took power in 1799.","The king was executed in 1793."],"answer":1},"u5q3":{"id":"u5q3","unit":5,"diff":"e","pool":"diag","stem":"<p>The Declaration of the Rights of Man and of the Citizen (1789) proclaimed that<\/p>","options":["the Catholic Church is the only legal religion","nobles are exempt from taxes","men are born and remain free and equal in rights","the king rules by divine right","women have equal political rights with men"],"why":["It protected freedom of opinion, including religious opinion.","It required taxes to be shared according to means.","The Declaration set out natural rights and equality before the law.","It placed sovereignty in the nation.","Its failure to include women prompted Olympe de Gouges's response."],"answer":2},"u5q4":{"id":"u5q4","unit":5,"diff":"e","pool":"exam2","stem":"<p>The Reign of Terror is most closely associated with<\/p>","options":["Robespierre and the Committee of Public Safety","Lafayette and the National Guard","Louis XVIII and the Bourbon Restoration","Metternich and the Congress of Vienna","Napoleon and the Directory"],"why":["The Committee ran the Terror from 1793 to 1794.","Lafayette was a moderate who fled France in 1792.","The Restoration came in 1814.","Metternich opposed revolution.","Napoleon overthrew the Directory in 1799, years after the Terror."],"answer":0},"u5q5":{"id":"u5q5","unit":5,"diff":"e","pool":"exam2","stem":"<p>Napoleon's Civil Code (1804) did which of the following?<\/p>","options":["Gave women equal rights with men","Abolished private property","Made Catholicism compulsory","Restored the privileges of the nobility","Established equality of male citizens before the law and protected property rights"],"why":["It made wives legally subordinate to husbands.","It strongly protected property.","It upheld religious freedom.","It confirmed the abolition of feudal privilege.","The Code preserved key liberal gains of the Revolution."],"answer":4},"u5q6":{"id":"u5q6","unit":5,"diff":"e","pool":"exam2","stem":"<p>Which battle in 1805 ended Napoleon's hopes of invading Britain?<\/p>","options":["Austerlitz","Leipzig","Valmy","Trafalgar","Waterloo"],"why":["Austerlitz was a French land victory over Austria and Russia.","Leipzig (1813) was a land battle in Germany.","Valmy (1792) stopped a Prussian invasion of France.","Nelson's destruction of the Franco-Spanish fleet gave Britain command of the seas.","Waterloo (1815) was Napoleon's final defeat on land."],"answer":3},"u5q7":{"id":"u5q7","unit":5,"diff":"e","pool":"exam1","stem":"<p>Napoleon's final defeat came at the Battle of<\/p>","options":["Jena in 1806","Trafalgar in 1805","Austerlitz in 1805","Borodino in 1812","Waterloo in 1815"],"why":["Jena was his victory over Prussia.","Trafalgar was a naval defeat, not his final one.","Austerlitz was one of his greatest victories.","Borodino was a costly French victory before he entered Moscow.","Wellington and Blücher defeated him during the Hundred Days."],"answer":4},"u5q8":{"id":"u5q8","unit":5,"diff":"e","pool":"quiz","stem":"<p>The principal architect of the Congress of Vienna was<\/p>","options":["Klemens von Metternich of Austria","Napoleon Bonaparte","Maximilien Robespierre","Otto von Bismarck of Prussia","Camillo di Cavour"],"why":["Metternich hosted the Congress and shaped its conservative settlement.","Napoleon was the defeated enemy.","Robespierre died in 1794.","Bismarck led Prussia in the 1860s.","Cavour unified Italy in the 1850s and 1860s."],"answer":0},"u5q9":{"id":"u5q9","unit":5,"diff":"e","pool":"quiz","stem":"<p>The Continental System was Napoleon's attempt to<\/p>","options":["free the serfs of Russia","defeat Britain economically by closing European ports to British trade","unite all German states under Prussia","establish a common European parliament","restore the Holy Roman Empire"],"why":["Russian serfdom lasted until 1861.","The Berlin Decree of 1806 launched the blockade.","Napoleon weakened Prussia.","No such parliament existed.","He abolished it in 1806."],"answer":1},"u5q10":{"id":"u5q10","unit":5,"diff":"e","pool":"exam1","stem":"<p>Who led the slave revolution in Saint-Domingue that led to the independence of Haiti?<\/p>","options":["Olympe de Gouges","Horatio Nelson","Simón Bolívar","Georges Danton","Toussaint Louverture"],"why":["De Gouges was a French writer on women's rights.","Nelson was a British admiral.","Bolívar led independence movements in South America.","Danton was a Paris revolutionary leader.","He led the revolt and its armies until his capture in 1802; Haiti won independence in 1804."],"answer":4},"u5q11":{"id":"u5q11","unit":5,"diff":"e","pool":"quiz","stem":"<p>Which group made up about 97 percent of France's population before 1789?<\/p>","options":["The émigrés","The Second Estate","The Third Estate","The sans-culottes alone","The First Estate"],"why":["Émigrés were nobles who fled after 1789.","The nobility was about 2 percent.","It included peasants, urban workers and the bourgeoisie.","The sans-culottes were Parisian workers, only part of the Third Estate.","The clergy was under 1 percent."],"answer":2},"u5q12":{"id":"u5q12","unit":5,"diff":"e","pool":"exam1","stem":"<p>The storming of the Bastille on July 14, 1789, is significant because it<\/p>","options":["ended the Reign of Terror","showed that the Paris crowd would use force to defend the National Assembly","began the war with Austria","restored the king's absolute power","brought Napoleon to power"],"why":["The Terror ended in 1794.","Popular violence saved the Assembly from royal troops and made revolution irreversible.","War came in 1792.","It weakened royal power.","Napoleon took power in 1799."],"answer":1},"u5q13":{"id":"u5q13","unit":5,"diff":"e","pool":"diag","stem":"<p>The Concordat of 1801 was an agreement between Napoleon and<\/p>","options":["the Directory","the British government","Tsar Alexander I","the Jacobin Club","Pope Pius VII"],"why":["Napoleon overthrew the Directory.","Peace with Britain was the Treaty of Amiens (1802).","Napoleon's treaty with Alexander was Tilsit (1807).","The Jacobin Club was closed in 1794.","It restored the Catholic Church in France under state supervision."],"answer":4},"u5q14":{"id":"u5q14","unit":5,"diff":"e","pool":"exam2","stem":"<p>The Congress of Vienna created the German Confederation, which was<\/p>","options":["a republic with a national parliament","a French puppet state","a loose union of 39 states under Austrian leadership","a unified German empire ruled by Prussia","part of the Russian Empire"],"why":["It had only a diet of state representatives.","It was designed to contain France.","It replaced Napoleon's Confederation of the Rhine and the old Holy Roman Empire.","German unification under Prussia came in 1871.","It was dominated by Austria."],"answer":2},"u5q15":{"id":"u5q15","unit":5,"diff":"m","pool":"quiz","stem":"<p>Why did the voting method in the Estates-General become a crisis in 1789?<\/p>","options":["The Estates-General voted to abolish itself","The Third Estate wanted to vote by order to protect peasants","Voting by order let the two privileged estates outvote the Third Estate, which demanded voting by head","The king insisted that only nobles could vote","The clergy refused to attend"],"why":["The Third Estate instead declared itself the National Assembly.","The Third Estate wanted voting by head.","The Third Estate had as many deputies as the other two combined but would lose 2 to 1 by order.","All three estates had deputies.","The clergy attended; many parish priests later joined the Third."],"answer":2},"u5q16":{"id":"u5q16","unit":5,"diff":"m","pool":"exam2","stem":"<p>The Civil Constitution of the Clergy (1790) was significant because it<\/p>","options":["made Protestantism the official religion of France","was welcomed by the pope as a fair compromise","ended the Revolution's conflict with the Church","restored the Church lands seized in 1789","divided Catholics and turned many devout French people against the Revolution"],"why":["It reorganized the Catholic Church.","Pope Pius VI condemned it.","It intensified that conflict.","The lands stayed nationalized.","Requiring an oath split the clergy and fueled counter-revolution, notably in the Vendée."],"answer":4},"u5q17":{"id":"u5q17","unit":5,"diff":"m","pool":"exam2","stem":"<p>Which event came FIRST?<\/p>","options":["The execution of Louis XVI","The Flight to Varennes","The levée en masse","The declaration of war on Austria","The October Days march on Versailles"],"why":["January 1793.","June 1791.","August 1793.","April 1792.","October 1789."],"answer":4},"u5q18":{"id":"u5q18","unit":5,"diff":"m","pool":"exam2","stem":"<p>The levée en masse of 1793 was significant because it<\/p>","options":["returned confiscated lands to the Church","gave women the right to vote","mobilized the entire nation for war, creating a mass citizen army","ended the war with Austria and Prussia","abolished the French army"],"why":["It concerned military mobilization.","Women did not gain the vote in France until 1944.","It marked the start of modern total war.","The war continued.","It vastly expanded the army."],"answer":2},"u5q19":{"id":"u5q19","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which statement best describes the Directory (1795–1799)?<\/p>","options":["A radical dictatorship that executed thousands","A conservative republic run by property owners that was weak, corrupt and dependent on the army","A military government led by Robespierre","A democratic government elected by all adults","An absolute monarchy restored under Louis XVIII"],"why":["That describes the Terror.","Its instability made Napoleon's coup possible.","Robespierre had been executed in 1794.","Voting was limited to property owners.","The Bourbons returned only in 1814."],"answer":1},"u5q20":{"id":"u5q20","unit":5,"diff":"m","pool":"exam2","stem":"<p>Which group was most likely to support the Jacobins in 1793?<\/p>","options":["Peasants of the Vendée","Émigré nobles","Refractory priests","The Paris sans-culottes","Austrian diplomats"],"why":["The Vendée rose in royalist, Catholic revolt.","Émigrés sought to overthrow the Revolution.","Priests who refused the oath opposed the Revolution.","Working-class Parisians backed radical measures like price controls.","Austria was at war with the Republic."],"answer":3},"u5q21":{"id":"u5q21","unit":5,"diff":"m","pool":"diag","stem":"<p>Napoleon's use of plebiscites to approve his rise to power illustrates<\/p>","options":["his alliance with the Jacobins","his dependence on the pope","his commitment to parliamentary government","his use of democratic forms to legitimize authoritarian rule","his restoration of the Estates-General"],"why":["He suppressed Jacobins.","Plebiscites appealed to the people, not the Church.","He reduced legislatures to rubber stamps.","Voters approved his constitutions, but real power stayed with him.","He never restored it."],"answer":3},"u5q22":{"id":"u5q22","unit":5,"diff":"m","pool":"quiz","stem":"<blockquote>\"If the basis of popular government in time of peace is virtue, its basis in time of revolution is both virtue and terror: virtue, without which terror is murderous; terror, without which virtue is powerless.\"<\/blockquote><p>The speaker was most likely<\/p>","options":["Maximilien Robespierre, justifying the Reign of Terror","Napoleon Bonaparte, explaining the Civil Code","Metternich, defending the Concert of Europe","Edmund Burke, attacking the French Revolution","Louis XVI, addressing the Estates-General"],"why":["Robespierre gave this argument in February 1794.","Napoleon did not speak of terror and virtue this way.","Metternich opposed revolutionary terror.","Burke condemned the Revolution's violence.","The king did not justify revolutionary terror."],"answer":0},"u5q23":{"id":"u5q23","unit":5,"diff":"m","pool":"diag","stem":"<p>Which of the following was a major cause of Napoleon's downfall?<\/p>","options":["The disastrous invasion of Russia in 1812","His alliance with Britain after 1807","His refusal to fight in Spain","The success of the Continental System in ruining Britain","His defeat at Austerlitz"],"why":["He lost most of his Grand Army, encouraging a new coalition.","Britain remained his enemy.","He invaded Spain in 1808.","The system failed and alienated Europe.","Austerlitz was a great victory."],"answer":0},"u5q24":{"id":"u5q24","unit":5,"diff":"m","pool":"exam2","stem":"<p>The Peninsular War (1808–1814) is significant because it<\/p>","options":["showed how nationalist guerrilla resistance could drain Napoleon's armies","was fought between Prussia and Russia","caused the abolition of the Holy Roman Empire","led to Napoleon's coronation as emperor","ended with France annexing Portugal permanently"],"why":["Spanish guerrillas and Wellington's army tied down hundreds of thousands of French troops.","It was fought in Spain and Portugal.","That was in 1806, before the war.","He was crowned in 1804.","The French were driven out."],"answer":0},"u5q25":{"id":"u5q25","unit":5,"diff":"m","pool":"quiz","stem":"<p>The Congress of Vienna's decision to strengthen the Netherlands, Prussia and Piedmont-Sardinia was intended to<\/p>","options":["reward them for revolutionary reforms","contain France by surrounding it with stronger buffer states","give them overseas colonies","prepare them to unify Italy and Germany","punish them for supporting Napoleon"],"why":["The Congress opposed revolution.","These states guarded France's northern and eastern borders.","Britain, not these states, made colonial gains.","Unification was not a goal; the Congress opposed nationalism.","They were strengthened, not punished."],"answer":1},"u5q26":{"id":"u5q26","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which principle guided the Congress of Vienna's restoration of the Bourbons to the French throne?<\/p>","options":["National self-determination","Collective security","Laissez-faire","Legitimacy","Popular sovereignty"],"why":["That principle shaped the 1919 settlement.","That concept belongs to the League of Nations.","That is an economic doctrine.","The Congress restored \"legitimate\" pre-revolutionary dynasties.","The Congress rejected popular sovereignty."],"answer":3},"u5q27":{"id":"u5q27","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which statement about women in the French Revolution is most accurate?<\/p>","options":["The Napoleonic Code made women legally equal to men","Women led the Committee of Public Safety","Women took part in key events but were denied political rights, and their clubs were banned in 1793","Women won the right to vote in the Constitution of 1791","Olympe de Gouges became a leader of the Directory"],"why":["The Code subordinated wives to husbands.","All its members were men.","Women marched in the October Days, yet the Convention closed women's political clubs.","Only male \"active citizens\" voted.","She was executed in 1793."],"answer":2},"u5q28":{"id":"u5q28","unit":5,"diff":"m","pool":"exam2","stem":"<p>After the Thermidorian Reaction of 1794, the Convention<\/p>","options":["abolished private property","restored Louis XVI to the throne","declared war on Russia","ended the Terror and dismantled radical measures such as price controls","crowned Napoleon emperor"],"why":["The Thermidorians protected property owners.","Louis XVI had already been executed in 1793.","France invaded Russia in 1812.","Thermidor closed the Jacobin Club and lifted the Maximum.","That happened in 1804."],"answer":3},"u5q29":{"id":"u5q29","unit":5,"diff":"m","pool":"exam1","stem":"<p>The Battle of Austerlitz (1805) was significant because Napoleon<\/p>","options":["lost his navy to the British","defeated the Prussian army","defeated the combined armies of Austria and Russia","captured Moscow","was forced into exile on Elba"],"why":["That was Trafalgar.","Prussia was defeated at Jena (1806).","The \"Battle of the Three Emperors\" led Austria to make peace and paved the way to dissolving the Holy Roman Empire.","He entered Moscow in 1812.","That followed his 1814 abdication."],"answer":2},"u5q30":{"id":"u5q30","unit":5,"diff":"m","pool":"exam1","stem":"<p>The Declaration of Pillnitz (1791) increased tension because Austria and Prussia<\/p>","options":["agreed to partition France","promised to abolish serfdom","declared war on Britain","suggested they would act to restore Louis XVI's authority","recognized the French Republic"],"why":["There was no such agreement.","The declaration concerned France.","Neither did so.","French revolutionaries took it as a threat, contributing to war in 1792.","France was not a republic until 1792."],"answer":3},"u5q31":{"id":"u5q31","unit":5,"diff":"m","pool":"exam2","stem":"<p>Which reform of the National Assembly (1789–1791) reflected liberal economic ideas?<\/p>","options":["The Continental System","The dechristianization campaign","The Maximum on bread prices","The abolition of guilds and internal tolls","The levée en masse"],"why":["That was Napoleon's blockade.","That was a radical cultural program of 1793–94.","Price controls were a radical Jacobin measure of 1793.","Removing these barriers fostered a free market in labor and goods.","That was a military measure."],"answer":3},"u5q32":{"id":"u5q32","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which settlement made by the Congress of Vienna proved a long-term source of nationalist resentment?<\/p>","options":["The creation of a Concert of Europe","Austrian control of Lombardy-Venetia in Italy","The return of the pope to Rome","Britain's acquisition of the Cape Colony","The restoration of the Bourbons in France"],"why":["The Concert was a diplomatic practice, not a territorial grievance.","Italian nationalists later fought to expel Austria.","Not mainly a nationalist grievance in 1815.","This did not provoke European nationalism.","The French overthrew Charles X in 1830, but this was not a nationalist grievance."],"answer":1},"u5q33":{"id":"u5q33","unit":5,"diff":"h","pool":"exam2","stem":"<p>A historian argues that the French Revolution began as a \"revolt of the nobility.\" Which evidence best supports this?<\/p>","options":["The parlements and the Assembly of Notables blocked royal tax reforms and demanded the Estates-General","Peasants burned manor records during the Great Fear","The sans-culottes demanded price controls","Parisian women marched to Versailles","The Third Estate declared itself the National Assembly"],"why":["Privileged groups' resistance in 1787–88 forced the crisis that opened the door to revolution.","That was a peasant revolt against lords.","That was a working-class demand.","That was a popular action.","That was a bourgeois-led act."],"answer":0},"u5q34":{"id":"u5q34","unit":5,"diff":"h","pool":"quiz","stem":"<p>Which of the following was a long-term consequence of Napoleon's conquests in Europe?<\/p>","options":["A unified Italian state in 1815","Russia's adoption of the Napoleonic Code","The revival of the Holy Roman Empire","The spread of legal equality and the growth of nationalism among conquered peoples","The permanent restoration of feudal privileges in Germany"],"why":["Italy remained divided until 1861.","Russia did not adopt it.","It was never revived.","The Code spread reforms, while occupation provoked national resistance.","Feudal dues were weakened, not restored, in many areas."],"answer":3},"u5q35":{"id":"u5q35","unit":5,"diff":"h","pool":"exam2","stem":"<p>Which statement best compares the American and French Revolutions?<\/p>","options":["Both began as a result of foreign invasion","Both abolished slavery immediately","Both ended with a military emperor","Both drew on Enlightenment ideas of natural rights, but the French Revolution also attacked an entrenched aristocracy and established church","Both were opposed by Enlightenment thinkers"],"why":["Neither began with an invasion.","The United States kept slavery until 1865; France abolished it in 1794 but Napoleon restored it.","Only France produced Napoleon.","The French Revolution was more socially radical.","Both drew on Enlightenment thought."],"answer":3},"u5q36":{"id":"u5q36","unit":5,"diff":"h","pool":"quiz","stem":"<p>The Napoleonic Code is best described as both revolutionary and conservative because it<\/p>","options":["gave workers the right to strike while abolishing property","abolished religion but restored nobility","restored the monarchy but kept the Terror's courts","was written by Robespierre and enforced by Louis XVIII","preserved legal equality and property rights while strengthening the authority of fathers and husbands"],"why":["It restricted workers and protected property.","It protected religious freedom and did not restore feudal privilege.","It did neither.","Napoleon's jurists wrote it in 1804.","It kept the Revolution's civil equality but rolled back gains for women."],"answer":4},"u5q37":{"id":"u5q37","unit":5,"diff":"h","pool":"exam1","stem":"<p>Which development most directly allowed the French Republic to survive the military crisis of 1793?<\/p>","options":["An alliance with Britain","The restoration of Louis XVI","Napoleon's victory at Austerlitz","Austria's decision to remain neutral","The mobilization of mass citizen armies under the Committee of Public Safety"],"why":["Britain was at war with France.","Louis XVI had been executed.","Austerlitz came in 1805.","Austria was France's main enemy.","Conscription, centralized control and wartime production turned the tide by 1794."],"answer":4},"u5q38":{"id":"u5q38","unit":5,"diff":"h","pool":"quiz","stem":"<p>A peasant in the Vendée in 1793 would most likely have opposed the Revolution because of<\/p>","options":["the Concordat of 1801","the attack on the Catholic Church and military conscription","the Congress of Vienna","the abolition of feudal dues","the restoration of the monarchy"],"why":["The Concordat came years later and reconciled Catholics.","Religious grievances and the 1793 draft sparked the Vendée rising.","That came in 1814–15.","Peasants welcomed that.","The monarchy had just been abolished."],"answer":1},"u5q39":{"id":"u5q39","unit":5,"diff":"h","pool":"exam1","stem":"<p>Which of the following best explains why the Congress of Vienna treated defeated France leniently?<\/p>","options":["Because Britain wanted France to dominate Europe","Because Metternich wished to spread revolutionary ideas","Because France had won the war","To avoid creating a vengeful France and to keep the restored Bourbons stable","Because Napoleon remained on the throne"],"why":["Britain wanted a balance of power.","Metternich opposed revolution.","France was defeated.","A moderate peace supported the balance of power.","Napoleon was exiled."],"answer":3},"u5q40":{"id":"u5q40","unit":5,"diff":"h","pool":"exam2","stem":"<p>The Haitian Revolution differed from the French Revolution in that it<\/p>","options":["was inspired by opposition to Enlightenment ideas","was supported by Napoleon throughout","ended with the creation of a French colony","was led by formerly enslaved people and created an independent state that abolished slavery permanently","restored an absolute monarchy under Louis XVIII"],"why":["Its leaders invoked the rights of man.","Napoleon tried to crush it and restore slavery.","It ended French rule.","Haiti became the first state founded by people who had freed themselves from slavery.","Haiti broke away from France."],"answer":3},"u5q41":{"id":"u5q41","unit":5,"diff":"m","pool":"exam1","stem":"<p>The Great Fear of 1789 refers to<\/p>","options":["the Terror of 1793–1794","peasant revolts and panic in the countryside, with attacks on manor houses and records of dues","the panic after the Russian campaign of 1812","the fear of a British invasion in 1805","the royal family's fear during the October Days"],"why":["That came four years later.","Rumors of aristocratic plots led peasants to attack the symbols of seigneurialism.","That came much later.","That is unrelated to 1789.","The October Days were a separate Paris event."],"answer":1},"u5q42":{"id":"u5q42","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which of these was a goal of the Concert of Europe?<\/p>","options":["Spreading republican government across Europe","Supporting Napoleon's return in 1815","Ending all monarchies in Europe","Uniting Germany under Prussia","Maintaining the 1815 settlement by cooperation among the great powers"],"why":["The Concert opposed revolution.","The allies defeated him at Waterloo.","The Concert defended monarchy.","The Concert supported the German Confederation.","The powers met periodically to suppress threats to order."],"answer":4},"u5q43":{"id":"u5q43","unit":5,"diff":"h","pool":"exam1","stem":"<p>Which of the following was the MOST radical measure of the National Convention, 1792–1794?<\/p>","options":["Adopting the Declaration of the Rights of Man","Creating the departments","Abolishing the monarchy, executing the king, and attempting to dechristianize France","Issuing assignats backed by Church lands","Establishing the Bank of France"],"why":["That was the National Assembly's work in 1789.","That was a reform of 1790.","These went far beyond the moderate reforms of 1789–91.","That began in 1789–90.","That was Napoleon's work in 1800."],"answer":2},"u5q44":{"id":"u5q44","unit":5,"diff":"m","pool":"quiz","stem":"<p>Which event marks the formal end of the Holy Roman Empire?<\/p>","options":["The Treaty of Utrecht in 1713","Napoleon's reorganization of Germany in 1806","The unification of Germany in 1871","The Congress of Vienna in 1815","The Peace of Westphalia in 1648"],"why":["Utrecht did not end the Empire.","After Austerlitz, the emperor dissolved the Empire and Napoleon created the Confederation of the Rhine.","The Empire had been gone for 65 years by then.","Vienna did not revive the Empire; it created the German Confederation.","Westphalia weakened but did not end the Empire."],"answer":1},"u5q45":{"id":"u5q45","unit":5,"diff":"m","pool":"quiz","stem":"<p>Edmund Burke's Reflections on the Revolution in France (1790) argued that<\/p>","options":["destroying long-standing institutions in the name of abstract rights would lead to chaos and tyranny","laissez-faire economics required revolution","the Third Estate was \"everything\"","Louis XVI should be executed for treason","the Revolution should spread to Britain as soon as possible"],"why":["Burke defended gradual change rooted in tradition; he is the founder of modern conservatism.","Burke's book is about political tradition, not economics.","That was Sieyès's claim.","Burke defended the monarchy.","Burke opposed the Revolution."],"answer":0},"u5q46":{"id":"u5q46","unit":5,"diff":"m","pool":"exam1","stem":"<p>Which work was written to DEFEND the French Revolution against Burke's criticism?<\/p>","options":["Bossuet's Politics Drawn from Holy Scripture","Joseph de Maistre's Considerations on France","Metternich's memoirs","Napoleon's Civil Code","Thomas Paine's The Rights of Man"],"why":["Bossuet defended absolute monarchy a century earlier.","De Maistre was a fierce conservative critic.","Metternich was a conservative opponent of revolution.","The Code is a law code, not a reply to Burke.","Paine defended popular sovereignty and natural rights in 1791."],"answer":4},"u5q47":{"id":"u5q47","unit":5,"diff":"m","pool":"exam1","stem":"<p>The Treaty of Tilsit (1807) is significant because it<\/p>","options":["marked Napoleon's peace with Russia and the height of his power on the continent","created the German Confederation","forced Napoleon into exile on Elba","ended the Peninsular War","restored the Bourbons"],"why":["Alexander I joined the Continental System, and Prussia lost half its territory.","That was created in 1815.","That followed his 1814 abdication.","The Peninsular War began in 1808.","The Bourbons returned in 1814."],"answer":0},"u6q1":{"id":"u6q1","unit":6,"diff":"e","pool":"quiz","stem":"<p>The Industrial Revolution began in which country?<\/p>","options":["Spain","France","Russia","Italy","Great Britain"],"why":["Spain industrialized late and unevenly.","France industrialized later, slowed by revolution and war.","Russia industrialized late in the nineteenth century.","Italy industrialized late, mainly in the north.","Britain's coal, capital, markets and stable government made it the first industrial nation."],"answer":4},"u6q2":{"id":"u6q2","unit":6,"diff":"e","pool":"exam1","stem":"<p>James Watt is best known for<\/p>","options":["greatly improving the efficiency of the steam engine","building the first railway locomotive to win the Rainhill trials","writing The Wealth of Nations","inventing the spinning jenny","leading the Chartist movement"],"why":["His separate condenser and rotary motion made steam power practical for factories.","That was George Stephenson's Rocket.","That was Adam Smith.","That was James Hargreaves.","Chartism was a working-class movement of the 1830s and 1840s."],"answer":0},"u6q3":{"id":"u6q3","unit":6,"diff":"e","pool":"exam2","stem":"<p>The first industry to be transformed by factory production in Britain was<\/p>","options":["shipbuilding","cotton textiles","automobile manufacturing","chemical dyes","electrical goods"],"why":["Shipbuilding mechanized later.","Spinning and weaving machines created the first factories.","Automobiles came in the late 1800s.","Synthetic dyes came in the mid-1800s, led by Germany.","Electricity came in the late 1800s."],"answer":1},"u6q4":{"id":"u6q4","unit":6,"diff":"e","pool":"diag","stem":"<p>The Luddites were<\/p>","options":["workers who destroyed textile machinery they blamed for taking their jobs","landowners who supported the Corn Laws","socialist followers of Karl Marx","engineers who promoted railways","middle-class reformers who campaigned for free trade"],"why":["The Luddite riots took place in 1811–1816.","Landowners were not Luddites.","Marx wrote later, in the 1840s.","Luddites opposed machines.","That describes the Anti-Corn Law League."],"answer":0},"u6q5":{"id":"u6q5","unit":6,"diff":"e","pool":"quiz","stem":"<p>Which law gave the vote to many middle-class men in Britain?<\/p>","options":["The Poor Law Amendment Act of 1834","The Corn Laws of 1815","The Factory Act of 1833","The Reform Act of 1832","The Combination Acts"],"why":["That created the workhouse system.","Those were tariffs on grain.","That regulated child labor.","It redistributed seats to industrial towns and enfranchised middle-class property holders.","Those banned trade unions."],"answer":3},"u6q6":{"id":"u6q6","unit":6,"diff":"e","pool":"exam2","stem":"<p>The People's Charter of 1838 demanded<\/p>","options":["the abolition of the monarchy","higher tariffs on grain","a return to the putting-out system","universal male suffrage and a secret ballot","votes for women"],"why":["The Charter sought parliamentary reform, not a republic.","Chartists generally opposed the Corn Laws.","Chartists sought political rights.","These were two of the Chartists' six points.","The Charter called for manhood suffrage only."],"answer":3},"u6q7":{"id":"u6q7","unit":6,"diff":"e","pool":"exam1","stem":"<p>Enclosure in eighteenth-century Britain involved<\/p>","options":["closing factories to protect artisans","forcing peasants to live in walled cities","creating collective farms run by the state","banning the import of foreign grain","consolidating open fields and common lands into private, fenced farms"],"why":["Enclosure was agricultural.","Enclosure concerned land, not urban walls.","That describes Soviet collectivization in the 1930s.","That was the Corn Laws.","Enclosure raised productivity but displaced many small farmers."],"answer":4},"u6q8":{"id":"u6q8","unit":6,"diff":"e","pool":"exam1","stem":"<p>Which city became the symbol of the cotton industry and was nicknamed \"Cottonopolis\"?<\/p>","options":["Manchester","Vienna","Edinburgh","Paris","Rome"],"why":["Manchester's mills made it the center of the cotton industry.","Vienna was not a major industrial city in this era.","Edinburgh was a financial and intellectual center.","Paris was not a cotton-manufacturing center.","Rome was not industrial."],"answer":0},"u6q9":{"id":"u6q9","unit":6,"diff":"e","pool":"quiz","stem":"<p>Which economist argued that population grows faster than the food supply?<\/p>","options":["Karl Marx","Adam Smith","Friedrich List","Thomas Malthus","John Stuart Mill"],"why":["Marx blamed capitalism, not population, for poverty.","Smith wrote about free markets and the division of labor.","List argued for protective tariffs.","His Essay on the Principle of Population (1798) predicted persistent poverty.","Mill was a liberal philosopher of the mid-1800s."],"answer":3},"u6q10":{"id":"u6q10","unit":6,"diff":"e","pool":"exam2","stem":"<p>The Factory Act of 1833 is significant because it<\/p>","options":["limited child labor in textile mills and created government inspectors","abolished factories in British cities","gave factory workers the vote","legalized trade unions","repealed the Corn Laws"],"why":["It was the first effective factory regulation.","Factories kept growing.","Workers did not gain the vote until 1867 and after.","Unions were legalized by repeal of the Combination Acts in 1824.","That happened in 1846."],"answer":0},"u6q11":{"id":"u6q11","unit":6,"diff":"m","pool":"exam1","stem":"<p>Which of the following best explains why Britain industrialized first?<\/p>","options":["It had no overseas colonies to distract it","Its government owned and ran all factories","It combined coal and iron deposits, capital from trade, a large market and a stable, pro-business government","It had abolished private property","It had the largest population in Europe"],"why":["Britain had a large empire that supplied markets and raw materials.","British industry was privately owned.","No single factor explains it; the combination mattered.","Secure property rights encouraged investment.","France and Russia had larger populations."],"answer":2},"u6q12":{"id":"u6q12","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which sequence of inventions is in the correct chronological order?<\/p>","options":["Power loom, spinning jenny, flying shuttle","Power loom, flying shuttle, spinning jenny","Flying shuttle, spinning jenny, power loom","Flying shuttle, power loom, spinning jenny","Spinning jenny, flying shuttle, power loom"],"why":["This reverses the order.","The power loom came last, in 1785.","1733, c. 1765, 1785.","The jenny came before the power loom.","The flying shuttle (1733) came before the jenny."],"answer":2},"u6q13":{"id":"u6q13","unit":6,"diff":"m","pool":"exam2","stem":"<p>The agricultural revolution contributed to industrialization chiefly by<\/p>","options":["reducing the population of Britain","producing more food with fewer workers, freeing labor and supporting population growth","increasing the number of small family farms","ending the need for coal","restoring feudal obligations"],"why":["Population grew rapidly.","Surplus food and labor fed the growing factory towns.","Enclosure reduced small farms.","Coal demand grew.","Feudal obligations were long gone in England."],"answer":1},"u6q14":{"id":"u6q14","unit":6,"diff":"m","pool":"exam1","stem":"<p>The Great Reform Act of 1832 is best described as<\/p>","options":["a revolutionary law granting universal suffrage","the law that legalized trade unions","a measure to restore royal power over Parliament","a moderate reform that brought the middle class into politics while excluding workers","the law that created the workhouse system"],"why":["Only about one in five adult men in England could vote.","That was the repeal of the Combination Acts in 1824.","It strengthened the House of Commons.","It removed rotten boroughs and widened the franchise to middle-class property owners.","That was the Poor Law of 1834."],"answer":3},"u6q15":{"id":"u6q15","unit":6,"diff":"m","pool":"exam2","stem":"<p>The repeal of the Corn Laws in 1846 represented a victory for<\/p>","options":["industrialists and advocates of free trade over landowners","Irish nationalists over British rule","landed aristocrats over manufacturers","mercantilists over classical economists","Chartists over Parliament"],"why":["Cheaper grain helped manufacturers and workers; landowners lost protection.","Repeal was a British economic policy, though the Irish famine helped prompt it.","The Corn Laws had protected landowners.","Repeal was a free-trade, anti-mercantilist measure.","Chartist petitions were rejected."],"answer":0},"u6q16":{"id":"u6q16","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which of the following was a common feature of early factory work?<\/p>","options":["Worker ownership of the machines","Work done at home with family members","An eight-hour working day guaranteed by law","High wages for child workers to attract them","Strict time discipline with long hours and fines for lateness"],"why":["Owners controlled the machinery.","That was the putting-out system.","The eight-hour day came much later.","Children were hired because they were cheap.","Factories ran on the clock and bell."],"answer":4},"u6q17":{"id":"u6q17","unit":6,"diff":"m","pool":"exam1","stem":"<p>Friedrich Engels's The Condition of the Working Class in England (1845) described<\/p>","options":["the agricultural revolution in Norfolk","the luxurious lives of
