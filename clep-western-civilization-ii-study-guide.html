n-step\"><span class=\"chain-label\">Event<\/span>Enlightened despots adopt rational reforms from the philosophes<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Real gains in law, toleration and administration, but no sharing of power and serfdom mostly untouched<\/div><\/div>\n<p><strong>Frederick II (the Great) of Prussia<\/strong> (r. 1740–1786) corresponded with Voltaire and hosted him at his palace. He called himself \"the <strong>first servant of the state<\/strong>,\" abolished torture, granted wide religious toleration, reformed the courts and promoted agriculture. But he kept serfdom and relied on the Junkers to staff his army.<\/p>\n<p><strong>Catherine II (the Great) of Russia<\/strong> (r. 1762–1796) corresponded with Voltaire and Diderot and called a Legislative Commission in 1767 to reform Russian law. After the huge peasant revolt led by <strong>Emelian Pugachev<\/strong> (1773–1775), she sided firmly with the nobles: her <strong>Charter of the Nobility (1785)<\/strong> freed nobles from state service and confirmed their power over serfs. Serfdom expanded under her rule. She also expanded Russia south to the Black Sea at the expense of the Ottomans.<\/p>\n<p><strong>Joseph II of Austria<\/strong> (r. 1780–1790) was the most radical. His <strong>Edict of Toleration (1781)<\/strong> gave rights to Protestants and Orthodox Christians, and he eased restrictions on Jews. He <strong>abolished serfdom<\/strong> and tried to replace labor services with money rents, closed hundreds of monasteries and imposed German as the language of administration. Nobles, clergy and non-German peoples resisted so fiercely that his successor, Leopold II, cancelled most of his reforms. Joseph's failure shows how hard it was to impose reform from above.<\/p>\n<h3>Toleration, reform and the limits of the Enlightenment<\/h3>\n<p>Toleration was the cause that united almost every philosophe. Religious wars and persecution, they argued, came from <strong>fanaticism<\/strong> and <strong>superstition<\/strong>, and a rational state should leave belief to the individual. The German Jewish philosopher <strong>Moses Mendelssohn<\/strong> argued that Jews could be loyal citizens and full participants in European culture, and his friend Gotthold Lessing's play <em>Nathan the Wise<\/em> (1779) pleaded for respect among Jews, Christians and Muslims. Some states moved slowly toward legal equality: Joseph II eased restrictions on Jews in the 1780s, and revolutionary France granted Jews full citizenship in 1791.<\/p>\n<p>Enlightenment writers also began to attack <strong>slavery<\/strong>. Montesquieu ridiculed the arguments used to defend it, the <em>Encyclopedia<\/em> condemned it, and by the 1780s abolition societies had formed in Britain and France. Their success came later: Britain abolished the slave trade in 1807.<\/p>\n<p>Yet the Enlightenment had clear limits. Most philosophes were <strong>reformers, not democrats<\/strong>. Voltaire hoped for a wise king, not rule by the uneducated masses. Many assumed that women's nature suited them for the home, and some, including Hume, wrote that non-Europeans were inferior. Critics then and since have pointed out that \"reason\" was often defined by and for educated European men.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Philosophes teach that institutions should be judged by reason and utility<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Readers begin to question privilege, censorship and arbitrary power<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>In 1789 French revolutionaries put Enlightenment principles (rights, popular sovereignty, separation of powers) into practice<\/div><\/div>\n<p>The Enlightenment's most lasting legacy is the idea of <strong>progress<\/strong>: that human beings can use reason to understand their world and make it better. Its political ideas (natural rights, separation of powers, popular sovereignty, toleration, free markets) became the program of the <strong>American and French Revolutions<\/strong> (Unit 5) and of nineteenth-century <strong>liberalism<\/strong> (Unit 7).<\/p>\n<h3>The partitions of Poland<\/h3>\n<p><strong>Poland-Lithuania<\/strong> was a large but weak state. Its nobles elected the king, and any single noble could block legislation in the parliament (the <strong>liberum veto<\/strong>). Its neighbors exploited the weakness.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Poland's elected kings and the liberum veto leave it with no strong government or army<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Russia, Prussia and Austria agree to take Polish territory in 1772, 1793 and 1795<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Poland disappears from the map until 1918<\/div><\/div>\n<p>In the <strong>First Partition (1772)<\/strong>, Russia, Prussia and Austria took about a third of its territory. Poland tried to reform and adopted a modern <strong>constitution in May 1791<\/strong>. Russia and Prussia answered with the <strong>Second Partition (1793)<\/strong>. A national uprising led by <strong>Tadeusz Kościuszko<\/strong> failed, and the <strong>Third Partition (1795)<\/strong> erased Poland entirely. The partitions show that \"enlightened\" rulers still practiced old-fashioned power politics.<\/p>","words":1458,"minutes":10,"mustKnow":["<strong>Philosophes<\/strong> applied reason to society; ideas spread through <strong>salons<\/strong>, coffeehouses, print and the <strong>Encyclopedia<\/strong> (Diderot).","<strong>Voltaire:<\/strong> toleration, satire (<em>Candide<\/em>), anti-clerical \"Crush the infamous thing,\" deism.","<strong>Montesquieu:<\/strong> <em>The Spirit of the Laws<\/em> (1748): separation of powers, checks and balances.","<strong>Rousseau:<\/strong> <em>The Social Contract<\/em> (1762): general will, popular sovereignty; \"Man is born free, and everywhere he is in chains.\"","<strong>Adam Smith:<\/strong> <em>The Wealth of Nations<\/em> (1776): laissez-faire, invisible hand, division of labor.","<strong>Beccaria:<\/strong> <em>On Crimes and Punishments<\/em> (1764): against torture and the death penalty.","<strong>Wollstonecraft:<\/strong> <em>A Vindication of the Rights of Woman<\/em> (1792): education and reason for women.","<strong>Deism:<\/strong> God the clockmaker; no miracles or revealed religion needed.","<strong>Enlightened despots:<\/strong> Frederick II (\"first servant of the state\"), Catherine II (Pugachev revolt → Charter of the Nobility), Joseph II (Edict of Toleration, abolished serfdom; reforms reversed).","<strong>Partitions of Poland:<\/strong> 1772, 1793, 1795 by Russia, Prussia, Austria; Poland vanishes until 1918."],"timeline":[{"y":"1733","label":"Voltaire's Letters on the English","note":"Praises English tolerance and liberty","key":false},{"y":"1748","label":"Montesquieu's The Spirit of the Laws","note":"Separation of powers","key":true},{"y":"1751","label":"Encyclopedia begins","note":"Diderot and d'Alembert's great project","key":true},{"y":"1759","label":"Voltaire's Candide","note":"Satire of optimism","key":false},{"y":"1762","label":"Rousseau's The Social Contract","note":"General will; Catherine II takes power","key":true},{"y":"1764","label":"Beccaria's On Crimes and Punishments","note":"Against torture and execution","key":false},{"y":"1772","label":"First Partition of Poland","note":"Russia, Prussia and Austria take territory","key":true},{"y":"1773–1775","label":"Pugachev's Rebellion","note":"Massive Russian peasant revolt","key":false},{"y":"1776","label":"Adam Smith's The Wealth of Nations","note":"Laissez-faire economics","key":true},{"y":"1781","label":"Joseph II's Edict of Toleration","note":"Rights for non-Catholic Christians in Austria","key":false},{"y":"1784","label":"Kant's \"What Is Enlightenment?\"","note":"\"Dare to know!\"","key":false},{"y":"1785","label":"Catherine's Charter of the Nobility","note":"Nobles' privileges confirmed","key":false},{"y":"1792","label":"Wollstonecraft's Vindication of the Rights of Woman","note":"Early feminist argument","key":false},{"y":"1795","label":"Third Partition of Poland","note":"Poland disappears","key":true}],"cards":[{"id":"u4c1","front":"Philosophes","back":"French public intellectuals of the Enlightenment who applied reason to society.","person":false},{"id":"u4c2","front":"Salons","back":"Gatherings in private homes, often hosted by women, where Enlightenment ideas were debated.","person":false},{"id":"u4c3","front":"Denis Diderot","back":"Edited the Encyclopedia (1751–72), a summary of knowledge that criticized Church and state.","person":true},{"id":"u4c4","front":"Voltaire","back":"Toleration, satire (Candide), \"Crush the infamous thing\"; deist; defended Jean Calas.","person":true},{"id":"u4c5","front":"Montesquieu","back":"The Spirit of the Laws (1748): separation of powers and checks and balances.","person":true},{"id":"u4c6","front":"Jean-Jacques Rousseau","back":"The Social Contract (1762): the general will and popular sovereignty; Emile on education.","person":true},{"id":"u4c7","front":"General will","back":"Rousseau's idea of the community's collective will for the common good, the basis of legitimate law.","person":false},{"id":"u4c8","front":"Adam Smith","back":"The Wealth of Nations (1776): free markets, the invisible hand, division of labor.","person":true},{"id":"u4c9","front":"Laissez-faire","back":"Economic policy of minimal government interference in markets.","person":false},{"id":"u4c10","front":"Physiocrats","back":"French economists who said land is the source of wealth and urged free trade in grain.","person":false},{"id":"u4c11","front":"Cesare Beccaria","back":"On Crimes and Punishments (1764): opposed torture and the death penalty.","person":true},{"id":"u4c12","front":"Mary Wollstonecraft","back":"A Vindication of the Rights of Woman (1792): women deserve equal education and are capable of reason.","person":true},{"id":"u4c13","front":"Immanuel Kant","back":"\"Dare to know!\": Enlightenment means using your own reason without another's guidance.","person":true},{"id":"u4c14","front":"Deism","back":"Belief in a creator God who set natural laws in motion but does not intervene; rejects miracles.","person":false},{"id":"u4c15","front":"Enlightened despotism","back":"Absolute monarchs using Enlightenment reforms to strengthen the state without sharing power.","person":false},{"id":"u4c16","front":"Frederick II (the Great)","back":"Prussian king (1740–86); \"first servant of the state\"; abolished torture; religious toleration.","person":true},{"id":"u4c17","front":"Catherine II (the Great)","back":"Russian empress (1762–96); corresponded with philosophes but strengthened serfdom after Pugachev's revolt.","person":true},{"id":"u4c18","front":"Joseph II","back":"Austrian emperor (1780–90); Edict of Toleration, abolished serfdom; most reforms reversed.","person":true},{"id":"u4c19","front":"Liberum veto","back":"Rule letting any single Polish noble block legislation; it crippled Poland's government.","person":false},{"id":"u4c20","front":"Partitions of Poland","back":"1772, 1793, 1795: Russia, Prussia and Austria divided Poland until it vanished.","person":false}],"hours":1.71,"quizIds":["u4q3","u4q5","u4q7","u4q11","u4q19","u4q22","u4q27","u4q31","u4q32","u4q33","u4q34","u4q35"]}],"questions":{"u1q1":{"id":"u1q1","unit":1,"diff":"e","pool":"exam1","stem":"<p>Which document, accepted by William and Mary in 1689, guaranteed that Parliament must consent to taxation and to a peacetime standing army?<\/p>","options":["The Petition of Right","The Edict of Nantes","The Test Act","The Act of Union","The English Bill of Rights"],"why":["The Petition of Right dates from 1628, under Charles I, and he ignored it.","The Edict of Nantes (1598) gave French Protestants toleration; it has nothing to do with Parliament.","The Test Act (1673) barred non-Anglicans from office; it did not define Parliament's powers over taxes.","The Act of Union (1707) joined England and Scotland; it did not set out Parliament's taxing power.","The 1689 Bill of Rights made these parliamentary powers law as the condition of William and Mary's accession."],"answer":4},"u1q2":{"id":"u1q2","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Peace of Westphalia (1648) did which of the following?<\/p>","options":["Outlawed Calvinism within the Holy Roman Empire","Ended the War of the Spanish Succession","Restored the Stuart monarchy in England","Recognized the independence of the Dutch Republic","Unified the German states under the Habsburg emperor"],"why":["Westphalia added Calvinism to the faiths a ruler could legally adopt.","That war ended with the Treaty of Utrecht in 1713.","The Stuart Restoration happened in 1660 and was an English domestic event.","Westphalia formally recognized the United Provinces' independence from Spain, along with Swiss independence.","It did the opposite: German princes became effectively sovereign and the emperor was weakened."],"answer":3},"u1q3":{"id":"u1q3","unit":1,"diff":"e","pool":"quiz","stem":"<p>Louis XIV's main purpose in requiring great nobles to live at Versailles was to<\/p>","options":["convert them from Protestantism to Catholicism","train them as officers for the French navy","collect the taxes that the nobles owed the crown","prepare them to serve in the Estates-General","keep them under royal watch and away from independent power bases"],"why":["The great nobles were overwhelmingly Catholic already; Versailles was about political control.","Versailles was a court, not a naval academy.","French nobles were largely exempt from direct taxes; Versailles was not a tax office.","Louis never called the Estates-General.","Busy competing for court honors, nobles could not raise private armies or lead revolts like the Fronde."],"answer":4},"u1q4":{"id":"u1q4","unit":1,"diff":"e","pool":"exam2","stem":"<p>Which ruler is most closely associated with founding St. Petersburg and forcing Russian nobles to adopt Western dress?<\/p>","options":["Michael Romanov","Alexander I","Peter the Great","Ivan the Terrible","Catherine the Great"],"why":["Michael founded the Romanov dynasty in 1613; he did not westernize Russia.","Alexander I ruled 1801–1825 and is known for fighting Napoleon.","Peter founded St. Petersburg in 1703 and imposed beard taxes and Western clothing on the elite.","Ivan IV ruled in the 1500s, long before St. Petersburg existed.","Catherine (r. 1762–1796) came later and is linked to enlightened despotism and the partitions of Poland."],"answer":2},"u1q5":{"id":"u1q5","unit":1,"diff":"e","pool":"exam2","stem":"<p>The Glorious Revolution of 1688 replaced James II with<\/p>","options":["Queen Anne","George I of Hanover","Charles II","William of Orange and Mary","Oliver Cromwell"],"why":["Anne followed William in 1702; she did not replace James II.","George I came to the throne in 1714 under the Act of Settlement.","Charles II was restored in 1660 and died in 1685; James II was his successor.","Parliament's leaders invited the Protestant William and Mary, James's daughter, to take the throne.","Cromwell died in 1658, thirty years earlier."],"answer":3},"u1q6":{"id":"u1q6","unit":1,"diff":"e","pool":"exam1","stem":"<p>In the Dutch Republic of the 1600s, political power rested chiefly with<\/p>","options":["a parliament elected by all adult men","the Spanish viceroy in Brussels","the Catholic bishops of the Netherlands","an absolute monarch ruling by divine right","wealthy merchant oligarchs (regents) in the provinces and towns"],"why":["There was no democratic suffrage; power was oligarchic.","The Dutch had broken away from Spain; Spanish officials governed only the southern (Spanish) Netherlands.","The Republic was officially Calvinist; Catholic bishops held no political power.","The Dutch Republic had no king; it was a federal republic.","The regents dominated provincial estates and town councils; the federation's center was weak."],"answer":4},"u1q7":{"id":"u1q7","unit":1,"diff":"e","pool":"diag","stem":"<p>Which war ended with the Treaty of Utrecht in 1713?<\/p>","options":["The Thirty Years' War","The English Civil War","The Seven Years' War","The War of the Spanish Succession","The Great Northern War"],"why":["The Thirty Years' War ended at Westphalia in 1648.","The English Civil War was a domestic conflict that ended in 1649.","The Seven Years' War ended in 1763 with the Treaty of Paris.","Utrecht (1713, with Rastatt in 1714) settled who would rule Spain.","That war ended with the Treaty of Nystad in 1721."],"answer":3},"u1q8":{"id":"u1q8","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Prussian Junkers were<\/p>","options":["elected members of the Prussian parliament","landowning nobles who served as army officers in return for control over their serfs","foreign mercenaries hired by the Great Elector","Prussian merchants who financed the royal army","Protestant refugees from France"],"why":["Prussia had no powerful elected parliament in this period.","This bargain with the Hohenzollerns was the social basis of the Prussian state.","Junkers were native Prussian nobles, not foreign hires.","Prussia's merchant class was small; Junkers were rural nobles.","Huguenot refugees settled in Prussia, but they were not called Junkers."],"answer":1},"u1q9":{"id":"u1q9","unit":1,"diff":"e","pool":"exam2","stem":"<p>Mercantilism, as practiced by Colbert, held that a nation should<\/p>","options":["remove all tariffs and allow free trade","let private markets set all prices without state interference","abolish colonies because they drain the home economy","export more than it imports in order to accumulate gold and silver","collectivize land and industry under worker control"],"why":["Free trade is Adam Smith's later answer to mercantilism.","That is laissez-faire, the opposite of Colbert's state-directed economy.","Mercantilists valued colonies as sources of raw materials and markets.","Mercantilists measured wealth in bullion and sought a favorable balance of trade.","That describes socialism, a nineteenth-century idea."],"answer":3},"u1q10":{"id":"u1q10","unit":1,"diff":"e","pool":"quiz","stem":"<p>What happened to King Charles I of England in 1649?<\/p>","options":["He was deposed in a bloodless revolution","He dissolved Parliament and began eleven years of personal rule","He was tried and executed by order of Parliament's leaders","He signed the Bill of Rights and became a constitutional monarch","He fled to France and returned as king in 1660"],"why":["That describes James II in 1688.","His personal rule ran from 1629 to 1640, not 1649.","His beheading in January 1649 led to the Commonwealth.","The Bill of Rights was accepted by William and Mary in 1689.","Charles II, his son, returned in 1660; Charles I was dead by then."],"answer":2},"u1q11":{"id":"u1q11","unit":1,"diff":"m","pool":"exam1","stem":"<p>Louis XIV's revocation of the Edict of Nantes in 1685 had which of the following consequences?<\/p>","options":["France became officially Protestant","The Fronde broke out against royal authority","The pope excommunicated Louis XIV","France's economy immediately surpassed the Dutch Republic's","Many skilled Huguenot artisans and merchants emigrated to France's rivals"],"why":["The revocation made Protestant worship illegal; France stayed Catholic.","The Fronde (1648–53) happened decades earlier.","The revocation pleased many Catholics; there was no excommunication.","Losing skilled workers hurt France's economy.","Around 200,000 Huguenots fled to the Dutch Republic, England, Prussia and America, taking skills and capital with them."],"answer":4},"u1q12":{"id":"u1q12","unit":1,"diff":"m","pool":"quiz","stem":"<p>Which pairing of a state and its form of government around 1700 is correct?<\/p>","options":["Russia: elected monarchy chosen by the nobility","England: constitutional monarchy with Parliament controlling taxation","Dutch Republic: absolute monarchy under the House of Orange","France: limited monarchy under a strong Estates-General","Prussia: merchant republic run by town councils"],"why":["Russia was an autocracy under hereditary tsars.","After 1689 the English crown could not tax without Parliament.","The Orange stadtholders were powerful but the Republic had no king.","The Estates-General did not meet between 1614 and 1789; France was absolutist.","Prussia was a militarized absolute monarchy."],"answer":1},"u1q13":{"id":"u1q13","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which event came FIRST?<\/p>","options":["The revocation of the Edict of Nantes","The beheading of Charles I","The founding of St. Petersburg","The Glorious Revolution","The Treaty of Utrecht"],"why":["1685.","1649, the earliest of these.","1703.","1688.","1713."],"answer":1},"u1q14":{"id":"u1q14","unit":1,"diff":"m","pool":"quiz","stem":"<blockquote>\"The royal throne is not the throne of a man, but the throne of God himself... The person of the king is sacred, and to attack him in any way is sacrilege.\"<\/blockquote><p>The passage above best expresses the ideas of<\/p>","options":["John Locke, defending the Glorious Revolution","the Levellers, demanding wider suffrage","Oliver Cromwell, justifying the Protectorate","Bishop Bossuet, defending divine-right absolutism","Spinoza, arguing for religious toleration"],"why":["Locke argued that power comes from the consent of the governed, not from God.","The Levellers were radicals who wanted to limit authority, not sanctify kings.","Cromwell had helped execute a king; he did not call kings sacred.","Bossuet, tutor to Louis XIV's son, argued that kings are God's ministers on earth.","Spinoza was a rationalist critic of religious authority."],"answer":3},"u1q15":{"id":"u1q15","unit":1,"diff":"m","pool":"exam1","stem":"<p>Peter the Great's Table of Ranks (1722) was designed to<\/p>","options":["establish an elected Russian parliament","list the provinces that owed tribute to Sweden","free the serfs and give them land","rank Orthodox clergy above the nobility","tie noble status and promotion to service to the state"],"why":["Russia had no parliament until the Duma of 1906.","Russia fought Sweden; it did not pay it tribute.","Serfdom grew harsher under Peter; emancipation came in 1861.","Peter subordinated the Church to the state through the Holy Synod.","Rank came from service in the army, navy or bureaucracy, so the nobility worked for the tsar."],"answer":4},"u1q16":{"id":"u1q16","unit":1,"diff":"m","pool":"quiz","stem":"<p>The Treaty of Utrecht (1713) is significant because it<\/p>","options":["placed a Habsburg prince on the Spanish throne","kept the French and Spanish crowns separate and upheld a balance of power","ended Dutch independence","forced Britain to return Gibraltar to Spain","created the German Confederation"],"why":["The Bourbon Philip V, Louis XIV's grandson, kept Spain.","Philip V kept Spain but could never unite it with France, preventing one dominant power.","Dutch independence was not at issue; the Republic was on the winning side.","Britain gained Gibraltar at Utrecht.","The German Confederation was created by the Congress of Vienna in 1815."],"answer":1},"u1q17":{"id":"u1q17","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which group was most likely to support Parliament against Charles I in the English Civil War?<\/p>","options":["Jesuit missionaries","The great landed nobility of the north and west","High-church Anglican bishops","Irish Catholics","Puritans and London merchants"],"why":["Jesuits were banned in England and opposed Puritan Parliament.","Many northern and western nobles were Royalists.","Bishops generally backed the king's religious policies.","Irish Catholics were hostile to the Puritan Parliament.","Parliament's strongholds were the Puritans, the commercial classes and London."],"answer":4},"u1q18":{"id":"u1q18","unit":1,"diff":"m","pool":"exam2","stem":"<p>The 1683 Ottoman siege of Vienna is important because its failure<\/p>","options":["caused the Thirty Years' War","began a Habsburg advance that won most of Hungary by 1699","made the Ottoman Empire a member of the Holy Roman Empire","led directly to the unification of Germany","ended Habsburg rule in Austria"],"why":["That war began in 1618 and ended in 1648.","After the siege was broken, Austria pushed back the Ottomans and gained Hungary at Karlowitz.","The Ottomans were never part of the Holy Roman Empire.","German unification came in 1871.","The Habsburgs emerged stronger."],"answer":1},"u1q19":{"id":"u1q19","unit":1,"diff":"m","pool":"quiz","stem":"<p>A historian argues that seventeenth-century rulers became absolute mainly because war had grown too expensive for traditional revenue. Which evidence would best support this?<\/p>","options":["The English Bill of Rights guaranteed free speech in Parliament","Peter the Great required nobles to shave their beards","Prussia's Great Elector created a tax bureaucracy specifically to fund a standing army","Rembrandt painted group portraits of Amsterdam militia companies","The Peace of Westphalia tolerated Calvinism"],"why":["This shows limits on a king, not the fiscal roots of absolutism.","Beard rules concern cultural westernization, not war finance.","The General War Commissariat shows military needs driving state-building.","This is cultural evidence, not evidence about state finance.","Religious settlement does not show that war costs drove absolutism."],"answer":2},"u1q20":{"id":"u1q20","unit":1,"diff":"m","pool":"exam1","stem":"<p>The Dutch Republic in the seventeenth century was notable for<\/p>","options":["a powerful landed nobility that dominated trade","its rejection of overseas trade and colonies","strict censorship that drove printers abroad","being governed directly from Madrid","religious toleration that attracted Jews, Huguenots and other refugees"],"why":["Trade was dominated by urban merchants, not landed nobles.","The VOC made it a leading colonial and trading power.","The Republic was Europe's freest publishing center.","Independence from Spain was recognized in 1648.","Its relative tolerance drew skilled refugees and dissenting thinkers such as Spinoza."],"answer":4},"u1q21":{"id":"u1q21","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which statement best describes Oliver Cromwell's rule as Lord Protector (1653–1658)?<\/p>","options":["It ended when Parliament invited William of Orange to rule","It restored the Catholic Church in England","It was a republic in name but a military dictatorship in practice","It made England an absolute monarchy under divine right","It established the first fully democratic government in Europe"],"why":["That happened to James II in 1688.","Cromwell was a Puritan and hostile to Catholicism.","Cromwell relied on the army and dismissed parliaments that opposed him.","Cromwell was not a king, and divine right was the Stuart theory.","Cromwell rejected the Levellers' demand for wide suffrage."],"answer":2},"u1q22":{"id":"u1q22","unit":1,"diff":"m","pool":"exam2","stem":"<p>Frederick William, the Great Elector of Brandenburg-Prussia, is best known for<\/p>","options":["defeating Napoleon at Leipzig","unifying Germany through \"blood and iron\"","granting a liberal constitution to his subjects","building a large standing army and a central bureaucracy to pay for it","becoming the first Holy Roman Emperor from Prussia"],"why":["The Battle of Leipzig took place in 1813, long after his death in 1688.","That was Bismarck in the 1860s.","He ruled as an absolutist.","He laid the foundations of Prussian militarism and administration.","No Prussian ruler was Holy Roman Emperor."],"answer":3},"u1q23":{"id":"u1q23","unit":1,"diff":"m","pool":"quiz","stem":"<p>The Battle of Poltava (1709) was decisive because it<\/p>","options":["broke Swedish power and opened Russia's path to the Baltic","ended the Ottoman threat to Vienna","made Prussia a kingdom","forced Louis XIV to accept the Treaty of Utrecht","restored the Stuarts to the English throne"],"why":["Peter's victory over Charles XII led to Russian gains confirmed at Nystad (1721).","That was the relief of Vienna in 1683.","Prussia became a kingdom in 1701 by agreement with the emperor.","Utrecht followed battles in western Europe, not Poltava.","The Restoration was in 1660."],"answer":0},"u1q24":{"id":"u1q24","unit":1,"diff":"m","pool":"diag","stem":"<p>\"No taxation without the consent of Parliament\" was a central issue in which conflict?<\/p>","options":["The Dutch revolt against Spain","The struggle between the Stuart kings and Parliament that led to the English Civil War","The War of the Spanish Succession","The Great Northern War","The Fronde in France"],"why":["Taxation was an issue, but \"Parliament\" refers to England.","Charles I's attempts to tax without Parliament helped trigger the war in 1642.","That war was about who would inherit the Spanish throne.","That war was between Russia and Sweden over the Baltic.","The Fronde concerned French nobles and courts; there was no Parliament in the English sense."],"answer":1},"u1q25":{"id":"u1q25","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which of the following best explains why England developed a constitutional monarchy while France developed absolutism?<\/p>","options":["England was Catholic while France was Protestant","France had already experienced a successful revolution","English kings depended on Parliament for taxes, while French kings could tax without a national assembly","France had no nobility to resist the king","English kings rejected the theory of divine right"],"why":["The reverse is closer to the truth: England was Protestant and France Catholic.","France's revolution came in 1789.","Control of revenue determined who held power; the French crown never had to call the Estates-General.","France had a powerful nobility; Louis XIV had to tame it.","James I and Charles I strongly believed in divine right."],"answer":2},"u1q26":{"id":"u1q26","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which development is MOST similar to Louis XIV's use of intendants?<\/p>","options":["England's Bill of Rights limiting the crown","The Dutch reliance on town councils run by regents","Peter the Great's creation of a service bureaucracy loyal to the tsar","The Peace of Westphalia's grant of sovereignty to German princes","The Levellers' call for wider suffrage"],"why":["That limited royal power rather than extending it.","That decentralized merchant government is the opposite of royal centralization.","Both rulers bypassed traditional nobles by relying on officials who owed everything to the crown.","That decentralized authority within the Empire.","That was a popular democratic demand, not a royal administrative tool."],"answer":2},"u1q27":{"id":"u1q27","unit":1,"diff":"h","pool":"exam2","stem":"<p>A French Huguenot silk weaver who left France in 1686 and settled in Berlin would most likely have been<\/p>","options":["expelled immediately as a Catholic","welcomed by the Great Elector, who offered refuge to Huguenots to build Prussia's economy","drafted into the Ottoman army","forced to return to France under the Treaty of Utrecht","required to convert to Russian Orthodoxy"],"why":["Huguenots were Protestants, and Prussia's rulers were Protestant.","His Edict of Potsdam (1685) invited Huguenots, who boosted Berlin's crafts.","Berlin was not Ottoman territory.","Utrecht contained no such provision.","Berlin was in Brandenburg-Prussia, not Russia."],"answer":1},"u1q28":{"id":"u1q28","unit":1,"diff":"h","pool":"exam1","stem":"<p>Which of the following was a provision of the Treaty of Utrecht?<\/p>","options":["Russia received a Baltic coastline","France gained Nova Scotia from Britain","Austria received Gibraltar and Minorca","Britain received the asiento, the right to supply enslaved Africans to Spanish America","Philip V was required to give Spain to the Habsburgs"],"why":["Russia's Baltic gains came at Nystad in 1721.","France ceded Acadia (Nova Scotia) to Britain.","Britain, not Austria, received Gibraltar and Minorca.","The asiento was one of Britain's chief commercial gains at Utrecht.","Philip V kept Spain."],"answer":3},"u1q29":{"id":"u1q29","unit":1,"diff":"h","pool":"quiz","stem":"<p>Locke's Two Treatises of Government (1690) is closely linked to the Glorious Revolution because it<\/p>","options":["defended the divine right of the Stuart dynasty","urged England to adopt Catholicism","argued for an all-powerful sovereign to prevent civil war","called for the abolition of private property","argued that a ruler who violates the people's rights may be replaced"],"why":["That was the position Locke attacked (Filmer's Patriarcha).","Locke supported toleration for Protestants and opposed a Catholic monarch.","That is Hobbes's argument in Leviathan (1651).","Locke made property a natural right.","Locke's case for government by consent justified removing James II."],"answer":4},"u1q30":{"id":"u1q30","unit":1,"diff":"h","pool":"exam2","stem":"<p>Which statement about the Habsburg monarchy after 1648 is most accurate?<\/p>","options":["It was a multiethnic collection of territories held together by the dynasty, Catholicism and the army","It controlled the German states more tightly after Westphalia","It was a centralized nation-state with a single language","It adopted a constitutional monarchy like England's","It lost Hungary to the Ottomans in 1699"],"why":["Austria, Bohemia and Hungary kept separate laws and estates under one ruler.","Westphalia weakened imperial control over the German princes.","The Habsburg lands were linguistically diverse and decentralized.","The Habsburgs ruled as absolutists where they could.","At Karlowitz (1699) the Ottomans ceded Hungary to Austria."],"answer":0},"u1q31":{"id":"u1q31","unit":1,"diff":"m","pool":"exam2","stem":"<p>The phrase \"one king, one law, one faith\" best summarizes the goals of<\/p>","options":["the Levellers","William of Orange","Louis XIV","John Locke","the Dutch regents"],"why":["The Levellers wanted wider rights, not royal uniformity.","William ruled England under the Bill of Rights and supported toleration for Protestant dissenters.","His centralization and the 1685 revocation of the Edict of Nantes aimed at uniformity under the crown.","Locke argued for limited government and toleration.","The regents governed a decentralized, tolerant republic."],"answer":2},"u1q32":{"id":"u1q32","unit":1,"diff":"e","pool":"exam1","stem":"<p>Who won the English Civil War?<\/p>","options":["The Parliamentarians, led militarily by Oliver Cromwell","The Scots under James II","The Irish Catholic Confederation","William of Orange's Dutch army","The Royalists under Charles I"],"why":["Cromwell's New Model Army defeated the Royalists by 1646 and again in 1648.","James II reigned in 1685–88; he did not lead the Scots in the 1640s.","The Irish were defeated by Cromwell in 1649–50.","William's landing came in 1688, decades later.","Charles I lost and was executed in 1649."],"answer":0},"u1q33":{"id":"u1q33","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which feature distinguished the English Restoration settlement of 1660 from the monarchy before 1640?<\/p>","options":["Parliament kept its control over taxation and could not be ignored by the king","Catholicism became the state religion","The monarch was now elected by Parliament","Cromwell's Protectorate continued alongside the king","Divine right was written into law"],"why":["The monarchy returned, but the crown could no longer rule and tax without Parliament.","The Church of England was restored, and the Test Act excluded Catholics from office.","The crown remained hereditary; Charles II was the son of Charles I.","The Protectorate ended in 1659.","The settlement limited royal power in practice."],"answer":0},"u1q34":{"id":"u1q34","unit":1,"diff":"h","pool":"exam1","stem":"<p>Which comparison of Peter the Great and Louis XIV is most accurate?<\/p>","options":["Both lost their thrones in revolutions","Both strengthened royal power by bringing nobles and the church under tighter state control","Both ruled through powerful elected parliaments","Both revoked edicts of religious toleration for Protestants","Both modeled their reforms on the Dutch republican constitution"],"why":["Both died as reigning monarchs.","Louis used Versailles and Gallican control; Peter used service ranks and the Holy Synod.","Neither shared power with a parliament.","Only Louis did this, in 1685.","Peter admired Dutch shipbuilding, not republicanism; Louis invaded the Dutch."],"answer":1},"u2q1":{"id":"u2q1","unit":2,"diff":"e","pool":"quiz","stem":"<p>In the eighteenth century, the most profitable European colonies in the Americas were the<\/p>","options":["tea plantations of Virginia","gold mines of Louisiana","farming colonies of New England","fur-trading posts of Canada","sugar islands of the Caribbean"],"why":["Virginia grew tobacco; tea came from China.","Louisiana had no gold mines; John Law's promises of wealth there were a fantasy.","New England did not produce a major export crop for Europe.","The fur trade was valuable but far smaller than sugar.","Islands such as Saint-Domingue and Jamaica produced sugar that was worth more than any other colonial export."],"answer":4},"u2q2":{"id":"u2q2","unit":2,"diff":"e","pool":"exam1","stem":"<p>Robert Walpole is significant in British history as<\/p>","options":["the king who replaced James II","the first prime minister in practice, governing through a cabinet responsible to Parliament","the leader of the Puritan army in the Civil War","the founder of the Bank of England","the general who captured Quebec"],"why":["That was William III.","Walpole led the government from 1721 to 1742 and set the pattern of cabinet rule.","That was Oliver Cromwell.","The Bank of England was founded in 1694.","James Wolfe led the attack on Quebec in 1759."],"answer":1},"u2q3":{"id":"u2q3","unit":2,"diff":"e","pool":"exam2","stem":"<p>The Diplomatic Revolution of 1756 refers to<\/p>","options":["Austria allying with its old enemy France, while Britain allied with Prussia","the overthrow of James II in favor of William and Mary","the union of England and Scotland","Russia's alliance with Napoleon at Tilsit","France's alliance with the American colonies"],"why":["The switch of partners set the sides for the Seven Years' War.","That was the Glorious Revolution of 1688.","That was the Act of Union in 1707.","Tilsit was in 1807.","That came in 1778 during the American Revolution."],"answer":0},"u2q4":{"id":"u2q4","unit":2,"diff":"e","pool":"quiz","stem":"<p>Which treaty gave Britain control of Canada?<\/p>","options":["The Treaty of Utrecht (1713)","The Treaty of Aix-la-Chapelle (1748)","The Peace of Westphalia (1648)","The Treaty of Nystad (1721)","The Treaty of Paris (1763)"],"why":["Utrecht gave Britain Nova Scotia, Newfoundland and Hudson Bay, not all of Canada.","That treaty largely restored colonial conquests.","Westphalia concerned the Thirty Years' War in Europe.","Nystad ended the Great Northern War between Russia and Sweden.","It ended the Seven Years' War and transferred New France to Britain."],"answer":4},"u2q5":{"id":"u2q5","unit":2,"diff":"e","pool":"exam1","stem":"<p>The putting-out system involved<\/p>","options":["guild workshops in large cities","slave labor on Caribbean plantations","merchants supplying raw materials to rural households that produced goods at home","steam-powered textile mills","government factories run by state officials"],"why":["Merchants used rural labor to avoid urban guild rules.","That was the plantation system.","Families spun and wove in their cottages; merchants collected and sold the finished cloth.","Mills came with the Industrial Revolution and replaced cottage industry.","The system was private and decentralized."],"answer":2},"u2q6":{"id":"u2q6","unit":2,"diff":"e","pool":"exam2","stem":"<p>Frederick II's invasion of Silesia in 1740 began the<\/p>","options":["War of the Austrian Succession","War of the Spanish Succession","Crimean War","Thirty Years' War","Great Northern War"],"why":["Frederick exploited Maria Theresa's accession to seize Silesia.","That war ran from 1701 to 1714.","The Crimean War was fought in the 1850s.","That war ran from 1618 to 1648.","That war (1700–1721) was fought between Russia and Sweden."],"answer":0},"u2q7":{"id":"u2q7","unit":2,"diff":"m","pool":"quiz","stem":"<p>The main cause of European population growth in the eighteenth century was<\/p>","options":["the spread of modern vaccination and antibiotics","mass immigration from Asia and Africa","a declining death rate as plague vanished and famines became less frequent","government programs encouraging large families","the end of serfdom across Europe"],"why":["Antibiotics came in the 1900s; the smallpox vaccine only in 1796.","There was no large immigration into Europe.","Fewer deaths from plague and famine, not more births, drove the increase.","No such programs drove the trend.","Serfdom survived in central and eastern Europe well into the 1800s."],"answer":2},"u2q8":{"id":"u2q8","unit":2,"diff":"m","pool":"exam1","stem":"<p>Which statement about the Atlantic slave trade in the eighteenth century is accurate?<\/p>","options":["It was controlled entirely by the Dutch","It declined sharply as sugar became less profitable","It mainly supplied workers to European factories","It was abolished by Britain at the Treaty of Utrecht","More enslaved Africans were transported in the 1700s than in any other century"],"why":["Britain, Portugal and France were the leading carriers in this period.","Sugar profits were high, and the trade expanded.","Enslaved people were sent to American plantations.","Utrecht gave Britain the asiento; Britain abolished the trade in 1807.","The trade peaked in the eighteenth century, driven by plantation demand."],"answer":4},"u2q9":{"id":"u2q9","unit":2,"diff":"m","pool":"exam1","stem":"<p>Charles VI's Pragmatic Sanction was intended to<\/p>","options":["abolish serfdom in the Habsburg lands","grant religious toleration to Protestants in Austria","divide Poland among its neighbors","ensure that his daughter Maria Theresa inherited the Habsburg lands intact","unite the crowns of France and Spain"],"why":["Serfdom reform came later under Joseph II.","That was Joseph II's Edict of Toleration in 1781.","The partitions of Poland began in 1772.","Charles had no son and sought international guarantees for her succession.","Utrecht forbade that union, and it was not Charles's aim."],"answer":3},"u2q10":{"id":"u2q10","unit":2,"diff":"m","pool":"exam2","stem":"<p>The South Sea Bubble (1720) and the Mississippi Bubble (1720) were both<\/p>","options":["speculative financial collapses tied to companies promising colonial trade profits","naval battles between Britain and France","treaties that ended the War of the Spanish Succession","slave revolts in the Caribbean","plagues that killed thousands in port cities"],"why":["Both crashes ruined investors in companies selling dreams of overseas wealth.","Neither was a battle.","That war ended with Utrecht and Rastatt.","They were stock-market crashes, not revolts.","The Marseille plague of 1720 is unrelated to these crashes."],"answer":0},"u2q11":{"id":"u2q11","unit":2,"diff":"m","pool":"quiz","stem":"<p>Which of the following was a result of the Seven Years' War?<\/p>","options":["Spain lost all its American colonies","Prussia was forced to return Silesia to Austria","Britain emerged as the dominant colonial power in North America and India","Austria gained control of the Holy Roman Empire's German states","France gained Canada from Britain"],"why":["Spain kept its American empire and received Louisiana from France.","Prussia kept Silesia.","The Treaty of Paris (1763) removed France from Canada and left Britain dominant in India.","There was no such outcome.","France lost Canada."],"answer":2},"u2q12":{"id":"u2q12","unit":2,"diff":"m","pool":"exam2","stem":"<p>Robert Clive's victory at the Battle of Plassey (1757) is significant because it<\/p>","options":["ended the Mughal Empire's conquest of Europe","ended the Atlantic slave trade","began British East India Company control of Bengal","opened Japan to Western trade","gave France control of the spice trade"],"why":["The Mughals never invaded Europe.","Plassey was in India and unrelated to the slave trade.","Plassey made the Company the real power in Bengal, a base for wider British rule in India.","Japan was opened by the United States in the 1850s.","France lost ground in India."],"answer":2},"u2q13":{"id":"u2q13","unit":2,"diff":"m","pool":"diag","stem":"<p>The growth of eighteenth-century consumption of sugar, tea and coffee in Europe most directly encouraged<\/p>","options":["a fall in the price of land in Britain","the abandonment of mercantilist policies","the decline of European port cities","the expansion of slave-worked plantations in the Americas","the collapse of the Dutch East India Company within a decade"],"why":["There is no direct link between colonial goods and British land prices.","Mercantilism remained dominant through the century.","Ports like Liverpool and Nantes grew rich.","Rising demand for sugar and coffee meant more plantations and more enslaved labor.","The VOC declined slowly and was dissolved only in 1799."],"answer":3},"u2q14":{"id":"u2q14","unit":2,"diff":"m","pool":"quiz","stem":"<p>Which pair were allies during the Seven Years' War?<\/p>","options":["Britain and Prussia","Britain and France","Britain and Austria","France and Prussia","Prussia and Austria"],"why":["After the Diplomatic Revolution, Britain subsidized Prussia against Austria, France and Russia.","They were the main colonial rivals.","They had been allies earlier but split in 1756.","France switched to Austria's side in 1756.","Austria wanted to reconquer Silesia from Prussia."],"answer":0},"u2q15":{"id":"u2q15","unit":2,"diff":"m","pool":"exam1","stem":"<p>Frederick William I of Prussia, the \"Soldier King,\" is best known for<\/p>","options":["conquering Silesia from Austria","building a large, well-drilled army and a full treasury through strict economy","writing philosophical letters to Voltaire","creating a constitutional monarchy","leading Prussia to defeat at Jena"],"why":["His son Frederick II did that in 1740.","He made Prussia a major military power while rarely going to war.","That was Frederick II.","He was an absolutist.","Jena was in 1806, under Frederick William III."],"answer":1},"u2q16":{"id":"u2q16","unit":2,"diff":"m","pool":"quiz","stem":"<p>After Louis XIV died in 1715, the Paris parlement regained the right to<\/p>","options":["object to royal decrees before registering them","elect the king of France","declare war without royal approval","abolish noble tax exemptions","appoint the king's ministers"],"why":["The parlements later used this right of remonstrance to block tax reforms.","The French crown was hereditary.","The parlements were law courts with no war powers.","The parlements defended privilege; they did not abolish it.","Ministers were chosen by the king."],"answer":0},"u2q17":{"id":"u2q17","unit":2,"diff":"h","pool":"exam1","stem":"<p>Which development best reflects proto-industrialization in the eighteenth century?<\/p>","options":["Rural families earning extra income by spinning and weaving for merchants","State-run silk factories in Lyon","The Navigation Acts' restriction of colonial shipping","The building of steam-powered cotton mills in Manchester","The guilds' monopoly over urban textile production"],"why":["Proto-industry was market-oriented rural cottage production that came before factories.","Lyon's silk trade was urban and artisanal.","These were trade laws, not a production system.","Mills are the factory system itself, not its precursor.","Proto-industry grew in the countryside largely to escape guild control."],"answer":0},"u2q18":{"id":"u2q18","unit":2,"diff":"h","pool":"quiz","stem":"<p>A historian notes that the national debt of both Britain and France nearly doubled because of the Seven Years' War. Which later development does this best help explain?<\/p>","options":["Both the American Revolution and the French fiscal crisis of the 1780s","The Diplomatic Revolution of 1756","The spread of the potato in eastern Europe","The South Sea Bubble of 1720","The Glorious Revolution of 1688"],"why":["British taxes on the colonies and France's bankruptcy both grew out of war debt.","The alliance switch came before the debts were run up.","Crop diffusion is unrelated to war debt.","That came before the war.","That came long before the war."],"answer":0},"u2q19":{"id":"u2q19","unit":2,"diff":"h","pool":"exam2","stem":"<p>Which factor contributed LEAST to Europe's eighteenth-century population growth?<\/p>","options":["Advances in hospital medicine","The disappearance of bubonic plague from western Europe","A milder climate after the seventeenth century","Improved transportation for moving grain","The spread of the potato"],"why":["Hospitals of the period often spread disease; medicine had little demographic effect before the 1800s.","This sharply reduced mortality.","Better harvests reduced famine.","Better roads and canals relieved local shortages.","The potato provided cheap calories and reduced famine."],"answer":0},"u2q20":{"id":"u2q20","unit":2,"diff":"h","pool":"quiz","stem":"<p>Which statement best compares Britain and France in the mid-1700s?<\/p>","options":["Britain was an absolute monarchy and France a parliamentary state","Britain's Parliament-backed credit let it borrow cheaply for war, while France's finances were hampered by privilege and distrust of banks","Both abolished their colonial empires after 1763","France had a larger navy and won most colonial wars","Neither country participated in the Atlantic slave trade"],"why":["The reverse is true.","Britain's credit system funded naval victories; France's tax exemptions and memories of John Law's collapse limited its borrowing.","Both kept empires; France kept its sugar islands.","Britain's navy was superior, and Britain won the Seven Years' War.","Both were major slave-trading nations."],"answer":1},"u2q21":{"id":"u2q21","unit":2,"diff":"m","pool":"quiz","stem":"<p>What was the asiento that Britain won in 1713?<\/p>","options":["The right to supply enslaved Africans to Spanish America","Permanent fishing rights in the Baltic","A monopoly on the tea trade with China","Control of the Mississippi River","A royal charter for the Bank of England"],"why":["The asiento contract was the commercial prize of Utrecht and was later held by the South Sea Company.","The asiento concerned the slave trade.","The British East India Company's China trade was unrelated to the asiento.","The Mississippi remained in French and then Spanish hands until 1803.","The Bank of England was chartered in 1694."],"answer":0},"u2q22":{"id":"u2q22","unit":2,"diff":"e","pool":"diag","stem":"<p>Which crop from the Americas most helped Europe reduce famine in the eighteenth century?<\/p>","options":["Tobacco","Coffee","The potato","Rice","Sugarcane"],"why":["Tobacco is not a food.","Coffee is a stimulant, not a staple food.","Potatoes yielded many calories per acre and grew in poor soils.","Rice was not a major American crop in Europe's diet.","Sugar was a cash crop grown in the Caribbean, not a European staple."],"answer":2},"u2q23":{"id":"u2q23","unit":2,"diff":"m","pool":"exam2","stem":"<p>Which best describes how mercantilist Britain viewed its colonies?<\/p>","options":["As burdens to be abandoned as soon as possible","As sources of raw materials and markets that should trade mainly with Britain","As places to build factories that would compete with Britain","As independent nations free to trade with anyone","As territories governed directly by Parliament's elected colonial members"],"why":["Britain fought major wars to keep and expand them.","The Navigation Acts channeled colonial trade through British ships and ports.","Colonial manufacturing was discouraged.","Mercantilism restricted colonial trade.","Colonies had no seats in Parliament."],"answer":1},"u2q24":{"id":"u2q24","unit":2,"diff":"h","pool":"quiz","stem":"<p>Which of the following is the best evidence that the Seven Years' War was a \"world war\"?<\/p>","options":["It lasted seven years","It started because of a dynastic succession dispute","It involved more than one German state","Fighting took place in Europe, North America, the Caribbean, India and at sea","It ended with a treaty signed in Paris"],"why":["Length alone does not make a war global.","It was rooted in Silesia and colonial rivalry, not succession.","German states fought each other in many wars.","Its theaters spanned several continents and oceans.","Many treaties were signed in Paris."],"answer":3},"u3q1":{"id":"u3q1","unit":3,"diff":"e","pool":"quiz","stem":"<p>Who first proposed, in a book published in 1543, that the Earth revolves around the Sun?<\/p>","options":["Galileo Galilei","Johannes Kepler","Ptolemy","Isaac Newton","Nicolaus Copernicus"],"why":["Galileo supported heliocentrism with evidence after 1610, but did not first propose it.","Kepler refined the model with elliptical orbits after 1600.","Ptolemy was the ancient author of the Earth-centered model.","Newton explained why planets orbit (gravity) in 1687.","His On the Revolutions of the Heavenly Spheres put the Sun at the center."],"answer":4},"u3q2":{"id":"u3q2","unit":3,"diff":"e","pool":"quiz","stem":"<p>Isaac Newton's Principia (1687) is best known for<\/p>","options":["arguing for the divine right of kings","describing the circulation of the blood","proving that the mind is a blank slate at birth","the law of universal gravitation and three laws of motion","defending the Earth-centered universe"],"why":["Principia is a work of physics.","That was William Harvey (1628).","That is Locke's Essay (1690).","It showed that one set of physical laws governs both the heavens and the Earth.","Newton's work confirmed the Sun-centered system."],"answer":3},"u3q3":{"id":"u3q3","unit":3,"diff":"e","pool":"exam2","stem":"<p>Which thinker is associated with the statement \"I think, therefore I am\"?<\/p>","options":["Francis Bacon","Thomas Hobbes","Blaise Pascal","John Locke","René Descartes"],"why":["Bacon emphasized observation and experiment.","Hobbes is known for Leviathan.","Pascal is known for his religious Pensées and mathematics.","Locke is known for empiricism and natural rights.","It comes from his Discourse on Method (1637), the starting point of his rationalism."],"answer":4},"u3q4":{"id":"u3q4","unit":3,"diff":"e","pool":"diag","stem":"<p>According to Thomas Hobbes, people in the state of nature live lives that are<\/p>","options":["\"solitary, poor, nasty, brutish, and short\"","organized into democratic assemblies","peaceful and guided by natural rights","governed by the divine right of kings","noble and uncorrupted by civilization"],"why":["Hobbes used this bleak picture to argue for an all-powerful sovereign.","Hobbes's state of nature has no government at all.","That is closer to Locke's view.","Hobbes based authority on a social contract, not on God.","That is Rousseau's idea of the noble savage, from the 1700s."],"answer":0},"u3q5":{"id":"u3q5","unit":3,"diff":"e","pool":"exam1","stem":"<p>Galileo's telescope observations included<\/p>","options":["the elliptical shape of planetary orbits","bacteria in drops of water","moons orbiting Jupiter","the law of universal gravitation","the planet Neptune"],"why":["Kepler discovered elliptical orbits by calculation.","Leeuwenhoek saw microorganisms with a microscope.","These showed that not every heavenly body circles the Earth.","That was Newton's work.","Neptune was discovered in 1846."],"answer":2},"u3q6":{"id":"u3q6","unit":3,"diff":"e","pool":"exam2","stem":"<p>Francis Bacon promoted which approach to knowledge?<\/p>","options":["Reliance on the authority of Aristotle","Ignoring practical uses of science","Accepting truths revealed in dreams and visions","Deduction from self-evident first principles","Induction: drawing general conclusions from careful observation and experiment"],"why":["Bacon attacked uncritical reliance on ancient authority.","Bacon insisted knowledge should be useful.","Bacon demanded empirical evidence.","That is Descartes's rationalism.","Bacon's Novum Organum urged experimental investigation of nature."],"answer":4},"u3q7":{"id":"u3q7","unit":3,"diff":"e","pool":"exam1","stem":"<p>William Harvey's major contribution was<\/p>","options":["showing that blood circulates through the body pumped by the heart","the first heliocentric model","developing a smallpox vaccine","the law of gases relating pressure and volume","the discovery of oxygen"],"why":["His 1628 work overturned Galen's theory of blood.","That was Copernicus.","Jenner developed it in 1796.","That is Boyle's law.","Oxygen was identified in the 1770s."],"answer":0},"u3q8":{"id":"u3q8","unit":3,"diff":"m","pool":"diag","stem":"<p>Which statement best contrasts Hobbes and Locke?<\/p>","options":["Hobbes thought people must surrender their rights to an absolute ruler; Locke thought government exists to protect natural rights and may be overthrown","Both believed rebellion against a government is always justified","Both rejected the idea of a social contract","Hobbes defended democracy; Locke defended dictatorship","Hobbes supported the divine right of kings; Locke supported absolute monarchy"],"why":["This is the core difference between Leviathan and the Two Treatises.","Hobbes denied any right of rebellion.","Both built their theories on a social contract.","Neither description fits.","Hobbes used a social contract, not divine right, and Locke opposed absolutism."],"answer":0},"u3q9":{"id":"u3q9","unit":3,"diff":"m","pool":"exam1","stem":"<p>Kepler's laws of planetary motion depended most on<\/p>","options":["the precise observational data collected by Tycho Brahe","Church records of eclipses","Ptolemy's model of epicycles","Newton's law of universal gravitation","Galileo's experiments with falling bodies"],"why":["Kepler, Brahe's assistant, used his records of Mars to discover elliptical orbits.","Kepler's key source was Brahe's modern observations.","Kepler replaced epicycles.","Newton came after Kepler and explained his laws.","Those concerned motion on Earth."],"answer":0},"u3q10":{"id":"u3q10","unit":3,"diff":"m","pool":"exam1","stem":"<p>Galileo's trial before the Inquisition in 1633 resulted from<\/p>","options":["his invention of calculus","his support of the Protestant Reformation","his public defense of the Copernican system in the Dialogue Concerning the Two Chief World Systems","his claim that the Earth was the center of the universe","his dissection of human corpses"],"why":["Calculus was developed later by Newton and Leibniz.","Galileo remained a Catholic.","The Church saw the book as defying its 1616 order not to teach heliocentrism as fact.","Galileo argued the opposite.","That was Vesalius's method in anatomy."],"answer":2},"u3q11":{"id":"u3q11","unit":3,"diff":"m","pool":"exam2","stem":"<p>John Locke's concept of the tabula rasa implied that<\/p>","options":["education and environment could improve human beings","humans are born with knowledge of God and morality","kings rule by divine right","social classes are fixed by birth","reason is useless without revelation"],"why":["If people are shaped by experience, better institutions could make better people.","Locke rejected innate ideas.","Tabula rasa is a theory of knowledge, not of kingship.","The idea undermined claims of inborn superiority.","Locke valued reason and experience."],"answer":0},"u3q12":{"id":"u3q12","unit":3,"diff":"m","pool":"exam2","stem":"<p>Which of the following pairs a thinker with the correct idea?<\/p>","options":["Hobbes: people have a right to overthrow unjust rulers","Vesalius: planets move in ellipses","Hugo Grotius: natural law governs relations between nations","Descartes: knowledge comes only from sense experience","Bacon: the Earth is the center of the universe"],"why":["That is Locke; Hobbes denied any such right.","Vesalius was an anatomist; Kepler discovered ellipses.","Grotius's On the Law of War and Peace founded international law.","That is empiricism; Descartes was a rationalist.","Bacon did not defend geocentrism."],"answer":2},"u3q13":{"id":"u3q13","unit":3,"diff":"m","pool":"exam2","stem":"<p>The founding of the Royal Society of London and the French Academy of Sciences in the 1660s shows that<\/p>","options":["the Catholic Church controlled scientific research in England","women were admitted as full members of scientific bodies","governments and elites had begun to sponsor and organize scientific research","universities had become the main centers of scientific innovation","science was considered a threat to every monarchy"],"why":["England was Protestant, and the Royal Society was independent of Rome.","Women were excluded; Margaret Cavendish was only a visitor.","State-backed academies gave science institutional prestige and support.","Much innovation happened outside the conservative universities.","Monarchs such as Charles II and Louis XIV supported these bodies."],"answer":2},"u3q14":{"id":"u3q14","unit":3,"diff":"m","pool":"quiz","stem":"<blockquote>\"The heavens are perfect and unchanging; the Earth, at the center, is the realm of change and decay.\"<\/blockquote><p>Which observation most directly challenged this view?<\/p>","options":["Galileo's sighting of mountains and craters on the Moon","Descartes's development of analytic geometry","Harvey's discovery of the circulation of the blood","Boyle's experiments with gases","Locke's argument for a tabula rasa"],"why":["An uneven, Earth-like Moon showed that heavenly bodies were not perfect.","This was a mathematical tool, not an observation.","This concerned anatomy, not the heavens.","These concerned chemistry.","This concerned human knowledge."],"answer":0},"u3q15":{"id":"u3q15","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which of the following best describes the \"clockmaker\" view of God that many drew from Newton's work?<\/p>","options":["God reveals scientific truths only through scripture","The universe has no creator","God designed the universe to run by natural laws and does not intervene in its operation","God personally moves each planet every day","God punishes scientists who question the Church"],"why":["Newtonian science relied on observation and mathematics.","The clockmaker image presupposes a designer.","This deist image follows from the Newtonian machine universe.","The clockmaker image implies a self-running machine.","This is not what the metaphor means."],"answer":2},"u3q16":{"id":"u3q16","unit":3,"diff":"m","pool":"exam1","stem":"<p>Vesalius's work in anatomy and Copernicus's work in astronomy, both published in 1543, had in common that they<\/p>","options":["proved the law of universal gravitation","challenged ancient authorities (Galen and Ptolemy) through new investigation","relied on the telescope","were immediately accepted by all universities","were written to support the Protestant Reformation"],"why":["That was Newton in 1687.","Both books corrected classical authorities through direct study.","The telescope was not used in astronomy until 1609.","Acceptance came slowly.","Neither was a religious tract."],"answer":1},"u3q17":{"id":"u3q17","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which work was written in part to justify the Glorious Revolution?<\/p>","options":["Newton's Principia","Descartes's Discourse on Method","Bacon's Novum Organum","Locke's Two Treatises of Government","Hobbes's Leviathan"],"why":["That is a work of physics.","That is a 1637 work of philosophy written in France.","That was a 1620 treatise on scientific method.","Locke defended the replacement of James II as resistance to a ruler who violated the people's rights.","Leviathan appeared in 1651 and defended strong sovereign power."],"answer":3},"u3q18":{"id":"u3q18","unit":3,"diff":"m","pool":"quiz","stem":"<p>Pierre Bayle's Historical and Critical Dictionary (1697) contributed to the new view of society by<\/p>","options":["defending the persecution of religious minorities","reviving Aristotle's physics","proving the existence of witches","applying skeptical criticism to religious and historical claims and urging toleration","calling for a return to absolute monarchy"],"why":["Bayle, a Huguenot exile, argued for toleration.","Bayle was a critic, not a defender, of old authorities.","Bayle's skepticism helped end belief in witchcraft.","Bayle insisted no belief should be accepted without evidence.","His work was critical, not a political program for absolutism."],"answer":3},"u3q19":{"id":"u3q19","unit":3,"diff":"m","pool":"quiz","stem":"<p>Which development came LAST?<\/p>","options":["Publication of Newton's Principia","Harvey's work on the circulation of the blood","Publication of Hobbes's Leviathan","Galileo's trial before the Inquisition","Publication of Copernicus's On the Revolutions"],"why":["1687, the latest of these.","1628.","1651.","1633.","1543."],"answer":0},"u3q20":{"id":"u3q20","unit":3,"diff":"h","pool":"exam1","stem":"<p>A historian argues that the Scientific Revolution changed how educated Europeans decided what was true. Which change best supports this?<\/p>","options":["Most peasants accepted heliocentrism by 1700","The Catholic Church immediately endorsed Galileo's work","Scientists rejected all belief in God","Authority shifted from ancient texts and tradition to observation, experiment and mathematical proof","Universities stopped teaching Latin"],"why":["The new science spread mainly among elites.","The Church condemned Galileo in 1633.","Most leading scientists, including Newton, were religious.","This change of method, more than any single discovery, defines the revolution.","Latin remained the language of scholarship."],"answer":3},"u3q21":{"id":"u3q21","unit":3,"diff":"h","pool":"exam2","stem":"<p>Which of the following was a weakness of Copernicus's original model?<\/p>","options":["It placed the Earth at the center of the universe","It kept circular orbits, so it predicted planetary positions no better than Ptolemy's","It relied on telescope observations that were later shown to be faulty","It denied the existence of the planets","It was based on Newton's flawed equations"],"why":["Copernicus placed the Sun at the center.","Accuracy improved only when Kepler introduced ellipses.","Copernicus had no telescope.","It described the known planets orbiting the Sun.","Newton came more than a century later."],"answer":1},"u3q22":{"id":"u3q22","unit":3,"diff":"h","pool":"quiz","stem":"<p>Hobbes's political conclusions were most directly shaped by<\/p>","options":["the French Revolution","the Glorious Revolution of 1688","the revocation of the Edict of Nantes","his experience as a minister of Louis XIV","the disorder of the English Civil War"],"why":["The French Revolution came more than a century later.","Leviathan was published in 1651, decades earlier.","That came in 1685, long after Leviathan.","Hobbes was English and never served Louis XIV.","Having lived through civil war, he valued order above liberty."],"answer":4},"u3q23":{"id":"u3q23","unit":3,"diff":"h","pool":"exam2","stem":"<p>The combination of Bacon's and Descartes's approaches is significant because<\/p>","options":["their ideas led directly to the revocation of the Edict of Nantes","both men defended the authority of Aristotle","both men rejected experiment entirely","modern scientific method joins experimental observation with mathematical reasoning","Descartes's dualism proved that Bacon's induction was invalid"],"why":["The revocation was a religious-political act by Louis XIV.","Both attacked reliance on Aristotle.","Bacon championed experiment.","Newton's work showed how experiment and mathematics together produce reliable laws.","Neither method disproved the other."],"answer":3},"u3q24":{"id":"u3q24","unit":3,"diff":"h","pool":"quiz","stem":"<p>Which statement about women in the Scientific Revolution is most accurate?<\/p>","options":["Women were barred from all scientific activity by law","Some women contributed to science, but they were largely excluded from universities and academies","Women founded the French Academy of Sciences","Women led the opposition to heliocentrism","Women held most of the seats in the Royal Society"],"why":["No such law existed; women worked in households and family observatories.","Maria Winkelmann was denied an academy post despite discovering a comet.","It was founded under Louis XIV's minister Colbert.","There is no evidence of this.","Women were not admitted as fellows until 1945."],"answer":1},"u3q25":{"id":"u3q25","unit":3,"diff":"h","pool":"exam1","stem":"<p>Which development helped end the European witch hunts by around 1700?<\/p>","options":["The Catholic Church's adoption of heliocentrism","Educated elites adopted a mechanistic, skeptical worldview that made magic seem implausible","The discovery of the circulation of the blood","Newton's personal campaign against witch trials","The Treaty of Utrecht's ban on religious courts"],"why":["The Church did not endorse heliocentrism in this period.","Judges and officials stopped accepting accusations as the new science spread.","Harvey's work did not address witchcraft.","Newton led no such campaign.","Utrecht contained no such provision."],"answer":1},"u3q26":{"id":"u3q26","unit":3,"diff":"m","pool":"quiz","stem":"<p>A thinker who says the mind is like a blank sheet of paper and that all knowledge comes from experience is expressing<\/p>","options":["mercantilism, as in Colbert","rationalism, as in Descartes's philosophy","geocentrism, as in Ptolemy","empiricism, as in Locke's Essay Concerning Human Understanding","divine-right theory, as in Bossuet"],"why":["That is an economic doctrine.","Descartes believed in innate ideas known by reason.","That is a cosmology.","Locke's empiricism grounded all knowledge in experience.","That concerns monarchy, not knowledge."],"answer":3},"u4q1":{"id":"u4q1","unit":4,"diff":"e","pool":"exam2","stem":"<p>Which German Jewish philosopher argued that Jews could be full participants in European culture and loyal citizens?<\/p>","options":["Johann Gottfried Herder","Martin Luther","Karl Marx","Moses Mendelssohn","Immanuel Kant"],"why":["Herder wrote on national culture and language.","Luther was a sixteenth-century reformer.","Marx was a nineteenth-century socialist.","Mendelssohn was a leading voice of the Jewish Enlightenment (Haskalah).","Kant was a Prussian philosopher, not Jewish."],"answer":3},"u4q2":{"id":"u4q2","unit":4,"diff":"e","pool":"exam1","stem":"<p>Most philosophes were best described as<\/p>","options":["reformers who wanted rational, tolerant government, not necessarily democracy","supporters of the divine right of kings","revolutionaries who demanded immediate democracy everywhere","defenders of the Catholic Church's political power","opponents of all scientific inquiry"],"why":["Many, like Voltaire, hoped for an enlightened monarch rather than popular rule.","They judged government by reason and utility.","Few philosophes before 1789 called for full democracy.","They generally attacked clerical power.","They were enthusiastic about science."],"answer":0},"u4q3":{"id":"u4q3","unit":4,"diff":"e","pool":"quiz","stem":"<p>Which Enlightenment thinker argued for the separation of powers into legislative, executive and judicial branches?<\/p>","options":["Montesquieu","Beccaria","Adam Smith","Voltaire","Rousseau"],"why":["The Spirit of the Laws (1748) made the separation of powers famous.","Beccaria wrote on criminal justice.","Smith wrote on economics.","Voltaire is best known for toleration and satire.","Rousseau stressed the general will and popular sovereignty."],"answer":0},"u4q4":{"id":"u4q4","unit":4,"diff":"e","pool":"exam1","stem":"<p>Adam Smith's The Wealth of Nations (1776) argued that<\/p>","options":["the state should set all prices and wages","workers should own the means of production","free markets guided by an \"invisible hand\" of competition promote prosperity","colonies are the only true source of wealth","governments should hoard gold and silver through tariffs"],"why":["Smith opposed such controls.","That is socialism, which came later.","Smith attacked mercantilist controls and favored laissez-faire.","Smith saw labor and productivity as the sources of wealth.","That is mercantilism, which Smith criticized."],"answer":2},"u4q5":{"id":"u4q5","unit":4,"diff":"e","pool":"quiz","stem":"<p>The opening line \"Man is born free, and everywhere he is in chains\" comes from<\/p>","options":["Voltaire's Candide","Locke's Two Treatises of Government","Rousseau's The Social Contract","Marx's Communist Manifesto","Hobbes's Leviathan"],"why":["Candide is a satirical novel about optimism.","Locke wrote about natural rights but not this line.","The 1762 work argued that legitimate government must express the general will.","The Manifesto ends \"Workers of the world, unite!\" and dates from 1848.","Hobbes described life in the state of nature as \"nasty, brutish, and short.\""],"answer":2},"u4q6":{"id":"u4q6","unit":4,"diff":"e","pool":"exam2","stem":"<p>Cesare Beccaria's On Crimes and Punishments (1764) called for<\/p>","options":["the restoration of trial by ordeal","the abolition of all prisons","harsher punishments for religious dissenters","rule by the Catholic Inquisition","an end to torture and the death penalty"],"why":["Beccaria favored rational justice.","Beccaria favored proportionate punishment, not abolishing prisons.","Beccaria opposed cruelty and arbitrariness.","Beccaria criticized arbitrary courts.","Beccaria argued punishments should prevent crime, not inflict cruelty."],"answer":4},"u4q7":{"id":"u4q7","unit":4,"diff":"e","pool":"quiz","stem":"<p>Who edited the Encyclopedia, a major summary of Enlightenment knowledge?<\/p>","options":["Denis Diderot","Isaac Newton","Immanuel Kant","Catherine the Great","Adam Smith"],"why":["Diderot and d'Alembert led the project from 1751 to 1772.","Newton died in 1727 and was a scientist, not an encyclopedist.","Kant was a German philosopher.","Catherine was a patron of Diderot but not the editor.","Smith wrote The Wealth of Nations."],"answer":0},"u4q8":{"id":"u4q8","unit":4,"diff":"e","pool":"exam1","stem":"<p>Which ruler was an \"enlightened despot\"?<\/p>","options":["Oliver Cromwell","Charles I of England","Frederick II of Prussia","Louis XIV of France","William III of England"],"why":["Cromwell ruled England in the 1650s, before the Enlightenment.","Charles was a divine-right Stuart king executed in 1649.","He corresponded with Voltaire, abolished torture and promoted toleration while keeping absolute power.","Louis XIV was an absolutist before the Enlightenment.","William was a constitutional monarch."],"answer":2},"u4q9":{"id":"u4q9","unit":4,"diff":"e","pool":"exam2","stem":"<p>Mary Wollstonecraft's A Vindication of the Rights of Woman argued that<\/p>","options":["women's suffrage had already been achieved in Britain","women should receive the same education as men because they are equally capable of reason","women should be confined to domestic life","women should not be allowed to read novels","women should rule as absolute monarchs"],"why":["British women gained the vote only in 1918 and 1928.","She blamed women's apparent inferiority on lack of education.","That was Rousseau's view, which she attacked.","Her argument centered on education and reason.","She wrote about rights and education, not monarchy."],"answer":1},"u4q10":{"id":"u4q10","unit":4,"diff":"m","pool":"exam1","stem":"<p>Joseph II of Austria's reforms differed from those of Frederick II and Catherine II in that Joseph<\/p>","options":["shared power with an elected parliament","ignored Enlightenment ideas completely","strengthened the privileges of the nobility","abolished serfdom, though resistance led to most of his reforms being reversed","refused to grant any religious toleration"],"why":["Joseph remained an absolute ruler.","He was the most enthusiastic reformer of the three.","That fits Catherine's Charter of the Nobility.","Joseph went further than other enlightened despots and paid for it.","His Edict of Toleration (1781) did the opposite."],"answer":3},"u4q11":{"id":"u4q11","unit":4,"diff":"m","pool":"quiz","stem":"<p>Catherine the Great's response to Pugachev's Rebellion (1773–1775) was to<\/p>","options":["emancipate the serfs to win their loyalty","adopt Rousseau's general will as Russia's constitution","ally more closely with the nobility, confirming their privileges in the Charter of the Nobility","abdicate in favor of her son","call an elected parliament with peasant representatives"],"why":["Serfdom expanded under Catherine; emancipation came in 1861.","Catherine never adopted a constitution.","After the revolt she relied on nobles to keep order and expanded serfdom.","She ruled until her death in 1796.","No such parliament was created."],"answer":2},"u4q12":{"id":"u4q12","unit":4,"diff":"m","pool":"exam1","stem":"<p>The partitions of Poland in 1772, 1793 and 1795 were carried out by<\/p>","options":["Napoleon and his allies","the Holy Roman Emperor and the pope","France, Britain and Spain","Russia, Prussia and Austria","Sweden and the Ottoman Empire"],"why":["Napoleon later created the Duchy of Warsaw out of partitioned land.","The pope had no role.","Western powers did not partition Poland.","All three took Polish land in 1772 and 1795; Russia and Prussia alone in 1793.","Neither took part."],"answer":3},"u4q13":{"id":"u4q13","unit":4,"diff":"m","pool":"exam1","stem":"<p>Most philosophes held which view of religion?<\/p>","options":["Deism, the belief in a rational creator who does not intervene in the world","Puritan predestination","That religion should control government","Polytheism based on classical gods","Strict Catholic orthodoxy"],"why":["Many, like Voltaire, rejected miracles and church authority but believed in a creator.","Philosophes rejected harsh dogma.","Philosophes favored toleration and limits on clerical power.","This was not a significant Enlightenment position.","Philosophes criticized the Church's power."],"answer":0},"u4q14":{"id":"u4q14","unit":4,"diff":"m","pool":"diag","stem":"<p>Which of the following institutions did the MOST to spread Enlightenment ideas among elite men and women in Paris?<\/p>","options":["The royal army","The Estates-General","Salons hosted by educated women","Guild workshops","The Jesuit order"],"why":["The army was not a vehicle for spreading ideas.","It did not meet between 1614 and 1789.","Salons brought together writers, nobles and officials to discuss new ideas.","Guilds organized trades, not intellectual debate.","The Jesuits generally defended the Church against the philosophes."],"answer":2},"u4q15":{"id":"u4q15","unit":4,"diff":"m","pool":"exam2","stem":"<blockquote>\"Political liberty is to be found only when there is no abuse of power. But constant experience shows us that every man invested with power is liable to abuse it... To prevent this abuse, it is necessary from the very nature of things that power should be a check to power.\"<\/blockquote><p>The author of this passage would most likely support<\/p>","options":["a single assembly with unlimited power","rule by the Catholic Church","an absolute monarch ruling by divine right","abolishing all government","a constitution
