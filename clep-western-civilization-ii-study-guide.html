factory workers","the campaign to repeal the Corn Laws","the overcrowded, unhealthy living and working conditions of industrial Manchester","the success of the Chartists in winning the vote"],"why":["His subject was industrial cities.","Engels described misery.","That was not his focus.","Engels drew on what he saw in his family's mill town.","The Chartists did not win in his lifetime."],"answer":3},"u6q18":{"id":"u6q18","unit":6,"diff":"m","pool":"exam2","stem":"<p>Abraham Darby's use of coke to smelt iron was important because<\/p>","options":["it freed iron production from dependence on scarce charcoal","it made iron too expensive for railways","it created the first steam locomotive","it ended Britain's need for coal","it mechanized cotton spinning"],"why":["Coal-based coke allowed iron output to expand enormously.","Cheaper iron made railways possible.","Locomotives came a century later.","Coke is made from coal.","That was the work of Hargreaves, Arkwright and Crompton."],"answer":0},"u6q19":{"id":"u6q19","unit":6,"diff":"m","pool":"exam2","stem":"<p>The Peterloo Massacre (1819) occurred when<\/p>","options":["Luddites burned factories in Yorkshire","the French army defeated the British at Waterloo","cavalry attacked a peaceful crowd demanding parliamentary reform in Manchester","strikers seized the Bank of England","Chartists stormed Parliament in 1848"],"why":["Luddite actions were different events.","Wellington defeated Napoleon at Waterloo in 1815.","About fifteen people were killed; it became a symbol of repression.","No such event occurred.","The 1848 Chartist rally was peaceful."],"answer":2},"u6q20":{"id":"u6q20","unit":6,"diff":"m","pool":"diag","stem":"<p>The Poor Law Amendment Act of 1834 reflected the belief that<\/p>","options":["the Church should take over all poor relief","relief should be made harsh so that the able-bodied poor would prefer to work","poverty was caused mainly by low wages set by employers","the state should guarantee a minimum income for all","workers should own the factories"],"why":["Relief was organized by local boards of guardians.","Workhouses were deliberately unpleasant to discourage dependence.","The act blamed idleness rather than wages.","The act was designed to cut relief costs.","That is a socialist idea."],"answer":1},"u6q21":{"id":"u6q21","unit":6,"diff":"m","pool":"exam2","stem":"<p>Which statement about Chartism is most accurate?<\/p>","options":["It succeeded immediately in winning universal male suffrage in 1838","It failed in the short run, but most of its demands later became law","It was organized mainly by landowners","It was a middle-class movement for free trade","It sought the overthrow of capitalism by armed revolution"],"why":["Universal male suffrage came in 1918.","Petitions were rejected in 1839, 1842 and 1848, yet by 1918 all points except annual parliaments were enacted.","Its base was the working class.","That was the Anti-Corn Law League.","Most Chartists sought political reform."],"answer":1},"u6q22":{"id":"u6q22","unit":6,"diff":"m","pool":"exam1","stem":"<p>On the continent, the Zollverein (1834) contributed to German industrialization by<\/p>","options":["abolishing serfdom in Prussia","uniting Germany politically under Austria","imposing tariffs on goods traded between German states","building Germany's first steam engines","removing tariffs among most German states and creating a larger market"],"why":["Prussian serfdom was abolished in reforms beginning in 1807.","Austria was excluded.","It removed them.","Steam engines were imported from Britain earlier.","The Prussian-led customs union promoted trade and economic unity."],"answer":4},"u6q23":{"id":"u6q23","unit":6,"diff":"m","pool":"quiz","stem":"<p>\"Separate spheres\" refers to the middle-class ideal that<\/p>","options":["church and state should be separated","workers and owners should live in separate parts of town","agriculture and industry should be taxed separately","Britain and its colonies should have separate economies","men belonged in the public world of work and politics and women in the home"],"why":["That is a different principle.","The term refers to gender roles.","The term has nothing to do with taxation.","The term refers to gender roles.","This ideology shaped nineteenth-century gender roles."],"answer":4},"u6q24":{"id":"u6q24","unit":6,"diff":"m","pool":"exam1","stem":"<blockquote>\"In Manchester... the cottages are old, dirty, and of the smallest sort, the streets uneven, fallen into ruts and in part without drains or pavement; masses of refuse, offal and sickening filth lie among standing pools in all directions.\"<\/blockquote><p>This description is most useful as evidence of<\/p>","options":["conditions on enclosed farms","middle-class life in London","the effects of rapid, unplanned urbanization on industrial workers","the success of the Factory Act of 1833","the effects of the Continental System"],"why":["The passage describes a city.","It describes working-class districts in Manchester.","It describes housing and sanitation in an industrial city.","The passage does not concern factory regulation.","The passage concerns urban conditions."],"answer":2},"u6q25":{"id":"u6q25","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which group was the core of the Anti-Corn Law League?<\/p>","options":["Catholic clergy","Luddite machine-breakers","Prussian Junkers","Middle-class manufacturers and merchants who wanted free trade","Aristocratic landowners"],"why":["The League was a secular economic campaign.","The League worked through petitions and Parliament.","The League was British.","Cobden and Bright led businessmen who wanted cheaper food and wider markets.","They benefited from the Corn Laws."],"answer":3},"u6q26":{"id":"u6q26","unit":6,"diff":"m","pool":"quiz","stem":"<p>Which change resulted from Richard Arkwright's water frame?<\/p>","options":["Coal mining was banned","Steam locomotives replaced canals","Weaving was mechanized for the first time","Spinning moved from homes to large water-powered mills","The putting-out system expanded"],"why":["Mining expanded.","That came with the railways after 1830.","The water frame spun thread; Cartwright's power loom mechanized weaving.","The water frame was too large for cottages and needed river power.","Factory spinning undercut cottage spinning."],"answer":3},"u6q27":{"id":"u6q27","unit":6,"diff":"h","pool":"exam2","stem":"<p>Which development MOST directly resulted from the high cost of transporting coal before 1830?<\/p>","options":["The decline of the cotton industry","The building of canals and then railways","The Luddite movement","The Great Reform Act","The repeal of the Corn Laws"],"why":["Cotton grew.","Moving bulky coal cheaply drove the canal age and the first railways.","Luddites protested machines.","That concerned representation.","That concerned grain tariffs."],"answer":1},"u6q28":{"id":"u6q28","unit":6,"diff":"h","pool":"quiz","stem":"<p>A historian argues that the early Industrial Revolution lowered living standards for many workers before raising them. Which evidence would best support this?<\/p>","options":["Data showing stagnant real wages and rising urban death rates before the 1840s, followed by rising real wages afterward","The growth of Britain's total GDP after 1780","The founding of the Bank of England in 1694","The invention of the spinning jenny in the 1760s","The passage of the Reform Act of 1832"],"why":["This is the \"pessimist\" position in the standard-of-living debate.","Total output can rise while workers' wages lag.","That predates industrialization.","An invention does not show workers' living standards.","That concerns voting rights."],"answer":0},"u6q29":{"id":"u6q29","unit":6,"diff":"h","pool":"exam2","stem":"<p>Continental European industrialization differed from British industrialization mainly in that<\/p>","options":["it was led by the textile industry in Russia","it rejected railways in favor of canals","it began earlier than in Britain","governments played a larger role through tariffs, banks and state-built railways","it relied entirely on water power"],"why":["Russia industrialized late.","Railways were central on the continent.","It came later.","Latecomers used the state to catch up with Britain.","Continental industry used steam and coal."],"answer":3},"u6q30":{"id":"u6q30","unit":6,"diff":"h","pool":"exam1","stem":"<p>David Ricardo's \"iron law of wages\" was used to argue that<\/p>","options":["women should be paid the same as men","governments should set a minimum wage","workers should seize factories in a revolution","landowners should give land to peasants","efforts to raise workers' wages through regulation would fail in the long run"],"why":["Ricardo's law was not about gender pay.","Ricardo's theory argued against such intervention.","Marx drew revolutionary conclusions; Ricardo did not.","Ricardo did not propose land redistribution.","If wages tend to subsistence, intervention seemed pointless to classical economists."],"answer":4},"u6q31":{"id":"u6q31","unit":6,"diff":"h","pool":"quiz","stem":"<p>Which statement best explains why Britain avoided revolution in 1848 when much of Europe did not?<\/p>","options":["The British army had been disbanded after Waterloo","Britain had already become a republic","Earlier reforms (1832, factory acts, Corn Law repeal) had given the middle class a stake in the system and eased some grievances","Chartism had already achieved universal suffrage","Britain had no industrial working class"],"why":["Britain kept an army.","Britain remained a monarchy.","Gradual reform defused pressure, and the Chartists' 1848 rally ended peacefully.","Universal male suffrage came in 1918.","It had Europe's largest industrial working class."],"answer":2},"u6q32":{"id":"u6q32","unit":6,"diff":"h","pool":"quiz","stem":"<p>Which statement about child labor in early British factories is most accurate?<\/p>","options":["Parliament abolished all child labor in 1802","Children were paid more than adult men","Children were employed because they were cheap and nimble, and legislation limited their work only gradually","Child labor was invented by the factory system","Children were banned from factories from the start of industrialization"],"why":["The 1802 act applied only to pauper apprentices and was poorly enforced.","Children were paid much less.","The 1833 Factory Act and later laws restricted child labor step by step.","Children had always worked on farms and in cottage industry.","Children worked in mills from the beginning."],"answer":2},"u6q33":{"id":"u6q33","unit":6,"diff":"m","pool":"quiz","stem":"<p>The Mines Act of 1842 prohibited<\/p>","options":["women and girls, and boys under 10, from working underground in mines","the export of coal to the continent","all coal mining in Britain","the use of steam engines in mines","trade unions among miners"],"why":["Reports on mine conditions shocked the public and led to the law.","The act concerned labor.","Mining expanded.","Steam engines were essential for pumping.","Unions were legal after 1824."],"answer":0},"u6q34":{"id":"u6q34","unit":6,"diff":"h","pool":"exam1","stem":"<p>Which pairing correctly links a cause to its consequence in British industrialization?<\/p>","options":["The repeal of the Corn Laws → the invention of the spinning jenny","The Factory Act of 1833 → the start of child labor","The Chartist petitions → universal male suffrage in 1848","The Peterloo Massacre → the abolition of the monarchy","Watt's efficient steam engine → factories no longer had to be built beside rivers"],"why":["The jenny came about eighty years before repeal.","The act limited child labor.","Parliament rejected the petitions.","Britain remained a monarchy.","Steam power let factories concentrate in coal towns and cities."],"answer":4},"u7q1":{"id":"u7q1","unit":7,"diff":"e","pool":"quiz","stem":"<p>Which ideology most strongly emphasized tradition, monarchy and an established church?<\/p>","options":["Anarchism","Utilitarianism","Conservatism","Liberalism","Socialism"],"why":["Anarchists rejected all state authority.","Utilitarians judged institutions by usefulness, not tradition.","Conservatives like Burke and Metternich defended the old order.","Liberals sought constitutions and individual rights.","Socialists attacked private property and inequality."],"answer":2},"u7q2":{"id":"u7q2","unit":7,"diff":"e","pool":"exam1","stem":"<p>The Communist Manifesto (1848) argued that<\/p>","options":["monarchy is the best form of government","society should return to medieval guilds","private property is a sacred natural right","history is the history of class struggles and the proletariat will overthrow the bourgeoisie","workers and owners share the same interests"],"why":["The Manifesto is revolutionary and anti-monarchical.","Marx looked forward, not backward.","Marx called for abolishing bourgeois property.","Marx and Engels predicted a workers' revolution.","Marx saw their interests as opposed."],"answer":3},"u7q3":{"id":"u7q3","unit":7,"diff":"e","pool":"diag","stem":"<p>Romanticism emphasized<\/p>","options":["realistic depiction of urban poverty","strict reason and mathematical order","emotion, imagination and nature","obedience to the Concert of Europe","the benefits of factory life"],"why":["That characterizes later Realism.","That characterizes the Enlightenment and classicism.","Romantics reacted against Enlightenment rationalism.","Romanticism was a cultural movement, often linked to nationalism.","Romantics often criticized industrialization."],"answer":2},"u7q4":{"id":"u7q4","unit":7,"diff":"e","pool":"exam1","stem":"<p>Giuseppe Mazzini is best known for<\/p>","options":["serving as Austria's foreign minister","writing The Communist Manifesto","painting Liberty Leading the People","founding Young Italy to work for a united, democratic Italy","leading the Decembrist Revolt"],"why":["That was Metternich.","That was Marx and Engels.","That was Delacroix.","Mazzini was the prophet of Italian nationalism.","That took place in Russia in 1825."],"answer":3},"u7q5":{"id":"u7q5","unit":7,"diff":"e","pool":"exam1","stem":"<p>The July Revolution of 1830 in France replaced Charles X with<\/p>","options":["Louis XVI","Louis-Philippe","Napoleon III","Louis XVIII","Napoleon Bonaparte"],"why":["Louis XVI was executed in 1793.","The \"citizen king\" ruled until 1848.","Louis Napoleon became president in 1848 and emperor in 1852.","Louis XVIII ruled 1814–1824.","Napoleon died in exile in 1821."],"answer":1},"u7q6":{"id":"u7q6","unit":7,"diff":"e","pool":"quiz","stem":"<p>Which of the following won its independence from the Ottoman Empire in the 1820s with help from Britain, France and Russia?<\/p>","options":["Hungary","Poland","Greece","Belgium","Italy"],"why":["Hungary was part of the Austrian Empire.","Poland was under Russian rule, and its 1830 revolt failed.","Navarino (1827) and Russian pressure secured Greek independence.","Belgium broke away from the Netherlands in 1830.","Italy was not united until 1861 and was not under the Ottomans."],"answer":2},"u7q7":{"id":"u7q7","unit":7,"diff":"e","pool":"exam2","stem":"<p>The Carlsbad Decrees (1819) were designed to<\/p>","options":["grant constitutions to all German states","unify Germany under Prussia","abolish serfdom in Austria","create a customs union","suppress liberal and nationalist activity in German universities and the press"],"why":["They restricted liberal movements.","They aimed to prevent nationalist agitation.","Serfdom was abolished in 1848.","That was the Zollverein (1834).","Metternich used them to censor and dissolve student societies."],"answer":4},"u7q8":{"id":"u7q8","unit":7,"diff":"e","pool":"quiz","stem":"<p>Which utopian socialist built a model industrial community at New Lanark, Scotland?<\/p>","options":["Robert Owen","Karl Marx","Jeremy Bentham","Lord Byron","Edmund Burke"],"why":["Owen provided schools, housing and shorter hours for his mill workers.","Marx rejected utopian experiments.","Bentham was a utilitarian philosopher.","Byron was a Romantic poet.","Burke was a conservative."],"answer":0},"u7q9":{"id":"u7q9","unit":7,"diff":"e","pool":"exam2","stem":"<p>The Frankfurt Parliament of 1848–1849 attempted to<\/p>","options":["restore Napoleon's Confederation of the Rhine","elect Metternich as German emperor","partition Poland","abolish the Prussian army","unify Germany under a liberal constitution"],"why":["It sought a new national state.","Metternich had fled Vienna.","It did not concern Poland's partition.","It had no power over the army.","It offered the crown to Frederick William IV, who refused."],"answer":4},"u7q10":{"id":"u7q10","unit":7,"diff":"m","pool":"exam1","stem":"<p>Most liberals in the early nineteenth century supported<\/p>","options":["state ownership of industry","absolute monarchy by divine right","universal suffrage for men and women","constitutional government with voting limited to property owners","the abolition of all government"],"why":["That is socialist.","That is conservative or absolutist.","Most liberals opposed even universal male suffrage.","Liberals feared democracy as well as absolutism.","That is anarchist."],"answer":3},"u7q11":{"id":"u7q11","unit":7,"diff":"m","pool":"exam1","stem":"<blockquote>\"A nation is a community of people united by a common language, history and spirit; every such people has the right to govern itself in its own state.\"<\/blockquote><p>This statement best expresses the ideology of<\/p>","options":["nationalism","utopian socialism","conservatism, as defended by Metternich","laissez-faire liberalism","utilitarianism"],"why":["It defines the nation by culture and claims a right to statehood.","Socialists focused on class, not nation.","Metternich opposed nationalism as a threat to the Austrian Empire.","This statement concerns national self-rule, not markets.","Utilitarianism judges by the greatest happiness, not by nationhood."],"answer":0},"u7q12":{"id":"u7q12","unit":7,"diff":"m","pool":"exam1","stem":"<p>Why was Metternich especially hostile to nationalism?<\/p>","options":["It threatened to break apart the multinational Austrian Empire","Nationalism was a conservative ideology","Austria wanted to unite Italy under its rule","Austria was a nation-state with one language","Nationalism required the restoration of the Holy Roman Empire"],"why":["Austria ruled Germans, Hungarians, Czechs, Poles, Italians and others.","In 1815 nationalism was revolutionary.","Austria opposed Italian unification.","Austria was the opposite.","Nationalists sought new nation-states."],"answer":0},"u7q13":{"id":"u7q13","unit":7,"diff":"m","pool":"exam2","stem":"<p>Utopian socialists differed from Marx in that they<\/p>","options":["hoped to reform society by example and persuasion rather than through class revolution","wanted to restore absolute monarchy","supported laissez-faire capitalism","denied that workers suffered under industrialization","were all government officials"],"why":["Owen and Fourier built model communities; Marx predicted revolution.","They sought social reform.","They criticized capitalist competition.","They were responding to workers' suffering.","Most were private reformers and writers."],"answer":0},"u7q14":{"id":"u7q14","unit":7,"diff":"m","pool":"quiz","stem":"<p>The revolutions of 1848 failed mainly because<\/p>","options":["the revolutionaries had won universal suffrage everywhere","Britain sent armies to restore the monarchs","no revolutions broke out outside France","Marx ordered the workers to stop fighting","liberals, radicals and rival nationalities divided while royal armies stayed loyal"],"why":["They had not.","Britain did not intervene; Russia did in Hungary.","Revolution spread across central Europe and Italy.","Marx had no such authority.","Divisions let monarchs regain control in 1848–49."],"answer":4},"u7q15":{"id":"u7q15","unit":7,"diff":"m","pool":"diag","stem":"<p>Which was a lasting result of the 1848 revolutions in the Austrian Empire?<\/p>","options":["Hungarian independence","Metternich's permanent return to power","The abolition of serfdom","The unification of Germany under Austria","The creation of a democratic republic"],"why":["Hungary was crushed in 1849, with Russian help.","Metternich never regained office.","The emancipation of 1848 was not reversed.","Germany was unified in 1871 without Austria.","The Habsburg monarchy survived under Franz Joseph."],"answer":2},"u7q16":{"id":"u7q16","unit":7,"diff":"m","pool":"exam2","stem":"<p>The June Days of 1848 in Paris were caused by<\/p>","options":["the publication of the Communist Manifesto","the government's closing of the National Workshops that employed jobless workers","Napoleon III's coup d'état","Charles X's July Ordinances","the arrival of Russian troops"],"why":["The Manifesto had little immediate effect.","Workers rose in protest and were crushed by the army.","The coup came in December 1851.","Those caused the 1830 revolution.","Russian troops intervened in Hungary, not France."],"answer":1},"u7q17":{"id":"u7q17","unit":7,"diff":"m","pool":"quiz","stem":"<p>Which work of art is most associated with the Romantic glorification of revolution?<\/p>","options":["David's Oath of the Horatii","Picasso's Guernica","Delacroix's Liberty Leading the People","Courbet's The Stone Breakers","Monet's Impression, Sunrise"],"why":["That is a Neoclassical painting of 1784.","That dates from 1937.","Painted after the July Revolution of 1830.","That is a Realist painting of 1849.","That is Impressionist, from 1872."],"answer":2},"u7q18":{"id":"u7q18","unit":7,"diff":"m","pool":"quiz","stem":"<p>Frederick William IV of Prussia refused the crown offered by the Frankfurt Parliament because<\/p>","options":["he wanted Austria to rule a united Germany","he had already been crowned emperor of Germany","Prussia had become a republic","he would not accept a crown from an elected assembly rather than from his fellow princes","Napoleon III threatened war"],"why":["He did not refuse in order to favor Austria.","There was no German emperor until 1871.","Prussia remained a monarchy.","He called it a \"crown from the gutter.\"","Napoleon III did not stop him."],"answer":3},"u7q19":{"id":"u7q19","unit":7,"diff":"m","pool":"exam2","stem":"<p>Jeremy Bentham's utilitarianism held that<\/p>","options":["tradition is the best guide for government","each nation has a unique spirit","property is theft","history is driven by class struggle","laws and institutions should be judged by whether they produce the greatest happiness of the greatest number"],"why":["That is a conservative view.","That is Herder's nationalism.","That is Proudhon.","That is Marxism.","Utility was the test of good policy."],"answer":4},"u7q20":{"id":"u7q20","unit":7,"diff":"m","pool":"exam1","stem":"<p>Which event of 1825 showed the influence of Western liberal ideas on the Russian army officer class?<\/p>","options":["The Crimean War","The November Uprising","The Greek War of Independence","The Decembrist Revolt","The emancipation of the serfs"],"why":["That came in 1853–56.","That was a Polish revolt in 1830.","That was an Ottoman, not Russian, revolt.","Officers who had seen Europe during the Napoleonic wars rebelled for a constitution.","That came in 1861."],"answer":3},"u7q21":{"id":"u7q21","unit":7,"diff":"m","pool":"quiz","stem":"<p>In 1848, Louis Napoleon Bonaparte won the French presidential election largely because<\/p>","options":["he had led the workers in the June Days","the Concert of Europe appointed him","only aristocrats were allowed to vote","his famous name and promise of order appealed to peasants and property owners frightened by radicalism","he was the candidate of the Communist League"],"why":["He was not involved in the June Days.","He was elected by French voters.","The 1848 election used universal male suffrage.","Voters chose stability after the June Days.","He ran on order and his uncle's legend."],"answer":3},"u7q22":{"id":"u7q22","unit":7,"diff":"m","pool":"exam2","stem":"<p>Which statement about nationalism and Romanticism is most accurate?<\/p>","options":["Romantics' interest in folk culture, language and history strengthened national identity","Romantics rejected all national traditions in favor of universal reason","Romanticism opposed the Greek struggle for independence","Nationalism and Romanticism were both invented by Metternich","Nationalism emerged only after 1900"],"why":["Collections like Grimm's tales celebrated a people's heritage.","That describes the Enlightenment more than Romanticism.","Romantics like Byron championed it.","Metternich opposed nationalism.","It was a major force by 1815."],"answer":0},"u7q23":{"id":"u7q23","unit":7,"diff":"h","pool":"exam1","stem":"<p>A liberal in 1830 and a socialist in 1848 would most likely have disagreed about<\/p>","options":["whether constitutions were needed","whether private property and free markets should be the basis of society","whether absolute monarchy was desirable","whether the Congress of Vienna's settlement should be preserved","whether censorship should be ended"],"why":["Most of both groups supported constitutions.","Liberals defended property and laissez-faire; socialists attacked them.","Both opposed absolute monarchy.","Both generally criticized it.","Both generally opposed censorship."],"answer":1},"u7q24":{"id":"u7q24","unit":7,"diff":"h","pool":"quiz","stem":"<p>The successful Greek War of Independence differed from the failed revolts in Naples and Spain in the 1820s because<\/p>","options":["the Greeks fought for an absolute monarchy","Metternich personally led the Greek armies","the revolt took place in Western Europe","the Greeks had no help from abroad","the great powers backed the Greeks against the Ottoman Empire rather than suppressing them"],"why":["The Greeks sought national independence.","Metternich opposed the revolt.","Greece w /* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (c, t) => (t ? Math.round((100 * c) / t) : 0);
const LETTERS = ["A", "B", "C", "D", "E"];
const UNITS = DATA.units;
const Q = DATA.questions;
const unitById = (id) => UNITS.find((u) => u.id === +id);
const dayNum = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5);
const isoDate = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const fmtH = (h) => (h < 1 ? Math.round(h * 60) + " min" : (Math.round(h * 10) / 10).toFixed(1).replace(/\.0$/, "") + " h");
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600); }
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ---------- storage (always wrapped: works with storage blocked) ---------- */
const KEY = "clep-wc2-guide-v1";
const EXAM_MINUTES = DATA.meta.format.time_minutes || 90;
const BOX_DAYS = [0, 0, 1, 3, 7, 14]; // Leitner box -> days until next review
function fresh() {
  return { v: 1, theme: "system", diag: null, units: {}, cards: {}, mistakes: {}, exams: {}, plan: { hours: 2, date: "", start: "" }, created: isoDate() };
}
let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    return Object.assign(fresh(), JSON.parse(raw));
  } catch (e) { storageOK = false; return fresh(); }
}
let ST = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(ST)); storageOK = true; }
  catch (e) { storageOK = false; }
}
const U = (id) => (ST.units[id] = ST.units[id] || { read: false, quiz: [] });

/* ---------- derived progress ---------- */
function quizBest(id) { const q = U(id).quiz; return q.length ? Math.max(...q.map((r) => r.score / r.total)) : null; }
function diagRec(id) {
  if (!ST.diag) return null;
  const [c, t] = ST.diag.byUnit[id] || [0, 0];
  if (!t) return null;
  const p = c / t;
  return p >= 0.75 ? "skim" : p >= 0.5 ? "review" : "study";
}
function cardStats(unitId) {
  const cards = unitId ? unitById(unitId).cards : UNITS.flatMap((u) => u.cards);
  let mastered = 0, seen = 0, due = 0;
  const today = dayNum();
  for (const c of cards) {
    const s = ST.cards[c.id];
    if (s) { seen++; if (s.box >= 3) mastered++; if (s.due <= today) due++; }
  }
  return { total: cards.length, mastered, seen, due, fresh: cards.length - seen };
}
function unitStatus(id) {
  const u = U(id), best = quizBest(id);
  const passed = best !== null && best >= 0.7;
  if (passed && (u.read || diagRec(id) === "skim")) return "done";
  if (u.read || u.quiz.length) return "prog";
  return "todo";
}
function unitRemainingHours(unit) {
  const u = U(unit.id), best = quizBest(unit.id), cs = cardStats(unit.id);
  let left = 1 - (u.read ? 0.4 : 0) - (best !== null && best >= 0.7 ? 0.4 : 0) - 0.2 * (cs.total ? cs.mastered / cs.total : 0);
  const factor = diagRec(unit.id) === "skim" ? 0.5 : 1;
  return Math.max(0, unit.hours * factor * left);
}
const EXTRA = { diag: 0.5, exam: 2.5, final: 2 };
function hoursLeft() {
  let h = UNITS.reduce((s, u) => s + unitRemainingHours(u), 0);
  if (!ST.diag) h += EXTRA.diag;
  for (const k of ["exam1", "exam2"]) if (!(ST.exams[k] && ST.exams[k].status === "done")) h += EXTRA.exam;
  if (!(ST.exams.exam2 && ST.exams.exam2.status === "done")) h += EXTRA.final;
  return h;
}

/* ---------- question sessions ---------- */
// kind: quiz | diag | exam | drill.  feedback: "now" (show answer immediately) or "end".

}
function runningExam() {
  for (const k of ["exam1", "exam2"]) { const e = ST.exams[k]; if (e && e.status === "running") return k; }
  return null;
}
function examSession(k) {

  return { kind: "exam", examKey: k, ids: e.ids, title: k === "exam1" ? "Practice Exam 1" : "Practice Exam 2", feedback: "end", idx: e.idx || 0, answers: e.answers, flags: e.flags, deadline: e.start + EXAM_MINUTES * 60000 };

}
function viewSession() {

      <div class="row">${timer}${s.kind !== "exam" ? `<button class="btn small ghost" type="button" data-act="quit">Quit</button>` : ""}</div>

}
function persistExam() {
  const s = S.session;
  if (s && s.kind === "exam") { const e = ST.exams[s.examKey]; e.answers = s.answers; e.flags = s.flags; e.idx = s.idx; save(); }
}
function pick(i) {
  const s = S.session; if (!s) return;

    s.answers[id] = i;

function nextQ() {

  const id = s.ids[s.idx];

  if (s.idx < s.ids.length - 1) { s.idx++; S.confirm = null; persistExam(); render(); window.scrollTo(0, 0); }
  else if (s.feedback === "end") {
    const unanswered = s.ids.filter((x) => s.answers[x] === undefined).length;

function grade(ids, answers) {

  for (const id of ids) {

    byUnit[q.unit] = byUnit[q.unit] || [0, 0];
    byUnit[q.unit][1]++;

}

  if (s.kind === "quiz") U(s.unit).quiz.push({ score: g.correct, total: g.total, date: isoDate() });
  if (s.kind === "diag") ST.diag = { answers: s.answers, byUnit: g.byUnit, score: g.correct, total: g.total, date: isoDate() };
  if (s.kind === "exam") Object.assign(ST.exams[s.examKey], { status: "done", answers: s.answers, byUnit: g.byUnit, score: g.correct, total: g.total, end: Date.now() });
  save();
  S.result = { kind: s.kind, title: s.title, ids: s.ids, answers: s.answers, g, unit: s.unit, examKey: s.examKey };

function startCards(mode) {
  const unitSel = S.cardUnit || 0, cards = deckCards(unitSel), today = dayNum();
  let q;
  if (mode === "missed") q = cards.filter((c) => ST.cards[c.id] && ST.cards[c.id].last === "miss");
  else if (mode === "all") q = cards.slice();
  else {
    const due = cards.filter((c) => ST.cards[c.id] && ST.cards[c.id].due <= today);
    const fresh = cards.filter((c) => !ST.cards[c.id]).slice(0, 20);
    q = due.concat(fresh);
  }
  if (!q.length) { toast("Nothing due in this deck. Try cram mode or another unit."); return; }
  S.cardSession = { queue: shuffle(q).map((c) => c.id), flipped: false, right: 0, wrong: 0, total: q.length };
  render();
}
const cardById = (id) => unitById(+id.match(/^u(\d+)/)[1]).cards.find((c) => c.id === id);
function viewCardRun(cs) {
  const c = cardById(cs.queue[0]);

  </div>
  <p class="small muted" style="text-align:center">Unit ${c.id.match(/^u(\d+)/)[1]}</p>
</div>`;

function gradeCard(ok) {
  const cs = S.cardSession; if (!cs || !cs.flipped) return;
  const id = cs.queue.shift();
  const s = ST.cards[id] || { box: 0, lapses: 0 };
  if (ok) { s.box = Math.min(5, Math.max(1, s.box) + 1); s.due = dayNum() + BOX_DAYS[s.box]; s.last = "ok"; cs.right++; }
  else {
    s.box = 1; s.due = dayNum(); s.last = "miss"; s.lapses = (s.lapses || 0) + 1; cs.wrong++;
    cs.queue.splice(Math.min(cs.queue.length, 3), 0, id); // comes back after ~3 cards
  }
  ST.cards[id] = s;
  cs.flipped = false;
  save();
  render();
}

/* ---------- study plan ---------- */
function buildPlan(hoursPerDay, examDate, startDate) {
  const start = new Date(startDate + "T00:00:00"), exam = new Date(examDate + "T00:00:00");
  const nDays = Math.round((exam - start) / 864e5); // study days before exam day
  if (!(hoursPerDay > 0)) return { error: "Enter how many hours a day you can study." };
  if (isNaN(nDays)) return { error: "Pick a start date and an exam date." };
  if (nDays < 3) return { error: "Pick an exam date at least 3 days after the start date: the last two days are reserved for the practice exams." };
  const tasks = [];
  if (!ST.diag) tasks.push({ label: "Diagnostic test (30 questions)", h: EXTRA.diag });
  const order = UNITS.slice().sort((a, b) => a.id - b.id);
  for (const u of order) {
    const left = unitRemainingHours(u);
    if (left < 0.05) continue;
    const skim = diagRec(u.id) === "skim";
    const lead = `Unit ${u.id} · ${u.short}${skim ? " (skim)" : ""}`;
    const parts = U(u.id).read ? [["quiz + review misses", 0.55], ["flashcards", 0.45]] : [["lesson + must-know + timeline", 0.4], ["quiz + review misses", 0.35], ["flashcards", 0.25]];
    for (const [p, f] of parts) tasks.push({ label: `${lead}: ${p}`, h: left * f, unit: u.id });
  }
  tasks.push({ label: "Mistake-log drill + weakest-unit quiz retake", h: 1 });
  tasks.push({ label: "Cheat sheet: redraw timeline and who's who from memory", h: 1 });
  const days = [];
  const studyDays = nDays - 2;
  for (let i = 0; i < nDays; i++) days.push({ date: new Date(start.getTime() + i * 864e5), items: [], h: 0 });
  let di = 0;
  const flash = hoursPerDay >= 1 ? 0.25 : 0;
  const cap = hoursPerDay - flash;
  for (const t of tasks) {
    let rem = t.h, part = 0;
    const whole = rem;
    while (rem > 0.01) {
      if (di >= studyDays) break;
      const room = cap - days[di].h;
      if (room < 0.1) { di++; continue; }
      const take = Math.min(room, rem);
      part++;
      const cont = take < rem - 0.01 || part > 1;
      days[di].items.push(`${t.label}${cont ? (part > 1 ? " (cont.)" : " (start)") : ""}`);
      days[di].h += take;
      rem -= take;
    }
    t.left = rem;
    if (di >= studyDays) break;
  }
  const shortfall = tasks.reduce((s, t) => s + (t.left === undefined ? t.h : t.left), 0);
  for (let i = 0; i < studyDays; i++) {
    if (!days[i].items.length) { days[i].items.push("Buffer: drill mistakes, retake your weakest quiz, or rest"); days[i].h = Math.min(cap, 1); days[i].buffer = true; }
    if (flash) { days[i].items.push("Flashcards: due cards (15 min)"); days[i].h += flash; }
  }
  days[nDays - 2].items = ["Practice Exam 1 (90 min, timed, no pausing)", "Review every missed question; drill mistake log"]; days[nDays - 2].h = EXTRA.exam; days[nDays - 2].exam = true;
  days[nDays - 1].items = ["Practice Exam 2 (90 min, timed, no pausing)", "Review misses; skim cheat sheet"]; days[nDays - 1].h = EXTRA.exam; days[nDays - 1].exam = true;
  days.push({ date: exam, items: ["CLEP exam day. Light flashcard warm-up only."], h: 0, examday: true });
  const need = tasks.reduce((s, t) => s + t.h, 0);
  return { days, shortfall, need, studyDays, suggest: Math.ceil(((need + studyDays * flash) / studyDays) * 4) / 4 + flash };
}
function viewPlan() {
  const p = ST.plan;
  const today = isoDate();
  const start = p.start || today;
  const def = isoDate(new Date(Date.now() + 21 * 864e5));
  const examDate = p.date || def;
  const res = buildPlan(+p.hours, examDate, start);
  let out;
  if (res.error) out = `<div class="notice bad">${res.error}</div>`;
  else {
    const rows = res.days.map((d, i) => `<tr class="${d.exam ? "exam" : ""} ${d.examday ? "examday" : ""}"><td class="num">${d.date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</td><td class="num">${d.examday ? "Exam" : "Day " + (i + 1)}</td><td><ul>${d.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></td><td class="n">${d.h ? fmtH(d.h) : ""}</td></tr>`).join("");
    const warn = res.shortfall > 0.1 ? `<div class="notice bad"><b>Not enough time:</b> about ${fmtH(res.shortfall)} of unit work doesn't fit before the practice exams. Study about <b>${res.suggest} hours a day</b>, or move the exam date later.</div>` : `<div class="notice info">Fits: ${fmtH(res.need)} of remaining work across ${res.studyDays} study days, then two practice-exam days.</div>`;
    out = warn + `<div class="tablewrap"><table class="plan-table"><thead><tr><th>Date</th><th>Day</th><th>Tasks</th><th class="n">Hours</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return `<div class="col">
  <span class="eyebrow">Day by day</span>
  <h1>Study plan</h1>
  <p class="lede">Built from what's left: finished units drop out and units your diagnostic marked "skim" get half the time. The last two days before the exam are always Practice Exam 1 and Practice Exam 2.</p>
  <div class="panel"><div class="row">

    <label class="field">Start date<input id="planStart" type="date" value="${esc(start)}" data-act="plan-input"></label>
    <label class="field">Exam date<input id="planDate" type="date" value="${esc(examDate)}" data-act="plan-input"></label>
  </div><p class="small muted">Total remaining: ${fmtH(hoursLeft())}. Changes save automatically.</p></div>
  <div id="planOut">${out}</div>
</div>`;
}

  <section class="panel"><h3>Official content outline and this guide's coverage</h3>
    <p class="small muted">Lesson, question and flashcard shares should track the official weight. Weights marked <span class="chip unverified">unverified</span> were confirmed only by third-party prep sites.</p>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Topic</th><th class="n">Official</th><th class="n">Lesson</th><th class="n">Questions</th><th class="n">Cards</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>
  <section class="panel"><h3>Sources</h3>
    <ul>${m.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a><br><span class="small muted url">${esc(s.url)}</span></li>`).join("")}</ul>
    <p class="notice">${esc(m.verificationNote)}</p>
    <p class="small muted">All questions, lessons and flashcards in this guide are original. They are not copied from the College Board, prep books or websites. CLEP is a registered trademark of the College Board, which does not endorse this guide.</p>
  </section>
  <section class="panel"><h3>How scoring works</h3>
    <p>CLEP reports a scaled score from 20 to 80; 50 is the credit-granting score the American Council on Education recommends. The College Board does not publish the raw score needed for a 50. <span class="chip unverified">unverified</span> Test-takers commonly report needing roughly 60% raw. This guide asks for 75% on both practice exams to leave a safety margin.</p>
  </section>
</div>`;
}

/* ---------- settings / export ---------- */
function viewSettings() {
  return `<div class="col">
  <span class="eyebrow">Your data</span>
  <h1>Progress & settings</h1>
  <section class="panel"><h3>Theme</h3><div class="row">${["system", "light", "dark"].map((t) => `<button class="btn ${ST.theme === t ? "primary" : ""}" type="button" data-act="set-theme" data-t="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div></section>
  <section class="panel"><h3>Export progress</h3>
    <p class="small muted">Progress lives in this browser only. Export it to move to another device or keep a backup.</p>
    <div class="row"><button class="btn primary" type="button" data-act="export">Download progress file</button><button class="btn" type="button" data-act="copy-export">Copy as text</button></div>
    <textarea id="exportBox" readonly aria-label="Progress JSON">${esc(JSON.stringify(ST))}</textarea>
  </section>
  <section class="panel"><h3>Import progress</h3>
    <p class="small muted">Choose a progress file or paste its text. This replaces your current progress.</p>
    <input type="file" id="importFile" accept="application/json,.json" data-act="import-file">
    <textarea id="importBox" placeholder="Paste exported progress JSON here" aria-label="Paste progress JSON"></textarea>
    <div class="row"><button class="btn" type="button" data-act="import-text">Import pasted text</button></div>
  </section>
  <section class="panel"><h3>Reset</h3>
    ${S.confirm === "reset" ? `<div class="notice bad">This erases all progress in this browser. <div class="row" style="margin-top:8px"><button class="btn danger" type="button" data-act="reset-confirm">Erase everything</button><button class="btn" type="button" data-act="cancel-confirm">Cancel</button></div></div>` : `<div class="row"><button class="btn danger" type="button" data-act="reset">Reset all progress</button></div>`}
  </section>
</div>`;
}
function importState(text) {
  try {
    const obj = JSON.parse(text);
    if (!obj || typeof obj !== "object" || obj.v !== 1 || typeof obj.units !== "object") throw new Error("shape");
    ST = Object.assign(fresh(), obj);
    save(); S = { session: null, result: null, cardSession: null, confirm: null };
    toast("Progress imported.");
    go("home");
  } catch (e) { toast("That isn't a progress file from this guide. Nothing was changed."); }
}

/* ---------- theme ---------- */
function syncTheme() {
  const root = document.documentElement;
  if (ST.theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ST.theme);
  const b = $("#themeBtn"); if (b) b.textContent = "◐ Theme: " + ST.theme;
}
function cycleTheme() {
  const dark = ST.theme === "dark" || (ST.theme === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  ST.theme = dark ? "light" : "dark";
  save(); syncTheme();
}

/* ---------- menu ---------- */
function closeMenu() { $("#rail").classList.remove("open"); $("#scrim").hidden = true; $("#menuBtn").setAttribute("aria-expanded", "false"); }
function toggleMenu() { const open = !$("#rail").classList.contains("open"); $("#rail").classList.toggle("open", open); $("#scrim").hidden = !open; $("#menuBtn").setAttribute("aria-expanded", String(open)); }

/* ---------- timer ---------- */
let timerId = null;
function tick() {
  const s = S.session, el = $("#timer");
  if (!s || !s.deadline) return;
  const left = s.deadline - Date.now();
  if (left <= 0) { stopTimer(); toast("Time's up. Your exam was submitted."); S.confirm = null; finishSession(); return; }
  if (el) {
    const m = Math.floor(left / 60000), sec = Math.floor((left % 60000) / 1000);
    el.textContent = `${m}:${String(sec).padStart(2, "0")}`;
    el.classList.toggle("low", left < 5 * 60000);
  }
}
function startTimer() { stopTimer(); if (S.session && S.session.deadline) { tick(); timerId = setInterval(tick, 1000); } }
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

/* ---------- actions ---------- */
const ACT = {
  menu: toggleMenu,
  theme: cycleTheme,
  "set-theme": (el) => { ST.theme = el.dataset.t; save(); render(); },
  "mark-read": (el) => { const u = U(el.dataset.u); u.read = !u.read; save(); render(); if (u.read) toast("Lesson marked read."); },
  "unit-quiz": (el) => { const u = unitById(el.dataset.u); startSession({ kind: "quiz", unit: u.id, ids: shuffle(u.quizIds), title: `Unit ${u.id} quiz`, feedback: "now" }); },
  "unit-cards": (el) => { S.cardUnit = +el.dataset.u; S.cardSession = null; go("cards"); },
  pick: (el) => pick(+el.dataset.i),
  next: nextQ,
  prev: () => { const s = S.session; if (s && s.idx > 0) { s.idx--; S.confirm = null; persistExam(); render(); } },
  jump: (el) => { const s = S.session; s.idx = +el.dataset.i; S.confirm = null; persistExam(); render(); },
  flag: () => { const s = S.session, id = s.ids[s.idx]; s.flags[id] = !s.flags[id]; persistExam(); render(); },
  submit: () => { S.confirm = "submit"; const s = S.session; if (!s.ids.some((x) => s.answers[x] === undefined)) finishSession(); else render(); },
  "submit-confirm": finishSession,
  "cancel-confirm": () => { S.confirm = null; render(); },
  quit: () => { S.session = null; history.length > 1 ? history.back() : go("home"); },
  "diag-start": () => startSession({ kind: "diag", ids: DATA.pools.diag.slice(), title: "Diagnostic test", feedback: "end" }),
  "diag-reset": () => { S.confirm = "diag-reset"; render(); },
  "diag-reset-confirm": () => { ST.diag = null; S.confirm = null; save(); render(); },
  "exam-start": (el) => { S.confirm = "start-" + el.dataset.k; render(); },
  "exam-go": (el) => {
    const k = el.dataset.k;
    ST.exams[k] = { status: "running", start: Date.now(), ids: DATA.pools[k].slice(), answers: {}, flags: {}, idx: 0 };
    save(); S.confirm = null; S.session = examSession(k); go("session");
  },
  "resume-exam": (el, ev) => { ev.preventDefault(); S.session = examSession(el.dataset.k); go("session"); },
  "exam-results": (el) => { const k = el.dataset.k, e = ST.exams[k]; S.result = { kind: "exam", title: k === "exam1" ? "Practice Exam 1" : "Practice Exam 2", ids: e.ids, answers: e.answers, g: grade(e.ids, e.answers), examKey: k }; go("result"); },
  drill: () => {
    const open = openMistakes().sort((a, b) => ST.mistakes[b].n - ST.mistakes[a].n).slice(0, 20);
    if (!open.length) { toast("No open mistakes."); return; }
    startSession({ kind: "drill", ids: shuffle(open), title: "Mistake drill", feedback: "now" });
  },
  "cards-due": () => startCards("due"),
  "cards-missed": () => startCards("missed"),
  "cards-all": () => startCards("all"),
  "cards-quit": () => { S.cardSession = null; render(); },
  flip: () => { if (S.cardSession) { S.cardSession.flipped = !S.cardSession.flipped; render(); } },
  "card-grade": (el) => gradeCard(el.dataset.ok === "1"),
  mask: () => { S.mask = !S.mask; render(); },
  print: () => window.print(),
  export: () => {
    try {
      const blob = new Blob([JSON.stringify(ST, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `wc2-progress-${isoDate()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      toast("Download started. If nothing downloads here, use Copy as text.");
    } catch (e) { toast("Downloads are blocked here. Use Copy as text."); }
  },
  "copy-export": () => {
    const box = $("#exportBox"); box.value = JSON.stringify(ST);
    const done = () => toast("Progress copied.");
    const fallback = () => { box.focus(); box.select(); toast("Text selected. Press Ctrl+C / Cmd+C to copy."); };
    try { navigator.clipboard.writeText(box.value).then(done, fallback); } catch (e) { fallback(); }
  },
  "import-text": () => importState($("#importBox").value),
  reset: () => { S.confirm = "reset"; render(); },
  "reset-confirm": () => { ST = fresh(); save(); S = { session: null, result: null, cardSession: null, confirm: null }; toast("Progress erased."); go("home"); },
};
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (el && el.tagName !== "SELECT" && el.tagName !== "INPUT" && ACT[el.dataset.act]) {
    ACT[el.dataset.act](el, ev);
    return;
  }
  if (ev.target.closest(".rail a")) closeMenu();
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.id === "deckSel") { S.cardUnit = +el.value; S.cardSession = null; render(); }
  if (el.id === "importFile" && el.files && el.files[0]) {
    const r = new FileReader(); r.onload = () => importState(String(r.result)); r.readAsText(el.files[0]);
  }
  if (["planHours", "planStart", "planDate"].includes(el.id)) {
    ST.plan = { hours: +$("#planHours").value || 0, start: $("#planStart").value, date: $("#planDate").value };
    save(); render();
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.matches("input, textarea, select") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const r = route();
  if (r === "session" && S.session) {
    if (/^[1-5]$/.test(ev.key)) { const s = S.session; if (+ev.key <= Q[s.ids[s.idx]].options.length) { ev.preventDefault(); pick(+ev.key - 1); } }
    else if (ev.key === "Enter") { ev.preventDefault(); if (S.confirm === "submit") finishSession(); else nextQ(); }
    else if (ev.key === "ArrowLeft" && S.session.feedback === "end") ACT.prev();
    else if (ev.key === "ArrowRight" && S.session.feedback === "end") nextQ();
  } else if (r === "cards" && S.cardSession && S.cardSession.queue.length) {
    if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); ACT.flip(); }
    else if (ev.key === "1" && S.cardSession.flipped) gradeCard(false);
    else if (ev.key === "2" && S.cardSession.flipped) gradeCard(true);
  } else if (ev.key === "Escape") closeMenu();
});

/* ---------- boot ---------- */
(function boot() {
  const k = runningExam();
  if (k && ST.exams[k].start + EXAM_MINUTES * 60000 <= Date.now()) {
    // Time ran out while away: submit what was answered.
    S.session = examSession(k); finishSession();
    toast("Your exam time ran out while you were away; it was submitted.");
    return;
  }
  render();
})();
</script>
</body>
</html>
