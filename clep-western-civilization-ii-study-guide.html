ial cities like Magnitogorsk rose from nothing; workers like the miner Aleksei Stakhanov were held up as heroes. To feed the cities and pay for machines, Stalin forced peasants into <strong>collective farms<\/strong> (<em>kolkhozes<\/em>). Better-off peasants, the <strong>kulaks<\/strong>, were \"liquidated as a class\": shot, deported or sent to the <strong>Gulag<\/strong> labor camps. Peasants slaughtered livestock rather than give them up. The resulting <strong>famine of 1932–1933<\/strong> killed millions, most terribly in <strong>Ukraine<\/strong> (the Holodomor).<\/p>\n<p>In the <strong>Great Purge (Great Terror, 1936–1938)<\/strong>, Stalin's secret police (the <strong>NKVD<\/strong>) arrested millions. Old Bolsheviks confessed to absurd crimes in <strong>show trials<\/strong>; most of the army's top officers were shot; roughly 700,000 people were executed in 1937–38 alone, and many more died in the Gulag. A <strong>cult of personality<\/strong> glorified Stalin, and the arts had to follow <strong>socialist realism<\/strong>, depicting heroic workers building socialism.<\/p>\n<p><strong>Totalitarianism<\/strong>, a term used for Fascist Italy, Nazi Germany and the Stalinist USSR, describes a regime that seeks <strong>total control<\/strong> of public and private life through a single party, an official ideology, mass propaganda, secret police terror and control of the economy and culture. The regimes' goals differed (communism aimed at a classless society; Nazism at racial empire), but their methods were strikingly similar.<\/p>\n<h3>The road to war: international politics in the 1930s<\/h3>\n<p>The <strong>League of Nations<\/strong> had no army and depended on the great powers, which would not act. It failed when <strong>Japan invaded Manchuria (1931)<\/strong> and when <strong>Italy invaded Ethiopia (1935)<\/strong>; its sanctions on Italy excluded oil and were soon dropped.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Hitler tears up Versailles step by step while Britain and France, fearing another war, appease him<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Rhineland (1936), Anschluss (1938), Munich and the Sudetenland (1938), Prague (March 1939)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Britain and France guarantee Poland; the Nazi-Soviet Pact frees Hitler to invade Poland (September 1, 1939)<\/div><\/div>\n<p>Hitler's steps: - <strong>1933:<\/strong> Germany leaves the League of Nations. <strong>1935:<\/strong> Hitler announces <strong>rearmament<\/strong> and conscription, openly breaking Versailles; the Saar votes to rejoin Germany. - <strong>March 1936:<\/strong> German troops <strong>remilitarize the Rhineland<\/strong>. France and Britain do nothing. - <strong>1936:<\/strong> Germany and Italy form the <strong>Rome-Berlin Axis<\/strong>; Germany and Japan sign the <strong>Anti-Comintern Pact<\/strong>. In the <strong>Spanish Civil War (1936–1939)<\/strong>, Germany and Italy aid General <strong>Francisco Franco's<\/strong> Nationalists, while the USSR aids the Republic; Britain and France stay neutral. German bombers destroy the Basque town of <strong>Guernica<\/strong> (1937), immortalized in Picasso's painting. Franco wins in 1939. - <strong>March 1938:<\/strong> the <strong>Anschluss<\/strong>, annexation of <strong>Austria<\/strong>. - <strong>September 1938:<\/strong> Hitler demands the <strong>Sudetenland<\/strong>, the German-speaking border region of Czechoslovakia. At the <strong>Munich Conference<\/strong>, British Prime Minister <strong>Neville Chamberlain<\/strong> and French premier Daladier agree to give it to Germany; Czechoslovakia is not consulted. Chamberlain claims \"<strong>peace for our time<\/strong>.\" - <strong>March 1939:<\/strong> Germany occupies the rest of <strong>Czechoslovakia<\/strong>, showing that Hitler's aims went beyond uniting Germans. Britain and France <strong>guarantee Poland<\/strong>. - <strong>August 23, 1939:<\/strong> the <strong>Nazi-Soviet Nonaggression Pact<\/strong>. Its secret protocol divided Poland and eastern Europe between Hitler and Stalin. - <strong>September 1, 1939:<\/strong> Germany invades <strong>Poland<\/strong>; Britain and France declare war on September 3.<\/p>\n<p>Why <strong>appeasement<\/strong>? Memories of 1914–1918, a belief that Versailles had been unfair to Germany, fear of communism, military unpreparedness, the Depression's strain on budgets, and the hope that Hitler's demands were limited.<\/p>","words":1999,"minutes":14,"mustKnow":["<strong>Weimar weaknesses:<\/strong> blamed for Versailles, \"stab-in-the-back\" myth, proportional representation, Article 48; 1923 Ruhr occupation and hyperinflation.","<strong>Recovery (1924–29):<\/strong> Stresemann, Dawes Plan (U.S. loans), Locarno (1925), Kellogg-Briand (1928).","<strong>Mussolini:<\/strong> Fascists (1919), Blackshirts, March on Rome (1922), Matteotti murder, corporate state, Lateran Accords (1929), Ethiopia (1935).","<strong>Fascism:<\/strong> extreme nationalism, single party, leader cult, violence, anti-communism, anti-liberalism.","<strong>Great Depression:<\/strong> 1929 crash → U.S. loans recalled → Creditanstalt (1931) → unemployment → extremism; Keynes's deficit spending.","<strong>Hitler's rise:<\/strong> Nazis 37% (July 1932), appointed chancellor Jan. 30, 1933 → Reichstag fire decree → Enabling Act (March 1933) → one-party state; Night of the Long Knives (1934).","<strong>Nazi persecution:<\/strong> Nuremberg Laws (1935), Kristallnacht (Nov. 1938).","<strong>Stalin:<\/strong> \"socialism in one country\" vs. Trotsky; Five-Year Plans (1928); collectivization, kulaks, Ukrainian famine (1932–33); Great Purge (1936–38), show trials, Gulag.","<strong>Totalitarianism:<\/strong> single party, ideology, propaganda, terror, control of economy and culture.","<strong>Road to war:<\/strong> Rhineland (1936), Spanish Civil War, Anschluss (1938), <strong>Munich<\/strong> (1938, appeasement), Prague (1939), <strong>Nazi-Soviet Pact<\/strong> (Aug. 1939), invasion of Poland (Sept. 1, 1939)."],"timeline":[{"y":"1919","label":"Weimar Constitution; Spartacist uprising; Fascist movement founded","note":"Fragile democracy; new radical right","key":false},{"y":"1922","label":"March on Rome","note":"Mussolini becomes prime minister","key":true},{"y":"1923","label":"Ruhr occupation and hyperinflation; Beer Hall Putsch","note":"Weimar's year of crisis","key":true},{"y":"1924","label":"Dawes Plan; death of Lenin","note":"Recovery in Germany; Stalin's rise begins","key":false},{"y":"1925","label":"Locarno treaties","note":"Germany accepts its western borders","key":false},{"y":"1928","label":"First Five-Year Plan","note":"Stalin's industrialization","key":true},{"y":"1929","label":"Collectivization begins; Lateran Accords","note":"War on the kulaks; Church-state peace in Italy","key":false},{"y":"1929 (Oct.)","label":"Wall Street Crash","note":"Great Depression begins","key":true},{"y":"1931","label":"Creditanstalt collapses; Japan invades Manchuria","note":"Banking crisis; League fails","key":false},{"y":"1932–1933","label":"Soviet famine","note":"Millions die, especially in Ukraine","key":false},{"y":"1933","label":"Hitler becomes chancellor; Enabling Act","note":"Nazi dictatorship","key":true},{"y":"1934","label":"Night of the Long Knives","note":"Hitler purges the SA","key":false},{"y":"1935","label":"Nuremberg Laws; Italy invades Ethiopia","note":"Persecution of Jews; League sanctions fail","key":false},{"y":"1936","label":"Rhineland remilitarized; Spanish Civil War begins","note":"Axis forms","key":true},{"y":"1936–1938","label":"Great Purge","note":"Show trials and mass executions in the USSR","key":false},{"y":"1938","label":"Anschluss; Munich Agreement; Kristallnacht","note":"Appeasement peaks","key":true},{"y":"1939 (Aug.)","label":"Nazi-Soviet Pact","note":"Hitler and Stalin divide eastern Europe","key":true}],"cards":[{"id":"u11c1","front":"Weimar Republic","back":"Germany's democratic republic, 1919–1933.","person":false},{"id":"u11c2","front":"\"Stab-in-the-back\" myth","back":"False claim that Germany lost WWI because of betrayal at home, not military defeat.","person":false},{"id":"u11c3","front":"Hyperinflation (1923)","back":"Collapse of the German mark after the Ruhr occupation; middle-class savings wiped out.","person":false},{"id":"u11c4","front":"Gustav Stresemann","back":"Weimar statesman; ended inflation, Locarno (1925), brought Germany into the League.","person":true},{"id":"u11c5","front":"Dawes Plan (1924)","back":"Reduced German reparations and arranged American loans.","person":false},{"id":"u11c6","front":"Locarno treaties (1925)","back":"Germany accepted its western borders; \"spirit of Locarno.\"","person":false},{"id":"u11c7","front":"Benito Mussolini","back":"Founder of Fascism; prime minister after the March on Rome (1922); Il Duce.","person":true},{"id":"u11c8","front":"Fascism","back":"Ultranationalist, one-party, anti-communist, anti-liberal movement glorifying the state, leader and war.","person":false},{"id":"u11c9","front":"Lateran Accords (1929)","back":"Mussolini's agreement with the pope creating Vatican City.","person":false},{"id":"u11c10","front":"Great Depression","back":"Worldwide economic collapse after the 1929 Wall Street Crash.","person":false},{"id":"u11c11","front":"Adolf Hitler","back":"Nazi leader; appointed chancellor Jan. 1933; dictator as Führer.","person":true},{"id":"u11c12","front":"Enabling Act (1933)","back":"Gave Hitler's cabinet power to make laws without the Reichstag.","person":false},{"id":"u11c13","front":"Nuremberg Laws (1935)","back":"Stripped German Jews of citizenship and banned marriage with non-Jews.","person":false},{"id":"u11c14","front":"Kristallnacht (1938)","back":"Nazi pogrom against Jewish synagogues, homes and businesses.","person":false},{"id":"u11c15","front":"Joseph Stalin","back":"Soviet dictator; \"socialism in one country,\" Five-Year Plans, collectivization, Great Purge.","person":true},{"id":"u11c16","front":"Collectivization","back":"Forcing Soviet peasants into collective farms (from 1929); kulaks destroyed; famine.","person":false},{"id":"u11c17","front":"Great Purge (1936–38)","back":"Stalin's terror: show trials, mass arrests and executions.","person":false},{"id":"u11c18","front":"Totalitarianism","back":"Regime seeking total control through one party, ideology, propaganda and terror.","person":false},{"id":"u11c19","front":"Appeasement","back":"British and French policy of conceding to Hitler's demands to avoid war.","person":false},{"id":"u11c20","front":"Munich Agreement (1938)","back":"Britain and France let Germany take the Sudetenland; \"peace for our time.\"","person":false}],"hours":1.71,"quizIds":["u11q3","u11q6","u11q10","u11q13","u11q15","u11q17","u11q20","u11q22","u11q23","u11q30","u11q32","u11q33"]},{"id":12,"title":"The Second World War and Contemporary Europe","short":"WWII & Contemporary Europe","range":"1939–present","weight":{"min":8,"max":10,"verified":true},"subtopics":["Causes and course of the Second World War","Postwar Europe and the Cold War","Decolonization","European integration","The collapse of communism and contemporary Europe"],"lesson":"<h3>The big picture<\/h3>\n<p>The <strong>Second World War (1939–1945)<\/strong> killed about <strong>60 million people<\/strong>, more than half of them civilians, and included the <strong>Holocaust<\/strong>, the Nazi murder of six million Jews. Europe emerged in ruins and was split for 45 years by the <strong>Cold War<\/strong> between the American-led West and the Soviet-dominated East. Western Europe rebuilt with American aid, created welfare states, gave up its colonial empires, and began to unite economically in what became the <strong>European Union<\/strong>. In <strong>1989–1991<\/strong> communism collapsed in Eastern Europe and the Soviet Union itself. This unit covers a lot of ground quickly; focus on turning points and on the big postwar trends.<\/p>\n<h3>The war in Europe, 1939–1941: Axis triumphs<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Hitler invades Poland after securing the Nazi-Soviet Pact<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Blitzkrieg conquers Poland (1939), then Denmark, Norway, the Low Countries and France (1940)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Britain stands alone; Hitler turns east and attacks the USSR (June 1941)<\/div><\/div>\n<p>Germany invaded <strong>Poland on September 1, 1939<\/strong>, using <strong>Blitzkrieg<\/strong> (\"lightning war\"): fast tanks and motorized infantry coordinated with dive-bombers. The Soviets invaded eastern Poland on September 17, as the secret protocol of the Nazi-Soviet Pact allowed. After a quiet winter (the \"Phoney War\"), Germany took <strong>Denmark and Norway<\/strong> (April 1940), then attacked the Netherlands, Belgium and <strong>France (May 1940)<\/strong>, sending tanks through the Ardennes forest and around France's fortified <strong>Maginot Line<\/strong>. More than 300,000 British and French troops were evacuated from <strong>Dunkirk<\/strong>. <strong>France surrendered in June 1940<\/strong>. Germany occupied the north and west, and the collaborationist <strong>Vichy regime<\/strong> of Marshal <strong>Philippe Pétain<\/strong> governed the south. General <strong>Charles de Gaulle<\/strong> led the <strong>Free French<\/strong> from London. Italy entered the war on Germany's side in June 1940.<\/p>\n<p>Britain, under Prime Minister <strong>Winston Churchill<\/strong> (from May 1940), fought on alone. In the <strong>Battle of Britain<\/strong> (summer and fall 1940), the Royal Air Force, aided by <strong>radar<\/strong>, defeated the German air force's attempt to win control of the skies before an invasion. Germany then bombed British cities in <strong>the Blitz<\/strong>. The neutral United States supplied Britain through <strong>Lend-Lease<\/strong> (1941).<\/p>\n<p>On <strong>June 22, 1941<\/strong>, Hitler launched <strong>Operation Barbarossa<\/strong>, the invasion of the <strong>Soviet Union<\/strong>, seeking <em>Lebensraum<\/em>, oil and the destruction of \"Judeo-Bolshevism.\" German armies reached the outskirts of <strong>Moscow<\/strong> and besieged <strong>Leningrad<\/strong> (a siege of nearly 900 days in which about a million civilians died), but were halted by Soviet resistance and winter in December 1941. That same month Japan attacked <strong>Pearl Harbor (December 7, 1941)<\/strong>, and Hitler declared war on the <strong>United States<\/strong>. The war was now global, and the \"Grand Alliance\" of Britain, the USSR and the U.S. outweighed the Axis in men and industry.<\/p>\n<h3>Turning points and Allied victory, 1942–1945<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Germany overextends in Russia and North Africa; the U.S. joins the war<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Stalingrad (1942–43), El Alamein (1942), Kursk (1943); Allied invasions of Italy (1943) and Normandy (1944)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Germany is crushed between the Soviet and Western armies; surrender May 8, 1945<\/div><\/div>\n<p>The decisive turning point was <strong>Stalingrad<\/strong> (August 1942–February 1943): the entire German <strong>Sixth Army<\/strong> was encircled and surrendered. At <strong>El Alamein<\/strong> (late 1942) the British under Montgomery defeated Rommel's forces in Egypt, and Anglo-American forces landed in North Africa. At <strong>Kursk<\/strong> (July 1943), the largest tank battle in history, the Soviets ended Germany's ability to attack in the east. The Allies invaded <strong>Sicily and Italy (1943)<\/strong>; Mussolini was overthrown, and Italy surrendered (though German troops fought on there). On <strong>D-Day, June 6, 1944<\/strong>, Allied forces under <strong>Dwight Eisenhower<\/strong> landed in <strong>Normandy<\/strong>, opening the long-promised <strong>second front<\/strong> in the west. Paris was liberated in August 1944. Germany's last offensive, the <strong>Battle of the Bulge<\/strong> (December 1944), failed. Soviet troops stormed <strong>Berlin<\/strong>; <strong>Hitler killed himself on April 30, 1945<\/strong>, and Germany surrendered on <strong>May 8, 1945 (V-E Day)<\/strong>. Japan surrendered in August 1945 after the United States dropped <strong>atomic bombs on Hiroshima and Nagasaki<\/strong> and the USSR declared war on it.<\/p>\n<h3>The Holocaust<\/h3>\n<p>The Nazis' racial war reached its climax in the <strong>Holocaust<\/strong>. After the invasion of the USSR, mobile killing squads (<strong>Einsatzgruppen<\/strong>) shot over a million Jews in occupied Soviet lands (at Babi Yar near Kiev, 33,000 in two days). Jews in Poland were crowded into sealed <strong>ghettos<\/strong>, where many starved; in 1943 the <strong>Warsaw Ghetto uprising<\/strong> fought back for weeks. At the <strong>Wannsee Conference (January 1942)<\/strong> senior officials coordinated the \"<strong>Final Solution<\/strong>,\" the plan to murder all of Europe's Jews. Jews from across Europe were deported by train to <strong>death camps<\/strong> in occupied Poland, such as <strong>Auschwitz-Birkenau<\/strong>, Treblinka and Sobibor, where most were murdered in gas chambers on arrival. About <strong>six million Jews<\/strong>, two-thirds of Europe's Jewish population, were killed, along with <strong>Roma<\/strong> (Gypsies), disabled people, Soviet prisoners of war, Polish elites, gay men and political opponents. After the war the <strong>Nuremberg Trials (1945–1946)<\/strong> tried Nazi leaders for <strong>crimes against humanity<\/strong>, establishing that \"following orders\" is no defense.<\/p>\n<h3>Wartime conferences and the division of Europe<\/h3>\n<p>The \"Big Three,\" <strong>Churchill, Roosevelt and Stalin<\/strong>, met at <strong>Tehran (1943)<\/strong> and <strong>Yalta (February 1945)<\/strong>. At Yalta they agreed to divide Germany into <strong>occupation zones<\/strong>, to create the <strong>United Nations<\/strong>, and that the USSR would enter the war against Japan; Stalin promised <strong>free elections<\/strong> in Eastern Europe. At <strong>Potsdam (July–August 1945)<\/strong>, with Truman and (after an election) Clement Attlee replacing Roosevelt and Churchill, they agreed on Germany's <strong>demilitarization and denazification<\/strong>, moved Poland's borders westward, and approved the expulsion of millions of Germans from eastern Europe.<\/p>\n<p>Stalin did not keep the Yalta promise. With the Red Army in control, communist parties took power across <strong>Eastern Europe<\/strong> (Poland, Hungary, Romania, Bulgaria, Czechoslovakia by 1948, East Germany), creating Soviet <strong>satellite states<\/strong>. Yugoslavia's communist leader <strong>Tito<\/strong>, who had liberated his country largely by himself, broke with Stalin in 1948 and stayed independent. In March 1946 Churchill warned that \"an <strong>iron curtain<\/strong> has descended across the continent.\"<\/p>\n<h3>The Cold War in Europe<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Soviet control of Eastern Europe and fear of communist expansion<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>U.S. containment: Truman Doctrine (1947), Marshall Plan (1947), NATO (1949)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Europe divided into two blocs; Germany split (1949); Soviets answer with Comecon and the Warsaw Pact (1955)<\/div><\/div>\n<p>The United States adopted <strong>containment<\/strong>: stopping communism from spreading. The <strong>Truman Doctrine (1947)<\/strong> gave aid to <strong>Greece and Turkey<\/strong> against communist pressure. The <strong>Marshall Plan<\/strong> (European Recovery Program, 1948–1952) gave about <strong>$13 billion<\/strong> to rebuild Western Europe's economies; Stalin forbade Eastern Europe to accept it and created <strong>Comecon<\/strong> (1949) instead. When the Western powers merged their zones of Germany and introduced a new currency, Stalin <strong>blockaded West Berlin (1948–1949)<\/strong>; the Allies supplied the city for nearly a year by the <strong>Berlin Airlift<\/strong>. In 1949 Germany split into the <strong>Federal Republic of Germany<\/strong> (West) and the <strong>German Democratic Republic<\/strong> (East). The West formed <strong>NATO (1949)<\/strong>; the Soviet bloc answered with the <strong>Warsaw Pact (1955)<\/strong>. The USSR tested an atomic bomb in 1949, beginning the nuclear arms race.<\/p>\n<p>After Stalin's death (1953), <strong>Nikita Khrushchev<\/strong> denounced Stalin's crimes in his \"<strong>Secret Speech<\/strong>\" (1956), beginning <strong>de-Stalinization<\/strong>. But the limits of change were clear: when <strong>Hungary<\/strong> tried to leave the Warsaw Pact in <strong>1956<\/strong> under Imre Nagy, Soviet tanks crushed the revolution. East Germans fled west in such numbers that in <strong>August 1961<\/strong> the East German regime built the <strong>Berlin Wall<\/strong>. The superpowers came closest to nuclear war in the <strong>Cuban Missile Crisis (1962)<\/strong>. In <strong>Czechoslovakia<\/strong> in <strong>1968<\/strong>, the reform communist <strong>Alexander Dubček<\/strong> launched the <strong>Prague Spring<\/strong>, promising \"socialism with a human face\"; Warsaw Pact armies invaded, and the <strong>Brezhnev Doctrine<\/strong> declared the Soviet right to intervene to protect socialism in any bloc country. The 1970s brought <strong>détente<\/strong>: West German Chancellor <strong>Willy Brandt's Ostpolitik<\/strong> opened relations with the East, and the <strong>Helsinki Accords (1975)<\/strong> recognized Europe's postwar borders while committing all signers, including the USSR, to respect <strong>human rights<\/strong>, a promise dissidents later used.<\/p>\n<h3>Western Europe: recovery, welfare states and change<\/h3>\n<p>Western Europe enjoyed an unprecedented boom from about 1950 to 1973. West Germany's \"<strong>economic miracle<\/strong>\" under Chancellor <strong>Konrad Adenauer<\/strong> and economics minister Ludwig Erhard rebuilt a democratic, prosperous state. <strong>Christian Democratic<\/strong> parties (Adenauer in Germany, De Gasperi in Italy) and social democrats dominated politics. Following the wartime <strong>Beveridge Report<\/strong>, Britain's Labour government under <strong>Clement Attlee<\/strong> (1945–1951) built a <strong>welfare state<\/strong>: national insurance, nationalized industries and the <strong>National Health Service (1948)<\/strong>. Across the West, governments used <strong>Keynesian<\/strong> policies and provided health care, pensions and unemployment benefits.<\/p>\n<p>In France, the weak Fourth Republic collapsed over the Algerian war, and <strong>de Gaulle<\/strong> founded the <strong>Fifth Republic (1958)<\/strong> with a strong presidency; he pursued an independent foreign policy and took France out of NATO's military command (1966). In <strong>May 1968<\/strong>, student protests and a general strike shook France, part of a wave of youth rebellion across the West. Women gained the vote in France (1944) and Italy (1946); <strong>Simone de Beauvoir's<\/strong> <em>The Second Sex<\/em> (1949) inspired the later feminist movement. <strong>Existentialist<\/strong> writers such as <strong>Jean-Paul Sartre<\/strong> and <strong>Albert Camus<\/strong> argued that in a world without given meaning, individuals must create their own through choices. Labor shortages brought <strong>guest workers<\/strong> and immigrants from Turkey, North Africa, the Caribbean and South Asia, making Western Europe more diverse. The oil shocks of 1973 and 1979 ended the boom, and in the 1980s leaders such as <strong>Margaret Thatcher<\/strong> in Britain privatized industries and cut back the state.<\/p>\n<h3>Decolonization<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>World War II exhausts the colonial powers and discredits racial empire; nationalist movements grow; both superpowers oppose old empires<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Independence for India (1947), Indonesia (1949), most of Africa (1950s–60s); wars in Indochina and Algeria<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Europe loses its global empires; Britain and France reorient toward Europe<\/div><\/div>\n<p>Britain granted independence to <strong>India and Pakistan in 1947<\/strong>, after a long nonviolent campaign led by <strong>Mohandas Gandhi<\/strong>; partition along religious lines caused mass violence and migration. The Dutch left <strong>Indonesia<\/strong> (1949). France fought to keep <strong>Indochina<\/strong> until its defeat at <strong>Dien Bien Phu (1954)<\/strong>, and then fought a brutal war in <strong>Algeria (1954–1962)<\/strong>, home to a million European settlers, until de Gaulle granted independence. In the <strong>Suez Crisis (1956)<\/strong>, Britain, France and Israel invaded Egypt after <strong>Gamal Abdel Nasser<\/strong> nationalized the Suez Canal; pressure from the <strong>United States and the USSR<\/strong> forced them to withdraw, showing that the old colonial powers could no longer act alone. <strong>Ghana<\/strong> (1957) was the first sub-Saharan colony to gain independence; seventeen African states became independent in <strong>1960<\/strong> alone, including the Belgian Congo. By the 1970s the European empires were essentially gone.<\/p>\n<h3>European integration<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Two world wars convince leaders that French-German rivalry must end<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Schuman Plan → European Coal and Steel Community (1951) → Treaty of Rome creates the European Economic Community (1957)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>A common market grows into the European Union (Maastricht, 1992) with a common currency, the euro<\/div><\/div>\n<p>French planners <strong>Jean Monnet<\/strong> and <strong>Robert Schuman<\/strong> proposed pooling French and German coal and steel, the raw materials of war. The <strong>European Coal and Steel Community (1951)<\/strong> joined France, West Germany, Italy, Belgium, the Netherlands and Luxembourg (\"the Six\"). The <strong>Treaty of Rome (1957)<\/strong> created the <strong>European Economic Community (EEC)<\/strong>, or <strong>Common Market<\/strong>, removing tariffs among members and creating a common external tariff. <strong>Britain<\/strong> at first stayed out; de Gaulle <strong>vetoed<\/strong> its applications in 1963 and 1967, fearing Britain would be an American \"Trojan horse\" and challenge French leadership, and it joined only in <strong>1973<\/strong> (with Ireland and Denmark). The <strong>Maastricht Treaty (1992)<\/strong> created the <strong>European Union<\/strong>, with common citizenship and plans for a single currency; the <strong>euro<\/strong> was introduced in 1999 (notes and coins in 2002). After 2004 the EU expanded into former communist Eastern Europe. In 2016 British voters chose to leave, and the United Kingdom left the EU in 2020 (\"Brexit\").<\/p>\n<h3>The collapse of communism, 1980–1991<\/h3>\n<p>In <strong>Poland<\/strong>, the election of a Polish pope, <strong>John Paul II (1978)<\/strong>, inspired national pride, and in <strong>1980<\/strong> shipyard workers in Gdańsk led by <strong>Lech Wałęsa<\/strong> founded <strong>Solidarity<\/strong>, the first independent trade union in the Soviet bloc. The regime imposed martial law (1981), but Solidarity survived underground.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>A stagnant Soviet economy and a costly arms race and war in Afghanistan<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Gorbachev's glasnost and perestroika; he abandons the Brezhnev Doctrine<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Peaceful revolutions in Eastern Europe (1989), German reunification (1990), the end of the USSR (1991)<\/div><\/div>\n<p><strong>Mikhail Gorbachev<\/strong> became Soviet leader in <strong>1985<\/strong>. He introduced <strong>glasnost<\/strong> (\"openness,\" freer speech and press) and <strong>perestroika<\/strong> (\"restructuring\" the economy), and signed arms-reduction treaties with the U.S. Crucially, he made clear that the USSR would <strong>not use force<\/strong> to keep Eastern European regimes in power, abandoning the Brezhnev Doctrine. In <strong>1989<\/strong> the dominoes fell: Poland held partly free elections, which Solidarity swept; Hungary opened its border with Austria; on <strong>November 9, 1989<\/strong>, the <strong>Berlin Wall<\/strong> was opened; Czechoslovakia's peaceful <strong>Velvet Revolution<\/strong> made the dissident playwright <strong>Václav Havel<\/strong> president; and in Romania, the dictator Nicolae Ceaușescu was overthrown and executed. <strong>Germany reunified on October 3, 1990<\/strong>. In <strong>August 1991<\/strong> communist hardliners tried a <strong>coup<\/strong> against Gorbachev; it failed when crowds led by Boris <strong>Yeltsin<\/strong> resisted. The Soviet republics declared independence, and the <strong>USSR dissolved in December 1991<\/strong>.<\/p>\n<p>The end of the Cold War was not peaceful everywhere. <strong>Yugoslavia<\/strong> broke apart in wars (1991–1999) marked by \"ethnic cleansing,\" including the massacre of about 8,000 Bosnian Muslim men and boys at <strong>Srebrenica (1995)<\/strong>; NATO intervened in Bosnia and later Kosovo. In the twenty-first century, Europe faced the 2008 financial crisis and the eurozone debt crisis, large-scale migration, and a renewed confrontation with Russia under <strong>Vladimir Putin<\/strong>, which annexed Crimea (2014) and launched a full-scale invasion of <strong>Ukraine (2022)<\/strong>.<\/p>","words":2236,"minutes":16,"mustKnow":["<strong>Blitzkrieg:<\/strong> Poland (1939), France falls (June 1940) → Vichy (Pétain); Free French (de Gaulle); Dunkirk evacuation.","<strong>Battle of Britain (1940):<\/strong> RAF and radar stop the invasion plan; Churchill.","<strong>Operation Barbarossa (June 22, 1941):<\/strong> invasion of the USSR; Pearl Harbor (Dec. 1941) brings the U.S. in.","<strong>Turning points:<\/strong> Stalingrad (1942–43), El Alamein (1942), Kursk (1943); D-Day (June 6, 1944); V-E Day (May 8, 1945).","<strong>Holocaust:<\/strong> Einsatzgruppen, ghettos, Wannsee (1942) \"Final Solution,\" death camps (Auschwitz); 6 million Jews murdered; Nuremberg Trials.","<strong>Yalta and Potsdam (1945):<\/strong> occupation zones, UN; Stalin's broken promise of free elections → Soviet satellites; \"iron curtain.\"","<strong>Containment:<\/strong> Truman Doctrine (1947), Marshall Plan, Berlin Airlift (1948–49), NATO (1949) vs. Warsaw Pact (1955).","<strong>Soviet bloc crises:<\/strong> Hungary (1956), Berlin Wall (1961), Prague Spring (1968) → Brezhnev Doctrine; détente, Ostpolitik, Helsinki (1975).","<strong>Decolonization:<\/strong> India (1947), Dien Bien Phu (1954), Suez (1956), Algeria (1962), Ghana (1957), \"Year of Africa\" (1960).","<strong>Integration:<\/strong> ECSC (1951) → Treaty of Rome/EEC (1957) → Britain joins (1973) → Maastricht/EU (1992) → euro.","<strong>1989–91:<\/strong> Solidarity, Gorbachev (glasnost, perestroika), Berlin Wall falls (Nov. 9, 1989), German reunification (1990), USSR dissolves (Dec. 1991)."],"timeline":[{"y":"1939 (Sept. 1)","label":"Germany invades Poland","note":"World War II begins in Europe","key":true},{"y":"1940 (June)","label":"Fall of France","note":"Vichy regime; Britain fights alone","key":true},{"y":"1940","label":"Battle of Britain","note":"RAF defeats the Luftwaffe","key":false},{"y":"1941 (June 22)","label":"Operation Barbarossa","note":"Germany invades the USSR","key":true},{"y":"1941 (Dec.)","label":"Pearl Harbor; Germany declares war on U.S.","note":"The war becomes global","key":false},{"y":"1942 (Jan.)","label":"Wannsee Conference","note":"\"Final Solution\" coordinated","key":false},{"y":"1942–1943","label":"Stalingrad","note":"Turning point on the Eastern Front","key":true},{"y":"1944 (June 6)","label":"D-Day","note":"Allied invasion of Normandy","key":true},{"y":"1945","label":"Yalta; V-E Day (May 8); Potsdam; atomic bombs; UN founded","note":"War ends; postwar order","key":true},{"y":"1946","label":"Churchill's \"iron curtain\" speech","note":"Cold War division named","key":false},{"y":"1947","label":"Truman Doctrine; Marshall Plan; India's independence","note":"Containment; decolonization","key":true},{"y":"1948–1949","label":"Berlin Blockade and Airlift","note":"First Cold War crisis","key":false},{"y":"1949","label":"NATO; two German states","note":"Bloc division","key":true},{"y":"1951","label":"European Coal and Steel Community","note":"Start of integration","key":false},{"y":"1955","label":"Warsaw Pact","note":"Soviet military alliance","key":false},{"y":"1956","label":"Hungarian Revolution; Suez Crisis; Khrushchev's Secret Speech","note":"Limits of change","key":false},{"y":"1957","label":"Treaty of Rome","note":"European Economic Community","key":true},{"y":"1961","label":"Berlin Wall","note":"Division made concrete","key":true},{"y":"1962","label":"Algerian independence; Cuban Missile Crisis","note":"End of French Algeria","key":false},{"y":"1968","label":"Prague Spring; May 1968 in France","note":"Reform crushed; student revolt","key":false},{"y":"1973","label":"Britain joins the EEC","note":"Integration widens","key":false},{"y":"1975","label":"Helsinki Accords","note":"Borders and human rights","key":false},{"y":"1980","label":"Solidarity founded","note":"Polish workers' union","key":false},{"y":"1985","label":"Gorbachev comes to power","note":"Glasnost and perestroika","key":false},{"y":"1989 (Nov. 9)","label":"Fall of the Berlin Wall","note":"Revolutions of 1989","key":true},{"y":"1990","label":"German reunification","note":"Oct. 3, 1990","key":false},{"y":"1991 (Dec.)","label":"Dissolution of the USSR","note":"End of the Cold War","key":true},{"y":"1992","label":"Maastricht Treaty","note":"European Union created","key":false}],"cards":[{"id":"u12c1","front":"Blitzkrieg","back":"\"Lightning war\": tanks, motorized infantry and aircraft striking together.","person":false},{"id":"u12c2","front":"Vichy France","back":"Collaborationist French regime under Marshal Pétain after the 1940 defeat.","person":false},{"id":"u12c3","front":"Winston Churchill","back":"British prime minister from 1940; led Britain's resistance; \"iron curtain\" speech (1946).","person":true},{"id":"u12c4","front":"Battle of Britain (1940)","back":"RAF's air victory over the Luftwaffe that prevented a German invasion.","person":false},{"id":"u12c5","front":"Operation Barbarossa (1941)","back":"German invasion of the Soviet Union, June 22, 1941.","person":false},{"id":"u12c6","front":"Battle of Stalingrad (1942–43)","back":"Soviet encirclement and destruction of the German Sixth Army; key turning point.","person":false},{"id":"u12c7","front":"D-Day (June 6, 1944)","back":"Allied landings in Normandy opening the Western second front.","person":false},{"id":"u12c8","front":"Holocaust","back":"Nazi genocide of six million Jews and millions of others.","person":false},{"id":"u12c9","front":"Wannsee Conference (1942)","back":"Meeting of Nazi officials to coordinate the \"Final Solution.\"","person":false},{"id":"u12c10","front":"Nuremberg Trials (1945–46)","back":"Trials of Nazi leaders for war crimes and crimes against humanity.","person":false},{"id":"u12c11","front":"Yalta Conference (1945)","back":"Big Three agreed on German occupation zones and the UN; Stalin promised free elections.","person":false},{"id":"u12c12","front":"Iron Curtain","back":"Churchill's term (1946) for the division between Soviet-controlled East and the West.","person":false},{"id":"u12c13","front":"Containment","back":"U.S. Cold War policy of preventing communist expansion.","person":false},{"id":"u12c14","front":"Marshall Plan","back":"U.S. aid (about $13 billion, 1948–52) to rebuild Western Europe.","person":false},{"id":"u12c15","front":"Berlin Airlift (1948–49)","back":"Western supply of West Berlin by air during the Soviet blockade.","person":false},{"id":"u12c16","front":"NATO (1949)","back":"Western military alliance; answered by the Warsaw Pact (1955).","person":false},{"id":"u12c17","front":"Prague Spring (1968)","back":"Dubček's reform communism, crushed by a Warsaw Pact invasion.","person":false},{"id":"u12c18","front":"Brezhnev Doctrine","back":"Soviet claim of a right to intervene in any socialist country (1968).","person":false},{"id":"u12c19","front":"Treaty of Rome (1957)","back":"Created the European Economic Community (Common Market).","person":false},{"id":"u12c20","front":"Decolonization","back":"Independence of European colonies after 1945 (India 1947, Algeria 1962, etc.).","person":false},{"id":"u12c21","front":"Mikhail Gorbachev","back":"Soviet leader (1985–91); glasnost, perestroika; let Eastern Europe go free.","person":true},{"id":"u12c22","front":"Solidarity","back":"Independent Polish trade union (1980) led by Lech Wałęsa.","person":false}],"hours":1.92,"quizIds":["u12q2","u12q5","u12q6","u12q7","u12q18","u12q20","u12q21","u12q25","u12q26","u12q29","u12q33","u12q36","u12q37"]}],"questions":{"u1q1":{"id":"u1q1","unit":1,"diff":"e","pool":"quiz","stem":"<p>Which document, accepted by William and Mary in 1689, guaranteed that Parliament must consent to taxation and to a peacetime standing army?<\/p>","options":["The Petition of Right","The Act of Union","The Edict of Nantes","The Test Act","The Bill of Rights"],"why":["The Petition of Right dates from 1628, under Charles I, and he ignored it.","The Act of Union (1707) joined England and Scotland; it did not set out Parliament's taxing power.","The Edict of Nantes (1598) gave French Protestants toleration; it has nothing to do with Parliament.","The Test Act (1673) barred non-Anglicans from office; it did not define Parliament's powers over taxes.","The 1689 Bill of Rights made these parliamentary powers law as the condition of William and Mary's accession."],"answer":4},"u1q2":{"id":"u1q2","unit":1,"diff":"e","pool":"exam1","stem":"<p>The Peace of Westphalia (1648) did which of the following?<\/p>","options":["Outlawed Calvinism within the Holy Roman Empire","Restored the Stuart monarchy in England","Recognized the independence of the Dutch Republic","Ended the War of the Spanish Succession","Unified the German states under the Habsburg emperor"],"why":["Westphalia added Calvinism to the faiths a ruler could legally adopt.","The Stuart Restoration happened in 1660 and was an English domestic event.","Westphalia formally recognized the United Provinces' independence from Spain, along with Swiss independence.","That war ended with the Treaty of Utrecht in 1713.","It did the opposite: German princes became effectively sovereign and the emperor was weakened."],"answer":2},"u1q3":{"id":"u1q3","unit":1,"diff":"e","pool":"exam2","stem":"<p>Louis XIV's main purpose in requiring great nobles to live at Versailles was to<\/p>","options":["convert them from Protestantism to Catholicism","train them as officers for the new French navy Colbert was building","collect the direct taxes that the great nobles owed the royal treasury","prepare them to serve in the Estates-General","keep them under royal watch and away from their power bases"],"why":["The great nobles were overwhelmingly Catholic already; Versailles was about political control.","Versailles was a court, not a naval academy.","French nobles were largely exempt from direct taxes; Versailles was not a tax office.","Louis never called the Estates-General.","Busy competing for court honors, nobles could not raise private armies or lead revolts like the Fronde."],"answer":4},"u1q4":{"id":"u1q4","unit":1,"diff":"e","pool":"exam2","stem":"<p>Which ruler is most closely associated with founding St. Petersburg and forcing Russian nobles to adopt Western dress?<\/p>","options":["Alexander I","Peter the Great","Ivan the Terrible","Michael Romanov","Catherine the Great"],"why":["Alexander I ruled 1801–1825 and is known for fighting Napoleon.","Peter founded St. Petersburg in 1703 and imposed beard taxes and Western clothing on the elite.","Ivan IV ruled in the 1500s, long before St. Petersburg existed.","Michael founded the Romanov dynasty in 1613; he did not westernize Russia.","Catherine (r. 1762–1796) came later and is linked to enlightened despotism and the partitions of Poland."],"answer":1},"u1q5":{"id":"u1q5","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Glorious Revolution of 1688 replaced James II with<\/p>","options":["William III and Mary II","George I of Hanover","Charles II, his older brother","Oliver Cromwell","his daughter Anne, ruling alone"],"why":["Parliament's leaders invited the Protestant William and Mary, James's daughter, to take the throne.","George I came to the throne in 1714 under the Act of Settlement.","Charles II was restored in 1660 and died in 1685; James II was his successor.","Cromwell died in 1658, thirty years earlier.","Anne followed William in 1702; she did not replace James II."],"answer":0},"u1q6":{"id":"u1q6","unit":1,"diff":"e","pool":"exam1","stem":"<p>In the Dutch Republic of the 1600s, political power rested chiefly with<\/p>","options":["an absolute monarch ruling by divine right","the Spanish viceroy in Brussels","a parliament elected by all adult men","the Catholic bishops of the Netherlands","merchant oligarchs called regents"],"why":["The Dutch Republic had no king; it was a federal republic.","The Dutch had broken away from Spain; Spanish officials governed only the southern (Spanish) Netherlands.","There was no democratic suffrage; power was oligarchic.","The Republic was officially Calvinist; Catholic bishops held no political power.","The regents dominated provincial estates and town councils; the federation's center was weak."],"answer":4},"u1q7":{"id":"u1q7","unit":1,"diff":"e","pool":"diag","stem":"<p>Which war ended with the Treaty of Utrecht in 1713?<\/p>","options":["The Seven Years' War","The English Civil War","The War of the Spanish Succession","The Thirty Years' War in Germany","The Great Northern War in the Baltic"],"why":["The Seven Years' War ended in 1763 with the Treaty of Paris.","The English Civil War was a domestic conflict that ended in 1649.","Utrecht (1713, with Rastatt in 1714) settled who would rule Spain.","The Thirty Years' War ended at Westphalia in 1648.","That war ended with the Treaty of Nystad in 1721."],"answer":2},"u1q8":{"id":"u1q8","unit":1,"diff":"e","pool":"quiz","stem":"<p>The Prussian Junkers were<\/p>","options":["elected members of the Prussian parliament","foreign mercenaries hired by the Great Elector for his army","nobles who served as officers and ruled their serfs","Protestant refugees who fled France after 1685","Prussian merchants who financed the royal army"],"why":["Prussia had no powerful elected parliament in this period.","Junkers were native Prussian nobles, not foreign hires.","This bargain with the Hohenzollerns was the social basis of the Prussian state.","Huguenot refugees settled in Prussia, but they were not called Junkers.","Prussia's merchant class was small; Junkers were rural nobles."],"answer":2},"u1q9":{"id":"u1q9","unit":1,"diff":"e","pool":"exam1","stem":"<p>Mercantilism, as practiced by Colbert, held that a nation should<\/p>","options":["let private markets set all prices without state interference","abolish colonies because they drain the home economy","export more than it imports to pile up gold and silver","collectivize land and industry under worker control","remove all tariffs and allow free trade"],"why":["That is laissez-faire, the opposite of Colbert's state-directed economy.","Mercantilists valued colonies as sources of raw materials and markets.","Mercantilists measured wealth in bullion and sought a favorable balance of trade.","That describes socialism, a nineteenth-century idea.","Free trade is Adam Smith's later answer to mercantilism."],"answer":2},"u1q10":{"id":"u1q10","unit":1,"diff":"e","pool":"quiz","stem":"<p>What happened to King Charles I of England in 1649?<\/p>","options":["He signed the Bill of Rights and became a constitutional monarch","He dissolved Parliament and began eleven years of personal rule","He was tried and executed by order of Parliament's leaders","He was deposed in a bloodless revolution","He fled to France and returned as king in 1660"],"why":["The Bill of Rights was accepted by William and Mary in 1689.","His personal rule ran from 1629 to 1640, not 1649.","His beheading in January 1649 led to the Commonwealth.","That describes James II in 1688.","Charles II, his son, returned in 1660; Charles I was dead by then."],"answer":2},"u1q11":{"id":"u1q11","unit":1,"diff":"m","pool":"quiz","stem":"<p>Louis XIV's revocation of the Edict of Nantes in 1685 had which of the following consequences?<\/p>","options":["The pope excommunicated Louis XIV","France's economy immediately surpassed the Dutch Republic's","The Fronde broke out against royal authority","France became officially Protestant","Skilled Huguenots emigrated to France's rivals"],"why":["The revocation pleased many Catholics; there was no excommunication.","Losing skilled workers hurt France's economy.","The Fronde (1648–53) happened decades earlier.","The revocation made Protestant worship illegal; France stayed Catholic.","Around 200,000 Huguenots fled to the Dutch Republic, England, Prussia and America, taking skills and capital with them."],"answer":4},"u1q12":{"id":"u1q12","unit":1,"diff":"m","pool":"diag","stem":"<p>Which pairing of a state and its form of government around 1700 is correct?<\/p>","options":["Dutch Republic: absolute monarchy under the House of Orange","Russia: elected monarchy chosen by the nobility","England: constitutional monarchy; Parliament controls taxes","Prussia: merchant republic run by town councils","France: limited monarchy under a strong Estates-General"],"why":["The Orange stadtholders were powerful but the Republic had no king.","Russia was an autocracy under hereditary tsars.","After 1689 the English crown could not tax without Parliament.","Prussia was a militarized absolute monarchy.","The Estates-General did not meet between 1614 and 1789; France was absolutist."],"answer":2},"u1q13":{"id":"u1q13","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which of these events in Stuart England, France and Russia came FIRST?<\/p>","options":["The founding of St. Petersburg","The Treaty of Utrecht","The revocation of the Edict of Nantes","The beheading of Charles I","The Glorious Revolution"],"why":["The founding of St. Petersburg dates from 1703, later than 1649.","The Treaty of Utrecht dates from 1713, later than 1649.","The revocation of the Edict of Nantes dates from 1685, later than 1649.","The beheading of Charles I dates from 1649, the earliest of the five.","The Glorious Revolution dates from 1688, later than 1649."],"answer":3},"u1q14":{"id":"u1q14","unit":1,"diff":"m","pool":"exam2","stem":"<blockquote>\"The royal throne is not the throne of a man, but the throne of God himself... The person of the king is sacred, and to attack him in any way is sacrilege.\"<\/blockquote><p>The passage above best expresses the ideas of<\/p>","options":["Bossuet, defending divine-right absolutism","the Levellers, demanding wider suffrage","Oliver Cromwell, justifying the Protectorate","John Locke, defending the Glorious Revolution","Spinoza, arguing for religious toleration"],"why":["Bossuet, tutor to Louis XIV's son, argued that kings are God's ministers on earth.","The Levellers were radicals who wanted to limit authority, not sanctify kings.","Cromwell had helped execute a king; he did not call kings sacred.","Locke argued that power comes from the consent of the governed, not from God.","Spinoza was a rationalist critic of religious authority."],"answer":0},"u1q15":{"id":"u1q15","unit":1,"diff":"m","pool":"quiz","stem":"<p>Peter the Great's Table of Ranks (1722) was designed to<\/p>","options":["rank Orthodox clergy above the nobility","establish an elected Russian parliament","free the serfs and give them land","tie noble rank to service to the state","list the provinces that owed tribute to Sweden"],"why":["Peter subordinated the Church to the state through the Holy Synod.","Russia had no parliament until the Duma of 1906.","Serfdom grew harsher under Peter; emancipation came in 1861.","Rank came from service in the army, navy or bureaucracy, so the nobility worked for the tsar.","Russia fought Sweden; it did not pay it tribute."],"answer":3},"u1q16":{"id":"u1q16","unit":1,"diff":"m","pool":"exam2","stem":"<p>The Treaty of Utrecht (1713) is significant because it<\/p>","options":["forced Britain to return Gibraltar to Spain","placed a Habsburg prince on the Spanish throne","created the German Confederation","kept the French and Spanish crowns apart","ended Dutch independence"],"why":["Britain gained Gibraltar at Utrecht.","The Bourbon Philip V, Louis XIV's grandson, kept Spain.","The German Confederation was created by the Congress of Vienna in 1815.","Philip V kept Spain but could never unite it with France, preventing one dominant power.","Dutch independence was not at issue; the Republic was on the winning side."],"answer":3},"u1q17":{"id":"u1q17","unit":1,"diff":"m","pool":"exam1","stem":"<p>Which group was most likely to support Parliament against Charles I in the English Civil War?<\/p>","options":["High-church Anglican bishops","Puritans and London merchants","Irish Catholics","The great landed nobility of the north and west","Jesuit missionaries"],"why":["Bishops generally backed the king's religious policies.","Parliament's strongholds were the Puritans, the commercial classes and London.","Irish Catholics were hostile to the Puritan Parliament.","Many northern and western nobles were Royalists.","Jesuits were banned in England and opposed Puritan Parliament."],"answer":1},"u1q18":{"id":"u1q18","unit":1,"diff":"m","pool":"quiz","stem":"<p>The 1683 Ottoman siege of Vienna is important because its failure<\/p>","options":["ended Habsburg rule in Austria","made the Ottoman Empire a member of the Holy Roman Empire","began the Habsburg reconquest of Hungary","led directly to the unification of Germany","caused the Thirty Years' War"],"why":["The Habsburgs emerged stronger.","The Ottomans were never part of the Holy Roman Empire.","After the siege was broken, Austria pushed back the Ottomans and gained Hungary at Karlowitz.","German unification came in 1871.","That war began in 1618 and ended in 1648."],"answer":2},"u1q19":{"id":"u1q19","unit":1,"diff":"m","pool":"quiz","stem":"<p>A historian argues that seventeenth-century rulers became absolute mainly because war had grown too expensive for traditional revenue. Which evidence would best support this?<\/p>","options":["The Great Elector built a tax bureaucracy to fund his army","Rembrandt painted group portraits of Amsterdam militia companies","Peter the Great required nobles to shave their beards","The English Bill of Rights guaranteed free speech in Parliament","The Peace of Westphalia tolerated Calvinism"],"why":["The General War Commissariat shows military needs driving state-building.","This is cultural evidence, not evidence about state finance.","Beard rules concern cultural westernization, not war finance.","This shows limits on a king, not the fiscal roots of absolutism.","Religious settlement does not show that war costs drove absolutism."],"answer":0},"u1q20":{"id":"u1q20","unit":1,"diff":"m","pool":"quiz","stem":"<p>The Dutch Republic in the seventeenth century was notable for<\/p>","options":["being governed directly from Madrid","religious toleration that drew refugees","its rejection of overseas trade and colonies","strict censorship that drove printers abroad","a powerful landed nobility that dominated trade"],"why":["Independence from Spain was recognized in 1648.","Its relative tolerance drew skilled refugees and dissenting thinkers such as Spinoza.","The VOC made it a leading colonial and trading power.","The Republic was Europe's freest publishing center.","Trade was dominated by urban merchants, not landed nobles."],"answer":1},"u1q21":{"id":"u1q21","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which statement best describes Oliver Cromwell's rule as Lord Protector (1653–1658)?<\/p>","options":["It made England an absolute monarchy under divine right","It established the first fully democratic government in Europe","It was a republic in name but military rule in practice","It restored the Catholic Church in England","It ended when Parliament invited William of Orange to rule"],"why":["Cromwell was not a king, and divine right was the Stuart theory.","Cromwell rejected the Levellers' demand for wide suffrage.","Cromwell relied on the army and dismissed parliaments that opposed him.","Cromwell was a Puritan and hostile to Catholicism.","That happened to James II in 1688."],"answer":2},"u1q22":{"id":"u1q22","unit":1,"diff":"m","pool":"exam2","stem":"<p>Frederick William, the Great Elector of Brandenburg-Prussia, is best known for<\/p>","options":["granting his subjects a liberal written constitution","unifying Germany through \"blood and iron\"","building a standing army and a tax system to fund it","defeating Napoleon's army at the Battle of Leipzig","becoming the first Holy Roman Emperor from Prussia"],"why":["He ruled as an absolutist.","That was Bismarck in the 1860s.","He laid the foundations of Prussian militarism and administration.","The Battle of Leipzig took place in 1813, long after his death in 1688.","No Prussian ruler was Holy Roman Emperor."],"answer":2},"u1q23":{"id":"u1q23","unit":1,"diff":"m","pool":"exam1","stem":"<p>The Battle of Poltava (1709) was decisive because it<\/p>","options":["restored the Stuarts to the English throne","broke Swedish power in the Baltic","forced Louis XIV to accept the Treaty of Utrecht","made Prussia a kingdom","ended the Ottoman threat to Vienna"],"why":["The Restoration was in 1660.","Peter's victory over Charles XII led to Russian gains confirmed at Nystad (1721).","Utrecht followed battles in western Europe, not Poltava.","Prussia became a kingdom in 1701 by agreement with the emperor.","That was the relief of Vienna in 1683."],"answer":1},"u1q24":{"id":"u1q24","unit":1,"diff":"m","pool":"exam1","stem":"<p>\"No taxation without the consent of Parliament\" was a central issue in which conflict?<\/p>","options":["The Dutch revolt against Spanish taxes","The Great Northern War","The Fronde in France","The War of the Spanish Succession","The Stuart kings' quarrel with Parliament"],"why":["Taxation was an issue, but \"Parliament\" refers to England.","That war was between Russia and Sweden over the Baltic.","The Fronde concerned French nobles and courts; there was no Parliament in the English sense.","That war was about who would inherit the Spanish throne.","Charles I's attempts to tax without Parliament helped trigger the war in 1642."],"answer":4},"u1q25":{"id":"u1q25","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which of the following best explains why England developed a constitutional monarchy while France developed absolutism?<\/p>","options":["France had already experienced a successful revolution","English kings needed Parliament to approve taxes; French kings did not","English kings, unlike French kings, rejected the theory of divine right","France had no powerful nobility able to resist the king's demands","England was Catholic while France was Protestant"],"why":["France's revolution came in 1789.","Control of revenue determined who held power; the French crown never had to call the Estates-General.","James I and Charles I strongly believed in divine right.","France had a powerful nobility; Louis XIV had to tame it.","The reverse is closer to the truth: England was Protestant and France Catholic."],"answer":1},"u1q26":{"id":"u1q26","unit":1,"diff":"h","pool":"exam2","stem":"<p>Which development is MOST similar to Louis XIV's use of intendants?<\/p>","options":["England's Bill of Rights limiting the crown","The Peace of Westphalia's grant of sovereignty to German princes","The Dutch reliance on town councils run by regents","Peter the Great's service bureaucracy loyal to the tsar","The Levellers' call for wider suffrage"],"why":["That limited royal power rather than extending it.","That decentralized authority within the Empire.","That decentralized merchant government is the opposite of royal centralization.","Both rulers bypassed traditional nobles by relying on officials who owed everything to the crown.","That was a popular democratic demand, not a royal administrative tool."],"answer":3},"u1q27":{"id":"u1q27","unit":1,"diff":"h","pool":"exam1","stem":"<p>A French Huguenot silk weaver who left France in 1686 and settled in Berlin would most likely have been<\/p>","options":["drafted into the Ottoman army","forced to return to France under the Treaty of Utrecht","expelled immediately because he was a Catholic","required to convert to Russian Orthodoxy","welcomed, since Prussia invited Huguenot refugees"],"why":["Berlin was not Ottoman territory.","Utrecht contained no such provision.","Huguenots were Protestants, and Prussia's rulers were Protestant.","Berlin was in Brandenburg-Prussia, not Russia.","His Edict of Potsdam (1685) invited Huguenots, who boosted Berlin's crafts."],"answer":4},"u1q28":{"id":"u1q28","unit":1,"diff":"h","pool":"exam2","stem":"<p>Which of the following was a provision of the Treaty of Utrecht?<\/p>","options":["Austria received Gibraltar and Minorca","Russia received a Baltic coastline","Philip V was required to give Spain to the Habsburgs","France gained Nova Scotia from Britain","Britain received the asiento slave-trading contract"],"why":["Britain, not Austria, received Gibraltar and Minorca.","Russia's Baltic gains came at Nystad in 1721.","Philip V kept Spain.","France ceded Acadia (Nova Scotia) to Britain.","The asiento was one of Britain's chief commercial gains at Utrecht."],"answer":4},"u1q29":{"id":"u1q29","unit":1,"diff":"h","pool":"quiz","stem":"<p>Locke's Two Treatises of Government (1690) is closely linked to the Glorious Revolution because it<\/p>","options":["urged England to adopt Catholicism","defended the divine right of the Stuart dynasty","argued for an all-powerful sovereign to prevent civil war","argued that a ruler who violates rights may be replaced","called for the abolition of private property"],"why":["Locke supported toleration for Protestants and opposed a Catholic monarch.","That was the position Locke attacked (Filmer's Patriarcha).","That is Hobbes's argument in Leviathan (1651).","Locke's case for government by consent justified removing James II.","Locke made property a natural right."],"answer":3},"u1q30":{"id":"u1q30","unit":1,"diff":"h","pool":"exam1","stem":"<p>Which statement about the Habsburg monarchy after 1648 is most accurate?<\/p>","options":["It was a multiethnic realm held together by the dynasty","It adopted a constitutional monarchy like England's","It controlled the German states more tightly after Westphalia","It was a centralized nation-state with a single language","It lost Hungary to the Ottomans in 1699"],"why":["Austria, Bohemia and Hungary kept separate laws and estates under one ruler.","The Habsburgs ruled as absolutists where they could.","Westphalia weakened imperial control over the German princes.","The Habsburg lands were linguistically diverse and decentralized.","At Karlowitz (1699) the Ottomans ceded Hungary to Austria."],"answer":0},"u1q31":{"id":"u1q31","unit":1,"diff":"m","pool":"exam1","stem":"<p>The phrase \"one king, one law, one faith\" best summarizes the goals of<\/p>","options":["the Levellers","John Locke","William of Orange","Louis XIV","the Dutch regents"],"why":["The Levellers wanted wider rights, not royal uniformity.","Locke argued for limited government and toleration.","William ruled England under the Bill of Rights and supported toleration for Protestant dissenters.","His centralization and the 1685 revocation of the Edict of Nantes aimed at uniformity under the crown.","The regents governed a decentralized, tolerant republic."],"answer":3},"u1q32":{"id":"u1q32","unit":1,"diff":"e","pool":"exam2","stem":"<p>Who won the English Civil War?<\/p>","options":["The Scots under James II","The Irish Catholic Confederation of Kilkenny","The Parliamentarians, led by Oliver Cromwell","William of Orange's invading Dutch army","The Royalists under Charles I"],"why":["James II reigned in 1685–88; he did not lead the Scots in the 1640s.","The Irish were defeated by Cromwell in 1649–50.","Cromwell's New Model Army defeated the Royalists by 1646 and again in 1648.","William's landing came in 1688, decades later.","Charles I lost and was executed in 1649."],"answer":2},"u1q33":{"id":"u1q33","unit":1,"diff":"m","pool":"exam2","stem":"<p>Which feature distinguished the English Restoration settlement of 1660 from the monarchy before 1640?<\/p>","options":["Parliament kept control of taxation","Cromwell's Protectorate continued alongside the king","Divine right was written into law","Catholicism became the state religion","The monarch was now elected by Parliament"],"why":["The monarchy returned, but the crown could no longer rule and tax without Parliament.","The Protectorate ended in 1659.","The settlement limited royal power in practice.","The Church of England was restored, and the Test Act excluded Catholics from office.","The crown remained hereditary; Charles II was the son of Charles I."],"answer":0},"u1q34":{"id":"u1q34","unit":1,"diff":"h","pool":"quiz","stem":"<p>Which comparison of Peter the Great and Louis XIV is most accurate?<\/p>","options":["Both brought nobles and the church under tighter state control","Both lost their thrones in revolutions","Both ruled through powerful elected parliaments","Both revoked edicts of religious toleration for Protestants","Both modeled their reforms on the Dutch republican constitution"],"why":["Louis used Versailles and Gallican control; Peter used service ranks and the Holy Synod.","Both died as reigning monarchs.","Neither shared power with a parliament.","Only Louis did this, in 1685.","Peter admired Dutch shipbuilding, not republicanism; Louis invaded the Dutch."],"answer":0},"u2q1":{"id":"u2q1","unit":2,"diff":"e","pool":"quiz","stem":"<p>In the eighteenth century, the most profitable European colonies in the Americas were the<\/p>","options":["farming colonies of New England","fur-trading posts of Canada","tea plantations of Virginia","sugar islands of the Caribbean","gold mines of Louisiana"],"why":["New England did not produce a major export crop for Europe.","The fur trade was valuable but far smaller than sugar.","Virginia grew tobacco; tea came from China.","Islands such as Saint-Domingue and Jamaica produced sugar that was worth more than any other colonial export.","Louisiana had no gold mines; John Law's promises of wealth there were a fantasy."],"answer":3},"u2q2":{"id":"u2q2","unit":2,"diff":"e","pool":"exam2","stem":"<p>Robert Walpole is significant in British history as<\/p>","options":["the leader of the Puritan army in the English Civil War","Britain's first prime minister in practice","the general who captured Quebec from the French","the founder of the Bank of England","the king who replaced James II"],"why":["That was Oliver Cromwell.","Walpole led the government from 1721 to 1742 and set the pattern of cabinet rule.","James Wolfe led the attack on Quebec in 1759.","The Bank of England was founded in 1694.","That was William III."],"answer":1},"u2q3":{"id":"u2q3","unit":2,"diff":"e","pool":"exam1","stem":"<p>The Diplomatic Revolution of 1756 refers to<\/p>","options":["Austria allying with France and Britain with Prussia","the union of England and Scotland","Russia's alliance with Napoleon at Tilsit","France's alliance with the rebel American colonies against Britain","the overthrow of James II in favor of William and Mary"],"why":["The switch of partners set the sides for the Seven Years' War.","That was the Act of Union in 1707.","Tilsit was in 1807.","That came in 1778 during the American Revolution.","That was the Glorious Revolution of 1688."],"answer":0},"u2q4":{"id":"u2q4","unit":2,"diff":"e","pool":"exam2","stem":"<p>Which treaty gave Britain control of Canada?<\/p>","options":["The Treaty of Paris (1763)","The Treaty of Aix-la-Chapelle (1748)","The Peace of Westphalia (1648)","The Treaty of Utrecht (1713)","The Treaty of Nystad (1721)"],"why":["It ended the Seven Years' War and transferred New France to Britain.","That treaty largely restored colonial conquests.","Westphalia concerned the Thirty Years' War in Europe.","Utrecht gave Britain Nova Scotia, Newfoundland and Hudson Bay, not all of Canada.","Nystad ended the Great Northern War between Russia and Sweden."],"answer":0},"u2q5":{"id":"u2q5","unit":2,"diff":"e","pool":"quiz","stem":"<p>The putting-out system involved<\/p>","options":["guild workshops controlled by masters in large cities","government-owned factories run by state officials in the capital","steam-powered textile mills","slave labor on Caribbean plantations","merchants paying rural families to spin and weave at home"],"why":["Merchants used rural labor to avoid urban guild rules.","The system was private and decentralized.","Mills came with the Industrial Revolution and replaced cottage industry.","That was the plantation system.","Families spun and wove in their cottages; merchants collected and sold the finished cloth."],"answer":4},"u2q6":{"id":"u2q6","unit":2,"diff":"e","pool":"exam1","stem":"<p>Frederick II's invasion of Silesia in 1740 began the<\/p>","options":["Thirty Years' War over religion","Crimean War","Great Northern War around the Baltic","War of the Austrian Succession","War of the Spanish Succession"],"why":["That war ran from 1618 to 1648.","The Crimean War was fought in the 1850s.","That war (1700–1721) was fought between Russia and Sweden.","Frederick exploited Maria Theresa's accession to seize Silesia.","That war ran from 1701 to 1714."],"answer":3},"u2q7":{"id":"u2q7","unit":2,"diff":"m","pool":"exam2","stem":"<p>The main cause of European population growth in the eighteenth century was<\/p>","options":["a falling death rate, as plague and famine receded","the spread of modern vaccination and antibiotics","government programs paying bonuses to large families","mass immigration from Asia and Africa","the end of serfdom across Europe"],"why":["Fewer deaths from plague and famine, not more births, drove the increase.","Antibiotics came in the 1900s; the smallpox vaccine only in 1796.","No such programs drove the trend.","There was no large immigration into Europe.","Serfdom survived in central and eastern Europe well into the 1800s."],"answer":0},"u2q8":{"id":"u2q8","unit":2,"diff":"m","pool":"exam1","stem":"<p>Which statement about the Atlantic slave trade in the eighteenth century is accurate?<\/p>","options":["It was controlled entirely by the Dutch","It mainly supplied workers to European factories","It was abolished by Britain at the Treaty of Utrecht","It declined sharply as sugar became less profitable after 1720","It reached its peak volume in the 1700s"],"why":["Britain, Portugal and France were the leading carriers in this period.","Enslaved people were sent to American plantations.","Utrecht gave Britain the asiento; Britain abolished the trade in 1807.","Sugar profits were high, and the trade expanded.","The trade peaked in the eighteenth century, driven by plantation demand."],"answer":4},"u2q9":{"id":"u2q9","unit":2,"diff":"m","pool":"quiz","stem":"<p>Charles VI's Pragmatic Sanction was intended to<\/p>","options":["divide Poland among its neighbors","abolish serfdom in the Habsburg lands","unite the crowns of France and Spain","grant religious toleration to Protestants in Austria and Bohemia","let his daughter inherit all Habsburg lands"],"why":["The partitions of Poland began in 1772.","Serfdom reform came later under Joseph II.","Utrecht forbade that union, and it was not Charles's aim.","That was Joseph II's Edict of Toleration in 1781.","Charles had no son and sought international guarantees for her succession."],"answer":4},"u2q10":{"id":"u2q10","unit":2,"diff":"m","pool":"exam1","stem":"<p>The South Sea Bubble (1720) and the Mississippi Bubble (1720) were both<\/p>","options":["outbreaks of plague that killed thousands in port cities","slave revolts in the Caribbean","speculative crashes of trading-company shares","treaties that ended the War of the Spanish Succession","naval battles between Britain and France"],"why":["The Marseille plague of 1720 is unrelated to these crashes.","They were stock-market crashes, not revolts.","Both crashes ruined investors in companies selling dreams of overseas wealth.","That war ended with Utrecht and Rastatt.","Neither was a battle."],"answer":2},"u2q11":{"id":"u2q11","unit":2,"diff":"m","pool":"exam1","stem":"<p>Which of the following was a result of the Seven Years' War?<\/p>","options":["Prussia was forced to return the province of Silesia to Austria","Britain became dominant in North America and India","Spain lost all its American colonies","Austria gained control of the Holy Roman Empire's German states","France gained Canada from Britain"],"why":["Prussia kept Silesia.","The Treaty of Paris (1763) removed France from Canada and left Britain dominant in India.","Spain kept its American empire and received Louisiana from France.","There was no such outcome.","France lost Canada."],"answer":1},"u2q12":{"id":"u2q12","unit":2,"diff":"m","pool":"diag","stem":"<p>Robert Clive's victory at the Battle of Plassey (1757) is significant because it<\/p>","options":["began British company rule in Bengal","opened Japan to Western trade","gave France control of the Indian Ocean spice trade","ended the Mughal Empire's conquest of Europe","ended the Atlantic slave trade"],"why":["Plassey made the Company the real power in Bengal, a base for wider British rule in India.","Japan was opened by the United States in the 1850s.","France lost ground in India.","The Mughals never invaded Europe.","Plassey was in India and unrelated to the slave trade."],"answer":0},"u2q13":{"id":"u2q13","unit":2,"diff":"m","pool":"quiz","stem":"<p>The growth of eighteenth-century consumption of sugar, tea and coffee in Europe most directly encouraged<\/p>","options":["the abandonment of mercantilist policies by Britain and France","the decline of European port cities","the collapse of the Dutch East India Company within a decade","more slave-worked plantations in the Americas","a fall in the price of land in Britain"],"why":["Mercantilism remained dominant through the century.","Ports like Liverpool and Nantes grew rich.","The VOC declined slowly and was dissolved only in 1799.","Rising demand for sugar and coffee meant more plantations and more enslaved labor.","There is no direct link between colonial goods and British land prices."],"answer":3},"u2q14":{"id":"u2q14","unit":2,"diff":"m","pool":"quiz","stem":"<p>Which pair were allies during the Seven Years' War?<\/p>","options":["Britain and Prussia","Prussia and Austria","France and Prussia","Britain and Austria","Britain and France"],"why":["After the Diplomatic Revolution, Britain subsidized Prussia against Austria, France and Russia.","Austria wanted to reconquer Silesia from Prussia.","France switched to Austria's side in 1756.","They had been allies earlier but split in 1756.","They were the main colonial rivals."],"answer":0},"u2q15":{"id":"u2q15","unit":2,"diff":"m","pool":"exam2","stem":"<p>Frederick William I of Prussia, the \"Soldier King,\" is best known for<\/p>","options":["building a large army while saving money","conquering the province of Silesia from Austria","writing philosophical letters to Voltaire and Diderot","creating a constitutional monarchy","leading Prussia to defeat at Jena"],"why":["He made Prussia a major military power while rarely going to war.","His son Frederick II did that in 1740.","That was Frederick II.","He was an absolutist.","Jena was in 1806, under Frederick William III."],"answer":0},"u2q16":{"id":"u2q16","unit":2,"diff":"m","pool":"quiz","stem":"<p>After Louis XIV died in 1715, the Paris parlement regained the right to<\/p>","options":["declare war without the king's approval","appoint the king's ministers","elect the king of France","abolish noble tax exemptions","object to royal decrees"],"why":["The parlements were law courts with no war powers.","Ministers were chosen by the king.","The French crown was hereditary.","The parlements defended privilege; they did not abolish it.","The parlements later used this right of remonstrance to block tax reforms."],"answer":4},"u2q17":{"id":"u2q17","unit":2,"diff":"h","pool":"exam2","stem":"<p>Which development best reflects proto-industrialization in the eighteenth century?<\/p>","options":["The Navigation Acts' restriction of colonial shipping","State-run silk factories in Lyon","The guilds' monopoly over urban textile production","The building of steam-powered cotton mills in Manchester","Rural families spinning and weaving for merchants"],"why":["These were trade laws, not a production system.","Lyon's silk trade was urban and artisanal.","Proto-industry grew in the countryside largely to escape guild control.","Mills are the factory system itself, not its precursor.","Proto-industry was market-oriented rural cottage production that came before factories."],"answer":4},"u2q18":{"id":"u2q18","unit":2,"diff":"h","pool":"quiz","stem":"<p>A historian notes that the national debt of both Britain and France nearly doubled because of the Seven Years' War. Which later development does this best help explain?<\/p>","options":["The South Sea Bubble of 1720","The American Revolution and France's 1780s crisis","The spread of the potato as a staple crop in eastern Europe","The Glorious Revolution of 1688","The Diplomatic Revolution that preceded the war in 1756"],"why":["That came before the war.","British taxes on the colonies and France's bankruptcy both grew out of war debt.","Crop diffusion is unrelated to war debt.","That came long before the war.","The alliance switch came before the debts were run up."],"answer":1},"u2q19":{"id":"u2q19","unit":2,"diff":"h","pool":"quiz","stem":"<p>Which factor contributed LEAST to Europe's eighteenth-century population growth?<\/p>","options":["A milder climate after the seventeenth century","The disappearance of bubonic plague from western Europe","Advances in hospital medicine","Improved transportation for moving grain","The spread of the potato"],"why":["Better harvests reduced famine.","This sharply reduced mortality.","Hospitals of the period often spread disease; medicine had little demographic effect before the 1800s.","Better roads and canals relieved local shortages.","The potato provided cheap calories and reduced famine."],"answer":2},"u2q20":{"id":"u2q20","unit":2,"diff":"h","pool":"diag","stem":"<p>Which statement best compares Britain and France in the mid-1700s?<\/p>","options":["Neither country participated in the Atlantic slave trade","Britain was an absolute monarchy while France was a parliamentary state","Both abolished their colonial empires after 1763","Britain could borrow cheaply for war; France was hampered by privilege","France had the larger navy and won most of the colonial wars"],"why":["Both were major slave-trading nations.","The reverse is true.","Both kept empires; France kept its sugar islands.","Britain's credit system funded naval victories; France's tax exemptions and memories of John Law's collapse limited its borrowing.","Britain's navy was superior, and Britain won the Seven Years' War."],"answer":3},"u2q21":{"id":"u2q21","unit":2,"diff":"m","pool":"exam2","stem":"<p>What was the asiento that Britain won in 1713?<\/p>","options":["Permanent fishing rights off the coast of Newfoundland and the Baltic","A contract to sell enslaved Africans to Spain's colonies","Control of the Mississippi River","A royal charter for the Bank of England and its branches","A monopoly on the tea trade with China"],"why":["The asiento concerned the slave trade.","The asiento contract was the commercial prize of Utrecht and was later held by the South Sea Company.","The Mississippi remained in French and then Spanish hands until 1803.","The Bank of England was chartered in 1694.","The British East India Company's China trade was unrelated to the asiento."],"answer":1},"u2q22":{"id":"u2q22","unit":2,"diff":"e","pool":"quiz","stem":"<p>Which crop from the Americas most helped Europe reduce famine in the eighteenth century?<\/p>","options":["Rice","Potatoes","Coffee","Tobacco","Sugarcane"],"why":["Rice was not a major American crop in Europe's diet.","Potatoes yielded many calories per acre and grew in poor soils.","Coffee is a stimulant, not a staple food.","Tobacco is not a food.","Sugar was a cash crop grown in the Caribbean, not a European staple."],"answer":1},"u2q23":{"id":"u2q23","unit":2,"diff":"m","pool":"quiz","stem":"<p>Which best describes how mercantilist Britain viewed its colonies?<\/p>","options":["As territories governed directly by Parliament's elected colonial members","As independent nations free to trade with anyone","As places to build factories that would compete with Britain","As suppliers and markets that should trade with Britain","As burdens to be abandoned as soon as possible"],"why":["Colonies had no seats in Parliament.","Mercantilism restricted colonial trade.","Colonial manufacturing was discouraged.","The Navigation Acts channeled colonial trade through British ships and ports.","Britain fought major wars to keep and expand them."],"answer":3},"u2q24":{"id":"u2q24","unit":2,"diff":"h","pool":"exam1","stem":"<p>Which of the following is the best evidence that the Seven Years' War was a \"world war\"?<\/p>","options":["It started because of a dynastic dispute over the Spanish throne","It involved more than one German state","It lasted seven years","It was fought on several continents and oceans","It ended with a treaty signed in Paris"],"why":["It was rooted in Silesia and colonial rivalry, not succession.","German states fought each other in many wars.","Length alone does not make a war global.","Its theaters spanned several continents and oceans.","Many treaties were signed in Paris."],"answer":3},"u3q1":{"id":"u3q1","unit":3,"diff":"e","pool":"exam1","stem":"<p>Who first proposed, in a book published in 1543, that the Earth revolves around the Sun?<\/p>","options":["Johannes Kepler","Isaac Newton","Nicolaus Copernicus","Galileo Galilei","Ptolemy"],"why":["Kepler refined the model with elliptical or
