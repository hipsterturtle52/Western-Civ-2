<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Western Civ II Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: archive ledger. Fixed index rail on the left (desktop) / drawer (phone),
   one reading column at ~68ch. Prussian blue (first synthetic pigment, Berlin 1706)
   is the accent; gilt marks the "must know" material. System fonts only: works offline. */
:root {
  --paper: #f4f5f1;
  --surface: #ffffff;
  --sunk: #eceee8;
  --ink: #18212b;
  --muted: #5a6470;
  --line: #d8dcd6;
  --accent: #1d4e7c;
  --accent-ink: #ffffff;
  --accent-soft: #e2eaf3;
  --gilt: #8a5f0f;
  --gilt-soft: #f5ecd8;
  --good: #23704a;
  --good-soft: #e1f1e7;
  --warn: #8a5a00;
  --warn-soft: #fbefd4;
  --bad: #ad2a22;
  --bad-soft: #f8e3e1;
  --focus: #2f7bd0;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --step--1: 0.85rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --surface: #161d25; --sunk: #1c242e; --ink: #e4e8ec; --muted: #9aa5b1;
    --line: #2a3542; --accent: #8db8e3; --accent-ink: #0f141a; --accent-soft: #1b2c3e;
    --gilt: #d9b166; --gilt-soft: #2a2416; --good: #74c99a; --good-soft: #15291f;
    --warn: #e0b45a; --warn-soft: #2b2312; --bad: #f08c84; --bad-soft: #2f1a19; --focus: #8db8e3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --surface: #161d25; --sunk: #1c242e; --ink: #e4e8ec; --muted: #9aa5b1;
  --line: #2a3542; --accent: #8db8e3; --accent-ink: #0f141a; --accent-soft: #1b2c3e;
  --gilt: #d9b166; --gilt-soft: #2a2416; --good: #74c99a; --good-soft: #15291f;
  --warn: #e0b45a; --warn-soft: #2b2312; --bad: #f08c84; --bad-soft: #2f1a19; --focus: #8db8e3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans);
  font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.2; text-wrap: balance; margin: 0; font-weight: 600; }
h1 { font-size: var(--step-3); }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Shell */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--line); padding: 20px 14px 32px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; text-decoration: none; color: var(--ink); }
.brand-eyebrow { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.brand-name { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; }
.brand-span { font-family: var(--serif); color: var(--accent); font-size: 0.95rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 10px 8px 4px; }
.nav a {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius);
  color: var(--ink); text-decoration: none; font-size: 0.93rem;
}
.nav a:hover { background: var(--sunk); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .u-no { font-family: var(--serif); color: var(--muted); width: 1.6em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.nav .u-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line); }
.dot.prog { background: var(--warn); }
.dot.done { background: var(--good); }
.rail-foot { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; padding: 0 8px; }

.topbar { display: none; }
main {
  min-width: 0; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.col.wide { max-width: 1000px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); height: auto;
    transform: translateX(-102%); transition: transform 0.2s ease;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px));
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.25);
  }
  .rail.open { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, 0.35); }
  .topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .topbar .brand-name { font-size: 1.05rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { padding-block: 18px 72px; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

/* Common pieces */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: var(--radius);
  cursor: pointer; text-decoration: none; font-size: 0.95rem; line-height: 1.3;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 0.85rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; justify-content: space-between; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.tight { padding: 14px; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 0.78rem;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: var(--surface);
}
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.unverified { background: var(--warn-soft); color: var(--warn); border-color: transparent; font-weight: 600; }
.muted { color: var(--muted); }
.url { overflow-wrap: anywhere; }
.small { font-size: 0.88rem; }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; min-width: 60px; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > span { background: var(--good); }
.bar.warn > span { background: var(--warn); }
.bar.bad > span { background: var(--bad); }
.tablewrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: 0.92rem; }
.notice.info { background: var(--accent-soft); }
.notice.bad { background: var(--bad-soft); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--serif); font-size: 1.7rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.85rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; }
input[type="number"], input[type="date"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; max-width: 100%;
}
textarea { width: 100%; min-height: 120px; font-family: var(--mono); font-size: 0.8rem; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: var(--radius); font-size: 0.92rem; max-width: 90vw;
}

/* Home */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); }
.hero h1 .dates { color: var(--accent); }
.next { border-left: 4px solid var(--accent); }
.meter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.meter > div { height: 10px; border-radius: 3px; background: var(--sunk); }
.meter > div.on { background: var(--good); }
.meter > div.part { background: var(--warn); }
.ready-badge { font-family: var(--serif); font-size: 1.25rem; font-weight: 600; }
.ready-badge.yes { color: var(--good); }
.unit-table td:first-child { font-family: var(--serif); color: var(--muted); width: 2em; }
.unit-table a { color: var(--ink); text-decoration: none; }
.unit-table a:hover { color: var(--accent); text-decoration: underline; }

/* Lesson */
.unit-head { display: flex; flex-direction: column; gap: 8px; }
.unit-head .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lesson { font-size: 1.04rem; display: flex; flex-direction: column; gap: 14px; max-width: 68ch; }
.lesson h3 { margin-top: 12px; font-size: 1.3rem; }
.lesson strong { font-weight: 650; }
.chain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.chain-step { padding: 10px 12px; font-size: 0.93rem; position: relative; min-width: 0; }
.chain-step + .chain-step { border-left: 1px solid var(--line); }
.chain-step + .chain-step::before {
  content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; margin-top: -6px;
  background: var(--surface); border-top: 1px solid var(--line); border-right: 1px solid var(--line); transform: rotate(45deg);
}
.chain-label { display: block; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
@media (max-width: 560px) {
  .chain { grid-template-columns: minmax(0, 1fr); }
  .chain-step + .chain-step { border-left: 0; border-top: 1px solid var(--line); }
  .chain-step + .chain-step::before { left: 50%; top: -7px; margin: 0 0 0 -6px; transform: rotate(135deg); }
}
.mustknow { background: var(--gilt-soft); border: 1px solid transparent; border-radius: var(--radius); padding: 16px 18px; }
.mustknow h3 { color: var(--gilt); font-size: 1.1rem; margin-bottom: 8px; }
.mustknow ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 4.6em; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.timeline li { display: grid; grid-template-columns: 4em 1.2em minmax(0, 1fr); gap: 8px; padding: 6px 0; align-items: start; }
.timeline .yr { font-family: var(--serif); font-weight: 600; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.timeline .pin { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); margin-top: 6px; justify-self: center; position: relative; z-index: 1; }
.timeline li.key .pin { background: var(--accent); }
.timeline .ev b { font-weight: 600; }
.timeline .ev span { display: block; color: var(--muted); font-size: 0.9rem; }
.lesson-actions { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.lesson-actions .panel { box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12); flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; }

/* Question runner */
.runner { display: flex; flex-direction: column; gap: 16px; }
.runner-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.timer { font-family: var(--mono); font-size: 1.1rem; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: var(--radius); background: var(--sunk); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.stem { font-size: 1.08rem; display: flex; flex-direction: column; gap: 10px; }
.stem blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--gilt); background: var(--gilt-soft); font-family: var(--serif); font-size: 1rem; border-radius: 0 var(--radius) var(--radius) 0; }
.qtable { font-size: 0.92rem; background: var(--surface); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; width: 100%;
  padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); cursor: pointer; line-height: 1.45;
}
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .k {
  display: inline-flex; width: 1.8em; height: 1.8em; align-items: center; justify-content: center; border-radius: 50%;
  border: 1px solid var(--line); font-weight: 600; font-size: 0.85rem; color: var(--muted);
}
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: var(--surface); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.why { display: flex; flex-direction: column; gap: 8px; font-size: 0.93rem; }
.why li { list-style: none; display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 6px; }
.why ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.why .mk { font-weight: 700; }
.why .mk.ok { color: var(--good); }
.why .mk.no { color: var(--bad); }
.verdict { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
.qgrid button {
  height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; cursor: pointer;
  font-size: 0.78rem; font-variant-numeric: tabular-nums; position: relative;
}
.qgrid button.ans { background: var(--accent-soft); border-color: var(--accent-soft); }
.qgrid button.cur { outline: 2px solid var(--accent); outline-offset: -2px; }
.qgrid button.flag::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--gilt); }
.kbd { font-family: var(--mono); font-size: 0.78rem; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); }
.review-item { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
details > summary { cursor: pointer; }

/* Flashcards */
.card-stage { perspective: 1200px; }
.fcard {
  min-height: 220px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 28px 22px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; cursor: pointer;
}
.fcard .front { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; }
.fcard .back { font-size: 1.05rem; max-width: 52ch; }
.fcard.flipped { border-color: var(--accent); }
.boxes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.boxes > div { background: var(--sunk); border-radius: var(--radius); padding: 8px; text-align: center; }
.boxes b { display: block; font-family: var(--serif); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.boxes span { font-size: 0.75rem; color: var(--muted); }

/* Plan */
.plan-table td:nth-child(1) { white-space: nowrap; }
.plan-table tr.exam td { background: var(--accent-soft); }
.plan-table tr.examday td { background: var(--gilt-soft); font-weight: 600; }
.plan-table ul { margin: 0; padding-left: 1.1em; }

/* Cheat sheet */
.cheat h2 { font-size: 1.2rem; border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin-top: 8px; }
.cheat-cols { columns: 2 300px; column-gap: 28px; font-size: 0.9rem; }
.cheat-cols > div { break-inside: avoid; padding: 2px 0; display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 8px; }
.cheat-cols .y { font-family: var(--serif); font-weight: 600; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.who { columns: 2 300px; column-gap: 28px; font-size: 0.9rem; }
.who p { break-inside: avoid; margin-bottom: 4px; }
.who b { font-weight: 650; }
.cheat .hideable.masked { color: transparent; background: var(--sunk); border-radius: 3px; user-select: none; }
.unit-mini { font-size: 0.86rem; }
.unit-mini h4 { font-size: 0.95rem; margin: 6px 0 2px; }
.unit-mini ul { margin: 0; padding-left: 1.1em; }

@media print {
  :root { --paper: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #bbb; --accent: #1d4e7c; --sunk: #fff; color-scheme: light; }
  .rail, .topbar, .no-print, .scrim, .toast { display: none !important; }
  .shell { display: block; }
  main { padding: 0; }
  .col, .col.wide { max-width: none; gap: 8px; }
  body { font-size: 8.5pt; line-height: 1.3; background: #fff; }
  .cheat-cols, .who { columns: 3; column-gap: 14px; font-size: 7.5pt; }
  .cheat h2 { font-size: 10pt; margin-top: 4px; }
  .cheat .hideable.masked { color: #000; background: none; }
  @page { margin: 10mm; }
}
</style>
</head>
<body>
<div class="topbar no-print">
  <button class="btn small" type="button" data-act="menu" aria-label="Open menu" aria-expanded="false" id="menuBtn">☰ Menu</button>
  <span class="brand-name">Western Civ II</span>
  <button class="btn small ghost" type="button" data-act="theme" aria-label="Toggle dark mode" id="themeBtnTop">◐</button>
</div>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Study guide navigation">
    <a class="brand" href="#home" data-nav>
      <span class="brand-eyebrow">CLEP study guide</span>
      <span class="brand-name">Western Civ II</span>
      <span class="brand-span">1648 → the present</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <button class="btn small" type="button" data-act="theme" id="themeBtn">◐ Theme: system</button>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim" hidden data-act="menu"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
const DATA = {"meta":{"exam":"CLEP Western Civilization II: 1648 to the Present","format":{"questions":120,"time_minutes":90,"note":"Approximately 120 questions in 90 minutes; some are unscored pretest questions. Passing score: 50 on a 20-80 scale (ACE recommended credit score).","verified":true},"sources":[{"label":"College Board exam page","url":"https://clep.collegeboard.org/exam/western-civilization-ii"},{"label":"College Board exam page (alt URL)","url":"https://clep.collegeboard.org/clep-exams/western-civilization-2"},{"label":"College Board 'At a Glance' fact sheet (PDF)","url":"https://secure-media.collegeboard.org/digitalServices/pdf/clep/western_civiliation_II_fact_sheet.pdf"}],"verificationNote":"collegeboard.org could not be fetched directly from the build environment (network policy). Weights marked verified=true were confirmed from search-engine excerpts of the College Board page/fact sheet; verified=false means only third-party prep sites confirmed the figure. Subtopic wording is paraphrased.","skills":["Understanding important factual knowledge of developments in Western civilization","Ability to identify the causes and effects of major historical events","Ability to analyze, interpret, and evaluate textual and graphic historical materials","Ability to distinguish the relevant from the irrelevant","Ability to reach conclusions on the basis of facts"]},"outline":[{"id":1,"title":"Absolutism and Constitutionalism, 1648–1715","min":7,"max":9,"verified":true,"subtopics":["The Dutch Republic","The English Revolution","France under Louis XIV","Formation of Austria and Prussia","The 'westernization' of Russia"]},{"id":2,"title":"Competition for Empire and Economic Expansion","min":4,"max":6,"verified":true,"subtopics":["Global economy of the eighteenth century","Europe after Utrecht, 1713–1740","Demographic change in the eighteenth century"]},{"id":3,"title":"The Scientific View of the World","min":5,"max":7,"verified":true,"subtopics":["Major figures of the scientific revolution","New knowledge of man and society","Political theory"]},{"id":4,"title":"Period of Enlightenment","min":7,"max":9,"verified":true,"subtopics":["Enlightenment thought","Enlightened despotism","Partitions of Poland"]},{"id":5,"title":"Revolution and Napoleonic Europe","min":10,"max":13,"verified":true,"subtopics":["The Revolution in France","The Revolution in Europe","The Napoleonic era","Congress of Vienna"]},{"id":6,"title":"The Industrial Revolution","min":7,"max":9,"verified":true,"subtopics":["Agricultural and industrial revolution","Causes of revolution","Economic and social impact on working and middle class","British reform legislation","Chartism"]},{"id":7,"title":"Political and Cultural Developments, 1815–1848","min":6,"max":8,"verified":false,"subtopics":["Conservatism","Liberalism","Nationalism","Socialism","Romanticism","Revolutions of 1830 and 1848"]},{"id":8,"title":"Politics and Diplomacy in the Age of Nationalism, 1850–1914","min":8,"max":10,"verified":true,"subtopics":["The unification of Italy and Germany","Austria-Hungary","Russia","France","Socialism and labor unions","European diplomacy, 1871–1900"]},{"id":9,"title":"Economy, Culture, and Imperialism, 1850–1914","min":7,"max":9,"verified":true,"subtopics":["Demography","Mass politics","Science, technology, and industrial growth","Imperialism in Africa and Asia","Modern art, thought, and literature"]},{"id":10,"title":"The First World War and the Russian Revolution","min":10,"max":12,"verified":true,"subtopics":["Causes of the First World War","Economic and social impact of the war","The peace settlements","The Russian Revolution of 1917"]},{"id":11,"title":"Europe Between the Wars","min":7,"max":9,"verified":true,"subtopics":["The Great Depression","International politics, 1919–1939","Stalin's five-year plans and purges","Fascism and Nazism","Interwar culture"]},{"id":12,"title":"The Second World War and Contemporary Europe","min":8,"max":10,"verified":true,"subtopics":["Causes and course of the Second World War","Postwar Europe and the Cold War","Decolonization","European integration","The collapse of communism and contemporary Europe"]}],"units":[{"id":1,"title":"Absolutism and Constitutionalism, 1648–1715","short":"Absolutism & Constitutionalism","range":"1648–1715","weight":{"min":7,"max":9,"verified":true},"subtopics":["The Dutch Republic","The English Revolution","France under Louis XIV","Formation of Austria and Prussia","The 'westernization' of Russia"],"lesson":"<h3>The big picture<\/h3>\n<p>In 1648 the <strong>Peace of Westphalia<\/strong> ended the Thirty Years' War, the last great war fought mainly over religion in Europe. From then on, rulers fought for power, territory and trade rather than faith. The treaty recognized the independence of the <strong>Dutch Republic<\/strong> and Switzerland, let each German prince run his own state (making the Holy Roman Emperor weak), and accepted Calvinism alongside Catholicism and Lutheranism. Historians often treat Westphalia as the birth of the modern system of <strong>sovereign states<\/strong>.<\/p>\n<p>The central question of the next seventy years was simple: <strong>who holds supreme power in a state?<\/strong> Two answers competed. <strong>Absolutism<\/strong> said the monarch rules alone, answering only to God (<strong>divine right of kings<\/strong>), with no parliament able to block him. <strong>Constitutionalism<\/strong> said the ruler's power is limited by law and shared with a representative body. France under Louis XIV became the model of the first answer; England and the Dutch Republic became the models of the second.<\/p>\n<h3>France: Louis XIV, the model absolute monarch<\/h3>\n<p>Louis XIV became king in 1643 at age four and reigned until 1715, the longest reign in European history. As a boy he lived through the <strong>Fronde<\/strong> (1648–1653), a series of revolts by nobles and the Paris law courts against the regency government of Cardinal <strong>Mazarin<\/strong>. Louis never forgot being forced to flee Paris. He drew a lesson: the nobility must be tamed.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Noble revolts of the Fronde humiliate the young king<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Louis XIV builds Versailles and moves the court there (1682)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Great nobles trade political power for court rituals and royal favor<\/div><\/div>\n<p>At <strong>Versailles<\/strong>, a giant palace outside Paris, the most powerful nobles were expected to live at court, where they competed for honors such as handing the king his shirt. Nobles busy with etiquette were not raising armies. Louis governed through middle-class officials and royal agents called <strong>intendants<\/strong>, who carried his orders to the provinces. He never called the <strong>Estates-General<\/strong>, France's national assembly, which did not meet from 1614 until 1789. The bishop <strong>Jacques-Bénigne Bossuet<\/strong> gave the theory: kings are God's lieutenants on earth. The phrase \"L'état, c'est moi\" (\"I am the state\") is attributed to Louis, though he probably never said it.<\/p>\n<p>His finance minister <strong>Jean-Baptiste Colbert<\/strong> practiced <strong>mercantilism<\/strong>: the idea that a nation's wealth is a fixed pie measured in gold and silver, so the state should export more than it imports, protect home industries with tariffs, build roads and canals, and found colonies to supply raw materials.<\/p>\n<p>Louis wanted \"one king, one law, one faith.\" In 1685 he <strong>revoked the Edict of Nantes<\/strong> (which since 1598 had protected French Protestants, the <strong>Huguenots<\/strong>). About 200,000 skilled Huguenots fled to the Dutch Republic, England, Prussia and America, taking their crafts and capital with them. It was a gift to France's rivals.<\/p>\n<p>Louis also fought almost constantly to push France's borders to the Rhine. His last and biggest war, the <strong>War of the Spanish Succession<\/strong> (1701–1714), began when the childless Spanish king left his throne to Louis's grandson Philip. England, the Dutch and Austria feared a French-Spanish superstate and formed a grand alliance against him. The <strong>Treaty of Utrecht (1713)<\/strong> let Philip V keep Spain but ruled that the French and Spanish crowns could never be united. Britain took <strong>Gibraltar<\/strong>, Minorca, Newfoundland, Nova Scotia (Acadia) and the <strong>asiento<\/strong> (the right to sell enslaved Africans in Spanish America). Utrecht established the principle of the <strong>balance of power<\/strong>: no single state should dominate Europe. Louis died in 1715 leaving France victorious in prestige but deeply in debt.<\/p>\n<h3>England: from civil war to constitutional monarchy<\/h3>\n<p>England's Stuart kings, <strong>James I<\/strong> and <strong>Charles I<\/strong>, also believed in divine right, but they needed Parliament's consent to raise taxes. Charles I collected taxes without Parliament, accepted the <strong>Petition of Right (1628)<\/strong> and then ignored it, and ruled without Parliament from 1629 to 1640. A Scottish revolt over religion forced him to call Parliament again for money. That <strong>Long Parliament<\/strong> demanded reforms, and in 1642 the <strong>English Civil War<\/strong> began.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Charles I taxes without Parliament and pushes high-church religion on Puritans and Scots<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>English Civil War, 1642–1649<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Charles I executed (1649); England becomes a republic<\/div><\/div>\n<p>The <strong>Royalists<\/strong> (Cavaliers) fought the <strong>Parliamentarians<\/strong> (Roundheads), who were strongest among Puritans, merchants and London. <strong>Oliver Cromwell<\/strong> led Parliament's disciplined <strong>New Model Army<\/strong> to victory. In 1649 Charles I was tried and <strong>beheaded<\/strong>, a shocking act in a Europe of kings. England became a republic, the <strong>Commonwealth<\/strong>. Radical groups appeared, such as the <strong>Levellers<\/strong>, who wanted votes for most men. Cromwell dissolved Parliament and ruled as <strong>Lord Protector<\/strong> (1653–1658), a military dictatorship in practice. Puritan rule (theaters closed, strict morality) grew unpopular.<\/p>\n<p>After Cromwell died, the monarchy was <strong>restored in 1660<\/strong> under <strong>Charles II<\/strong>. Parliament now held the upper hand on taxes. Two political factions formed: <strong>Whigs<\/strong>, who wanted to limit the king and exclude Catholics from the throne, and <strong>Tories<\/strong>, who supported royal authority and hereditary right. The <strong>Test Act (1673)<\/strong> barred non-Anglicans from public office.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Catholic James II rules by decree and his son is born, promising a Catholic dynasty<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Glorious Revolution (1688): Parliament invites William of Orange and Mary<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Bill of Rights (1689) makes Parliament supreme: constitutional monarchy<\/div><\/div>\n<p>Charles's brother <strong>James II<\/strong> was openly Catholic and ignored laws he disliked. When his son was born in 1688, Parliament's leaders invited the Protestant Dutch prince <strong>William of Orange<\/strong> and his wife <strong>Mary<\/strong> (James's Protestant daughter) to take the throne. James fled with almost no bloodshed: the <strong>Glorious Revolution<\/strong>. William and Mary accepted the <strong>Bill of Rights (1689)<\/strong>: no taxes or standing army in peacetime without Parliament's consent, free elections, free speech in Parliament, and no Catholic monarch. The <strong>Toleration Act (1689)<\/strong> allowed Protestant dissenters to worship (but not Catholics). <strong>John Locke's<\/strong> <em>Two Treatises of Government<\/em> (1690) justified the revolution: government rests on the consent of the governed. The <strong>Act of Union (1707)<\/strong> joined England and Scotland as <strong>Great Britain<\/strong>.<\/p>\n<h3>The Dutch Republic: a merchant republic<\/h3>\n<p>The <strong>United Provinces of the Netherlands<\/strong> won independence from Spain (recognized in 1648). It was a loose federation of seven provinces with a weak central <strong>States General<\/strong>. Power lay with wealthy merchant oligarchs called <strong>regents<\/strong>, while the princes of the House of <strong>Orange<\/strong> held the office of <strong>stadtholder<\/strong> (military leader) and gained power in wartime crises. In the \"disaster year\" of <strong>1672<\/strong>, when France invaded, the Dutch turned to <strong>William III of Orange<\/strong>, the same William who later took England's throne.<\/p>\n<p>The seventeenth century was the <strong>Dutch Golden Age<\/strong>. The <strong>Dutch East India Company<\/strong> (VOC, founded 1602) dominated the Asian spice trade; Amsterdam had the world's leading stock exchange and the <strong>Bank of Amsterdam<\/strong>; Dutch ships carried much of Europe's trade. The Republic practiced unusual <strong>religious toleration<\/strong>, sheltering Jews, Huguenots and dissenters like the philosopher <strong>Spinoza<\/strong>. Painters such as <strong>Rembrandt<\/strong> and <strong>Vermeer<\/strong> painted merchants and everyday life rather than kings and saints. By 1700, wars with England and France had drained the Dutch, and Britain overtook them as the leading commercial power.<\/p>\n<h3>Central and Eastern Europe: Austria, Prussia, Russia<\/h3>\n<p>After 1648 the Habsburg emperors in Vienna gave up on controlling Germany and built a Danube empire: Austria, Bohemia and Hungary. In <strong>1683 the Ottoman Turks besieged Vienna<\/strong> for the last time; a relief army led by the Polish king <strong>Jan Sobieski<\/strong> broke the siege. In the <strong>Treaty of Karlowitz (1699)<\/strong> the Ottomans surrendered most of <strong>Hungary<\/strong> to Austria. The Habsburg lands stayed a patchwork of peoples and laws held together by the dynasty, the Catholic Church and the army, never as centralized as France.<\/p>\n<p><strong>Brandenburg-Prussia<\/strong>, ruled by the <strong>Hohenzollern<\/strong> family, was poor and scattered across northern Germany. <strong>Frederick William, the Great Elector<\/strong> (r. 1640–1688), built a large standing army and a tax bureaucracy (the General War Commissariat). He made a bargain with the landowning nobles, the <strong>Junkers<\/strong>: they accepted royal taxes and served as army officers in return for total control over their serfs. His son became <strong>King in Prussia<\/strong> in 1701. Prussia became famous as an army with a state attached.<\/p>\n<p>In Russia, <strong>Peter the Great<\/strong> (r. 1682–1725) toured Western Europe incognito in the <strong>Grand Embassy<\/strong> (1697–1698) to study shipbuilding and technology. Back home he forced <strong>westernization<\/strong> from the top: nobles had to shave their beards (or pay a beard tax) and wear Western clothes; he built a navy; he crushed the rebellious palace guard (the <strong>streltsy<\/strong>); he created the <strong>Table of Ranks<\/strong> (1722), which ranked nobles by state service rather than birth; and he put the Orthodox Church under a government committee, the <strong>Holy Synod<\/strong>. He fought Sweden in the <strong>Great Northern War<\/strong> (1700–1721), won the decisive <strong>Battle of Poltava (1709)<\/strong> against Charles XII, and gained the Baltic coast in the <strong>Treaty of Nystad (1721)<\/strong>. There he built his new capital, <strong>St. Petersburg<\/strong> (founded 1703), his \"window on the West.\" Westernization touched the elite; for peasants, <strong>serfdom<\/strong> grew harsher.<\/p>\n<h3>How it fits together<\/h3>\n<p>Every state faced the same pressure: war had become enormously expensive (standing armies, navies, fortresses). Rulers who could raise money without asking anyone, as in France, Prussia and Russia, became absolutist. Where a parliament controlled taxes, as in England, or merchants controlled the state, as in the Dutch Republic, power was shared under law. Exam questions often ask you to match a state to its model and to name the document or event that defined it.<\/p>","words":1561,"minutes":11,"mustKnow":["<strong>Peace of Westphalia (1648):<\/strong> ended the Thirty Years' War, recognized Dutch and Swiss independence, weakened the Holy Roman Emperor, birth of the sovereign-state system.","<strong>Louis XIV<\/strong> (r. 1643–1715) is the model absolutist: Versailles to tame nobles, intendants, never called the Estates-General, Bossuet's divine right, Colbert's mercantilism.","<strong>Revocation of the Edict of Nantes (1685)<\/strong> drove out the Huguenots, a skilled population that strengthened France's rivals.","<strong>Treaty of Utrecht (1713):<\/strong> Bourbon Philip V keeps Spain but the crowns stay separate; Britain gains Gibraltar and the asiento; balance-of-power principle.","<strong>English Civil War (1642–49)<\/strong> → Charles I executed (1649) → Cromwell's Commonwealth/Protectorate → Restoration (1660).","<strong>Glorious Revolution (1688)<\/strong> → William and Mary accept the <strong>Bill of Rights (1689)<\/strong>: Parliament supreme, constitutional monarchy.","<strong>Dutch Republic:<\/strong> merchant oligarchy, stadtholder from House of Orange, VOC, toleration, Golden Age art.","<strong>Prussia:<\/strong> Great Elector, standing army, Junker bargain (nobles serve the state, keep their serfs).","<strong>Peter the Great:<\/strong> westernization from above, Table of Ranks, Holy Synod, Great Northern War, Poltava (1709), St. Petersburg.","<strong>Austria:<\/strong> repelled the Ottoman siege of Vienna (1683), gained Hungary at Karlowitz (1699); a multiethnic dynastic state."],"timeline":[{"y":"1648","label":"Peace of Westphalia","note":"Ends the Thirty Years' War; Dutch independence recognized","key":true},{"y":"1648–1653","label":"The Fronde","note":"Noble and judicial revolts against Mazarin's regency in France","key":false},{"y":"1649","label":"Charles I executed","note":"England becomes a republic (Commonwealth)","key":true},{"y":"1653–1658","label":"Cromwell's Protectorate","note":"Military rule under the Lord Protector","key":false},{"y":"1660","label":"Stuart Restoration","note":"Charles II returns; Parliament keeps control of taxes","key":true},{"y":"1682","label":"Court moves to Versailles","note":"Louis XIV domesticates the high nobility","key":false},{"y":"1683","label":"Ottoman siege of Vienna fails","note":"Start of the Habsburg advance into Hungary","key":true},{"y":"1685","label":"Edict of Nantes revoked","note":"Huguenots flee France","key":true},{"y":"1688–1689","label":"Glorious Revolution; Bill of Rights","note":"Constitutional monarchy in England","key":true},{"y":"1697–1698","label":"Peter the Great's Grand Embassy","note":"Peter studies Western technology","key":false},{"y":"1699","label":"Treaty of Karlowitz","note":"Ottomans cede Hungary to Austria","key":false},{"y":"1700–1721","label":"Great Northern War","note":"Russia defeats Sweden (Poltava 1709); Nystad 1721","key":false},{"y":"1701","label":"Prussia becomes a kingdom","note":"Elector Frederick III crowned Frederick I, King in Prussia","key":false},{"y":"1703","label":"St. Petersburg founded","note":"Russia's \"window on the West\"","key":false},{"y":"1707","label":"Act of Union","note":"England and Scotland form Great Britain","key":false},{"y":"1713","label":"Treaty of Utrecht","note":"Ends War of the Spanish Succession; balance of power","key":true},{"y":"1715","label":"Death of Louis XIV","note":"Ends the age of the Sun King","key":false}],"cards":[{"id":"u1c1","front":"Peace of Westphalia (1648)","back":"Ended the Thirty Years' War; recognized Dutch and Swiss independence; German princes became sovereign; Calvinism tolerated.","person":false},{"id":"u1c2","front":"Absolutism","back":"Rule by a monarch with no legal limits from a parliament, justified by divine right.","person":false},{"id":"u1c3","front":"Constitutionalism","back":"Government whose power is limited by law and shared with a representative body.","person":false},{"id":"u1c4","front":"Divine right of kings","back":"Theory that monarchs get their authority from God and answer only to God.","person":false},{"id":"u1c5","front":"Louis XIV","back":"The \"Sun King\" of France (r. 1643–1715); model absolutist; built Versailles, revoked the Edict of Nantes.","person":true},{"id":"u1c6","front":"The Fronde","back":"Revolts by French nobles and courts (1648–53) against Mazarin's regency; taught Louis XIV to tame the nobility.","person":false},{"id":"u1c7","front":"Versailles","back":"Louis XIV's palace; the court moved there in 1682 to keep great nobles busy and under watch.","person":false},{"id":"u1c8","front":"Intendants","back":"Royal agents who enforced the French king's orders in the provinces.","person":false},{"id":"u1c9","front":"Jean-Baptiste Colbert","back":"Louis XIV's finance minister; mercantilism: tariffs, state-backed industry, colonies.","person":true},{"id":"u1c10","front":"Mercantilism","back":"Policy of building national wealth (gold and silver) through a favorable balance of trade, tariffs and colonies.","person":false},{"id":"u1c11","front":"Huguenots","back":"French Protestants; about 200,000 fled after the 1685 revocation of the Edict of Nantes.","person":false},{"id":"u1c12","front":"Treaty of Utrecht (1713)","back":"Philip V keeps Spain but French and Spanish crowns stay separate; Britain gains Gibraltar and the asiento.","person":false},{"id":"u1c13","front":"Oliver Cromwell","back":"Led Parliament's New Model Army in the English Civil War; ruled as Lord Protector 1653–58.","person":true},{"id":"u1c14","front":"Glorious Revolution (1688)","back":"Bloodless replacement of Catholic James II by William and Mary; Parliament's victory.","person":false},{"id":"u1c15","front":"English Bill of Rights (1689)","back":"No taxes or peacetime army without Parliament; free elections; no Catholic monarch.","person":false},{"id":"u1c16","front":"Whigs and Tories","back":"Restoration-era factions: Whigs favored limiting the king; Tories backed royal authority.","person":false},{"id":"u1c17","front":"Stadtholder","back":"Military and executive leader in the Dutch provinces, usually from the House of Orange.","person":false},{"id":"u1c18","front":"Junkers","back":"Prussian landed nobility; served as army officers and kept control of their serfs.","person":false},{"id":"u1c19","front":"Peter the Great","back":"Russian tsar (r. 1682–1725) who westernized Russia from above, founded St. Petersburg, beat Sweden.","person":true},{"id":"u1c20","front":"Table of Ranks (1722)","back":"Peter the Great's system ranking nobles by state service rather than birth.","person":false}],"hours":1.71,"quizIds":["u1q2","u1q3","u1q8","u1q10","u1q12","u1q14","u1q16","u1q19","u1q23","u1q25","u1q26","u1q29"]},{"id":2,"title":"Competition for Empire and Economic Expansion","short":"Empire & Economic Expansion","range":"1713–1763","weight":{"min":4,"max":6,"verified":true},"subtopics":["Global economy of the eighteenth century","Europe after Utrecht, 1713–1740","Demographic change in the eighteenth century"],"lesson":"<h3>The big picture<\/h3>\n<p>After the Treaty of Utrecht (1713), Europe's great powers stopped fighting over religion and dynasties alone and started fighting over <strong>trade and colonies<\/strong>. Britain and France became global rivals, competing in the Caribbean, North America, India and on the seas. At home, Europe's population began a long climb that never stopped. This unit is small on the exam (about 5%), so focus on three things: the <strong>Atlantic economy<\/strong>, the <strong>Anglo-French wars for empire<\/strong>, and the <strong>causes of population growth<\/strong>.<\/p>\n<h3>The Atlantic economy and the slave trade<\/h3>\n<p>In the 1700s the most valuable colonies were not in North America but in the <strong>Caribbean<\/strong>, where <strong>sugar<\/strong> plantations on islands such as French <strong>Saint-Domingue<\/strong> (today's Haiti) and British <strong>Jamaica<\/strong> made enormous profits. Sugar, tobacco, coffee, cotton and indigo were grown by <strong>enslaved Africans<\/strong>. Roughly six million Africans were carried across the Atlantic in the eighteenth century alone, more than in any other century of the trade, and many died on the brutal <strong>Middle Passage<\/strong>.<\/p>\n<p>Historians describe a <strong>triangular trade<\/strong>: European manufactured goods (guns, cloth, alcohol) went to West Africa; enslaved people went to the Americas; plantation crops went back to Europe. Port cities such as Liverpool, Bristol, Nantes and Bordeaux grew rich on it.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Cheap plantation sugar, tea, coffee and tobacco flood into European ports<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>A \"consumer revolution\": ordinary Europeans buy colonial goods<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Demand for slave labor and colonies grows; merchants and port cities gain wealth and influence<\/div><\/div>\n<p>Governments still thought in <strong>mercantilist<\/strong> terms: colonies existed to enrich the mother country. Britain's <strong>Navigation Acts<\/strong> required colonial trade to travel in British ships, and colonists were expected to buy British manufactures. Spain, whose silver empire was in decline, attempted the <strong>Bourbon reforms<\/strong> to tighten control and revenue, and Portugal profited from gold discovered in <strong>Brazil<\/strong>.<\/p>\n<h3>Europe after Utrecht, 1713–1740: a generation of (mostly) peace<\/h3>\n<p><strong>Britain.<\/strong> In 1714 the German prince of Hanover became <strong>George I<\/strong>, under the Act of Settlement, which required a Protestant monarch. George spoke little English and left government to his ministers. <strong>Robert Walpole<\/strong> (in power 1721–1742) became Britain's first <strong>prime minister<\/strong> in all but name. He kept Britain out of wars, kept taxes low, and governed through a <strong>cabinet<\/strong> that needed the support of the House of Commons. That habit of ministers answering to Parliament became central to the British system.<\/p>\n<p><strong>Financial bubbles.<\/strong> In 1720 two speculative manias burst. In Britain the <strong>South Sea Bubble<\/strong> (shares in a company with a monopoly on trade with Spanish America) collapsed; Walpole rose by cleaning up the mess. In France, the Scottish financier <strong>John Law<\/strong> had set up a royal bank that issued paper money and a Mississippi Company promising profits from Louisiana. When his <strong>Mississippi Bubble<\/strong> burst in 1720, it ruined investors and left the French distrustful of paper money and banks for decades.<\/p>\n<p><strong>France.<\/strong> Louis XV was a child in 1715, so the Duke of Orléans ruled as regent, then <strong>Cardinal Fleury<\/strong> (1726–1743) gave France stable, peaceful government. The regent also returned to the Paris <strong>parlement<\/strong> (a high law court, not a legislature) its right to object to royal decrees. The parlements would use that power to block tax reform for the rest of the century.<\/p>\n<p><strong>Austria.<\/strong> Emperor <strong>Charles VI<\/strong> had no son. He spent his reign getting the powers of Europe to accept the <strong>Pragmatic Sanction<\/strong> (1713), a decree that his daughter <strong>Maria Theresa<\/strong> would inherit all the Habsburg lands undivided.<\/p>\n<p><strong>Prussia.<\/strong> <strong>Frederick William I<\/strong>, the \"Soldier King\" (r. 1713–1740), lived frugally, filled the treasury and built Europe's fourth-largest army from a small population, including a famous regiment of extremely tall soldiers. He rarely used the army. His son would.<\/p>\n<h3>The wars for empire, 1740–1763<\/h3>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Charles VI dies (1740); Frederick II of Prussia sees a woman inherit Austria<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Frederick seizes rich Silesia; War of the Austrian Succession (1740–1748)<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Prussia keeps Silesia; Austria wants revenge and Britain and France keep fighting overseas<\/div><\/div>\n<p>In 1740 <strong>Frederick II (the Great)<\/strong> of Prussia ignored the Pragmatic Sanction and invaded <strong>Silesia<\/strong>, a rich Austrian province. France joined against Austria; Britain backed Austria. The <strong>War of the Austrian Succession<\/strong> (1740–1748) ended with the Treaty of <strong>Aix-la-Chapelle<\/strong>: Maria Theresa kept her throne, but Prussia kept Silesia.<\/p>\n<p>Maria Theresa wanted Silesia back. In the <strong>Diplomatic Revolution of 1756<\/strong>, old enemies swapped partners: Austria allied with its traditional foe <strong>France<\/strong>, and Britain allied with <strong>Prussia<\/strong>. Russia joined Austria and France.<\/p>\n<p>The <strong>Seven Years' War<\/strong> (1756–1763) was the first truly global war. In Europe, Prussia survived against huge odds (helped when the new Russian tsar, Peter III, an admirer of Frederick, made peace in 1762). Overseas, Britain, led by <strong>William Pitt the Elder<\/strong>, poured money into its navy and colonial campaigns. In North America (the \"French and Indian War\") the British took Quebec in 1759. In India, <strong>Robert Clive<\/strong> of the British East India Company won the <strong>Battle of Plassey<\/strong> (1757), beginning British control of Bengal. The <strong>Treaty of Paris (1763)<\/strong> gave Britain <strong>Canada<\/strong> and most of France's North American lands east of the Mississippi and left Britain the dominant power in India. France kept its profitable sugar islands.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Britain wins a global empire but doubles its national debt<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Britain taxes the American colonies to pay for defense<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Colonial resistance leads to the American Revolution (1775–1783)<\/div><\/div>\n<p>The war's debts also crushed France. Its financial crisis would lead, a generation later, to 1789.<\/p>\n<h3>Demographic change: Europe's population takes off<\/h3>\n<p>Europe's population grew from roughly <strong>120 million in 1700 to about 190 million by 1800<\/strong>, and growth accelerated afterward. The main causes were a <strong>falling death rate<\/strong>, not a rising birth rate: - <strong>Plague disappeared<\/strong> from western Europe (the last major outbreak was at Marseille in 1720). - <strong>Fewer famines<\/strong>, thanks to better farming, the spread of new American crops such as the <strong>potato<\/strong> and maize, and better roads and canals to move grain to hungry regions. - Somewhat <strong>better weather<\/strong> after the cold of the seventeenth century and more effective governments controlling borders and epidemics.<\/p>\n<p>Medicine played only a small role before the 1800s (Jenner's smallpox vaccine came only in 1796). The extra people needed work. Many rural families earned money in the <strong>putting-out system<\/strong> (cottage industry): a merchant delivered raw wool or cotton to a peasant household, the family spun and wove it at home, and the merchant collected and sold the cloth. Historians call this <strong>proto-industrialization<\/strong>, a step toward the factory system of the Industrial Revolution.<\/p>","words":1074,"minutes":8,"mustKnow":["<strong>Caribbean sugar<\/strong> colonies (Saint-Domingue, Jamaica) were the most valuable colonies; worked by enslaved Africans; the 1700s were the peak century of the Atlantic slave trade.","<strong>Triangular trade:<\/strong> manufactures to Africa, enslaved people to the Americas, plantation goods to Europe.","<strong>Walpole<\/strong> (1721–42): Britain's first prime minister in practice; cabinet responsible to the Commons; peace and low taxes.","<strong>1720 bubbles:<\/strong> the South Sea Bubble (Britain) and John Law's Mississippi Bubble (France).","<strong>Pragmatic Sanction:<\/strong> Charles VI's plan for Maria Theresa to inherit undivided Habsburg lands.","<strong>1740:<\/strong> Frederick the Great seizes Silesia → War of the Austrian Succession.","<strong>Diplomatic Revolution (1756):<\/strong> Austria + France vs. Britain + Prussia.","<strong>Seven Years' War (1756–63)<\/strong> → Treaty of Paris: Britain gains Canada and supremacy in India (Clive, Plassey 1757).","<strong>Population growth<\/strong> came from a falling death rate: the end of plague, fewer famines, the potato and better transport, not from medicine.","<strong>Putting-out system<\/strong> (cottage industry, proto-industrialization) employed the growing rural population."],"timeline":[{"y":"1714","label":"Hanoverian succession","note":"George I becomes king of Great Britain","key":false},{"y":"1720","label":"South Sea and Mississippi Bubbles burst","note":"Speculative crashes in Britain and France","key":true},{"y":"1720","label":"Last major plague in western Europe","note":"Outbreak at Marseille","key":false},{"y":"1721–1742","label":"Walpole's ministry","note":"First prime minister in practice","key":false},{"y":"1740","label":"Frederick II invades Silesia","note":"Begins the War of the Austrian Succession","key":true},{"y":"1748","label":"Treaty of Aix-la-Chapelle","note":"Prussia keeps Silesia","key":false},{"y":"1756","label":"Diplomatic Revolution; Seven Years' War begins","note":"Austria and France ally against Prussia and Britain","key":true},{"y":"1757","label":"Battle of Plassey","note":"Clive's victory starts British rule in Bengal","key":false},{"y":"1759","label":"British capture Quebec","note":"Turning point in North America","key":false},{"y":"1763","label":"Treaty of Paris","note":"Britain gains Canada and dominance in India","key":true}],"cards":[{"id":"u2c1","front":"Triangular trade","back":"Atlantic trade loop: European goods to Africa, enslaved Africans to the Americas, plantation crops to Europe.","person":false},{"id":"u2c2","front":"Middle Passage","back":"The deadly Atlantic crossing of enslaved Africans to the Americas.","person":false},{"id":"u2c3","front":"Saint-Domingue","back":"French Caribbean sugar colony (later Haiti), the richest colony in the 1700s.","person":false},{"id":"u2c4","front":"Robert Walpole","back":"Britain's first prime minister in practice (1721–42); peace, low taxes, cabinet government.","person":true},{"id":"u2c5","front":"South Sea Bubble (1720)","back":"British stock-market crash of a company with a monopoly on trade with Spanish America.","person":false},{"id":"u2c6","front":"John Law","back":"Scottish financier whose French paper-money and Mississippi Company scheme collapsed in 1720.","person":true},{"id":"u2c7","front":"Pragmatic Sanction","back":"Charles VI's decree that Maria Theresa would inherit all Habsburg lands undivided.","person":false},{"id":"u2c8","front":"War of the Austrian Succession (1740–48)","back":"Began when Frederick II seized Silesia; Prussia kept it at Aix-la-Chapelle (1748).","person":false},{"id":"u2c9","front":"Diplomatic Revolution (1756)","back":"Reversal of alliances: Austria joined France; Britain joined Prussia.","person":false},{"id":"u2c10","front":"Seven Years' War (1756–63)","back":"Global Anglo-French war; Treaty of Paris gave Britain Canada and dominance in India.","person":false},{"id":"u2c11","front":"Putting-out system","back":"Merchants supplied raw materials to rural families who spun and wove at home (cottage industry).","person":false},{"id":"u2c12","front":"18th-century population growth","back":"Caused mainly by a falling death rate: end of plague, fewer famines, potatoes, better transport.","person":false}],"hours":1.07,"quizIds":["u2q1","u2q4","u2q7","u2q11","u2q14","u2q16","u2q18","u2q20","u2q21","u2q24"]},{"id":3,"title":"The Scientific View of the World","short":"The Scientific View","range":"1543–1700","weight":{"min":5,"max":7,"verified":true},"subtopics":["Major figures of the scientific revolution","New knowledge of man and society","Political theory"],"lesson":"<h3>The big picture<\/h3>\n<p>Between about 1543 and 1687, a handful of thinkers overturned a picture of the universe that Europeans had trusted for nearly 2,000 years. This <strong>Scientific Revolution<\/strong> changed not just astronomy but how educated people decided what was true: by <strong>observation, experiment and mathematics<\/strong> rather than by quoting ancient authorities or scripture. That new habit of mind led directly to the Enlightenment (Unit 4), so the exam often asks you to link a scientist to a discovery and a philosopher to a method.<\/p>\n<h3>The old view: Aristotle, Ptolemy and Galen<\/h3>\n<p>Medieval universities taught a <strong>geocentric<\/strong> (Earth-centered) universe described by the Greek philosopher <strong>Aristotle<\/strong> and the astronomer <strong>Ptolemy<\/strong>. The Earth sat motionless at the center; the Moon, Sun, planets and stars moved around it on perfect crystalline spheres. The heavens were perfect and unchanging; the Earth was the realm of change and decay. This view fitted everyday experience (the Sun seems to move) and fitted Christian theology, which placed humanity at the center of creation. In medicine, the ancient physician <strong>Galen<\/strong> was the authority.<\/p>\n<h3>From Copernicus to Newton: the key figures<\/h3>\n<p><strong>Nicolaus Copernicus<\/strong>, a Polish cleric, published <em>On the Revolutions of the Heavenly Spheres<\/em> in <strong>1543<\/strong>, the year he died. He proposed a <strong>heliocentric<\/strong> (Sun-centered) model. He kept circular orbits, so his system was not more accurate than Ptolemy's, but it was simpler, and it put the Earth in motion.<\/p>\n<p><strong>Tycho Brahe<\/strong>, a Danish astronomer, made the most precise naked-eye observations of the planets ever recorded. He did not accept full heliocentrism, but his data were priceless. His assistant <strong>Johannes Kepler<\/strong> used them to prove that planets move in <strong>elliptical orbits<\/strong>, not perfect circles, and stated three mathematical laws of planetary motion (first two published 1609). Kepler made the Sun-centered system accurate.<\/p>\n<p><strong>Galileo Galilei<\/strong> turned a new instrument, the <strong>telescope<\/strong>, on the sky in 1609–1610. He saw mountains on the Moon (the heavens were not perfect), moons orbiting <strong>Jupiter<\/strong> (not everything circled the Earth), and the phases of Venus (which made sense only if Venus orbited the Sun). He also studied motion with experiments, rolling balls down ramps, and developed the idea of <strong>inertia<\/strong>. In 1632 he published the <em>Dialogue Concerning the Two Chief World Systems<\/em>, which mocked the geocentric view. In <strong>1633 the Roman Inquisition<\/strong> forced him to recant and kept him under house arrest for life. His case became the symbol of conflict between science and church authority.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Copernicus, Kepler and Galileo make the old Earth-centered physics impossible<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Newton's Principia (1687) explains heaven and earth with one set of laws<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>The universe looks like a rational machine; reason seems able to explain everything<\/div><\/div>\n<p><strong>Isaac Newton<\/strong> pulled everything together. His <em>Mathematical Principles of Natural Philosophy<\/em>, the <strong>Principia (1687)<\/strong>, set out three laws of motion and the <strong>law of universal gravitation<\/strong>: the same force that makes an apple fall keeps the Moon in orbit and the planets around the Sun. Newton also co-invented <strong>calculus<\/strong> (independently of the German <strong>Leibniz<\/strong>). The Newtonian universe was a vast machine running on mathematical laws. Many people concluded that God was a great designer, a \"clockmaker,\" who built the machine and let it run.<\/p>\n<p>Science advanced in other fields too. <strong>Andreas Vesalius<\/strong> published <em>On the Fabric of the Human Body<\/em> (also <strong>1543<\/strong>), based on dissecting human corpses, correcting Galen. <strong>William Harvey<\/strong> showed in 1628 that the heart pumps blood in a <strong>circulation<\/strong> through the body. <strong>Robert Boyle<\/strong> studied gases (<strong>Boyle's law<\/strong>) and attacked the old idea of four elements. <strong>Antonie van Leeuwenhoek<\/strong> used microscopes to see bacteria and sperm cells.<\/p>\n<h3>The new method: Bacon and Descartes<\/h3>\n<p>Two philosophers explained how to find truth.<\/p>\n<p><strong>Francis Bacon<\/strong> (English) championed <strong>empiricism<\/strong> and the <strong>inductive method<\/strong>: gather many observations and experiments, then build general conclusions from them. Knowledge, he said, should be useful and should give humans power over nature. His <em>Novum Organum<\/em> appeared in 1620.<\/p>\n<p><strong>René Descartes<\/strong> (French) championed <strong>rationalism<\/strong> and <strong>deduction<\/strong>: start from certain first principles and reason step by step. Doubting everything, he found one thing he could not doubt: \"<strong>I think, therefore I am<\/strong>\" (<em>Discourse on Method<\/em>, 1637). He split reality into mind and matter (<strong>Cartesian dualism<\/strong>) and invented analytic geometry, which joins algebra and geometry.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Old authorities (Aristotle, Galen) are shown to be wrong<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Bacon's experiments and Descartes's reasoning offer new ways to know<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>The <strong>scientific method<\/strong> combines observation with mathematics; trust shifts from tradition to evidence<\/div><\/div>\n<p>Modern science combines both: Bacon's experiments and Descartes's mathematical reasoning. Governments began to sponsor research through new academies: the <strong>Royal Society of London<\/strong> (chartered 1662) and the <strong>French Academy of Sciences<\/strong> (1666). A few women took part despite exclusion from universities, such as the astronomer <strong>Maria Winkelmann<\/strong>, refused a post at the Berlin Academy, and the writer <strong>Margaret Cavendish<\/strong>, who visited the Royal Society.<\/p>\n<h3>New knowledge of man and society<\/h3>\n<p>Scientific thinking soon turned to human affairs. <strong>John Locke's<\/strong> <em>Essay Concerning Human Understanding<\/em> (1690) argued that the mind at birth is a <strong>tabula rasa<\/strong>, a blank slate, filled only by experience. If people are shaped by environment, then better institutions and education can make better people. That idea powered Enlightenment reform. Skeptics such as <strong>Pierre Bayle<\/strong> (<em>Historical and Critical Dictionary<\/em>, 1697) argued that no belief should be accepted without evidence and pleaded for religious toleration. The Dutch philosopher <strong>Baruch Spinoza<\/strong> identified God with nature. Travel accounts of China, the Americas and Persia showed that other societies had their own morals and customs, encouraging cultural <strong>relativism<\/strong>. Educated elites also stopped believing in witchcraft, and the great witch hunts faded by about 1700.<\/p>\n<h3>Political theory: Hobbes and Locke<\/h3>\n<p>Both men used the idea of a <strong>state of nature<\/strong> (life before government) and a <strong>social contract<\/strong> (the agreement that creates government), but they reached opposite conclusions.<\/p>\n<p><strong>Thomas Hobbes<\/strong>, shaken by the English Civil War, wrote <strong><em>Leviathan<\/em> (1651)<\/strong>. In the state of nature, he said, humans are selfish and fearful, and life is \"<strong>solitary, poor, nasty, brutish, and short<\/strong>.\" To escape, people give up their rights to an all-powerful sovereign. Rebellion is never justified, because any government is better than chaos. Hobbes defended absolute power, but on rational grounds, not divine right.<\/p>\n<p><strong>John Locke<\/strong> wrote <strong><em>Two Treatises of Government<\/em> (1690)<\/strong> to justify the Glorious Revolution. In his state of nature people are reasonable and already possess <strong>natural rights to life, liberty and property<\/strong>. They create government only to protect those rights. A government that violates them breaks the contract, and the people have a <strong>right of revolution<\/strong>. Locke's ideas later shaped the American Declaration of Independence.<\/p>\n<p>The Dutch jurist <strong>Hugo Grotius<\/strong> (<em>On the Law of War and Peace<\/em>, 1625) argued that <strong>natural law<\/strong> binds nations as well as individuals; he is called the father of international law.<\/p>","words":1119,"minutes":8,"mustKnow":["<strong>Geocentric<\/strong> (Aristotle, Ptolemy) → <strong>heliocentric<\/strong> (Copernicus, 1543).","<strong>Kepler:<\/strong> elliptical orbits, using <strong>Tycho Brahe's<\/strong> observations.","<strong>Galileo:<\/strong> telescope (Jupiter's moons, Moon's mountains, phases of Venus), inertia, tried by the Inquisition in 1633.","<strong>Newton's Principia (1687):<\/strong> laws of motion and universal gravitation, the great synthesis; co-invented calculus with Leibniz.","<strong>Vesalius<\/strong> (anatomy, 1543) and <strong>Harvey<\/strong> (circulation of the blood, 1628) corrected Galen.","<strong>Bacon<\/strong> = empiricism, induction, experiment. <strong>Descartes<\/strong> = rationalism, deduction, \"I think, therefore I am.\"","<strong>Hobbes, Leviathan (1651):<\/strong> life \"nasty, brutish, and short\" → absolute sovereign; no right of rebellion.","<strong>Locke, Two Treatises (1690):<\/strong> natural rights to life, liberty, property; government by consent; right of revolution.","<strong>Locke, Essay (1690):<\/strong> mind as a <strong>tabula rasa<\/strong>; environment shapes people.","<strong>Royal Society<\/strong> (1662) and <strong>French Academy of Sciences<\/strong> (1666) institutionalized science."],"timeline":[{"y":"1543","label":"Copernicus, On the Revolutions; Vesalius, On the Fabric","note":"Heliocentrism and modern anatomy begin","key":true},{"y":"1609","label":"Kepler's first laws","note":"Planets move in ellipses","key":false},{"y":"1610","label":"Galileo's Starry Messenger","note":"Telescope reveals Jupiter's moons","key":true},{"y":"1620","label":"Bacon's Novum Organum","note":"Inductive, experimental method","key":false},{"y":"1628","label":"Harvey describes circulation of the blood","note":"Corrects Galen","key":false},{"y":"1633","label":"Galileo's trial","note":"Inquisition forces him to recant","key":true},{"y":"1637","label":"Descartes's Discourse on Method","note":"\"I think, therefore I am\"","key":false},{"y":"1651","label":"Hobbes's Leviathan","note":"Social contract for absolute power","key":true},{"y":"1662","label":"Royal Society chartered","note":"State-backed science in England","key":false},{"y":"1687","label":"Newton's Principia","note":"Universal gravitation","key":true},{"y":"1690","label":"Locke's Two Treatises and Essay","note":"Natural rights; tabula rasa","key":true}],"cards":[{"id":"u3c1","front":"Heliocentric theory","back":"The Sun, not the Earth, is the center of the planetary system; proposed by Copernicus (1543).","person":false},{"id":"u3c2","front":"Nicolaus Copernicus","back":"Polish astronomer; heliocentric model in On the Revolutions of the Heavenly Spheres (1543).","person":true},{"id":"u3c3","front":"Johannes Kepler","back":"Used Tycho Brahe's data to prove planets move in elliptical orbits.","person":true},{"id":"u3c4","front":"Galileo Galilei","back":"Telescope discoveries (Jupiter's moons), laws of motion; condemned by the Inquisition in 1633.","person":true},{"id":"u3c5","front":"Isaac Newton","back":"Principia (1687): three laws of motion and universal gravitation.","person":true},{"id":"u3c6","front":"Andreas Vesalius","back":"On the Fabric of the Human Body (1543); modern anatomy based on dissection.","person":true},{"id":"u3c7","front":"William Harvey","back":"Showed that the heart circulates blood through the body (1628).","person":true},{"id":"u3c8","front":"Francis Bacon","back":"Empiricism and the inductive method: knowledge from observation and experiment.","person":true},{"id":"u3c9","front":"René Descartes","back":"Rationalism and deduction; \"I think, therefore I am\"; mind-body dualism.","person":true},{"id":"u3c10","front":"Empiricism","back":"Knowledge comes from sense experience and experiment (Bacon, Locke).","person":false},{"id":"u3c11","front":"Rationalism","back":"Knowledge comes from reason working from first principles (Descartes).","person":false},{"id":"u3c12","front":"Thomas Hobbes","back":"Leviathan (1651): life in the state of nature is \"nasty, brutish, and short,\" so people need an absolute sovereign.","person":true},{"id":"u3c13","front":"John Locke","back":"Two Treatises (1690): natural rights to life, liberty, property; right of revolution. Tabula rasa.","person":true},{"id":"u3c14","front":"Tabula rasa","back":"Locke's idea that the mind is a blank slate at birth, shaped by experience.","person":false},{"id":"u3c15","front":"Hugo Grotius","back":"Dutch jurist; natural law applies to nations; father of international law.","person":true}],"hours":1.28,"quizIds":["u3q1","u3q2","u3q14","u3q15","u3q17","u3q18","u3q19","u3q22","u3q24","u3q26"]},{"id":4,"title":"Period of Enlightenment","short":"The Enlightenment","range":"1715–1789","weight":{"min":7,"max":9,"verified":true},"subtopics":["Enlightenment thought","Enlightened despotism","Partitions of Poland"],"lesson":"<h3>The big picture<\/h3>\n<p>The <strong>Enlightenment<\/strong> was an eighteenth-century movement that applied the methods of the Scientific Revolution to human society. If Newton could find the natural laws of the universe, the thinkers of the Enlightenment asked, why not find the natural laws of government, economics, religion and justice? Their tools were <strong>reason, skepticism of tradition, and confidence in progress<\/strong>. Their targets were the Catholic Church's power, censorship, torture, arbitrary rule and inherited privilege. The exam loves to match each thinker to a book and an idea, so learn the \"who said what\" list in the Must-know box.<\/p>\n<h3>The philosophes and the spread of ideas<\/h3>\n<p>The French called these writers <strong>philosophes<\/strong>: not academic philosophers but public intellectuals who wrote clearly for educated readers. Their ideas spread through new channels of the <strong>public sphere<\/strong>: books and newspapers, coffeehouses, reading clubs, Masonic lodges and the <strong>salons<\/strong>, gatherings hosted in Paris homes by educated women such as <strong>Madame Geoffrin<\/strong>, where nobles, writers and officials debated ideas. Censorship existed but was often evaded by printing in the Dutch Republic or Switzerland.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Newton shows nature runs on rational laws; Locke says people are shaped by environment<\/div><div class=\"chain-step\"><span class=\"chain-label\">Event<\/span>Philosophes apply reason to society and attack tradition, privilege and the Church<\/div><div class=\"chain-step\"><span class=\"chain-label\">Consequence<\/span>Reform programs: toleration, legal reform, limited or \"enlightened\" government, and eventually revolution<\/div><\/div>\n<p>The great collective project was the <strong><em>Encyclopedia<\/strong><\/em>, edited by <strong>Denis Diderot<\/strong> and Jean d'Alembert (published 1751–1772, 28 volumes). It gathered practical and scientific knowledge, from how to make pins to how to think about religion, and quietly criticized the Church and the state. The French government banned it more than once, but it was completed anyway.<\/p>\n<h3>The great thinkers<\/h3>\n<p><strong>Voltaire<\/strong> (François-Marie Arouet, 1694–1778) was the most famous philosophe. He admired England's tolerance and freedoms (<em>Letters on the English<\/em>, 1733), mocked religious fanaticism, and campaigned to clear the name of <strong>Jean Calas<\/strong>, a Protestant executed after a biased trial. His satire <strong><em>Candide<\/strong><\/em> (1759) ridiculed blind optimism. His battle cry against the intolerant Church was \"<strong>Écrasez l'infâme<\/strong>\" (\"Crush the infamous thing\"). He was a <strong>deist<\/strong>, like many philosophes: God created the universe and its laws, then let it run; there is no need for miracles, priests or revealed scripture.<\/p>\n<p><strong>Baron de Montesquieu<\/strong> wrote <strong><em>The Spirit of the Laws<\/em> (1748)<\/strong>. Studying governments around the world, he argued that liberty is safest when power is divided among <strong>legislative, executive and judicial branches<\/strong> that check one another: the <strong>separation of powers<\/strong>. He thought England's system came closest. The framers of the U.S. Constitution relied heavily on him. His earlier <em>Persian Letters<\/em> satirized French society through the eyes of fictional Persian visitors.<\/p>\n<p><strong>Jean-Jacques Rousseau<\/strong> was the Enlightenment's most radical and most unusual voice. In <strong><em>The Social Contract<\/em> (1762)<\/strong> he wrote, \"Man is born free, and everywhere he is in chains.\" Legitimate government, he argued, must express the <strong>general will<\/strong>, the collective will of the community for the common good, and individuals may be \"forced to be free\" by obeying it. That idea could support democracy (popular sovereignty) or justify majority tyranny. In <em>Emile<\/em> (1762) he argued that children should learn by nature and experience. Rousseau distrusted pure reason and praised emotion and nature, so he also anticipated <strong>Romanticism<\/strong> (Unit 7).<\/p>\n<p><strong>Adam Smith<\/strong>, a Scottish economist, wrote <strong><em>The Wealth of Nations<\/em> (1776)<\/strong>, the founding work of modern economics. He attacked mercantilism and argued for <strong>laissez-faire<\/strong> (\"let it be\") free markets: when individuals pursue their own interest, an \"<strong>invisible hand<\/strong>\" of competition promotes the general good. He praised the <strong>division of labor<\/strong>, showing how a pin factory multiplied output by splitting work into simple steps. The French <strong>physiocrats<\/strong> (such as François Quesnay) had argued earlier that land, not gold, is the source of wealth and that trade in grain should be free.<\/p>\n<p><strong>Cesare Beccaria<\/strong>, an Italian, wrote <strong><em>On Crimes and Punishments<\/em> (1764)<\/strong>, arguing against <strong>torture<\/strong> and the <strong>death penalty<\/strong> and for punishments that are swift, certain and proportional to the crime. Many states reformed their laws because of him.<\/p>\n<p><strong>Mary Wollstonecraft<\/strong> wrote <strong><em>A Vindication of the Rights of Woman<\/em> (1792)<\/strong>, arguing that women appear inferior only because they are denied education, and that reason belongs to both sexes. Most male philosophes, including Rousseau, assumed women belonged in the home.<\/p>\n<p><strong>David Hume<\/strong>, a Scottish philosopher, pushed skepticism further, questioning cause and effect and arguing that reports of miracles are never believable. <strong>Immanuel Kant<\/strong> of Prussia summed up the age in his 1784 essay \"What Is Enlightenment?\": \"<strong>Dare to know!<\/strong>\" (<em>Sapere aude<\/em>), that is, have the courage to use your own reason.<\/p>\n<h3>Enlightened despotism<\/h3>\n<p>Some monarchs, called <strong>enlightened despots<\/strong> (or enlightened absolutists), borrowed Enlightenment ideas to make their states stronger and more efficient, without giving up any power.<\/p>\n<div class=\"chain\" role=\"group\" aria-label=\"Cause, event, consequence\"><div class=\"chain-step\"><span class=\"chain-label\">Cause<\/span>Monarchs want stronger, richer states after costly wars<\/div><div class=\"chai
